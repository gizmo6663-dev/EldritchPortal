<title>Eldritch Portal Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* ------------------------------------------------------------------
   Eldritch Portal — Keeper-konsoll for nettleser.

   Bevisst mørkt tema. Dette er et verktøy som står oppslått ved siden
   av spillbordet i et dempet rom, og det skal se ut som den samme
   appen på telefonen. Alle farger settes eksplisitt, slik at siden
   holder seg uansett hvilket tema nettleseren rundt kjører.
   ------------------------------------------------------------------ */
:root {
  color-scheme: dark;

  --ink:        #0E0709;   /* skrogsvart, med et rødt anslag */
  --ink-2:      #170D11;   /* panel */
  --ink-3:      #23141A;   /* hevet flate */
  --ink-4:      #321D24;   /* kant / hover */

  --brass:      #E0B451;   /* antikk messing — eneste aksent */
  --brass-dim:  #96773A;
  --brass-glow: rgba(224, 180, 81, 0.14);

  --parchment:  #EDE3D2;   /* brødtekst */
  --muted:      #A08880;   /* dempet, dreid mot burgunder */
  --faint:      #6E5A58;

  --verdigris:  #5A9C7E;   /* irret kobber — «gjort» */
  --signal:     #C6504A;   /* skiltrødt — skurkens trekk */
  --tide:       #6E8BA8;   /* sjøblått — reise og vær */

  --rule:       rgba(224, 180, 81, 0.20);
  --rule-soft:  rgba(237, 227, 210, 0.10);

  --display: "Limelight", "Josefin Sans", Georgia, serif;
  --ui:      "Josefin Sans", "Segoe UI", system-ui, sans-serif;
  --body:    "Spectral", Georgia, "Times New Roman", serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --rail: 216px;
  --gutter: clamp(16px, 3vw, 32px);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

/* Svak vignett så flaten ikke er helt død. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(224,180,81,0.07), transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(198,80,74,0.06), transparent 60%);
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: var(--brass); }

:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 2px;
  border-radius: 3px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============================ SKALL ============================= */

.shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "rail main";
}

.masthead {
  grid-area: head;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px var(--gutter);
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(180deg, var(--ink-2), var(--ink));
}

.wordmark {
  font-family: var(--display);
  font-size: 20px;
  letter-spacing: 0.06em;
  color: var(--brass);
  line-height: 1;
  white-space: nowrap;
}
.wordmark span { display: block; font-size: 9px; letter-spacing: 0.34em;
  color: var(--faint); font-family: var(--ui); margin-top: 5px; }

.masthead-title {
  flex: 1 1 200px;
  min-width: 0;
}
.masthead-title b {
  display: block;
  font-family: var(--ui);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--parchment);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.masthead-title small {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.masthead-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chip {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  color: var(--muted);
  white-space: nowrap;
}
.chip.live { color: var(--verdigris); border-color: rgba(90,156,126,0.4); }
.chip.local { color: var(--muted); }

/* ------------------------------ nav ---------------------------- */

.rail {
  grid-area: rail;
  border-right: 1px solid var(--rule);
  padding: 16px 10px 40px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: sticky;
  top: 0;
  align-self: start;
  max-height: 100vh;
  overflow-y: auto;
}

.rail-group {
  font-family: var(--ui);
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 16px 10px 6px;
}
.rail-group:first-child { padding-top: 4px; }

.navlink {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 5px;
  font-family: var(--ui);
  font-size: 14px;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-align: left;
  border-left: 2px solid transparent;
  transition: background 0.14s, color 0.14s;
}
.navlink:hover { background: var(--ink-2); color: var(--parchment); }
.navlink[aria-current="page"] {
  background: var(--ink-3);
  color: var(--brass);
  border-left-color: var(--brass);
}
.navlink .count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.navlink[aria-current="page"] .count { color: var(--brass-dim); }

/* ----------------------------- main ---------------------------- */

.main {
  grid-area: main;
  padding: var(--gutter);
  padding-block: 24px 72px;
  min-width: 0;
}
.view { max-width: 72ch; margin-inline: auto; }
.view.wide { max-width: 1080px; }

/* Fargeprøve i tidslinjens tegnforklaring. */
.swatch {
  display: inline-block; width: 9px; height: 9px;
  border-radius: 2px; margin-right: 6px;
  vertical-align: baseline;
}

h1 {
  font-family: var(--ui);
  font-weight: 700;
  font-size: clamp(24px, 4vw, 32px);
  letter-spacing: 0.01em;
  margin: 0 0 4px;
  text-wrap: balance;
  color: var(--parchment);
}
h2 {
  font-family: var(--ui);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: 0.02em;
  margin: 32px 0 10px;
  color: var(--brass);
  text-wrap: balance;
}
.view > h2:first-of-type { margin-top: 22px; }
.lede { color: var(--muted); margin: 0 0 20px; font-size: 15px; }

.eyebrow {
  font-family: var(--ui);
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--faint);
  margin: 0 0 6px;
}

/* --------------------------- kontroller ------------------------ */

.btn {
  font-family: var(--ui);
  font-size: 13px;
  letter-spacing: 0.03em;
  padding: 8px 14px;
  border-radius: 5px;
  border: 1px solid var(--rule);
  background: var(--ink-2);
  color: var(--parchment);
  transition: background 0.14s, border-color 0.14s;
}
.btn:hover { background: var(--ink-3); border-color: var(--brass-dim); }
.btn.primary {
  background: var(--brass-glow);
  border-color: var(--brass-dim);
  color: var(--brass);
  font-weight: 600;
}
.btn.primary:hover { background: rgba(224,180,81,0.22); }
.btn.danger { color: var(--signal); border-color: rgba(198,80,74,0.35); }
.btn.danger:hover { background: rgba(198,80,74,0.12); }
.btn.small { font-size: 11px; padding: 5px 10px; }
.btn[aria-pressed="true"] {
  background: var(--brass-glow); border-color: var(--brass-dim); color: var(--brass);
}

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }

.field {
  width: 100%;
  padding: 9px 12px;
  border-radius: 5px;
  border: 1px solid var(--rule-soft);
  background: var(--ink-2);
  color: var(--parchment);
  font-family: var(--body);
}
.field:focus { border-color: var(--brass-dim); outline: none; }
.field::placeholder { color: var(--faint); }
textarea.field { resize: vertical; line-height: 1.6; }

/* ---------------------------- meter ---------------------------- */

.meter { display: grid; gap: 5px; margin-bottom: 14px; }
.meter-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--ui); font-size: 13px; letter-spacing: 0.02em;
}
.meter-head b { font-weight: 400; color: var(--parchment); }
.meter-head span {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meter-track {
  height: 6px; border-radius: 3px; background: var(--ink-3); overflow: hidden;
}
.meter-fill {
  height: 100%; background: var(--brass); border-radius: 3px;
  transition: width 0.3s ease;
}
.meter-fill.full { background: var(--verdigris); }

/* ---------------------------- paneler -------------------------- */

.panel {
  border: 1px solid var(--rule-soft);
  border-radius: 8px;
  background: var(--ink-2);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.panel.accent { border-color: var(--rule); background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); }
.panel h3 {
  font-family: var(--ui); font-weight: 600; font-size: 15px;
  margin: 0 0 6px; color: var(--parchment); letter-spacing: 0.02em;
}
.panel p { margin: 0 0 10px; }
.panel p:last-child { margin-bottom: 0; }

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}

/* --------------------------- listerader ------------------------ */

.stack { display: flex; flex-direction: column; gap: 6px; }

.entry {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 12px;
  width: 100%;
  padding: 11px 14px;
  border-radius: 6px;
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule-soft);
  background: var(--ink-2);
  text-align: left;
  transition: background 0.14s, border-color 0.14s;
}
.entry:hover { background: var(--ink-3); }
.entry.done { opacity: 0.5; }
.entry.done .entry-title { text-decoration: line-through; text-decoration-color: var(--faint); }

/* Stripa til venstre koder hva slags hendelse det er — ikke pynt. */
.entry[data-tag="villain"] { border-left-color: var(--signal); }
.entry[data-tag="climax"]  { border-left-color: var(--signal); }
.entry[data-tag="event"]   { border-left-color: var(--brass-dim); }
.entry[data-tag="voyage"]  { border-left-color: var(--tide); }
.entry[data-tag="social"]  { border-left-color: var(--rule-soft); }

.tick {
  width: 20px; height: 20px; margin-top: 3px;
  border-radius: 4px;
  border: 1px solid var(--brass-dim);
  background: transparent;
  display: grid; place-items: center;
  font-size: 12px; color: var(--ink);
  flex: none;
}
.tick[aria-pressed="true"] { background: var(--verdigris); border-color: var(--verdigris); }
.tick[aria-pressed="true"]::after { content: "✓"; font-weight: 700; }

.entry-body { min-width: 0; }
.entry-title {
  font-family: var(--ui); font-weight: 600; font-size: 15px;
  letter-spacing: 0.01em; color: var(--parchment); display: block;
}
.entry-sub {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  display: block; margin-top: 2px;
}
.entry-note {
  display: block; margin-top: 6px; padding-left: 9px;
  border-left: 2px solid var(--brass-dim);
  font-size: 13px; color: var(--muted); font-style: italic;
}
.entry-open {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  color: var(--faint); padding: 4px 6px; border-radius: 4px; flex: none;
}
.entry:hover .entry-open { color: var(--brass); }

/* ---------------------------- dagbolk -------------------------- */

.day {
  margin-bottom: 22px;
}
.day-head {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 6px; margin-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
.day-head h3 {
  margin: 0; font-family: var(--ui); font-weight: 700; font-size: 15px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass);
}
.day-head span {
  margin-left: auto; font-family: var(--mono); font-size: 11px;
  color: var(--faint); font-variant-numeric: tabular-nums;
}

/* --------------------------- statblokk ------------------------- */

.statgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
  gap: 5px;
  margin: 10px 0 14px;
}
.stat {
  border: 1px solid var(--rule-soft);
  border-radius: 4px;
  padding: 5px 7px;
  background: var(--ink);
}
.stat dt {
  font-family: var(--ui); font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--faint);
}
.stat dd {
  margin: 1px 0 0; font-family: var(--mono); font-size: 14px;
  color: var(--parchment); font-variant-numeric: tabular-nums;
}

.section-label {
  font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--brass-dim);
  margin: 18px 0 6px; padding-bottom: 3px;
  border-bottom: 1px solid var(--rule-soft);
}

.bullets { margin: 0; padding-left: 18px; }
.bullets li { margin-bottom: 4px; }

.quote {
  margin: 0 0 6px; padding-left: 11px;
  border-left: 2px solid var(--brass-dim);
  font-style: italic; color: var(--brass);
}

.prose { white-space: pre-wrap; }
.prose.tight { font-size: 15px; }

.caveat {
  font-size: 12px; color: var(--faint); font-style: italic;
  margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--rule-soft);
}

/* ---------------------------- modal ---------------------------- */

.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6, 3, 4, 0.82);
  display: grid; place-items: center;
  padding: var(--gutter);
}
.scrim[hidden] { display: none !important; }

.modal {
  width: min(760px, 100%);
  max-height: min(88vh, 900px);
  display: flex; flex-direction: column;
  background: var(--ink-2);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--rule-soft);
  background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
}
.modal-head h2 {
  margin: 0; font-size: 19px; color: var(--brass);
  font-family: var(--ui); font-weight: 700; flex: 1;
}
.modal-head .modal-sub {
  display: block; margin-top: 3px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-weight: 400; letter-spacing: 0;
}
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 12px 18px; border-top: 1px solid var(--rule-soft);
  background: var(--ink);
}

.callout {
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--brass-glow);
  padding: 10px 12px;
  margin-bottom: 14px;
}
.callout .eyebrow { color: var(--brass-dim); margin-bottom: 2px; }
.callout p { margin: 0; font-size: 14px; }

.readaloud {
  border-left: 3px solid var(--brass);
  background: var(--ink);
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  white-space: pre-wrap;
  margin-bottom: 14px;
  border-radius: 0 4px 4px 0;
}

/* ---------------------------- terning -------------------------- */

.dice { display: flex; align-items: center; gap: 6px; }
.dice input {
  width: 58px; text-align: center;
  font-family: var(--mono); font-size: 13px;
  padding: 6px 4px; border-radius: 5px;
  border: 1px solid var(--rule-soft); background: var(--ink-2);
  color: var(--parchment);
}
.dice-out {
  font-family: var(--mono); font-size: 12px; min-width: 128px;
  letter-spacing: 0.02em;
}
.dice-out b { font-size: 15px; }
.res-crit    { color: var(--brass); }
.res-extreme { color: var(--verdigris); }
.res-hard    { color: var(--verdigris); }
.res-reg     { color: var(--parchment); }
.res-fail    { color: var(--muted); }
.res-fumble  { color: var(--signal); }

/* --------------------------- diverse --------------------------- */

.empty {
  border: 1px dashed var(--rule);
  border-radius: 8px;
  padding: 28px;
  text-align: center;
  color: var(--muted);
}
.empty h3 { font-family: var(--ui); color: var(--parchment); margin: 0 0 6px; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 90;
  background: var(--ink-3); border: 1px solid var(--brass-dim);
  color: var(--brass); border-radius: 999px;
  padding: 9px 20px; font-family: var(--ui); font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  animation: rise 0.2s ease;
}
.toast[hidden] { display: none !important; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

.savestate {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  min-height: 16px; margin-bottom: 6px;
}
.savestate.saved { color: var(--verdigris); }

.libcard {
  border: 1px solid var(--rule-soft); border-radius: 8px;
  background: var(--ink-2); padding: 14px 16px;
}
.libcard.active { border-color: var(--brass-dim); background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); }
.libcard h3 { margin: 0 0 2px; font-family: var(--ui); font-size: 16px; color: var(--parchment); }
.libcard .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.libcard .saved-bits { font-size: 13px; color: var(--verdigris); margin: 6px 0 10px; }
.libcard .saved-bits.none { color: var(--faint); }

.tablewrap { overflow-x: auto; }
table.skills { border-collapse: collapse; width: 100%; font-size: 13px; }
table.skills td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule-soft); }
table.skills td:last-child { font-family: var(--mono); text-align: right; color: var(--brass); }

/* ----------------------- smale skjermer ------------------------ */

@media (max-width: 860px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "rail" "main";
  }
  .rail {
    position: sticky; top: 0; z-index: 20;
    flex-direction: row;
    max-height: none;
    overflow-x: auto;
    overflow-y: hidden;
    border-right: none;
    border-bottom: 1px solid var(--rule);
    background: var(--ink);
    padding: 8px var(--gutter);
    gap: 4px;
  }
  .rail-group { display: none; }
  .navlink {
    width: auto; white-space: nowrap; border-left: none;
    border-bottom: 2px solid transparent; border-radius: 5px 5px 0 0;
    padding: 6px 11px; font-size: 13px;
  }
  .navlink[aria-current="page"] { border-left: none; border-bottom-color: var(--brass); }
  .navlink .count { margin-left: 6px; }
  .main { padding-block: 18px 64px; }
  .masthead { gap: 10px; padding: 12px var(--gutter); }
  .wordmark { font-size: 17px; }
}
</style>

<div class="shell">
  <header class="masthead">
    <div class="wordmark">Eldritch Portal<span>Keeper</span></div>
    <div class="masthead-title">
      <b id="mast-title">Laster…</b>
      <small id="mast-sub"></small>
    </div>
    <div class="masthead-tools">
      <div class="dice">
        <input id="dice-target" type="number" min="1" max="99" value="50"
               aria-label="Ferdighetsverdi å slå mot">
        <button class="btn small" id="dice-roll" type="button">Slå d100</button>
        <span class="dice-out" id="dice-out" aria-live="polite">—</span>
      </div>
      <span class="chip" id="sync-chip">…</span>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Seksjoner"></nav>

  <main class="main" id="main"><div class="view"></div></main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">—<span class="modal-sub" id="modal-sub"></span></h2>
      <button class="btn small" id="modal-close" type="button">Lukk</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<script type="application/json" id="bundled-scenarios">[{"id":"slow-boat-to-china","version":2,"title":"A Slow Boat to China","system":"Pulp Cthulhu / Call of Cthulhu 7e","source":"Pulp Cthulhu, kapittel 13 (Chaosium)","author_note":"Lagt inn for spilling i Eldritch Portal, på norsk. Spillmekaniske begreper står på engelsk. Karakteristikker for menneskelige NPCer som ikke er trykt i selve scenarioteksten, er merket som spillklare forslag — bytt dem ut med verdiene fra Appendix A hvis du har boka.","tagline":"En luksusliner, elleve døgn på havet, og noe nede i lasterommet som holder på å lære seg å spille.","player_pitch":"Desember 1931. SS President Coolidge seiler fra San Francisco mot Shanghai med 678 passasjerer, 315 mann besetning og femten døgn foran seg. Det er jazz i Grand Salon, leirdueskyting over akterenden og syvretters middag hver kveld. Den andre morgenen blir en millionærs tomme klær funnet sammenlagt i en stol, som om mannen inni bare hadde smeltet bort.","keeper_summary":"En crawling one — det som er igjen av trollmannen Luis Fernando de la Montoyo, nå en sverm av levende utøy — frakter Pipes of Leng, et mekanisk orgel bygd for å tilkalle og fange vesener fra Mythos, ut til en prøvekjøring midt i Stillehavet. Den reiser som den tilbaketrukne spanske adelsmannen Señor Diego Guiterrez de Almacan, dreper og tar ansiktet til alle som er i veien, og trenger blodet av fem ofre for å lade opp maskinen. Den 19. desember spiller den på orgelet. Innretningen virker akkurat feil: den gjør det den tilkaller rasende. En flying polyp stiger opp fra havbunnen for å knuse maskinen — og skipet med den.","run_time":"3–5 økter","player_count":"3–6 helter","setting":"SS President Coolidge, San Francisco til Shanghai, 5.–20. desember 1931","notes":"","sessions":[],"keeper_brief":[{"title":"Hele plottet i ett avsnitt","body":"En crawling one har bygd en maskin som tilkaller vesener fra Mythos. Den prøvekjører maskinen om bord på en passasjerliner midt i Stillehavet. Den trenger fem blodofre for å lade den opp, og den tar ansiktet til dem den dreper. Heltene er passasjerer. Når maskinen omsider spiller, tilkaller den noe som river skipet i stykker."},{"title":"Hvordan heltene havner i det","body":"De er ganske enkelt om bord — på rekonvalesensreise til Shanghai, eller invitert til åpningen av «Le Monde Mystérieux de l'Indo-Chine» ved Institut Orientale i den franske konsesjonen. Utstillingen skal etter sigende inneholde sjeldne okkulte skriftruller og en svart paddefigur som kalles Çahoqua.\n\nLager dere nye karakterer, bør alle booke samme klasse. La aldri en spiller være med i mannskapet."},{"title":"Tempo — det som oftest går galt","body":"Femten døgn er mange døgn. Spillerne kommer til å ville bruke hver eneste time av hvert eneste av dem. Press tempoet: si rett ut at du spoler fram til det som betyr noe, og kast en scene mot dem hver gang etterforskningen stopper opp. La dem utforske og sladre, men hold dagene i bevegelse."},{"title":"Katt og mus","body":"Å finne skapningen skal være en jakt, ikke en avsløring. Den kan være hvilken som helst av fem skikkelser, den kan bytte mellom dem i løpet av én kamprunde, og blir den trengt opp i et hjørne faller den fra hverandre til en haug insekter som renner ned mellom gulvplankene. La den aldri bli tatt tidlig — la den bli *nesten* tatt ofte."},{"title":"Skru pulp-nivået opp eller ned","body":"Som skrevet: et mordmysterium om bord på et skip, med et monster på slutten. Skrudd opp: zombier som kommer opp fra underdekkene, gale tcho-tcho, en hunting horror i korridorene og krigsskipskanoner kalt inn mot polyppen. Begge deler er dekket — se de valgfrie oppslagene under Regler."},{"title":"Hvor det ender","body":"Coolidge går nesten helt sikkert ned. Overlevende plukkes opp i løpet av noen timer, og avisene skriver om en monsterbølge. Får skapningen fullført sin Gate til Shanghai, slutter den seg til Eight Fortunes Mutual Aid Society og blir en skurk som kommer tilbake med et regnskap å gjøre opp."}],"timeline":[{"id":"tl-depart-san-francisco","day":"Lør. 5. des","when":"kl. 11.00","title":"Avgang fra San Francisco","description":"Coolidge legger ut fra Pier 42 i tåke og tåkelurer, og passerer Alcatraz på vei ut. Ombordstigningen skjer klassevis: første klasse og spesialklasse forut, tatt imot av førstestyrmann Schramm; tredje klasse midtskips; mellomdekket akterut, for egen maskin. Heltene støter på en full Chad Peterson og forloveden hans, Virginia Ridley, på landgangen.","triggered":false,"connects_to":["beat-up-the-gangway"],"tag":"voyage"},{"id":"tl-peterson-is-consumed","day":"Lør. 5. des","when":"kveld","title":"Peterson blir fortært","description":"Skapningen kommer om bord i utøyform, skjult inne i energiinnretningen i lasterom 7, tar et ubebodd lugarrom som Señor Almacan, og blir konfrontert av overproviantforvalter Martin Dungass — som blir drept og fortært. Den innser at den ikke kan myrde hele mannskapet, og finner og fortærer i stedet Chad Peterson.\n\nVirginia spiste middag med den ekte Peterson rundt kl. 19.00. Skikkelsen hun ser i korridoren kl. 21.30 er allerede skapningen.","triggered":false,"connects_to":["npc-crawling-one","beat-cabin-mates"],"tag":"villain"},{"id":"tl-the-empty-suit-is-found","day":"Søn. 6. des","when":"ca. kl. 09.45","title":"De tomme klærne blir funnet","description":"Albert Hallander dirker opp Petersons lugar for å rane den, og finner en masse kakerlakker. Minutter senere åpner Virginia Ridley den ulåste døra og skriker. Klærne ligger sammensunket i en stol, tredd inn i hverandre som en russisk dukke.","triggered":false,"connects_to":["beat-the-empty-suit","handout-suicide-note"],"tag":"event"},{"id":"tl-anyone-seen-the-purser?","day":"Søn. 6. des","when":"utover dagen","title":"Har noen sett forvalteren?","description":"Praten går blant mannskapet: overproviantforvalter Martin Dungass har ikke vært sett siden han gikk sin runde i går kveld.","triggered":false,"connects_to":["beat-anyone-seen-the-purser"],"tag":"event"},{"id":"tl-sunday-mass-and-st.-nicholas-night","day":"Søn. 6. des","when":"morgen og kveld","title":"Søndagsmesse og nissefest","description":"Pater Alvarez holder messe i skipskapellet. Nissefest for alle barn på første klasse, spesialklasse og tredje klasse i ballsalen.","triggered":false,"connects_to":["npc-father-alvarez"],"tag":"social"},{"id":"tl-the-tome-of-red-jade-is-stolen","day":"Man. 7. des","when":"etter midnatt","title":"Tome of Red Jade blir stjålet","description":"Skapningen har overhørt dr. Soong og Wang Ma, tar tilbake Petersons skikkelse, stjeler en mannskapsuniform og henter boka fra Soongs lugar mens doktoren går tur på dekk. Wang Ma blir drept. Tyven hopper fra båtdekket ned på promenadedekket og er borte.","triggered":false,"connects_to":["beat-the-stolen-book","handout-book-of-red-jade"],"tag":"villain"},{"id":"tl-bunny-bates-is-dominated","day":"Man. 7. des","when":"dagtid","title":"Bunny Bates blir dominert","description":"Skapningen kaster Dominate på gangsteren Stuart «Bunny» Bates og begynner å bruke ham som sine hender. Formelen må kastes på nytt hver natt, med en opposed POW roll.","triggered":false,"connects_to":["npc-bunny-bates"],"tag":"villain"},{"id":"tl-casino-night","day":"Man. 7. des","when":"kveld","title":"Kasinokveld","description":"Kasinokveld for første klasse og spesialklasse. Fire innleide kortgivere, blant dem brødrene Po fra tredje klasse, som kjører Pai Gow.","triggered":false,"tag":"social"},{"id":"tl-peterson-memorial-service","day":"Tir. 8. des","when":"kl. 11.00","title":"Minnestund for Peterson","description":"Pater Alvarez holder en minnestund i skipskapellet. Charles Astor tramper rundt og krever at noen gjør noe. Noen av damene på første klasse tar Virginia under vingene, i knapt behersket panikk.","triggered":false,"connects_to":["beat-passenger-reactions"],"tag":"social"},{"id":"tl-wang-ma-is-buried-at-sea","day":"Tir. 8. des","when":"kl. 15.00","title":"Wang Ma begraves på havet","description":"En kort seremoni ved akterenden. Lo Mai trer inn i Wang Mas plass ved dr. Soongs side.","triggered":false,"connects_to":["npc-wang-ma"],"tag":"event"},{"id":"tl-virginia-shoots-skeet","day":"Ons. 9. des","when":"dagtid","title":"Virginia skyter leirduer","description":"Virginia Ridley skyter leirduer ut over akterdekket for å få ut nervene. Til slutt ber stuertene henne slutte — skuddene forstyrrer de andre passasjerene.","triggered":false,"connects_to":["npc-virginia-ridley"],"tag":"social"},{"id":"tl-tahitian-ball","day":"Ons. 9. des","when":"kveld","title":"Tahiti-ball","description":"Tahiti-ball for passasjerer på første klasse og spesialklasse.","triggered":false,"tag":"social"},{"id":"tl-phyllis-barnes-performs","day":"Tor. 10. des","when":"dagtid","title":"Phyllis Barnes opptrer","description":"Phyllis Barnes holder konsert i musikkrommet på B-dekk.","triggered":false,"connects_to":["npc-phyllis-barnes"],"tag":"social"},{"id":"tl-arrive-honolulu---quarantine","day":"Tor. 10. des","when":"tidlig morgen","title":"Ankomst Honolulu — i karantene","description":"Skipet holdes i karantene. Ingen går i land, ingen lektere legger til. Politiet fra Honolulu kommer om bord for å etterforske Petersons antatte selvmord og forvalterens forsvinning, avhører Soong, Aimesworthy og Ridley, gjennomsøker mellomdekket, og drar etter to timer.","triggered":false,"connects_to":["beat-honolulu-and-beyond"],"tag":"event"},{"id":"tl-sacrifice-1:-takishi-suroda","day":"Tor. 10. des","when":"etter middag","title":"OFFER 1: Takishi Suroda","description":"Bates finner Suroda vandrende etter middagen, overmanner ham og tar ham med til lasterom 7. Tappet, og deretter kastet ut gjennom en koøye. En helt som deler lugar med ham, finner senga urørt.","triggered":false,"connects_to":["beat-missing-people","npc-takishi-suroda"],"tag":"villain"},{"id":"tl-suicide-ruling---depart-honolulu","day":"Fre. 11. des","when":"dagtid","title":"Selvmordskjennelsen — avgang Honolulu","description":"Etterforsker William Ranta slår fast at avskjedsbrevet er ekte og at Peterson hoppet. De tomme klærne er «en tilfeldighet». Dungass blir ført opp som en drukningsulykke. Wang Mas drapsmann skal ha rømt i land. Helter som insisterer på at de har sett Peterson etter dødsfallet, blir raskt avfeid.\n\nEtter Honolulu tilbyr Charles Astor 1 000 dollar kontant for opplysninger som fører fram.","triggered":false,"connects_to":["beat-honolulu-and-beyond","npc-charles-astor"],"tag":"event"},{"id":"tl-cross-the-international-date-line","day":"Lør. 12. des","when":"—","title":"Datolinjen passeres","description":"Et døgn vinnes. Alle datoer i scenarioet holdes til amerikansk tid, for å slippe forvirring.","triggered":false,"tag":"voyage"},{"id":"tl-sacrifice-2:-miles-hardaway","day":"Lør. 12. des","when":"natt","title":"OFFER 2: Miles Hardaway","description":"Journalisten fra Chronicle lokkes til Señor Almacans lugar. Bates slår ham ned bakfra. Tappet, og deretter ut gjennom en koøye.","triggered":false,"connects_to":["beat-missing-people","npc-miles-hardaway"],"tag":"villain"},{"id":"tl-sunday-mass","day":"Søn. 13. des","when":"morgen","title":"Søndagsmesse","description":"Pater Alvarez holder messe i kapellet.","triggered":false,"connects_to":["npc-father-alvarez"],"tag":"social"},{"id":"tl-sacrifices-3-&-4:-barnes-and-a-crewman","day":"Søn. 13. des","when":"natt","title":"OFFER 3 OG 4: Barnes og en matros","description":"Phyllis Barnes hører orgelet gjennom ventilasjonssjaktene og går for å undersøke. Hun finner fram til lastelukene — og kommer rett inn i at Bates slår ned en matros på runde. Matrosen går over bord. Barnes lar seg ikke dumpe usett, så kroppen hennes havner i en ballasttank i lasterom 4. Den blir funnet om lag en uke senere, på lukta.","triggered":false,"connects_to":["beat-missing-people","loc-hold-4","npc-phyllis-barnes"],"tag":"villain"},{"id":"tl-rumours-of-strange-music","day":"Søn. 13. des","when":"natt og utover","title":"Rykter om underlig musikk","description":"Passasjerene begynner å snakke om musikk som høres midt på natta. Ingen to forklaringer stemmer overens — «en hjemsøkt opera», «en dødsmesse fra helvete».","triggered":false,"connects_to":["beat-distant-music"],"tag":"event"},{"id":"tl-the-music-is-heard-clearly","day":"Man. 14. des","when":"natt","title":"Musikken høres tydelig","description":"Nå høres musikken over hele skipet. En Listen roll om natta fanger den opp; Hard Listen plasserer den under dekk. Musikkrommet står tomt.","triggered":false,"connects_to":["beat-distant-music"],"tag":"event"},{"id":"tl-sacrifice-5:-keeper's-choice","day":"Tir. 15. – ons. 16. des","when":"natt","title":"OFFER 5: Keeperens valg","description":"Ett dødsfall til lader orgelet helt opp. Hvem det er, avgjør du. En navnløs passasjer fungerer, men noen heltene har blitt kjent med fungerer langt bedre: dr. Soong, Virginia Ridley, pater Alvarez. En av heltene er et fullt legitimt mål.","triggered":false,"connects_to":["beat-missing-people"],"tag":"villain"},{"id":"tl-bunny-bates-confesses","day":"Tor. 17. des","when":"—","title":"Bunny Bates skrifter","description":"Bates bryter kort ut av domineringen og oppsøker pater Alvarez — eller en helt, hvis noen av dem er prest — for å skrifte. Han tilstår boktyveriet og drapet på Wang Ma, og alt annet han kommer på. Han snakker om stemmer som fikk ham til det. Historiene henger ikke sammen. I løpet av en time knekker han, og skapningen tar ham for godt.","triggered":false,"connects_to":["npc-bunny-bates","npc-father-alvarez"],"tag":"event"},{"id":"tl-foul-weather","day":"Fre. 18. des","when":"hele dagen","title":"Uvær","description":"CON roll eller sjøsyke.","triggered":false,"tag":"voyage"},{"id":"tl-heavy-seas","day":"Lør. 19. des","when":"morgen","title":"Grov sjø","description":"Høye bølger og regn hele formiddagen — CON roll eller sjøsyke. Klarner opp utover ettermiddagen.","triggered":false,"tag":"voyage"},{"id":"tl-climax:-bunny-takes-a-hostage","day":"Lør. 19. des","when":"kveld","title":"KLIMAKS: Bunny tar en gissel","description":"Bates går inn i spisesalen på første klasse og tar den første han ser som gissel, mens han skriker om stemmene. Han må tas med makt eller med kløkt (Extreme Persuade eller Fast Talk, eller Hard Psychoanalysis).","triggered":false,"connects_to":["beat-bunny-takes-a-hostage"],"tag":"climax"},{"id":"tl-climax:-the-final-test","day":"Lør. 19. des","when":"kveld","title":"KLIMAKS: Den store prøven","description":"Mens alle er opptatt med Bates, spiller skapningen på Pipes of Leng nede i lasterom 7. En malstrøm åpner seg i havet, og en flying polyp stiger opp for å ødelegge maskinen — og skipet rundt den.","triggered":false,"connects_to":["beat-the-final-test","npc-flying-polyp"],"tag":"climax"},{"id":"tl-due-in-shanghai","day":"Søn. 20. des","when":"kl. 06.00","title":"Beregnet ankomst Shanghai","description":"Den planlagte ankomsten, som Coolidge etter alt å dømme aldri rekker.","triggered":false,"connects_to":["beat-conclusion"],"tag":"voyage"}],"beats":[{"id":"beat-up-the-gangway","title":"Opp landgangen","act":"Akt 1 — Om bord","description":"Lørdag 5. desember, Pier 42.\n\nHeltene sjekker inn bagasjen og tas imot av en stuert fra Dollar Line og skipets offiserer. Ombordstigningen skjer klassevis: første klasse og spesialklasse forut, ønsket velkommen av førstestyrmann Hugo Schramm; tredje klasse midtskips, med matroser til å hjelpe; mellomdekket akterut, for egen maskin.\n\nMØT DEN DØDSDØMTE. Heltene bør støte borti Chad Peterson og Virginia Ridley på landgangen. Peterson er upåklagelig kledd og grundig full, krever champagne opp på rommet og hilser på alle han kolliderer med: «Chad Peterson fra New York, en fornøyelse å gjøre Deres bekjentskap.» Stuertene smisker for ham, men tar ham også bestemt i armen og loser ham til lugaren på første klasse på A-dekk. Virginia er irritert, men holder munn. Blir hun tiltalt, gir hun et anstrengt smil og unnskylder seg så fort hun kan: «Unnskyld meg. Jeg må gjøre meg klar til middag.»\n\nDr. Soong kommer om bord i mørk dress og bowlerhatt, med en liten doktorveske og tjeneren Wang Ma ved skulderen. Soong presenterer seg selv, men ikke Wang Ma. Snakker noen til Wang Ma, grynter han, og Soong forklarer at mannen er «litt tilbakeholden».\n\nPASSASJERER PÅ MELLOMDEKKET møter havnearbeiderne og Lo Mai, en av Soongs tcho-tcho-arbeidere, som overvåker lastingen av femti tønner merket «Hawaiian Botanical Specimens».\n\nDETTE LASTES OM BORD (alt sammen er synlig fra kaia):\n• Tre splitter nye Packard-sedaner fra 1931, en Hudson turvogn fra 1930, en Bugatti racer\n• Tjue melkekyr, et dusin Oliver-traktorer\n• Et dusin tønner fransk konjakk, et lastebillass med postsekker\n• En diger kasse: et komplett 50-pipers orgel fra «Wm. Wood Pipe Organ Co., Inc. of Portland, Oregon»\n• En to meter høy grønn metallkasse, levert med væpnet vakt\n• Hundrevis av kofferter, skipskister, gevær- og instrumentkasser — og en papegøye\n\nSPOT HIDDEN: legger i tillegg merke til en stor kasse merket «Funeral Supplies» — liket av en tcho-tcho som døde i San Francisco, og som sendes hjem til Burma på dr. Soongs regning.\n\nSkipet kaster loss like etter kl. 11.00 og passerer Alcatraz på vei ut.","done":false,"connects_to":["clue-organ-crate","clue-green-metal-box","clue-funeral-supplies","npc-chad-peterson"]},{"id":"beat-cabin-mates","title":"Lugarkamerater","act":"Akt 1 — Om bord","description":"Lørdag 5. desember. Gi heltene tid til å installere seg, og bruk lugarkameratene til å dele ut relasjoner gratis.\n\nMELLOMDEKKET, sovesalen: en familie på sju hawaiiske misjonærer (familien Castor), fire unge irer på kontrakt med Shanghai-politiet, tretten amerikanere som håper å bli rike i Kina, tre japanske bryggere på vei hjem til Tokyo, et knippe filippinske jazzmusikere som ikke slo an i San Francisco, tre barnepiker hvis arbeidsgivere reiser på første klasse, seks av dr. Soongs tcho-tcho-arbeidere under Lo Mai, og ti kinesiske jernbanearbeidere og kjøpmenn på hjemvei.\n\nTREDJE KLASSE: en åttekøys lugar delt med brødrene Po Liang og Po Hau, Pai Gow-givere innleid til kasinokvelden, og marinegast Olaf Gustavsen fra minesveiperen Abilene, på vei tilbake til Pearl Harbor fra permisjon.\n\nSPESIALKLASSE: mannlige helter deler trolig lugar med Takishi Suroda, kvinnelige med Phyllis Barnes.\n\nFØRSTE KLASSE på A-dekk: Señor Diego Guiterrez de Almacan bor én lugar unna. Virginia Ridley og Chad Peterson er nære naboer. På båtdekket er dr. Soong og Wang Ma naboene. Heltene kan dele heis med det unge paret på vei til middag, eller se dem stå hånd i hånd i baugen på promenadedekket.\n\nIngenting uvanlig skjer den første natta — ikke med heltene. Inne i lugaren sin blir Chad Peterson fortært.","done":false,"connects_to":["npc-almacan","npc-takishi-suroda","npc-phyllis-barnes"]},{"id":"beat-the-empty-suit","title":"Den tomme dressen","act":"Akt 2 — Mysteriet","description":"Søndag 6. desember, like etter kl. 09.45, korridoren på første klasse på A-dekk, akterover, nær barbersalongen og skredderen.\n\nLISTEN roll for morgenfugler: de hører oppstyret fra et av de øvre dekkene.\n\nVirginia Ridley, på vei til en sen frokost, går til Petersons rom, finner døra ulåst og skriker. Inne: en tom dress og en underlig, vond lukt. Sokker og sko på gulvet foran en stol; dress, vest, skjorte og undertrøye tredd inn i hverandre som en russisk dukke, som om kroppen inni bare hadde smeltet bort.\n\nHVEM SOM ER I KORRIDOREN. Bare Hallander og Ridley må være til stede:\n• Albert Hallander, matros, som dirket opp låsen noen minutter tidligere for å rane stedet, og fikk tusenvis av kakerlakker susende ut av stolen. Han skrek. Han er fortsatt rystet.\n• Virginia Ridley, fra seg.\n• Charles Astor, ubehagelig til stede.\n\nÅ KNEKKE HALLANDER. Han påstår at han hørte en lyd og kom inn gjennom en ulåst dør. Han lyver — det var ingen lyd, og døra var låst. Psychology ser at han er i sjokk; Intimidate eller Persuade får ham til å snakke; en ny Psychology avslører løgnene. Han vil heller rote til bildet og komme seg unna enn å innrømme tyveriforsøk, men en samlet innsats får ham til å tilstå — og bli arrestert av skipets offiserer.\n\nRyktene om at Peterson «hoppet» starter umiddelbart. Matros Hank Henson holder døra til skipslegen Hartman og førstestyrmann Schramm har sett åstedet.\n\nÅ GJENNOMSØKE LUGAREN. Mannskapet vil ha det stille og holder funnene for seg selv. Heltene kommer inn ved bestikkelse, bløff, status på første klasse, eller ved at Virginia lager bråk. Senere, når Henson er tilbake i vanlig tjeneste, kommer de inn med Locksmith eller Mechanical Repair. Ingenting ser malplassert ut bortsett fra klærne — og et avskjedsbrev på skrivebordet, som stuert Aimesworthy tar med seg som bevismateriale samme kveld.","done":false,"connects_to":["handout-suicide-note","clue-empty-clothes","clue-hallanders-lie","npc-albert-hallander"]},{"id":"beat-anyone-seen-the-purser","title":"Har noen sett forvalteren?","act":"Akt 2 — Mysteriet","description":"Søndag 6. desember, hvor som helst om bord.\n\nLISTEN roll for å overhøre mannskapet snakke om overproviantforvalter Martin Dungass, som ikke har vært sett siden i går kveld, da han gikk sin runde. Den samme samtalen går igjen hele dagen, til den alminnelige oppfatningen er at Dungass, som Peterson, er forsvunnet.\n\nSANNHETEN: Dungass la merke til en passasjer som ikke sto på listene, og gikk for å spørre om det. Han ble drept og fortært.\n\nPASSASJERLISTEN. En Hard Persuade roll gir en helt et blikk i passasjerlisten. Señor Guiterrez de Almacan står ikke oppført noe sted — ikke på første klasse, ikke noe sted. Dette er det hardeste faktumet i hele scenarioet, og det peker rett på skurken.\n\nMANNSKAPSSLADDER. Helter som blir venner med en i mannskapet, får høre konsensusen: Dungass har gått på flaska og sover den ut under dekk — det går rykter om trøbbel med kona. Han dukker nok opp, og da får han høre det av kapteinen.","done":false,"connects_to":["clue-manifest-gap","npc-martin-dungass"]},{"id":"beat-passenger-reactions","title":"Passasjerenes reaksjoner","act":"Akt 2 — Mysteriet","description":"Miles Hardaway i San Francisco Chronicle gjør et nummer av saken, framhever at det er et «lukket rom»-mysterium og telegraferer spekulasjoner i land som «et virkelig Sherlock Holmes-mysterium!». Skipsavisa Pacific Current nevner ingen av forsvinningene.\n\nNoen av damene på første klasse tar Virginia under vingene, i knapt behersket panikk. Charles Astor tramper rundt og krever at «noe må gjøres». I løpet av det neste døgnet kommer kondolansetelegrammer fra New York, Chicago, San Francisco og Los Angeles. Pater Alvarez arrangerer en minnestund.\n\nFørstestyrmann Schramm er rådvill, og har ordre om å holde forsvinningene stille.","done":false,"connects_to":["npc-miles-hardaway","npc-charles-astor"]},{"id":"beat-the-stolen-book","title":"Den stjålne boka","act":"Akt 2 — Mysteriet","description":"Mandag 7. desember, etter midnatt, båtdekket.\n\nI løpet av formiddagen den 7. overhører skapningen — som Almacan — dr. Soong og Wang Ma snakke om doktorens eksemplar av Tome of Red Jade, tatt fra en gjeng kultister i San Francisco. Skapningen tror det er nettopp det eksemplaret den en gang eide selv, og den vil ha det tilbake.\n\nEtter midnatt tar den tilbake Petersons skikkelse, stjeler en mannskapsuniform og går inn i Soongs lugar mens doktoren går tur på dekk. Wang Ma dør mens han forsvarer den.\n\nHVIS HELTENE ER I NÆRHETEN (særlig på båtdekket):\n• LISTEN: doktorens rop om hjelp, og løpende føtter.\n• De ser en stuert styrte ut gjennom en dør og løpe mot skipssida, mellom livbåtene, med en bok under armen.\n• Det er natt. Lite lys, mange mørke kroker.\n\nJAKTEN. Skapningen svinger seg over rekkverket på båtdekket, ned på promenadedekket, og løper videre uten å miste et skritt. Forfølgere må klare en Jump roll eller ta 1D6+3 av fallet ned på hardt tredekk.\n\nMINDBLAST. Den som er rett i veien, kan bli truffet: opposed POW roll mot POW 100. Vinner skapningen, ser målet den et øyeblikk som en hul, øyeløs skikkelse med mørk energi boblende inni — 5 Sanity points og et umiddelbart anfall av galskap. Vinner helten, skjer ingenting.\n\nDEN KOMMER ALLTID UNNA. Uansett hvordan jakten går, slipper den unna: trengt opp i et hjørne hopper den inn i en mørk krok og faller fra hverandre til en masse insekter som spreller vekk og er borte. Boka kan bli mistet i prosessen — det avgjør du.\n\nVALGFRI KOMPLIKASJON: la den dominerte Bunny Bates, i stjålet mannskapsuniform, dekke retretten fra et mørkt utkikkspunkt. Han har en .32-revolver, eller en Tommy gun hvis du vil legge ordentlig press på. Tas han levende her, sier han ikke et ord. Blir han drept eller satt i arresten, dominerer skapningen stuert Martin Aimesworthy i stedet — bytt ham inn i alle senere scener.","done":false,"connects_to":["handout-book-of-red-jade","npc-dr-soong","npc-wang-ma","npc-bunny-bates","clue-blood-on-the-crate"]},{"id":"beat-looking-for-bunny","title":"På jakt etter Bunny Bates","act":"Akt 2 — Mysteriet","description":"Bates holder seg i skjul i skapningens lugar eller nede i lasterommene. Om heltene finner ham, kommer an på hvor oppfinnsomme de er.\n\nTrengt opp i et hjørne slåss han desperat og stikker av ved første anledning. Tatt til fange bablar han om «stemmen inni» og hvordan «englekoret har befalt meg». Så lenge Dominate holder, er det ingenting nyttig å få ut av ham.\n\nÅ BRYTE DOMINERINGEN. Skapningen må kaste Dominate på nytt hver natt, med en opposed POW roll. Klarer heltene å styrke Bates' viljestyrke — en Hard Persuade eller Hard Psychoanalysis roll — gi ham en bonusterning til å stå imot.\n\nBRÅKETE HELTER. Gjør heltene livet surt, eller trenger handlingen et dytt, går Bates til bakholdsangrep: i døra til en helts lugar, eller ut av mørket nede i lasterommet. Særlig hvis de nærmer seg Almacans lugar eller snuser rundt lastelukene. Vil du gi dem virkelig hard medfart, tilkaller skapningen en hunting horror i stedet — men den timer et slikt angrep slik at færrest mulig ser det.","done":false,"connects_to":["npc-bunny-bates","npc-hunting-horror"]},{"id":"beat-honolulu-and-beyond","title":"Honolulu og videre","act":"Akt 2 — Mysteriet","description":"Torsdag 10. desember, tidlig.\n\nCoolidge ankommer Honolulu og blir umiddelbart holdt i karantene. Ingen går i land. Ingen lektere legger til. Et lag politifolk kommer om bord for å etterforske Petersons antatte selvmord, forvalterens forsvinning, og drapet på Wang Ma — hvis det i det hele tatt er meldt fra om det.\n\nDe avhører dr. Soong, Martin Aimesworthy og Virginia Ridley, gjennomsøker mellomdekket etter Wang Mas drapsmann, tar forklaringer om Suroda hvis noen har savnet ham, gjennomsøker lugaren hans, finner ingenting, og drar etter om lag to timer.\n\nETTERFORSKER WILLIAM RANTAS KONKLUSJONER (fredag den 11.):\n• Avskjedsbrevet er ekte. Peterson hoppet fra den lille balkongen i suiten sin. De tomme klærne er en tilfeldighet, og Ranta legger helst slike detaljer til side for å få saken lukket.\n• Peterson drakk for mye og led av «mørke tanker».\n• Dungass ble full og skylte over bord — ulykke.\n• Wang Mas drapsmann rømte i land i Honolulu.\n• Suroda rømte også i land, og kan ha noe med drapet på Wang Ma å gjøre. Ranta forsikrer alle om at han skal spore ham opp.\n\nHelter som forklarer at de har sett Peterson gå rundt siden han døde, blir raskt avfeid.\n\nETTER HONOLULU. Skipet drar videre den 11. Charles Astor, som ikke er overbevist, understøtter protestene sine med 1 000 dollar kontant for opplysninger som fører fram — en kraftig brekkstang hvis heltene trenger penger eller motivasjon.","done":false,"connects_to":["npc-charles-astor","npc-takishi-suroda"]},{"id":"beat-missing-people","title":"De som forsvinner","act":"Akt 3 — Mønsteret","description":"Skapningen må lade Pipes of Leng med fem ofre, og la blodet renne ned i orgelet. Hvem de er, spiller ingen rolle. Bates henter dem; de tas med til lasterom 7, drepes og tappes. Det finnes ingen vitner — men er heltene helt på bærtur, kan en søvndrukken passasjer melde at han har sett noe rart.\n\nDE FEM:\n1. Takishi Suroda, 10. des — tatt etter middagen, ut gjennom en koøye.\n2. Miles Hardaway, 12. des — lokket til Almacans lugar, slått ned bakfra, ut gjennom en koøye.\n3–4. Phyllis Barnes og en matros, 13. des — hun fulgte musikken til lastelukene og kom over Bates mens han slo ned en matros på runde. Matrosen går over bord; Barnes havner i en ballasttank i lasterom 4, og blir funnet om lag en uke senere, på lukta.\n5. 15. eller 16. des — ditt valg. En navnløs passasjer fungerer, men noen heltene kjenner fungerer langt bedre: dr. Soong, Virginia Ridley, pater Alvarez. En helt er et legitimt mål.\n\nHVORDAN HELTENE OPPDAGER DET:\n• De leter etter noen, og finner en tom lugar og ingen som har sett vedkommende på en stund.\n• Et gråtende barn forteller at musikktimen med frøken Barnes ble avlyst, og at læreren er sporløst borte.\n• En annen passasjer spør heltene om de har sett den og den i det siste.\n\nMANNSKAPETS RESPONS. Bringes det opp for de høyere offiserene, undersøker de saken og konkluderer med at vedkommende ganske sikkert er et annet sted om bord og dukker opp til middag. Det er opp til heltene.","done":false,"connects_to":["loc-hold-7","loc-hold-4","npc-bunny-bates"]},{"id":"beat-soong-requests-help","title":"Dr. Soong ber om hjelp","act":"Akt 3 — Mønsteret","description":"Trenger heltene motivasjon, og Soong ikke allerede har oppsøkt dem om boka, gjør han det like etter Honolulu — vanligvis ved å be om deres selskap i en av røykesalongene eller i biblioteket på første klasse.\n\nSoong er bekymret for at noe ondt er på ferde, noe mer enn et enkelt selvmord eller drap. Han tror de forsvunne, dødsfallene og den stjålne boka henger sammen, og han kan godt bringe den underlige musikken på bane selv.\n\nTILBUDET. Han er for gammel og skrøpelig til å lete. Han sender sine tcho-tcho gjennom mellomdekket hvis heltene tar maskinrommet og lasterommene.\n\nMERK: Soong er en alliert og en kilde til Mythos-kunnskap, ikke et orakel. La ham ikke svare på alt eller redde dagen. Bruk ham til å peke — og, når heltene står fast, til å gi fra seg én nyttig opplysning som får dem i bevegelse igjen.","done":false,"connects_to":["npc-dr-soong","npc-tcho-tcho"]},{"id":"beat-distant-music","title":"Musikk i det fjerne","act":"Akt 3 — Mønsteret","description":"Fra 13. desember og utover.\n\nRyktene går om underlig musikk midt på natta. Ingen to passasjerer er enige om hvordan den låter: «en hjemsøkt opera», «en dødsmesse fra helvete». Ingen klarer å peke ut hvor den kommer fra. Spør man mannskapet, innrømmer de at de har hørt den de også. En matros kan tilby at det er sirenenes sang, som lokker sjøfolk i døden.\n\nSLAGENE. En helt som vandrer rundt på skipet sent på natta: LISTEN for å høre en fjern, dempet musikk — kirkeaktig, hjemsøkt, ualminnelig tungsindig. Musikkrommet står tomt. HARD LISTEN plasserer lyden under dekk.\n\nDEN BLIR STERKERE. Skapningen prøvekjører maskinen nede i lasterom 7, og for hvert nytt offer blir lyden høyere og klarere. Bygg det opp: begynn med annenhåndshint og drømmer («Jeg hadde en underlig drøm, full av ujordisk musikk»), og la beretningene bli tettere for hver dag som går, helt til heltene hører den selv.","done":false,"connects_to":["loc-hold-7","clue-music-below-decks"]},{"id":"beat-meeting-the-captain","title":"Møtet med kapteinen","act":"Akt 3 — Mønsteret","description":"Før eller siden blir den som gjør seg bemerket, konfrontert av kaptein Henry Nelson — heltene har tross alt vært å se rundt de fleste åstedene. Han avhører dem enkeltvis eller i små grupper. Hold avhørene korte og direkte.\n\nNelson har ingen grunn til å stole på dem, og en situasjon om bord som blir mørkere for hver dag. Han har Psychology 70 % og Fast Talk 95 %: helter som prøver å lure ham med tvilsomme opplysninger, kan oppdage at stuertene diskré følger etter dem.\n\nKONSEKVENSER. Den som allerede er mistenkt — viftet med våpen, slåss, luskerundt der de ikke skal være — kan finne lugaren gjennomsøkt mens de selv blir avhørt. Helter som går til angrep på folk uten grunn, kan bli holdt i lugaren sin til de gjør ordentlig rede for seg.\n\nGEVINSTEN. Overbevis ham om de gode hensiktene — Charm eller Persuade på Hard — og de vinner tilliten hans. Særlig innsiktsfulle og hederlige helter kan bli utnevnt til å hjelpe med å løse mysteriet før Shanghai, noe som åpner lasterommene og maskinrommet på lovlig vis.","done":false,"connects_to":["npc-captain-nelson"]},{"id":"beat-searching-the-ship","title":"Å gjennomsøke skipet","act":"Akt 3 — Mønsteret","description":"Sporene fører ned under tredjeklassedekket: til maskinrommet midtskips, eller til lasterommene i de nederste dekkene, som nås fra en gang langs kjølen og fra fire forseglede lasteluker på tredjeklassedekket.\n\nÅ KOMME SEG NED. Uten kapteinens tillatelse er dette ulovlig ferdsel, og kan skaffe heltene alvorlig trøbbel. Passasjerer har ikke lov til å vandre rundt i lasterommene uten god grunn, og er blankt forbudt adgang til maskinrommet uten følge. Å komme forbi vaktholdet — andrestyrmann Gustav Knutsen om dagen, junioringeniør Barry O'Rourke om natta — krever Stealth, bestikkelse (Charm, Psychology eller Persuade) eller Fast Talk.\n\nLUKENE. Vanntette, ment å stanse vanninntrengning, og praktisk talt umulige å tvinge opp: Extreme STR, eller Hard STR med brekkjern. Å dirke opp låsene krever Locksmith.\n\nROTTESKINNET. SPOT HIDDEN nede i lasterommene: et rotteskinn, helt og mykt. Alt kjøtt og alle organer borte fra innsiden av skinnet, som er perfekt garvet og bløtt å ta på. Ingen hull eller sår ut over de naturlige. Små knokler rasler inni. Science (Biology eller Zoology) eller Art/Craft (Leatherwork) vet at det er umulig å flå et dyr på denne måten, og at et råtnet dyr ville gitt stivt eller råttent skinn. Det ser ut som det er spist opp innenfra.\n\nTRAPP DET OPP. Dette er skapningen som spiser — insektformen etterlater bare skinn, hår og knokkelbiter. Plant stadig større funn utover reisen: en kjælehund, så skinnet av en blindpassasjer. Be om Sanity rolls der det passer.\n\nBAKHOLDSLAND. Lasterommene og bunnrommet er ideelle for Bates, et tilkalt monster, eller en formel ut av mørket.","done":false,"connects_to":["clue-rat-pelt","loc-bilges","loc-boilers","loc-hold-1","loc-hold-7"]},{"id":"beat-the-tcho-tcho","title":"Tcho-tcho","act":"Akt 3 — Mønsteret","description":"JOBBEN DERES ER Å VÆRE FEIL SVAR. Tcho-tcho-ene og gjelden deres til dr. Soong er et blindspor, som skal lede mistenksomme helter til feil konklusjon. Spilt rett fram er de nøytrale til det som skjer, og kan til og med hjelpe via Soong.\n\nVIL DU HA DEM STYGGE, skifter de side fra Soong til skapningen underveis, og gir den et lag håndlangere til avledning, tyveri eller drap.\n\nTØNNENE. Tcho-tcho skal etter sigende være kannibaler, og de femti tønnene i lasterom 6 merket «Hawaiian Botanical Specimens» kan i virkeligheten inneholde menneskelik. Helter som vaker i lasterom 6 eller følger tcho-tcho-ene til et hemmelig møte, ser en tønne bli åpnet og innholdet kokt og spist: Sanity roll (1/1D4).\n\nAVTALEN. Heltene kan få se «Chad Peterson» møte tcho-tcho-ene i lasterom 6 og tilby dem en avtale — «beskyttelse, og alt kjøttet dere kan spise». Det kan gå begge veier:\n\n• DE TAKKER JA og heltene griper inn: Peterson stikker av ved første tegn til bråk, mens de nye allierte angriper. Trengt opp i et hjørne oppløses han i tusen insekter og slipper unna i en bølge av krypende ting som skyller over heltene for 1D4 skade. Å se forvandlingen: Sanity roll (1D3/2D6).\n\n• DE TAKKER NEI: skapningen tilkaller øyeblikkelig en hunting horror for å drepe dem alle. Holder heltene seg unna, dør tcho-tcho-ene. Driver de vekk eller dreper monsteret, er de overlevende takknemlige — og er det bare én igjen, bukker han og erklærer «Sheng Tsin, Deres tjener nå og alltid», i den tro at han skylder dem livet sitt. Sheng Tsin tjener som assistent, kokk og tolk, og kan bli en erstatningskarakter.","done":false,"connects_to":["npc-tcho-tcho","npc-hunting-horror","loc-hold-6"]},{"id":"beat-bunny-takes-a-hostage","title":"Bunny tar en gissel","act":"Akt 4 — Klimaks","description":"Lørdag 19. desember, spisesalen på første klasse.\n\nBates går inn og tar den første han ser som gissel — en bakgrunnsfigur, noen heltene kjenner, eller en av heltene selv. Han skriker om stemmene i hodet og hvordan de fikk ham til det. Han krever å bli sluppet av båten øyeblikkelig, ellers dreper han gisselet. Han er åpenbart morderisk og forstyrret.\n\nLØSNING: makt, eller kløktig forhandling — en Extreme Persuade eller Fast Talk roll, eller en Hard Psychoanalysis roll.\n\nSpill scenen til ende, med Bates død eller tatt. Dette er en avledning, og den virker: holder heltene seg opptatt her lenge nok, er det første de får vite om den store prøven en enorm malstrøm som åpner seg i havet.\n\nSANITY-BELØNNING: hindrer heltene Bates i å drepe gisselet, +1D6.","done":false,"connects_to":["npc-bunny-bates","beat-the-final-test"]},{"id":"beat-the-final-test","title":"Den store prøven","act":"Akt 4 — Klimaks","description":"Lørdag 19. desember, lasterom 7.\n\nMaskinen kombinerer blodet fra ofrene med de umenneskelige harmoniene i Mythos-fortryllede piper stemt til ujordiske frekvenser. Så snart skapningen begynner å spille, trekker harmoniene til seg vesener fra Mythos — og påvirker alle innenfor 30 meter som formelen Pipes of Madness. Etter noen øyeblikk spiller maskinen seg selv.\n\nDEN VIRKER IKKE. Innretningen sender ut bølger av energi og musikk som drar til seg vesener fra Mythos, men den verken fanger eller holder på dem. I stedet for en brønn av stjålet kraft har skapningen bygd en maskin som gjør alt som hører den rasende — og forteller det nøyaktig hvor det skal komme.\n\nPOLYPPEN. Ikke lenge etter at spillingen starter, tilkalles en flying polyp fra havbunnen. Idet den stiger, åpner det seg en veldig malstrøm; skipet gjør et krengende utfall, og passasjerer og mannskap får panikk. Så kaster den seg mot skroget. Den bruker TI RUNDER på å rive seg gjennom til lasterom 7, hvis ikke heltene stanser den.\n\nSKURKEN STIKKER AV. Skapningen innser faren og forsøker å kaste en Gate til Shanghai, hvis den ikke blir stanset. I hastverket lar den maskinen stå og spille.\n\nNÅR POLYPPEN NÅR LASTEROM 7, bruker den vindstøtet sitt til å blåse pipene fra hverandre — sammen med skapningen og alle andre i nærheten (5D6 skade). Med musikken stanset kan den synke tilbake i havet og slenge en veldig bølge mot skipet. Eller la den bli noen runder, hvis heltene vil slåss.\n\nSKIPET DØR. Skadene er enorme. Hullet i skroget betyr at Coolidge tar inn vann og krenger. Det går ikke lang tid. Spør heltene rett ut: løper de til livbåtene og tenker bare på seg selv, eller organiserer de seg, finner innesperrede passasjerer og får kvinner og barn i båtene? Spill det ut — Sanity-belønningene til slutt avhenger av det.","done":false,"connects_to":["npc-flying-polyp","npc-crawling-one","loc-hold-7","ref-dealing-with-the-polyp"]},{"id":"beat-conclusion","title":"Slutten","act":"Akt 4 — Klimaks","description":"Scenarioet ender etter alt å dømme med at SS President Coolidge synker et sted utenfor kysten av Japan eller Kina, og at skapningen og dens mislykkede Pipes of Leng er ødelagt — trolig av polyppen, muligens av heltene.\n\nOverlevende blir plukket opp i løpet av noen timer, og det stilles svært mange spørsmål. Etter hvert skriver avisene om en monsterbølge som senket skipet. De som overlevde, vet bedre.\n\nSLIPPER SKAPNINGEN UNNA GJENNOM EN GATE, ankommer den Shanghai og slutter seg til Eight Fortunes Mutual Aid Society, en Mythos-kult med forgreininger over hele Kina. I månedene og årene som følger, planlegger den hevn over alle som hadde en finger med i fallet — en ferdiglaget gjenganger av en skurk, som kommer og leter etter heltene.\n\nSANITY-BELØNNINGER:\n+1D6  Heltene hindrer Bates i å drepe gisselet\n+1D4  Heltene ødelegger energiinnretningen\n+2D6  Heltene fanger eller dreper skapningen\n−1D6  Skapningen slipper unna\n+1D20 Heltene beseirer polyppen\n+1D10 Heltene prøver å redde så mange som mulig fra å drukne\n−1D10+2 Heltene forlater skipet uten tanke for andre","done":false,"connects_to":["ref-sanity-awards"]}],"clues":[{"id":"clue-organ-grate-crate","title":"Et 50-pipers orgel fra Portland","where":"Pier 42 under lasting / lasterom 7","description":"En diger kasse merket «Wm. Wood Pipe Organ Co., Inc. of Portland, Oregon». Ingen om bord har bestilt et orgel; skipet har allerede instrumenter i musikkrommet. Kassa skal til lasterom 7, som er dobbeltlåst.","found":false,"connects_to":["loc-hold-7"]},{"id":"clue-organ-crate","title":"Orgelkassa er åpnet mange ganger","where":"Lasterom 7","description":"Skruene som holder sidepanelet på venstre side, er skrudd ut og inn igjen gang på gang. Noen kommer seg inn i den — ofte.","found":false,"roll":"Spot Hidden","connects_to":["loc-hold-7","clue-blood-on-the-crate"]},{"id":"clue-blood-on-the-crate","title":"Blod på panelet","where":"Lasterom 7","description":"Blodflekker på trepanelet på venstre side av orgelkassa — søl fra ofrene som helles ned i pipene. Tørt eller ferskt, alt etter hvor sent heltene kommer hit.","found":false,"roll":"Hard Spot Hidden uten lyskilde; vanlig vanskegrad med lys","connects_to":["loc-hold-7"]},{"id":"clue-green-metal-box","title":"Den grønne metallkassa","where":"Pier 42 under lasting / lasterom 7","description":"En to meter høy grønn metallkasse, levert på kaia under væpnet vakt og stuet i lasterom 7. Låst: Hard Locksmith, eller Hard STR for å bryte den opp. Inni ligger ingeniørtegninger for energiinnretningen, sammen med notater om montering, materialer, kostnader og konstruksjon — dekket av håndskrevne okkulte symboler.","found":false,"roll":"Mechanical Repair eller Science (Engineering) for å kjenne igjen konstruksjonstegninger; Cthulhu Mythos pluss to timers studium for å forstå at innretningen skal tilkalle vesener fra hinsides stjernene for å fange essensen deres","connects_to":["loc-hold-7"]},{"id":"clue-funeral-supplies","title":"Kassa merket «Funeral Supplies»","where":"Pier 42 under lasting / lasterom 6","description":"En stor kasse merket «Funeral Supplies». Den inneholder liket av en tcho-tcho som døde i San Francisco, og som sendes hjem på dr. Soongs regning. Et blindspor — men et godt et.","found":false,"roll":"Spot Hidden","connects_to":["loc-hold-6","npc-tcho-tcho"]},{"id":"clue-empty-clothes","title":"De tomme klærne","where":"Petersons lugar, A-dekk","description":"Sokker og sko på gulvet foran en stol; dress, vest, skjorte og undertrøye tredd inn i hverandre som en russisk dukke. En underlig, vond lukt. Som om kroppen inni hadde smeltet bort uten å forstyrre en eneste fold.","found":false,"connects_to":["beat-the-empty-suit"]},{"id":"clue-suicide-note-wrong","title":"Brevet stemmer ikke","where":"Petersons lugar (tatt som bevis samme kveld)","description":"Brevet passer dårlig med Petersons lettlivede fasade og røffe liv. Håndskriften stemmer rimelig godt — men han skrev alltid «Charles Chadwick Peterson», «Charles Peterson» eller «C. C. P.». Aldri bare «Chad». Uttrykket «hollow millionaire» sikter til arvinger som ble ruinert i krakket i 1929; Petersons familie kom stort sett helskinnet gjennom, så det er ikke engang sant.","found":false,"roll":"Art/Craft (Calligraphy eller lignende) eller Hard Spot Hidden for å se forskjellene mot en kjent skriftprøve — som kan skaffes fra Virginia Ridley, eller ved å vise brevet til Charles Astor","connects_to":["handout-suicide-note","npc-virginia-ridley"]},{"id":"clue-hallanders-lie","title":"Hallanders historie holder ikke","where":"Korridoren på første klasse, A-dekk","description":"Han sier han hørte en lyd og kom inn gjennom en ulåst dør. Det var ingen lyd, og døra var låst — han dirket den opp for å rane lugaren, og fant stolen kokende av kakerlakker.","found":false,"roll":"Psychology for å se at han er i sjokk; Intimidate eller Persuade for å få ham til å snakke; en ny Psychology for å avsløre løgnene","connects_to":["npc-albert-hallander"]},{"id":"clue-manifest-gap","title":"Almacan står ikke på passasjerlisten","where":"Forvalterens kontor","description":"Señor Guiterrez de Almacan finnes ingen steder blant de betalende passasjerene — ikke på første klasse, ikke noe sted. Det var dette som kostet overproviantforvalter Dungass livet.","found":false,"roll":"Hard Persuade for å få se passasjerlisten","connects_to":["npc-almacan","npc-martin-dungass"]},{"id":"clue-peterson-walking","title":"Peterson er sett etter at han døde","where":"Hvor som helst om bord","description":"Dr. Soong så Chad Peterson gå ut av lugaren sin rundt kl. 06.00 søndag 6. desember — etter det antatte selvmordet. Phyllis Barnes har sett ham flere ganger og kaller selvmordet «sludder». Hun nevner også at hun kom godt overens med ham første kvelden, men at han neste morgen ikke ante hvem hun var.","found":false,"connects_to":["npc-dr-soong","npc-phyllis-barnes"]},{"id":"clue-virginias-unease","title":"Virginias kvinneintuisjon","where":"Virginia Ridley, første klasse","description":"Hun så Chad i korridoren rundt kl. 21.30 den 5. desember, etter middagen. Noe ved ham plaget henne — gangen hans, eller klærne; han virket fortvilet eller ulykkelig. Hun avfeier det som ren intuisjon, og er ivrig etter å fortelle det til alle som spør. Hun har også fått et ekte brev fra ham samme morgen: «Virginia, hver dag vet jeg at jeg tok det rette valget. Bli med meg til sjøs! Din kjære Chad.»","found":false,"connects_to":["npc-virginia-ridley","clue-suicide-note-wrong"]},{"id":"clue-rat-pelt","title":"Den hule rotta","where":"Lasterommene","description":"Et rotteskinn, helt og mykt, perfekt garvet, uten hull eller sår ut over de naturlige. Alt kjøtt og alle organer borte; små knokler rasler inni. Det ser ut som det er spist opp innenfra.","found":false,"roll":"Spot Hidden for å finne det; Science (Biology eller Zoology) eller Art/Craft (Leatherwork) for å vite at det er umulig å flå et dyr slik","connects_to":["beat-searching-the-ship","npc-crawling-one"]},{"id":"clue-music-below-decks","title":"Musikken kommer nedenfra","where":"Hvor som helst om bord, sent på natta","description":"Fjern, dempet, kirkeaktig musikk — hjemsøkt og ualminnelig tungsindig. Musikkrommet står tomt. Den blir høyere og klarere for hvert offer.","found":false,"roll":"Listen for å høre den; Hard Listen for å plassere den på de nederste dekkene","connects_to":["beat-distant-music","loc-hold-7"]},{"id":"clue-kennel-boy","title":"Kenneljenta har sett noe","where":"Lasterom 5","description":"James Hawthorne, 17 år, er skvetten, mumlende, med blikket stadig søkende langs gulvet. Han skriker og stikker inn i hiet sitt så snart han ser en edderkopp eller en kakerlakk. Beroliget snakker han om «krypene» — han har sett dem komme og gå, marsjere som en hær, og han hører dem pile rundt inne i skipet. Han er sikker på at de kommer for å spise ham. Han så skapningen oppløse seg, og det har gjort ham ubotelig gal.","found":false,"roll":"Psychology for å se at han er livredd og trolig gal; tid brukt på å roe ham, eller Psychoanalysis, for å forstå hva han sier","connects_to":["loc-hold-5","npc-james-hawthorne"]},{"id":"clue-ballast-tank","title":"Liket i ballasttanken","where":"Lasterom 4","description":"Phyllis Barnes, i forråtnelse i en ballasttank. Å åpne den øvre luka slipper ut en sky av avskyelig gass.","found":false,"roll":"CON roll eller kast opp av stanken; Sanity roll 0/1D2 når liket oppdages","connects_to":["loc-hold-4","npc-phyllis-barnes"]},{"id":"clue-cold-fire","title":"Det kalde bålet i baugrommet","where":"Lasterom 1","description":"Restene av et lite bål laget av oppbrukne kasser, minst et døgn gammelt. Asken er kald og inneholder forkullede beinbiter — restene av et improvisert tcho-tcho-måltid. I nærheten: den utbrente asken fra en opiumspipe.","found":false,"roll":"Spot Hidden for å finne begge deler; Know eller Science (Chemistry eller Pharmacy) for å kjenne igjen opiumen","connects_to":["loc-hold-1","npc-tcho-tcho"]},{"id":"clue-bates-confession","title":"Bates' skriftemål","where":"Kapellet, 17. desember","description":"Bates skrifter for pater Alvarez — eller for en helt som er prest — og tilstår tyveriet av Soongs bok, drapet på Wang Ma, og enhver annen forbrytelse om bord han kommer på. Han tror han er i ferd med å bli gal, og snakker om «stemmer» som «fikk ham til det». Historiene hans stemmer ikke med hverandre, og tilstanden hans forverres synlig. Etterpå flykter han og blir dominert på nytt.","found":false,"connects_to":["npc-bunny-bates","npc-father-alvarez"]},{"id":"clue-consume-likeness-pattern","title":"Mønsteret i ansiktene","where":"Keeperens spor — for helter som setter det sammen","description":"Hver eneste umulige observasjon er en person som nylig har dødd eller forsvunnet. Dungass forsvinner og blir aldri funnet. Peterson dør og blir stadig sett. En adelsmann som ikke står på noen liste, dukker opp fra ingensteds. Ett vesen bærer dem alle — og det trenger 48 timer i en ny skikkelse før det kan snakke. Det var derfor «Peterson» ikke kunne svare sin egen forlovede, og måtte forlate skikkelsen.","found":false,"roll":"Cthulhu Mythos, eller rett og slett godt detektivarbeid","connects_to":["npc-crawling-one"]}],"npcs":[{"id":"npc-crawling-one","name":"The Crawling One","category":"Antagonist","role":"Luis Fernando de la Montoyo — skurken","description":"En menneskeformet masse av levende mark, kakerlakker, skorpioner og gravutøy, i kappe og hette. I live var han mester for en kult viet Azathoth, magisk forlenget inn i den spanske erobringen, og hengt av guvernøren i Sonora — hvorpå bevisstheten hans gikk over i utøyet som fortærte liket. Den er ikke udød: tingene som utgjør kroppen, lever. Sår som dreper enkelte kakerlakker er bare til bry, mens svermen avler nye.","stats":{"STR":"65","CON":"80","SIZ":"60","DEX":"50","INT":"90","POW":"100","HP":"14","MP":"20","DB":"0","Build":"0","Move":"6","Armor":"se Spesielt"},"combat":["Bite or grasp 30 %, skade 1D4 pluss vrimlende utøy","Svak i nærkamp — den foretrekker formler og lar håndlangerne ta det jordnære","Kan bytte mellom alle sine menneskeskikkelser i løpet av én kamprunde"],"skills":"Occult 90 %, Cthulhu Mythos 80 %, Stealth 60 %, Psychology 55 %. Språk: navaho, gammelmodig hoffspansk, mandarin, moderne wu-kinesisk og moderne amerikansk engelsk","spells":"Consume Likeness, Dominate, Mindblast (brukt i Den stjålne boka), Mental Suggestion, Gate, Graveyard Kiss (pulp-variant), Summon/Bind Hunting Horror, Pipes of Madness (via innretningen)","special":"OPPLØSNING: blir den alvorlig truet, faller den fra hverandre til enkeltinsekter som spreller vekk mellom gulvplankene — i praksis umulig å drepe med vanlige midler, med mindre den trenges opp et sted den ikke kan renne ut av.\n\nCONSUME LIKENESS: den kan ta form av ethvert menneske den dreper og spiser. En ny skikkelse bruker 48 TIMER på å utvikle stemmebånd — grunnen til at den måtte forlate Petersons skikkelse da Virginia ventet at han skulle snakke.\n\nEGENTLIG SKIKKELSE: kan ikke snakke eller lage lyd i det hele tatt, og må kommunisere skriftlig. Telegrammer er typisk.\n\nSPISING: etterlater bare skinn, hår og knokkelbiter — derav det hule rotteskinnet.","sanity_loss":"1D3/2D6 for å se den forvandle seg, eller se dens egentlige skikkelse","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt. POW 100 er fastsatt i teksten (den opposed rollen for Mindblast).","forms":"Señor Diego Guiterrez de Almacan (hoveddekke) | Chad Peterson | Martin Dungass, overproviantforvalter | Haseye Adikai, en navaho-jente i tenårene | Du Zeming, en arret eldre kinesisk kvinne | hvem som helst annen den dreper om bord","notes":"Å finne den skal være katt og mus. Planen dens: prøvekjøre Pipes of Leng langt fra nysgjerrige øyne, og deretter sende seg selv og innretningen gjennom en Gate til Shanghai for å slutte seg til Eight Fortunes Mutual Aid Society."},{"id":"npc-almacan","name":"Señor Diego Guiterrez de Almacan","category":"Antagonist","role":"Skapningens dekkidentitet","description":"En tilbaketrukket spansk adelsmann i en lugar på første klasse på A-dekk som ikke står på noen liste — én dør unna heltene, hvis de bor der. Holder seg for seg selv, men kan sees promenere på dekk enkelte kvelder. Snakker et gammelmodig, høvisk spansk.","special":"Han står ikke på passasjerlisten. Overproviantforvalter Dungass la merke til det, gikk for å spørre, og døde av det.","notes":"Bruk ham som et ansikt, ikke som en motstander i kamp. Han er skapningen — se den oppføringen for karakteristikker.","stats_note":"Se The Crawling One."},{"id":"npc-bunny-bates","name":"Stuart «Bunny» Bates","category":"Antagonist","role":"Dominert gangster — skapningens hender","description":"Kastanjebrunt hår, store never, og en nese som er brukket noen ganger. Tre år med Capone-gjengen i Chicago, deretter et år i skjul i Wabasha Street-hulene i St. Paul, der han betalte politimesteren for å få være i fred. Hulene gjorde ham litt gal, og han er sulten på action. Med forbudstiden over er han ute etter å maksimere fortjenesten — eller i det minste finne en god opiumsforsyning i Shanghai.","stats":{"STR":"70","CON":"65","SIZ":"70","DEX":"60","INT":"55","APP":"45","POW":"50","EDU":"45","HP":"13","MP":"10","SAN":"25","DB":"+1D4","Build":"1","Move":"8"},"combat":["Fighting (Brawl) 60 %, skade 1D3+1D4",".32 revolver 50 %, skade 1D8","Thompson SMG 45 %, skade 1D10+2, burst 1/2/5 (hvis Keeperen vil legge ordentlig press på)"],"skills":"Intimidate 65 %, Stealth 50 %, Locksmith 45 %, Psychology 30 %","possessions":".32-revolver, en Tommy gun gjemt under dekk, stjålet mannskapsuniform","traits":"Målbevisst, ærgjerrig, kynisk","quotes":["«Hvorfor jeg skal til Japan? Pass dine egne saker.»","«Herregud, hva tar du meg for, en tyster? Pass dine egne saker.»","«Englekoret har befalt meg.»"],"special":"DOMINERT fra 7. desember. Skapningen må kaste Dominate på nytt hver natt (opposed POW roll). Helter som styrker viljestyrken hans — Hard Persuade eller Hard Psychoanalysis — gir ham en bonusterning til å stå imot.\n\nBelastningen driver ham inn i paranoid galskap. Den 17. desember bryter han fri lenge nok til å skrifte, hvorpå han knekker i løpet av en time og ikke lenger kan stå imot formelen i det hele tatt.","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Blir Bates drept eller satt i arresten tidlig, dominerer skapningen stuert Martin Aimesworthy i stedet, og han overtar Bates' rolle i alle senere scener."},{"id":"npc-flying-polyp","name":"Flying Polyp","category":"Monster","role":"Det maskinen kaller opp","description":"Et halvsynlig uhyre av umulig geometri, som beveger seg på vinder det lager selv. Tilkalt fra havbunnen av Pipes of Leng, og gjort rasende — ikke kontrollert — av dem. Når den stiger, åpner det seg en veldig malstrøm som får skipet til å krenge.","stats":{"STR":"180","CON":"125","SIZ":"180","DEX":"90","INT":"80","POW":"80","HP":"30","MP":"16","DB":"+4D6","Build":"5","Move":"12 flygende","Armor":"4"},"combat":["Tentakelstrøk — skade som ligner uttørking eller ekstrem vindbrenning","Vindstøt 5D6 — knuser glass og slynger møbler tvers over rom","Bruker 10 runder på å rive seg gjennom skroget til lasterom 7"],"armor":"4 poeng. Tar bare MINIMUM skade fra fysiske våpen. Fortryllede våpen, ild og elektriske angrep gjør full skade.","special":"På grunn av det fullstendige raseriet forblir den SYNLIG — som betyr at alle om bord ser den.\n\nStanser pipene, snur den og drar tilbake dit den kom fra, og etterlater seg en stripe av ødeleggelse. Fortsetter de å spille, legger den skipet i grus.","sanity_loss":"1D3/1D20 — slås av alle om bord","stats_note":"POW 80 og Armor 4 er fastsatt i teksten (den opposed rollen for Bind Flying Polyp og skadereglene). De øvrige karakteristikkene er standardverdier for vesenet.","notes":"Se Regler: Å håndtere polyppen for de tre utveiene — ødelegg pipene, bind den, eller slåss."},{"id":"npc-hunting-horror","name":"Hunting Horror","category":"Monster","role":"Valgfritt — tilkalt for å drepe heltene","description":"En repaktig, svart ting som pisker gjennom lufta, og som gjør vondt å se på. Tilkalt av skapningen når den vil ha helter eller tcho-tcho døde, og er villig til å ta oppmerksomheten det koster.","stats":{"STR":"85","CON":"70","SIZ":"90","DEX":"85","INT":"50","POW":"70","HP":"16","MP":"14","DB":"+1D6","Build":"2","Move":"8 / 18 flygende","Armor":"2"},"combat":["Bite 65 %, skade 1D8","Crush 40 %, skade 2D6 — et sammensnørende angrep mot et fastholdt mål"],"special":"Ødelegges av direkte sollys. Om bord betyr det at den må håndteres før daggry, eller drives ut på åpent dekk.","sanity_loss":"1D3/1D20","stats_note":"Standardverdier for vesenet — sjekk mot Malleus Monstrorum hvis du har den.","notes":"En tung slegge. Scenarioet foreslår den for Keepere som vil gi heltene virkelig hard medfart, eller for å utslette tcho-tcho-ene hvis de avslår skapningens tilbud."},{"id":"npc-pipes-of-leng","name":"Pipes of Leng","category":"Innretning","role":"Energiinnretningen — hele plottets midtpunkt","description":"Tilsynelatende et kirkeorgel, dekket av ekstra ledninger, sikringsrør, slanger og underlige knuter, og for det meste dekket av blod. Står man tett inntil, hører man en illevarslende, hviskende summing. Selve pipene ble kjøpt, stjålet og plyndret fra tibetanske, nepalske og andre himalayiske kilder, og brakt til San Francisco for to år siden, der de ble satt sammen og stemt til ujordiske harmonier. Et orgelverksted i Portland og et lite elektrisk firma bygde mekanikken som spiller dem — i isolasjon og fullstendig uvitenhet om hva den skal brukes til.","stats":{"HP":"50","Armor":"3"},"special":"Å LADE DEN: fem menneskeofre, med blodet rennende ned i pipene.\n\nÅ SPILLE PÅ DEN: trekker til seg vesener fra Mythos, og påvirker alle innenfor 30 meter som formelen Pipes of Madness. Etter noen øyeblikk spiller den seg selv.\n\nFEILEN: den tilkaller, men holder ikke på noe. Alt den kaller opp, ankommer rasende og på jakt etter kilden til lyden.\n\nÅ ØDELEGGE DEN: 50 poeng skade mot armor 3. Det finnes ingen sprengstoff om bord.","stats_note":"HP 50 og Armor 3 står oppgitt i teksten.","notes":"Stuet i en diger kasse i lasterom 7."},{"id":"npc-captain-nelson","name":"Kaptein Henry Nelson","category":"Mannskap","role":"Skipsfører på SS President Coolidge","description":"Snøhvitt hår, velstelt bart, et meget fast håndtrykk. Nådeløs og effektiv. Nordmann, oppvokst i den franske kolonien Martinique, så den varme stemmen bærer en underlig aksent, og kolonifransken hans er utmerket. En ivrig pokerspiller som vet hvordan man bløffer, og vet når han blir bløffet.","stats":{"STR":"60","CON":"65","SIZ":"65","DEX":"55","INT":"75","APP":"60","POW":"70","EDU":"70","HP":"13","MP":"14","SAN":"70","DB":"0","Build":"0","Move":"7"},"skills":"Psychology 70 %, Fast Talk 95 %, Navigate 75 %, Persuade 60 %, Law 40 %, Language (French) 80 %","combat":["Fighting (Brawl) 45 %, skade 1D3","Revolver 55 %, skade 1D10 — ligger innelåst i lugaren hans"],"traits":"Slu, skarp, veloppdragen","quotes":["«God aften. Jeg går ut fra at De nyter reisen?»","«Hva i helvete er det som foregår her!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt. Psychology 70 % og Fast Talk 95 % står oppgitt i teksten.","notes":"Svært lite unngår oppmerksomheten hans. Helter som prøver å lure ham med tvilsomme opplysninger, blir diskré fulgt av stuertene. Vinn tilliten hans med Hard Charm eller Persuade, så kan han utnevne heltene — noe som åpner lasterommene på lovlig vis."},{"id":"npc-hugo-schramm","name":"Hugo Schramm","category":"Mannskap","role":"Førstestyrmann","description":"Lysebrunt hår, smalt ansikt, blyanttynn bart. Holdes travelt opptatt med passasjersaker og med å stille opp for kapteinen på skipets tilstel
