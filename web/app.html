ninger. Når det blir for mye, trekker han seg tilbake til kontoret og later som han ikke er der.","traits":"Smiler og nikker mye","quotes":["«Selvsagt, jeg skal ordne det med en gang.»","«Beklager, jeg hørte Dem ikke der ute!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Rådvill overfor forsvinningene, og under ordre om å holde dem stille. Ønsker første klasse og spesialklasse velkommen ved landgangen på avreisedagen, og undersøker Petersons lugar sammen med skipslegen Hartman."},{"id":"npc-albert-hallander","name":"Albert Hallander","category":"Mannskap","role":"Matros — tyv","description":"Blond og sterk, med grønne øyne. Født i Indonesia av nederlandske foreldre, med hang til smått tyveri. Han dirket opp låsen til Chad Petersons lugar for å rane den, og fikk en masse kakerlakker susende ut av stolen.","skills":"Locksmith 45 %, Stealth 50 %, Fast Talk 45 %, Persuade 30 %","traits":"Lusken, oppblåst, en ganske god løgner","quotes":["«Jeg gikk bare forbi, jeg skulle ha latt det være.»","«Jeg vet ingenting, det sverger jeg.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han roter heller til bildet enn å innrømme tyveriforsøk. En samlet innsats får ham til å tilstå — og da arresterer offiserene ham, som fjerner et vitne."},{"id":"npc-martin-aimesworthy","name":"Martin Aimesworthy","category":"Mannskap","role":"Stuert på første klasse","description":"Høy, blond, glattbarbert. Steller med behovene til første klasse. Pålitelig, ærlig og pliktoppfyllende. Blir han venn med heltene, deler han gjerne mistankene han har fanget opp.","traits":"Lojal og oppmerksom","quotes":["«Det er ingen sak. La meg ta meg av det.»","«Jo, det er et ordentlig oppstyr!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han tar avskjedsbrevet som bevismateriale om kvelden den 6. desember. VIKTIG: blir Bates tatt eller drept, kaster skapningen Dominate på Aimesworthy og bruker ham i Bates' sted fra da av."},{"id":"npc-martin-dungass","name":"Martin Dungass","category":"Offer","role":"Overproviantforvalter — død før scenarioet begynner","description":"Fortært av skapningen natt til 6. desember, etter at han gikk for å stille noen spørsmål til en passasjer som ikke sto på listene. Liket blir aldri funnet.","stats_note":"Trenger ingen karakteristikker — han er død på side én.","notes":"Mannskapets oppfatning er at han har gått på flaska og sover den ut under dekk; det går rykter om trøbbel med kona. Politiet i Honolulu fører det opp som drukningsulykke."},{"id":"npc-erik-hartman","name":"Dr. Erik Hartman","category":"Mannskap","role":"Skipslege","description":"Undersøker åstedet i Petersons lugar sammen med førstestyrmann Schramm, og holder funnene for seg selv, som han har fått ordre om.","skills":"Medicine 60 %, First Aid 70 %, Science (Biology) 45 %","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"En nyttig inngang for helter med medisinsk bakgrunn — kollegial høflighet er en enkel vei inn i lugaren."},{"id":"npc-other-crew","name":"Resten av mannskapet","category":"Mannskap","role":"Navn å slenge ut ved behov","description":"Sjeftelegrafist Marco Borrely (med ni radio- og telegrafoperatører under seg) | maskinsjef Oliver Grossmann | maskinistmat Wilhelm Schubert | fyrbøter Robert Reid, en av tjue junioringeniører | kjøkkensjef Anthony Deplace | vinkelner Phillipe d'Alsace | matros Hank Henson, som vokter Petersons dør | Arthur Benedict Carmel, sjef for femtifire kelnere | Ephraim «Fizzy» Walters, spydig hovmesterbartender | andrestyrmann Gustav Knutsen, på lastelukene om dagen | junioringeniør Barry O'Rourke, på dem om natta | Raymond Hickler, dirigent for Pacific Jazz Orchestra | Arthur Pendury, stallkar for hestene i lasterom 5","stats_note":"Statister — bruk vanlige matros- eller yrkesprofiler ved behov.","notes":"315–350 mann i alt. Gjenta kjente ansikter, så spillerne blir kjent med noen få faste."},{"id":"npc-chad-peterson","name":"Chad Peterson","category":"Offer","role":"Rik forlovede — fortært første natta","description":"Charles Chadwick Peterson fra New York. Upåklagelig kledd, grundig full på landgangen, hilser på alle han kolliderer med. Fortært i lugaren sin natt til 6. desember; fra da av er alle som ser «Peterson», i realiteten skapningen.","quotes":["«Chad Peterson fra New York, en fornøyelse å gjøre Deres bekjentskap.»"],"special":"Han skrev seg alltid Charles Chadwick Peterson, Charles Peterson eller C. C. P. — aldri «Chad». Avskjedsbrevet er undertegnet «Chad».","stats_note":"Trenger ingen karakteristikker — død før første natt er omme.","notes":"Det ekte brevet han la igjen til Virginia om morgenen den 6., lyder: «Virginia, hver dag vet jeg at jeg tok det rette valget. Bli med meg til sjøs! Din kjære Chad.» Sammenlign det med avskjedsbrevet."},{"id":"npc-virginia-ridley","name":"Virginia Ridley","category":"Passasjer — første klasse","role":"Dilettant og flapper — Petersons forlovede","description":"Kastanjebrunt hår, kurvete, en farlig gange. Født i Shanghai og oppdratt av en amah, i USA siden hun fylte femten. En beryktet New York-flapper, hvis familie tapte mye i krakket. Hun snakket Chad Peterson med på å bli med til Kina, og er ivrig etter å rekke kinesisk nyttår og vise ham barndomsbyen sin.","stats":{"STR":"45","CON":"55","SIZ":"50","DEX":"70","INT":"60","APP":"80","POW":"60","EDU":"60","HP":"10","MP":"12","SAN":"60","DB":"0","Build":"0","Move":"9"},"combat":["Shotgun (leirdue, bukkehagle) 55 %, skade 4D6/2D6/1D6"],"skills":"Charm 70 %, Dance 65 %, Firearms (Shotgun) 55 %, Language (Wu Chinese) 30 %","traits":"Flørtende, glad i våpen og spenning, en glimrende danser","quotes":["«Jeg fikk endelig den store tosken med til Kina, og så stikker han fra meg!»","«De finner ham, ikke sant? De må bare finne ham.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun og Peterson har separate lugarer på presidentdekket. Hun har ikke snakket med ham siden middagen rundt kl. 19.00 den 5. desember — skikkelsen kl. 21.30 var allerede skapningen, og noe ved ham plaget henne. Fra 9. desember skyter hun leirduer over akterenden for å få ut nervene, til stuertene ber henne slutte. En kandidat til det femte offeret."},{"id":"npc-charles-astor","name":"Charles Winston Astor","category":"Passasjer — første klasse","role":"Rik forretningsmann — Petersons venn","description":"Gode tenner, spiss hake, gråsprengt hår. En av New York-Astorene, og han lar sjelden noen glemme det. Han tjente pengene sine på gamlemåten — han arvet dem. Uteksaminert solid midt på treet fra Yale i 1895, og har siden drevet familiens fabrikker i Massachusetts og langs Hudson. Reiser i presidentsuiten, den fineste lugaren om bord, med sønnen James (25), butleren Walker (38) og datteren Elizabeth Anne (19).","stats":{"STR":"55","CON":"55","SIZ":"70","DEX":"50","INT":"60","APP":"55","POW":"55","EDU":"70","HP":"12","MP":"11","SAN":"55","DB":"+1D4","Build":"1","Move":"6"},"combat":["Rifle/Shotgun 55 % — skyter leirduer over akterdekket"],"skills":"Credit Rating 95 %, Persuade 55 %, Intimidate 50 %, Accounting 50 %","traits":"Selvsikker, uekte, forteller en god grisevits, kan skyte og jakte","quotes":["«Chip var en stor venn av meg, en nær venn, og han ville aldri gjort noe slikt.»","«Jeg forstår det ikke. Jeg bare forstår det ikke.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Fullstendig omgjengelig, og ikke spesielt interessert i å få venner under spesialklasse. Blir han venn med heltene, kan han legge inn et godt ord hos kapteinen hvis de havner i trøbbel. Han bekrefter forlovelsen mellom Peterson og Virginia, og insisterer på at «Chip» ikke var typen til å kaste seg ut av en koøye. Etter Honolulu understøtter han det med 1 000 dollar kontant for opplysninger som fører fram."},{"id":"npc-alex-hubbard","name":"Alex Hubbard","category":"Passasjer — første klasse","role":"Storviltjeger","description":"Overvektig, skallet, muskuløs. Berømt for å spore opp og drepe hva som helst som er verdt en tur over havet. Nåværende mål er det svarte pygmé-neshornet i Siam, som få vestlige har sett og enda færre har utstoppet i røykesalongen. Reiser uten annen plan enn stopp i Yokohama, Shanghai og Macao før Bangkok — «Asias kjøttgryter», som han kaller det.","stats":{"STR":"70","CON":"65","SIZ":"80","DEX":"55","INT":"55","APP":"45","POW":"55","EDU":"55","HP":"14","MP":"11","SAN":"55","DB":"+1D4","Build":"1","Move":"6"},"combat":["Winchester-rifle med kikkert 70 %, skade 2D6+4","Bukkehagle 60 % (fugleskrot)"],"skills":"Track 65 %, Natural World 55 %, Survival 50 %, Intimidate 45 %","possessions":"Winchester-rifle med kikkert, en bukkehagle til leirdueskyting med fugleskrot, og et eksemplar av Baedekers reisehåndbok for Siam og Indokina","traits":"Nådeløs, skrytende historieforteller, pratsom, revirhevdende","quotes":["«En mann som ikke jakter, er ikke stort til mann.»","(etter noen drinker) «Jo da, henne skulle jeg gjerne hatt i trofésamlingen.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Ved siden av neshornet har han kikket seg ut Virginia Ridley, og trøster henne i håp om å vinne hennes gunst. Bagasjen hans er den mest tilgjengelige ildkraften om bord for helter som trenger et våpen."},{"id":"npc-dr-soong","name":"Dr. Soong","category":"Alliert","role":"Okkult- og Mythos-forsker","description":"Hvitt hår og skjegg, skrøpelig, lett foroverbøyd, over 70 år. Like hjemme i tradisjonelle som vestlige klær, og like glad for å diskutere urtemedisin, taoisme eller religion. En overbevist kommunist inntil nylig, som tjente arbeiderne i Shanghai både som tradisjonell lege og som fortrolig og medsammensvoren — men han har valgt å reise i stil, på første klasse på båtdekket. Født i Shanghai; morsmålet er wu-kinesisk, mandarinen hans er brukken, engelsken langt bedre.","stats":{"STR":"35","CON":"45","SIZ":"50","DEX":"40","INT":"85","APP":"55","POW":"75","EDU":"85","HP":"9","MP":"15","SAN":"45","DB":"-1","Build":"-1","Move":"4"},"skills":"Occult 80 %, Cthulhu Mythos 25 %, Medicine 70 %, Science (Pharmacy) 65 %, History 60 %, Language (Mandarin) 40 %, Language (English) 70 %","traits":"Alvorlig, lærd, dysterhetsfull, og meget, meget skarp","quotes":["«Dette er min tjener, Wang Ma. Han vil svare på Deres spørsmål. Unnskyld meg.»","«Hendelsen er høyst uheldig. Beklagelig og uheldig.»"],"possessions":"En kiste med urtemedisiner, en liten doktorveske, og (fram til 7. desember) et eksemplar av Book of Red Jade","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"BAKGRUNN: han kjempet i årevis mot opiumshandelen, vestlig utbytting og nasjonalistisk propaganda, fikk noen lite hyggelige venner og en smak for opium selv, uten å falle i dyp avhengighet. I 1927 myrdet nasjonalistiske leiesoldater kona og to av hans tre sønner; han dro til USA med den gjenlevende sønnen og datteren, og tok opp Mythos-forskning på heltid.\n\nETTER 7. DESEMBER nevner han at han så Chad Peterson gå ut av lugaren sin rundt kl. 06.00 søndag den 6. — etter det antatte selvmordet.\n\nMERK: la ham ikke svare på alt eller redde dagen. Han er gammel og skrøpelig. Bruk ham til å peke, og til å løsne opp når heltene står fast. Han er også en kandidat til det femte offeret."},{"id":"npc-wang-ma","name":"Wang Ma","category":"Alliert","role":"Dr. Soongs tjener — myrdet 7. desember","description":"Kort og stygg, med bredt bryst, blek hud og et ondskapsfullt glis. Han steller doktorens klær, urtemedisinkista og hans personlige sikkerhet. Han er tcho-tcho, og leder for en liten flokk av dem som er booket på mellomdekket og tjener Soong for å innfri en gjeld — detaljene er det opp til deg å finne på. Noe i retning av at Soong har reddet livet til en del tcho-tcho.","stats":{"STR":"65","CON":"70","SIZ":"45","DEX":"60","INT":"60","APP":"30","POW":"55","EDU":"30","HP":"11","MP":"11","SAN":"45","DB":"0","Build":"0","Move":"8"},"combat":["Fighting (Brawl) 55 %, skade 1D3","Knife 60 %, skade 1D4+2"],"skills":"Stealth 60 %, Spot Hidden 50 %, Survival 55 %","traits":"Stø, modig, mistenksom","quotes":["«Mester Soong si nei.»","«Mester Soong ikke si.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Drept 7. desember mens han forsvarte Book of Red Jade, og begravet på havet kl. 15.00 den 8. Han erstattes ved Soongs side av Lo Mai, med samme karakteristikker; dør Lo Mai også, trer nye tcho-tcho inn etter tur."},{"id":"npc-phyllis-barnes","name":"Phyllis Barnes","category":"Passasjer — spesialklasse","role":"Musikklærer og godt menneske — offer 3","description":"Kraftig bygd, håret i knute, et glimt i øyet, korte negler. Rødlig hår og et lyst smil er hennes beste trekk. Hun spiller piano, orgel, harpe og fløyte og synger en myk alt, holder impromptu konserter nesten daglig ved lunsj eller middag, og underviser de rikere barna om bord — deriblant Astor-barna. Hun driver også veldedighetsarbeid på mellomdekket, og lærer bort musikk, matematikk og enkel tysk til småbarn. En peppermø, ung til sinns, kraftig bygd, men ikke ved beste helse, og en smule nysgjerrigper.","stats":{"STR":"45","CON":"45","SIZ":"65","DEX":"45","INT":"60","APP":"45","POW":"60","EDU":"65","HP":"11","MP":"12","SAN":"60","DB":"0","Build":"0","Move":"5"},"skills":"Art/Craft (Music) 75 %, Listen 55 %, Charm 50 %, Psychology 40 %","traits":"Rasistisk og fremmedfiendtlig, særlig overfor kinesere, og dertil dypt kristen","quotes":["«Jeg er i musikkrommet hvis noen trenger meg.»","«Jo, jeg hjelper gjerne, men jeg vet ikke om det er så mye jeg kan gjøre.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun påstår å ha sett «voldsomme slagsmål blant kineserne» mer enn én gang — en løgn hun forteller for å gjøre seg selv mer interessant. Spurt om Peterson sier hun at han oppførte seg underlig: de kom godt overens den første kvelden, men neste morgen ante han ikke hvem hun var. Hun kaller selvmordet «sludder», fordi hun har sett ham flere ganger siden.\n\nHun dør 13. desember, etter å ha fulgt musikken til lastelukene. Kroppen havner i en ballasttank i lasterom 4."},{"id":"npc-takishi-suroda","name":"Takishi Suroda","category":"Passasjer — spesialklasse","role":"Nysgjerrig forretningsmann — offer 1","description":"Muskuløs, men spedbygd, med bredt smil og ivrige øyne. En smykkehandler som nettopp har avsluttet en forretning i San Francisco som ser ut til å ha gått godt, og som nå er på vei til ferie i Honolulu. Han utnytter tida om bord til å slappe av og nyte turen.","skills":"Appraise 60 %, Charm 45 %, Persuade 45 %","traits":"Liker å vite hva alle andre driver med, en smule sladrehank","quotes":["«Hei, hva er det du har der?»","«Hei, jeg har lett etter deg! Hvor har du gjemt deg?»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Sannsynlig lugarkamerat for en mannlig helt på spesialklasse. Han er med vilje et blankt ark — bruk ham til å hjelpe, til å hindre, til å dele ut blindspor, eller bare til å være i veien. Han skal gå i land i Honolulu 10. desember; i stedet blir han det første offeret, og lugarkameraten finner senga urørt."},{"id":"npc-father-alvarez","name":"Pater Raphael Alvarez","category":"Alliert","role":"Jesuittisk misjonsprest","description":"Svart hår og bart, ru hud, hender med gjenger etter mange år i klosterhagen. Jesuitt, opprinnelig fra Mexico, med god merittliste i å undersøke det paranormale på vegne av Roma. Omplassert til Peking for å rapportere om de kristnes tilstand i den kinesiske hovedstaden — og i hemmelighet for å lete etter opplysninger om de eldgamle fruktbarhetskultene i de mongolske ørkenene. Han kan nok om Cthulhu Mythos til å ha mareritt.","stats":{"STR":"55","CON":"60","SIZ":"60","DEX":"55","INT":"70","APP":"55","POW":"75","EDU":"80","HP":"12","MP":"15","SAN":"70","DB":"0","Build":"0","Move":"7"},"skills":"Occult 55 %, Cthulhu Mythos 10 %, Psychology 60 %, Persuade 55 %, History 50 %, Library Use 60 %, Language (Latin) 70 %, Language (Chinese) 40 % og raskt stigende","traits":"Vennlig, logisk, nysgjerrig, oppmerksom, hjemsøkt","quotes":["«Jeg ville undersøkt sjøfolkene. Er selvmordet i virkeligheten et drap, kan de stå bak.»","«Velsigne deg, mitt barn. Velsigne oss alle.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han sier helst svært lite, med mindre han blir stilt direkte overfor bevis på Mythos-aktivitet, og stiller flere spørsmål enn han svarer på. Han tar gjerne imot skriftemål, holder messe og gir sjelesorg til alle om bord; det han ikke gjør, er å snakke om seg selv eller ordrene sine fra Roma. Han har brukt de siste ukene på å lære seg kinesisk fra ei bok, med praktisk hjelp fra stuertene.\n\nHan hører Bates' skriftemål 17. desember og bringer det til kapteinen. En sterk kandidat både til erstatningskarakter — og til det femte offeret."},{"id":"npc-miles-hardaway","name":"Miles Hardaway","category":"Passasjer — tredje klasse","role":"Pågående journalist — offer 2","description":"Bakoverglattet hår, spedbygd, gjennomtrengende blikk. En journalist fra San Francisco Chronicle, om bord for å skrive om reisen og dekke handelsmulighetene mellom USA og Kina.","skills":"Fast Talk 65 %, Persuade 55 %, Library Use 55 %, Spot Hidden 50 %","traits":"Nysgjerrig, sladrete og temmelig pågående","quotes":["«Si meg, fortell litt om deg selv.»","«Kan jeg få et sitat?»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han gjør et nummer av Peterson-saken, spiller opp «lukket rom»-vinkelen som et virkelig Sherlock Holmes-mysterium og telegraferer spekulasjoner i land. Enten en løpende plage eller ren bakgrunn, som du vil. Han lokkes til Almacans lugar og drepes 12. desember."},{"id":"npc-james-hawthorne","name":"James Hawthorne","category":"Mannskap","role":"Kenneljente, 17 år — vitnet som knakk","description":"Skvetten, mumlende, med blikket stadig søkende langs gulvet. Skriker og stikker inn i det lille hiet sitt så snart hun ser en edderkopp eller en kakerlakk. Hun steller over 30 hunder, 14 katter, 20 sjøsyke kyr og fem fullblodshester i lasterom 5.","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun så skapningen oppløse seg til en krypende masse nede i lasterommet, og det har gjort henne ubotelig gal. Beroliget — eller nådd med Psychoanalysis — snakker hun om «krypene» hun har sett komme og gå, marsjere som en hær, og om hvordan hun hører dem pile rundt inne i skipet, sikker på at de kommer for å spise henne.\n\nKommer heltene seg ikke ned i lasterommene før sent i reisen, er hun borte — tatt og ofret."},{"id":"npc-tcho-tcho","name":"Tcho-tcho","category":"Blindspor","role":"Lo Mai og seks arbeidere, booket på mellomdekket","description":"En liten flokk i dr. Soongs følge, som innfrir en gjeld til ham. De overvåker femti tønner merket «Hawaiian Botanical Specimens», og samles for seg selv i baugrommet, unna støyen på mellomdekket. Illevarslende, innadvendte — og i dette scenarioet ikke skurkene.","stats":{"STR":"60","CON":"65","SIZ":"45","DEX":"65","INT":"55","APP":"30","POW":"50","EDU":"30","HP":"11","MP":"10","SAN":"40","DB":"0","Build":"0","Move":"8"},"combat":["Fighting (Brawl) 50 %, skade 1D3","Knife 55 %, skade 1D4+2"],"skills":"Stealth 65 %, Survival 60 %, Spot Hidden 45 %","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"HENSIKTEN DERES ER Å VÆRE FEIL SVAR. Spilt rett fram er de nøytrale og kan hjelpe gjennom Soong. Spilt stygt kan de skifte side til skapningen underveis. Helter som gjennomsøker lasterom 1 om natta, møter dem, og de liker det dårlig med mindre heltene kan vise at de arbeider for dr. Soong.\n\nLo Mai trer inn i Wang Mas plass etter drapet. Avslår tcho-tcho-ene skapningens tilbud og heltene redder dem, erklærer den eneste overlevende, Sheng Tsin, seg som deres tjener for livet."},{"id":"npc-background-passengers","name":"Passasjerer i bakgrunnen","category":"Statister","role":"Navn å slenge ut ved behov","description":"FØRSTE KLASSE: Xin Yu, Yan Zou, Sissy McPatrick, Neal Westner, Deliah Conningway, Rupert Cocksure.\n\nSPESIALKLASSE: Ru Li, Shen Liu, Arthur Sellkirk, Maud Rendox, Jasper Conway, Lottie Unser.\n\nTREDJE KLASSE: Peng Chen, Fu Wang, Lan Wu, Daiyu Tang, Billy Royston, Ethel Rind, Paul Scott.\n\nLUGARKAMERATER PÅ TREDJE KLASSE: brødrene Po Liang og Po Hau, Pai Gow-givere innleid til kasinokvelden, og marinegast Olaf Gustavsen fra minesveiperen Abilene.\n\nUNDERHOLDERE: jazz- og kabaretsangerne Rebecca McCormick og Antonio Portaluppi.","stats_note":"Statister — ingen karakteristikker nødvendig.","notes":"678 passasjerer om bord. De andre passasjerene har omtrent ingenting bedre å gjøre enn å sladre og spekulere, og de fleste gjør det gjerne i det vide og brede med heltene."}],"handouts":[{"id":"handout-suicide-note","title":"Handout 1: Chad Petersons avskjedsbrev","found":false,"description":"Funnet på skrivebordet i Petersons lugar, og tatt med som bevismateriale av stuert Aimesworthy samme kveld.","read_aloud":"  MITT LIV HAR VÆRT EN LØGN BYGD PÅ MIN FARS PENGER.\n  TROSS MIN YTRE FASADE ER JEG EN HUL MILLIONÆR.\n  UTEN PENGER VET JEG AT JEG IKKE STREKKER TIL FOR Å\n  GJØRE DET JEG VILLE MED LIVET MITT. FARVEL, VERDEN,\n  JEG GÅR TIL ET BEDRE STED.\n\n                                              CHAD","aside":"HVA SOM ER GALT MED DET: underskriften. Han skrev seg Charles Chadwick Peterson, Charles Peterson eller C. C. P. — aldri bare «Chad». Håndskriften stemmer rimelig godt; å se forskjellene krever en Art/Craft (Calligraphy eller lignende) roll, eller Hard Spot Hidden, mot en kjent skriftprøve fra Virginia Ridley eller Charles Astor. Og «hul millionær» betyr en arving som ble ruinert i krakket i 1929 — noe Peterson ikke var.","connects_to":["clue-suicide-note-wrong","beat-the-empty-suit"]},{"id":"handout-book-of-red-jade","title":"Handout 2: Book of Red Jade","found":false,"description":"Et utsvevende verk av Mythos-kunnskap, som får enhver god konfucianer og enhver som har lest klassikerne, til å grøsse. Det spotter ikke bare Lao Tzus verk, men taoismen, keiseren og hele Manchu-dynastiets guddommelige status.\n\nBESKRIVELSE: langt og smalt — 344 tresnitt-trykte sider, 15 cm brede og 30 cm høye, på høvisk mandarin. Blekket er knallrødt som okseblod, med margnotater og treskjærersnitt i svart. Endeblader av blå silke med en urovekkende skimring i lyset, og tre innbundne, kunstferdig knyttede bokmerker i rød silke. Kalveskinn over tynne, men ekstremt harde trebord; skinnet er dekket av en lett grynet, vanntett lakk som skal ligne anløpet kobber eller mørkegrønn kleberstein. En treklørs messingdrage med ett øye pryder hvert omslag, festet under lakken.\n\nSJELDENHET: bare trettitre eksemplarer skal være laget; de kinesiske myndighetene ødela de fleste på 1830-tallet. Flere havnet på Filippinene og i USA med kinesiske innvandrerkultister. Ett skal befinne seg i British Museum.\n\nHISTORIE: skrevet i fengsel eller under tvang under Manchu-dynastiet, tilskrevet Zhou Lo Wei, «krigsherren av hundre mesterskap». Zhou dukker først opp i kinesiske kilder som alkymist fra de mongolske provinsene på 1830-tallet, og er bedre kjent etter at han kom til Peking i 1847, der han ble opiumsavhengig og lærd i klassikerne, og samlet en sekt av spyttslikkere og reformatorer som kalte seg «Sevenfold Hidden Path Clan» — antireligiøse fanatikere, utpressere og skolerte kriminelle som skremte hovedstaden i årevis. Zhou skaffet seg en stilling ved det keiserlige hoff i 1850 og misbrukte den grovt fram til 1861, da han ble pågrepet og tiltalt for ulovlig inntrengning i den keiserlige byen, trolldom og forbrytelser mot den offentlige orden. Han ble halshugget i Peking i 1862. Beretningene om begravelsen spriker — et annet lik kan ha blitt byttet inn, eller han kan ha oppløst seg i insekter på retterstedet.\n\nDET ER FULLT MULIG, JA SANNSYNLIG, AT ZHOU OG SKAPNINGEN ER DEN SAMME.\n\nMYTHOS-KUNNSKAP: prosessen for ghoul-forvandling; å tilkalle og binde en flying polyp; mongolenes og manchuenes historie med hensyn til star vampires og mi-go; og en drømmesekvens som viser direkte til Azathoth og Nyarlathotep. Verket omskriver også stoff fra Seven Cryptical Books of Hsan.\n\nSPILLDATA: mandarin. Sanity loss 1D10. Cthulhu Mythos +4/+8. Mythos Rating 36. Elleve uker for fullt studium; en første gjennomlesning tar 6 timer.\n\nFORESLÅTTE FORMLER: Cause/Cure Blindness, Consume Likeness, Dominate, Flesh Ward, Powder of Ibn-Ghazi, Summon/Bind Flying Polyp, Words of Power.\n\nMERK: helter uten mandarin kan, hvis de skaffer boka tilbake til dr. Soong, overtale den gode doktoren til å oversette deler av den — eller lære dem en formel som belønning. Bind Flying Polyp er den som betyr noe den 19. desember.","connects_to":["beat-the-stolen-book","npc-dr-soong","ref-dealing-with-the-polyp"]},{"id":"handout-genuine-note","title":"Handout 3: Det ekte brevet til Virginia","found":false,"description":"Lagt igjen til Virginia Ridley om morgenen 6. desember, i Petersons egen håndskrift.","read_aloud":"  Virginia, hver dag vet jeg at jeg tok det rette valget.\n  Bli med meg til sjøs!\n\n                                        Din kjære Chad","aside":"Bruk det som den kjente skriftprøven avskjedsbrevet sammenlignes mot — og som det lille hjertesukket som gjør at selvmordskjennelsen klinger falskt.","connects_to":["clue-suicide-note-wrong","npc-virginia-ridley"]}],"locations":[{"id":"loc-first-class","title":"Første klasse","deck":"Båtdekk, A-, B- og C-dekk","description":"214–307 passasjerer i ytterlugarer og suiter langs de øvre dekkene og forut. Fire suiter har eget bad og toalett; 32 lugarer deler bad; de fleste av de øvrige er enkeltlugarer med eget bad, og de billigste førsteklassebillettene er dobbeltlugarer med felles dusj. Alle har egen ovn, heldekkende teppe og overdådige lysarmaturer, malerier og møbler. Ingen køyesenger.\n\nSpisesalen på første klasse ligger på C-dekk midtskips, og nås ned en praktfull hovedtrapp forbi et stort veggmaleri av landene Dollar Lines skip anløper. En privat spisesal ligger like ved hovedsalen.\n\nFørste klasse har sitt eget mannskap, som vokter passasjerenes privilegier nidkjært.","visited":false},{"id":"loc-special-class","title":"Spesialklasse","deck":"B-dekk","description":"133 rom rett bak førsteklasselugarene — mindre, med felles bad, men brukes som førsteklasselugarer når etterspørselen tilsier det. 23 lugarer har plass til tre, 16 til fire; enkeltsenger med nedfellbare køyer over den ene eller begge. Spisesalen for spesialklasse ligger på C-dekk, litt lenger akterut enn førsteklassesalen.","visited":false},{"id":"loc-third-class","title":"Tredje klasse","deck":"C-dekk, akterut","description":"170 køyeplasser, ingen av dem i ytterlugarer. Spartanske lugarer med tre eller fire køyer, med plass til seks eller åtte, og faste — ikke nedfellbare — køyer. Hver lugar har speil, toalett og servant, og deler et fellesbad. Spisesalen for tredje klasse ligger helt akterut på C-dekk.\n\nDe fire forseglede lastelukene ligger på dette dekket — som er grunnen til at heltene ender opp her nede.","visited":false},{"id":"loc-steerage","title":"Mellomdekket","deck":"D-dekk, akterut","description":"Opptil 380 mennesker i seks store rom med 60 køyer hver, uten noe privatliv, ved de bråkete rormaskinene og de turboelektriske maskinene som driver propellene. Fungerer også som lasterom fra tid til annen. Mellomdekket bruker tredjeklassesalen etter at tredje klasse har spist.\n\nLengst fra skipets balansepunkt, så hver bølge kaster det høyere opp og ned enn noe annet sted om bord.","visited":false},{"id":"loc-amenities","title":"Fasiliteter og underholdning","deck":"Øvre dekk","description":"MUSIKKROMMET (B-dekk): flygler, harpe og andre instrumenter. Phyllis Barnes opptrer og underviser her.\nRØYKESALONGENE (A- og B-dekk): poker, canasta og bridge. Salongen på første klasse har et Rip Van Winkle-billedteppe, lenestoler i valnøtt, grønne sofaer, spillbord, gulv av grønne og rødlige gummifliser, og en peis i grønn marmor med elektrisk ild. Over peisen henger et glassmaleri, «Damen og enhjørningen». Salongen for spesialklasse på B-dekk har et maleri av Sierra Nevada, et portrett av president Coolidge, vinrøde stoler og enkle kortbord med nedfelte glassholdere og innebygde askebegre i glass.\nGRAND SALON: Raymond Hickler and His Pacific Jazz Orchestra hver kveld. Presidential Dance Orchestra spiller i ballsalen kl. 21.00 presis.\nCONTINENTAL LOUNGE (første klasse, A-dekk): en kuppel av 3 000 glassbiter og seter i blå fløyel. Film og filmavis fredag og lørdag — The Persian Pasha og Chaplins City Lights før Honolulu; At the Kentucky Derby og It Pays to Advertise med Louise Brooks etterpå. Her ligger også den fineste av skipets to barer.\nHAWAIIAN SALOON (C-dekk): den røffere baren. Begge er godt forsynt med brennevin, champagne, viner (også sake) og øl fra San Francisco og Yokohama.\nBIBLIOTEKET OG SKRIVESTUA PÅ FØRSTE KLASSE (A-dekk): et veggmaleri av dyphavets liv og rundt 4 000 bind — skjønnlitteratur, historie, økonomi, humanistiske oppslagsverk og tidsskrifter.\nBASSENGENE: to, åpne kl. 10.00–18.00 med livredder. Bassenget for spesialklasse og tredje klasse over lasterom 6 åpnes først i varmere farvann nær Hawaii.\nDESSUTEN: gymsal, barbersalong, brusbar, to elektriske heiser, mørkerom for fotografer, kapell, og et trykkeri om bord som kunngjør begivenheter og trykker invitasjoner. Hele skipet er klimaanlagt, noe som er uvanlig i 1931.","visited":false},{"id":"loc-bilges","title":"Bunnrommet","deck":"Under lasterommene","description":"Ballastvann, veldige tanker fulle av dieselolje, og lite annet. Rotter og annet skipsutøy er alt av uhygge som finnes — med mindre skapningen er tvunget over i utøyform, for da er det her den holder til.","visited":false,"connects_to":["npc-crawling-one"]},{"id":"loc-boilers","title":"Maskinrom og kjeler","deck":"Midtskips, under dekk","description":"Et inferno, betjent av 45 mann i døgnkontinuerlige skift på 15. De regulerer maskineriet, reparerer turbiner og kjeler, og betjener for hånd det innfløkte rørsystemet som mater dieselolje til kjelene og strøm til de turboelektriske maskinene.\n\nHelter som går inn, blir konfrontert med mindre de har klart Stealth rolls eller har fått en i mannskapet til å gi dem omvisning. Maskinistene fjerner alle som ikke skal være der, varsler offiserene og holder inntrengerne til kapteinen får tid til dem. Bare en Extreme Fast Talk eller Persuade overbeviser maskinistene om at heltene har lov til å gå rundt her nede alene.","visited":false},{"id":"loc-hold-1","title":"Lasterom 1 — baugrommet","deck":"Nederste dekk, forut","description":"ALLTID ULÅST. Møtestedet for tcho-tcho-ene og deres private sammenkomster, unna støyen på mellomdekket.\n\nSPOT HIDDEN finner to ting: restene av et lite bål laget av oppbrukne kasser, minst et døgn kaldt, med forkullede beinbiter i asken; og den utbrente asken fra en opiumspipe (Know eller Science (Chemistry eller Pharmacy) for å kjenne den igjen).\n\nHelter som leter her om natta, møter tcho-tcho-ene, som ikke liker inntrengingen med mindre heltene kan vise at de arbeider for dr. Soong.","visited":false,"connects_to":["clue-cold-fire","npc-tcho-tcho"]},{"id":"loc-hold-2","title":"Lasterom 2 — passasjerbagasje","deck":"Nederste dekk","description":"LÅST. Godt over 2 700 kolli: skipskofferter, kister, safer, tunge vesker, pakker i brunt papir og hyssing, hattesker, omhyggelig innpakkede urner og glassvarer, to dusin kasser fransk vin, og nok instrumenter til et lite symfoniorkester.\n\nPassasjerenes våpen og geværer oppbevares her — deriblant Alex Hubbards Winchester og hagle.","visited":false,"connects_to":["npc-alex-hubbard"]},{"id":"loc-hold-3","title":"Lasterom 3 — kjølerommet","deck":"Nederste dekk","description":"Låst med et håndtak som lett lar seg vri opp. Ferskvarer — kjøtt, frukt, melk og annen mat — samt blomster, vitenskapelige prøver og medisinsk utstyr. Kokkene er innom ofte for å fylle opp spiskammersene, noe som gjør dette til det lasterommet det er lettest å bli sett i på lovlig vis.","visited":false},{"id":"loc-hold-4","title":"Lasterom 4 — kasser og ballasttanker","deck":"Nederste dekk","description":"ULÅST. Over 2 000 trekasser, kister og skipskofferter, og en rekke ballasttanker.\n\nÅPNES TANKENE: de forråtnede restene av Phyllis Barnes. Å åpne den øvre luka slipper ut en sky av ufattelig vemmelig gass — CON roll eller kast opp av stanken. Å oppdage liket krever en Sanity roll (0/1D2).","visited":false,"connects_to":["clue-ballast-tank","npc-phyllis-barnes"]},{"id":"loc-hold-5","title":"Lasterom 5 — kenneler og buskap","deck":"Nederste dekk","description":"Alltid oppvarmet, bemannet og ulåst, og hele rommet lukter dyr. 20 sjøsyke kyr, fem fullblodshester med stallkaren Arthur Pendury (som er innom tre ganger daglig og av og til sover her framfor på mellomdekket), over 30 hunder og 14 katter — alt passet av kenneljenta James Hawthorne, 17 år.\n\nHawthorne er det beste vitnet om bord, og hun er i ferd med å gå i oppløsning.","visited":false,"connects_to":["npc-james-hawthorne","clue-kennel-boy"]},{"id":"loc-hold-6","title":"Lasterom 6 — kjøretøy og last","deck":"Nederste dekk","description":"ULÅST. Tre splitter nye Packard-sedaner, en Hudson turvogn, en Bugatti racer og et dusin Oliver-traktorer surret fast til dekket. Store containere med postsekker — hundrevis, om ikke tusenvis. Et dusin tønner fransk konjakk. Femti tønner merket «Hawaiian Botanical Specimens». En stor kasse merket «Funeral Supplies», med liket av en tcho-tcho som døde i San Francisco og sendes hjem på dr. Soongs regning.\n\nBassenget for spesialklasse og tredje klasse rigges som en avtakbar presenning over dette lasterommet.\n\nHVA SOM FAKTISK ER I TØNNENE, avgjør du: botanikk, noe ulovlig stuet inn av tcho-tcho-ene, eller menneskelik. Vaker heltene her, kan de få se en tønne bli åpnet og innholdet kokt og spist (Sanity 1/1D4), eller se «Chad Peterson» tilby tcho-tcho-ene en avtale.","visited":false,"connects_to":["beat-the-tcho-tcho","clue-funeral-supplies"]},{"id":"loc-hold-7","title":"Lasterom 7 — VERDIROMMET","deck":"Nederste dekk","description":"DOBBELTLÅST: en hengelås (Locksmith) og en slåbolt i luka (Hard Locksmith). Det er her alt sammen er.\n\nINNHOLD: tjueto oljemalerier i kasser, fire bronse- og fire marmorstatuer (også i kasser), en enorm forsendelse redwood-planker og -tømmer, seksten store glassballonger med farlige kjemikalier som eter og saltsyre, et skap med skipets beholdning av håndvåpen, geværer og hagler — og to ting som betyr noe:\n\nDEN GRØNNE METALLKASSA. To meter høy, låst (Hard Locksmith eller Hard STR for å bryte den opp). Ingeniørtegninger for energiinnretningen, med notater om montering, materialer, kostnader og konstruksjon, dekket av håndskrevne okkulte symboler. Å kjenne dem igjen som konstruksjonstegninger er enkelt (Mechanical Repair eller Science (Engineering)); å forstå at innretningen skal tilkalle uhyrer gjennom mekaniske midler for å fange essensen deres, krever en Cthulhu Mythos roll og minst to timers studium.\n\nORGELKASSA. Diger, merket «Wm. Wood Pipe Organ Co., Inc. of Portland, Oregon». Spot Hidden (Hard uten lyskilde) ser blodflekker på panelet på venstre side, og at skruene er skrudd ut og inn igjen mange ganger. Å åpne eller slå den opp er lett, og avdekker Pipes of Leng.\n\nSKAPNINGEN LIKER DÅRLIG at artefakten dens blir funnet. En enslig helt kan få en formel over seg — Mindblast, Dominate, Mental Suggestion. En gruppe kan få en hunting horror. Prøv å avlede heltene framfor å konfrontere dem for tidlig — med mindre du nærmer deg et passende klimaks, og da kaster du deg uti det.\n\nSALTSYREN i glassballongene gjør 1D10 per runde mot polyppen og ignorerer rustningen dens. Husk at den står her.","visited":false,"connects_to":["clue-green-metal-box","clue-blood-on-the-crate","npc-pipes-of-leng","beat-the-final-test"]}],"reference":[{"id":"ref-ship-stats","title":"SS President Coolidge — fullstendige data","description":"Bygget i august 1931 ved Newport News-verftet for Dollar Line — fire måneder gammel, og det største passasjerskipet som noen gang er bygget i USA (om enn ikke stort etter europeisk målestokk).\n\nSTØRRELSE\nLengde 654 fot | Bredde 81 fot | Dypgang 34 fot\nBruttotonnasje 21 936 tonn | Deplasement 30 924 tonn\nDekk: tre over hoveddekket, fem under\n\nLAST\nKapasitet 608 850 kubikkfot | Sju lasterom, fire nås fra dekk\nPlass til 100 kjøretøy i lasterom 4 | Kjølerom på 70 000 kubikkfot i lasterom 6\n18 lastevinsjer på 35 hk, løfter 3 000 pund direkte med 340 fot vaier i minuttet\nSeks Welin McLachlan-gravitasjonsdavider for livbåter; to båtvinsjer på 25 hk til lektere; seks kapstanvinsjer fra American Engineering Company\n\nVÅPEN OM BORD\nEn beholdning håndvåpen, geværer og hagler (til leirdueskyting) innelåst i lasterom 7. Kapteinen har en revolver innelåst i lugaren sin. Det finnes ikke sprengstoff om bord.\n\nMASKINERI\nTo turboelektriske Westinghouse på 13 250 hk | 12 høytrykkskjeler fra Babcock and Wilcox, fyrt med olje\nDamptrykk 300 psi | Kjeltemperatur 620 °F | To turbiner på 14 000 bhk | To propeller\nPropellturtall 133 o/min ved 22,2 knop | Toppfart 22,2 knop | Marsjfart 20 knop\nBunkers 6 240 tonn | Rekkevidde 19 500 nautiske mil i marsjfart, 14 500 for full fart\n\nFASILITETER\nMaks passasjerer 990 | Nødvendig besetning 324 | Maks om bord 1 314\nFerskvann 2 320 tonn | Belysning fra fire hjelpeturbingeneratorer på 500 kW, 240/120 volt\nTo svømmebasseng, ett på første klasse og ett som avtakbar presenning over lasterom 6\n\nDENNE REISEN: 678 passasjerer og 315 mann besetning, San Francisco til Shanghai via Honolulu. Fem døgn til Honolulu (5.–10. des), ni døgn videre til Shanghai (11.–19. des), beregnet ankomst kl. 06.00 den 20."},{"id":"ref-segregation","title":"Å bevege seg mellom klassene","description":"Skipet er svært synlig og gjennomført klassedelt. Første klasse, spesialklasse, tredje klasse og mellomdekket blandes nesten aldri, og dette er en reell hindring for et selskap som er spredt over flere dekk.\n\nÅ GÅ NED en klasse er mulig, selv om stuertene misliker at folk «slummer».\n\nÅ GÅ OPP er langt vanskeligere. Trappene voktes av stuerter, og de tre elektriske heisene har mannskap som heisførere (én heis er bare for last, inn på kjøkkenet). En passasjer trenger en invitasjon, en bestikkelse til et korrupt besetningsmedlem, eller en vellykket INTIMIDATE, CHARM, PERSUADE eller FAST TALK roll for å gå opp et dekk.\n\nÅ KLATRE er den farlige veien: en HARD CLIMB roll uten tau, vanlig vanskegrad med. Bommer man, faller man over bord — eller, i visse partier av skroget opp mot første klasse, ni meter ned på dekk for 3D6 skade. En snill Keeper kan la en vellykket Jump halvere skaden.\n\nBLIR MAN TATT: passasjerer fra første klasse og spesialklasse blir høflig fjernet og bestemt frarådet å komme tilbake. Tredje klasse behandles hardere. Passasjerer fra mellomdekket kan bli lenket til køya hvis de stadig sniker seg av gårde.\n\nMANNSKAPET kan bevege seg mellom klassene uten særlige problemer — som er grunnen til at en stjålet uniform er så mye verdt, og hvorfor skapningen bruker en."},{"id":"ref-key-rolls","title":"Alle slag i scenarioet, samlet på ett sted","description":"ETTERFORSKNING\nListen — høre oppstyret den 6. des; overhøre mannskapet om forvalteren; høre Soongs rop under tyveriet; høre den fjerne musikken om natta. HARD LISTEN plasserer musikken under dekk.\nSpot Hidden — «Funeral Supplies»-kassa på kaia; rotteskinnet i lasterommene; det kalde bålet og opiumsasken i lasterom 1; de gjenåpnede skruene på orgelkassa. HARD SPOT HIDDEN — blod på panelet uten lyskilde (vanlig vanskegrad med lys); forskjellene i håndskriften på avskjedsbrevet.\nPsychology — Hallander er i sjokk; en ny roll avslører løgnene; Hawthorne er livredd og trolig gal.\nArt/Craft (Calligraphy) — den forfalskede underskriften.\nCthulhu Mythos — hva tegningene faktisk er til (pluss to timers studium); riktig antall magic points for å binde polyppen.\nMechanical Repair eller Science (Engineering) — kjenne igjen konstruksjonstegningene.\nScience (Biology/Zoology) eller Art/Craft (Leatherwork) — rotteskinnet kan ikke ha blitt flådd.\nKnow eller Science (Chemistry/Pharmacy) — kjenne igjen opiumsaske.\n\nSOSIALT\nHard Persuade — få se passasjerlisten.\nIntimidate eller Persuade — få Hallander til å snakke.\nHard Charm eller Persuade — vinne kapteinens tillit.\nExtreme Fast Talk eller Persuade — overbevise maskinistene om at du har lov til å være under dekk.\nExtreme Persuade eller Fast Talk, eller Hard Psychoanalysis — snakke Bates ned fra gisseltakingen.\nHard Persuade eller Hard Psychoanalysis — styrke Bates mot Dominate (gir ham en bonusterning).\nIntimidate/Charm/Persuade/Fast Talk — gå opp et dekk.\n\nFYSISK\nJump — følge skapningens hopp ned på promenadedekket, ellers 1D6+3. Halverer også 3D6-fallskaden ved klatring i skroget.\nHard Climb — klatre mellom dekk uten tau (vanlig vanskegrad med tau).\nLocksmith — lastelukene; hengelåsen på lasterom 7; å bryte seg inn i Petersons lugar (eller Mechanical Repair). HARD LOCKSMITH — slåbolten på lasterom 7 og den grønne metallkassa.\nExtreme STR — tvinge opp en vanntett luke. HARD STR med brekkjern, eller for å bryte opp den grønne kassa.\nStealth — komme forbi vaktholdet på lastelukene og i maskinrommet.\nCON — unngå sjøsyke 18.–19. des; unngå å kaste opp ved ballasttanken.\n\nOPPOSED POW\nmot POW 100 — skapningens Mindblast og Dominate.\nmot POW 80 — Bind Flying Polyp (dette slaget kan ikke pushes)."},{"id":"ref-sanity","title":"Sanity-tap underveis","description":"Mindblast fra skapningen — 5 poeng og et umiddelbart anfall av galskap (opposed POW roll mot POW 100; ingen virkning hvis helten vinner).\nSe skapningen skifte form, eller se dens egentlige skikkelse — 1D3/2D6.\nSe tcho-tcho-ene koke og spise innholdet i en tønne — 1/1D4.\nFinne Phyllis Barnes i ballasttanken — 0/1D2.\nFlying polyp — 1D3/1D20, slås av alle om bord, fordi raseriet holder den synlig.\nHunting horror — 1D3/1D20.\nLese Book of Red Jade — 1D10 (Cthulhu Mythos +4/+8).\nKaste Bind Flying Polyp — 1 poeng.\nStadig større flådde dyr nede i lasterommene — be om slag der det passer."},{"id":"ref-sanity-awards","title":"Sanity-belønninger til slutt","description":"+1D6   Heltene hindrer Bunny Bates i å drepe gisselet\n+1D4   Heltene ødelegger energiinnretningen\n+2D6   Heltene fanger eller dreper skapningen\n−1D6   Skapningen slipper unna\n+1D20  Heltene beseirer polyppen\n+1D10  Heltene prøver å redde så mange som mulig fra å drukne\n−1D10+2 Heltene forlater skipet uten tanke for andre"},{"id":"ref-dealing-with-the-polyp","title":"Å håndtere polyppen — de tre utveiene","description":"1. ØDELEGG PIPENE. 50 poeng skade mot armor 3 stanser maskinen og lar polyppen dra. Sprengstoff ville hjulpet; det finnes ikke om bord. Når musikken stanser, kan polyppen bruke noen runder på å oppdage det — la den angripe så lenge du vil, og la den så plutselig stanse, snu, fly oppover og skyte ned i dypet.\n\n2. BIND DEN. Helter som har Book of Red Jade, kan forsøke Bind Flying Polyp. Den som kaster, kan ikke være i kamp med vesenet, må være innenfor 90 meter, og må vinne en opposed POW roll mot POW 80 — dette slaget KAN IKKE PUSHES. Formelen koster 1 Sanity point. Kasteren kan investere magic points tilsvarende en femtedel av vesenets POW (16 MP) for å få en bonusterning — men vet ikke vesenets POW, så det er et sjansespill; en vellykket Cthulhu Mythos roll gir riktig antall. Bundet faller polyppen under kasterens kommando og kan beordres ned i dypet igjen.\n\n3. SLÅSS MOT DEN. Trolig det vanskeligste alternativet. 4 poeng rustning, og den tar bare MINIMUM skade fra fysiske våpen — men fortryllede våpen, ild og elektriske angrep gjør full skade. Saltsyren i glassballongene i lasterom 7 gjør 1D10 per runde og ignorerer rustningen. For høyt pulp-nivå kan militært anlagte helter kalle inn nærliggende britiske, amerikanske eller japanske krigsskip: et batteri skipskanoner gjør 10D10, og en salve eller to bør ødelegge den eller såre den så alvorlig at den trekker seg ned i havet.\n\nDØR DEN, smeller kroppen ned på skipet med et tungt brak og begynner å gå i oppløsning nesten umiddelbart. I løpet av minutter er det ikke annet igjen enn en fettete væske og en vond lukt.\n\nUANSETT ER SKIPET TAPT. Hullet i skroget betyr at Coolidge tar inn vann og krenger. Spør heltene hva de vil gjøre."},{"id":"ref-optional-mayhem","title":"Valgfritt: mer kaos og gru (høyt pulp-nivå)","description":"For Keepere som vil kjøre dette på fullt pulp-nivå, bruker skapningen formelen Graveyard Kiss til å lage zombier.\n\nI denne varianten kaster den ikke likene av ofrene over bord, men lar Bates gjemme dem rundt om i lasterom 7 som en sikkerhet. Ved første tegn til trøbbel vekker den dem og sender dem etter de nærmeste levende menneskene — som betyr zombier som klatrer opp fra underdekkene og setter alle om bord i fare.\n\nSom skrevet er det bare fem zombier, som er lite utfordring for helter i Pulp Cthulhu. For å skalere det opp: la hver zombie lage flere. Skapningens variant av formelen krever at den legger en del av insektmassen sin i munnen på et lik for å vekke det, og vekkede zombier kan gjøre det samme — insekter som hopper fra deres munn og inn i munnen på passasjerer de har drept. I teorien kan en fullskala zombieapokalypse overta skipet mens heltene står overfor polyppen.\n\nZombiene er også en utmerket erstatning for Bunny Bates i gisselscenen, hvis Bates allerede er ute av bildet."},{"id":"ref-troublesome-heroes","title":"Valgfritt: når heltene kommer deg i forkjøpet","description":"GJØR DE LIVET SURT for skapningen, eller trenger handlingen et dytt, går Bunny Bates til overraskelsesangrep — særlig hvis de nærmer seg Almacans lugar eller snuser rundt lastelukene. Han kan dukke opp i døra til en helts lugar, eller hoppe fram mot dem nede i lasterommet.\n\nFOR VIRKELIG HARD MEDFART tilkaller skapningen en hunting horror som jakter dem ned. Det vekker mye oppmerksomhet, så den timer angrepet slik at færrest mulig ser det.\n\nNÅR DE NÅR PIPENE FOR TIDLIG, avled framfor å konfrontere: en enslig helt får en formel over seg (Mindblast, Dominate, Mental Suggestion), eller en gruppe trekker til seg en hunting horror. Går det dårlig for skapningen, oppløser den seg og kommer tilbake til maskinen senere. Ødelegger heltene Pipes of Leng, retter den blikket fast mot hevn.\n\nMISTER DU BATES TIDLIG — drept, i arresten, tatt til fange — dominerer skapningen stuert Martin Aimesworthy og setter ham inn i alle senere scener. Alternativt, for å holde det enkelt: la den dominere en annen NPC til å hindre heltene, slik at Bates overlever til sin rolle i klimakset."},{"id":"ref-dining","title":"Kulisser: måltider, underholdning og livet om bord","description":"En vanlig middag dekker minst 200 om gangen, og det ventes at man reserverer bord. Hummer, fasan og kalvekjøtt er forbeholdt første klasse — men selv tredje klasse spiser bedre enn mange ville gjort på land.\n\nFØRSTE KLASSE — sju retter. Hors d'oeuvres og østers; consommé Olga eller byggsuppe med fløte; laks med mousseline-saus og agurk; filet mignon, sautert kylling Lyonnaise eller friske grønnsaker; deretter lam i myntesaus, andestek i eplesaus eller oksemedaljonger med grønne erter, kokt ris, gulrøtter i fløte, kokte nypoteter og poteter Parmentier; så punch romaine, stekt due med crêper, kald asparges i vinaigrette, gåselever og selleri; og til dessert Waldorf-pudding, fersken i chartreusegelé, sjokolade- og vaniljeeclairs, eller fransk iskrem. Presidential Dance Orchestra spiller i førsteklassesalongen kl. 18.00–21.00 hver kveld, og tar imot ønsker.\n\nSPESIALKLASSE — consommé, ovnsbakt kolje i krydret saus, deretter karrikylling, vårlam i myntesaus eller kalkunstek med tyttebær, med grønne erter, kålrotstappe, kokt ris og kokte og stekte poteter. Dessert: plumpudding, vingelé, kokossmørbrød eller amerikansk iskrem, samt nøtter, frisk frukt, ost, kjeks og kaffe. Pacific Jazz Orchestra spiller kl. 19.00–21.00 annenhver kveld.\n\nTREDJE KLASSE — rissuppe, saltkjøtt og kål, kokte poteter, kjeks, ferskt brød og smør, stuede epler og ris til dessert, kaffe til desserten. Menyen skifter daglig, men måltidet er fast for dagen, servert kl. 18.00–20.00.\n\nMELLOMDEKKET — vasstrukket saltkjøtt og kål, kokte gulrøtter, kokte poteter, rispudding. Menyen skifter sjelden; av og til grønne bønner, eller bacon i potetsalat, eller ris i stedet for poteter. Servert kl. 20.00–21.00, etter at tredje klasse er ferdig.\n\nRØYKING: ikke forbudt innendørs generelt, men tredje klasse og mellomdekket forventes å røyke ute på C-dekk, under oppsyn av stuerter som frykter sigaretter, piper og sigarer som brannfare.\n\nTRYKKERIET kunngjør begivenheter, fester, festmiddager og merkedager. Helter på første klasse og spesialklasse får både telegrammer fra kyststasjoner og nytrykte invitasjoner til nissefesten (6. des), kasinokvelden (7. des), Tahiti-ballet (9. des) og søndagsmessen (morgenen 6., 13. og 20. des)."},{"id":"ref-pacing","title":"Et ord om tempo","description":"Scenarioet utspiller seg over mange døgn, noe som lar deg bygge opp mot klimakset — og som betyr at du må drive tida framover for å komme dit.\n\nSpillere vil ofte bruke hver time av hver dag på etterforskningen. Motvirk det ved å presse tempoet. Hold fokus på handlingen, hold farten oppe, og kjør historien på skinner: si rett ut at du spoler fram til det som betyr noe.\n\nGi dem tid til å utforske og snakke med NPCer, men vær klar til å kaste situasjoner, spørsmål og scener mot dem for å holde spillet i gang. Tidslinja er vennen din her — når du er i tvil, hopp til neste daterte hendelse."}]}]</script>

<script>
"use strict";

/* ==================================================================
   LAGRING

   To bakender bak samme API. Når siden kjører som en publisert
   artifact finnes «db», og da følger fremdrift, notater og karakterer
   med mellom telefon og PC. Ellers — lokal fil, offline, en nettleser
   uten den kapabiliteten — brukes localStorage, og alt ligger lagret
   i den nettleseren. localStorage skrives uansett, som offline-kopi.
   ================================================================== */

const PREFIX = "eldritch:";
let remote = null;          // db-namespace, eller null
let remoteReady = false;

function lsGet(key) {
  try {
    const raw = localStorage.getItem(PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); }
  catch (e) { /* full eller blokkert — vi har fortsatt db-en */ }
}
function lsDel(key) {
  try { localStorage.removeItem(PREFIX + key); } catch (e) {}
}

const store = {
  async get(key) {
    if (remote) {
      try {
        const snap = await remote.doc("state/" + key.replace(/\//g, "_")).get();
        if (snap && snap.exists && snap.data && "value" in snap.data) {
          lsSet(key, snap.data.value);
          return snap.data.value;
        }
      } catch (e) { /* faller gjennom til lokal kopi */ }
    }
    return lsGet(key);
  },
  async set(key, value) {
    lsSet(key, value);
    if (remote) {
      try {
        await remote.doc("state/" + key.replace(/\//g, "_")).set({ value });
      } catch (e) { /* lokal kopi er allerede skrevet */ }
    }
  },
  async del(key) {
    lsDel(key);
    if (remote) {
      try { await remote.doc("state/" + key.replace(/\//g, "_")).delete(); }
      catch (e) {}
    }
  },
};

async function connectRemote() {
  const chip = document.getElementById("sync-chip");
  try {
    if (window.claude && typeof window.claude.use === "function") {
      remote = await window.claude.use("db");
    }
  } catch (e) { remote = null; }
  remoteReady = true;
  if (remote) {
    chip.textContent = "Synkes mellom enheter";
    chip.className = "chip live";
    chip.title = "Fremdrift, notater og karakterer følger med til andre " +
                 "enheter der du åpner denne siden.";
  } else {
    chip.textContent = "Lagret i nettleseren";
    chip.className = "chip local";
    chip.title = "Alt lagres i denne nettleseren. Bruk Eksporter i " +
                 "Biblioteket for å flytte det over på en annen maskin.";
  }
}

/* ==================================================================
   MODELL
   ================================================================== */

const SECTIONS = ["clues", "timeline", "beats", "npcs", "handouts",
                  "locations", "reference"];
const FLAGS = { clues: "found", timeline: "triggered",
                beats: "done", locations: "visited",
                handouts: "found" };

const state = {
  library: { items: [], active: null, seeded: {} },
  scenario: null,     // aktivt innhold, med fremdrift lagt på
  scenarioId: null,
  progress: null,     // { flags, notes, itemNotes, sessions }
  characters: [],
  view: "overview",
  query: "",
  hideDone: false,
};

function slugify(text, fallback) {
  const s = String(text || "").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return s.slice(0, 60) || fallback || "scenario";
}

function ensureIds(data) {
  SECTIONS.forEach((sec) => {
    (data[sec] || []).forEach((item, i) => {
      if (!item.id) {
        item.id = sec + "-" + i + "-" +
          slugify(item.title || item.name || "", String(i));
      }
    });
  });
  return data;
}

function emptyProgress() {
  return { flags: {}, notes: "", itemNotes: {}, sessions: [] };
}

function applyProgress(data, prog) {
  SECTIONS.forEach((sec) => {
    const flag = FLAGS[sec];
    (data[sec] || []).forEach((item) => {
      if (flag) item[flag] = !!prog.flags[item.id];
      const note = prog.itemNotes[item.id];
      item.userNotes = note || "";
    });
  });
  return data;
}

function contentOnly(data) {
  const copy = {};
  Object.keys(data).forEach((k) => {
    if (k !== "notes" && k !== "sessions") copy[k] = data[k];
  });
  return copy;
}

function counts(data) {
  const out = {};
  ["clues", "timeline", "beats", "npcs", "handouts", "locations",
   "reference"].forEach((k) => { out[k] = (data[k] || []).length; });
  return out;
}

/* ------------------------- bibliotek ---------------------------- */

async function loadLibrary() {
  const lib = await store.get("library");
  state.library = lib && typeof lib === "object"
    ? Object.assign({ items: [], active: null, seeded: {} }, lib)
    : { items: [], active: null, seeded: {} };
  if (!Array.isArray(state.library.items)) state.library.items = [];
  // seeded er {id: versjon}. Eldre lagringer har en liste; den
  // konverteres i seedBundled(), så her skal den bare ikke nullstilles.
  if (!state.library.seeded || typeof state.library.seeded !== "object") {
    state.library.seeded = {};
  }
}

async function saveLibrary() { await store.set("library", state.library); }

async function addScenario(data, makeActive) {
  ensureIds(data);
  const id = data.id ? slugify(data.id) : slugify(data.title);
  await store.set("content/" + id, contentOnly(data));

  // Notater og sesjoner i importfila er startinnhold. De skal aldri
  // tråkke over det brukeren selv har skrevet.
  const prog = (await store.get("progress/" + id)) || emptyProgress();
  if (data.notes && !prog.notes) prog.notes = data.notes;
  if (data.sessions && data.sessions.length && !prog.sessions.length) {
    prog.sessions = data.sessions;
  }
  await store.set("progress/" + id, prog);

  state.library.items = state.library.items.filter((it) => it.id !== id);
  state.library.items.push({
    id: id,
    title: data.title || "(uten tittel)",
    system: data.system || "",
    imported: new Date().toISOString().slice(0, 16).replace("T", " "),
    counts: counts(data),
  });
  state.library.items.sort((a, b) => a.title.localeCompare(b.title, "nb"));
  if (makeActive || !state.library.active) state.library.active = id;
  await saveLibrary();
  return id;
}

async function deleteScenario(id) {
  await store.del("content/" + id);
  await store.del("progress/" + id);
  state.library.items = state.library.items.filter((it) => it.id !== id);
  if (state.library.active === id) {
    state.library.active = state.library.items.length
      ? state.library.items[0].id : null;
  }
  await saveLibrary();
  await loadActive();
}

async function loadActive() {
  const id = state.library.active;
  state.scenarioId = id;
  if (!id) { state.scenario = null; state.progress = null; return; }
  const content = await store.get("content/" + id);
  if (!content) { state.scenario = null; state.progress = null; return; }
  const prog = Object.assign(emptyProgress(),
                             (await store.get("progress/" + id)) || {});
  state.progress = prog;
  state.scenario = applyProgress(ensureIds(content), prog);
  state.scenario.notes = prog.notes;
  state.scenario.sessions = prog.sessions;
}

async function saveProgress() {
  if (!state.scenarioId) return;
  await store.set("progress/" + state.scenarioId, state.progress);
}

async function seedBundled() {
  const node = document.getElementById("bundled-scenarios");
  let bundled = [];
  try { bundled = JSON.parse(node.textContent) || []; } catch (e) { return; }

  // Eldre lagringer har «seeded» som en liste med id-er. Regn dem som
  // versjon 1, slik at et oppdatert innebygd scenario byttes inn.
  let seeded = state.library.seeded;
  if (Array.isArray(seeded)) {
    const migrated = {};
    seeded.forEach((id) => { migrated[id] = 1; });
    seeded = migrated;
  } else if (!seeded || typeof seeded !== "object") {
    seeded = {};
  }
  state.library.seeded = seeded;

  let changed = false;
  for (const data of bundled) {
    const key = data.id || slugify(data.title);
    const version = data.version || 1;
    if (seeded[key] === version) continue;
    seeded[key] = version;
    changed = true;
    // Innholdet byttes ut; fremdriften ligger i en egen nøkkel og
    // røres ikke av addScenario().
    await addScenario(JSON.parse(JSON.stringify(data)),
                      !state.library.active);
  }
  if (changed) await saveLibrary();
}

function findItem(id) {
  if (!state.scenario) return null;
  for (const sec of SECTIONS) {
    const hit = (state.scenario[sec] || []).find((x) => x.id === id);
    if (hit) return { section: sec, item: hit };
  }
  return null;
}

async function toggleFlag(id) {
  const hit = findItem(id);
  if (!hit) return;
  const flag = FLAGS[hit.section];
  if (!flag) return;
  hit.item[flag] = !hit.item[flag];
  if (hit.item[flag]) state.progress.flags[id] = true;
  else delete state.progress.flags[id];
  await saveProgress();
  render();
}

async function setItemNote(id, text) {
  const hit = findItem(id);
  if (!hit) return;
  hit.item.userNotes = text;
  if (text.trim()) state.progress.itemNotes[id] = text;
  else delete state.progress.itemNotes[id];
  await saveProgress();
}

async function resetProgress() {
  state.progress.flags = {};
  await saveProgress();
  await loadActive();
  render();
  toast("Fremdrift nullstilt");
}

let toastTimer = null;
function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach((k) => {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else if (k === "html") node.innerHTML = props[k];
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), props[k]);
      else if (props[k] !== null && props[k] !== undefined && props[k] !== false) {
        node.setAttribute(k, props[k]);
      }
    });
  }
  (children || []).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function matches(item, query) {
  if (!query) return true;
  const hay = [item.title, item.name, item.description, item.where,
               item.day, item.when, item.act, item.deck, item.role,
               item.category, item.roll, item.userNotes]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(query.toLowerCase()) !== -1;
}

function debounce(fn, ms) {
  let t = null;
  return function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(null, args), ms);
  };
}

/* ---------------------------- terning --------------------------- */

function rollSkill(target) {
  const roll = 1 + Math.floor(Math.random() * 100);
  let label, cls;
  if (roll === 1) { label = "KRITISK"; cls = "res-crit"; }
  else if (roll <= Math.floor(target / 5)) { label = "Ekstrem"; cls = "res-extreme"; }
  else if (roll <= Math.floor(target / 2)) { label = "Hard"; cls = "res-hard"; }
  else if (roll <= target) { label = "Suksess"; cls = "res-reg"; }
  else if (roll === 100 || (roll >= 96 && target < 50)) { label = "FUMLE"; cls = "res-fumble"; }
  else { label = "Bom"; cls = "res-fail"; }
  return { roll, label, cls };
}

function setupDice() {
  const input = document.getElementById("dice-target");
  const out = document.getElementById("dice-out");
  function go() {
    const target = Math.max(1, Math.min(99, parseInt(input.value, 10) || 50));
    const r = rollSkill(target);
    out.className = "dice-out " + r.cls;
    out.innerHTML = "";
    out.appendChild(el("b", { text: String(r.roll) }));
    out.appendChild(document.createTextNode(" · " + r.label));
  }
  document.getElementById("dice-roll").addEventListener("click", go);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

let lastFocus = null;

function closeModal() {
  document.getElementById("scrim").hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function openModal(title, subtitle, buildBody, footButtons) {
  lastFocus = document.activeElement;
  const scrim = document.getElementById("scrim");
  const head = document.getElementById("modal-title");
  head.textContent = title;
  const sub = el("span", { class: "modal-sub", id: "modal-sub",
                           text: subtitle || "" });
  head.appendChild(sub);

  const body = document.getElementById("modal-body");
  body.innerHTML = "";
  buildBody(body);
  body.scrollTop = 0;

  const foot = document.getElementById("modal-foot");
  foot.innerHTML = "";
  (footButtons || []).forEach((b) => foot.appendChild(b));
  foot.hidden = !(footButtons && footButtons.length);

  scrim.hidden = false;
  document.getElementById("modal-close").focus();
}

function noteEditor(item) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Dine notater" }));
  const status = el("div", { class: "savestate" });
  const area = el("textarea", {
    class: "field", rows: "4", id: "note-" + item.id,
    placeholder: "Hva skjedde da spillerne kom hit?",
  });
  area.value = item.userNotes || "";
  const save = debounce(async () => {
    await setItemNote(item.id, area.value);
    status.textContent = "Lagret " +
      new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
    status.className = "savestate saved";
  }, 700);
  area.addEventListener("input", () => {
    status.textContent = "Lagrer…";
    status.className = "savestate";
    save();
  });
  wrap.appendChild(status);
  wrap.appendChild(area);
  return wrap;
}

function crossRefs(item) {
  const refs = item.connects_to || [];
  if (!refs.length) return null;
  const labels = { clues: "Spor", timeline: "Tidslinje", beats: "Scene",
                   npcs: "NPC", handouts: "Handout", locations: "Sted",
                   reference: "Oppslag" };
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Se også" }));
  const stack = el("div", { class: "stack" });
  refs.forEach((ref) => {
    const hit = findItem(ref);
    if (!hit) return;
    stack.appendChild(el("button", {
      class: "entry", type: "button",
      onclick: () => openItem(hit.item, hit.section),
    }, [
      el("span", { class: "entry-open", text: labels[hit.section] || hit.section }),
      el("span", { class: "entry-body" }, [
        el("span", { class: "entry-title",
                     text: hit.item.title || hit.item.name || ref }),
      ]),
      el("span", { class: "entry-open", text: "ÅPNE" }),
    ]));
  });
  if (!stack.children.length) return null;
  wrap.appendChild(stack);
  return wrap;
}

function openItem(item, section) {
  if (section === "npcs") return openNpc(item);

  const subtitle = ["act", "day", "when", "where", "deck"]
    .map((k) => item[k]).filter(Boolean).join(" · ");

  openModal(item.title || item.name || "?", subtitle, (body) => {
    if (item.roll) {
      body.appendChild(el("div", { class: "callout" }, [
        el("p", { class: "eyebrow", text: "Slag" }),
        el("p", { text: item.roll }),
      ]));
    }
    if (item.description) {
      body.appendChild(el("p", { class: "prose", text: item.description }));
    }
    // Det som faktisk skal leses høyt eller vises fram, i egen ramme.
    if (item.read_aloud) {
      body.appendChild(el("p", { class: "eyebrow", text: "Les høyt" }));
      body.appendChild(el("div", { class: "readaloud", text: item.read_aloud }));
    }
    if (item.aside) {
      body.appendChild(el("p", { class: "prose tight", text: item.aside }));
    }
    if (item.body) body.appendChild(el("p", { class: "prose", text: item.body }));
    const refs = crossRefs(item);
    if (refs) body.appendChild(refs);
    if (item.id) body.appendChild(noteEditor(item));
  }, modalActions(item, section));
}

function modalActions(item, section) {
  const buttons = [];
  const flag = FLAGS[section];
  if (flag && item.id) {
    const on = !!item[flag];
    buttons.push(el("button", {
      class: on ? "btn" : "btn primary", type: "button",
      text: on ? "Fjern kryss" : (section === "handouts" ? "Marker utdelt" : "Kryss av"),
      onclick: async () => { await toggleFlag(item.id); closeModal(); },
    }));
  }
  if (item.id && state.progress) {
    buttons.push(el("button", {
      class: "btn small", type: "button", text: "Til sesjonslogg",
      onclick: () => { copyToSession(item); closeModal(); },
    }));
  }
  return buttons;
}

function openNpc(npc) {
  openModal(npc.name || "?", [npc.category, npc.role].filter(Boolean).join(" · "),
    (body) => {
      if (npc.description) {
        body.appendChild(el("p", { class: "prose", text: npc.description }));
      }
      if (npc.traits) {
        body.appendChild(el("div", { class: "section-label", text: "Trekk" }));
        body.appendChild(el("p", { text: npc.traits }));
      }
      if (npc.quotes && npc.quotes.length) {
        body.appendChild(el("div", { class: "section-label", text: "Replikker" }));
        npc.quotes.forEach((q) => body.appendChild(el("p", { class: "quote", text: q })));
      }
      if (npc.forms) {
        body.appendChild(el("div", { class: "section-label", text: "Skikkelser" }));
        body.appendChild(el("p", { class: "prose", text: npc.forms }));
      }
      if (npc.stats && Object.keys(npc.stats).length) {
        body.appendChild(el("div", { class: "section-label", text: "Karakteristikker" }));
        const order = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW", "EDU",
                       "SAN", "HP", "MP", "Luck", "DB", "Build", "Move", "Armor"];
        const keys = order.filter((k) => k in npc.stats)
          .concat(Object.keys(npc.stats).filter((k) => order.indexOf(k) === -1));
        const grid = el("dl", { class: "statgrid" });
        keys.forEach((k) => {
          grid.appendChild(el("div", { class: "stat" }, [
            el("dt", { text: k }),
            el("dd", { text: String(npc.stats[k]) }),
          ]));
        });
        body.appendChild(grid);
      }
      [["combat", "Kamp"], ["pulp_talents", "Pulp-talenter"]].forEach((pair) => {
        const list = npc[pair[0]];
        if (!list || !list.length) return;
        body.appendChild(el("div", { class: "section-label", text: pair[1] }));
        const ul = el("ul", { class: "bullets" });
        list.forEach((line) => ul.appendChild(el("li", { text: line })));
        body.appendChild(ul);
      });
      [["skills", "Ferdigheter"], ["armor", "Rustning"], ["spells", "Formler"],
       ["special", "Spesielt"], ["sanity_loss", "Sanity-tap"],
       ["possessions", "Våpen og eiendeler"], ["notes", "Notater"]]
        .forEach((pair) => {
          const val = npc[pair[0]];
          if (!val || val === "-") return;
          body.appendChild(el("div", { class: "section-label", text: pair[1] }));
          body.appendChild(el("p", { class: "prose", text: val }));
        });
      if (npc.stats_note) {
        body.appendChild(el("p", { class: "caveat", text: npc.stats_note }));
      }
      const refs = crossRefs(npc);
      if (refs) body.appendChild(refs);
      if (npc.id) body.appendChild(noteEditor(npc));
    }, modalActions(npc, "npcs"));
}

function openCharacter(pc) {
  openModal(pc.name || "?", [pc.occ, pc.archetype].filter(Boolean).join(" · "),
    (body) => {
      const stats = { STR: pc.str, CON: pc.con, SIZ: pc.siz, DEX: pc.dex,

        body.appendChild(el("div", { class: "section-label", text: "Våpen" }));

      }
      if (pc.talents) {
        body.appendChild(el("div", { class: "section-label", text: "Talenter" }));

      }
      if (pc.skills && Object.keys(pc.skills).length) {

function itemAsLine(item) {
  const title = item.title || item.name || "(uten tittel)";
  const sub = item.where || item.when || item.deck || "";
  let line = "- " + title;
  if (sub) line += " (" + sub + ")";
  return line;
}

async function copyToSession(item) {
  const sessions = state.progress.sessions;
  if (!sessions.length) {
    sessions.push({ title: "Sesjon 1", date: new Date().toISOString().slice(0, 10),
                    summary: "" });
  }
  const s = sessions[sessions.length - 1];
  s.summary = (s.summary ? s.summary + "\n" : "") + itemAsLine(item);
  await saveProgress();
  toast("Lagt i «" + (s.title || "sesjonen") + "»");
}

  { key: "library",    label: "Bibliotek",  group: "Mitt" },
];

function navBadge(key) {
  const d = state.scenario;
  if (!d) return "";
  if (FLAGS[key] && d[key]) {
    const items = d[key];
    if (!items.length) return "";
    return items.filter((x) => x[FLAGS[key]]).length + "/" + items.length;
  }
  if (key === "npcs" || key === "reference") {
    return (d[key] || []).length || "";
  }
  if (key === "sessions") return state.progress.sessions.length || "";
  if (key === "characters") return state.characters.length || "";
  if (key === "library") return state.library.items.length || "";
  return "";
}

function renderRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  let group = null;
  VIEWS.forEach((v) => {
    if (v.group !== group) {
      group = v.group;
      rail.appendChild(el("div", { class: "rail-group", text: group }));
    }
    const badge = navBadge(v.key);
    rail.appendChild(el("button", {
      class: "navlink", type: "button",
      "aria-current": state.view === v.key ? "page" : null,
      onclick: () => setView(v.key),
    }, [
      el("span", { text: v.label }),
      badge ? el("span", { class: "count", text: String(badge) }) : null,
    ]));
  });
}

function setView(key) {
  state.view = key;
  state.query = "";
  state.hideDone = false;
  render();
  // Til toppen av dokumentet, ikke til toppen av innholdet — ellers
  // ruller terningkasteren og synk-merket i topplinja ut av syne.
  window.scrollTo({ top: 0, behavior: "auto" });
}

function meter(label, done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return el("div", { class: "meter" }, [
    el("div", { class: "meter-head" }, [
      el("b", { text: label }),
      el("span", { text: done + " / " + total }),
    ]),
    el("div", { class: "meter-track" }, [
      el("div", {
        class: "meter-fill" + (total && done >= total ? " full" : ""),
        style: "width:" + pct + "%",
      }),
    ]),
  ]);
}

function searchBar(placeholder) {
  const input = el("input", {
    class: "field", type: "search", id: "search-" + state.view,
    placeholder: placeholder, value: state.query,
  });
  const run = debounce(() => {
    state.query = input.value;
    const pos = input.selectionStart;
    render();
    const next = document.getElementById("search-" + state.view);
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }, 220);
  input.addEventListener("input", run);
  return input;
}

function entryRow(item, section, tag) {
  const flag = FLAGS[section];
  const done = flag ? !!item[flag] : false;
  const sub = [item.act, item.day, item.when, item.where, item.deck]
    .filter(Boolean).join(" · ");

  const children = [];
  if (flag) {
    children.push(el("button", {
      class: "tick", type: "button", "aria-pressed": String(done),
      "aria-label": (done ? "Fjern kryss for " : "Kryss av ") +
                    (item.title || item.name),
      onclick: (e) => { e.stopPropagation(); toggleFlag(item.id); },
    }));
  } else {
    children.push(el("span", { class: "tick", style: "border-color:transparent" }));
  }

  const bodyBits = [el("span", { class: "entry-title",
                                 text: item.title || item.name || "?" })];
  if (sub) bodyBits.push(el("span", { class: "entry-sub", text: sub }));
  if (item.roll) {
    bodyBits.push(el("span", { class: "entry-sub", text: "Slag: " + item.roll }));
  }
  if (item.userNotes) {
    bodyBits.push(el("span", { class: "entry-note", text: item.userNotes }));
  }
  children.push(el("span", { class: "entry-body" }, bodyBits));
  children.push(el("span", { class: "entry-open", text: "ÅPNE" }));

  return el("button", {
    class: "entry" + (done ? " done" : ""), type: "button",
    "data-tag": tag || item.tag || null,
    onclick: () => openItem(item, section),
  }, children);
}

function filterToolbar(section) {
  const items = state.scenario[section] || [];
  const flag = FLAGS[section];
  const done = items.filter((x) => x[flag]).length;
  const bar = el("div", { class: "row spread", style: "margin-bottom:14px" }, [
    el("button", {
      class: "btn small", type: "button",
      "aria-pressed": String(state.hideDone),
      text: state.hideDone ? "Viser bare gjenstående" : "Skjul avkryssede",
      onclick: () => { state.hideDone = !state.hideDone; render(); },
    }),
    el("span", { class: "chip", text: done + " av " + items.length + " avkrysset" }),
  ]);
  return bar;
}

function visible(items, section) {
  const flag = FLAGS[section];
  return items.filter((it) => {
    if (state.hideDone && flag && it[flag]) return false;
    return matches(it, state.query);
  });
}
