<title>Eldritch Portal Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* ------------------------------------------------------------------
   Eldritch Portal — Keeper-konsoll for nettleser.

   Bevisst mørkt tema. Dette er et verktøy som står oppslått ved siden
   av spillbordet i et dempet rom, og det skal se ut som den samme
   appen på telefonen. Alle farger settes eksplisitt, slik at siden
   holder seg uansett hvilket tema nettleseren rundt kjører.
   ------------------------------------------------------------------ */
:root {
  color-scheme: dark;

  /* Hurtiglinja nederst er ikke der uten et aktivt scenario, og da
     skal ingenting gi plass til den heller. */
  --quickh: 0px;

  --ink:        #0E0709;   /* skrogsvart, med et rødt anslag */
  --ink-2:      #170D11;   /* panel */
  --ink-3:      #23141A;   /* hevet flate */
  --ink-4:      #321D24;   /* kant / hover */

  --brass:      #E0B451;   /* antikk messing — eneste aksent */
  --brass-dim:  #96773A;
  --brass-glow: rgba(224, 180, 81, 0.14);

  --parchment:  #EDE3D2;   /* brødtekst */
  --muted:      #A08880;   /* dempet, dreid mot burgunder */
  --faint:      #6E5A58;

  --verdigris:  #5A9C7E;   /* irret kobber — «gjort» */
  --signal:     #C6504A;   /* skiltrødt — skurkens trekk */
  --tide:       #6E8BA8;   /* sjøblått — reise og vær */

  --rule:       rgba(224, 180, 81, 0.20);
  --rule-soft:  rgba(237, 227, 210, 0.10);

  --display: "Limelight", "Josefin Sans", Georgia, serif;
  --ui:      "Josefin Sans", "Segoe UI", system-ui, sans-serif;
  --body:    "Spectral", Georgia, "Times New Roman", serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --rail: 216px;
  --gutter: clamp(16px, 3vw, 32px);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

/* Svak vignett så flaten ikke er helt død. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(224,180,81,0.07), transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(198,80,74,0.06), transparent 60%);
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: var(--brass); }

:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 2px;
  border-radius: 3px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============================ SKALL ============================= */

.shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "rail main";
}

.masthead {
  grid-area: head;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px var(--gutter);
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(180deg, var(--ink-2), var(--ink));
}

.wordmark {
  font-family: var(--display);
  font-size: 20px;
  letter-spacing: 0.06em;
  color: var(--brass);
  line-height: 1;
  white-space: nowrap;
}
.wordmark span { display: block; font-size: 9px; letter-spacing: 0.34em;
  color: var(--faint); font-family: var(--ui); margin-top: 5px; }

.masthead-title {
  flex: 1 1 200px;
  min-width: 0;
}
.masthead-title b {
  display: block;
  font-family: var(--ui);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--parchment);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.masthead-title small {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.masthead-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chip {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  color: var(--muted);
  white-space: nowrap;
}
.chip.live { color: var(--verdigris); border-color: rgba(90,156,126,0.4); }
.chip.local { color: var(--muted); }

/* ------------------------------ nav ---------------------------- */

.rail {
  grid-area: rail;
  border-right: 1px solid var(--rule);
  padding: 16px 10px 40px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: sticky;
  top: 0;
  align-self: start;
  max-height: 100vh;
  overflow-y: auto;
}

.rail-group {
  font-family: var(--ui);
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 16px 10px 6px;
}
.rail-group:first-child { padding-top: 4px; }

.navlink {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 5px;
  font-family: var(--ui);
  font-size: 14px;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-align: left;
  border-left: 2px solid transparent;
  transition: background 0.14s, color 0.14s;
}
.navlink:hover { background: var(--ink-2); color: var(--parchment); }
.navlink[aria-current="page"] {
  background: var(--ink-3);
  color: var(--brass);
  border-left-color: var(--brass);
}
.navlink .count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.navlink[aria-current="page"] .count { color: var(--brass-dim); }

/* ----------------------------- main ---------------------------- */

.main {
  grid-area: main;
  padding: var(--gutter);
  padding-block: 24px calc(72px + var(--quickh));
  min-width: 0;
}
.view { max-width: 72ch; margin-inline: auto; }
.view.wide { max-width: 1080px; }

/* Fargeprøve i tidslinjens tegnforklaring. */
.swatch {
  display: inline-block; width: 9px; height: 9px;
  border-radius: 2px; margin-right: 6px;
  vertical-align: baseline;
}

h1 {
  font-family: var(--ui);
  font-weight: 700;
  font-size: clamp(24px, 4vw, 32px);
  letter-spacing: 0.01em;
  margin: 0 0 4px;
  text-wrap: balance;
  color: var(--parchment);
}
h2 {
  font-family: var(--ui);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: 0.02em;
  margin: 32px 0 10px;
  color: var(--brass);
  text-wrap: balance;
}
.view > h2:first-of-type { margin-top: 22px; }
.lede { color: var(--muted); margin: 0 0 20px; font-size: 15px; }

.eyebrow {
  font-family: var(--ui);
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--faint);
  margin: 0 0 6px;
}

/* --------------------------- kontroller ------------------------ */

.btn {
  font-family: var(--ui);
  font-size: 13px;
  letter-spacing: 0.03em;
  padding: 8px 14px;
  border-radius: 5px;
  border: 1px solid var(--rule);
  background: var(--ink-2);
  color: var(--parchment);
  transition: background 0.14s, border-color 0.14s;
}
.btn:hover { background: var(--ink-3); border-color: var(--brass-dim); }
.btn.primary {
  background: var(--brass-glow);
  border-color: var(--brass-dim);
  color: var(--brass);
  font-weight: 600;
}
.btn.primary:hover { background: rgba(224,180,81,0.22); }
.btn.danger { color: var(--signal); border-color: rgba(198,80,74,0.35); }
.btn.danger:hover { background: rgba(198,80,74,0.12); }
.btn.small { font-size: 11px; padding: 5px 10px; }
.btn[aria-pressed="true"] {
  background: var(--brass-glow); border-color: var(--brass-dim); color: var(--brass);
}

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }

.field {
  width: 100%;
  padding: 9px 12px;
  border-radius: 5px;
  border: 1px solid var(--rule-soft);
  background: var(--ink-2);
  color: var(--parchment);
  font-family: var(--body);
}
.field:focus { border-color: var(--brass-dim); outline: none; }
.field::placeholder { color: var(--faint); }
textarea.field { resize: vertical; line-height: 1.6; }

/* ---------------------------- meter ---------------------------- */

.meter { display: grid; gap: 5px; margin-bottom: 14px; }
.meter-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--ui); font-size: 13px; letter-spacing: 0.02em;
}
.meter-head b { font-weight: 400; color: var(--parchment); }
.meter-head span {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meter-track {
  height: 6px; border-radius: 3px; background: var(--ink-3); overflow: hidden;
}
.meter-fill {
  height: 100%; background: var(--brass); border-radius: 3px;
  transition: width 0.3s ease;
}
.meter-fill.full { background: var(--verdigris); }

/* ---------------------------- paneler -------------------------- */

.panel {
  border: 1px solid var(--rule-soft);
  border-radius: 8px;
  background: var(--ink-2);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.panel.accent { border-color: var(--rule); background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); }
.panel h3 {
  font-family: var(--ui); font-weight: 600; font-size: 15px;
  margin: 0 0 6px; color: var(--parchment); letter-spacing: 0.02em;
}
.panel p { margin: 0 0 10px; }
.panel p:last-child { margin-bottom: 0; }

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}

/* --------------------------- listerader ------------------------ */

.stack { display: flex; flex-direction: column; gap: 6px; }

.entry {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 12px;
  width: 100%;
  padding: 11px 14px;
  border-radius: 6px;
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule-soft);
  background: var(--ink-2);
  text-align: left;
  transition: background 0.14s, border-color 0.14s;
}
.entry:hover { background: var(--ink-3); }
.entry.done { opacity: 0.5; }
.entry.done .entry-title { text-decoration: line-through; text-decoration-color: var(--faint); }

/* Stripa til venstre koder hva slags hendelse det er — ikke pynt. */
.entry[data-tag="villain"] { border-left-color: var(--signal); }
.entry[data-tag="climax"]  { border-left-color: var(--signal); }
.entry[data-tag="event"]   { border-left-color: var(--brass-dim); }
.entry[data-tag="voyage"]  { border-left-color: var(--tide); }
.entry[data-tag="social"]  { border-left-color: var(--rule-soft); }

.tick {
  width: 20px; height: 20px; margin-top: 3px;
  border-radius: 4px;
  border: 1px solid var(--brass-dim);
  background: transparent;
  display: grid; place-items: center;
  font-size: 12px; color: var(--ink);
  flex: none;
}
.tick[aria-pressed="true"] { background: var(--verdigris); border-color: var(--verdigris); }
.tick[aria-pressed="true"]::after { content: "✓"; font-weight: 700; }

.entry-body { min-width: 0; }
.entry-title {
  font-family: var(--ui); font-weight: 600; font-size: 15px;
  letter-spacing: 0.01em; color: var(--parchment); display: block;
}
.entry-sub {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  display: block; margin-top: 2px;
}
.entry-note {
  display: block; margin-top: 6px; padding-left: 9px;
  border-left: 2px solid var(--brass-dim);
  font-size: 13px; color: var(--muted); font-style: italic;
}
.entry-open {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  color: var(--faint); padding: 4px 6px; border-radius: 4px; flex: none;
}
.entry:hover .entry-open { color: var(--brass); }

/* ---------------------------- dagbolk -------------------------- */

.day {
  margin-bottom: 22px;
}
.day-head {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 6px; margin-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
.day-head h3 {
  margin: 0; font-family: var(--ui); font-weight: 700; font-size: 15px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass);
}
.day-head span {
  margin-left: auto; font-family: var(--mono); font-size: 11px;
  color: var(--faint); font-variant-numeric: tabular-nums;
}

/* --------------------------- statblokk ------------------------- */

.statgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
  gap: 5px;
  margin: 10px 0 14px;
}
.stat {
  border: 1px solid var(--rule-soft);
  border-radius: 4px;
  padding: 5px 7px;
  background: var(--ink);
}
.stat dt {
  font-family: var(--ui); font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--faint);
}
.stat dd {
  margin: 1px 0 0; font-family: var(--mono); font-size: 14px;
  color: var(--parchment); font-variant-numeric: tabular-nums;
}

.section-label {
  font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--brass-dim);
  margin: 18px 0 6px; padding-bottom: 3px;
  border-bottom: 1px solid var(--rule-soft);
}

.bullets { margin: 0; padding-left: 18px; }
.bullets li { margin-bottom: 4px; }

.quote {
  margin: 0 0 6px; padding-left: 11px;
  border-left: 2px solid var(--brass-dim);
  font-style: italic; color: var(--brass);
}

.prose { white-space: pre-wrap; }
.prose.tight { font-size: 15px; }

.caveat {
  font-size: 12px; color: var(--faint); font-style: italic;
  margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--rule-soft);
}

/* ---------------------------- modal ---------------------------- */

.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6, 3, 4, 0.82);
  display: grid; place-items: center;
  padding: var(--gutter);
}
.scrim[hidden] { display: none !important; }

.modal {
  width: min(760px, 100%);
  max-height: min(88vh, 900px);
  display: flex; flex-direction: column;
  background: var(--ink-2);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--rule-soft);
  background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
}
.modal-head h2 {
  margin: 0; font-size: 19px; color: var(--brass);
  font-family: var(--ui); font-weight: 700; flex: 1;
}
.modal-head .modal-sub {
  display: block; margin-top: 3px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-weight: 400; letter-spacing: 0;
}
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 12px 18px; border-top: 1px solid var(--rule-soft);
  background: var(--ink);
}

.callout {
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--brass-glow);
  padding: 10px 12px;
  margin-bottom: 14px;
}
.callout .eyebrow { color: var(--brass-dim); margin-bottom: 2px; }
.callout p { margin: 0; font-size: 14px; }

.readaloud {
  border-left: 3px solid var(--brass);
  background: var(--ink);
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  white-space: pre-wrap;
  margin-bottom: 14px;
  border-radius: 0 4px 4px 0;
}

/* ---------------------- replikker i en scene -------------------- */

.lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
.line {
  border-left: 3px solid var(--brass-dim);
  padding: 2px 0 2px 12px;
}
/* Det boka ikke sier, skal se ut som noe annet enn det den sier. */
.line.suggested { border-left-style: dotted; border-left-color: var(--rule); }
.line p { margin: 0; }
.line-who {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-family: var(--ui); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--brass-dim);
}
.line-src {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  color: var(--faint); text-transform: none;
  border: 1px solid var(--rule-soft); border-radius: 999px;
  padding: 1px 6px;
}
.line-say {
  font-family: var(--body); font-size: 16px; font-style: italic;
  color: var(--parchment); margin-top: 3px; line-height: 1.5;
}
.line-note {
  font-family: var(--body); font-size: 13px; color: var(--muted);
  margin-top: 3px;
}

/* ---------------------------- terning -------------------------- */

.dice { display: flex; align-items: center; gap: 6px; }
.dice input {
  width: 58px; text-align: center;
  font-family: var(--mono); font-size: 13px;
  padding: 6px 4px; border-radius: 5px;
  border: 1px solid var(--rule-soft); background: var(--ink-2);
  color: var(--parchment);
}
.dice-out {
  font-family: var(--mono); font-size: 12px; min-width: 128px;
  letter-spacing: 0.02em;
}
.dice-out b { font-size: 15px; }
.res-crit    { color: var(--brass); }
.res-extreme { color: var(--verdigris); }
.res-hard    { color: var(--verdigris); }
.res-reg     { color: var(--parchment); }
.res-fail    { color: var(--muted); }
.res-fumble  { color: var(--signal); }

/* --------------------------- diverse --------------------------- */

.empty {
  border: 1px dashed var(--rule);
  border-radius: 8px;
  padding: 28px;
  text-align: center;
  color: var(--muted);
}
.empty h3 { font-family: var(--ui); color: var(--parchment); margin: 0 0 6px; }

.toast {
  position: fixed; left: 50%; bottom: calc(26px + var(--quickh)); transform: translateX(-50%);
  z-index: 90;
  background: var(--ink-3); border: 1px solid var(--brass-dim);
  color: var(--brass); border-radius: 999px;
  padding: 9px 20px; font-family: var(--ui); font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  animation: rise 0.2s ease;
}
.toast[hidden] { display: none !important; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

.savestate {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  min-height: 16px; margin-bottom: 6px;
}
.savestate.saved { color: var(--verdigris); }

/* Når alt sist ble skrevet. Står ved siden av synk-merket, så man
   kan se med ett blikk at ingenting ligger og venter. */
.saved-chip { color: var(--verdigris); border-color: rgba(90,156,126,0.35); }
.saved-chip.dirty { color: var(--brass); border-color: var(--brass-dim); }

.libcard {
  border: 1px solid var(--rule-soft); border-radius: 8px;
  background: var(--ink-2); padding: 14px 16px;
}
.libcard.active { border-color: var(--brass-dim); background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); }
.libcard h3 { margin: 0 0 2px; font-family: var(--ui); font-size: 16px; color: var(--parchment); }
.libcard .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.libcard .saved-bits { font-size: 13px; color: var(--verdigris); margin: 6px 0 10px; }
.libcard .saved-bits.none { color: var(--faint); }

.tablewrap { overflow-x: auto; }
table.skills { border-collapse: collapse; width: 100%; font-size: 13px; }
table.skills td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule-soft); }
table.skills td:last-child { font-family: var(--mono); text-align: right; color: var(--brass); }

/* Halv og femtedel av en verdi — det et hardt og et ekstremt slag
   krever. Står alltid dempet, ved siden av verdien selv. */
.steps {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
table.skills .steps { margin-left: 10px; }
.steps.inline {
  display: inline-flex; align-items: center; min-width: 44px;
  justify-content: center; padding: 0 2px;
}
.steps-legend {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  margin: 6px 0 0;
}
/* I karakteristikk-ruta ligger tallparet under verdien. */
.stat .steps { display: block; margin-top: 1px; line-height: 1.1; }

/* --------------------- roller og editor ------------------------ */

/* Navnet i en rad er en knapp, men skal se ut som ren tekst. */
.linkish {
  padding: 0; text-align: left; background: none; border: none;
  color: inherit; font: inherit;
}
.linkish:hover .entry-title { color: var(--brass); }

.rowtools { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.btn.small.danger { color: var(--signal); border-color: rgba(198,80,74,0.35); }

.formrow { display: block; margin-bottom: 10px; }
.formlabel {
  display: block; font-family: var(--ui); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 3px;
}

.editgrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: 6px; margin-bottom: 6px;
}
.statedit { display: flex; flex-direction: column; gap: 2px; }
.statedit span {
  font-family: var(--ui); font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint);
}
.statedit .field { padding: 5px 7px; font-family: var(--mono); font-size: 13px; }

.attackrow { display: grid; grid-template-columns: 2fr 1fr auto 2fr auto; gap: 5px; }
.skillrow  { display: grid; grid-template-columns: 2fr 1fr auto auto; gap: 5px; }
.attackrow .field, .skillrow .field { padding: 6px 8px; font-size: 13px; }
/* Et angrep uten treffsjanse kan ikke brukes i kamp. */
.field.needs { border-color: var(--signal); }
.field.needs::placeholder { color: var(--signal); }

/* ---------------------- kamptracker ---------------------------- */

.roundbar { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.roundbar-now { flex: 1; min-width: 160px; }
.roundbar-count { text-align: right; }
.roundcount {
  font-family: var(--mono); font-size: 17px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
/* Merket på kortet som har tur — den ligger alltid øverst i lista. */
.cb-turnflag {
  display: flex; align-items: center; gap: 10px;
  margin: -2px 0 2px;
}
.cb-turnflag > span {
  font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em;
  color: var(--brass); font-weight: 700;
}
.cb-turnflag .btn { margin-left: auto; }
.roundbar p { margin: 0; }
.roundnum {
  font-family: var(--mono); font-size: 30px; font-weight: 600;
  color: var(--brass); line-height: 1;
}
.turnname {
  font-family: var(--ui); font-size: 20px; font-weight: 600;
  color: var(--parchment); line-height: 1.2;
}

.combatant {
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 14px;
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule-soft);
  border-radius: 6px;
  background: var(--ink-2);
}
.combatant[data-tag="villain"] { border-left-color: var(--signal); }
.combatant[data-tag="event"]   { border-left-color: var(--brass-dim); }
.combatant[data-tag="voyage"]  { border-left-color: var(--tide); }
.combatant.active {
  background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border-color: var(--brass-dim);
  box-shadow: inset 0 0 0 1px var(--brass-glow);
}
.combatant.down { opacity: 0.55; }

.cb-head { display: flex; align-items: center; gap: 12px; }
/* Initiativet er et felt du skriver i, ikke et tall du leser av. */
.cb-initbox {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  flex: none;
}
.cb-initedit {
  width: 52px; padding: 5px 4px; text-align: center;
  font-family: var(--mono); font-size: 16px; font-weight: 600;
  color: var(--brass); background: var(--ink);
  border: 1px solid var(--rule); border-radius: 5px;
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.cb-initedit::-webkit-outer-spin-button,
.cb-initedit::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.cb-initedit:focus { outline: none; border-color: var(--brass-dim); }
.cb-initedit::placeholder { color: var(--faint); font-weight: 400; }
.cb-initlabel {
  font-family: var(--ui); font-size: 8px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--faint);
}

/* --- plukkeliste i «legg til»-dialogen --- */
.picklist { display: flex; flex-direction: column; gap: 5px; max-height: 46vh;
  overflow-y: auto; padding-right: 4px; }
.pickrow { cursor: pointer; }
.pickrow.picked {
  border-color: var(--brass-dim);
  background: var(--brass-glow);
}
.pickbox {
  width: 18px; height: 18px; margin-top: 3px; flex: none;
  border: 1px solid var(--brass-dim); border-radius: 4px;
  display: grid; place-items: center;
  font-size: 11px; color: var(--ink); font-weight: 700;
}
.pickbox.on { background: var(--verdigris); border-color: var(--verdigris); }
.pickbox.on::after { content: "✓"; }
.pickcount {
  width: 48px; padding: 4px; text-align: center; flex: none;
  font-family: var(--mono); font-size: 13px;
  color: var(--parchment); background: var(--ink);
  border: 1px solid var(--rule-soft); border-radius: 4px;
}
.manualrow { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; }

/* Våpenegenskaper under en angrepsrad i editoren. */
.weappanel {
  border: 1px solid var(--rule); border-radius: 6px;
  background: var(--ink); padding: 10px; margin-top: 8px;
}
.picklist.short { max-height: 34vh; }
/* Talentbeskrivelsen er en hel setning og må få bryte. */
.picklist .entry-sub { white-space: normal; }

.attackflags {
  grid-column: 1 / -1;
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  padding-left: 2px;
}

/* Talenter er klikkbare — de som finnes i talentboka er uthevet. */
.talentchips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
.chip.talent {
  cursor: pointer; font-family: var(--ui); letter-spacing: 0.02em;
  color: var(--muted);
}
.chip.talent.known { color: var(--brass); border-color: var(--brass-dim); }
.chip.talent.known:hover { background: var(--brass-glow); }
.chip.talent:not(.known) { border-style: dashed; }
.section-label.chosen { color: var(--brass); border-bottom-color: var(--brass-dim); }
.section-label { display: flex; align-items: baseline; gap: 8px;
  flex-wrap: wrap; justify-content: space-between; }
.skilllink { font: inherit; color: inherit; }
.skilllink:hover { color: var(--brass); text-decoration: underline; }
.btn.primary[disabled] { opacity: 0.4; cursor: not-allowed; }
.cb-name { flex: 1; min-width: 0; display: block; }
.cb-name b {
  display: block; font-family: var(--ui); font-size: 15px;
  color: var(--parchment);
}
.cb-hp {
  font-family: var(--mono); font-size: 19px; color: var(--parchment);
  font-variant-numeric: tabular-nums; flex: none;
}
.cb-hp small { font-size: 12px; color: var(--faint); }
.cb-hp.out { color: var(--signal); }

.cb-tools { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.cb-num { width: 74px; text-align: center; font-family: var(--mono); }

.cb-attacks, .cb-conds { display: flex; gap: 5px; flex-wrap: wrap; }
.chip.atk {
  cursor: pointer; font-family: var(--mono); color: var(--parchment);
  border-color: var(--rule);
}
.chip.atk:hover { border-color: var(--brass-dim); color: var(--brass); }
.chip.cond { cursor: pointer; font-family: var(--ui); letter-spacing: 0.02em; }
.chip.cond.on {
  background: rgba(198,80,74,0.16); border-color: var(--signal);
  color: var(--signal);
}
.chip.cond.add { color: var(--faint); }
.chip.cond.add:hover { color: var(--brass); border-color: var(--brass-dim); }
.condpick { padding: 2px 0 2px 2px; }

/* ------------------- angrepsflyten i kamp ---------------------- */

.flowcard {
  border: 1px solid var(--rule-soft); border-radius: 6px;
  padding: 12px 14px; margin-bottom: 12px; background: var(--ink-2);
}
.flowname {
  font-family: var(--ui); font-size: 17px; font-weight: 600;
  color: var(--parchment); margin: 2px 0 4px; line-height: 1.25;
}
.flowcard p { margin: 0 0 4px; }
.rollrow, .defroll {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin: 10px 0 6px;
}
.minilabel {
  font-family: var(--ui); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--faint);
}
.threshline {
  font-family: var(--mono); font-size: 11.5px; color: var(--faint);
  margin: 0 0 2px;
}
.lvlholder { display: inline-flex; }
.lvlchip {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  padding: 5px 10px; border-radius: 4px;
  border: 1px solid var(--rule); color: var(--muted);
  white-space: nowrap;
}
.lvlchip.res-crit    { color: var(--brass); border-color: var(--brass-dim); }
.lvlchip.res-extreme { color: var(--brass); border-color: var(--brass-dim); }
.lvlchip.res-hard    { color: var(--tide); border-color: var(--tide); }
.lvlchip.res-reg     { color: var(--verdigris); border-color: var(--verdigris); }
.lvlchip.res-fail    { color: var(--muted); }
.lvlchip.res-fumble  { color: var(--signal); border-color: var(--signal); }

.respchips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px; }
.chip.resp { cursor: pointer; font-family: var(--ui); }
.chip.resp.on {
  background: var(--brass-glow); border-color: var(--brass-dim);
  color: var(--brass);
}
.fbpick { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.chip.atk.on {
  background: var(--brass-glow); border-color: var(--brass-dim);
  color: var(--brass);
}

.verdict {
  border: 1px solid var(--rule); border-left: 3px solid var(--rule);
  border-radius: 6px; padding: 12px 14px; margin-bottom: 10px;
  background: var(--ink-3);
}
.verdict.hit  { border-left-color: var(--signal); }
.verdict.miss { border-left-color: var(--tide); }
.verdict.bad  { border-left-color: var(--brass-dim); }
.verdict p { margin: 0 0 4px; }
.verdict-head {
  font-family: var(--ui); font-size: 16px; font-weight: 600;
  color: var(--parchment);
}
.dmgbox {
  border: 1px solid var(--rule-soft); border-radius: 6px;
  padding: 12px 14px; background: var(--ink-2);
}
.dmgbox:empty { display: none; }
.dmgbox p { margin: 0 0 4px; }
.dmgnum { font-family: var(--mono); font-size: 15px; color: var(--parchment); }
.dmgnum b { font-size: 26px; color: var(--signal); margin-right: 6px; }
.pickrow.dimmed { opacity: 0.5; }

/* Magic points mot det en formel koster. */
.mpok    { color: var(--verdigris) !important; }
.mpshort { color: var(--signal) !important; }
.callout.short { background: rgba(198,80,74,0.12); border-color: var(--signal); }
.callout.short .eyebrow { color: var(--signal); }
/* Verdiene i formelkortet er hele setninger, ikke tall. */
.stat dd.spellval { font-size: 11px; line-height: 1.35; font-family: var(--ui); }

/* Spor som peker feil vei. Villspor er skiltrødt, halvsannheter
   messing — de er ikke like farlige, og skal ikke se like farlige ut. */
.pointtag {
  align-self: start;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em;
  padding: 1px 7px; border-radius: 999px; margin-top: 4px;
  display: inline-block;
}
.pointtag.villspor {
  color: var(--signal); border: 1px solid rgba(198,80,74,0.45);
  background: rgba(198,80,74,0.10);
}
/* Merkelapp som sier hvilken del av scenarioet en rad i Økta kom
   fra. Fargene følger de samme som fanene ellers bruker. */
.streamtag {
  display: inline-block; margin-bottom: 3px;
  font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.16em;
  padding: 1px 6px; border-radius: 3px;
  border: 1px solid var(--rule-soft); color: var(--faint);
}
.streamtag.timeline  { color: var(--tide);       border-color: rgba(110,139,168,0.4); }
.streamtag.beats     { color: var(--brass);      border-color: var(--brass-dim); }
.streamtag.clues     { color: var(--verdigris);  border-color: rgba(90,156,126,0.4); }
.streamtag.locations { color: var(--muted); }
/* Rader som henger under en tidslinjehendelse rykkes inn, så det
   synes at de hører til den. */
.entry.linked { margin-left: 18px; border-left-style: dashed; }

.pointtag.delvis {
  color: var(--brass); border: 1px solid var(--brass-dim);
  background: var(--brass-glow);
}
.misdirect {
  border: 1px solid var(--rule); border-left-width: 3px;
  border-radius: 6px; padding: 10px 12px; margin-bottom: 14px;
  background: var(--ink);
}
.misdirect.villspor { border-left-color: var(--signal); }
.misdirect.villspor .eyebrow { color: var(--signal); }
.misdirect.delvis { border-left-color: var(--brass-dim); }
.misdirect.delvis .eyebrow { color: var(--brass); }
.misdirect p:last-child { margin-bottom: 0; }

/* Tellere for skapninger med egne mekanismer. */
.cb-special { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.resbox {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--ink);
}
.resbox.spent { opacity: 0.45; }
.resnum {
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  color: var(--brass); font-variant-numeric: tabular-nums;
  min-width: 14px; text-align: center;
}
.reslabel {
  font-family: var(--ui); font-size: 11px; letter-spacing: 0.06em;
  color: var(--muted);
}
.resadj {
  font-family: var(--mono); font-size: 13px; line-height: 1;
  color: var(--muted); padding: 2px 5px; border-radius: 4px;
  border: 1px solid transparent;
}
.resadj:hover { color: var(--brass); border-color: var(--brass-dim); }
.resadj.roll { font-size: 10px; letter-spacing: 0.06em; }
.chip.atk.spent { opacity: 0.4; }

.logline {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  margin: 0 0 4px; padding-bottom: 4px;
  border-bottom: 1px solid var(--rule-soft);
}
.logline:last-child { border-bottom: none; }

/* ----------------------- smale skjermer ------------------------ */


/* ==================================================================
   HURTIGNOTAT

   Den ligger fast nederst på alle faner, og skriver én tidsstemplet
   linje inn i nyeste sesjon. Poenget er at avstanden fra «det skjedde
   noe» til «det står skrevet» skal være ett felt og én enter — ingen
   fanebytte, ingen tapt tråd i spillet.
   ================================================================== */

body.quickon { --quickh: 62px; }

.quickbar {
  position: fixed;
  left: var(--rail); right: 0; bottom: 0;
  z-index: 70;
  background: var(--ink-2);
  border-top: 1px solid var(--rule);
  box-shadow: 0 -8px 24px rgba(0,0,0,0.45);
  padding: 10px var(--gutter);
}
.quickbar[hidden] { display: none !important; }
.quickbar form {
  display: flex; align-items: center; gap: 8px;
  max-width: 1080px; margin-inline: auto;
}

/* Snarveiene tar plass, og de trengs bare i det øyeblikket man skal
   skrive. De kommer fram når markøren står i linja. */
.quickchips {
  display: none;
  gap: 6px; flex-wrap: wrap;
  max-width: 1080px; margin: 0 auto 8px;
}
.quickbar:focus-within .quickchips { display: flex; }
.quickchip {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--rule); border-radius: 999px;
  padding: 4px 10px; background: var(--ink);
}
.quickchip:hover { color: var(--brass); border-color: var(--brass-dim); }
.quickchip[aria-pressed="true"] {
  color: var(--brass); border-color: var(--brass-dim);
  background: var(--brass-glow);
}
.quickbar .field { flex: 1 1 160px; min-width: 0; margin: 0; }
.quickbar .quick-where {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint); white-space: nowrap;
}

/* Merkelappen for raden man logget fra. Den står der til man har
   skrevet ferdig, slik at notatet henger på riktig spor. */
.quickref {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--brass); border: 1px solid var(--brass-dim);
  background: var(--brass-glow);
  border-radius: 999px; padding: 3px 8px; max-width: 34ch;
}
.quickref span {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.quickref button { color: var(--brass); font-size: 13px; line-height: 1; }

/* Loggknappen ved siden av hver rad i Økta. Radene er selv knapper, så
   den kan ikke ligge inni dem — de står side om side i stedet. */
.entryline { display: flex; align-items: stretch; gap: 6px; }
.entryline > .entry { flex: 1 1 auto; min-width: 0; }
.entryline.linked { margin-left: 18px; }
.entryline.linked > .entry { border-left-style: dashed; }
.logbtn {
  flex: none; width: 42px;
  border: 1px solid var(--rule-soft); border-radius: 6px;
  background: var(--ink-2); color: var(--faint);
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
}
.logbtn:hover { color: var(--brass); border-color: var(--brass-dim); }

/* Loggen slik den står i sesjonen etterpå. */
.logrow {
  display: flex; align-items: baseline; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--rule-soft);
}
.logrow:last-child { border-bottom: none; }
.logrow time {
  font-family: var(--mono); font-size: 11px; color: var(--brass-dim);
  font-variant-numeric: tabular-nums; flex: none;
}
.logrow p { margin: 0; flex: 1 1 auto; min-width: 0; font-size: 14px; }
.logrow .logwhere { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.logrow .logdrop { flex: none; color: var(--faint); font-size: 15px; line-height: 1; }
.logrow .logdrop:hover { color: var(--signal); }
.logrow.merged p { color: var(--muted); }
.anchorchip {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--tide);
  border: 1px solid rgba(110,139,168,0.4); border-radius: 3px;
  padding: 1px 6px; white-space: nowrap;
}
.anchorchip.none { color: var(--faint); border-color: var(--rule); }
.anchorchip:hover { color: var(--brass); border-color: var(--brass-dim); }

/* «Nå spiller vi» i hurtiglinja. Den er en knapp, ikke en etikett. */
.nowbtn {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--tide); border: 1px solid rgba(110,139,168,0.4);
  border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  max-width: 30ch; overflow: hidden; text-overflow: ellipsis;
}
.nowbtn:hover { color: var(--brass); border-color: var(--brass-dim); }
.nowbtn.none { color: var(--faint); border-color: var(--rule); }

.undobtn {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--signal); border: 1px solid var(--signal);
  border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  background: rgba(160,60,60,0.1);
}
.undobtn:hover { background: rgba(160,60,60,0.22); }
.undobtn[hidden] { display: none !important; }

.logedit { width: 100%; }
.logrow p.clickable { cursor: text; }
.logrow p.clickable:hover { color: var(--parchment); }

.logkind {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--brass-dim);
  border: 1px solid var(--rule); border-radius: 3px;
  padding: 1px 5px; margin-right: 6px; white-space: nowrap;
}

/* Skrivemodus: hver linje får plass til å bli til prosa. */
.logwrite { display: block; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.logwrite:last-child { border-bottom: none; }
.logwrite .logsrc {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px;
}
.logwrite textarea { min-height: 62px; }

/* Skyveknappene i leseren skal ha husets farge, ikke nettleserens. */
.slider { width: 100%; accent-color: var(--brass); margin: 4px 0 0; }
.btn:disabled { opacity: 0.4; }

.castrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.castchip {
  font-family: var(--ui); font-size: 12px;
  color: var(--faint); border: 1px solid var(--rule);
  border-radius: 999px; padding: 4px 12px; background: var(--ink);
}
.castchip[aria-pressed="true"] {
  color: var(--verdigris); border-color: var(--verdigris);
  background: rgba(90,140,120,0.12);
}

@media (max-width: 860px) {
  .quickbar { left: 0; }
  .quickbar .quick-where { display: none; }
  .nowbtn { max-width: 14ch; }
  /* På en telefon er det feltet som må ha plassen. Merkelappen legger
     seg på egen linje over i stedet for å klemme feltet i hjel. */
  .quickbar form { flex-wrap: wrap; }
  .quickref { order: -1; flex: 1 0 100%; max-width: 100%; }
  body.quickon { --quickh: 58px; }
}

@media (max-width: 860px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "rail" "main";
  }
  .rail {
    position: sticky; top: 0; z-index: 20;
    flex-direction: row;
    max-height: none;
    overflow-x: auto;
    overflow-y: hidden;
    border-right: none;
    border-bottom: 1px solid var(--rule);
    background: var(--ink);
    padding: 8px var(--gutter);

<script>
"use strict";

/* ==================================================================
   LAGRING

   To bakender bak samme API. Når siden kjører som en publisert
   artifact finnes «db», og da følger fremdrift, notater og karakterer
   med mellom telefon og PC. Ellers — lokal fil, offline, en nettleser
   uten den kapabiliteten — brukes localStorage, og alt ligger lagret
   i den nettleseren. localStorage skrives uansett, som offline-kopi.
   ================================================================== */

const PREFIX = "eldritch:";
let remote = null;          // db-namespace, eller null
let remoteReady = false;

function lsGet(key) {
  try {
    const raw = localStorage.getItem(PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); }
  catch (e) { /* full eller blokkert — vi har fortsatt db-en */ }
}
function lsDel(key) {
  try { localStorage.removeItem(PREFIX + key); } catch (e) {}
}

const store = {
  async get(key) {
    if (remote) {
      try {
        const snap = await remote.doc("state/" + key.replace(/\//g, "_")).get();
        if (snap && snap.exists && snap.data && "value" in snap.data) {
          lsSet(key, snap.data.value);
          return snap.data.value;
        }
      } catch (e) { /* faller gjennom til lokal kopi */ }
    }
    return lsGet(key);
  },
  async set(key, value) {
    lsSet(key, value);
    if (typeof markSaved === "function") markSaved();
    if (remote) {
      try {
        await remote.doc("state/" + key.replace(/\//g, "_")).set({ value });
      } catch (e) { /* lokal kopi er allerede skrevet */ }
    }
  },
  async del(key) {
    lsDel(key);
    if (remote) {
      try { await remote.doc("state/" + key.replace(/\//g, "_")).delete(); }
      catch (e) {}
    }
  },
};

async function connectRemote() {
  const chip = document.getElementById("sync-chip");
  try {
    if (window.claude && typeof window.claude.use === "function") {
      remote = await window.claude.use("db");
    }
  } catch (e) { remote = null; }
  remoteReady = true;
  if (remote) {
    chip.textContent = "Synkes mellom enheter";
    chip.className = "chip live";
    chip.title = "Fremdrift, notater og karakterer følger med til andre " +
                 "enheter der du åpner denne siden.";
  } else {
    chip.textContent = "Lagret i nettleseren";
    chip.className = "chip local";
    chip.title = "Alt lagres i denne nettleseren. Bruk Eksporter i " +
                 "Biblioteket for å flytte det over på en annen maskin.";
  }
}

/* ==================================================================
   MODELL
   ================================================================== */

const SECTIONS = ["clues", "timeline", "beats", "npcs", "handouts",
                  "locations", "reference", "tactics"];
const FLAGS = { clues: "found", timeline: "triggered",
                beats: "done", locations: "visited",
                handouts: "found", tactics: "used" };

const state = {
  library: { items: [], active: null, seeded: {} },
  scenario: null,     // aktivt innhold, med fremdrift lagt på
  scenarioId: null,
  progress: null,     // { flags, notes, itemNotes, sessions }
  characters: [],
  bestiary: null,     // innebygd fiendebank, skrivebeskyttet
  weapons: null,      // innebygd våpenliste, skrivebeskyttet
  talents: null,      // innebygd talentoppslag, skrivebeskyttet
  abilities: null,    // innebygde spesialregler for skapninger
  talentRules: null,  // reglene talentene viser videre til
  keeperRules: null,  // regelbokser til bruk ved bordet
  skillBook: null,    // ferdighetsoppslag fra regelboka
  combat: null,       // { active, round, turn, combatants, log }
  view: "overview",
  query: "",
  hideDone: false,
  cluePoints: "alle",   // hvilken vei sporene peker: alle|sant|delvis|villspor
  streamOn: { timeline: true, beats: true, clues: true, locations: true },
  spellBook: null,    // formelbanken
  charFilter: "all",  // all | pc | npc | enemy
  quickRef: null,     // raden hurtignotatet skal henge på
  quickKind: null,    // hva slags linje snarveien startet
  writeUp: null,      // sesjonen som står i skrivemodus
  editLine: null,     // «i:j» — logglinja som redigeres
  logOrder: "story",  // story | typed
};

/* ------------------------- rollelisten -------------------------- */

// Tre typer roller. Rekkefølgen her styrer også filterknappene.
const KINDS = [
  { key: "pc",    label: "Spiller",  plural: "Spillere", tone: "verdigris" },
  { key: "npc",   label: "NPC",      plural: "NPCer",    tone: "brass" },
  { key: "enemy", label: "Fiende",   plural: "Fiender",  tone: "signal" },
];
const KIND_LABEL = {};
KINDS.forEach((k) => { KIND_LABEL[k.key] = k.label; });

const CHAR_STATS = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW", "EDU",
                    "HP", "MP", "SAN", "Luck", "DB", "Build", "Move",
                    "Armor"];

let charSeq = 0;
function newId(prefix) {
  charSeq += 1;
  return prefix + "-" + Date.now().toString(36) + "-" + charSeq;
}

function normalizeChar(raw) {
  // Eldre filer fra Android-appen har feltene i småbokstaver på rot og
  // et «type»-felt med PC/NPC. Nyere fiender har «kind» og «stats».
  const c = Object.assign({}, raw);
  if (!c.id) c.id = newId("ch");

  if (!c.kind) {
    const t = String(c.type || "").toLowerCase();
    c.kind = (t === "npc") ? "npc" : (t === "enemy" ? "enemy" : "pc");
  }
  if (!KIND_LABEL[c.kind]) c.kind = "pc";

  if (!c.stats || typeof c.stats !== "object") c.stats = {};
  // Flate felter (str, con, hp …) løftes inn i stats-objektet.
  CHAR_STATS.forEach((k) => {
    const flat = c[k.toLowerCase()];
    if (c.stats[k] === undefined && flat !== undefined && flat !== "") {
      c.stats[k] = String(flat);
    }
  });

  if (!Array.isArray(c.attacks)) c.attacks = [];
  if (!c.skills || typeof c.skills !== "object" ||
      Array.isArray(c.skills)) c.skills = {};
  ["name", "occ", "archetype", "player", "notes", "backstory", "weapons",
   "talents", "insane_talents", "armor", "spells", "sanity_loss",
   "subtitle"].forEach((k) => {
    if (c[k] === undefined || c[k] === null) c[k] = "";
  });
  return c;
}

function charMaxHp(c) {
  const v = parseInt(c.stats && c.stats.HP, 10);
  if (!isNaN(v) && v > 0) return v;
  const con = parseInt(c.stats && c.stats.CON, 10);
  const siz = parseInt(c.stats && c.stats.SIZ, 10);
  if (!isNaN(con) && !isNaN(siz)) return Math.floor((con + siz) / 10);
  return 10;
}

async function saveCharacters() {
  await store.set("characters", state.characters);
}

function slugify(text, fallback) {
  const s = String(text || "").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return s.slice(0, 60) || fallback || "scenario";
}

function ensureIds(data) {
  SECTIONS.forEach((sec) => {
    (data[sec] || []).forEach((item, i) => {
      if (!item.id) {
        item.id = sec + "-" + i + "-" +
          slugify(item.title || item.name || "", String(i));
      }
    });
  });
  return data;
}

function emptyProgress() {
  return { flags: {}, notes: "", itemNotes: {}, sessions: [], now: "" };
}

function applyProgress(data, prog) {
  SECTIONS.forEach((sec) => {
    const flag = FLAGS[sec];
    (data[sec] || []).forEach((item) => {
      if (flag) item[flag] = !!prog.flags[item.id];
      const note = prog.itemNotes[item.id];
      item.userNotes = note || "";
    });
  });
  return data;
}

function contentOnly(data) {
  const copy = {};
  Object.keys(data).forEach((k) => {
    if (k !== "notes" && k !== "sessions") copy[k] = data[k];
  });
  return copy;
}

function counts(data) {
  const out = {};
  ["clues", "timeline", "beats", "npcs", "handouts", "locations",
   "reference"].forEach((k) => { out[k] = (data[k] || []).length; });
  return out;
}

/* ------------------------- bibliotek ---------------------------- */

async function loadLibrary() {
  const lib = await store.get("library");
  state.library = lib && typeof lib === "object"
    ? Object.assign({ items: [], active: null, seeded: {} }, lib)
    : { items: [], active: null, seeded: {} };
  if (!Array.isArray(state.library.items)) state.library.items = [];
  // seeded er {id: versjon}. Eldre lagringer har en liste; den
  // konverteres i seedBundled(), så her skal den bare ikke nullstilles.
  if (!state.library.seeded || typeof state.library.seeded !== "object") {
    state.library.seeded = {};
  }
}

async function saveLibrary() { await store.set("library", state.library); }

async function addScenario(data, makeActive) {
  ensureIds(data);
  const id = data.id ? slugify(data.id) : slugify(data.title);
  await store.set("content/" + id, contentOnly(data));

  // Notater og sesjoner i importfila er startinnhold. De skal aldri
  // tråkke over det brukeren selv har skrevet.
  const prog = (await store.get("progress/" + id)) || emptyProgress();
  if (data.notes && !prog.notes) prog.notes = data.notes;
  if (data.sessions && data.sessions.length && !prog.sessions.length) {
    prog.sessions = data.sessions;
  }
  await store.set("progress/" + id, prog);

  state.library.items = state.library.items.filter((it) => it.id !== id);
  state.library.items.push({
    id: id,
    title: data.title || "(uten tittel)",
    system: data.system || "",
    imported: new Date().toISOString().slice(0, 16).replace("T", " "),
    counts: counts(data),
  });
  state.library.items.sort((a, b) => a.title.localeCompare(b.title, "nb"));
  if (makeActive || !state.library.active) state.library.active = id;
  await saveLibrary();
  return id;
}

async function deleteScenario(id) {
  await store.del("content/" + id);
  await store.del("progress/" + id);
  state.library.items = state.library.items.filter((it) => it.id !== id);
  if (state.library.active === id) {
    state.library.active = state.library.items.length
      ? state.library.items[0].id : null;
  }
  await saveLibrary();
  await loadActive();
}

async function loadActive() {
  const id = state.library.active;
  state.scenarioId = id;
  if (!id) { state.scenario = null; state.progress = null; return; }
  const content = await store.get("content/" + id);
  if (!content) { state.scenario = null; state.progress = null; return; }
  const prog = Object.assign(emptyProgress(),
                             (await store.get("progress/" + id)) || {});
  state.progress = prog;
  state.scenario = applyProgress(ensureIds(content), prog);
  state.scenario.notes = prog.notes;
  state.scenario.sessions = prog.sessions;
}

async function saveProgress() {
  if (!state.scenarioId) return;
  await store.set("progress/" + state.scenarioId, state.progress);
}

async function seedBundled() {
  const node = document.getElementById("bundled-scenarios");
  let bundled = [];
  try { bundled = JSON.parse(node.textContent) || []; } catch (e) { return; }

  // Eldre lagringer har «seeded» som en liste med id-er. Regn dem som
  // versjon 1, slik at et oppdatert innebygd scenario byttes inn.
  let seeded = state.library.seeded;
  if (Array.isArray(seeded)) {
    const migrated = {};
    seeded.forEach((id) => { migrated[id] = 1; });
    seeded = migrated;
  } else if (!seeded || typeof seeded !== "object") {
    seeded = {};
  }
  state.library.seeded = seeded;

  let changed = false;
  for (const data of bundled) {
    const key = data.id || slugify(data.title);
    const version = data.version || 1;
    if (seeded[key] === version) continue;
    seeded[key] = version;
    changed = true;
    // Innholdet byttes ut; fremdriften ligger i en egen nøkkel og
    // røres ikke av addScenario().
    await addScenario(JSON.parse(JSON.stringify(data)),
                      !state.library.active);
  }
  if (changed) await saveLibrary();
}

/* ==================================================================
   HANDLINGER
   ================================================================== */

function findItem(id) {
  if (!state.scenario) return null;
  for (const sec of SECTIONS) {
    const hit = (state.scenario[sec] || []).find((x) => x.id === id);
    if (hit) return { section: sec, item: hit };
  }
  return null;
}

/* ==================================================================
   ANGRE

   Én feil avkryssing er lett gjort midt i en scene, og uten en
   angreknapp må man lete opp raden igjen for å rette den. Stabelen
   holder på de siste handlingene og hvordan de tas tilbake.

   Den lever bare så lenge sida er åpen. Å angre noe man gjorde forrige
   spillkveld er ikke det dette skal løse — det gjør man ved å rette i
   loggen.
   ================================================================== */

const UNDO_MAX = 12;
const undoStack = [];

function pushUndo(label, undo) {
  undoStack.push({ label: label, undo: undo });
  while (undoStack.length > UNDO_MAX) undoStack.shift();
  updateUndoButton();
}

function updateUndoButton() {
  const btn = document.getElementById("quick-undo");
  if (!btn) return;
  const last = undoStack[undoStack.length - 1];
  btn.hidden = !last;
  if (last) {
    btn.textContent = "ANGRE";
    btn.title = "Angre: " + last.label;
  }
}

async function doUndo() {
  const last = undoStack.pop();
  if (!last) { toast("Ingenting å angre"); return; }
  await last.undo();
  updateUndoButton();
  render();
  toast("Angret: " + last.label);
}

/* Linja en avkryssing skriver i loggen. Den skal lese som noe som
   skjedde, ikke som «krysset av rad 14». */
function logLineFor(item, section) {
  const name = item.title || item.name || "";
  const stub = { timeline: "Utløst: ", beats: "Scene spilt: ",
                 clues: "Spor funnet: ", locations: "Besøkte: ",
                 handouts: "Delte ut: ", tactics: "Brukte taktikk: " }[section]
             || "";
  return (stub + name).trim();
}

async function toggleFlag(id) {
  const hit = findItem(id);
  if (!hit) return;
  const flag = FLAGS[hit.section];
  if (!flag) return;
  const before = !!hit.item[flag];
  hit.item[flag] = !before;
  if (hit.item[flag]) state.progress.flags[id] = true;
  else delete state.progress.flags[id];

  // Krysser man av en hendelse på tidslinja, har den nettopp skjedd —
  // og da er det der vi er. Nå-pekeren følger etter av seg selv, så
  // alt som logges videre havner riktig uten at man tenker på det.
  const forrigeNa = state.progress.now || "";
  if (hit.item[flag] && hit.section === "timeline") {
    state.progress.now = id;
  }

  // Er bryteren på, skriver avkryssingen sin egen linje i loggen, med
  // forankringen raden allerede vet om. Da er loggen ført av det man
  // uansett gjorde, og ikke en jobb til.
  let skrevet = null;
  if (hit.item[flag] && state.progress.autoLog) {
    const sesjon = await addLogEntry(logLineFor(hit.item, hit.section), {
      ref: { id: id, section: hit.section,
             title: hit.item.title || hit.item.name || "" },
      anchor: storyAnchorFor(hit.item, hit.section),
      kind: "kryss",
    });
    if (sesjon && sesjon.log.length) {
      skrevet = { log: sesjon.log, entry: sesjon.log[sesjon.log.length - 1] };
    }
  }

  const navn = hit.item.title || hit.item.name || "raden";
  pushUndo((before ? "fjernet kryss for " : "krysset av ") + navn,
    async () => {
      hit.item[flag] = before;
      if (before) state.progress.flags[id] = true;
      else delete state.progress.flags[id];
      state.progress.now = forrigeNa;
      // Linja avkryssingen skrev skal bort med den. Ellers står det
      // igjen en hendelse i loggen som aldri skjedde.
      if (skrevet) {
        const at = skrevet.log.indexOf(skrevet.entry);
        if (at !== -1) skrevet.log.splice(at, 1);
      }
      await saveProgress();
    });

  await saveProgress();
  render();
}

async function setItemNote(id, text) {
  const hit = findItem(id);
  if (!hit) return;
  hit.item.userNotes = text;
  if (text.trim()) state.progress.itemNotes[id] = text;
  else delete state.progress.itemNotes[id];
  await saveProgress();
}

async function resetProgress() {
  state.progress.flags = {};
  await saveProgress();
  await loadActive();
  render();
  toast("Fremdrift nullstilt");
}

/* ==================================================================
   SMÅVERKTØY
   ================================================================== */

let toastTimer = null;
function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach((k) => {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else if (k === "html") node.innerHTML = props[k];
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), props[k]);
      else if (props[k] !== null && props[k] !== undefined && props[k] !== false) {
        node.setAttribute(k, props[k]);
      }
    });
  }
  (children || []).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function matches(item, query) {
  if (!query) return true;
  const bits = [item.title, item.name, item.description, item.where,
                item.day, item.when, item.act, item.deck, item.role,
                item.category, item.roll, item.userNotes, item.roleplay,
                item.truth];
  // Replikkene skal også kunne søkes opp — husker du bare en setning
  // noen sa, skal den finne scenen.
  (item.dialogue || []).forEach((d) => {
    bits.push(d.who, d.line, d.note);
  });
  const hay = bits.filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(query.toLowerCase()) !== -1;
}

/* Alle utsatte skrivinger melder seg inn her, slik at de kan tvinges
   ut før fanen forsvinner. Uten dette ligger de siste 600–800 ms med
   tasting og venter på en timer som aldri får løpe ferdig når man
   lukker fanen eller bytter app. */
const pendingWrites = new Set();
let lastSavedAt = null;

function debounce(fn, ms) {
  let t = null;
  let lastArgs = null;
  const wrapped = function () {
    lastArgs = arguments;
    clearTimeout(t);
    pendingWrites.add(wrapped);
    markDirty();
    t = setTimeout(() => {
      t = null;
      pendingWrites.delete(wrapped);
      fn.apply(null, lastArgs);
    }, ms);
  };
  // Skriv nå, og glem timeren. Kalles av flushWrites().
  wrapped.flush = function () {
    if (t === null) return false;
    clearTimeout(t);
    t = null;
    pendingWrites.delete(wrapped);
    fn.apply(null, lastArgs);
    return true;
  };
  wrapped.pending = () => t !== null;
  return wrapped;
}

/* Tvinger ut alt som ligger og venter. Returnerer hvor mange
   skrivinger som faktisk ble utført. */
function flushWrites() {
  let n = 0;
  [...pendingWrites].forEach((w) => { if (w.flush()) n += 1; });
  return n;
}

/* Noe ligger og venter. Sies med én gang, så man aldri er i tvil om
   det man nettopp skrev har rukket ned. */
function saveStreamPrefs() {
  lsSet("streamOn", state.streamOn);
}

function loadStreamPrefs() {
  const saved = lsGet("streamOn");
  if (saved && typeof saved === "object") {
    STREAM_SECTIONS.forEach(([k]) => {
      if (typeof saved[k] === "boolean") state.streamOn[k] = saved[k];
    });
  }
}

    c.className = "chip saved-chip dirty";

}

function markSaved() {
  lastSavedAt = new Date();
  const el2 = document.getElementById("save-chip");
  if (el2) {

      "nb-NO", { hour: "2-digit", minute: "2-digit" });

/* Siste sjanse før fanen blir borte. visibilitychange er den eneste
   som er til å stole på på mobil — beforeunload fyrer ikke alltid når
   iOS parkerer en fane. localStorage-skrivingen i store.set er
   synkron, så den rekker gjennom; db-skrivingen kan bli avbrutt, men
   da har vi fortsatt den lokale kopien. */
function armFailsafe() {
  const flush = () => { if (flushWrites()) markSaved(); };
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flush();
  });
  window.addEventListener("pagehide", flush);
  window.addEventListener("beforeunload", flush);
  // Og et nett under alt sammen, for den som lar appen stå åpen i
  // timevis midt i en økt.
  setInterval(flush, 20000);
}

// Suksessnivåene i Call of Cthulhu 7e, rangert. Rangen brukes til å
// avgjøre motsatte slag (angrep mot unnvikelse eller mot-angrep).
const LEVEL_RANK = { "FUMLE": -1, "Bom": 0, "Suksess": 1, "Hard": 2,
                     "Ekstrem": 3, "KRITISK": 4 };

// Fumlegrensa: 100 fumler alltid, 96-99 fumler når ferdigheten er
// under 50.
function fumbleFrom(target) { return target < 50 ? 96 : 100; }

// Regn om et terningkast til suksessnivå. Selve kastet gjør vi ved
// bordet — denne tar imot tallet og sier hva det ble.
function gradeRoll(roll, target) {
  const t = Math.max(0, parseInt(target, 10) || 0);
  let label, cls;
  if (roll === 1) { label = "KRITISK"; cls = "res-crit"; }
  else if (t && roll <= Math.floor(t / 5)) { label = "Ekstrem"; cls = "res-extreme"; }
  else if (t && roll <= Math.floor(t / 2)) { label = "Hard"; cls = "res-hard"; }
  else if (t && roll <= t) { label = "Suksess"; cls = "res-reg"; }
  else if (roll >= fumbleFrom(t)) { label = "FUMLE"; cls = "res-fumble"; }
  else { label = "Bom"; cls = "res-fail"; }
  return { roll: roll, target: t, label: label, cls: cls,
           rank: LEVEL_RANK[label] };
}

// Grensene, slik de kan vises ved siden av feltet man skriver kastet i.
function thresholds(target) {
  const t = Math.max(0, parseInt(target, 10) || 0);
  return { extreme: Math.floor(t / 5), hard: Math.floor(t / 2),
           regular: t, fumble: fumbleFrom(t) };
}

function rollSkill(target) {
  return gradeRoll(1 + Math.floor(Math.random() * 100), target);
}

function setupDice() {
  const input = document.getElementById("dice-target");
  const out = document.getElementById("dice-out");
  function go() {
    const target = Math.max(1, Math.min(99, parseInt(input.value, 10) || 50));
    const r = rollSkill(target);
    out.className = "dice-out " + r.cls;
    out.innerHTML = "";
    out.appendChild(el("b", { text: String(r.roll) }));
    out.appendChild(document.createTextNode(" · " + r.label));
  }
  document.getElementById("dice-roll").addEventListener("click", go);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

   TERNINGER OG KAMPREGLER  (Call of Cthulhu 7e)
   ================================================================== */

// «2D6+4», «1D10», «4D6/2D6/1D6» (haglegevær på tre avstander).
const DICE_TERM = /([+-]?)\s*(\d*)\s*[dD]\s*(\d+)|([+-]?)\s*(\d+)(?![dD\d])/g;

function parseDiceExpr(expr) {
  const s = String(expr || "").split("/")[0].trim();   // nærmeste rekkevidde
  const terms = [];
  let m;
  DICE_TERM.lastIndex = 0;
  while ((m = DICE_TERM.exec(s)) !== null) {
    if (m[3] !== undefined) {
      terms.push({ n: parseInt(m[2] || "1", 10), sides: parseInt(m[3], 10),
                   sign: m[1] === "-" ? -1 : 1 });
    } else if (m[5] !== undefined) {
      terms.push({ flat: parseInt(m[5], 10), sign: m[4] === "-" ? -1 : 1 });
    }
  }
  return terms;
}

function rollDiceExpr(expr) {
  const terms = parseDiceExpr(expr);
  let total = 0;
  const parts = [];
  terms.forEach((t) => {
    if (t.flat !== undefined) {
      total += t.sign * t.flat;
      parts.push((t.sign < 0 ? "-" : "+") + t.flat);
      return;
    }
    const rolls = [];
    for (let i = 0; i < t.n; i += 1) {
      rolls.push(1 + Math.floor(Math.random() * t.sides));
    }
    const sum = rolls.reduce((a, b) => a + b, 0);
    total += t.sign * sum;
    parts.push(t.n + "D" + t.sides + "[" + rolls.join(",") + "]");
  });
  // «+20» alene i en logglinje ser ut som en skrivefeil.
  return { total: total, detail: parts.join(" ").replace(/^\+\s*/, "") };
}

function maxDiceExpr(expr) {
  return parseDiceExpr(expr).reduce((sum, t) => sum +
    t.sign * (t.flat !== undefined ? t.flat : t.n * t.sides), 0);
}

// Damage bonus står som «+1D4», «+2D6», «0», «-1», «N/A».
function rollDamageBonus(db, mode) {
  const s = String(db || "").trim();
  if (!s || /^(0|n\/?a|ingen)$/i.test(s)) return { total: 0, detail: "" };
  const r = rollDiceExpr(s);
  if (mode === "half") {
    // Enkelte våpen bruker halv damage bonus, rundet ned.
    const half = r.total < 0 ? Math.ceil(r.total / 2) : Math.floor(r.total / 2);
    return { total: half, detail: r.detail + " halvert" };
  }
  return r;
}

/* Skaden fra ett treff. Nivået avgjør om et spiddevåpen spidder:
   maks skade fra våpenterningene pluss et nytt kast. Damage bonus
   kastes normalt og legges til der våpenet bruker den.            */
function rollAttackDamage(combatant, attack, label) {
  const crit = label === "KRITISK" || label === "Ekstrem";
  let total = 0;
  const bits = [];
  let impaled = false;

  if (attack.can_impale && crit) {
    const max = maxDiceExpr(attack.damage);
    const extra = rollDiceExpr(attack.damage);
    total = max + extra.total;
    bits.push("maks " + max, extra.detail);
    impaled = true;
  } else {
    const d = rollDiceExpr(attack.damage);
    total = d.total;
    bits.push(d.detail);
  }

  if (attack.uses_db && combatant && combatant.db) {
    const db = rollDamageBonus(combatant.db,
                               attack.uses_db === "half" ? "half" : "full");
    if (db.total) { total += db.total; bits.push("db " + db.detail); }
  }

  return { total: Math.max(0, total), impaled: impaled,
           detail: bits.filter(Boolean).join(" + ") };
}

/* ------------------- motsatte slag i nærkamp ---------------------

   Call of Cthulhu 7e: et nærkampangrep er et motsatt slag. Den som
   blir angrepet velger å unnvike (Dodge) eller slå tilbake (Fighting).
   Høyeste suksessnivå vinner; står det likt, vinner den med høyest
   ferdighetsverdi. Er også den lik, skjer ingenting.

   Skytevåpen slås ikke motsatt. Målet kan dykke i dekning: det er et
   Unnvikelse-slag, og LYKKES DET, gir det angriperen én STRAFFETERNING
   — skuddet blir ikke borte. Den som dykker mister neste angrep
   uansett om slaget gikk eller ikke.                              */

/* En straffeterning er en EKSTRA TIERTERNING: man beholder enerterningen
   og bruker det verste av de to tier-resultatene. 00+0 er 100, og 100 er
   det verste man kan få. Spilleren slår ved bordet og skriver inn den
   ekstra tierterningen her.                                        */
function withPenaltyTens(roll, tens) {
  const r = parseInt(roll, 10);
  const x = parseInt(tens, 10);
  if (!(r >= 1 && r <= 100) || !(x >= 0 && x <= 9)) return r;
  const units = r % 10;                 // 100 gir 0, som er riktig
  const alt = (x * 10 + units) || 100;  // 00 + 0 = 100
  return Math.max(r, alt);
}

function opposedOutcome(att, def) {
  // att og def er resultater fra gradeRoll. def kan være null når den
  // angrepne ikke gjør noe.
  if (!att || att.rank <= 0) {
    return { winner: "attacker-failed", why: att && att.rank < 0
      ? "Angriperen fumler." : "Angriperen bommer." };
  }
  if (!def) return { winner: "attacker", why: "Ingen forsvarshandling." };
  if (att.rank > def.rank) {
    return { winner: "attacker", why: "Angriperen har høyest nivå." };
  }
  if (def.rank > att.rank) {
    return { winner: "defender", why: "Forsvareren har høyest nivå." };
  }
  // Likt nivå: høyest ferdighetsverdi vinner.
  if (att.target > def.target) {
    return { winner: "attacker", why: "Likt nivå — høyest ferdighet vinner." };
  }
  if (def.target > att.target) {
    return { winner: "defender", why: "Likt nivå — høyest ferdighet vinner." };
  }
  return { winner: "draw", why: "Likt nivå og lik ferdighet — uavgjort." };
}

/* Rustning trekkes fra skaden. Feltet er ofte en hel setning fra
   Malleus Monstrorum, så vi plukker ut første tall.               */
function armorValue(c) {
  const m = String((c && c.armor) || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}

/* Følgene av en skade, etter Call of Cthulhu og Pulp Cthulhu.

   Pulp-helter bruker ikke major wound-regelen: de dør av ett slag som
   er lik eller større enn maks HP, ligger for døden om et slag på
   halve maks HP eller mer også tar dem til null, og besvimer ellers
   på null. Et slag på halve maks HP eller mer krever CON-slag for å
   holde seg våken.

   Alle andre bruker vanlige regler: halve maks HP i ett slag er et
   major wound (CON-slag eller bevisstløs), null HP med major wound er
   døende.                                                          */
function woundOutcome(target, net) {
  const half = Math.ceil(target.hpMax / 2);
  const left = Math.max(0, target.hp - net);
  const out = { hpAfter: left, conditions: [], notes: [], major: false };

  if (net >= target.hpMax) {
    out.conditions.push("Død");
    out.notes.push("Ett slag på " + net + " er lik eller over maks HP (" +
                   target.hpMax + ") — død på stedet.");
    out.hpAfter = 0;
    return out;
  }
  if (net >= half) {
    if (target.pulp) {
      if (left === 0) {
        out.conditions.push("Døende");
        out.notes.push("Halve maks HP eller mer, og nede på null — " +
                       "døende. CON-slag hver runde, First Aid " +
                       "stabiliserer.");
        return out;
      }
      out.notes.push("Over halve maks HP i ett slag — CON-slag for å " +
                     "holde seg våken. (Pulp-helter tar ikke major wound.)");
    } else {
      out.major = true;
      out.conditions.push("Major wound");
      out.notes.push("Major wound: CON-slag eller bevisstløs, og " +
                     "figuren går i bakken.");
      if (left === 0) {
        out.conditions.push("Døende");
        out.notes.push("Null HP med major wound — døende.");
        return out;
      }
    }
  }
  if (left === 0) {
    out.conditions.push("Bevisstløs");
    out.notes.push("Null HP — bevisstløs.");
  }
  return out;
}

let lastFocus = null;

// Modalene ligger i en stabel. Åpner du et talent fra et karakterkort,
// skal «Tilbake» føre deg til kortet igjen — ikke helt ut til lista.
// Det samme gjelder kryssreferanser mellom spor, scener og NPCer.
let modalStack = [];

function renderModal() {
  const scrim = document.getElementById("scrim");
  const top = modalStack[modalStack.length - 1];
  if (!top) {
    scrim.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    return;
  }

  // Tittel og undertittel kan være funksjoner. Da hentes de på nytt
  // hver gang nivået vises, slik at et kort man kommer tilbake til
  // viser gjeldende verdier og ikke et øyeblikksbilde.
  const head = document.getElementById("modal-title");
  head.textContent = (typeof top.title === "function")
    ? top.title() : top.title;
  const sub = (typeof top.subtitle === "function")
    ? top.subtitle() : top.subtitle;
  head.appendChild(el("span", { class: "modal-sub", id: "modal-sub",
                                text: sub || "" }));

  const body = document.getElementById("modal-body");
  body.innerHTML = "";
  top.build(body);

  const foot = document.getElementById("modal-foot");
  foot.innerHTML = "";
  top.foot.forEach((b) => foot.appendChild(b));
  foot.hidden = !top.foot.length;

  // Knappen sier hva den faktisk gjør: ett steg tilbake, eller lukk.
  const closeBtn = document.getElementById("modal-close");
  closeBtn.textContent = modalStack.length > 1 ? "Tilbake" : "Lukk";

  scrim.hidden = false;
  // Gjenopprett hvor langt ned man hadde bladd da man forlot nivået.
  body.scrollTop = top.scrollTop || 0;
  closeBtn.focus();
}

function openModal(title, subtitle, buildBody, footButtons) {
  if (!modalStack.length) lastFocus = document.activeElement;
  const cur = modalStack[modalStack.length - 1];
  if (cur) cur.scrollTop = document.getElementById("modal-body").scrollTop;
  modalStack.push({
    title: title, subtitle: subtitle,
    build: buildBody, foot: footButtons || [], scrollTop: 0,
  });
  renderModal();
}

// Ett steg tilbake i stabelen.
function closeModal() {
  modalStack.pop();
  // Leseren skal ikke fortsette å snakke fra et kort som er lukket.
  if (typeof reader !== "undefined" && reader.playing) readerStop();
  renderModal();
}

// Lukk alt — brukes når man forlater modalene helt.
function closeAllModals() {
  modalStack = [];
  renderModal();
}

function noteEditor(item) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Dine notater" }));
  const status = el("div", { class: "savestate" });
  const area = el("textarea", {
    class: "field", rows: "4", id: "note-" + item.id,
    placeholder: "Hva skjedde da spillerne kom hit?",
  });
  area.value = item.userNotes || "";
  const save = debounce(async () => {
    await setItemNote(item.id, area.value);
    status.textContent = "Lagret " +
      new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
    status.className = "savestate saved";
  }, 700);
  area.addEventListener("input", () => {
    status.textContent = "Lagrer…";
    status.className = "savestate";
    save();
  });
  wrap.appendChild(status);
  wrap.appendChild(area);
  return wrap;
}

function crossRefs(item) {
  const refs = item.connects_to || [];
  if (!refs.length) return null;
  const labels = { clues: "Spor", timeline: "Tidslinje", beats: "Scene",
                   npcs: "NPC", handouts: "Handout", locations: "Sted",
                   reference: "Oppslag" };
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Se også" }));
  const stack = el("div", { class: "stack" });
  refs.forEach((ref) => {
    const hit = findItem(ref);
    if (!hit) return;
    stack.appendChild(el("button", {
      class: "entry", type: "button",
      onclick: () => openItem(hit.item, hit.section),
    }, [
      el("span", { class: "entry-open", text: labels[hit.section] || hit.section }),
      el("span", { class: "entry-body" }, [
        el("span", { class: "entry-title",
                     text: hit.item.title || hit.item.name || ref }),
      ]),
      el("span", { class: "entry-open", text: "ÅPNE" }),
    ]));
  });
  if (!stack.children.length) return null;
  wrap.appendChild(stack);
  return wrap;
}

function openItem(item, section) {
  if (section === "npcs") return openNpc(item);

  const subtitle = ["act", "day", "when", "where", "deck"]
    .map((k) => item[k]).filter(Boolean).join(" · ");

  openModal(item.title || item.name || "?", subtitle, (body) => {
    // Peker sporet feil vei, skal det stå før alt annet — ellers
    // rekker Keeperen å lese det opp som om det var til å stole på.
    if (item.points && item.points !== "sant") {
      body.appendChild(el("div", { class: "misdirect " + item.points }, [
        el("p", { class: "eyebrow",
                  text: item.points === "villspor"
                        ? "Villspor — peker feil vei"
                        : "Halvsannhet — stemmer, men fører feil" }),
        item.truth
          ? el("p", { class: "prose tight", text: item.truth })
          : el("p", { class: "prose tight",
                      text: "Ingen forklaring lagt inn." }),
      ]));
    }
    if (item.roll) {
      body.appendChild(el("div", { class: "callout" }, [
        el("p", { class: "eyebrow", text: "Slag" }),
        el("p", { text: item.roll }),
      ]));
    }
    if (item.description) {
      body.appendChild(el("p", { class: "prose", text: item.description }));
    }
    // Det som faktisk skal leses høyt eller vises fram, i egen ramme.
    if (item.read_aloud) {
      body.appendChild(el("p", { class: "eyebrow", text: "Les høyt" }));
      body.appendChild(el("div", { class: "readaloud", text: item.read_aloud }));
    }
    if (item.aside) {
      body.appendChild(el("p", { class: "prose tight", text: item.aside }));
    }
    if (item.body) body.appendChild(el("p", { class: "prose", text: item.body }));

    // Replikker fra boka, og forslag der boka ikke gir noe.
    if (item.dialogue && item.dialogue.length) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Replikker" }));
      const box = el("div", { class: "lines" });
      item.dialogue.forEach((d) => {
        const row = el("div", { class: "line" + (d.source === "forslag"
                                                 ? " suggested" : "") });
        row.appendChild(el("p", { class: "line-who" }, [
          el("span", { text: d.who || "" }),
          el("span", { class: "line-src",
                       text: d.source === "forslag" ? "forslag" : "fra boka" }),
        ]));
        row.appendChild(el("p", { class: "line-say", text: d.line || "" }));
        if (d.note) {
          row.appendChild(el("p", { class: "line-note", text: d.note }));
        }
        box.appendChild(row);
      });
      body.appendChild(box);
    }

    if (item.roleplay) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Slik spilles scenen" }));
      body.appendChild(el("p", { class: "prose", text: item.roleplay }));
    }

    const refs = crossRefs(item);
    if (refs) body.appendChild(refs);
    if (item.id) body.appendChild(noteEditor(item));
  }, modalActions(item, section));
}

function modalActions(item, section) {
  const buttons = [];
  const flag = FLAGS[section];
  if (flag && item.id) {
    const on = !!item[flag];
    buttons.push(el("button", {
      class: on ? "btn" : "btn primary", type: "button",
      text: on ? "Fjern kryss" : (section === "handouts" ? "Marker utdelt" : "Kryss av"),
      onclick: async () => { await toggleFlag(item.id); closeModal(); },
    }));
  }
  if (item.id && state.progress) {
    buttons.push(el("button", {
      class: "btn small", type: "button", text: "Til sesjonslogg",
      onclick: () => { copyToSession(item, section); closeModal(); },
    }));
  }
  return buttons;
}
