function beastToChar(beast) {
  // En kopi som kan redigeres uten å røre banken.
  return normalizeChar({
    id: newId("ch"),
    name: beast.name,
    kind: "enemy",
    subtitle: beast.subtitle,
    occ: beast.category || "Mythos",
    stats: Object.assign({}, beast.stats),
    attacks: (beast.attacks || []).map((a) => Object.assign({}, a)),
    armor: beast.armor,
    spells: beast.spells,
    sanity_loss: beast.sanity_loss,
    notes: [beast.skills ? "Ferdigheter: " + beast.skills : "",
            beast.notes].filter(Boolean).join("\n\n"),
    source: beast.id,
  });
}

async function addBeastToRoster(beast) {
  const c = beastToChar(beast);
  c.name = uniqueName(c.name);
  state.characters.push(c);
  await saveCharacters();
  render();
  toast("«" + c.name + "» lagt i rollelisten");
}

function openBeast(beast) {
  openModal(beast.name, beast.subtitle, (body) => {
    const grid = statGrid(beast.stats);
    if (grid) body.appendChild(grid);

    if (beast.rolls && Object.keys(beast.rolls).length) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Terningformler" }));
      body.appendChild(el("p", { class: "prose tight",
        text: Object.keys(beast.rolls)
          .map((k) => k + " " + beast.rolls[k]).join("   ") }));
      body.appendChild(el("p", { class: "caveat",
        text: "Tallene over er gjennomsnitt av disse formlene. Slå selv " +
              "hvis du vil ha variasjon mellom flere av samme skapning." }));
    }

    const atk = attackTable(beast.attacks);
    if (atk) {
      body.appendChild(el("div", { class: "section-label", text: "Angrep" }));
      body.appendChild(atk);
    }
    [["armor", "Rustning"], ["skills", "Ferdigheter"], ["spells", "Formler"],
     ["sanity_loss", "Sanity-tap"], ["notes", "Notater"]].forEach((pair) => {
      if (!beast[pair[0]]) return;
      body.appendChild(el("div", { class: "section-label", text: pair[1] }));
      const val = beast[pair[0]];
      const show = pair[0] === "skills" ? annotateSkillText(val) : val;
      body.appendChild(el("p", { class: "prose", text: show }));
      if (pair[0] === "skills" && show !== val) {
        body.appendChild(stepsLegend());
      }
    });
    // Mekanismene tabellen ikke rommer — tentakler som vokser fram,
    // regenerering, hvilke våpen som biter.
    const sp = specialFor(beast);
    if (sp) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Spesialregler" }));
      specialRulesBody(sp, body);
    }
  }, [
    el("button", { class: "btn primary", type: "button", text: "Til kamp",
                   onclick: () => { closeModal(); addToCombat(beastToChar(beast)); } }),
    el("button", { class: "btn", type: "button", text: "Til rollelisten",
                   onclick: () => { closeModal(); addBeastToRoster(beast); } }),
  ]);
}

/* ================== SPESIALREGLER FOR SKAPNINGER =================

   Noen skapninger gjør ikke bare «angrep, skade, HP». En flying polyp
   danner nye tentakler hver runde; en chthonian leger seg mellom
   rundene; en crawling one bryr seg ikke om kuler. Statblokkene er
   hentet maskinelt ut av Malleus Monstrorum og kan ikke si noe om
   dette, så reglene ligger i bestiary/abilities.json og kobles på her
   — på id eller navn.                                               */

// Minste mulige skade fra en terningformel: én per terning, pluss
// faste ledd. Brukt der boka sier «minimum damage».
function minDiceExpr(expr) {
  return parseDiceExpr(expr).reduce((sum, t) => sum +
    t.sign * (t.flat !== undefined ? t.flat : t.n), 0);
}

function specialFor(charLike) {
  const bank = state.abilities;
  if (!bank || !charLike) return null;
  // «source» er id-en i fiendebanken, og følger med en kopi som er
  // lagt i rollelisten. Uten den ville en redigerbar kopi mistet
  // reglene sine.
  const ids = [charLike.id, charLike.charId, charLike.source]
    .filter(Boolean).map((x) => String(x).toLowerCase());
  const name = String(charLike.name || "").toLowerCase();
  return bank.entries.find((e) => (e.match || []).some((m) => {
    const k = String(m).toLowerCase();
    return ids.indexOf(k) !== -1 || (name && name.indexOf(k) !== -1);
  })) || null;
}

function abilitiesOf(c) {
  return (c && c.special && c.special.abilities) || [];
}

function damageRulesOf(c) {
  return (c && c.special && c.special.damage) || null;
}

/* --- tellere og bruk per runde --- */

// Hvor mange tentakler polyppen har i denne runden, hvor mange
// vindstøt den har igjen. Slås når kampen starter og ved hver ny runde.
function rollResources(c, opts) {
  const o = opts || {};
  if (!c.pools) c.pools = {};
  if (!c.used) c.used = {};
  const rolled = [];
  abilitiesOf(c).forEach((a) => {
    if (a.kind === "pool") {
      const missing = c.pools[a.id] === undefined;
      // onlyMissing brukes når sida lastes på nytt midt i en runde:
      // da skal telleren stå som den sto, ikke slås om igjen.
      const due = o.onlyMissing ? missing
        : (o.first || missing || a.reset === "round");
      if (!due) return;
      const r = rollDiceExpr(a.roll || "1");
      c.pools[a.id] = Math.max(0, r.total);
      rolled.push(c.name + ": " + a.name + " " + r.total +
                  " (" + a.roll + ")");
    } else if (a.kind === "limited") {
      if (o.onlyMissing && c.used[a.id] !== undefined) return;
      if (o.first || o.onlyMissing || a.reset === "round") c.used[a.id] = 0;
    }
  });
  return rolled;
}

// Regenerering skjer ved rundeskifte, og bare på noen som fortsatt
// lever. En chthonian som er nede i null er død og leger ingenting.
function applyRegen(c) {
  const out = [];
  abilitiesOf(c).forEach((a) => {
    if (a.kind !== "regen") return;
    if (c.hp <= 0) {
      if (a.dies_at_zero) {
        addCondition(c, "Død");
        out.push(c.name + " nådde null HP og dør på stedet — den leger " +
                 "seg ikke tilbake.");
      }
      return;
    }
    if (c.hp >= c.hpMax) return;
    const amount = a.roll ? rollDiceExpr(a.roll).total : (a.amount || 0);
    if (amount <= 0) return;
    const before = c.hp;
    c.hp = Math.min(c.hpMax, c.hp + amount);
    out.push(c.name + " regenererer " + amount + " HP (" + before +
             " → " + c.hp + ").");
  });
  return out;
}

function poolLeft(c, abilityId) {
  return (c.pools && c.pools[abilityId] !== undefined)
    ? c.pools[abilityId] : null;
}

function usesLeft(c, ability) {
  const used = (c.used && c.used[ability.id]) || 0;
  return Math.max(0, (ability.uses || 1) - used);
}

// Hvor mange handlinger et angrep har igjen. null = ubegrenset.
function attackBudget(c, attack) {
  if (!attack || !attack.abilityId) return null;
  const ab = abilitiesOf(c).find((a) => a.id === attack.abilityId);
  if (!ab) return null;
  if (ab.kind === "pool") return poolLeft(c, ab.id);
  if (ab.kind === "limited") return usesLeft(c, ab);
  return null;
}

function spendAttack(c, attack) {
  if (!attack || !attack.abilityId) return;
  const ab = abilitiesOf(c).find((a) => a.id === attack.abilityId);
  if (!ab) return;
  if (ab.kind === "pool") {
    c.pools[ab.id] = Math.max(0, (c.pools[ab.id] || 0) - 1);
  } else if (ab.kind === "limited") {
    c.used[ab.id] = ((c.used && c.used[ab.id]) || 0) + 1;
  }
}

// Tellere det går an å angripe direkte — polyppens tentakler.
function targetablePools(c) {
  return abilitiesOf(c).filter((a) => a.kind === "pool" && a.targetable);
}

/* --- hvilke våpen som biter --- */

const SOURCE_LABEL = {
  melee: "Nærkamp", firearm: "Skytevåpen", shotgun: "Hagle",
  fire: "Ild", electricity: "Elektrisitet", acid: "Syre",
  magic: "Formel", enchanted: "Fortryllet", sound: "Lyd",
};
const SOURCE_ORDER = ["melee", "firearm", "shotgun", "fire", "electricity",
                      "acid", "magic", "enchanted", "sound"];

// Hva slags skade et angrep er, ut fra våpenet det kom fra.
function damageSourceOf(attack) {
  if (!attack) return "melee";
  const sub = String(attack.subcategory || "").toLowerCase();
  if (sub === "shotgun") return "shotgun";
  const cat = String(attack.category || "").toLowerCase();
  if (cat === "firearms") return "firearm";
  if (cat === "melee") return "melee";
  const name = String(attack.name || "").toLowerCase();
  if (/hagle|shotgun/.test(name)) return "shotgun";
  if (/molotov|brann|flamme|fakkel/.test(name)) return "fire";
  if (/tesla|lyn|elektr/.test(name)) return "electricity";
  if (/syre|acid/.test(name)) return "acid";
  if (isRangedAttack(attack)) return "firearm";
  return "melee";
}

/* Regn om rå skade etter skapningens regler. Returnerer det som
   faktisk skal trekkes fra, og en linje som forklarer hvorfor.     */
function filterDamage(victim, attack, source, raw) {
  const rules = damageRulesOf(victim);
  const amount = raw ? raw.total : 0;
  if (!rules || !rules.rules) return { amount: amount, note: "" };

  const impaling = !!(raw && raw.impaled);
  const hit = rules.rules.find((r) => {
    if (r.impaling !== undefined && !!r.impaling !== impaling) return false;
    if (!r.source || r.source === "any") return true;
    return r.source === source;
  });
  if (!hit || hit.effect === "normal") return { amount: amount, note: "" };

  const label = SOURCE_LABEL[source] || source;
  if (hit.effect === "immune") {
    return { amount: 0, note: label + " biter ikke på denne." };
  }
  if (hit.effect === "half") {
    return { amount: Math.floor(amount / 2),
             note: label + " gjør halv skade: " + amount + " → " +
                   Math.floor(amount / 2) + "." };
  }
  if (hit.effect === "fixed") {
    return { amount: hit.value || 0,
             note: label + " gjør bare " + (hit.value || 0) +
                   (impaling ? " selv med spidding." : ".") };
  }
  if (hit.effect === "minimum") {
    const min = Math.max(0, minDiceExpr(attack && attack.damage));
    return { amount: min,
             note: label + " gjør minste mulige skade: " + min +
                   " i stedet for " + amount + "." };
  }
  return { amount: amount, note: "" };
}

/* Spesialreglene som lesbar tekst. Brukes både i kampkortet, i
   fiendebanken og på karakterkortet.                              */
function specialRulesBody(entry, body) {
  if (!entry) {
    body.appendChild(emptyBox("Ingen spesialregler lagt inn for denne."));
    return;
  }
  (entry.abilities || []).forEach((a) => {
    body.appendChild(el("div", { class: "section-label", text: a.name }));
    const meta = [];
    if (a.kind === "pool") meta.push("slås " + a.roll + " hver runde");
    if (a.kind === "limited") {
      meta.push((a.uses || 1) + " gang" + ((a.uses || 1) > 1 ? "er" : "") +
                " per runde");
    }
    if (a.kind === "regen") {
      meta.push("leger " + (a.roll || a.amount) + " HP per runde");
    }
    if (a.kind === "weakspot") {
      meta.push(a.chance_of_skill
        ? "krever " + a.chance_of_skill + " % av egen treffsjanse"
        : a.chance + " % sjanse per treff");
    }
    if (a.cost) meta.push(a.cost);
    if (a.attack) {
      meta.push([a.attack.skill, a.attack.damage,
                 a.attack.ignores_armor ? "ignorerer rustning" : null]
        .filter(Boolean).join(" · "));
    }
    if (meta.length) {
      body.appendChild(el("p", { class: "entry-sub", text: meta.join("  ·  ") }));
    }
    if (a.description) {
      body.appendChild(el("p", { class: "prose", text: a.description }));
    }
    if (a.scenario_note) {
      body.appendChild(el("p", { class: "callout" }, [
        el("p", { class: "eyebrow", text: "I dette scenarioet" }),
        el("p", { text: a.scenario_note }),
      ]));
    }
    if (a.house_note) {
      body.appendChild(el("p", { class: "caveat", text: a.house_note }));
    }
  });
  if (entry.damage) {
    body.appendChild(el("div", { class: "section-label",
                                 text: "Hva som biter" }));
    if (entry.damage.note) {
      body.appendChild(el("p", { class: "prose", text: entry.damage.note }));
    }
    const bank = state.abilities || {};
    const labels = bank.damage_sources || SOURCE_LABEL;
    const effects = bank.effects || {};
    const box = el("div", { class: "stack" });
    (entry.damage.rules || []).forEach((r) => {
      const src = (!r.source || r.source === "any")
        ? "Alt annet" : (labels[r.source] || r.source);
      const eff = r.effect === "fixed"
        ? (r.value + " poeng")
        : (effects[r.effect] || r.effect);
      box.appendChild(el("div", { class: "entry" }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title",
            text: src + (r.impaling ? " som spidder" : "") }),
          el("span", { class: "entry-sub", text: eff }),
        ]),
      ]));
    });
    body.appendChild(box);
  }
}

function openSpecialRules(c) {
  const entry = (c && c.special) || specialFor(c);
  openModal("Spesialregler — " + (c.name || "?"),
    entry ? entry.title : "", (body) => specialRulesBody(entry, body), []);
}

/* ------------------------- kamptracker -------------------------- */

function emptyCombat() {
  return { active: false, round: 0, turn: 0, taken: 0,
           combatants: [], log: [] };
}

async function saveCombat() { await store.set("combat", state.combat); }

function initiativeOf(c) {
  // Initiativet er tallet du skriver inn selv — det spillerne faktisk
  // slo. Står feltet tomt, faller vi tilbake på DEX, slik Call of
  // Cthulhu gjør det når ingen slår for initiativ.
  const manual = parseInt(c.init, 10);
  if (!isNaN(manual)) return manual;
  return parseInt(c.dex, 10) || 0;
}

function sortCombat() {
  state.combat.combatants.sort((a, b) => {
    const d = initiativeOf(b) - initiativeOf(a);
    if (d) return d;
    // Uavgjort: den med skytevåpen klart går først, deretter høyest DEX.
    if (!!b.firearm !== !!a.firearm) return b.firearm ? 1 : -1;
    return (parseInt(b.dex, 10) || 0) - (parseInt(a.dex, 10) || 0);
  });
}

function uniqueCombatantName(base) {
  const taken = new Set(state.combat.combatants.map((x) => x.name));
  const stem = (base || "Deltaker").replace(/\s+\d+$/, "");
  if (!taken.has(stem)) return stem;
  let n = 2;
  while (taken.has(stem + " " + n)) n += 1;
  return stem + " " + n;
}

// Unnvikelse: eget ferdighetsfelt om rollen har det, ellers halve DEX,
// slik Call of Cthulhu setter startverdien.
function dodgeValueOf(c) {
  const keys = Object.keys(c.skills || {});
  const hit = keys.find((k) => /^(dodge|unnvik)/i.test(k));
  if (hit) {
    const v = String(c.skills[hit]).replace("%", "").trim();
    if (v) return v;
  }
  const dex = parseInt(c.stats && c.stats.DEX, 10);
  return isNaN(dex) ? "" : String(Math.floor(dex / 2));
}

// Build brukes til manøvrer (grep, avvæpning, knockout).
function buildValueOf(c) {
  const given = String((c.stats && c.stats.Build) || "").trim();
  if (given) return given;
  const str = parseInt(c.stats && c.stats.STR, 10);
  const siz = parseInt(c.stats && c.stats.SIZ, 10);
  if (isNaN(str) || isNaN(siz)) return "";
  const t = str + siz;
  if (t <= 64) return "-2";
  if (t <= 84) return "-1";
  if (t <= 124) return "0";
  if (t <= 164) return "1";
  if (t <= 204) return "2";
  if (t <= 284) return "3";
  if (t <= 364) return "4";
  return "5";
}

// Statblokkene fra Malleus Monstrorum skriver skaden som «1D6 + db».
// Da skal damage bonus legges til, selv om feltet uses_db mangler.
function normalizeAttack(a) {
  const out = Object.assign({}, a);
  if (out.uses_db === undefined &&
      /(\+\s*db\b|damage bonus)/i.test(String(out.damage || ""))) {
    out.uses_db = true;
  }
  return out;
}

function makeCombatant(charLike) {
  const c = normalizeChar(charLike);
  const maxHp = charMaxHp(c);
  const entry = {
    id: newId("cb"),
    charId: c.id,
    name: uniqueCombatantName(c.name),
    kind: c.kind,
    dex: c.stats.DEX || "",
    // Forhåndsutfylt med DEX, slik at lista er brukbar med én gang.
    // Skriv over med det som ble slått.
    init: c.stats.DEX || "",
    firearm: false,
    hp: maxHp,
    hpMax: maxHp,
    armor: c.stats.Armor || c.armor || "",
    db: c.stats.DB || "",
    dodge: dodgeValueOf(c),
    build: buildValueOf(c),
    // Pulp-helter tåler mer: de bruker ikke major wound-regelen.
    // Spillerne er helter, resten er det ikke.
    pulp: c.kind === "pc",
    attacks: (c.attacks || []).map(normalizeAttack),
    // Spesialregler fra abilities.json — tentakler som vokser fram,
    // regenerering, hvilke våpen som i det hele tatt biter.
    special: specialFor(c) || null,
    pools: {},
    used: {},
    conditions: [],
    majorWound: false,
    // Slå tilbake kan gjøres én gang per runde; unnvike så mange
    // ganger man blir angrepet.
    reacted: 0,
    note: "",
  };
  rollResources(entry, { first: true });
  return entry;
}

// Kamper som ble lagret før forsvarsfeltene fantes skal fortsatt
// virke når sida åpnes igjen.
function upgradeCombatant(c) {
  if (c.dodge === undefined) {
    const dex = parseInt(c.dex, 10);
    c.dodge = isNaN(dex) ? "" : String(Math.floor(dex / 2));
  }
  if (c.build === undefined) c.build = "";
  if (c.pulp === undefined) c.pulp = c.kind === "pc";
  if (c.reacted === undefined) c.reacted = 0;
  if (!Array.isArray(c.conditions)) c.conditions = [];
  c.attacks = (c.attacks || []).map(normalizeAttack);
  if (c.special === undefined) {
    c.special = specialFor({ id: c.charId, name: c.name }) || null;
  }
  if (!c.pools) c.pools = {};
  if (!c.used) c.used = {};
  rollResources(c, { onlyMissing: true });
  return c;
}

async function addToCombat(charLike) {
  const entry = makeCombatant(charLike);
  state.combat.combatants.push(entry);
  sortCombat();
  await saveCombat();
  render();
  toast("«" + entry.name + "» lagt i kampen");
}

async function addManyToCombat(list) {
  // Navnene må gjøres unike etter hvert som de legges inn, ellers får
  // fire ghouls samme navn.
  list.forEach((c) => state.combat.combatants.push(makeCombatant(c)));
  sortCombat();
  await saveCombat();
  render();
  toast(list.length + (list.length === 1 ? " lagt i kampen"
                                         : " deltakere lagt i kampen"));
}

/* ==================================================================
   KAMPEN INN I ØKTLOGGEN

   Kamptrackeren fører allerede runde for runde. Det som er verdt å ta
   med videre er ikke hver eneste terning, men utfallet: hvem som sto
   mot hvem, hvor lenge det varte, og hvem som gikk skadet derfra.
   ================================================================== */

function combatSummary() {
  const cb = state.combat;
  if (!cb || !cb.combatants.length) return "";
  const heroes = cb.combatants.filter((c) => c.kind === "pc");
  const foes = cb.combatants.filter((c) => c.kind !== "pc");
  const names = (list) => list.map((c) => c.name).join(", ");
  const has = (c, cond) => (c.conditions || []).indexOf(cond) !== -1;

  const bits = [];
  bits.push("Kamp: " + (heroes.length ? names(heroes) : "ingen spillere") +
            (foes.length ? " mot " + names(foes) : ""));
  if (cb.round) {
    bits.push(cb.round + (cb.round === 1 ? " runde" : " runder"));
  }
  const dead = cb.combatants.filter((c) => has(c, "Død"));
  const down = cb.combatants.filter(
    (c) => !has(c, "Død") && (has(c, "Bevisstløs") || has(c, "Døende") ||
                              c.hp <= 0));
  const wounded = cb.combatants.filter(
    (c) => c.majorWound && !has(c, "Død"));
  const hurt = cb.combatants.filter(
    (c) => c.hp > 0 && c.hpMax && c.hp < c.hpMax && !c.majorWound);

  if (dead.length) bits.push("Døde: " + names(dead));
  if (down.length) bits.push("Nede: " + names(down));
  if (wounded.length) bits.push("Major wound: " + names(wounded));
  if (hurt.length) {
    bits.push("Skadet: " + hurt.map((c) => c.name + " " + c.hp + "/" +
                                           c.hpMax).join(", "));
  }
  if (dead.length + down.length + wounded.length + hurt.length === 0) {
    bits.push("ingen kom til skade");
  }
  return bits.join(" — ");
}

async function combatToLog(quiet) {
  const text = combatSummary();
  if (!text) { if (!quiet) toast("Ingen kamp å logge"); return; }
  const s = await addLogEntry(text, { kind: "kamp", view: "Kamp" });
  if (!s) { if (!quiet) toast("Ingen scenario å logge på"); return; }
  markSaved();
  toast("Kampen er i loggen til " + (s.title || "økta"));
  updateQuickBar();
}
