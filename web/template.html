/* ------------------ eksport av økter ---------------------------

   En økt er ikke bare sammendraget man skrev. Den er også hvor langt
   gruppa faktisk kom: hvilke spor de fant, hvilke scener de spilte,
   hva som ble utløst. Derfor tar «Eksporter alt» med en status til
   slutt, slik at fila er noe man kan lese neste gang uten å ha appen
   åpen ved siden av.                                            */

function slugify(s) {
  return String(s).toLowerCase()
    .replace(/[æ]/g, "ae").replace(/[ø]/g, "o").replace(/[å]/g, "a")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "sesjon";
}

function sessionFileName() {
  const base = slugify((state.scenario && state.scenario.title) || "okter");
  return base + "-okter-" + new Date().toISOString().slice(0, 10) + ".md";
}

function copyText(text) {
  navigator.clipboard.writeText(text)
    .then(() => toast("Kopiert til utklippstavla"))
    .catch(() => toast("Kunne ikke kopiere"));
}

function oneSessionMarkdown(s) {
  let head = "## " + (s.title || "Uten navn") +
             (s.date ? "  \n*" + s.date + "*" : "");
  const cast = (s.cast || []).filter(Boolean);
  if (cast.length) head += "  \n*Med: " + cast.join(", ") + "*";
  const body = (s.summary || "").trim() || "*(ingenting skrevet)*";
  const log = logMarkdown(s);
  return head + "\n\n" + body + "\n" + (log ? "\n" + log : "");
}

/* Hva gruppa har krysset av, seksjon for seksjon. */
function progressMarkdown() {
  const sc = state.scenario;
  if (!sc) return "";
  const out = [];
  const blocks = [
    ["timeline", "triggered", "Utløst på tidslinja"],
    ["beats", "done", "Scener spilt"],
    ["clues", "found", "Spor funnet"],
    ["locations", "visited", "Steder besøkt"],
  ];
  blocks.forEach(([key, flag, label]) => {
    const all = sc[key] || [];
    const hit = all.filter((x) => x[flag]);
    if (!all.length) return;
    out.push("### " + label + " (" + hit.length + " av " + all.length + ")");
    if (!hit.length) { out.push("*(ingen ennå)*"); return; }
    hit.forEach((x) => {
      let line = "- " + (x.title || x.name || "?");
      const w = [x.day, x.when, x.where, x.deck].filter(Boolean).join(" · ");
      if (w) line += " — " + w;
      // Villspor merkes også her, så leseren ikke tror gruppa er
      // nærmere svaret enn de er.
      if (x.points === "villspor") line += "  **[villspor]**";
      else if (x.points === "delvis") line += "  **[halvsant]**";
      const n = (state.progress.itemNotes || {})[x.id];
      if (n) line += "\n  > " + String(n).replace(/\n/g, "\n  > ");
      out.push(line);
    });
    out.push("");
  });
  return out.join("\n");
}

/* ==================================================================
   HURTIGNOTAT OG ØKTLOGG

   En sesjon har et sammendrag man skriver etterpå, og en logg man
   fyller mens man spiller. Loggen er linjer med klokkeslett, og hver
   linje husker hvilken fane — og eventuelt hvilket spor eller hvilken
   scene — den ble skrevet fra. Etterpå flettes de inn i sammendraget,
   og da er halve oppsummeringen allerede skrevet.
   ================================================================== */

/* ==================================================================
   HVOR I HISTORIEN DET SKJEDDE

   Loggen hadde én tidsakse: da man skrev linja. Det er feil akse. Man
   husker at spillerne gikk om bord lenge etter at man har logget liket
   i ballasttanken, og da sto det i loggen at de fant liket først og
   gikk om bord etterpå.

   Derfor har hver linje to tider. Klokkeslettet er når den ble
   skrevet, og forankringen er hvor i scenarioet det hørte hjemme.
   Loggen leses i forankringens rekkefølge, ikke i skrivingens.

   Forankringen er en hendelse på tidslinja, fordi tidslinja er det
   eneste i scenarioet som har en rekkefølge. En scene eller et spor
   som henger på en tidslinjehendelse gjennom connects_to arver den.
   Ellers brukes nå-pekeren: «nå spiller vi her», satt én gang når
   scenen skifter, så arver alt som logges den.
   ================================================================== */

function timelineItems() {
  return (state.scenario && state.scenario.timeline) || [];
}

/* Hvor langt ute i historien en forankring ligger. Uten forankring
   havner linja bakerst — den vet ikke bedre, og da skal den ikke
   dytte seg inn foran noe som vet. */
function anchorIndex(id) {
  if (!id) return Number.MAX_SAFE_INTEGER;
  const list = timelineItems();
  for (let i = 0; i < list.length; i += 1) {
    if (list[i].id === id) return i;
  }
  return Number.MAX_SAFE_INTEGER;
}

function anchorItem(id) {
  return timelineItems().filter((x) => x.id === id)[0] || null;
}

function anchorLabel(id) {
  const it = anchorItem(id);
  if (!it) return "";
  return [it.day, it.title].filter(Boolean).join(" — ");
}

function anchorShort(id) {
  const it = anchorItem(id);
  if (!it) return "";
  return it.day || it.title || "";
}

/* Tidslinjehendelsen en scene eller et spor henger på. */
function anchorOfLinked(id) {
  const hit = timelineItems().filter(
    (t) => (t.connects_to || []).indexOf(id) !== -1)[0];
  return hit ? hit.id : "";
}

function storyAnchorFor(item, section) {
  if (section === "timeline") return item.id;
  const linked = anchorOfLinked(item.id);
  if (linked) return linked;
  return (state.progress && state.progress.now) || "";
}

async function setNow(id) {
  if (!state.progress) return;
  state.progress.now = id || "";
  await saveProgress();
  updateQuickBar();
  if (state.view === "stream" || state.view === "sessions") render();
}

/* Velgeren. Den samme brukes til å sette nå-pekeren og til å flytte en
   linje som havnet feil. */
function openAnchorPicker(valgt, onPick, tittel) {
  const list = timelineItems();
  openModal(tittel || "Hvor i historien?", "", (body) => {
    if (!list.length) {
      body.appendChild(emptyBox("Scenarioet har ingen tidslinje.",
        "Da er det ingenting å feste linjene til."));
      return;
    }
    body.appendChild(el("p", { class: "lede",
      text: "Velg hendelsen dette hører hjemme ved. Loggen leses i " +
            "denne rekkefølgen, uansett når linjene ble skrevet." }));

    const stack = el("div", { class: "stack" });
    stack.appendChild(el("button", {
      class: "entry" + (!valgt ? " done" : ""), type: "button",
      onclick: async () => { await onPick(""); closeModal(); },
    }, [
      el("span", { class: "tick", style: "border-color:transparent" }),
      el("span", { class: "entry-body" }, [
        el("span", { class: "entry-title", text: "Ingen forankring" }),
        el("span", { class: "entry-sub",
                     text: "Linja legger seg bakerst i loggen" }),
      ]),
    ]));

    let dag = null;
    list.forEach((it) => {
      // Dagene skiller bolkene, ellers er lista bare en lang remse.
      if (it.day && it.day !== dag) {
        dag = it.day;
        stack.appendChild(el("div", { class: "rail-group", text: dag }));
      }
      stack.appendChild(el("button", {
        class: "entry" + (it.id === valgt ? " done" : ""), type: "button",
        "data-tag": it.tag || null,
        onclick: async () => { await onPick(it.id); closeModal(); },
      }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title", text: it.title || "?" }),
          el("span", { class: "entry-sub",
                       text: [it.day, it.when].filter(Boolean).join(" · ") }),
        ]),
      ]));
    });
    body.appendChild(stack);
  });
}

/* Loggen i den rekkefølgen den skjedde. Innenfor samme forankring
   gjelder skriverekkefølgen — det er det nærmeste vi kommer. */
function storyOrder(log) {
  return (log || []).slice().sort((a, b) => {
    const d = anchorIndex(a.anchor) - anchorIndex(b.anchor);
    if (d !== 0) return d;
    return String(a.t || "").localeCompare(String(b.t || ""));
  });
}

/* Nyeste sesjon. Finnes ingen, lages den — å måtte trykke «Ny sesjon»
   først er nøyaktig det steget hurtignotatet skal fjerne. */
/* Hvem som var med. Alle spillerne i rollelisten er med som
   utgangspunkt — det vanlige er at noen mangler, ikke at ingen møter,
   så det er raskere å krysse av den som ikke kom. */
function pcNames() {
  return state.characters.filter((c) => c.kind === "pc").map((c) => c.name);
}

function newSession() {
  return {
    title: "Sesjon " + (state.progress.sessions.length + 1),
    date: new Date().toISOString().slice(0, 10),
    summary: "",
    cast: pcNames(),
    log: [],
  };
}

function currentSession() {
  if (!state.progress) return null;
  const sessions = state.progress.sessions;
  if (!sessions.length) sessions.push(newSession());
  const s = sessions[sessions.length - 1];
  if (!Array.isArray(s.log)) s.log = [];   // sesjoner lagret før loggen fantes
  if (!Array.isArray(s.cast)) s.cast = [];
  return s;
}

function viewLabel(key) {
  const hit = VIEWS.filter((v) => v.key === key)[0];
  return hit ? hit.label : key;
}

function logTime(entry) {
  const d = new Date(entry.t);
  if (isNaN(d.getTime())) return "--:--";
  return d.toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
}

async function addLogEntry(text, opts) {
  const body = String(text || "").trim();
  if (!body) return null;
  const s = currentSession();
  if (!s) return null;
  const o = opts || {};
  const ref = o.ref;
  const entry = {
    t: new Date().toISOString(),
    text: body,
    view: o.view || viewLabel(state.view),
  };
  if (o.kind) entry.kind = o.kind;
  // Forankringen kommer fra raden man logget fra, ellers fra
  // nå-pekeren. Den kan flyttes etterpå.
  const anchor = o.anchor !== undefined
    ? o.anchor
    : (ref && ref.anchor !== undefined
        ? ref.anchor
        : (state.progress && state.progress.now) || "");
  if (anchor) entry.anchor = anchor;
  if (ref) {
    entry.ref = ref.id;
    entry.refTitle = ref.title;
    entry.refSection = ref.section;
  }
  s.log.push(entry);
  await saveProgress();
  return s;
}

/* Merkelappen i hurtiglinja: hvilken rad notatet henger på. */
function renderQuickRef() {
  const chip = document.getElementById("quick-ref");
  const label = document.getElementById("quick-ref-text");
  const ref = state.quickRef;
  chip.hidden = !ref;
  if (ref) label.textContent = ref.title;
  measureQuickBar();
}

/* Hvor mye plass innholdet over må gi fra seg. Den måles i stedet for
   å gjettes, for på smal skjerm legger merkelappen seg på egen linje
   og gjør linja høyere. */
function measureQuickBar() {
  const bar = document.getElementById("quickbar");
  if (!bar) return;
  document.body.style.setProperty(
    "--quickh", bar.hidden ? "0px" : bar.offsetHeight + "px");
}

function setQuickRef(ref) {
  state.quickRef = ref || null;
  renderQuickRef();
}

/* Det man skriver om igjen og om igjen. Snarveien gir åpningen på
   linja og merker den, slik at notatet blir ett trykk og et navn. */
const QUICK_SHORTCUTS = [
  ["san",    "SAN-tap",   "SAN-tap: "],
  ["skade",  "Skade",     "Skade: "],
  ["npc",    "NPC møtt",  "Møtte: "],
  ["logn",   "Løgn",      "Løgn fortalt: "],
  ["glipp",  "Oversett",  "Oversett: "],
  ["folg",   "Følg opp",  "Følg opp: "],
];
const QUICK_KIND_LABEL = {};
QUICK_SHORTCUTS.forEach((x) => { QUICK_KIND_LABEL[x[0]] = x[1]; });
QUICK_KIND_LABEL.kamp = "Kamp";
QUICK_KIND_LABEL.kryss = "Avkrysset";

function updateQuickChips() {
  const box = document.getElementById("quick-chips");
  if (!box) return;
  [].forEach.call(box.children, (b) => {
    b.setAttribute("aria-pressed",
                   String(state.quickKind === b.dataset.kind));
  });
}

function renderQuickChips() {
  const box = document.getElementById("quick-chips");
  if (!box) return;
  box.innerHTML = "";
  QUICK_SHORTCUTS.forEach(([key, label, stub]) => {
    const chip = el("button", {
      class: "quickchip", type: "button", text: label,
      "aria-pressed": String(state.quickKind === key),
      onclick: () => {
        // Trykk på den samme igjen slår den av, slik at man ikke må
        // tømme feltet for hånd når man traff feil.
        if (state.quickKind === key) {
          state.quickKind = null;
          startQuickNote("", state.quickRef);
        } else {
          state.quickKind = key;
          startQuickNote(stub, state.quickRef);
        }
        updateQuickChips();
      },
    });
    chip.dataset.kind = key;
    box.appendChild(chip);
  });
}

/* Åpningen på en linje, slik at man bare skriver resten. */
function quickStub(item, section) {
  return logLineFor(item, section) + " — ";
}

function startQuickNote(prefill, ref) {
  const field = document.getElementById("quick-note");
  if (!field) return;
  setQuickRef(ref);
  if (prefill !== null && prefill !== undefined) field.value = prefill;
  field.focus();
  const n = field.value.length;
  try { field.setSelectionRange(n, n); } catch (e) { /* ikke alle felt */ }
}

/* Hurtiglinja skal bare stå der den har et sted å skrive til, og den
   skal si hvilken fane og hvilken sesjon linja havner i. */
function updateQuickBar() {
  const bar = document.getElementById("quickbar");
  if (!bar) return;
  const on = !!state.progress;
  bar.hidden = !on;
  document.body.classList.toggle("quickon", on);
  if (!on) return;
  const sessions = state.progress.sessions;
  const last = sessions.length ? sessions[sessions.length - 1] : null;
  const n = last && Array.isArray(last.log) ? last.log.length : 0;
  document.getElementById("quick-where").textContent =
    viewLabel(state.view) + (last ? " → " + (last.title || "sesjon") : "") +
    (n ? " · " + n : "");

  const now = document.getElementById("quick-now");
  const label = anchorShort(state.progress.now);
  now.textContent = label ? "NÅ · " + label : "SETT NÅ";
  now.className = "nowbtn" + (label ? "" : " none");
  updateUndoButton();
  now.title = label
    ? "Nå spiller vi: " + anchorLabel(state.progress.now) +
      ". Alt du logger festes her."
    : "Si hvor i historien dere er, så havner loggen i riktig " +
      "rekkefølge selv om du skriver den i feil rekkefølge.";
  renderQuickRef();
}

function setupQuickBar() {
  const form = document.getElementById("quick-form");
  const field = document.getElementById("quick-note");
  if (!form) return;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = field.value;
    if (!text.trim()) return;
    const s = await addLogEntry(text, { ref: state.quickRef,
                                        kind: state.quickKind });
    if (!s) { toast("Ingen scenario å logge på"); return; }
    field.value = "";
    state.quickKind = null;
    updateQuickChips();
    setQuickRef(null);
    markSaved();
    toast("Logget i " + (s.title || "sesjonen"));
    // Sesjonsfanen viser loggen, så den må tegnes på nytt der.
    if (state.view === "sessions") render();
    else updateQuickBar();
  });

  document.getElementById("quick-ref-clear")
    .addEventListener("click", () => { setQuickRef(null); field.focus(); });
  document.getElementById("quick-undo")
    .addEventListener("click", () => doUndo());
  document.getElementById("quick-now").addEventListener("click", () => {
    openAnchorPicker(state.progress && state.progress.now,
                     setNow, "Nå spiller vi");
  });
  window.addEventListener("resize", measureQuickBar);
  // Snarveiene dukker opp når markøren står i linja, og da blir den
  // høyere — den må måles på nytt begge veier.
  const bar = document.getElementById("quickbar");
  bar.addEventListener("focusin", measureQuickBar);
  bar.addEventListener("focusout", () => setTimeout(measureQuickBar, 0));
  renderQuickChips();

  field.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      field.value = "";
      state.quickKind = null;
      updateQuickChips();
      setQuickRef(null);
      field.blur();
    }
  });

  // Snarveier som bare gjelder når man ikke skriver et sted. Ellers
  // ville N spist bokstaver og ctrl-Z tatt angringen fra tekstfeltet.
  function skriverNoensteds(t) {
    return !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
                    t.isContentEditable));
  }
  document.addEventListener("keydown", (e) => {
    if (skriverNoensteds(e.target)) return;
    if (document.getElementById("quickbar").hidden) return;

    if ((e.key === "z" || e.key === "Z") && (e.ctrlKey || e.metaKey) &&
        !e.shiftKey) {
      e.preventDefault();
      doUndo();
      return;
    }
    if (e.key !== "n" && e.key !== "N") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!document.getElementById("scrim").hidden) return;
    e.preventDefault();
    startQuickNote(undefined, state.quickRef);
  });
}

/* Loggen som markdown, til eksporten. */
function logMarkdown(s) {
  const log = (s && s.log) || [];
  if (!log.length) return "";
  // Historisk rekkefølge. Det er den som gir mening å lese.
  const out = ["### Logg underveis", ""];
  storyOrder(log).forEach((e) => {
    let line = "- **" + logTime(e) + "** " + e.text;
    const hvor = [anchorShort(e.anchor), e.refTitle].filter(Boolean)[0];
    if (hvor) line += "  *(" + hvor + ")*";
    out.push(line);
    // Prosaen man skrev i skrivemodus skal ikke kunne bli borte, selv
    // om den aldri ble flettet inn i sammendraget.
    const prose = (e.prose || "").trim();
    if (prose) out.push("  > " + prose.replace(/\n/g, "\n  > "));
  });
  out.push("");
  return out.join("\n");
}

function sessionsMarkdown(withProgress) {
  const sc = state.scenario || {};
  const out = ["# " + (sc.title || "Spilløkter")];
  if (sc.system) out.push("*" + sc.system + "*");
  out.push("", "Eksportert " +
    new Date().toLocaleString("nb-NO", { dateStyle: "long",
                                         timeStyle: "short" }), "");
  (state.progress.sessions || []).forEach((s) => {
    out.push(oneSessionMarkdown(s));
  });
  const notes = (state.progress.notes || "").trim();
  if (notes) out.push("## Løpende notater", "", notes, "");
  if (withProgress) {
    const p = progressMarkdown();
    if (p) out.push("---", "", "# Hvor langt dere er kommet", "", p);
  }
  return out.join("\n");
}

/* Hvem som var med. Navnene kommer fra rollelisten, og den som ikke
   møtte krysses bort — da navngir eksporten seg selv. */
function castBlock(s) {
  const box = el("div", { style: "margin-top:14px" });
  const roster = pcNames();
  const cast = Array.isArray(s.cast) ? s.cast : (s.cast = []);
  // Navn i økta som ikke lenger står i rollelisten skal ikke forsvinne
  // bare fordi rollen er slettet eller omdøpt.
  const names = roster.concat(cast.filter((n) => roster.indexOf(n) === -1));
  if (!names.length) return box;

  box.appendChild(el("span", { class: "eyebrow", text: "Hvem var med" }));
  const row = el("div", { class: "castrow" });
  names.forEach((name) => {
    const on = cast.indexOf(name) !== -1;
    row.appendChild(el("button", {
      class: "castchip", type: "button", text: name,
      "aria-pressed": String(on),
      onclick: async () => {
        const at = cast.indexOf(name);
        if (at === -1) cast.push(name); else cast.splice(at, 1);
        await saveProgress();
        render();
      },
    }));
  });
  box.appendChild(row);
  return box;
}

/* Loggen slik den ser ut i sesjonsfanen.

   Den leses i historisk rekkefølge, ikke i den rekkefølgen linjene ble
   skrevet — man husker ting i feil rekkefølge, og da skal ikke loggen
   arve rotet. Skriverekkefølgen kan slås på hvis man vil se hva som
   faktisk skjedde ved bordet.

   Alt kan rettes etterpå: teksten redigeres ved å trykke på den,
   forankringen flyttes med merkelappen, og linja slettes med krysset.
   Det er meningen — hurtig inn, rett opp senere.

   I skrivemodus får hver linje et felt under seg, der den skrives om
   til setninger mens man fortsatt husker hva som skjedde. «Sett
   sammen» bygger sammendraget av prosaen der den finnes, og av rålinja
   der den ikke gjør det. */
function sessionLogBlock(s, i, save) {
  const log = Array.isArray(s.log) ? s.log : [];
  const box = el("div", { style: "margin-top:14px" });
  if (!log.length) {
    box.appendChild(el("p", { class: "savestate",
      text: "Ingen hurtignotater i denne økta ennå." }));
    return box;
  }

  const writing = state.writeUp === i;
  const unmerged = log.filter((e) => !e.merged).length;
  const story = state.logOrder !== "typed";
  const rows = story ? storyOrder(log) : log.slice();
  const uforankret = log.filter((e) => !e.anchor).length;

  box.appendChild(el("div", { class: "row spread", style: "margin-bottom:6px" }, [
    el("span", { class: "eyebrow", text: "Logg underveis" }),
    el("span", { class: "chip",
                 text: log.length + (log.length === 1 ? " linje" : " linjer") }),
  ]));

  // Rekkefølgen er et valg, og valget skal være synlig.
  box.appendChild(el("div", { class: "respchips", style: "margin-bottom:8px" }, [
    el("button", {
      class: "chip resp" + (story ? " on" : ""), type: "button",
      text: "Slik det skjedde", "aria-pressed": String(story),
      title: "Sortert etter hvor i scenarioet linja hører hjemme",
      onclick: () => { state.logOrder = "story"; render(); },
    }),
    el("button", {
      class: "chip resp" + (!story ? " on" : ""), type: "button",
      text: "Slik du skrev det", "aria-pressed": String(!story),
      title: "Sortert etter klokkeslett",
      onclick: () => { state.logOrder = "typed"; render(); },
    }),
  ]));

  if (story && uforankret) {
    box.appendChild(el("p", { class: "savestate",
      text: uforankret + (uforankret === 1 ? " linje" : " linjer") +
            " mangler forankring og ligger bakerst. Trykk på " +
            "merkelappen for å flytte dem." }));
  }

  const list = el("div");
  rows.forEach((e) => {
    const j = log.indexOf(e);
    const nokkel = i + ":" + j;
    const where = [e.refTitle, e.view].filter(Boolean)[0] || "";
    const kind = e.kind ? el("span", { class: "logkind",
                                       text: QUICK_KIND_LABEL[e.kind] || e.kind })
                        : null;

    // Merkelappen sier hvor i historien linja sitter, og flytter den.
    const anchor = el("button", {
      class: "anchorchip" + (e.anchor ? "" : " none"), type: "button",
      text: anchorShort(e.anchor) || "uten sted",
      title: e.anchor ? anchorLabel(e.anchor)
                      : "Linja er ikke festet noe sted. Trykk for å feste den.",
      onclick: () => openAnchorPicker(e.anchor, async (id) => {
        if (id) e.anchor = id; else delete e.anchor;
        await saveProgress();
        render();
      }, "Hvor hører linja hjemme?"),
    });

    const drop = el("button", {
      class: "logdrop", type: "button", text: "×",
      "aria-label": "Slett linja",
      onclick: async () => {
        const fjernet = log[j];
        log.splice(j, 1);
        if (state.editLine === nokkel) state.editLine = null;
        pushUndo("slettet «" + (fjernet.text || "").slice(0, 30) + "»",
          async () => {
            log.splice(Math.min(j, log.length), 0, fjernet);
            await saveProgress();
          });
        await saveProgress();
        render();
      },
    });

    // Teksten redigeres ved å trykke på den. Fort inn, rettet etterpå.
    let tekst;
    if (state.editLine === nokkel) {
      const felt = el("input", { class: "field logedit", id: "logedit-" + nokkel,
                                 value: e.text });
      const lagre = async () => {
        const ny = felt.value.trim();
        if (ny) e.text = ny;
        state.editLine = null;
        await saveProgress();
        render();
      };
      felt.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); lagre(); }
        if (ev.key === "Escape") { state.editLine = null; render(); }
      });
      felt.addEventListener("blur", lagre);
      tekst = el("p", {}, [felt]);
      setTimeout(() => { felt.focus(); felt.select(); }, 0);
    } else {
      tekst = el("p", { class: "clickable", title: "Trykk for å rette teksten",
                        onclick: () => { state.editLine = nokkel; render(); } }, [
        kind,
        document.createTextNode(e.text),
        where ? el("span", { class: "logwhere", text: "  " + where }) : null,
      ]);
    }

    if (!writing) {
      list.appendChild(el("div", { class: "logrow" + (e.merged ? " merged" : "") }, [
        el("time", { text: logTime(e) }),
        anchor,
        tekst,
        drop,
      ]));
      return;
    }

    const prose = el("textarea", { class: "field", rows: "3",
                                   id: "prose-" + i + "-" + j,
                                   placeholder: "Skriv linja om til setninger…" });
    prose.value = e.prose || "";
    const saveProse = debounce(async () => {
      e.prose = prose.value;
      await saveProgress();
    }, 600);
    prose.addEventListener("input", saveProse);

    list.appendChild(el("div", { class: "logwrite" }, [
      el("div", { class: "logsrc" }, [
        el("time", { text: logTime(e) }),
        anchor,
        tekst,
        drop,
      ]),
      prose,
    ]));
  });
  box.appendChild(list);

  const buttons = el("div", { class: "row", style: "margin-top:10px" });
  buttons.appendChild(el("button", {
    class: "btn small", type: "button",
    "aria-pressed": String(writing),
    text: writing ? "Ferdig å skrive" : "Skriv ferdig",
    title: "Gir hver linje et felt der den kan skrives om til prosa",
    onclick: () => { state.writeUp = writing ? null : i; render(); },
  }));
  if (unmerged) {
    buttons.appendChild(el("button", {
      class: "btn small", type: "button",
      text: "Sett sammen " + unmerged + " linje" + (unmerged === 1 ? "" : "r"),
      title: "Legger dem nederst i sammendraget over, i historisk " +
             "rekkefølge — prosaen der du har skrevet den, ellers rålinja",
      onclick: async () => {
        save.flush();
        flushWrites();
        // Historisk rekkefølge, ikke skriverekkefølgen: sammendraget
        // skal kunne leses som en fortelling.
        const add = storyOrder(log).filter((e) => !e.merged).map((e) => {
          const prose = (e.prose || "").trim();
          return prose || (logTime(e) + " — " + e.text);
        });
        s.summary = ((s.summary || "").trim() + "\n\n" + add.join("\n\n"))
          .trim();
        log.forEach((e) => { e.merged = true; });
        await saveProgress();
        render();
        toast("Satte sammen " + add.length + " linje" +
              (add.length === 1 ? "" : "r"));
      },
    }));
  }
  box.appendChild(buttons);
  return box;
}

/* ==================================================================
   OPPLESING

   Oppsummeringen er skrevet for å bli lest høyt, og da skal den kunne
   leses høyt. Nettleseren har sin egen talesyntese — den er gratis,
   virker uten nett og uten oppsett, men stemmene er de som ligger på
   maskinen, og de er sjelden vakre.

   Vil man ha det mørkt og rolig på ordentlig, ligger tools/opplesing.py
   i repoet: den sender den samme teksten til edge-tts og får en
   nevral norsk mannsstemme tilbake som mp3. Knappen «Last ned teksten»
   nedenfor gir fila det skriptet vil ha.

   Markdown leses ikke godt høyt. Stjerner blir «stjerne», og en dato
   som 2026-09-13 blir sifre på rad. Derfor lages teksten her på nytt
   fra sesjonen i stedet for å gjenbruke eksporten.
   ================================================================== */

const MAANEDER = ["januar", "februar", "mars", "april", "mai", "juni",
                  "juli", "august", "september", "oktober", "november",
                  "desember"];

function spokenDate(iso) {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return String(iso || "");
  const md = parseInt(m[2], 10);
  if (md < 1 || md > 12) return String(iso);
  return parseInt(m[3], 10) + ". " + MAANEDER[md - 1] + " " + m[1];
}

/* Et klokkeslett skal høres ut som et klokkeslett, og hver del skal
   ende i punktum — ellers renner de sammen når de leses. */
function spokenLine(text) {
  let t = String(text || "").trim();
  t = t.replace(/^(\d{1,2}):(\d{2})\s*(?:[—–-]\s*)?/,
                (_, h, min) => "Klokka " + h + " " + min + ". ");
  t = t.replace(/\s+[—–]\s+/g, ", ");
  if (t && !/[.!?:…]$/.test(t)) t += ".";
  return t;
}

function speechTextFor(s, withLog) {
  const out = [];
  if (s.title) out.push(spokenLine(s.title));
  if (s.date) out.push(spokenDate(s.date) + ".");
  const cast = (s.cast || []).filter(Boolean);
  if (cast.length) out.push("Med: " + cast.join(", ") + ".");
  const body = (s.summary || "").trim();
  if (body) {
    out.push("");
    body.split(/\n{2,}/).forEach((para) => {
      const lines = para.split("\n").map(spokenLine).filter(Boolean);
      if (lines.length) out.push(lines.join(" "));
    });
  }
  if (withLog && (s.log || []).length) {
    out.push("");
    out.push("Logg underveis.");
    s.log.forEach((e) => {
      const prose = (e.prose || "").trim();
      out.push(spokenLine(logTime(e) + " " + (prose || e.text)));
    });
  }
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

/* Talesyntesen i nettleseren kveler lange biter — den stopper midt i
   etter noen sekunder. Derfor deles teksten opp i setninger og leses
   én bit om gangen. */
function splitForSpeech(text) {
  const chunks = [];
  String(text || "").split(/\n+/).forEach((para) => {
    const line = para.trim();
    if (!line) return;
    const sentences = line.match(/[^.!?…]+[.!?…]*\s*/g) || [line];
    let buf = "";
    sentences.forEach((raw) => {
      const bit = raw.trim();
      if (!bit) return;
      if ((buf + " " + bit).trim().length > 180 && buf) {
        chunks.push(buf.trim());
        buf = bit;
      } else {
        buf = (buf + " " + bit).trim();
      }
    });
    if (buf) chunks.push(buf);
  });
  return chunks;
}

function speechOk() {
  return typeof window !== "undefined" && "speechSynthesis" in window &&
         typeof window.SpeechSynthesisUtterance === "function";
}

/* Norsk først, og mannsstemmer før resten av de norske. Hvilke stemmer
   som finnes avhenger av maskinen, så dette er en rangering, ikke et
   valg vi kan ta på forhånd. */
const MALE_HINTS = ["finn", "male", "mann", "jacob", "daniel", "bjørn",
                    "bjorn", "henrik"];

function voiceScore(v) {
  const lang = String(v.lang || "").toLowerCase();
  const name = String(v.name || "").toLowerCase();
  let score = 0;
  if (/^nb/.test(lang)) score += 100;
  else if (/^n[no]/.test(lang)) score += 90;
  else if (/^(da|sv)/.test(lang)) score += 20;   // bedre enn engelsk på norsk
  if (MALE_HINTS.some((h) => name.indexOf(h) !== -1)) score += 10;
  if (/female|kvinne|pernille|iselin/.test(name)) score -= 5;
  return score;
}

function allVoices() {
  if (!speechOk()) return [];
  const list = window.speechSynthesis.getVoices() || [];
  return list.slice().sort((a, b) => voiceScore(b) - voiceScore(a));
}

const SPEECH_KEY = "eldritch-speech";

/* Tidligere sto disse på 0,82 og 0,7 for å få noe «mørkt». Det var
   feil verktøy: å skyve tonehøyden ned på en systemstemme gir
   metallisk klang og grøtete konsonanter, ikke stemning. Rolig tempo
   og en god stemme gjør jobben — tonehøyden blir stående. */
const SPEECH_DEFAULTS = {
  voice: "", rate: 0.95, pitch: 1, withLog: false,
  // edge-tts har egne enheter, og egne verdier å huske.
  engine: "auto", nvoice: "", nrate: -8, npitch: 0,
};

function speechPrefs() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SPEECH_KEY) || "null"); }
  catch (e) { saved = null; }
  return Object.assign({}, SPEECH_DEFAULTS, saved || {});
}

function saveSpeechPrefs(p) {
  try { localStorage.setItem(SPEECH_KEY, JSON.stringify(p)); }
  catch (e) { /* privat vindu, eller full lagring — ikke verdt en feil */ }
}

/* ------------------------------------------------------------------
   EDGE-TTS GJENNOM TERMUX

   Nettleseren kan ikke snakke med Termux av seg selv. Men serveres
   sida av tools/opplesing_server.py, ligger appen og talesyntesen på
   samme sted, og da kan «Les opp» be om ordentlig lyd i stedet for å
   lage den selv.

   Vi ser bare etter serveren når sida faktisk kommer over http — som
   artifact ligger den på https bak en CSP som likevel ville stanset
   forespørselen, og et oppslag der gir bare en feil i konsollen.
   ------------------------------------------------------------------ */

let ttsRemote = null;      // { voices: [...], standard: "nb-NO-..." }

async function probeTts() {
  // Fant vi den, er svaret gitt. Fant vi den ikke, kan serveren ha
  // blitt startet etterpå — da er det verdt å spørre en gang til.
  if (ttsRemote) return ttsRemote;
  if (typeof location === "undefined" || location.protocol !== "http:") {
    return null;
  }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch("tts/stemmer", { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) return null;
    const data = await r.json();
    if (!data || !Array.isArray(data.stemmer) || !data.stemmer.length) {
      return null;
    }
    ttsRemote = { voices: data.stemmer, standard: data.standard || "" };
  } catch (e) {
    ttsRemote = null;      // ingen server, og det er helt greit
  }
  return ttsRemote;
}

function ttsSigned(n, unit) {
  const v = Math.round(n);
  return (v >= 0 ? "+" : "") + v + unit;
}

async function ttsFetchAudio(text, prefs) {
  const r = await fetch("tts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      tekst: text,
      stemme: prefs.nvoice || (ttsRemote && ttsRemote.standard) || "",
      tempo: ttsSigned(prefs.nrate, "%"),
      dybde: ttsSigned(prefs.npitch, "Hz"),
    }),
  });
  if (!r.ok) {
    let msg = "Opplesingen feilet";
    try { msg = (await r.json()).feil || msg; } catch (e) { /* ikke JSON */ }
    throw new Error(msg);
  }
  return await r.blob();
}

const reader = { chunks: [], at: 0, playing: false, paused: false,
                 tick: null, guard: null,
                 audio: null, url: null, busy: false };

function readerStop() {
  reader.playing = false;
  reader.paused = false;
  reader.chunks = [];
  reader.at = 0;
  if (reader.guard) { clearInterval(reader.guard); reader.guard = null; }
  if (speechOk()) window.speechSynthesis.cancel();
  if (reader.audio) {
    reader.audio.pause();
    reader.audio.onended = null;
    reader.audio = null;
  }
  // Blob-adressen holder lyden i minnet til den slippes.
  if (reader.url) { URL.revokeObjectURL(reader.url); reader.url = null; }
  if (reader.tick) reader.tick();
}

/* Nevral opplesing: hele teksten lages i ett stykke og spilles som en
   vanlig lydfil. Ingen oppdeling — den er bare nødvendig for
   nettleserstemmen, som kveler lange biter. */
async function readerStartNeural(text, prefs) {
  readerStop();
  reader.busy = true;
  if (reader.tick) reader.tick();
  try {
    const blob = await ttsFetchAudio(text, prefs);
    reader.url = URL.createObjectURL(blob);
    const audio = new Audio(reader.url);
    reader.audio = audio;
    reader.playing = true;
    reader.paused = false;
    audio.onended = () => { if (reader.playing) readerStop(); };
    audio.onerror = () => { readerStop(); toast("Fikk ikke spilt av lyden"); };
    audio.ontimeupdate = () => { if (reader.tick) reader.tick(); };
    await audio.play();
    return true;
  } catch (e) {
    readerStop();
    toast(String((e && e.message) || e));
    return false;
  } finally {
    reader.busy = false;
    if (reader.tick) reader.tick();
  }
}

function readerSpeakNext(prefs, voice) {
  if (!reader.playing || reader.at >= reader.chunks.length) {
    if (reader.playing) readerStop();
    return;
  }
  const u = new window.SpeechSynthesisUtterance(reader.chunks[reader.at]);
  if (voice) { u.voice = voice; u.lang = voice.lang; }
  else u.lang = "nb-NO";
  u.rate = prefs.rate;
  u.pitch = prefs.pitch;
  u.onend = () => {
    if (!reader.playing) return;
    reader.at += 1;
    if (reader.tick) reader.tick();
    readerSpeakNext(prefs, voice);
  };
  u.onerror = () => {
    // «interrupted» kommer av at vi selv avbrøt, og er ikke en feil.
    if (!reader.playing) return;
    readerStop();
    toast("Opplesingen stoppet");
  };
  window.speechSynthesis.speak(u);
  if (reader.tick) reader.tick();
}

function readerStart(text, prefs) {
  if (!speechOk()) { toast("Nettleseren har ingen talesyntese"); return false; }
  readerStop();
  reader.chunks = splitForSpeech(text);
  if (!reader.chunks.length) { toast("Ingenting å lese opp"); return false; }
  const voices = allVoices();
  const chosen = voices.filter((v) => v.voiceURI === prefs.voice)[0] ||
                 voices[0] || null;
  reader.at = 0;
  reader.playing = true;
  reader.paused = false;
  // Chrome stanser av og til mellom bitene. Vekkeren rører bare ved
  // det når vi faktisk skal spille, aldri når brukeren har pauset.
  reader.guard = setInterval(() => {
    if (reader.playing && !reader.paused &&
        !window.speechSynthesis.speaking) {
      window.speechSynthesis.resume();
    }
  }, 5000);
  readerSpeakNext(prefs, chosen);
  return true;
}

function readerPause() {
  if (!reader.playing) return;
  if (reader.audio) {
    if (reader.paused) { reader.paused = false; reader.audio.play(); }
    else { reader.paused = true; reader.audio.pause(); }
  } else if (reader.paused) {
    reader.paused = false;
    window.speechSynthesis.resume();
  } else {
    reader.paused = true;
    window.speechSynthesis.pause();
  }
  if (reader.tick) reader.tick();
}

/* Hvilken motor som faktisk brukes. «auto» betyr edge-tts hvis den er
   der, og nettleserstemmen ellers. */
function readerEngine(prefs) {
  if (prefs.engine === "browser") return "browser";
  return ttsRemote ? "neural" : "browser";
}

async function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Gi nettleseren et øyeblikk til å starte nedlastingen.
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

function openReader(s) {
  const prefs = speechPrefs();
  const tekst = () => speechTextFor(s, prefs.withLog);
  const level = modalStack.length;

  // Serveres sida av Termux, finnes de nevrale stemmene. Det vet vi
  // ikke før vi har spurt, så kortet tegnes på nytt når svaret kommer.
  probeTts().then((found) => {
    if (found && modalStack.length === level + 1) renderModal();
  });

  openModal("Les opp", s.title || "", (body) => {
    const engine = readerEngine(prefs);

    if (engine === "neural") {
      body.appendChild(el("p", { class: "lede",
        text: "Leses av edge-tts gjennom Termux — de nevrale norske " +
              "stemmene. Lyden lages på nytt bare når teksten eller " +
              "innstillingene endrer seg." }));
    } else if (ttsRemote) {
      body.appendChild(el("p", { class: "lede",
        text: "Leses med nettleserens egen stemme. De nevrale stemmene " +
              "er tilgjengelige — bytt motor nedenfor." }));
    } else if (speechOk()) {
      body.appendChild(el("p", { class: "lede",
        text: "Leses med nettleserens egen stemme: gratis og uten nett, " +
              "men du får de stemmene maskinen har, og de er langt fra " +
              "de nevrale. Vil du ha Pernille eller Finn, kjør " +
              "tools/opplesing_server.py i Termux og åpne appen derfra." }));
    } else {
      body.appendChild(emptyBox("Nettleseren har ingen talesyntese.",
        "Kjør tools/opplesing_server.py i Termux og åpne appen derfra, " +
        "eller bruk «Last ned teksten» med tools/opplesing.py."));
    }

    const status = el("p", { class: "savestate" });
    const preview = el("p", { class: "lede", style: "min-height:3em" });
    let play, pause;

    function refresh() {
      const neural = !!reader.audio;
      if (reader.busy) {
        status.textContent = "Lager lyden…";
      } else if (!reader.playing) {
        status.textContent = "Klar.";
      } else if (neural) {
        const a = reader.audio;
        const tid = (n) => {
          if (!isFinite(n)) return "–";
          const m = Math.floor(n / 60);
          const sek = Math.floor(n % 60);
          return m + ":" + (sek < 10 ? "0" : "") + sek;
        };
        status.textContent = (reader.paused ? "Pauset" : "Spiller") +
          " — " + tid(a.currentTime) + " av " + tid(a.duration);
      } else {
        status.textContent = (reader.paused ? "Pauset" : "Leser") +
          " — del " + Math.min(reader.at + 1, reader.chunks.length) +
          " av " + reader.chunks.length;
      }
      preview.textContent = (reader.playing && !neural)
        ? (reader.chunks[reader.at] || "") : "";
      play.textContent = reader.playing ? "Stopp" : "Spill av";
      play.disabled = reader.busy;
      pause.textContent = reader.paused ? "Fortsett" : "Pause";
      pause.disabled = !reader.playing;
    }
    reader.tick = refresh;

    // --- motorvalg, når det finnes noe å velge mellom
    if (ttsRemote) {
      const row = el("div", { class: "respchips", style: "margin-bottom:14px" });
      [["auto", "Nevral (edge-tts)"], ["browser", "Nettleserstemme"]]
        .forEach(([key, label]) => {
          const on = (key === "auto") === (engine === "neural");
          row.appendChild(el("button", {
            class: "chip resp" + (on ? " on" : ""), type: "button",
            text: label, "aria-pressed": String(on),
            onclick: () => {
              prefs.engine = key;
              saveSpeechPrefs(prefs);
              readerStop();
              renderModal();
            },
          }));
        });
      body.appendChild(row);
    }

    // --- stemme
    if (engine === "neural") {
      const picker = el("select", { class: "field", id: "speech-nvoice" });
      const valgt = prefs.nvoice || ttsRemote.standard;
      ttsRemote.voices.forEach((v) => {
        picker.appendChild(el("option", {
          value: v.id,
          text: v.navn + " — " + v.kjonn + " (" + v.sprak + ")",
          selected: v.id === valgt ? "selected" : null,
        }));
      });
      picker.addEventListener("change", () => {
        prefs.nvoice = picker.value;
        saveSpeechPrefs(prefs);
        readerStop();
      });
      body.appendChild(el("div", { class: "section-label", text: "Stemme" }));
      body.appendChild(picker);
    } else if (speechOk()) {
      const voices = allVoices();
      if (voices.length) {
        const picker = el("select", { class: "field", id: "speech-voice" });
        voices.forEach((v) => {
          picker.appendChild(el("option", {
            value: v.voiceURI,
            text: v.name + " (" + v.lang + ")" +
                  (/^n[bn]/i.test(v.lang) ? "  ← norsk" : ""),
            selected: v.voiceURI === prefs.voice ? "selected" : null,
          }));
        });
        if (!prefs.voice) picker.selectedIndex = 0;
        picker.addEventListener("change", () => {
          prefs.voice = picker.value;
          saveSpeechPrefs(prefs);
        });
        body.appendChild(el("div", { class: "section-label", text: "Stemme" }));
        body.appendChild(picker);
        if (!voices.some((v) => /^n[bn]/i.test(v.lang))) {
          body.appendChild(el("p", { class: "savestate",
            text: "Ingen norsk stemme på denne maskinen." }));
        }
      }
    }

    // --- tempo og dybde, i motorens egne enheter
    function slider(label, key, min, max, step, suffix) {
      const vis = (v) => (suffix ? (v > 0 ? "+" : "") + v + suffix : String(v));
      const out = el("span", { class: "chip", text: vis(prefs[key]) });
      const input = el("input", {
        type: "range", min: String(min), max: String(max),
        step: String(step), value: String(prefs[key]),
        id: "speech-" + key, class: "slider",
      });
      input.addEventListener("input", () => {
        prefs[key] = parseFloat(input.value);
        out.textContent = vis(prefs[key]);
        saveSpeechPrefs(prefs);
      });
      // Nevral lyd er allerede laget når man drar i spaken, så den må
      // lages på nytt for at endringen skal høres.
      input.addEventListener("change", () => {
        if (engine === "neural" && reader.playing) readerStop();
      });
      return el("div", { style: "margin-top:10px" }, [
        el("div", { class: "row spread" }, [
          el("span", { class: "section-label", text: label }), out,
        ]),
        input,
      ]);
    }

    if (engine === "neural") {
      body.appendChild(slider("Tempo", "nrate", -40, 20, 1, "%"));
      body.appendChild(slider("Dybde", "npitch", -30, 10, 1, "Hz"));
      body.appendChild(el("p", { class: "savestate",
        text: "Ro kommer av tempoet. Dybde flytter tonehøyden og gir " +
              "fort en metallisk klang — la den stå på null om du er " +
              "i tvil." }));
    } else {
      body.appendChild(slider("Tempo", "rate", 0.5, 1.2, 0.02));
      body.appendChild(slider("Dybde", "pitch", 0.5, 1.2, 0.05));
    }

    const log = el("button", {
      class: "chip resp" + (prefs.withLog ? " on" : ""), type: "button",
      text: "Ta med loggen", "aria-pressed": String(prefs.withLog),
      onclick: () => {
        prefs.withLog = !prefs.withLog;
        saveSpeechPrefs(prefs);
        readerStop();
        renderModal();
      },
    });
    body.appendChild(el("div", { class: "respchips",
                                 style: "margin-top:14px" }, [log]));

    play = el("button", {
      class: "btn primary", type: "button", text: "Spill av",
      onclick: async () => {
        if (reader.playing) { readerStop(); return; }
        if (engine === "neural") await readerStartNeural(tekst(), prefs);
        else if (readerStart(tekst(), prefs)) refresh();
      },
    });
    pause = el("button", {
      class: "btn", type: "button", text: "Pause",
      onclick: () => readerPause(),
    });

    const knapper = [play, pause];
    if (engine === "neural") {
      knapper.push(el("button", {
        class: "btn small", type: "button", text: "Last ned mp3",
        onclick: async () => {
          try {
            const blob = await ttsFetchAudio(tekst(), prefs);
            await downloadBlob(slugify(s.title || "okt") + ".mp3", blob);
          } catch (e) { toast(String((e && e.message) || e)); }
        },
      }));
    } else {
      knapper.push(el("button", {
        class: "btn small", type: "button", text: "Last ned teksten",
        title: "Ren tekst, klar for tools/opplesing.py og edge-tts",
        onclick: async () => {
          await downloadText(
            slugify(s.title || "okt") + "-opplesing.txt", tekst());
        },
      }));
    }
    body.appendChild(el("div", { class: "row", style: "margin-top:16px" },
                        knapper));
    body.appendChild(status);
    body.appendChild(preview);
    refresh();
  });
}

function viewCharacters(root) {
  root.appendChild(el("h1", { text: "Roller" }));
  root.appendChild(el("p", { class: "lede",
    text: "Spillere, NPCer og fiender i én liste. Alt kan redigeres, og " +
          "alt kan sendes rett inn i en kamp." }));

  const picker = el("input", { type: "file", accept: ".json,application/json",
                               id: "char-file", style: "display:none" });
  picker.addEventListener("change", async () => {
    const file = picker.files && picker.files[0];
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const list = (Array.isArray(parsed) ? parsed : [parsed])
        .map(normalizeChar);
      // Slå sammen på navn, slik at en ny import ikke lager duplikater
      // av folk du allerede har redigert.
      const byName = {};
      state.characters.forEach((c) => { byName[c.name.toLowerCase()] = c; });
      let added = 0, updated = 0;
      list.forEach((incoming) => {
        const hit = byName[incoming.name.toLowerCase()];
        if (hit) {
          Object.assign(hit, incoming, { id: hit.id });
          updated += 1;
        } else {
          state.characters.push(incoming);
          added += 1;
        }
      });
      await saveCharacters();
      toast(added + " lagt til, " + updated + " oppdatert");
      render();
    } catch (e) {
      toast("Kunne ikke lese fila: " + e.message);
    }
    picker.value = "";
  });

  // --- knapperad
  const actions = el("div", { class: "row", style: "margin-bottom:14px" });
  KINDS.forEach((k) => {
    actions.appendChild(el("button", {
      class: "btn", type: "button", text: "+ " + k.label,
      onclick: () => editCharacter(null, k.key),
    }));
  });
  actions.appendChild(el("button", {
    class: "btn small", type: "button", text: "Importer",
    onclick: () => picker.click(),
  }));
  if (state.characters.length) {
    actions.appendChild(el("button", {
      class: "btn small", type: "button", text: "Eksporter",
      onclick: () => download("characters.json", state.characters),
    }));
  }
  actions.appendChild(picker);
  root.appendChild(actions);

  // --- filter etter type
  const counts = { all: state.characters.length };
  KINDS.forEach((k) => {
    counts[k.key] = state.characters.filter((c) => c.kind === k.key).length;
  });
  const filters = el("div", { class: "row", style: "margin-bottom:12px" });
  const chips = [{ key: "all", label: "Alle" }].concat(
    KINDS.map((k) => ({ key: k.key, label: k.plural })));
  chips.forEach((c) => {
    filters.appendChild(el("button", {
      class: "btn small", type: "button",
      "aria-pressed": String(state.charFilter === c.key),
      text: c.label + " (" + (counts[c.key] || 0) + ")",
      onclick: () => { state.charFilter = c.key; render(); },
    }));
  });
  root.appendChild(filters);

  root.appendChild(searchBar("Søk i roller…"));
  root.appendChild(el("div", { style: "height:14px" }));

  if (!state.characters.length) {
    root.appendChild(emptyBox("Ingen roller ennå.",
      "Lag en ny, eller importer characters.json fra Android-appen."));
    return;
  }

  const q = state.query.toLowerCase();
  const shown = state.characters.filter((c) => {
    if (state.charFilter !== "all" && c.kind !== state.charFilter) return false;
    if (!q) return true;
    return [c.name, c.occ, c.archetype, c.player, c.subtitle, c.notes]
      .filter(Boolean).join(" ").toLowerCase().indexOf(q) !== -1;
  });

  if (!shown.length) {
    root.appendChild(emptyBox("Ingen treff."));
    return;
  }

  // Grupper etter type, i den rekkefølgen KINDS definerer.
  KINDS.forEach((k) => {
    const members = shown.filter((c) => c.kind === k.key);
    if (!members.length) return;
    const block = el("section", { class: "day" }, [
      el("div", { class: "day-head" }, [
        el("h3", { text: k.plural }),
        el("span", { text: String(members.length) }),
      ]),
    ]);
    const stack = el("div", { class: "stack" });
    members.forEach((c) => stack.appendChild(characterRow(c)));
    block.appendChild(stack);
    root.appendChild(block);
  });
}

function characterRow(c) {
  const tag = c.kind === "enemy" ? "villain"
    : (c.kind === "npc" ? "event" : null);
  const bits = [c.occ, c.archetype, c.subtitle].filter(Boolean);
  const hp = c.stats.HP ? "HP " + c.stats.HP : null;
  const san = c.stats.SAN ? "SAN " + c.stats.SAN : null;
  const sub = bits.concat([hp, san].filter(Boolean)).join(" · ");

  return el("div", { class: "entry", "data-tag": tag }, [
    el("span", { class: "tick", style: "border-color:transparent" }),
    el("span", { class: "entry-body" }, [
      el("button", {
        class: "linkish", type: "button",
        onclick: () => openCharacter(c),
      }, [el("span", { class: "entry-title", text: c.name || "(uten navn)" })]),
      sub ? el("span", { class: "entry-sub", text: sub }) : null,
    ]),
    el("span", { class: "rowtools" }, [
      el("button", { class: "btn small", type: "button", text: "Til kamp",
                     onclick: () => { addToCombat(c); } }),
      // Snarvei rett til våpenvelgeren. Kjøper spillerne noe i en
      // butikk, skal man slippe å lete etter det inne i editoren.
      el("button", { class: "btn small", type: "button", text: "+ Våpen",
                     title: "Åpne editoren med våpenlista framme",
                     onclick: () => editCharacter(c, null, "weapons") }),
      el("button", { class: "btn small", type: "button", text: "Rediger",
                     onclick: () => editCharacter(c) }),
      el("button", { class: "btn small", type: "button", text: "Dupliser",
                     onclick: () => duplicateCharacter(c) }),
      el("button", { class: "btn small danger", type: "button", text: "Slett",
                     onclick: () => confirmThen("Slett rolle?",
                       "«" + (c.name || "uten navn") + "» blir borte.",
                       async () => {
                         state.characters = state.characters
                           .filter((x) => x.id !== c.id);
                         await saveCharacters();
                         render();
                         toast("Slettet");
                       }) }),
    ]),
  ]);
}

async function duplicateCharacter(c) {
  const copy = normalizeChar(JSON.parse(JSON.stringify(c)));
  copy.id = newId("ch");
  copy.name = uniqueName(c.name || "Uten navn");
  state.characters.push(copy);
  await saveCharacters();
  render();
  toast("Duplisert som «" + copy.name + "»");
}

function uniqueName(base) {
  // «Ghoul» -> «Ghoul 2» -> «Ghoul 3». Nyttig når du legger fire like
  // fiender inn i samme kamp.
  const stem = base.replace(/\s+\d+$/, "");
  const taken = new Set(state.characters.map((c) => c.name));
  if (!taken.has(stem)) return stem;
  let n = 2;
  while (taken.has(stem + " " + n)) n += 1;
  return stem + " " + n;
}

      // --- karakteristikker

      const grid = el("div", { class: "editgrid" });

      const attackList = el("div", { class: "stack" });
      function attackRow(a) {

        const skill = el("input", { class: "field", value: a.skill || "",

        // Et angrep uten treffsjanse er ubrukelig i kamp. Feltet får
        // en markering til det er fylt ut, og viser halv og femtedel
        // ved siden av så snart det står et tall der.
        const atkSteps = el("span", { class: "steps inline" });
        function markSkill() {

          malfunction: a.malfunction, attacks: a.attacks,

          // Kategorien avgjør om angrepet er nærkamp eller avstand, og
          // hvilke skaderegler som gjelder mot skapninger som bare
          // biter på visse våpen. Den må følge med ut av editoren.
          category: a.category, subcategory: a.subcategory,

/* ------------------------- våpenlista ---------------------------- */

// Ferdighetsnavnet i weapons.json er norsk («Skytevåpen (Håndvåpen)»).
// Har karakteren en ferdighet som ligner, bruker vi verdien derfra som
// treffsjanse — ellers står feltet tomt til Keeperen fyller det ut.
// Våpenlista er på norsk, mens karakterarkene ofte har engelske
// ferdighetsnavn. Uten denne broa ville ingen treffsjanse funnet seg
// selv.
const SKILL_SYNONYMS = {
  "håndvåpen": ["handgun", "pistol", "revolver"],
  "rifle": ["rifle", "rifle/shotgun"],
  "hagle": ["shotgun", "rifle/shotgun"],
  "maskinpistol": ["submachine gun", "smg"],
  "maskingevær": ["machine gun"],
  "nærkamp": ["brawl", "fighting"],
  "slagvåpen": ["brawl", "fighting"],
  "kniv": ["knife", "fighting"],
  "sverd": ["sword", "fighting"],
  "øks": ["axe", "fighting"],
  "pisk": ["whip"],
  "bue": ["bow"],
  "kast": ["throw"],
  "sprengstoff": ["demolitions"],
};

function skillCandidates(weaponSkill) {
  const want = String(weaponSkill || "").toLowerCase();
  const out = [want];
  const inner = (want.match(/\(([^)]+)\)/) || [])[1];
  if (inner) out.push(inner.trim());
  const head = want.split("(")[0].trim();
  if (head) out.push(head);
  Object.keys(SKILL_SYNONYMS).forEach((k) => {
    if (want.indexOf(k) !== -1) {
      SKILL_SYNONYMS[k].forEach((alt) => out.push(alt));
    }
  });
  return out.filter(Boolean);
}

function skillValueFor(character, weapon) {
  if (!character || !character.skills) return "";
  const want = String(weapon.skill || "").toLowerCase();
  const keys = Object.keys(character.skills);

  // Prøv synonymene før den løsere delstreng-matchinga under.
  for (const cand of skillCandidates(weapon.skill)) {
    const exact = keys.find((k) => k.toLowerCase() === cand);
    if (exact) {
      const v = String(character.skills[exact]).replace("%", "").trim();
      if (v) return v + "%";
    }
    const loose = keys.find((k) => k.toLowerCase().indexOf(cand) !== -1);
    if (loose) {
      const v = String(character.skills[loose]).replace("%", "").trim();
      if (v) return v + "%";
    }
  }
  // Eksakt treff først, deretter på ordet i parentes (Håndvåpen, Rifle).
  let hit = keys.find((k) => k.toLowerCase() === want);
  if (!hit) {
    const inner = (want.match(/\(([^)]+)\)/) || [])[1];
    if (inner) {
      hit = keys.find((k) => k.toLowerCase().indexOf(inner) !== -1);
    }
  }
  if (!hit) {
    const head = want.split("(")[0].trim();
    if (head) hit = keys.find((k) => k.toLowerCase().indexOf(head) !== -1);
  }
  if (!hit) return "";
  const v = String(character.skills[hit]).replace("%", "").trim();
  return v ? v + "%" : "";
}

/* Treffsjansen for et våpen som legges på en rolle.

   Først rollens egen ferdighet. Finner vi ikke den — mange NPCer har
   bare et knippe ferdigheter skrevet ned — bruker vi treffsjansen fra
   et våpen av samme sort som rollen alt har. Gir vi den en hagle til,
   skyter den like godt med den som med den første. Uten dette blir
   feltet stående tomt, og våpenet er ubrukelig i kamp.            */
function attackSkillFor(character, w) {
  const direct = skillValueFor(character, w);
  if (direct) return direct;
  if (!character) return "";

  const own = (character.attacks || []).filter((a) => a.skill);
  const sub = String(w.subcategory || "").toLowerCase();
  const cat = String(w.category || "").toLowerCase();

  const same = (key, val) => own.find(
    (a) => val && String(a[key] || "").toLowerCase() === val);

  const hit = same("subcategory", sub) || same("category", cat) ||
    (cat === "melee" ? own.find((a) => !isRangedAttack(a)) : null);
  return hit ? hit.skill : "";
}

function weaponToAttack(w, character) {
  return {
    name: w.name,
    skill: attackSkillFor(character, w),
    damage: w.damage || "",
    uses_db: w.uses_db,
    can_impale: !!w.can_impale,
    malfunction: w.malfunction || null,
    attacks: w.attacks || null,
    ammo: w.ammo || null,
    range: w.range || null,
    category: w.category || "",
    subcategory: w.subcategory || "",
    weaponId: w.id,
  };
}

// Skytevåpen og kastevåpen kan ikke møtes med å slå tilbake, og
// unnvikes bare ved å dykke i dekning. Statblokker fra Malleus har
// verken kategori eller rekkevidde — klør og bitt er nærkamp.
function isRangedAttack(a) {
  if (!a) return false;
  if (a.manoeuvre) return false;
  const cat = String(a.category || "").toLowerCase();
  if (cat === "melee") return false;
  if (cat === "firearms" || cat === "heavy") return true;
  const skill = String(a.skill_name || a.skill || "").toLowerCase();
  if (/skytev|kaste|bue|armbrøst/.test(skill)) return true;
  const rng = String(a.range || "").toLowerCase();
  if (!rng) return false;
  return !/berøring|nærkamp|touch|melee/.test(rng);
}

// Våpenvelgeren er et panel inne i editoren, ikke en egen modal:
// modalene her kan ikke stables, så en modal oppå editoren ville bare
// lukket den og kastet endringene.
function weaponPickerPanel(onPick) {
  const bank = state.weapons;
  const panel = el("div", { class: "weappanel", hidden: true });
  if (!bank) return panel;

  const cats = bank.categories || {};
  const listBox = el("div", { class: "picklist short" });
  let query = "";

  function refresh() {
    listBox.innerHTML = "";
    const q = query.trim().toLowerCase();
    const shown = bank.weapons.filter((w) => !q ||
      (w.name + " " + (w.skill || "") + " " + (w.damage || ""))
        .toLowerCase().indexOf(q) !== -1);
    if (!shown.length) { listBox.appendChild(emptyBox("Ingen treff.")); return; }

    const order = [];
    const byCat = {};
    shown.forEach((w) => {
      const c = w.category || "annet";
      if (!byCat[c]) { byCat[c] = []; order.push(c); }
      byCat[c].push(w);
    });
    order.forEach((cat) => {
      listBox.appendChild(el("div", { class: "section-label",
                                      text: cats[cat] || cat }));
      byCat[cat].forEach((w) => {
        const sub = [w.skill, w.damage, w.range,
                     w.attacks ? w.attacks + "/runde" : null,
                     w.ammo ? "mag " + w.ammo : null,
                     w.malfunction ? "feiler " + w.malfunction : null,
                     w.can_impale ? "spidder" : null]
          .filter(Boolean).join(" · ");
        listBox.appendChild(el("button", {
          class: "entry pickrow", type: "button",
          onclick: (e) => {
            e.preventDefault();
            onPick(w);
            toast(w.name + " lagt til");
          },
        }, [
          el("span", { class: "tick", style: "border-color:transparent" }),
          el("span", { class: "entry-body" }, [
            el("span", { class: "entry-title", text: w.name }),
            el("span", { class: "entry-sub", text: sub }),
          ]),
          el("span", { class: "entry-open", text: "LEGG TIL" }),
        ]));
      });
    });
  }

  const search = el("input", { class: "field", type: "search",
                               id: "weap-search",
                               placeholder: "Søk i " + bank.weapons.length +
                                            " våpen…" });
  search.addEventListener("input", debounce(() => {
    query = search.value; refresh();
  }, 180));
  panel.appendChild(search);
  panel.appendChild(el("div", { style: "height:8px" }));
  panel.appendChild(listBox);
  refresh();
  return panel;
}

/* --------------------------- talenter ---------------------------- */

// Talentfeltet er fritekst («Weird Science, Rapid Fire, Hardened»).
// Del det opp og slå hvert navn opp i talentboka.
function splitTalents(text) {
  return String(text || "")
    .split(/[,;\n]/).map((t) => t.trim()).filter(Boolean);
}

/* Talenter skrives ofte med valget sitt hengt på: «Psychic Power:
   Telekinesis», «Animal Companion (dog)». Boka fører dem under
   grunnnavnet, så begge formene må finne fram — og valget skal vises,
   ikke kastes.                                                     */
function splitTalentName(name) {
  const raw = String(name || "").trim();
  let base = raw;
  let spec = "";
  const colon = raw.indexOf(":");
  if (colon !== -1) {
    base = raw.slice(0, colon).trim();
    spec = raw.slice(colon + 1).trim();
  } else {
    const par = raw.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (par) { base = par[1].trim(); spec = par[2].trim(); }
  }
  return { raw: raw, base: base, spec: spec };
}

function lookupTalent(name) {
  const parts = splitTalentName(name);
  return talentIndex[parts.raw.toLowerCase()] ||
         talentIndex[parts.base.toLowerCase()] || null;
}

/* Regelboksene et talent viser videre til — psykiske krefter, weird
   science, Luck-bruk. Uten dem sier talentet bare «see page 83».  */
function talentRulesFor(name) {
  const bank = state.talentRules;
  if (!bank) return [];
  const parts = splitTalentName(name);
  const key = Object.keys(bank.talents || {}).find(
    (k) => k.toLowerCase() === parts.base.toLowerCase() ||
           k.toLowerCase() === parts.raw.toLowerCase());
  if (!key) return [];
  return (bank.talents[key] || [])
    .map((id) => (bank.rules || []).find((r) => r.id === id))
    .filter(Boolean);
}

function openRuleBox(rule, highlight) {
  openModal(rule.title, rule.source, (body) => {
    if (rule.intro) {
      body.appendChild(el("p", { class: "prose", text: rule.intro }));
    }
    // Har rollen valgt én av kreftene, legges den øverst.
    const secs = (rule.sections || []).slice();
    if (highlight) {
      const i = secs.findIndex(
        (x) => x.title.toLowerCase() === String(highlight).toLowerCase());
      if (i > 0) secs.unshift(secs.splice(i, 1)[0]);
    }
    // Merket sier hvilken BOK avsnittet kommer fra, og kan settes
    // sammen med « + ». Begge regelbøkene er lest opp mot teksten sin.
    const SRC_PART = {
      "grunnbok": "grunnboka",
      "pulp": "Pulp Cthulhu",
      "scenario": "scenarioet",
      "eget": "til dette bordet",
    };
    const srcLabel = (s) => {
      const parts = String(s || "").split("+").map((x) => x.trim())
        .filter(Boolean).map((x) => SRC_PART[x] || x);
      return parts.length ? "fra " + parts.join(" + ") : "";
    };
    secs.forEach((sec) => {
      const on = highlight &&
        sec.title.toLowerCase() === String(highlight).toLowerCase();
      const head = el("div", {
        class: "section-label" + (on ? " chosen" : "") });
      head.appendChild(el("span", {
        text: sec.title + (on ? "  ← valgt" : "") }));
      // Hva som er sitat og hva som er skrevet ut, skal alltid stå.
      const tag = srcLabel(sec.source);
      if (tag) {
        head.appendChild(el("span", { class: "line-src", text: tag }));
      }
      body.appendChild(head);
      body.appendChild(el("p", { class: "prose", text: sec.body }));
    });
  }, []);
}

function talentChips(text) {
  const names = splitTalents(text);
  if (!names.length) return null;
  const wrap = el("div", { class: "talentchips" });
  names.forEach((n) => {
    const t = lookupTalent(n);
    wrap.appendChild(el("button", {
      class: "chip talent" + (t ? " known" : ""), type: "button",
      title: t ? "Trykk for forklaring" : "Ikke funnet i talentboka",
      text: n,
      onclick: () => openTalent(n, t),
    }));
  });
  return wrap;
}

// Talentvelger som panel inne i editoren, av samme grunn som
// våpenvelgeren: modalene kan ikke stables oppå editoren uten å bygge
// den opp på nytt, og da ville alt du hadde skrevet gått tapt.
// «kind» er «pulp» eller «insane»; valgte talenter legges til i
// tekstfeltet, kommaseparert.
function talentPickerPanel(kind, targetField) {
  const panel = el("div", { class: "weappanel", hidden: true });
  const all = (state.talents && state.talents.talents) || [];
  const pool = all.filter((t) => t.kind === kind);
  if (!pool.length) {
    panel.appendChild(el("p", { class: "caveat",
      text: "Ingen talenter av denne typen er bygget inn." }));
    return panel;
  }

  const listBox = el("div", { class: "picklist short" });
  let query = "";

  function chosen() {
    return splitTalents(targetField.value).map((x) => x.toLowerCase());
  }

  function toggle(t) {
    const have = chosen();
    const i = have.indexOf(t.name.toLowerCase());
    let list = splitTalents(targetField.value);
    if (i === -1) list.push(t.name);
    else list.splice(i, 1);
    targetField.value = list.join(", ");
    refresh();
  }

  function refresh() {
    listBox.innerHTML = "";
    const q = query.trim().toLowerCase();
    const shown = pool.filter((t) => !q ||
      (t.name + " " + t.description).toLowerCase().indexOf(q) !== -1);
    if (!shown.length) { listBox.appendChild(emptyBox("Ingen treff.")); return; }

    const order = [];
    const byGroup = {};
    shown.forEach((t) => {
      const g = t.group || "Talent";
      if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
      byGroup[g].push(t);
    });

    const have = chosen();
    order.forEach((g) => {
      listBox.appendChild(el("div", { class: "section-label", text: g }));
      byGroup[g].forEach((t) => {
        const on = have.indexOf(t.name.toLowerCase()) !== -1;
        listBox.appendChild(el("button", {
          class: "entry pickrow" + (on ? " picked" : ""), type: "button",
          "aria-pressed": String(on),
          onclick: (e) => { e.preventDefault(); toggle(t); },
        }, [
          el("span", { class: "pickbox" + (on ? " on" : "") }),
          el("span", { class: "entry-body" }, [
            el("span", { class: "entry-title", text: t.name }),
            el("span", { class: "entry-sub", text: t.description }),
          ]),
        ]));
      });
    });
  }

  const search = el("input", {
    class: "field", type: "search",
    id: "talent-search-" + kind,
    placeholder: "Søk i " + pool.length + " talenter…",
  });
  search.addEventListener("input", debounce(() => {
    query = search.value; refresh();
  }, 180));
  panel.appendChild(search);
  panel.appendChild(el("div", { style: "height:8px" }));
  panel.appendChild(listBox);
  refresh();
  return panel;
}

function openTalent(name, talent) {
  openModal(talent ? talent.name : name,
    talent ? talent.group : "Ukjent talent", (body) => {
      if (!talent) {
        body.appendChild(el("p", {
          text: "Dette talentet står ikke i Pulp Cthulhu-tabellene som " +
                "er lest inn. Det kan være fra en annen kilde, eller " +
                "skrevet litt annerledes enn i boka." }));
        const all = (state.talents && state.talents.talents) || [];
        const near = all.filter((t) =>
          t.name.toLowerCase().indexOf(name.toLowerCase().slice(0, 4)) !== -1);
        if (near.length) {
          body.appendChild(el("div", { class: "section-label",
                                       text: "Mente du" }));
          near.slice(0, 6).forEach((t) => {
            body.appendChild(el("button", {
              class: "btn small", type: "button", text: t.name,
              onclick: () => openTalent(t.name, t),
            }));
          });
        }
        return;
      }
      const parts = splitTalentName(name);
      if (parts.spec) {
        body.appendChild(el("div", { class: "callout" }, [
          el("p", { class: "eyebrow", text: "Valgt" }),
          el("p", { text: parts.spec }),
        ]));
      }
      body.appendChild(el("p", { class: "prose", text: talent.description }));

      // Talenter som bare viser videre til et kapittel får reglene
      // hit, i stedet for et sidetall man må slå opp.
      const rules = talentRulesFor(name);
      if (rules.length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Reglene bak" }));
        const stack = el("div", { class: "stack" });
        rules.forEach((r) => {
          stack.appendChild(el("button", {
            class: "entry pickrow", type: "button",
            onclick: () => openRuleBox(r, parts.spec),
          }, [
            el("span", { class: "entry-body" }, [
              el("span", { class: "entry-title", text: r.title }),
              el("span", { class: "entry-sub", text: r.source }),
            ]),
            el("span", { class: "entry-open", text: "ÅPNE" }),
          ]));
        });
        body.appendChild(stack);
      }

      if (state.talents && state.talents.note) {
        body.appendChild(el("p", { class: "caveat",
                                   text: state.talents.note }));
      }
    }, []);
}

function viewBestiary(root) {

    root.appendChild(emptyBox("Ingen fiendebank innebygd."));

  root.appendChild(el("p", { class: "lede",
    text: bank.creatures.length + " skapninger fra " + bank.source +
          ". Legg dem i rollelisten for å redigere dem, eller send dem " +
          "rett inn i en kamp." }));

  root.appendChild(el("div", { class: "callout" }, [
    el("p", { class: "eyebrow", text: "Om tallene" }),
    el("p", { text: bank.note }),
  ]));

  root.appendChild(searchBar("Søk i fiendebanken…"));
  root.appendChild(el("div", { style: "height:14px" }));

  const q = state.query.toLowerCase();
  const shown = bank.creatures.filter((c) => !q ||

  const stack = el("div", { class: "stack" });

      .filter(Boolean).join(" · ");

      el("span", { class: "tick", style: "border-color:transparent" }),

        el("button", { class: "linkish", type: "button",
                       onclick: () => openBeast(c) },
           [el("span", { class: "entry-title", text: c.name })]),
        sub ? el("span", { class: "entry-sub", text: sub }) : null,

      el("span", { class: "rowtools" }, [
        el("button", { class: "btn small", type: "button", text: "Til kamp",

                       text: "Til rollelisten",
                       onclick: () => addBeastToRoster(c) }),
