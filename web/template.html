      });
      [["skills", "Ferdigheter"], ["armor", "Rustning"], ["spells", "Formler"],
       ["special", "Spesielt"], ["sanity_loss", "Sanity-tap"],
       ["possessions", "Våpen og eiendeler"], ["notes", "Notater"]]
        .forEach((pair) => {
          const val = npc[pair[0]];
          if (!val || val === "-") return;
          body.appendChild(el("div", { class: "section-label", text: pair[1] }));
          // Ferdighetslinjene er fritekst fra scenarioet. Halv og
          // femtedel settes inn etter hver prosent.
          const show = pair[0] === "skills" ? annotateSkillText(val) : val;
          body.appendChild(el("p", { class: "prose", text: show }));
          if (pair[0] === "skills" && show !== val) {
            body.appendChild(stepsLegend());
          }
        });
      if (npc.stats_note) {
        body.appendChild(el("p", { class: "caveat", text: npc.stats_note }));
      }
      const refs = crossRefs(npc);
      if (refs) body.appendChild(refs);
      if (npc.id) body.appendChild(noteEditor(npc));
    }, modalActions(npc, "npcs"));
}

/* ------------------ halv og femtedel av en verdi ----------------

   Call of Cthulhu: et Hard-slag krever halve ferdigheten, et Extreme
   en femtedel, begge rundet ned. Karakterarket trykker tallene ved
   siden av verdien, og de bør stå overalt i appen også — ellers må man
   regne i hodet hver gang Keeperen ber om et hardt slag.

   Rundingen er den samme som regelmotoren bruker når den bedømmer et
   kast, så det som står på kortet stemmer alltid med utfallet.     */
function skillSteps(value) {
  const m = String(value === undefined || value === null ? "" : value)
    .match(/\d+/);
  if (!m) return null;
  const n = parseInt(m[0], 10);
  if (!n) return null;
  return { value: n, hard: Math.floor(n / 2), extreme: Math.floor(n / 5) };
}

// «32/13» — det som skal stå med liten skrift ved siden av verdien.
function stepsLabel(value) {
  const s = skillSteps(value);
  return s ? s.hard + "/" + s.extreme : "";
}

// En celle med verdien, og halv/femtedel i dempet skrift etter.
function skillValueCell(value, suffix) {
  const txt = String(value);
  const shown = suffix && !/%$/.test(txt) ? txt + suffix : txt;
  const label = stepsLabel(value);
  const cell = el("td", null, [el("span", { text: shown })]);
  if (label) {
    cell.appendChild(el("span", { class: "steps", text: label }));
  }
  return cell;
}

/* Fritekst med prosenter i seg — «Hide 30%, Track 35%» — får tallene
   satt inn etter hver prosent. Står de der fra før, slik statblokkene
   fra boka ofte har dem, lar vi dem være.                          */
function annotateSkillText(text) {
  return String(text || "").replace(
    /(\d{1,3})\s*%(\s*\(\s*\d+\s*\/\s*\d+\s*\))?/g,
    function (whole, num, already) {
      if (already) return whole;
      const label = stepsLabel(num);
      return label ? num + "% (" + label + ")" : whole;
    });
}

// Én linje som forklarer hva tallparet betyr.
function stepsLegend() {
  return el("p", { class: "steps-legend",
    text: "Tallene etter verdien er hard (halv) og extreme (femtedel)." });
}

// Det slås mot karakteristikkene også — CON for å holde seg våken,
// STR i et grep, POW mot en formel. HP, MP, DB og Build slås det ikke
// mot, så der ville tallparet bare vært støy.
const ROLLED_STATS = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW",
                      "EDU", "SAN", "Luck"];

function statGrid(stats) {
  const grid = el("dl", { class: "statgrid" });
  const order = CHAR_STATS.concat(
    Object.keys(stats).filter((k) => CHAR_STATS.indexOf(k) === -1));
  order.forEach((k) => {
    if (!stats[k]) return;
    const box = el("div", { class: "stat" }, [
      el("dt", { text: k }), el("dd", { text: String(stats[k]) }),
    ]);
    if (ROLLED_STATS.indexOf(k) !== -1) {
      const label = stepsLabel(stats[k]);
      if (label) {
        box.appendChild(el("span", { class: "steps", text: label }));
      }
    }
    grid.appendChild(box);
  });
  return grid.children.length ? grid : null;
}

function attackTable(attacks) {
  if (!attacks || !attacks.length) return null;
  const wrap = el("div", { class: "tablewrap" });
  const table = el("table", { class: "skills" });
  attacks.forEach((a) => {
    const cell = el("td", null, [
      el("span", { text: [a.skill, a.damage].filter(Boolean).join("  ") }),
    ]);
    const label = stepsLabel(a.skill);
    if (label) cell.appendChild(el("span", { class: "steps", text: label }));
    table.appendChild(el("tr", null, [
      el("td", { text: a.name || "—" }), cell,
    ]));
  });
  wrap.appendChild(table);
  return wrap;
}

function openCharacter(pc) {
  // Slå opp rollen på nytt hver gang kortet tegnes. Redigerer man den
  // i et nivå over, skal «Tilbake» vise de nye verdiene — ikke den
  // kopien kortet ble åpnet med.
  const id = pc.id;
  const live = () => normalizeChar(
    state.characters.find((x) => x.id === id) || pc);

  openModal(
    () => live().name || "?",
    () => {
      const c = live();
      return [KIND_LABEL[c.kind], c.occ, c.archetype || c.subtitle,
              c.player ? "spilles av " + c.player : null]
        .filter(Boolean).join(" · ");
    },
    (body) => {
      const c = live();
      const grid = statGrid(c.stats);
      if (grid) body.appendChild(grid);

      const atk = attackTable(c.attacks);
      if (atk) {
        body.appendChild(el("div", { class: "section-label", text: "Angrep" }));
        body.appendChild(atk);
      }

      if (c.skills && Object.keys(c.skills).length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Ferdigheter" }));
        const wrap = el("div", { class: "tablewrap" });
        const table = el("table", { class: "skills" });
        Object.keys(c.skills).sort().forEach((k) => {
          // Navnet er klikkbart når ferdigheten finnes i regelboka.
          const known = lookupSkill(k);
          const cell = el("td", null, [
            known
              ? el("button", { class: "linkish skilllink", type: "button",
                               title: "Hva ferdigheten dekker",
                               text: k, onclick: () => openSkill(k, known) })
              : el("span", { text: k }),
          ]);
          table.appendChild(el("tr", null, [cell,
                                            skillValueCell(c.skills[k], "%")]));
        });
        wrap.appendChild(table);
        body.appendChild(wrap);
        body.appendChild(el("p", { class: "steps-legend",
          text: "Tallene etter verdien er hard (halv) og extreme " +
                "(femtedel). Trykk på navnet for å se hva ferdigheten " +
                "dekker." }));
      }

      if (c.talents || c.insane_talents) {
        [["talents", "Talenter"],
         ["insane_talents", "Insane talents"]].forEach((pair) => {
          if (!c[pair[0]]) return;
          body.appendChild(el("div", { class: "section-label",
                                       text: pair[1] }));
          const chips = talentChips(c[pair[0]]);
          if (chips) body.appendChild(chips);
        });
        body.appendChild(el("p", { class: "caveat",
          text: "Trykk på et talent for å se hva det gjør." }));
      }

      // Formler som id-er slås opp og blir klikkbare kort; er feltet
      // fritekst, faller det gjennom til lista under.
      const sps = spellsOf(c);
      if (sps.length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Formler" }));
        const box = el("div", { class: "stack" });
        sps.forEach((s) => box.appendChild(spellRow(s)));
        body.appendChild(box);
      }

      [["weapons", "Våpen og utstyr"],
       ["armor", "Rustning"],
       ...(sps.length ? [] : [["spells", "Formler"]]),
       ["sanity_loss", "Sanity-tap"], ["backstory", "Bakgrunn"],
       ["notes", "Notater"]].forEach((pair) => {
        if (!c[pair[0]]) return;
        body.appendChild(el("div", { class: "section-label", text: pair[1] }));
        body.appendChild(el("p", { class: "prose", text: c[pair[0]] }));
      });

      // Skapninger med egne mekanismer får dem vist her også, ikke
      // bare i fiendebanken.
      const sp = specialFor(c);
      if (sp) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Spesialregler" }));
        specialRulesBody(sp, body);
      }
    },
    [
      el("button", { class: "btn primary", type: "button", text: "Til kamp",
                     onclick: () => { closeModal(); addToCombat(live()); } }),
      // Ikke lukk kortet først — da legger editoren seg oppå, og
      // «Tilbake» etter lagring viser kortet med de nye verdiene.
      el("button", { class: "btn", type: "button", text: "Rediger",
                     onclick: () => editCharacter(live()) }),
    ]);
}

function itemAsLine(item) {
  const title = item.title || item.name || "(uten tittel)";
  const sub = item.where || item.when || item.deck || "";
  let line = "- " + title;
  if (sub) line += " (" + sub + ")";
  return line;
}

/* «Til sesjonslogg» skrev tidligere rett inn i sammendraget, utenom
   loggen. Da fikk linja verken klokkeslett, forankring eller
   muligheten til å rettes etterpå. Nå går den samme vei som alt
   annet. */
async function copyToSession(item, section) {
  const s = await addLogEntry(itemAsLine(item), {
    ref: item.id ? { id: item.id, section: section,
                     title: item.title || item.name || "" } : null,
    anchor: storyAnchorFor(item, section || ""),
  });
  if (!s) { toast("Ingen scenario å logge på"); return; }
  markSaved();
  updateQuickBar();
  toast("Lagt i loggen til «" + (s.title || "sesjonen") + "»");
}

const VIEWS = [
  { key: "overview",   label: "Oversikt",   group: "Spill" },
  { key: "timeline",   label: "Tidslinje",  group: "Spill" },
  { key: "beats",      label: "Scener",     group: "Spill" },
  { key: "stream",     label: "Økta",       group: "Spill" },
  { key: "clues",      label: "Spor",       group: "Spill" },
  { key: "npcs",       label: "NPCer",      group: "Spill" },
  { key: "locations",  label: "Steder",     group: "Oppslag" },
  { key: "handouts",   label: "Handouts",   group: "Oppslag" },
  { key: "spells",     label: "Formler",    group: "Oppslag" },
  { key: "reference",  label: "Regler",     group: "Oppslag" },
  { key: "combat",     label: "Kamp",       group: "Bordet" },
  { key: "tactics",    label: "Taktikk",    group: "Bordet" },
  { key: "characters", label: "Roller",     group: "Bordet" },
  { key: "bestiary",   label: "Fiendebank", group: "Bordet" },
  { key: "notes",      label: "Notater",    group: "Mitt" },
  { key: "sessions",   label: "Sesjoner",   group: "Mitt" },
  { key: "library",    label: "Bibliotek",  group: "Mitt" },
];

function navBadge(key) {
  // «Økta» viser samlet framdrift over alle delene den inneholder.
  if (key === "stream") {
    const d = state.scenario;
    if (!d) return "";
    let done = 0, all = 0;
    STREAM_SECTIONS.forEach(([k]) => {
      const items = d[k] || [];
      all += items.length;
      done += items.filter((x) => x[FLAGS[k]]).length;
    });
    return all ? done + "/" + all : "";
  }
  // Disse er uavhengige av hvilket scenario som er aktivt.
  if (key === "characters") return state.characters.length || "";
  if (key === "bestiary") {
    return (state.bestiary && state.bestiary.creatures.length) || "";
  }
  if (key === "spells") {
    return (state.spellBook && state.spellBook.spells.length) || "";
  }
  if (key === "tactics") {
    const t = (state.scenario && state.scenario.tactics) || [];
    if (!t.length) return "";
    return t.filter((x) => x.used).length + "/" + t.length;
  }
  if (key === "combat") {
    const cb = state.combat;
    if (!cb || !cb.combatants.length) return "";
    return cb.active ? "R" + cb.round : String(cb.combatants.length);
  }

  const d = state.scenario;
  if (!d) return "";
  if (FLAGS[key] && d[key]) {
    const items = d[key];
    if (!items.length) return "";
    return items.filter((x) => x[FLAGS[key]]).length + "/" + items.length;
  }
  if (key === "npcs" || key === "reference") {
    return (d[key] || []).length || "";
  }
  if (key === "sessions") return state.progress.sessions.length || "";
  if (key === "library") return state.library.items.length || "";
  return "";
}

function renderRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  let group = null;
  VIEWS.forEach((v) => {
    if (v.group !== group) {
      group = v.group;
      rail.appendChild(el("div", { class: "rail-group", text: group }));
    }
    const badge = navBadge(v.key);
    rail.appendChild(el("button", {
      class: "navlink", type: "button",
      "aria-current": state.view === v.key ? "page" : null,
      onclick: () => setView(v.key),
    }, [
      el("span", { text: v.label }),
      badge ? el("span", { class: "count", text: String(badge) }) : null,
    ]));
  });
}

function setView(key) {
  state.view = key;
  state.query = "";
  state.hideDone = false;
  render();
  // Til toppen av dokumentet, ikke til toppen av innholdet — ellers
  // ruller terningkasteren og synk-merket i topplinja ut av syne.
  window.scrollTo({ top: 0, behavior: "auto" });
}

function meter(label, done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return el("div", { class: "meter" }, [
    el("div", { class: "meter-head" }, [
      el("b", { text: label }),
      el("span", { text: done + " / " + total }),
    ]),
    el("div", { class: "meter-track" }, [
      el("div", {
        class: "meter-fill" + (total && done >= total ? " full" : ""),
        style: "width:" + pct + "%",
      }),
    ]),
  ]);
}

function searchBar(placeholder) {
  const input = el("input", {
    class: "field", type: "search", id: "search-" + state.view,
    placeholder: placeholder, value: state.query,
  });
  const run = debounce(() => {
    state.query = input.value;
    const pos = input.selectionStart;
    render();
    const next = document.getElementById("search-" + state.view);
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }, 220);
  input.addEventListener("input", run);
  return input;
}

function entryRow(item, section, tag) {
  const flag = FLAGS[section];
  const done = flag ? !!item[flag] : false;
  const sub = [item.act, item.day, item.when, item.where, item.deck]
    .filter(Boolean).join(" · ");

  const children = [];
  if (flag) {
    children.push(el("button", {
      class: "tick", type: "button", "aria-pressed": String(done),
      "aria-label": (done ? "Fjern kryss for " : "Kryss av ") +
                    (item.title || item.name),
      onclick: (e) => { e.stopPropagation(); toggleFlag(item.id); },
    }));
  } else {
    children.push(el("span", { class: "tick", style: "border-color:transparent" }));
  }

  const bodyBits = [el("span", { class: "entry-title",
                                 text: item.title || item.name || "?" })];
  if (sub) bodyBits.push(el("span", { class: "entry-sub", text: sub }));
  if (item.roll) {
    bodyBits.push(el("span", { class: "entry-sub", text: "Slag: " + item.roll }));
  }
  if (item.points && item.points !== "sant") {
    bodyBits.push(el("span", {
      class: "pointtag " + item.points,
      text: item.points === "villspor" ? "VILLSPOR" : "HALVSANT" }));
  }
  if (item.userNotes) {
    bodyBits.push(el("span", { class: "entry-note", text: item.userNotes }));
  }
  children.push(el("span", { class: "entry-body" }, bodyBits));
  children.push(el("span", { class: "entry-open", text: "ÅPNE" }));

  const row = el("button", {
    class: "entry" + (done ? " done" : ""), type: "button",
    "data-tag": tag || item.tag || null,
    onclick: () => openItem(item, section),
  }, children);

  // Raden er selv en knapp, så loggknappen kan ikke ligge inni den.
  // Den legger en påbegynt linje i hurtignotatet og setter markøren
  // bakerst, slik at man bare skriver hva som faktisk skjedde.
  const log = el("button", {
    class: "logbtn", type: "button", text: "LOGG",
    title: "Skriv et notat om «" + (item.title || item.name) + "»",
    onclick: (e) => {
      e.stopPropagation();
      startQuickNote(quickStub(item, section), {
        id: item.id, section: section, title: item.title || item.name || "",
        anchor: storyAnchorFor(item, section),
      });
    },
  });
  return el("div", { class: "entryline" }, [row, log]);
}

function filterToolbar(section) {
  const items = state.scenario[section] || [];
  const flag = FLAGS[section];
  const done = items.filter((x) => x[flag]).length;
  const bar = el("div", { class: "row spread", style: "margin-bottom:14px" }, [
    el("button", {
      class: "btn small", type: "button",
      "aria-pressed": String(state.hideDone),
      text: state.hideDone ? "Viser bare gjenstående" : "Skjul avkryssede",
      onclick: () => { state.hideDone = !state.hideDone; render(); },
    }),
    el("span", { class: "chip", text: done + " av " + items.length + " avkrysset" }),
  ]);
  // Spor kan i tillegg filtreres på hvilken vei de peker. Å kunne slå
  // opp «hva er det de tror akkurat nå som er feil» midt i en økt er
  // hele poenget med å merke dem.
  if (section === "clues" && items.some((x) => x.points)) {
    const counts = { sant: 0, delvis: 0, villspor: 0 };
    items.forEach((x) => { counts[x.points || "sant"] += 1; });
    const row = el("div", { class: "respchips", style: "margin-top:-6px" });
    [["alle", "Alle", items.length],
     ["sant", "Peker riktig", counts.sant],
     ["delvis", "Halvsanne", counts.delvis],
     ["villspor", "Villspor", counts.villspor]].forEach(([key, label, n]) => {
      row.appendChild(el("button", {
        class: "chip resp" + (state.cluePoints === key ? " on" : ""),
        type: "button", text: label + " " + n,
        onclick: () => { state.cluePoints = key; render(); },
      }));
    });
    return el("div", {}, [bar, row]);
  }
  return bar;
}

function visible(items, section) {
  const flag = FLAGS[section];
  return items.filter((it) => {
    if (state.hideDone && flag && it[flag]) return false;
    if (section === "clues" && state.cluePoints && state.cluePoints !== "alle"
        && (it.points || "sant") !== state.cluePoints) return false;
    return matches(it, state.query);
  });
}

function viewOverview(root) {
  const d = state.scenario;
  root.appendChild(el("p", { class: "eyebrow", text: d.system || "Scenario" }));
  root.appendChild(el("h1", { text: d.title }));
  if (d.tagline) root.appendChild(el("p", { class: "lede", text: d.tagline }));

  if (d.player_pitch) {
    root.appendChild(el("div", { class: "panel accent" }, [
      el("p", { class: "eyebrow", text: "Til spillerne" }),
      el("p", { class: "prose", text: d.player_pitch }),
    ]));
  }

  // Neste hendelse: den første på tidslinja som ikke er huket av.
  const upcoming = (d.timeline || []).filter((e) => !e.triggered);
  if (upcoming.length) {
    const e = upcoming[0];
    const card = el("div", { class: "panel" }, [
      el("p", { class: "eyebrow", text: "Neste hendelse" }),

      el("p", { class: "entry-sub",
                text: [e.day, e.when].filter(Boolean).join(" · ") }),
      el("p", { class: "prose tight",
                text: (e.description || "").slice(0, 260) +
                      ((e.description || "").length > 260 ? "…" : "") }),
      el("div", { class: "row" }, [
        el("button", { class: "btn primary", type: "button", text: "Åpne scenen",
                       onclick: () => openItem(e, "timeline") }),
        el("button", { class: "btn", type: "button", text: "Marker utløst",
                       onclick: () => toggleFlag(e.id) }),
      ]),
    ]);
    root.appendChild(card);
    if (upcoming.length > 1) {
      root.appendChild(el("p", { class: "entry-sub",
        style: "margin:-8px 0 20px",
        text: "Deretter: " + upcoming[1].title }));
    }
  } else {
    root.appendChild(el("div", { class: "panel" }, [
      el("p", { class: "eyebrow", text: "Tidslinje" }),
      el("h3", { text: "Alle hendelser er huket av" }),
    ]));
  }

  root.appendChild(el("h2", { text: "Fremdrift" }));
  const labels = { timeline: "Tidslinje", beats: "Scener",
                   clues: "Spor funnet", locations: "Steder besøkt",
                   handouts: "Handouts utdelt" };
  let allDone = 0, allTotal = 0;
  Object.keys(labels).forEach((key) => {
    const items = d[key] || [];
    if (!items.length) return;
    const done = items.filter((x) => x[FLAGS[key]]).length;
    allDone += done; allTotal += items.length;
    root.appendChild(meter(labels[key], done, items.length));
  });
  if (allTotal) {
    root.appendChild(el("p", { class: "entry-sub",
      text: Math.round((allDone / allTotal) * 100) + "% gjennomspilt — " +
            allDone + " av " + allTotal + " punkter." }));

  if (d.keeper_summary) {
    root.appendChild(el("h2", { text: "Hva som egentlig foregår" }));
    root.appendChild(el("p", { class: "prose", text: d.keeper_summary }));
  }

  if (d.keeper_brief && d.keeper_brief.length) {
    root.appendChild(el("h2", { text: "Keeper-brief" }));
    const stack = el("div", { class: "stack" });
    d.keeper_brief.forEach((b) => {
      stack.appendChild(el("button", {
        class: "entry", type: "button",
        onclick: () => openModal(b.title, "", (body) => {
          body.appendChild(el("p", { class: "prose", text: b.body }));
        }, []),
      }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title", text: b.title }),
          el("span", { class: "entry-sub",
                       text: b.body.slice(0, 90) + "…" }),
        ]),
        el("span", { class: "entry-open", text: "ÅPNE" }),

/* --------------------------- tidslinje -------------------------- */

/* ==================================================================
   ØKTA — tidslinje, scener, spor og steder i én strøm

   Fire faner å bla mellom er tre for mange når man sitter midt i en
   scene og skal finne én ting. Her ligger alt sammen, gruppert etter
   dag, med det som hører sammen samlet: hver dag på tidslinja drar med
   seg scenene og sporene den peker på gjennom connects_to.

   Det som ikke hører til noen dag — steder, og spor som kan dukke opp
   når som helst — står i egne bolker til slutt.
   ================================================================== */

const STREAM_SECTIONS = [
  ["timeline", "Tidslinje"],
  ["beats", "Scener"],
  ["clues", "Spor"],
  ["locations", "Steder"],
];

function streamBadge(section) {
  const label = { timeline: "TIDSLINJE", beats: "SCENE",
                  clues: "SPOR", locations: "STED" }[section];
  return el("span", { class: "streamtag " + section, text: label });
}

/* Samme rad som ellers, men med en merkelapp som sier hvilken del av
   scenarioet den kom fra — ellers mister man oversikten i en blandet
   liste. */
function streamRow(item, section) {
  const line = entryRow(item, section);
  const body = line.querySelector(".entry-body");
  if (body) body.insertBefore(streamBadge(section), body.firstChild);
  return line;
}

/* ==================================================================
   FORMLER

   En formel er ikke bare en beskrivelse — den er en pris. Det man
   trenger midt i en scene er hva den koster, hva som avgjør den, og om
   den som skal kaste den har nok igjen. Derfor står kostnaden alltid
   øverst, og i kamp regnes den mot kasterens magic points.
   ================================================================== */

function spellCost(s) {
  const bits = [];
  // Tall får enheten hengt på; tekststrenger skriver den selv, så
  // «10 MP per seks timer» ikke blir «10 per seks timer MP».
  if (s.cost_mp) {
    bits.push(typeof s.cost_mp === "number"
      ? s.cost_mp + (s.cost_mp === 1 ? " magic point" : " magic points")
      : String(s.cost_mp));
  }
  if (s.cost_san) {
    bits.push(typeof s.cost_san === "number" || /^[\dD+]+$/.test(s.cost_san)
      ? s.cost_san + " Sanity" : String(s.cost_san));
  }
  if (s.cost_pow) {
    bits.push(/POW/i.test(String(s.cost_pow))
      ? String(s.cost_pow) : s.cost_pow + " POW");
  }
  return bits.join(" · ") || "Ingen kostnad";
}

/* Første tall i kostnaden, når det finnes ett. Brukes til å si om
   kasteren har nok — «5 / 10 / 15 etter hvor farlig» gir 5, altså det
   billigste, og da sier vi fra om at det varierer. */
function spellMpNeeded(s) {
  const m = String(s.cost_mp || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}
function spellMpVaries(s) {
  return /[\/–-]|etter|valgfritt|per/i.test(String(s.cost_mp || ""));
}

function spellRow(s) {
  const bits = [el("span", { class: "entry-title", text: s.name })];
  bits.push(el("span", { class: "entry-sub", text: spellCost(s) }));
  const meta = [s.casting_time, s.opposed ? "Motsatt " + s.opposed : null,
                s.range].filter(Boolean).join(" · ");
  if (meta) bits.push(el("span", { class: "entry-sub", text: meta }));
  if (s.who) bits.push(el("span", { class: "entry-sub", text: s.who }));
  return el("button", {
    class: "entry pickrow", type: "button",
    onclick: () => openSpell(s),
  }, [
    el("span", { class: "tick", style: "border-color:transparent" }),
    el("span", { class: "entry-body" }, bits),
    el("span", { class: "entry-open",
                 text: s.in_combat ? "I KAMP" : "ÅPNE" }),
  ]);
}

function openSpell(s, caster) {
  openModal(s.name, spellCost(s), (body) => {
    // Har vi en kaster, sier vi med én gang om det går an.
    if (caster) {
      const need = spellMpNeeded(s);
      const has = parseInt(caster.mp, 10);
      if (need && !isNaN(has)) {
        const ok = has >= need;
        body.appendChild(el("div", {
          class: "callout " + (ok ? "" : "short") }, [
          el("p", { class: "eyebrow", text: caster.name }),
          el("p", { text: ok
            ? "Har " + has + " magic points — nok til " + need +
              (spellMpVaries(s) ? " (det billigste alternativet)" : "") + "."
            : "Har bare " + has + " magic points, trenger " + need +
              ". Resten må tas fra HIT POINTS, én for én — det er skade, "
              + "ikke et slag." }),
        ]));
      }
    }

    const rows = [["Kostnad", spellCost(s)],
                  ["Kastetid", s.casting_time],
                  ["Avgjøres av", s.opposed ? "Motsatt " + s.opposed + "-slag"
                                            : "Ingen motstand"],
                  ["Rekkevidde", s.range],
                  ["Varighet", s.duration]];
    const dl = el("div", { class: "statgrid" });
    rows.forEach(([k, v]) => {
      if (!v) return;
      dl.appendChild(el("div", { class: "stat" }, [
        el("dt", { text: k }), el("dd", { class: "spellval", text: String(v) }),
      ]));
    });
    body.appendChild(dl);

    if (s.effect) {
      body.appendChild(el("div", { class: "section-label", text: "Virkning" }));
      body.appendChild(el("p", { class: "prose", text: s.effect }));
    }
    if (s.at_table) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Ved bordet" }));
      body.appendChild(el("p", { class: "prose", text: s.at_table }));
    }
    if (s.alt_names) {
      body.appendChild(el("p", { class: "caveat",
        text: "Andre navn: " + s.alt_names }));
    }
    body.appendChild(el("p", { class: "caveat",
      text: "Kilde: " + (s.source === "scenario" ? "scenarioet"
            : s.source === "grunnbok" ? "grunnboka"
            : s.source) + (s.page ? ", " + s.page : "") }));
  }, []);
}

function viewSpells(root) {
  root.appendChild(el("h1", { text: "Formler" }));
  root.appendChild(el("p", { class: "lede",
    text: "Hva de koster, hva som avgjør dem, og hvem som kan kaste " +

function viewStream(root) {
  root.appendChild(el("h1", { text: "Økta" }));
  root.appendChild(el("p", { class: "lede",
    text: "Tidslinje, scener, spor og steder i én strøm, dag for dag. " +
          "Det som henger sammen, står sammen." }));
  root.appendChild(searchBar("Søk i alt som skjer…"));
  root.appendChild(el("div", { style: "height:12px" }));

  const sc = state.scenario;
  const on = state.streamOn;

  // Hvilke deler som vises. Slås av og på, og valget huskes.
  const chips = el("div", { class: "respchips", style: "margin-bottom:14px" });
  STREAM_SECTIONS.forEach(([key, label]) => {
    const n = (sc[key] || []).length;
    if (!n) return;
    chips.appendChild(el("button", {
      class: "chip resp" + (on[key] ? " on" : ""), type: "button",
      text: label + " " + n,
      onclick: () => { on[key] = !on[key]; saveStreamPrefs(); render(); },
    }));
  });
  chips.appendChild(el("button", {
    class: "chip resp" + (state.hideDone ? " on" : ""), type: "button",
    text: state.hideDone ? "Skjuler avkryssede" : "Skjul avkryssede",
    onclick: () => { state.hideDone = !state.hideDone; render(); },
  }));
  // Avkryssing er noe man gjør uansett. Står bryteren på, fører den
  // loggen for deg, og da er det ett arbeidssteg færre per hendelse.
  chips.appendChild(el("button", {
    class: "chip resp" + (state.progress.autoLog ? " on" : ""),
    type: "button", text: "Kryss av = logg",
    "aria-pressed": String(!!state.progress.autoLog),
    title: "Hver avkryssing skriver sin egen linje i øktloggen, " +
           "forankret der raden hører hjemme",
    onclick: async () => {
      state.progress.autoLog = !state.progress.autoLog;
      await saveProgress();
      render();
      toast(state.progress.autoLog
        ? "Avkryssing føres i loggen"
        : "Avkryssing føres ikke lenger");
    },
  }));
  root.appendChild(chips);

  const pick = (key) => on[key] ? visible(sc[key] || [], key) : [];
  const tl = pick("timeline");
  const beats = pick("beats");
  const clues = pick("clues");
  const locs = pick("locations");

  if (!tl.length && !beats.length && !clues.length && !locs.length) {
    root.appendChild(emptyBox("Ingen treff."));
    return;
  }

  // Alt som allerede er vist under en dag, skal ikke gjentas nedenfor.
  const shown = new Set();
  const byId = {};
  [...(sc.beats || []), ...(sc.clues || [])].forEach((x) => { byId[x.id] = x; });
  const okBeat = new Set(beats.map((x) => x.id));
  const okClue = new Set(clues.map((x) => x.id));

  let blocks = 0;
  function block(title, count, rows) {
    if (!rows.children.length) return;
    blocks += 1;
    const sec = el("section", { class: "day" }, [
      el("div", { class: "day-head" }, [
        el("h3", { text: title }),
        el("span", { text: String(count) }),
      ]),
    ]);
    sec.appendChild(rows);
    root.appendChild(sec);
  }

  // --- dag for dag, med det tidslinja peker på rett under
  const days = [];
  const byDay = {};
  tl.forEach((it) => {
    const key = it.day || "(udatert)";
    if (!byDay[key]) { byDay[key] = []; days.push(key); }
    byDay[key].push(it);
  });

  days.forEach((day) => {
    const rows = el("div", { class: "stack" });
    let n = 0;
    byDay[day].forEach((it) => {
      rows.appendChild(streamRow(it, "timeline"));
      n += 1;
      shown.add(it.id);
      (it.connects_to || []).forEach((ref) => {
        if (shown.has(ref)) return;
        const linked = byId[ref];
        if (!linked) return;
        const sect = okBeat.has(ref) ? "beats"
                   : okClue.has(ref) ? "clues" : null;
        if (!sect) return;
        const r = streamRow(linked, sect);
        r.classList.add("linked");
        rows.appendChild(r);
        shown.add(ref);
        n += 1;
      });
    });
    block(day, n, rows);
  });

  // --- resten, som ikke henger på en bestemt dag
  const restBeats = beats.filter((x) => !shown.has(x.id));
  if (restBeats.length) {
    const rows = el("div", { class: "stack" });
    restBeats.forEach((x) => rows.appendChild(streamRow(x, "beats")));
    block("Scener uten fast dag", restBeats.length, rows);
  }
  const restClues = clues.filter((x) => !shown.has(x.id));
  if (restClues.length) {
    const rows = el("div", { class: "stack" });
    restClues.forEach((x) => rows.appendChild(streamRow(x, "clues")));
    block("Spor som kan dukke opp når som helst", restClues.length, rows);
  }
  if (locs.length) {
    const byDeck = {}; const decks = [];
    locs.forEach((l) => {
      const k = l.deck || "Andre steder";
      if (!byDeck[k]) { byDeck[k] = []; decks.push(k); }
      byDeck[k].push(l);
    });
    decks.forEach((dk) => {
      const rows = el("div", { class: "stack" });
      byDeck[dk].forEach((l) => rows.appendChild(streamRow(l, "locations")));
      block(dk, byDeck[dk].length, rows);
    });
  }

  if (!blocks) root.appendChild(emptyBox("Ingen treff."));
}

// Slår opp en ferdighet på navn. Karakterarkene bruker egne
// skrivemåter — «Mech. Repair», «Science (Biology)» — så både alias og
// spesialiseringer må finne fram til grunnoppslaget.
let spellIndex = {};

/* Formler på en rolle er lagret som id-er, slik at teksten bare finnes
   ett sted. Godtar også navn, for håndskrevne kort. */
function spellsOf(c) {
  if (!c || !c.spells) return [];
  const list = Array.isArray(c.spells) ? c.spells
             : String(c.spells).split(/[,;]/).map((x) => x.trim());
  return list.map((x) => spellIndex[x] || spellIndex[String(x).toLowerCase()])
             .filter(Boolean);
}

function lookupSpell(x) {
  return spellIndex[x] || spellIndex[String(x || "").toLowerCase()] || null;
}

function lookupSkill(name) {
  const raw = String(name || "").trim().toLowerCase();
  if (skillIndex[raw]) return skillIndex[raw];
  const base = raw.replace(/\s*\(.*\)\s*$/, "").trim();
  if (skillIndex[base]) return skillIndex[base];
  return skillIndex[base + " (specializations)"] || null;
}
