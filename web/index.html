Pulp Cthulhu kapittel 6: Weird Science (s. 86–87)","intro":"Talentet Weird Science lar helten bygge og reparere weird science-innretninger. Talentet Gadget gir én ferdig dings ved spillets start. Hvor mye slikt som finnes i spillet, er Keeperens avgjørelse — i lavere pulp-nivå bør dingser stort sett ligge hos skurker og monstre.\n\nEn dings bør gjøre ÉN ting. En innretning bygget for å frakte folk til månen, frakter folk til månen — ikke til Jupiter.","sections":[{"title":"Å bygge en dings","body":"Helten må først skaffe delene, og ha verksted og verktøy. Det kan gå ut over spending level, tvinge fram salg av verdier, eller kreve at deler blir stjålet.\n\nSå kreves kunnskapen: Mechanical Repair, Electrical Repair, Computer Use, Occult — og Cthulhu Mythos for det virkelig esoteriske. Ett slag, eller et kombinert slag, avgjør om byggingen lyktes. Keeperen setter vanskegraden.\n\nTiden det tar, settes av Keeperen og skal øke med kompleksiteten: en enkel dings 1D10+5 timer, en sammensatt 1D10+5 dager eller måneder, en svært sammensatt 1D10+5 år.","source":"pulp"},{"title":"Vanskegrad etter hva dingsen gjør","body":"REGULAR: én enkel, ikke-ødeleggende funksjon. Eller den etterligner et ferdighetsslag med 40 % sjanse, slik at en ufaglært får 40 %.\n\nHARD: én sammensatt eller ødeleggende funksjon, for eksempel et våpen. Eller den etterligner et ferdighetsslag med 60 %. Eller den gir en bonusterning til ett bestemt ferdighetsslag, med 1D4 bruk.\n\nEXTREME: én svært sammensatt funksjon. Eller én bisarr funksjon. Eller den etterligner et ferdighetsslag med 90 %. Eller den gir en bonusterning med 1D10 bruk. Alt som har med Mythos å gjøre, ligger her.\n\n(Cthulhu Mythos kan aldri etterlignes av en dings.)","source":"pulp"},{"title":"Når det går galt","body":"Et mislykket slag betyr at innretningen ikke virker, og det må gå like lang tid til før et nytt slag er mulig. Med en god begrunnelse kan slaget pushes — men følgen av et mislykket pushet slag skal være dramatisk, sannsynligvis eksplosiv, og koste HP. Et fumlet slag, pushet eller ikke, betyr at innretningen er fullstendig ødelagt.\n\nForslag til mislykkede pushede slag:\n• Dingsen virker en stund, men kan eksplodere når som helst: Luck-slag hver gang den brukes, og ved fiasko eksploderer den og gjør 1D6 skade på brukeren og alle innenfor halvannen meter.\n• Den går opp i en ildkule og gjør mellom 2D10 og 4D10 på alle innenfor tre meter.\n• Den virker ikke som tenkt, har en alvorlig bivirkning, eller oppfører seg farlig og uventet.","source":"pulp"},{"title":"Mythos-teknologi","body":"Mange Mythos-raser har sin egen teknologi. Den faller inn under weird science, men er ikke laget for mennesker. Havner den i menneskehender, er den vanskelig å bruke — brukeren skader som regel seg selv før hen får den til å virke. Mennesker kan heller ikke kopiere slike innretninger eller egentlig forstå hvordan de er laget.","source":"pulp"}]},{"id":"luck-spends","title":"Å bruke Luck","source":"Pulp Cthulhu kapittel 4: Using Luck (s. 60–62)","intro":"Flere talenter koster Luck å bruke. Dette er hele lista over hva en pulp-helt kan kjøpe med Luck-poengene sine.","sections":[{"title":"Justere et ferdighets- eller karakteristikk-slag","body":"Koster 1 for 1. Etter at slaget er gjort, kan Luck brukes til å endre resultatet, poeng for poeng. Det eneste taket er hvor mye Luck helten har igjen.","source":"pulp"},{"title":"«Det er bare en skramme!»","body":"Koster 20 Luck. Etter å ha tatt skade kan helten bruke 20 Luck og få tilbake 1D6 HP med én gang. Man kan ikke komme over maks HP. Keeperen kan også la dette brukes en stund etter at skaden ble tatt, som raskere helbredelse for en hardt skadet helt.","source":"pulp"},{"title":"Unngå en sikker død","body":"Koster alle Luck-poengene, minst 30. Har helten 30 eller flere igjen, kan alle brukes til å komme tilbake fra dødens rand: hen får 1D6+1 HP og dukker opp i neste scene i passende forfatning. Spilleren forteller selv hvordan det gikk til.\n\nHelten står da på null Luck resten av økta, og får neppe 30 igjen på en stund.","source":"pulp"},{"title":"Se bort fra en fumle eller en våpenfeil","body":"Koster 10 Luck. Sier slaget at nærkampvåpenet fumler eller at skytevåpenet feiler, kan 10 Luck brukes til å se bort fra følgen. Selve terningkastet står — angrepet er fortsatt bommet — men våpenet knekker ikke og geværet låser seg ikke.","source":"pulp"},{"title":"Halvere Sanity-tap","body":"Koster dobbelt så mye Luck som tapet. Etter et mislykket Sanity-slag kan tapet halveres ved å bruke Luck lik det dobbelte. Mister helten 8 Sanity, koster det 16 Luck å gjøre det om til 4.\n\nRESILIENT-TALENTET kommer I TILLEGG, og legges på ETTER halveringen: det lar helten skrubbe bort Sanity-tap for 1 Luck per poeng. Boka regner det slik: 20 poeng tap → 40 Luck halverer til 10 → Resilient tar 5 til for 10 Luck → 5 poeng tapt, 50 Luck brukt.\nIngen i gruppa har Resilient, så dette gjelder bare hvis noen bytter talent eller får et nytt.","source":"pulp"},{"title":"Holde seg våken","body":"Koster 1 Luck, og dobles hver runde. Ryker CON-slaget for å holde seg våken, eller er bevisstløshet automatisk, kan helten bruke 1 Luck for å stå oppreist ut runden. Neste runde koster 2, så 4, 8, 16 — betalt i starten av hver runde. Når Luck tar slutt, eller helten ikke vil betale mer, faller hen om.","source":"pulp"}]},{"id":"dive-for-cover","title":"Å dykke i dekning","source":"Call of Cthulhu 7e kapittel 6, og Pulp Cthulhu kapittel 4: Suppressing Fire (s. 65)","intro":"Skytevåpen kan ikke unnvikes på vanlig vis. Det målet kan gjøre, er å kaste seg i dekning — og det gjør ikke skuddet borte, det gjør det bare vanskeligere. Dette er en av reglene folk oftest tar feil av.","sections":[{"title":"Slik det spilles","body":"ET MÅL SOM VET at det blir skutt på, kan kaste seg i dekning: bak noe, ned på gulvet, eller i full fart til siden.\n\nDET KREVER ET UNNVIKELSE-SLAG. LYKKES DET, blir målet vanskeligere å treffe, og ANGRIPEREN FÅR ÉN STRAFFETERNING. Skuddet forsvinner IKKE — det slås fortsatt, bare med straffeterningen på.\n\nEN STRAFFETERNING er en ekstra TIERTERNING: slå én til, behold enerterningen, og bruk det VERSTE av de to tier-resultatene.\n\nPRISEN BETALES UANSETT: den som dykker i dekning mister sitt NESTE angrep, enten unnvikelsen gikk eller ikke. Har figuren alt angrepet denne runden, mister den angrepet sitt NESTE runde. Fram til den får angripe igjen, er det eneste den kan gjøre å unnvike videre angrep. Har en skapning flere angrep per runde, mister den ALLE sammen, ikke bare ett.\n\nBRYTER NOEN DEKNINGEN — om så bare for å skyte et skudd — kan hen bli tatt av en annen som holder på turen sin.\n\nTalentet NIMBLE fjerner kostnaden: helten mister ikke angrepet sitt når hen dykker i dekning mot skytevåpen.\n\nI KAMPTRACKEREN: velg «Dykk i dekning» som forsvar. Går unnvikelsen, ber appen om den ekstra tierterningen og regner ut hva slaget teller som. Tilstanden «Mister neste angrep» settes uansett — har figuren Nimble, fjerner du den bare igjen.","source":"grunnbok + pulp"},{"title":"Undertrykkende ild","body":"En skytter med automatvåpen kan hose ned et område uten å peke ut ett mål. Alle i området får valget om å dykke i dekning, og de som gjør det kan ikke skyte tilbake. Helter velger selv; alle andre antas å kaste seg ned. Deretter trekker Keeperen målet eller målene tilfeldig blant hele gruppa — også blant dem som kom seg i dekning, som da er vanskeligere å treffe.","source":"grunnbok + pulp"},{"title":"Liggende","body":"Den som ligger flatt er et mindre mål: skytevåpen mot en liggende figur får en straffeterning, med mindre det skytes på klosshold. Nærkampangrep mot en liggende får derimot en bonusterning.\n\nÅ ligge er også et stødig skytestativ: en liggende figur får en bonusterning på Firearms-slag. Man kan reise seg når man lykkes med å unnvike eller slå tilbake, eller bruke sin egen tur på å komme seg opp og så handle.","source":"grunnbok + pulp"}]},{"id":"manoeuvres","title":"Manøvrer og Build","source":"Call of Cthulhu 7e kapittel 6, og Pulp Cthulhu kapittel 4: Knockouts (s. 65)","intro":"En manøver er alt som ikke er å gjøre skade: gripe, avvæpne, kaste noen i bakken, dra en bevisstløs venn ut av veien. Build avgjør om det i det hele tatt lar seg gjøre.","sections":[{"title":"Build mot Build","body":"Sammenlign Build på de to. TELL FORSKJELLEN I POENG — det er ikke en av/på-grense:\n\n  • SAMME Build, eller angriperen har HØYERE: ingen modifikator.\n  • Angriperen er ÉTT poeng lavere: ÉN straffeterning.\n  • Angriperen er TO poeng lavere: TO straffeterninger (og to er taket).\n  • Angriperen er TRE poeng eller mer lavere: MANØVEREN ER UMULIG. Hen kan få tak i motstanderen, men mangler kraften og størrelsen til å gjøre noe med grepet.\n\nVED DETTE BORDET: Beefcake har Build 2; Walther, Skjoldvår og Franz har Build 1; Dagrun har Build −1. Polyppen har Build 6. Det betyr at INGEN i gruppa kan gjøre en manøver mot polyppen — forskjellen er fire eller mer. Beefcake er den eneste som kan gjøre noe mot de større motstanderne.\n\nTalentet OUTMANEUVER regner helten som ett Build høyere når hen setter i gang en manøver — Build 1 teller som Build 2 — og flytter dermed grensen ett hakk.","source":"grunnbok"},{"title":"Knockout","body":"Pulp Cthulhu: en figur kan si fra at hen forsøker å slå motstanderen bevisstløs. På sin tur i DEX-rekkefølgen, eller som et overraskelsesangrep, behandles det som en manøver med et stumpt angrep — knyttneve, kølle, geværkolbe. Lykkes manøveren, er motstanderen ute, og tar bare 1 i skade.\n\nDet virker på alt som har en skalle eller et tilsvarende sårbart punkt: mennesker, deep ones, ghouls. Ikke på en shoggoth.","source":"pulp"}]},{"id":"multiple-shots","title":"Flere skudd i samme runde","source":"Call of Cthulhu 7e kapittel 6, og Pulp Cthulhu kapittel 4: Dual-Wielding (s. 71)","intro":"Talentet RAPID FIRE fjerner straffeterningen for flere håndvåpenskudd i samme runde.","sections":[{"title":"Regelen","body":"Skyter man flere skudd i samme runde, får hvert skudd — også det første — en straffeterning. Rapid Fire fjerner den for håndvåpen.\n\nHvor mange skudd våpenet rekker, står i «angrep per runde» på våpenkortet. En Colt M1911 tar tre, en revolver som regel ett til tre.","source":"grunnbok + pulp"},{"title":"To våpen samtidig","body":"Valgfri regel i Pulp Cthulhu: hvem som helst kan skyte eller slå med to våpen, ett i hver hånd. Alle angrepene, også det første, får en straffeterning.\n\nFumlesjansen øker også: kreves 50 eller mer for å lykkes, fumler man på 96–100; kreves under 50, fumler man på 90–100. En våpenfeil inntreffer likevel bare innenfor våpenets egen feilgrense.\n\nÅ ha to våpen endrer ikke evnen til å slå tilbake — man slår tilbake med ett av dem.","source":"pulp"}]},{"id":"sanity-and-mythos","title":"Sanity og Cthulhu Mythos","source":"Call of Cthulhu 7e kapittel 8, og Pulp Cthulhu kapittel 2 (s. 25) og kapittel 4 (s. 65)","intro":"Talentene HARDENED og MYTHOS KNOWLEDGE griper begge inn i Sanity-reglene.","sections":[{"title":"Hardened","body":"Helten mister ikke Sanity av å angripe andre mennesker, av å se stygge skader, eller av å se lik. Mythos-syner rammer fortsatt som før.","source":"pulp"},{"title":"Mythos Knowledge","body":"Helten starter med Cthulhu Mythos 10. Husk at Cthulhu Mythos trekkes fra maks Sanity: taket er 99 minus Mythos-verdien. Ti poeng Mythos betyr et Sanity-tak på 89.","source":"grunnbok + pulp"},{"title":"Pulp-helter og sår","body":"Pulp-helter bruker ikke major wound-regelen. De dør av ett slag som er lik eller større enn maks HP. Er slaget på halve maks HP eller mer OG tar dem til null, ligger de for døden. Ellers besvimer de på null. Et slag på halve maks HP eller mer krever CON-slag for å holde seg våken — og der kan Luck brukes (se «Å bruke Luck»).","source":"pulp"}]},{"id":"pulp-combat-tweaks","title":"Der pulp endrer kampreglene","source":"Pulp Cthulhu kapittel 4: Combat (s. 63–65), mot Call of Cthulhu 7e kapittel 6","intro":"Pulp Cthulhu bruker grunnbokas kampregler, med noen få endringer. Dette er de som faktisk kommer til å dukke opp i dette scenarioet — de andre pulp-endringene har egne bokser (knockout, to våpen, dekning, Luck, sår).","sections":[{"title":"Å komme seg ut av nærkamp — ENDRET","source":"pulp","body":"DETTE ER ANNERLEDES ENN I GRUNNBOKA, og det er lett å ta feil av.\n\nGRUNNBOKA: man kan bruke handlingen sin til å flykte fra nærkamp, så lenge man har en vei ut og ikke holdes fast. Ingen slag.\n\nPULP: det kreves et UNNVIKELSE-SLAG på ens egen tur, MOTSATT mot angriperens Fighting. Vinner den som vil vekk, kommer hen seg ut av nærkampen. Taper hen, har motstanderen presset kampen og holdt hen fast — og hen må prøve igjen neste runde.\n\nVED BORDET: dette betyr at man ikke bare kan gå fra polyppen eller fra skapningen. Noen må dekke tilbaketrekningen, eller så må de slå for det. Si det før finalen, så det ikke kommer som en overraskelse når noen prøver å løpe.\n\nUNNVIKELSE I GRUPPA, rett fra kortene:\n  Dagrun 50 % (25/10) · Beefcake 38 % (19/7) · Walther 32 % (16/6) — han har ingenting skrevet, så det er halve DEX · Franz 27 % (13/5) · Skjoldvår 23 % (11/4).\nIngen av dem er gode nok til å regne med å komme seg løs. Mot polyppens tentakler på 85 % er et motsatt slag nesten tapt på forhånd — så tilbaketrekningen må dekkes av noe annet enn terningen: røyk, ild, syre, eller en manøver fra Beefcake."},{"title":"Å skyte gjennom dekning","source":"pulp","body":"Står målet delvis i dekning, kan skytteren velge å SKYTE GJENNOM dekningen i stedet for å vente på et blink.\n\nDA: én STRAFFETERNING for den delvise skjulingen, PLUSS en rustningsverdi for det man skyter gjennom. Boka gir to eksempler: en lav murvegg gir rustning 10, et tynt tregjerde bare 1.\n\nPÅ ET SKIP: en trelugardør eller en stol er 1–3. En stållugardør eller et skott er så høyt at det ikke er verdt å prøve. En stabel kasser i lasterommet: 3–5, alt etter hva som er i dem.\n\nER MÅLET HELT SKJULT hele runden, kan man fortsatt skyte i blinde. Sjansen avhenger av hvor stort rommet er: er gjemmestedet lite, hever du vanskegraden ETT hakk; er det stort, hever du mer, eller lar bare en kritisk suksess treffe.\n\nHVORFOR DETTE ER NYTTIG HER: skapningen gjemmer seg hele tiden, og spillerne kommer til å spørre om de kan skyte gjennom en dør. Nå har du et tall i stedet for et skjønn."}]}],"talents":{"Psychic Power":["psychic-powers"],"Weird Science":["weird-science"],"Gadget":["weird-science"],"Heavy Hitter":["luck-spends"],"Master of Disguise":["luck-spends"],"Resourceful":["luck-spends"],"Stout Constitution":["luck-spends"],"Tough Guy":["luck-spends","sanity-and-mythos"],"Lucky":["luck-spends"],"Nimble":["dive-for-cover"],"Outmaneuver":["manoeuvres"],"Rapid Fire":["multiple-shots"],"Hardened":["sanity-and-mythos"],"Mythos Knowledge":["sanity-and-mythos"],"Quick Healer":["sanity-and-mythos"]}}</script>
<script type="application/json" id="bundled-keeper-rules">{"version":1,"title":"Regler ved bordet","note":"Oppslag man ellers må bla etter midt i en økt. Hver seksjon sier hvilken bok den kommer fra: «grunnboka» er Call of Cthulhu 7e og «Pulp Cthulhu» er pulp-boka — begge finnes som tekst her, og hver seksjon er lest opp mot sin egen bok. «scenarioet» er Slow Boat to China; «eget» er skrevet av meg til dette bordet. Der de to bøkene er uenige, gjelder Pulp Cthulhu — dette er et pulp-scenario, og de stedene er merket særskilt.","rules":[{"id":"insanity","title":"Galskap — når Sanity ryker","source":"Call of Cthulhu 7e kapittel 8, og Pulp Cthulhu kapittel 5: Pulp Sanity (s. 74–76)","sourced":"blandet","intro":"Beefcake og Walther har begge SAN 45. Polyppen koster 1D3/1D20 for alle om bord. Dette kommer til å skje, sannsynligvis til begge, midt i finalen — og da vil du ikke bla.\n\nRekkefølgen er alltid den samme: et Sanity-slag ryker, tapet trekkes, og hvis tapet var stort nok kommer først et galskapsanfall, deretter en lengre, roligere periode med underliggende galskap, og til slutt tilfriskning.","sections":[{"title":"Pulp eller grunnbok?","source":"eget","body":"UTLØSERNE UNDER ER GRUNNBOKAS — Pulp Cthulhu bruker de samme: 5 poeng på ett slag gir midlertidig galskap, en femtedel av nåværende Sanity på én dag gir varig galskap. DET PULP ENDRER, er hva som skjer etterpå: egne anfallstabeller (de to neste seksjonene), insane talents, og raskere vei ut av varig galskap. Bruk pulp-tabellene, ikke grunnbokas."},{"title":"Hva som utløser hva","source":"grunnbok","body":"MIDLERTIDIG GALSKAP: mister helten 5 eller flere Sanity som følge av ETT enkelt Sanity-slag, ber Keeperen om et INT-SLAG. Merk hvilken vei det går:\n  • SLÅR HEN FEIL på INT, har sinnet fortrengt minnet — og helten blir IKKE gal.\n  • SLÅR HEN RIKTIG, forstår hen hele betydningen av det hen har sett, og blir midlertidig gal. Virkningen begynner øyeblikkelig og varer 1D10 TIMER.\nDette INT-slaget er lett å glemme, og det er den vanligste feilen ved bordet.\n\nVARIG GALSKAP: mister helten en femtedel eller mer av SIN NÅVÆRENDE Sanity i løpet av én spilledag, blir hen varig gal. Det er ikke en femtedel av utgangsverdien — det er av det hen har igjen nå, så terskelen synker for hver runde med tap. «En dag» defineres av Keeperen, og varer vanligvis til helten når et trygt sted der hen kan hvile og samle seg. Om bord på Coolidge betyr det stort sett: til hen kommer seg tilbake til lugaren.\n\nPERMANENT GALSKAP: Sanity nede i null. Helten er uhelbredelig gal og slutter å være spillerkarakter.\n\nMENS ANFALLET PÅGÅR kan helten IKKE miste mer Sanity. Sinnet er alt ute av drift, og alt som skjer videre blir enten glemt eller trodd å være en del av galskapen. Anfallet varer 1D10 KAMPRUNDER når det spilles ut.\n\nETTER ANFALLET, i den underliggende galskapen, gir ETHVERT videre Sanity-tap — om så ett eneste poeng — et NYTT anfall. Den skjørheten varer hele galskapsperioden: 1D10 timer ved midlertidig, og sannsynligvis resten av scenarioet ved varig.\n\nMELLOM ANFALLENE har spilleren full kontroll, og helten kan oppføre seg helt rasjonelt. Galskapen vises utad bare under selve anfallene.\n\nFOBIER OG MANIER teller bare som rollespill mens helten er frisk. MENS HEN ER GAL: nærkontakt med det hen har fobi for gir én STRAFFETERNING på alt annet enn å slåss eller flykte (ikke på Sanity-slag). Utsettes hen for gjenstanden for en mani, får hen én straffeterning på ALLE slag til manien er blitt tilfredsstilt på en eller annen måte.\n\nSANITY-TAKET er 99 minus Cthulhu Mythos. Franz har Mythos 10 og kan derfor aldri komme over 89. Hver gang noen får Mythos-poeng, senkes taket like mye.\n\nHVER GANG en helt får et anfall, kan Keeperen endre ett punkt i bakgrunnen hens, eller legge til et nytt. Bruk det: forvreng et eksisterende punkt, eller knytt helten hardere til historien."},{"title":"Galskapsanfall i sanntid — 1D10","source":"pulp","body":"Brukes når andre helter er til stede. Varer 1D10 RUNDER. Velg, eller slå 1D10:\n\n1 AMNESI: helten slutter å tenke på seg selv som en helt, og mister evnen til å bruke pulp-talentene sine i 1D10 runder.\n\n2 GAL PLAN: i 1D10 runder forfølger helten en irrasjonell eller dårlig gjennomtenkt plan. Planen må enten hjelpe fienden eller øke faren for helten selv eller de andre.\n\n3 RASERI: en rød tåke senker seg, og helten eksploderer i ukontrollert vold og ødeleggelse mot omgivelsene, allierte og fiender om hverandre, i 1D10 runder.\n\n4 SKRYT: helten må skryte, godte seg eller forkynne planene sine høyt i 1D10 runder: «Så, før vennene mine og jeg utsletter hver eneste ghoul i dette hiet, la meg bare fortelle deg dette…»\n\n5 SLAPP AV: helten er overbevist om at trusselen er ubetydelig, og lener seg tilbake i 1D10 runder. Kanskje tenner hen en god sigar, eller skåler med lommelerka.\n\n6 FLYKT I PANIKK: helten må komme seg så langt vekk som mulig, med hvilket middel som helst — også om det betyr å ta det eneste kjøretøyet og la alle andre bli igjen. Hen reiser i 1D10 runder.\n\n7 VIS DEG FRAM: helten blir en oppmerksomhetssyk galning i 1D10 runder, og gjør gjerne dumdristige ting.\n\n8 ALTER EGO: personligheten byttes fullstendig ut i 1D10 runder. Alter egoet er speilvendt: der den ene er vennlig, er den andre kald; der den ene er egoistisk, er den andre uselvisk. Keeperen kan bruke dette til å varsle hva slags monster akkurat denne helten blir om hen noen gang synker ned i varig galskap.\n\n9 FOBI: helten får en ny fobi. Slå 1D100 på fobitabellen, eller velg. Selv om kilden til fobien ikke er til stede, innbiller helten seg at den er der de neste 1D10 rundene.\n\n10 MANI: helten får en ny mani. Slå 1D100 på manitabellen, eller velg. Helten søker å hengi seg til den nye manien de neste 1D10 rundene."},{"title":"Galskapsanfall som sammendrag — 1D10","source":"pulp","body":"Brukes når helten er alene, eller når alle til stede blir gale samtidig. Da spiller du ikke ut timene — du forteller hva som skjedde, og hvor helten kommer til seg selv. Typisk 1D10 timer.\n\n1 AMNESI: helten kommer til seg selv på et ukjent sted, uten å vite hvem hen er, og uten pulp-talentene sine. Minnene kommer sakte tilbake. Talentene kommer bare tilbake i en krise — definert som at noens liv står i fare. Da slås Luck; lykkes det, er talentene tilbake. Ellers kan hen prøve igjen om 1D10 runder.\n\n2 RANET: helten kommer til seg selv 1D10 timer senere, ranet, men uskadd. Bar hen på en Treasured Possession fra bakgrunnen sin, slås Luck for om den ble stjålet. Alt annet av verdi er automatisk borte.\n\n3 MØRBANKET: helten kommer til seg selv 1D10 timer senere, forslått og blå. HP halveres i forhold til før anfallet. Hen er ikke ranet. Hvordan skaden oppsto, bestemmer Keeperen.\n\n4 VOLD: helten eksploderer i vold og ødeleggelse. Når hen kommer til seg selv, er handlingene kanskje synlige, kanskje husket, kanskje ingen av delene. Hvem eller hva hen har gått løs på, og om noen døde, bestemmer Keeperen.\n\n5 IDEOLOGI OG TRO: se på bakgrunnsfeltet for Ideology/Beliefs. Helten utlever det i ekstrem, forrykt og demonstrativ form. En vanlig følge er en variant av storhetsvanvidd, der talentene og troen begynner å tære på menneskeligheten og på skillet mellom rett og galt.\n\n6 VIKTIGE PERSONER: se på bakgrunnsfeltet for Significant People og hvorfor forholdet betyr så mye. I løpet av timene som gikk, har helten gjort sitt beste for å komme nær den personen og gjøre noe med forholdet.\n\n7 INNLAGT ELLER PÅGREPET: helten kommer til seg selv på en lukket psykiatrisk avdeling eller i en politicelle. Hen husker kanskje etter hvert hva som førte dit.\n\n8 FLYKTET I PANIKK: når helten kommer til seg selv, er hen langt borte — og gjerne et bemerkelsesverdig sted. Hvordan hen kom dit, er ukjent for hen selv.\n\n9 FOBI: helten får en ny fobi, og kommer til seg selv 1D10 timer senere etter å ha tatt alle tenkelige forholdsregler for å unngå den.\n\n10 MANI: helten får en ny mani, og kommer til seg selv 1D10 timer senere. Hele anfallet har gått med til å hengi seg til den. Om det er synlig for andre, bestemmer Keeperen og spilleren."},{"title":"Pulp-forskjellene","source":"pulp","body":"Pulp Cthulhu bruker de samme grunnreglene for Sanity som Call of Cthulhu, men galskapen arter seg annerledes: når helter blir gale, kan de oppdage merkelige nye krefter — INSANE TALENTS — og krefter som brukes for mye, driver helten dypere inn i galskapen.\n\nDet insane talentet skal velges som et SVAR på situasjonen helten står i. Galskap kommer alltid av en konkret, traumatisk hendelse; tenk på utløseren når du velger.\n\nVARIG GALSKAP OG BAKGRUNNEN: en helt kommer seg ut av varig galskap blant annet ved å bruke tid på et nøkkelelement i bakgrunnen sin. Det gir en bonusterning til Sanity-slaget. Spiller spilleren scenen overbevisende, kan Keeperen gi en bonusterning TIL. I høyt pulp-nivå kan Keeperen også bare fjerne varig galskap i utviklingsfasen.\n\nNULL SANITY er varig galskap. I pulp skal en slik helt ikke forsvinne stille inn på en anstalt: hen går ut i en flammende finale, eller kommer tilbake senere som skurk. Keeperen overtar rollen."},{"title":"Ved dette bordet","source":"eget","body":"Walther har HARDENED: han mister ikke Sanity av å angripe mennesker, av stygge skader eller av lik. Mythos-syner rammer ham som alle andre. Ikke la det gli sammen.\n\nBeefcake har SAN 45 og Brawl 99. Et raseri-anfall (slag 3 i sanntidstabellen) i en korridor med vennene hans er den farligste enkelthendelsen i hele scenarioet. Ha svaret klart: hvem griper ham, og med hvilken Build?\n\nFranz har SAN 90 og Mythos 10 — han er den stødigste, og den eneste som kan sette navn på det de ser.\n\nÅ HALVERE ET SANITY-TAP koster dobbelt så mye Luck som tapet. Åtte poeng koster seksten Luck. Se regelboksen «Å bruke Luck»."}]},{"id":"spells","title":"Formlene i dette scenarioet","source":"Slow Boat to China, og Call of Cthulhu 7e kapittel 12","sourced":"blandet","intro":"Skapningen har åtte formler i verktøykassa, og scenarioet nevner dem uten å forklare noen av dem. Formelbeskrivelsene under er nå hentet fra grimoiren; der scenarioet avviker fra boka, står begge deler.\n\nGENERELT OM Å KASTE: en formel koster magic points, og som regel Sanity. Har kasteren ikke nok magic points igjen, trekkes resten DIREKTE FRA HIT POINTS, én for én — det er ikke noe CON-slag, det er skade, og Keeperen bestemmer hvordan den ser ut: sår som åpner seg, hud som blemmer, blod fra øyne og ører.\n\nMAGIC POINTS kommer tilbake med ÉTT i timen, og aldri over en femtedel av POW. Skapningen har POW 100 og dermed 20 MP, som er fullt oppladet på ett døgn. Den kan ikke kaste alt på én natt.","sections":[{"title":"Pulp eller grunnbok?","source":"eget","body":"Formlene under er grunnbokas grimoire, og skapningen bruker dem som de står. Der scenarioet avviker, står begge deler, og da gjelder scenarioet."},{"title":"Dominate","source":"grunnbok + scenario","body":"Skapningens viktigste verktøy. Den bruker den på Bunny Bates fra 7. desember, og på Martin Aimesworthy i stedet om Bates blir tatt eller drept.\n\nBOKA: Koster 1 magic point og 1 Sanity point. Kastetid: øyeblikkelig.\nMOTSATT POW-SLAG mot skapningens POW 100.\nLYKKES DET, adlyder offeret kasterens ordrer uten unntak — men bare TIL NESTE KAMPRUNDE ER OVER. Formelen kan kastes på nytt så mange ganger kasteren makter, og hver ny kasting er øyeblikkelig, så kontrollen kan holdes ubrutt i flere minutter. Hver kasting koster det samme.\nREKKEVIDDE 10 METER, og bare én person om gangen. Ordren må være forståelig for offeret, og formelen BRYTES om ordren strider mot offerets grunnleggende natur.\n\nVED BORDET: dette er ikke en fjernkontroll skapningen kan slå på og gå fra. Skal den styre Bates gjennom en hel scene, må den være innenfor ti meter og bruke handlingen sin på det, runde etter runde — og det koster 1 Sanity hver gang. Det er hullet spillerne kan utnytte: få Bates VEKK fra skapningen, så slipper kontrollen av seg selv.\n\nDen som er dominert, husker det som «stemmer». Bates babler om «stemmen inni» og «englekoret har befalt meg» — det er slik det oppleves innenfra."},{"title":"Mindblast","source":"grunnbok + scenario","body":"Brukt under tyveriet av boka den 7. desember.\n\nBOKA: Koster 10 magic points og 1D3 Sanity for kasteren. Kastetid: øyeblikkelig.\nMOTSATT POW-SLAG mot POW 100.\nLYKKES DET, mister offeret 5 SANITY POINTS og blir MIDLERTIDIG GAL — rett på, uten INT-slag, og med et galskapsanfall først. Se regelboksen «Galskap». Offeret kan slite med flashbacks og mareritt i dagene etterpå.\n\nVED BORDET: dette er langt farligere enn det høres ut. Beefcake og Walther har SAN 45; fem poeng er ikke mye, men anfallet kommer uansett, og under anfallet er helten ute av spillerens kontroll i 1D10 runder midt i en kamp. Og fordi enhver videre Sanity-tap under den påfølgende galskapen gir et NYTT anfall, kan én Mindblast tidlig i finalen gjøre at helten er ute av drift resten av scenen.\n\nDet gjør ingen HP-skade i det hele tatt, og derfor hjelper verken rustning, HP eller våpen. Skapningen har 20 MP og kan altså kaste den TO GANGER på en full lading. Bruk den når en kamp går for lett."},{"title":"Mental Suggestion","source":"grunnbok","body":"Mildere enn Dominate, men med mye lengre virkning. Kastetid: 3 RUNDER — den er ikke øyeblikkelig, og kan avbrytes.\n\nVirker bare på vesener med menneskeblod i årene, og må ha offeret synlig for det blotte øye. Kasteren fremsier formelen og SIER forslaget høyt. Motsatt POW-slag.\n\nPRISEN AVHENGER AV HVA MAN BER OM:\n  • Ufarlig (slipp våpenet, gi meg pengene og gå): 5 MP og 1D3 Sanity.\n  • Risikabelt, men ikke mot personens natur (dra til Shanghai, sett fyr på lasterommet): 10 MP og 2D3 Sanity.\n  • Farlig eller selvmorderisk (drep en av vennene dine): 15 MP og 3D3 Sanity.\nEKSTREME FORSLAG som innebærer død eller stor skade krever ET NYTT motsatt POW-slag like før handlingen faktisk utføres. Offeret kan altså våkne i døra.\n\nVARIGHET mot en helt: ÉN RUNDE PER POENG INT kasteren har. Skapningen har INT 90 — det er nitti runder, altså hele resten av kampen og et godt stykke til.\nER HELTENS INT HØYERE ENN KASTERENS, må kasteren vinne et nytt POW-slag hvert tiende runde; første gang hen taper, brytes formelen. Ingen i gruppa har INT over 90, så det unntaket gjelder ikke her.\n\nVED BORDET: bruk den til å få en helt til å gå feil vei, åpne feil dør eller la være å se på noe — ikke til å ta full kontroll. Det er mer ubehagelig, og vanskeligere å oppdage. Og husk at skapningen bare har 20 MP: én farlig suggesjon er en tredjedel av hele beholdningen."},{"title":"Consume Likeness","source":"grunnbok + scenario","body":"Skapningens signatur. Den kan ta skikkelsen til ethvert menneske den dreper og spiser.\n\nBOKA: Koster 10 magic points PER SEKS TIMER mens den holder på, 5 POW PERMANENT, og 1D20 Sanity per offer. Kastetid: flere døgn. Offeret kan ikke avvike mer enn 15 SIZ fra kasteren.\nSkikkelsen holder for øye, kamera og røntgen. SKYGGEN forblir kasterens EGEN — en skarp iakttaker kan se det. Kasterens egne ferdigheter og minner er intakte; offerets er borte.\nMISTER KASTEREN ETT ELLER FLERE HIT POINTS, faller den tilbake til sin egen form. Å gå fra påtatt til egen form tar 20 SEKUNDER; fra egen til påtatt form tar 1D3 MINUTTER. Egen form må innom mellom to skikkelser.\nDYPERE VERSJON: kasteren kan hente fram minner fra de fortærte. Ett ekstra magic point og et slag under POW per opplysning.\n\nSCENARIOET AVVIKER på to punkter, og der gjelder scenarioet:\n  • En ny skikkelse bruker 48 TIMER på å utvikle stemmebånd. Derfor måtte den forlate Petersons skikkelse da Virginia ventet at han skulle snakke.\n  • Den kan bytte mellom sine ferdige menneskeskikkelser i løpet av ÉN KAMPRUNDE.\n\nI EGEN SKIKKELSE kan den ikke lage lyd i det hele tatt, og må kommunisere skriftlig. Telegrammer er typisk.\n\nÅ SPISE noen etterlater bare skinn, hår og knokkelbiter — derav det hule rotteskinnet i lasterommene, og de tomme klærne i Petersons stol.\n\nREGELEN OM HIT POINTS ER GULL VERDT VED BORDET: én eneste treffende kule avslører skapningen, uansett hvem den utgir seg for å være. Fortell spillerne det gjennom et Cthulhu Mythos-slag, så får du en scene der noen må våge å skyte på en de tror er en venn."},{"title":"Graveyard Kiss (pulp-varianten)","source":"grunnbok + scenario","body":"Valgfri, for høyt pulp-nivå. Vekker lik som zombier.\n\nBOKA (Create Zombie-variant): Koster 5 POW PERMANENT og 1D10 Sanity. Kastetid: 1 DØGN per lik. Liket må ha nok kjøtt igjen til å kunne bevege seg. Kasteren legger en unse av sitt eget blod i munnen på liket, kysser leppene og «puster en del av seg selv» inn i kroppen.\nZombien tar imot ENKLE ORDRER, og kan over tid lære å ta mer sammensatte.\nDØR KASTEREN, blir zombien inaktiv og råtner bort. Det er en fullgod seier for gruppa.\nANTALLSGRENSE: kasterens POW delt på fem. Skapningen har POW 100 og kan altså styre TJUE zombier samtidig.\n\nSCENARIOETS VARIANT: skapningen legger en del av insektmassen sin inn i munnen på liket i stedet for blod. Vekkede zombier kan så lage FLERE: insekter hopper fra munnen deres og inn i munnen på dem de dreper.\n\nVED BORDET: som skrevet har skapningen FEM zombier — de fem ofrene. Vanlige zombier er lite utfordring for en pulp-helt, så øk antallet om du bruker dette; taket er tjue. Zombiene er også en utmerket erstatning for Bates i gisselscenen, om han alt er ute av bildet.\n\nMERK PRISEN: 5 POW per zombie er permanent. Fem zombier har kostet skapningen 25 POW. Vil du forklare hvorfor den ikke har hundre av dem, er det forklaringen."},{"title":"Gate","source":"grunnbok + scenario","body":"Skapningens fluktplan: en port til Shanghai, der den slutter seg til Eight Fortunes Mutual Aid Society.\n\nBOKA: Å LAGE en Gate koster PERMANENT POW etter avstand, og tar ÉN TIME PER POW. Å BRUKE den koster magic points lik en femtedel av POW-en som ble brukt til å lage den, pluss 1 SANITY POINT per tur. Returreisen koster det samme.\n\nTABELL (POW å lage / MP å reise / avstand):\n   5 / 1 / 100 mil engelske (160 km)\n  10 / 2 / 1 000 miles\n  15 / 3 / 10 000 miles\n  20 / 4 / 100 000 miles\nFRA STILLEHAVET TIL SHANGHAI er under 10 000 miles. Porten koster altså 15 POW å lage og 15 TIMER å åpne, og 3 magic points pluss 1 Sanity å gå gjennom. Det er tallene du trenger.\n\nHVEM SOM HELST kan gå gjennom en Gate, med mindre den er laget med en nøkkel — et ord eller en gest. Har skapningen ikke lagt inn nøkkel, kan HELTENE følge etter den. Det koster dem 3 MP og 1 Sanity hver. Det er en fullt mulig slutt på scenarioet.\nDYPERE VERSJON: kasteren kan forhåndsbetale magic-point-kostnaden, så den neste som går gjennom bare betaler 1 Sanity.\n\nVED BORDET: dette er ikke en formel spillerne kan hindre med et slag. Det er en TIDSFRIST på femten timer. Rekker de ikke å stoppe skapningen før den får åpnet porten i lasterom 7, slipper den unna — og da har du en hovedskurk med et regnskap å gjøre opp i neste scenario. Eller de følger etter."},{"title":"Pipes of Madness","source":"scenario","body":"Virkningen selve maskinen har på alle innenfor 30 METER når skapningen spiller.\n\nMusikken tvinger fram et Sanity-slag hos alle som hører den. De som ryker, mister forstanden midlertidig — se regelboksen «Galskap», og husk INT-slaget. I praksis betyr det at lasterom 7 er et rom man ikke kan stå i og tenke klart.\n\nMERK: dette er en ANNEN ting enn det maskinen gjør mot Mythos-vesener. Mot dem sender den ut bølger som trekker dem til seg — og gjør dem rasende, fordi maskinen ikke virker som den skal.\n\n(Pipes of Madness står ikke i grimoiren i grunnboka — den er scenarioets egen gjenstand, og alt som står her kommer fra scenarioteksten.)"},{"title":"Bind Flying Polyp","source":"scenario","body":"Finnes i Book of Red Jade. Den ene formelen spillerne selv kan komme til å kaste.\n\nKASTEREN kan ikke være i kamp med vesenet, og må være innenfor 90 meter.\n\nMOTSATT POW-SLAG mot polyppens POW 80. Dette slaget KAN IKKE PUSHES.\n\nKOSTER 1 Sanity point.\n\nBONUSTERNING: kasteren kan investere magic points tilsvarende en femtedel av vesenets POW — altså 16 — for å få en bonusterning. Men hen vet ikke polyppens POW, så det er et sjansespill. Et vellykket Cthulhu Mythos-slag gir riktig antall. Franz har Mythos 10, og det er hans øyeblikk.\n\nLYKKES DET, faller polyppen under kasterens kommando og kan beordres ned i dypet igjen."}]},{"id":"water","title":"Vann, drukning og et skip som synker","source":"Call of Cthulhu 7e kapittel 6, og Slow Boat to China","sourced":"reconstructed","intro":"Hele sluttspillet foregår på et skip som går ned. Dagrun har Swim 30 %, Beefcake 25 %, og de tre andre har ingenting skrevet. Dette kommer til å avgjøre hvem som overlever.","sections":[{"title":"Pulp eller grunnbok?","source":"eget","body":"Drukningsreglene under er grunnbokas og gjelder også i pulp. MEN: en pulp-helt kan bruke Luck på CON-slagene, og på Swim-slaget. Regn med at heltene overlever hvis de vil bruke poeng på det — det er passasjerene og mannskapet som drukner."},{"title":"Når slår man Swim?","source":"grunnbok","body":"Bokas egen regel, fra ferdighetsbeskrivelsen: «Slå bare Swim i kriser eller fare, eller når Keeperen finner det passende. Et mislykket pushet Swim-slag kan koste hit points. Det kan også føre til at personen blir dratt med av strømmen.»\n\nVANLIG VANSKEGRAD: å svømme i en rask strøm.\nHARD: å svømme mot en rask strøm fullt påkledd, eller i dårlig vær.\n\nÅ holde seg flytende i rolig vann krever ikke slag i det hele tatt. Det er når skipet krenger, når bølgene går, og når klærne og skoene blir tunge, at slaget kommer."},{"title":"Å drukne","source":"grunnbok","body":"Boka har én enkel mekanisme, og den er kortere enn folk tror:\n\nET CON-SLAG HVER RUNDE. FØRSTE GANG SLAGET RYKER, puster hen inn vann og tar 1D6 SKADE HVER RUNDE deretter — til hen dør, eller til hen får pustet igjen. ER PERSONEN I FYSISK ANSTRENGELSE — svømmer for livet, slåss, klatrer — kreves HARD suksess på CON-slaget.\nDet er ingen regel i boka om hvor mange runder man kan holde pusten. Rolig vann og en rolig person er ikke en krise, og da ber du ikke om slag i det hele tatt.\n\nFranz har CON 30: han slår 30, og 15 når han anstrenger seg. Beefcake har CON 75: han slår 75, og 37. Skjoldvår har CON 65 og slår 65/32. Dagrun har CON 55, Walther 50. Det er stor forskjell på disse tallene, og den forskjellen er hele poenget.\n\nÅ SVØMME I SIKKERHET — bokas egen behandling av akkurat denne situasjonen: «En etterforsker har falt i opprørt vann og må svømme i sikkerhet eller drukne. Keeperen ber om et Swim-slag med målet «svøm i sikkerhet». Taper spilleren, gjøres ingen framgang, og vann kan pustes inn; spilleren må slå CON eller ta 1D6 skade per runde. SITUASJONEN KREVER ET PUSHET SLAG — det eneste alternativet er at etterforskeren gir opp og drukner. Bommer spilleren på det pushede Swim-slaget, er etterforskeren forslått og halvdruknet, og tar 1D6 skade per runde.»\n\nDA MÅ DU TA ET VALG, sier boka, og det valget er ditt: enten står livet på spill, og hen fortsetter å miste hit points hver runde til noen andre redder hen — eller du dropper drukningsskaden og lar hen skylle i land et annet sted, uten eiendeler og i dårlig forfatning. På et skip midt i Stillehavet er det andre alternativet en livbåt noen andre har firt ned.\n\nEN BEVISSTLØS PERSON i vann slår ikke. Hen drukner.\n\nFØRSTEHJELP: boka nevner uttrykkelig «å gjenopplive en druknet» som noe First Aid dekker. Et vellykket First Aid-slag gir 1 hit point, og må gis innen én time."},{"title":"Kaldt vann","source":"eget","body":"BOKA HAR INGEN REGEL FOR NEDKJØLING — den nærmeste er tabellen over andre skadetyper, som ikke nevner kulde. Alt under her er noe jeg har skrevet for dette bordet, så du har et tall å bruke i stedet for å finne på et midt i finalen. Bytt det gjerne, men vær konsekvent.\n\nStillehavet utenfor Japan i desember holder rundt fjorten grader. Det er ikke iskaldt, men det er langt under kroppstemperatur.\n\nCON-slag etter ti minutter i vannet, og deretter hvert tiende minutt. Hvert mislykket slag gir 1 HP og en straffeterning på alt fysisk til personen er tørr og varm igjen. Etter en halvtime begynner de som ikke er kommet opp å miste bevisstheten.\n\nDETTE ER KLOKKA I FINALEN. Livbåtene tar tid å fire ned. Si tallene høyt: «Det er gått ti minutter.»"},{"title":"Skipet som går ned","source":"scenario + eget","body":"Polyppen river et hull i skroget. Coolidge tar inn vann og krenger, og det er bare et spørsmål om tid.\n\nBoka sier: SPØR HELTENE HVA DE VIL GJØRE. Løper de til livbåtene og tenker bare på seg selv, eller hjelper de så mange som mulig — leter etter innesperrede passasjerer, får kvinner og barn i båtene?\n\nSVARET ER VERDT SANITY:\n  +1D10 for å prøve å redde så mange som mulig fra å drukne\n  −1D10+2 for å forlate skipet uten tanke på andre\n\nRESTEN HER ER MITT, ikke scenarioets: et krengende dekk er glatt og skrått: Hard DEX for å løpe, vanlig for å gå. Dører under vannlinjen kan ikke åpnes mot vanntrykket — Extreme STR, eller finn en annen vei. En livbåt tar tid å fire ned, og går skjevt hvis bare én ende fires.\n\nOverlevende plukkes opp i løpet av noen timer."}]},{"id":"hazards","title":"Fall, ild, elektrisitet og syre","source":"Call of Cthulhu 7e kapittel 6","sourced":"reconstructed","intro":"Taktikkortene sender deg mot dampledninger, oversvømte lasterom og brann i trange korridorer. Her er tallene fra Tabell III: Andre skadeformer, så du slipper å finne på dem midt i en kamp.\n\nBOKAS GRUNNREGEL: hver skadetype gjelder ÉN hendelse eller ÉN RUNDE — én runde med drukning, én runde med å brenne, én kule. Blir man værende i faren, tar man skaden på nytt hver eneste runde.","sections":[{"title":"Pulp eller grunnbok?","source":"eget","body":"Tallene under er grunnbokas skadetabell, og den gjelder også i pulp. FORSKJELLEN I PULP er at helter kan bruke Luck til å slippe unna — se regelboksen «Å bruke Luck» — og at de ikke tar major wound av dem."},{"title":"Fall","source":"grunnbok","body":"Boka skiller på HVA MAN LANDER PÅ, per tre meter (10 fot) fall:\n  • Bløt myr: 1D3 per tre meter\n  • Gress: 1D6 per tre meter\n  • BETONG: 1D10 per tre meter\nPå et skip er det stål og last — bruk BETONG-raden. Et fall ned i et lasterom fra lukekarmen er seks til ni meter: 2D10 til 3D10. Det dreper en helt. Dette er den viktigste rettelsen i hele boksen, for et fall på gress og et fall ned i lasterom 3 er ikke samme sak.\n\nET VELLYKKET JUMP-SLAG HALVERER SKADEN. Boka sier det uttrykkelig: «Faller man fra en høyde, forbereder et vellykket Jump-slag fallet og halverer den resulterende skaden.» Scenarioet bruker akkurat denne regelen når noen klatrer i skroget og faller (3D6, halvert med Jump) — der bruker scenarioet gress-raden, og det gjelder foran boka i den scenen.\n\nJUMP I GRUPPA: Beefcake 50 % (25/10), Franz 35 % (17/7), Dagrun 30 % (15/6). Walther og Skjoldvår har ingenting skrevet og står på grunnverdien 20 % (10/4). De to er altså de som virkelig bør holde seg unna lukekarmene."},{"title":"Ild og damp","source":"grunnbok + eget","body":"BOKA:\n  • En brennende fakkel som treffer: 1D6.\n  • FLAMMEKASTER, eller å løpe gjennom et rom som står i brann: 1D10.\n  • Å puste i røykfylt luft: 1D3 — men først når CON-slaget ryker. Røyk følger kvelningsregelen: CON-slag hver runde, og fra og med det første slaget som ryker, skade hver runde til man får puste. HARD CON om man anstrenger seg — og det gjør man alltid i en brann.\nOg husk grunnregelen: skaden kommer på NYTT hver runde man blir stående.\n\nSKÅLDENDE DAMP fra en brukket ledning i maskinrommet står ikke i boka. Mitt forslag, lagt på samme skala: 2D6 til alle innenfor tre meter i det den ryker, og deretter 1D6 per runde så lenge man blir i rommet. Rommet fylles og sikten går.\n\nBRANN SPRER SEG. Gi den en klokke, som taktikkortet sier: så mange runder før den når neste rom."},{"title":"Elektrisitet","source":"eget","body":"TABELLEN I BOKA HAR INGEN RAD FOR STRØM. Tallene under er mine, satt på samme skala som resten av tabellen — bruk dem, men vit at de ikke er sitat.\n\nEt støt fra skipets høyspentanlegg: 1D10 («alvorlig»-raden, samme som en .38-kule) og et CON-slag for ikke å bli slått ut. Vann i rommet gjør at hele flaten leder — alle som står i vannet tar skaden, hver runde strømmen står på.\n\nDETTE ER VERDT Å MERKE SEG MOT POLYPPEN: den tar FULL skade fra elektriske angrep, og bare minste mulige fra fysiske. En knekt høyspentkabel i et oversvømt lasterom er et bedre våpen enn noe gruppa bærer på. Det er verdt å la noen finne ut av det med et Electrical Repair- eller Mechanical Repair-slag."},{"title":"Syre","source":"grunnbok + scenario","body":"BOKA: mild syre gjør 1D3, sterk syre 1D6 — per runde man er utsatt for den.\n\nSCENARIOET OVERSTYRER dette for én bestemt ting: saltsyren i glassballongene i lasterom 7 gjør 1D10 PER RUNDE og IGNORERER RUSTNING. Scenarioet sier det uttrykkelig som en av måtene å skade polyppen på, og der gjelder scenarioet.\n\nDet er det eneste kjemiske våpenet om bord, det står oppgitt i klartekst, og spillerne finner det bare hvis de har vært nede i lasterom 7 før finalen. Det er en belønning for å ha utforsket — ikke gi den bort."},{"title":"Hele tabellen, og gift","source":"grunnbok","body":"TABELL III: ANDRE SKADEFORMER — hele skalaen, så du kan plassere hva som helst annet du finner på:\n\n1D3 SMÅTT (man tåler mange): knyttneve, spark, skalle, mild syre, røykfylt luft*, en kastet stein på størrelse med en never, fall per tre meter ned i bløt myr.\n\n1D6 MIDDELS (kan gi major wound; noen få slike dreper): fall per tre meter ned på gress, kølle, sterk syre, å puste vann*, vakuum*, kule fra lite kaliber, pil, ild (brennende fakkel).\n\n1D10 ALVORLIG (gir trolig major wound; én–to slike slår ut eller dreper): .38-kule, fall per tre meter ned på betong, øks, ild (flammekaster, å løpe gjennom et brennende rom), å være 6–9 meter fra en håndgranat eller dynamittkubbe som går av, mild gift**.\n\n2D10 DØDELIG (gjennomsnittsmennesket har 50 % sjanse for å dø): påkørt av bil i 50 km/t, 3–6 meter fra en granat, sterk gift**.\n\n4D10 LIVSFARLIG (død er nesten sikkert): påkørt av bil i fart, nærmere enn tre meter fra en granat, dødelig gift**.\n\n8D10 SPLATT: front mot front i høy fart, påkørt av tog.\n\n* KVELNING OG DRUKNING: CON-slag hver runde; fra og med første slag som ryker, skade hver runde til død eller til man får puste. HARD CON om man anstrenger seg.\n\n** GIFT: et EKSTREMT CON-slag HALVERER skaden. Gift kan i tillegg gi mageknip, oppkast, diaré, frysninger, svette, kramper, gulsott, endret puls, svekket syn, krampeanfall, bevisstløshet og lammelse — om det hindrer personen i å handle, eller bare gir straffeterning, er Keeperens valg. Er CON-slaget en KRITISK suksess, kan Keeperen la personen riste giften helt av seg."},{"title":"Høyt pulp: krigsskipene","source":"scenario","body":"Scenarioet gir deg denne uttrykkelig, for høyt pulp-nivå: raske helter med militær bakgrunn kan prøve å tilkalle hjelp fra britiske, amerikanske eller japanske krigsskip som ligger utenfor.\n\nET BATTERI SKIPSKANONER GJØR 10D10 SKADE. Én eller to salver skal ødelegge polyppen, eller såre den nok til at den trekker seg ned i havet.\n\nBLIR DEN ØDELAGT, smeller kroppen ned på skipet med et tungt knask og begynner å råtne nesten med det samme. I løpet av minutter er alt som er igjen en fettete væske og en vond lukt.\n\nVED BORDET: dette er en belønning for å tenke stort, ikke en knapp. Noen må nå radiorommet, noen må kunne signalere, og noen må overbevise en kaptein om at det står et flyvende monster på et passasjerskip. Det er tre scener, og alle tre er bedre enn å slå Brawl en gang til.\n\nOG HUSK: skipet synker uansett. Kanonene redder heltene, ikke Coolidge."}]},{"id":"chases","title":"Jakt — når noen stikker av","source":"Call of Cthulhu 7e kapittel 7, og Slow Boat to China","intro":"Dette er den regelen som oftest mangler ved bordet, og scenarioet legger opp til minst tre jakter: skapningen som forsvinner ned en gang etter tyveriet, Bates som løper fra gisselscenen, og rotteskikkelsen i lasterommene.\n\nKort sagt: jakt er IKKE et Athletics-slag. Det er en egen struktur med runder, posisjoner og hindringer — og den er laget for at den som er tregest fortsatt skal kunne vinne, ved å være smartere. Det er nettopp derfor den er verdt å bruke.","sections":[{"title":"Pulp eller grunnbok?","source":"eget","body":"Jaktreglene under er grunnbokas, og de er de samme reglene Pulp Cthulhu bygger på. Det pulp legger til, er talenter og Luck: en helt som bommer et fartsslag eller et hindringsslag kan bruke Luck på det, og flere talenter gir bonusterninger i jakt. Sjekk heltenes talenter før du kjører en jakt."},{"title":"1. Kommer det i det hele tatt en jakt?","source":"grunnbok","body":"Først avgjør du om jakten må spilles ut, med ETT slag hver.\n\nFARTSSLAGET justerer MOV for resten av jakten:\n  • Til fots: CON-slag.\n  • I kjøretøy: Drive Auto-slag for sjåføren.\n  • Suksess: ingen endring i MOV.\n  • EKSTREM suksess: +1 MOV for resten av jakten.\n  • Bom: −1 MOV for resten av jakten.\n\nSAMMENLIGN SÅ: er den flyktendes justerte MOV HØYERE enn forfølgerens, SLIPPER hen unna. Du forteller hvordan, og går videre i spillet. Ingen jakt spilles ut.\nEr forfølgerens justerte MOV LIK ELLER HØYERE, er jakten i gang.\n\nGRUPPAS MOV: sjekk karakterkortene. Forskjellen på MOV 7 og MOV 8 avgjør hele jakten før den begynner, og én bommet CON kan snu den."},{"title":"2. Kutt til jakten","source":"grunnbok","body":"Uansett hvor jakten begynte — side ved side eller en kilometer fra hverandre — flytter du handlingen til det punktet der forfølgeren er TO POSISJONER bak. Den flyktende har alt hatt sin ene sjanse til å slippe unna, gjennom fartsslaget.\n\nÉN POSISJON i stedet for to gir en langt mer anspent jakt; boka råder mot å legge avstanden LENGER enn to.\n\nPOSISJON er ikke en fast avstand — det er en bit av fortellingen. En låst dør eller en trapp kan skille to posisjoner, mens en annen er et punkt på en åpen strekning. Et hotell kan deles i: svingdør, fullpakket lobby, trapp, heis, korridor, restaurant, kjøkken, soverom, kontorer.\n\nPÅ COOLIDGE er posisjonene gitt av seg selv: promenadedekket, trappen ned, korridoren i andre klasse, maskinromsdøra, leideren, lasterom 3, gangen mellom lasterommene, lasterom 7. Tegn dem som prikker på en lapp og sett en bokstav på hver deltaker. Kryss ut og flytt.\n\nGÅR JAKTEN samtidig med en kamp et annet sted på skipet, må du passe på at avstanden mellom posisjonene ikke blir for stor — ellers løper den ene gruppa et kvartal mens den andre knuser en stol over hodet på noen."},{"title":"3. Runden og bevegelsespoengene","source":"grunnbok","body":"En jaktrunde og en kamprunde er det SAMME, og kan byttes om. Man handler i DEX-orden, høyest først; ved likt, motsatt DEX-slag.\n\nBEVEGELSESPOENG — dette er kjernen i hele systemet:\n  • ALLE får ÉTT bevegelsespoeng.\n  • PLUSS ett for hvert poeng deres MOV overstiger MOV-en til den TREGESTE i jakten.\nDen tregeste har altså alltid nøyaktig ett. Den som ligger 2 over den tregeste, har tre.\n\nPÅ SIN TUR kan man:\n  • Flytte framover (1 bevegelsespoeng per posisjon, om veien er klar).\n  • Innlede ÉTT angrep med Fighting, Firearms eller Drive Auto (koster 1 bevegelsespoeng). Monstre som har flere angrep per runde, får alle på sin tur.\n  • Kaste en formel.\n  • Gjøre noe annet som tar tid og kanskje et slag — dirke en lås, for eksempel.\n\nMAN KAN VENTE og la en annen handle først. Vil flere handle samtidig, går høyest DEX først. Står begge på å vente på den andre, kan runden ende uten at noen av dem gjorde noe.\n\nPUSHEDE SLAG BRUKES IKKE I JAKT. Som i kamp får man normalt et nytt forsøk neste runde i stedet."},{"title":"4. Hindringer — det som gjør jakten verdt å spille","source":"grunnbok","body":"En jakt på flat, åpen mark er avgjort på forhånd av tall. Hindringene er det som gjør den til en scene.\n\nHINDRING (hazard): sinker, og kan skade. Du sier hvilken ferdighet som kan brukes og hvilken vanskegrad. Ta imot forslag fra spillerne — boka ber deg uttrykkelig om det.\n  Climb over gjerder og vegger. Swim over vann. Dodge gjennom en folkemengde eller forbi veltede søppelkasser. STR gjennom tykk gjørme. DEX for å løpe langs en kant uten å falle. Drive Auto i biljakt.\n\nÅ TA DET FORSIKTIG: man kan bruke bevegelsespoeng for å kjøpe BONUSTERNINGER på slaget. 1 poeng = 1 bonusterning, 2 poeng = 2 bonusterninger (og to er taket). Dette er hele grunnen til at den tregeste kan vinne: hen kan ikke løpe fra noen, men hen kan komme seg over gjerdet uten å falle.\n\nLYKKES SLAGET: ingen ekstra forsinkelse eller skade, og man går videre.\nBOMMER SLAGET: du bestemmer om det gjør skade, og hvor mye — bruk Tabell III (se regelboksen «Fall, ild, elektrisitet og syre»). I tillegg mister man 1D3 BEVEGELSESPOENG. Har man alt brukt opp runden sin, tas de av neste runde — skriv «−1» på markeren.\nUANSETT om slaget gikk eller ikke, flytter man til neste posisjon etter en hindring.\n\nBARRIERE (barrier): stopper all framgang til den er forsert eller ødelagt. En låst dør, et høyt gjerde, en avgrunn. Skillet er skjønn: å klatre over et gjerde i brysthøyde er en hindring, over en to meter høy mur er en barriere. Å klatre OPP til et vindu i andre etasje er en barriere; å klatre NED er en hindring — man kan alltid bare falle.\n  Jump over et gap eller fra tak til tak. STR for å bryte opp en dør. Locksmith for å låse den opp.\n\nÅ BRYTE NED EN BARRIERE: ingen angrepsslag kreves. Kjøretøy gjør 1D10 skade per poeng Build. Klarer et kjøretøy ikke å ødelegge barrieren, er kjøretøyet vraket. Blir barrieren ødelagt, tar kjøretøyet skade lik halvparten av barrierens HP.\n  Innerdør eller tynt tregjerde: 5 HP.\n  Vanlig bakdør: 10 HP.\n  Kraftig ytterdør: 15 HP.\n  Murvegg (23 cm): 25 HP.\n  Voksent tre: 50 HP.\n  Betongsøyle på en bro: 100 HP.\n\nPÅ SKIPET: en lugardør er 10 HP, en skottdør av stål er en barriere ingen bryter ned — den må åpnes. Beefcake med Build 2 og STR 90 er gruppas døråpner."},{"title":"5. Å slåss under en jakt","source":"grunnbok","body":"MAN MÅ STÅ PÅ SAMME POSISJON for å angripe hverandre — med mindre man skyter. Å innlede et angrep koster 1 bevegelsespoeng. Ellers løses angrep som i vanlig kamp, med vanlig antall angrep per runde.\n\nDEN SOM BLIR ANGREPET FÅR ALLTID SVARE — slå tilbake eller dodge — uansett om hen har bevegelsespoeng igjen. Det er viktig, og lett å glemme.\n\nMANØVRER I JAKT: å felle, dytte eller få motstanderen ut av kontroll gjøres som en manøver. Lykkes den, er virkningen den samme som å BOMME på en hindring: 1D3 bevegelsespoeng tapt, og skade fra Tabell III om det passer. De vanlige Build-reglene gjelder: 1 Build større motstander = 1 straffeterning, 2 større = 2 straffeterninger, 3 større = umulig.\n\nSKYTING UNDER JAKT:\n  • STOPPER man opp et øyeblikk, skyter man som normalt (étt skudd med rifle, opptil tre med håndvåpen). Det koster 1 bevegelsespoeng, og man flytter seg ikke.\n  • FORTSETTER man å løpe eller kjøre, skyter man med ÉN EKSTRA STRAFFETERNING — men det koster INGEN bevegelsespoeng og påvirker ikke jakten ellers.\nFranz med sawed-off shotgun som stopper opp, mot Franz som løper: det er valget."},{"title":"6. Å slippe unna, og å gjemme seg","source":"grunnbok","body":"FORFØLGEREN kan fortsette så lenge hen kan se hvor byttet er eller hvilken vei det gikk. Der sporet kan miste seg — en trappeavsats med tre veier videre, en mørk gang — ber du om et slag. Boka bruker Track til det: i eksempelet forsvinner byttet ut av en teater, og forfølgeren må slå Track for å ta opp sporet igjen — klarer den det ikke, er jakten over.\n\nÅ GJEMME SEG: den flyktende kan forsøke å gjemme seg NÅR SOM HELST i jakten. Jo større forsprang, jo mer tid — og jo flere bonusterninger bør du gi. Deretter slår forfølgeren Spot Hidden. Bommer forfølgeren, har byttet sluppet unna.\nHar vesenet ingen Spot Hidden oppgitt, avgjør du — boka foreslår «under 50 %», altså vanlig vanskegrad for den som gjemmer seg.\n\nNOEN SLUTTER SEG TIL JAKTEN UNDERVEIS: de slår fartsslag og plasseres på en passende posisjon. En ny FORFØLGER må ha MOV minst like høy som den tregeste som flykter — ellers kan hen bare ignoreres. Kommer en ny FLYKTENDE med lavere MOV enn alle andre, må ALLE bevegelsespoengene regnes om på nytt mot den nye tregeste.\nNår noen FORLATER jakten, regnes ingenting om.\n\nDETTE ER VIKTIG FOR GRUPPA: løper alle fem etter Bates, er det den tregeste av dem som setter takten for hva de andre får av bevegelsespoeng — ikke Bates. Vil de ta ham, må de dele seg, og da er noen alene med det som venter."},{"title":"7. Valgfritt: tilfeldige og plutselige hindringer","source":"grunnbok","body":"TILFELDIGE HINDRINGER — så du ikke ubevisst stabler odds mot spillerne. Slå 1D100 per ny posisjon:\n  01–59 = klar vei\n  60+  = 1 hindring/barriere, VANLIG vanskegrad\n  85+  = 1 hindring/barriere, HARD\n  96+  = 1 hindring/barriere, EKSTREM\nEr omgivelsene særlig farlige (et mørkt lasterom, et krengende dekk), legg til en STRAFFETERNING på dette slaget. Er de trygge og åpne, legg til en BONUSTERNING.\n\nPLUTSELIGE HINDRINGER — den beste regelen i hele kapittelet, fordi den gir spillerne noe å gjøre: NÅR SOM HELST i runden kan ENTEN Keeperen ELLER en spiller be om et gruppe-Luck-slag.\n  • GÅR LUCK-SLAGET: SPILLERNE bestemmer hvor og når en plutselig hindring rammer — og de kan legge den foran forfølgeren.\n  • RYKER DET: du bestemmer, og den rammer heltene.\nPlutselige hindringer skal ha VANLIG vanskegrad. Spillerne og du MÅ BYTTE PÅ om å be om slaget — har spillerne bedt om ett, kan de ikke be igjen før du har gjort det, og omvendt. Hvem som helst kan be om det første.\nTrekker jakten ut, kan du heve vanskegraden på de plutselige hindringene.\n\nFART OVER ALT (bare kjøretøy): for ETT bevegelsespoeng kan et kjøretøy flytte 2 til 5 posisjoner i stedet for én. Det gjelder ikke til fots — og det er derfor biljakter føles annerledes.\n\nÅ VELGE VEI: den som flykter velger fritt når det finnes flere veier, og kan med vilje velge den VANSKELIGSTE om hen tror hen klarer den bedre enn forfølgeren. En god svømmer hopper i elva. Er det HELTENE som flykter, sier boka at du REGELMESSIG skal gi dem et veivalg."},{"title":"De tre jaktene i dette scenarioet","source":"eget","body":"GRUPPAS MOV, så du slipper å bla i kortene:\n  Walther 9 · Beefcake 9 · Skjoldvår 8 · Dagrun 8 · Franz 8\nLøper hele gruppa sammen, er den tregeste 8. Da får Walther og Beefcake TO bevegelsespoeng, og de tre andre ÉTT. Det betyr at gruppa i praksis deler seg i to om de vil ta noen — og det er en scene verdt å spille.\nCON til fartsslaget: Beefcake 75, Skjoldvår 65, Dagrun 55, Walther 50, Franz 30. Franz bommer oftere enn han treffer, og faller da til MOV 7 — da blir HAN den tregeste, og alle andre får ett poeng mer.\n\nSKAPNINGEN SOM FORSVINNER etter tyveriet 7. desember. Den har MOV 8 i rotteskikkelse — altså likt med tre av heltene, og lavere enn Walther og Beefcake. Den kommer ikke unna på fart alene, så den må bruke hindringer og mørke.\nPosisjoner: lugargangen · trappen · promenadedekket · leideren ned · lasterom 3.\nBarriere: skottdøra til lasterommet — tung, ikke låst (STR).\nHindringer: mørket i lasterommet (Spot Hidden), og en stabel kasser (Climb eller Dodge).\nPoenget med denne jakten er IKKE at de skal ta den. Poenget er at de skal se hvor den gikk, og at den forsvant inn i et rom de ikke har lov til å være i.\n\nBATES SOM LØPER fra gisselscenen. Han er dominert og løper uten å ta vare på seg selv — la ham bomme fartsslaget om du vil ha ham tatt. Gi gruppa et veivalg: over rekka og langs utsiden (Climb, Hard, men snarvei) eller rundt gjennom salongen (trygt, men to posisjoner lenger). Husk at Dominate slipper taket når skapningen kommer mer enn ti meter unna ham — jakten kan ende med at han kommer til seg selv og ikke vet hvor han er.\n\nROTTESKIKKELSEN I LASTEROMMENE. Her bruker du TILFELDIGE hindringer og lar terningen bestemme, med én straffeterning fordi lasterommene er mørke og fulle av last. Spillerne skal ikke kunne planlegge seg gjennom dem.\n\nOG HUSK PLUTSELIGE HINDRINGER: la spillerne be om Luck-slaget først. Det gir dem én ting de kan gjøre i en scene som ellers bare er terningkast mot klokka."}]},{"id":"wounds","title":"Sår, døende og førstehjelp","source":"Call of Cthulhu 7e kapittel 6, og Pulp Cthulhu kapittel 4: Game System (s. 65–68)","intro":"Kamptrackeren regner ut selve skaden og sier om det ble major wound eller døende. Det den IKKE gjør, er å fortelle deg hva som skjer etterpå — hvem som kan reddes, hvor fort, og av hvem. Det står her.","sections":[{"title":"Pulp eller grunnbok?","source":"eget","body":"PULP-HELTER TAR IKKE MAJOR WOUND, og de kommer seg mye raskere. Begge deler står nå med tall i egne seksjoner under, hentet fra Pulp Cthulhu.\n\nREGLENE FRA GRUNNBOKA under gjelder NPC-er og fiender uten videre — skipslegen, mannskapet, Bates. For de fem heltene bruker du pulp-seksjonene.\n\nKamptrackeren regner allerede major wound riktig for hver enkelt figur. Sjekk bare at pulp-haken står på alle fem."},{"title":"Pulp: helter kommer seg raskere","source":"pulp","body":"DETTE ER DEN STORE FORSKJELLEN, og den gjør at gruppa tåler et helt annet tempo enn vanlige etterforskere.\n\nNATURLIG LEGING: +2 HP PER DAG, ikke 1. Talentet QUICK HEALER gjør det til +3.\n  SKJOLDVÅR OG DAGRUN HAR QUICK HEALER — de ligger på +3 per dag.\n  Walther, Beefcake og Franz ligger på +2.\nDet er verdt å skrive opp, for over elleve døgn til sjøs er forskjellen elleve hit points.\n\nFØRSTEHJELP OG MEDICINE GIR 1D4 HP, ikke 1 og 1D3. Det er en stor endring: Walther med Medicine 61 gir i snitt to og en halv gang så mye som i grunnboka.\n\nETTER Å HA VÆRT DØENDE fortsetter den naturlige helingen på +2 per dag til helten er tilbake på maks. Den kan støttes med pleie: ETT MEDICINE-SLAG PER DAG av den som steller pasienten; lykkes det, blir dagens leging +3 i stedet for +2.\n  BONUSTERNING på det slaget ved pleie på et moderne, velutstyrt sykehus.\n  STRAFFETERNING om man må stelle en kamerat under uhygieniske forhold — og et krengende skip midt i Stillehavet er uhygieniske forhold.\n\nFUMLER LEGEN Medicine-slaget, kan Keeperen la det sette pasienten tilbake: ingen HP den dagen. Ryker et PUSHET Medicine-slag, kan pasienten MISTE 1D3 HP i stedet for å få noen.\n\nÅ OVERLEVE noe som var nær døden koster Sanity: et Sanity-slag, 0/1.\n\nSKADER SKAL MERKES I ROLLESPILLET, ikke i tallene. Brukne bein, en hånd som mangler — spill det ut. Men tenk deg om før du legger på flere straffeterninger: pulp-helter tar sånt på haka, børster seg av og gjør seg klare til neste runde."},{"title":"Pulp: døende, og de tre Luck-utveiene","source":"pulp","body":"EN DØENDE HELT i pulp: skriv «D» i HP-feltet i stedet for et tall. Førstehjelp stabiliserer som i grunnboka, men her er forskjellene:\n\nET VELLYKKET MEDICINE-SLAG ETTERPÅ gir 1D4 HP — og en EKSTREM suksess gir fulle 4.\n\nET MISLYKKET FIRST AID-SLAG KAN PUSHES — men ryker det pushede slaget, DØR pasienten. Og FUMLER man førstehjelpen, kan hen ikke reddes uansett hva man gjør etterpå. Det er en hard regel, og den bør sies høyt før noen prøver.\n\nTRE UTVEIER MED LUCK, og de er grunnen til at en pulp-helt sjelden dør:\n  • «DET ER BARE EN SKRAMME!» — 20 Luck gir 1D6 HP med én gang.\n  • UNNGÅ EN SIKKER DØD — har helten 30 Luck eller mer, kan ALLE brukes: hen får 1D6+1 HP og dukker opp igjen i neste scene. Spilleren forteller selv hvordan. Etterpå står hen på null Luck resten av økta.\n  • HOLDE SEG VÅKEN — 1 Luck, så 2, 4, 8.\nSe regelboksen «Å bruke Luck» for hele lista.\n\nLUCK I GRUPPA: Walther 85, Dagrun 80, Franz 75, Beefcake 65, Skjoldvår 60. Alle fem har nok til «Unngå en sikker død» ÉN gang — men bare én, og bare hvis de ikke har brukt opp Luck på slag tidligere i økta. Det er et reelt valg, og det er verdt å minne dem på at poengene har to bruksområder."},{"title":"Major wound og null HP","source":"grunnbok","body":"VANLIG SKADE er ethvert enkeltangrep som gjør MINDRE enn halvparten av maks HP. Det har ingen virkning før HP når null — og man kan IKKE DØ av vanlig skade.\n\nMAJOR WOUND er et enkeltangrep som gjør HALVPARTEN AV MAKS HP ELLER MER. Da:\n  • Kryss av for major wound.\n  • Figuren faller ØYEBLIKKELIG i bakken.\n  • CON-slag for å unngå å bli bevisstløs.\n  • Når HP senere faller til null MENS major wound er krysset av, er man DØENDE.\n\nNULL HP betyr én av tre ting:\n  • Bare vanlig skade: man dør ikke, og leges med tiden. Bevisstløs.\n  • Med major wound: man dør snart uten førstehjelp.\n  • Ett enkeltangrep større enn maks HP: døden er uunngåelig.\nNegative HP føres ikke. Videre skade på en bevisstløs ignoreres stort sett — men ethvert oppriktig forsøk på å drepe en bevisstløs skal lykkes.\n\nPULP-FORSKJELLEN: pulp-helter tar IKKE major wound. De får CON-slaget for å holde seg våkne, men ikke merket, og de er døende bare når de både har tatt et slag på halve maks HP og er nede på null. Et enkeltslag lik eller over maks HP dreper fortsatt på stedet. Kamptrackeren regner dette riktig for hver enkelt figur — sjekk at pulp-haken står på alle de fem heltene."},{"title":"Døende — og hvordan man redder noen","source":"grunnbok","body":"EN DØENDE faller øyeblikkelig i bevisstløshet. Spilleren slår CON PÅ SLUTTEN AV HVER RUNDE. FØRSTE GANG DET SLAGET RYKER, DØR FIGUREN — øyeblikkelig.\n\nBARE FIRST AID KAN STABILISERE EN DØENDE. Medicine kan det IKKE. Dette er den regelen folk tar feil av, og den er avgjørende: legen om bord er mindre nyttig i selve øyeblikket enn hvem som helst med et forbindingsskrin.\n\nFØRSTEHJELP på en døende gir 1 MIDLERTIDIG hit point og stopper runde-slagene. Deretter slår hen CON PÅ SLUTTEN AV HVER TIME; ryker det slaget, mister hen det midlertidige poenget og er tilbake til start — døende, med CON-slag hver runde.\n\nDERETTER MEDICINE: et vellykket Medicine-slag fjerner «døende» og gir 1D3 HP. Fra da av er det ukentlige bedringsslag.\n\nFIRST AID ELLERS: må gis innen ÉN TIME for å virke, og gir 1 hit point. Kan forsøkes én gang; videre forsøk er PUSHEDE slag. TO PERSONER KAN JOBBE SAMMEN — da holder det at én av dem lykkes. Det er verdt å si høyt ved bordet.\n\nMEDICINE ELLERS: tar minst én time, kan gis når som helst etter skaden, og gir 1D3 HP i tillegg til førstehjelpen. Gjøres det ikke samme dag, kreves HARD suksess."},{"title":"Tilfriskning","source":"grunnbok","body":"VANLIG SKADE, uten major wound: 1 HP PER DAG. Ferdig.\n\nMED MAJOR WOUND: CON-slag på slutten av hver uke spilletid.\n  • Bom: ingen bedring den uka.\n  • Suksess: 1D3 HP.\n  • EKSTREM suksess: 2D3 HP, OG major wound slettes.\n  • BONUSTERNING om figuren har hatt full hvile i gode omgivelser.\n  • BONUSTERNING om hen har fått effektiv medisinsk pleie — den med høyest Medicine slår étt slag på slutten av uka, FØR pasientens CON-slag.\n  • STRAFFETERNING i dårlige omgivelser uten hvile, og/eller om legen fumlet.\n\nMAJOR WOUND SLETTES også når nåværende HP har kommet opp i HALVPARTEN av maks eller mer. Det er ofte fortere enn å vente på en ekstrem suksess.\n\nFUMLER bedringsslaget: varig skade. Boka ber deg velge noe som passer skaden i stedet for å slå tilfeldig — varig halting, blindhet på ett øye, tapte fingre, tapt lem, arret ansikt — og føre det inn i bakgrunnen under «Wounds and Scars»."},{"title":"Ved dette bordet","source":"eget","body":"HVEM KAN REDDE HVEM — tallene fra kortene:\n  FIRST AID: Walther 50 (25/10) · Skjoldvår 50 (25/10) · Beefcake 50 (25/10) · Dagrun 37 (18/7) · Franz har ingenting skrevet og står på grunnverdien 30 (15/6).\n  MEDICINE: bare Walther, 61 (30/12). Ingen andre i gruppa har det i det hele tatt — grunnverdien er 1 %.\n\nDET BETYR TO TING. For det første: fire av fem kan stabilisere en døende, og det er gode nyheter. For det andre: dør Walther, kan INGEN i gruppa ta neste steg og fjerne «døende» — da må de få vedkommende til skipslegen, og de har bare time-slagene å gå på. Det er en reell trussel, og den er verdt å bruke.\n\nREGELEN OM AT TO KAN SAMARBEIDE om First Aid er den beste nyheten gruppa har: to med 50 % gir 75 % til sammen. Minn dem på den første gang noen blir døende.\n\nSKIPETS LEGE er en NPC de kan nå. Men husk: han kan ikke stabilisere en døende — noen må gi førstehjelp FØRST, på stedet, i den runden det skjer. Å bære noen til sykestua uten førstehjelp betyr at hen slår CON hver runde hele veien.\n\nMAKS HP, og hvor major wound-grensa går (halve maks, rundet opp):\n  Beefcake 29 → 15 · Skjoldvår 24 → 12 · Walther 21 → 11 · Dagrun 21 → 11 · Franz 18 → 9.\nFranz er den skjøreste: ett slag på 9 setter ham i bakken. Polyppens tentakkel gjør 1D10 og IGNORERER RUSTNING, og det er 2D6 tentakler per runde. Ni eller ti i skade fra én eneste tentakkel setter Franz i bakken. Det er ikke en kamp gruppa skal stå og ta imot.\n\nÅ BRUKE LUCK FOR Å HOLDE SEG VÅKEN: 1 Luck for å være våken ut inneværende runde, deretter 2, 4, 8 — betalt på starten av hver runde. En våken figur er et mer fristende mål, så det er et blandet gode. Se regelboksen «Å bruke Luck»."}]},{"id":"villain-luck","title":"Skurkens Luck, og mooks","source":"Pulp Cthulhu kapittel 4: Dirty Tricks og Mooks (s. 62–63)","intro":"Dette er svaret på «kampene er over på to runder» — begge veier. Mooks gjør at heltene meier ned smårollene, og NPC-ens Luck gjør at skapningen IKKE går ned på to runder.\n\nSKAPNINGEN HAR LUCK 90. Bates har Luck 45. De tallene står på kortene, og de er ikke pynt — de er en ressurs du bruker.","sections":[{"title":"Mooks — smårollene går ned fort","source":"pulp","body":"EN MOOK er en NPC med helt gjennomsnittlige verdier: matroser, havnearbeidere, en tilfeldig passasjer, en zombie i mengden. Har noen verdier over gjennomsnittet, er hen som regel viktig for handlingen og IKKE en mook.\n\nREGELEN: en mook blir AUTOMATISK slått ut når hen er nede på HALVE sine hit points. Ikke null — halve.\n\nHVA DET GJØR: heltene skjærer gjennom smårollene og kommer fram til det som faktisk er farlig. Det er hele poenget med pulp. Bruk det bevisst når du kjører zombie-varianten: tjue zombier høres avskrekkende ut, men som mooks går de ned på ett godt treff hver, og da blir scenen spennende i stedet for lang.\n\nGJENNOMSNITTLIG MOOK, fra boka, om du trenger en på stående fot:\n  STR 40 · CON 50 · SIZ 50 · DEX 45 · INT 30 · APP 30 · POW 30 · EDU 40\n  HP 10 (altså ute på 5) · MP 6 · SAN 30 · DB 0 · Build 0 · Move 7\n  Ett angrep per runde. Brawl 35 % (17/7), skade 1D3. Dodge 25 % (12/5).\n  Rustning: ingen. Luck: ingen.\n  Våpen om de har noe: hagle 40 % (20/8) 4D6/2D6/1D6 · Thompson 30 % (16/6) 1D10+2 · .32 auto 40 % (20/8) 1D8.\n\nMANNSKAPET PÅ COOLIDGE er mooks. Bates er det IKKE — han er navngitt, dominert og viktig."},{"title":"Skurkens Luck — fire skitne triks","source":"pulp","body":"VIKTIGE NPC-ER kan bruke Luck akkurat som heltene. Skapningen har 90 poeng. Bruk dem.\n\n1. JUSTERE ET SLAG — 1 for 1. Etter at du har slått, kan du bruke Luck for å flytte resultatet poeng for poeng. Dette er det du griper til når skapningen MÅ treffe, eller MÅ unnvike. Tjue poeng flytter et slag langt.\n\n2. KJØPE ET ANGREP TIL — 10 Luck. Skapningen kan kjøpe seg et ekstra nærkampangrep i runden. Ni ganger på en full beholdning, men i praksis to–tre ganger i en kamp, og det dobler trusselen den runden.\n\n3. SE BORT FRA EN FUMLE ELLER VÅPENFEIL — 10 Luck. Slaget er fortsatt bommet, men våpenet knekker ikke og geværet låser seg ikke.\n\n4. «LOOK OUT MASTER!» — ALLE Luck-poengene. Treffer en helt en viktig skurk, kan skurken brenne HELE Luck-beholdningen for å få en mook innen to meter til å kaste seg foran angrepet. Mooken dør eller slås ut øyeblikkelig. Skurken står så uten Luck resten av scenarioet.\n  PÅ COOLIDGE: dette er scenen der Bates kaster seg foran skapningen. Den er gratis dramatikk, og den koster skapningen alt — så spar den til du virkelig trenger at den slipper unna."},{"title":"Bruk det med måte","source":"pulp + eget","body":"BOKA ADVARER SELV: NPC-ers bruk av Luck kan fort virke som deus ex machina og undergrave den indre logikken i spillet. Det skal aldri komme i konflikt med det som gir mening i fiksjonen.\n\nMITT RÅD FOR AKKURAT DETTE BORDET: si det høyt. «Den bruker Luck på det.» Da er det ikke juks — da er det en ressurs skapningen har, på lik linje med heltenes, og spillerne kan telle den ned. Skriv 90 på en lapp og stryk ut etter hvert.\n\nDET GJØR OGSÅ NOE ANNET: når spillerne ser at tallet synker, vet de at den blir mer sårbar for hver runde de holder ut. Det gjør en lang kamp til noe som går et sted, i stedet for en kamp som bare varer."}]}]}</script>
<script type="application/json" id="bundled-skills">{"version":1,"title":"Ferdigheter","source":"Call of Cthulhu 7e, kapittel 4 (Chaosium)","note":"Hentet maskinelt ut av regelboka. Beskrivelsen er bokas egen. «Vanskegrader» er eksemplene den gir på hva et Regular- og Hard-slag faktisk betyr for akkurat denne ferdigheten — det er som regel det man lurer på midt i en økt.","skills":[{"name":"Accounting","base":"05%","description":"Grants understanding of accountancy procedures and reveals the financial functioning of a business or person. Inspecting the books, one might detect cheated employees, siphoned-off funds, payment of bribes or blackmail, and whether the financial condition is better or worse than claimed. Looking through old accounts, one could see how money was gained or lost in the past (grain, slave-trading, whiskey-running, etc.) and to whom and for what payment was made.","difficulty":["Regular difficulty: comprehensive and well-docu mented set of account books.","Hard difficulty: disorganized and partial accounts."],"pushing":"taking more time to review documents; visiting banks or businesses to validate findings; dou ble-checking the math and data.","pushed_failure":"discussions between investigators and third parties alert some enemy faction to the investigators’ intentions; a vital part of the accounts is destroyed or lost (perhaps in their tired state the investigator spills coffee over them).","insane":"If an insane investigator fails a pushed roll, he or she might be found having partially eaten the accounts."},{"name":"Animal Handling","base":"05%","description":"The ability to command and train domesticated animals to perform simple tasks. The skill is most commonly applied to dogs but may include birds, cats, monkeys, and so on (at the Keeper’s discretion). For riding animals, such as horses or camels, the Ride skill is used for breaking in and controlling such mounts.","difficulty":["Regular difficulty: getting a trained dog to sit, fetch, or attack on command.","Hard difficulty: getting an untrained or unfamiliar dog to perform a task on command.","Regular difficulty: spending a month or more with the people.","Hard difficulty level: spending only a week or less with the people."],"pushing":"taking greater personal risk, in terms of getting closer to, or directly handling the animal.","pushed_failure":"the animal attacks the trainer or someone else nearby, most likely causing damage; the animal escapes.","insane":"If an insane investigator fails a pushed roll, he or she might be found behaving like the animal they were trying to control."},{"name":"Appraise","base":"01%","description":"Used to estimate the value of a particular item, including the quality, material used, and workmanship. Where relevant, the skill-user could pinpoint the age of the item, assess its historical relevance, and detect forgeries.","difficulty":["Regular difficulty: an item that was not rare at its time of manufacture, and is made of a common material (e.g. 50 year-old gold watch).","Hard difficulty: an unusual item, perhaps made of uncommon materials (e.g. a foreign-made object of several hundred years in age, such as an ancient tome)."],"pushing":"checking an item’s validity with another expert; conducting testing; researching an item.","pushed_failure":"accidentally ruining the item in question; bringing the item to the attention of other people, leading to its theft; activating whatever function the item might serve.","insane":"If an insane investigator fails a pushed roll, he or she 307238466802"},{"name":"Archaeology","base":"01%","description":"Allows dating and identification of artifacts from past cul tures, and the detection of fakes. Ensures expertise in setting up and excavating a dig site. On inspecting a site, the user might deduce the purposes and way of life of those who left the remains. Anthropology might aid in this. Archaeology also helps identify written forms of extinct human languag es.","difficulty":["Regular difficulty: sufficient time and resources to","Hard difficulty: a lack of time and/or limited re"],"pushing":"taking more time to study the site or item; conducting further research; consulting another expert.","pushed_failure":"The site is","insane":"If an insane investigator fails a pushed roll, he or she keeps digging deeper, ever deeper—the truth is down there somewhere."},{"name":"Art and Craft","base":"05%","description":"The investigator sheet contains blank spaces for specializations of this skill. For example: \"These aren't any hieroglyphs that I know of.\" An art or craft skill might also be used to make a dupli cate or fake item. In such a case, the difficulty level would depend on the intricacy and distinctiveness of the original to be copied. In the case of faking documentation, a specific specialization (Forgery) is used. A successful roll might provide information about an item, such as where or when it might have been made, some point of history or technique concerning it, or who might have made it. The holder of a specialism would have a breadth of knowledge within a particular field—knowledge","difficulty":["Acting","Barber","Calligraphy i Carpenter i Cook","Dancer","Fine Art i Forgery","Writer","Morris Dancer i Opera Singer","Painter and Decorator i Photographer","Potter","Sculptor","Vacuum-Tube Blower","Regular difficulty: making a standard, saleable item.","Hard difficulty: making a higher quality or particularly intricate piece."],"pushing":"reworking the object, piece or composition from scratch; conducting further research; checking with another expert.","pushed_failure":"A vast amount of time and money is wasted in creating a failed","insane":"If an insane investigator fails a pushed roll, he or she creates a transgressive work that shocks and causes violent reactions in the viewer—perhaps only the most decadent could appreciate it.","aliases":["art/craft","art and craft","art"]},{"name":"Artillery","base":"01%","description":"This skill assumes some form of military training and experience. The user is experienced in the operation of field weapons in warfare: able to work in a crew or \"detachment\" to operate the projection of munitions beyond the range of personal weapons. Many weapons of this nature are too large for a single person to operate, and either an individual cannot use the weapon without a crew or the difficulty level should be raised (at the Keeper’s discretion, dependent on the type of weapon employed). Various specializations exist, depending on the period setting of the game, including cannon, howitzer, mortar and rocket launcher.","difficulty":["Regular difficulty: if the artillery is well maintained and used in favorable conditions.","Hard difficulty: if the artillery is poorly maintained or used in a rush and/or while under fire."],"pushing":"bringing the weapon to bear without a full crew, or firing faster than the detachment can safely serve it — the Keeper raises the difficulty level instead where no crew is present."},{"name":"Charm","base":"15%","description":"Charm takes many forms, including physical attraction, seduction, flattery or simply warmth of personality. Charm may be used to compel someone to act in a certain way, but not in a manner completely contrary to that person’s normal behavior. Charm is opposed by the Charm or Psychology skills. Charm may be used for bargaining, to haggle the price of an item or service down. If successful, the seller is won over and they may well reduce the price a little.","difficulty":["The difficulty level is based on the opposing factor — in this case the matching social skill (Charm, Fast Talk, Intimidate or Persuade) or Psychology, whichever is higher for the target.","Regular difficulty: the opposing skill is below 50.","Hard difficulty: the opposing skill is 50 or above.","Extreme difficulty: the opposing skill is 90 or above."],"pushing":"overtly flattering the target with affec tion; presenting an expensive gift; build
