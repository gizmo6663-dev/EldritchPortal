<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light dark; }
body { margin: 0; font: 14px system-ui, sans-serif; background: #faf9f7; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Eldritch Portal Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* ------------------------------------------------------------------
   Eldritch Portal — Keeper-konsoll for nettleser.

   Bevisst mørkt tema. Dette er et verktøy som står oppslått ved siden
   av spillbordet i et dempet rom, og det skal se ut som den samme
   appen på telefonen. Alle farger settes eksplisitt, slik at siden
   holder seg uansett hvilket tema nettleseren rundt kjører.
   ------------------------------------------------------------------ */
:root {
  color-scheme: dark;

  --ink:        #0E0709;   /* skrogsvart, med et rødt anslag */
  --ink-2:      #170D11;   /* panel */
  --ink-3:      #23141A;   /* hevet flate */
  --ink-4:      #321D24;   /* kant / hover */

  --brass:      #E0B451;   /* antikk messing — eneste aksent */
  --brass-dim:  #96773A;
  --brass-glow: rgba(224, 180, 81, 0.14);

  --parchment:  #EDE3D2;   /* brødtekst */
  --muted:      #A08880;   /* dempet, dreid mot burgunder */
  --faint:      #6E5A58;

  --verdigris:  #5A9C7E;   /* irret kobber — «gjort» */
  --signal:     #C6504A;   /* skiltrødt — skurkens trekk */
  --tide:       #6E8BA8;   /* sjøblått — reise og vær */

  --rule:       rgba(224, 180, 81, 0.20);
  --rule-soft:  rgba(237, 227, 210, 0.10);

  --display: "Limelight", "Josefin Sans", Georgia, serif;
  --ui:      "Josefin Sans", "Segoe UI", system-ui, sans-serif;
  --body:    "Spectral", Georgia, "Times New Roman", serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --rail: 216px;
  --gutter: clamp(16px, 3vw, 32px);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

/* Svak vignett så flaten ikke er helt død. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(224,180,81,0.07), transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(198,80,74,0.06), transparent 60%);
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: var(--brass); }

:focus-visible {
  outline: 2px solid var(--brass);
  outline-offset: 2px;
  border-radius: 3px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============================ SKALL ============================= */

.shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "head head" "rail main";
}

.masthead {
  grid-area: head;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px var(--gutter);
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(180deg, var(--ink-2), var(--ink));
}

.wordmark {
  font-family: var(--display);
  font-size: 20px;
  letter-spacing: 0.06em;
  color: var(--brass);
  line-height: 1;
  white-space: nowrap;
}
.wordmark span { display: block; font-size: 9px; letter-spacing: 0.34em;
  color: var(--faint); font-family: var(--ui); margin-top: 5px; }

.masthead-title {
  flex: 1 1 200px;
  min-width: 0;
}
.masthead-title b {
  display: block;
  font-family: var(--ui);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--parchment);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.masthead-title small {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.masthead-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chip {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--rule);
  color: var(--muted);
  white-space: nowrap;
}
.chip.live { color: var(--verdigris); border-color: rgba(90,156,126,0.4); }
.chip.local { color: var(--muted); }

/* ------------------------------ nav ---------------------------- */

.rail {
  grid-area: rail;
  border-right: 1px solid var(--rule);
  padding: 16px 10px 40px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: sticky;
  top: 0;
  align-self: start;
  max-height: 100vh;
  overflow-y: auto;
}

.rail-group {
  font-family: var(--ui);
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 16px 10px 6px;
}
.rail-group:first-child { padding-top: 4px; }

.navlink {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 5px;
  font-family: var(--ui);
  font-size: 14px;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-align: left;
  border-left: 2px solid transparent;
  transition: background 0.14s, color 0.14s;
}
.navlink:hover { background: var(--ink-2); color: var(--parchment); }
.navlink[aria-current="page"] {
  background: var(--ink-3);
  color: var(--brass);
  border-left-color: var(--brass);
}
.navlink .count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.navlink[aria-current="page"] .count { color: var(--brass-dim); }

/* ----------------------------- main ---------------------------- */

.main {
  grid-area: main;
  padding: var(--gutter);
  padding-block: 24px 72px;
  min-width: 0;
}
.view { max-width: 72ch; margin-inline: auto; }
.view.wide { max-width: 1080px; }

/* Fargeprøve i tidslinjens tegnforklaring. */
.swatch {
  display: inline-block; width: 9px; height: 9px;
  border-radius: 2px; margin-right: 6px;
  vertical-align: baseline;
}

h1 {
  font-family: var(--ui);
  font-weight: 700;
  font-size: clamp(24px, 4vw, 32px);
  letter-spacing: 0.01em;
  margin: 0 0 4px;
  text-wrap: balance;
  color: var(--parchment);
}
h2 {
  font-family: var(--ui);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: 0.02em;
  margin: 32px 0 10px;
  color: var(--brass);
  text-wrap: balance;
}
.view > h2:first-of-type { margin-top: 22px; }
.lede { color: var(--muted); margin: 0 0 20px; font-size: 15px; }

.eyebrow {
  font-family: var(--ui);
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--faint);
  margin: 0 0 6px;
}

/* --------------------------- kontroller ------------------------ */

.btn {
  font-family: var(--ui);
  font-size: 13px;
  letter-spacing: 0.03em;
  padding: 8px 14px;
  border-radius: 5px;
  border: 1px solid var(--rule);
  background: var(--ink-2);
  color: var(--parchment);
  transition: background 0.14s, border-color 0.14s;
}
.btn:hover { background: var(--ink-3); border-color: var(--brass-dim); }
.btn.primary {
  background: var(--brass-glow);
  border-color: var(--brass-dim);
  color: var(--brass);
  font-weight: 600;
}
.btn.primary:hover { background: rgba(224,180,81,0.22); }
.btn.danger { color: var(--signal); border-color: rgba(198,80,74,0.35); }
.btn.danger:hover { background: rgba(198,80,74,0.12); }
.btn.small { font-size: 11px; padding: 5px 10px; }
.btn[aria-pressed="true"] {
  background: var(--brass-glow); border-color: var(--brass-dim); color: var(--brass);
}

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }

.field {
  width: 100%;
  padding: 9px 12px;
  border-radius: 5px;
  border: 1px solid var(--rule-soft);
  background: var(--ink-2);
  color: var(--parchment);
  font-family: var(--body);
}
.field:focus { border-color: var(--brass-dim); outline: none; }
.field::placeholder { color: var(--faint); }
textarea.field { resize: vertical; line-height: 1.6; }

/* ---------------------------- meter ---------------------------- */

.meter { display: grid; gap: 5px; margin-bottom: 14px; }
.meter-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--ui); font-size: 13px; letter-spacing: 0.02em;
}
.meter-head b { font-weight: 400; color: var(--parchment); }
.meter-head span {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meter-track {
  height: 6px; border-radius: 3px; background: var(--ink-3); overflow: hidden;
}
.meter-fill {
  height: 100%; background: var(--brass); border-radius: 3px;
  transition: width 0.3s ease;
}
.meter-fill.full { background: var(--verdigris); }

/* ---------------------------- paneler -------------------------- */

.panel {
  border: 1px solid var(--rule-soft);
  border-radius: 8px;
  background: var(--ink-2);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.panel.accent { border-color: var(--rule); background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); }
.panel h3 {
  font-family: var(--ui); font-weight: 600; font-size: 15px;
  margin: 0 0 6px; color: var(--parchment); letter-spacing: 0.02em;
}
.panel p { margin: 0 0 10px; }
.panel p:last-child { margin-bottom: 0; }

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}

/* --------------------------- listerader ------------------------ */

.stack { display: flex; flex-direction: column; gap: 6px; }

.entry {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 12px;
  width: 100%;
  padding: 11px 14px;
  border-radius: 6px;
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule-soft);
  background: var(--ink-2);
  text-align: left;
  transition: background 0.14s, border-color 0.14s;
}
.entry:hover { background: var(--ink-3); }
.entry.done { opacity: 0.5; }
.entry.done .entry-title { text-decoration: line-through; text-decoration-color: var(--faint); }

/* Stripa til venstre koder hva slags hendelse det er — ikke pynt. */
.entry[data-tag="villain"] { border-left-color: var(--signal); }
.entry[data-tag="climax"]  { border-left-color: var(--signal); }
.entry[data-tag="event"]   { border-left-color: var(--brass-dim); }
.entry[data-tag="voyage"]  { border-left-color: var(--tide); }
.entry[data-tag="social"]  { border-left-color: var(--rule-soft); }

.tick {
  width: 20px; height: 20px; margin-top: 3px;
  border-radius: 4px;
  border: 1px solid var(--brass-dim);
  background: transparent;
  display: grid; place-items: center;
  font-size: 12px; color: var(--ink);
  flex: none;
}
.tick[aria-pressed="true"] { background: var(--verdigris); border-color: var(--verdigris); }
.tick[aria-pressed="true"]::after { content: "✓"; font-weight: 700; }

.entry-body { min-width: 0; }
.entry-title {
  font-family: var(--ui); font-weight: 600; font-size: 15px;
  letter-spacing: 0.01em; color: var(--parchment); display: block;
}
.entry-sub {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  display: block; margin-top: 2px;
}
.entry-note {
  display: block; margin-top: 6px; padding-left: 9px;
  border-left: 2px solid var(--brass-dim);
  font-size: 13px; color: var(--muted); font-style: italic;
}
.entry-open {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  color: var(--faint); padding: 4px 6px; border-radius: 4px; flex: none;
}
.entry:hover .entry-open { color: var(--brass); }

/* ---------------------------- dagbolk -------------------------- */

.day {
  margin-bottom: 22px;
}
.day-head {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 6px; margin-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
.day-head h3 {
  margin: 0; font-family: var(--ui); font-weight: 700; font-size: 15px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass);
}
.day-head span {
  margin-left: auto; font-family: var(--mono); font-size: 11px;
  color: var(--faint); font-variant-numeric: tabular-nums;
}

/* --------------------------- statblokk ------------------------- */

.statgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(74px, 1fr));
  gap: 5px;
  margin: 10px 0 14px;
}
.stat {
  border: 1px solid var(--rule-soft);
  border-radius: 4px;
  padding: 5px 7px;
  background: var(--ink);
}
.stat dt {
  font-family: var(--ui); font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--faint);
}
.stat dd {
  margin: 1px 0 0; font-family: var(--mono); font-size: 14px;
  color: var(--parchment); font-variant-numeric: tabular-nums;
}

.section-label {
  font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--brass-dim);
  margin: 18px 0 6px; padding-bottom: 3px;
  border-bottom: 1px solid var(--rule-soft);
}

.bullets { margin: 0; padding-left: 18px; }
.bullets li { margin-bottom: 4px; }

.quote {
  margin: 0 0 6px; padding-left: 11px;
  border-left: 2px solid var(--brass-dim);
  font-style: italic; color: var(--brass);
}

.prose { white-space: pre-wrap; }
.prose.tight { font-size: 15px; }

.caveat {
  font-size: 12px; color: var(--faint); font-style: italic;
  margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--rule-soft);
}

/* ---------------------------- modal ---------------------------- */

.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6, 3, 4, 0.82);
  display: grid; place-items: center;
  padding: var(--gutter);
}
.scrim[hidden] { display: none !important; }

.modal {
  width: min(760px, 100%);
  max-height: min(88vh, 900px);
  display: flex; flex-direction: column;
  background: var(--ink-2);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--rule-soft);
  background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
}
.modal-head h2 {
  margin: 0; font-size: 19px; color: var(--brass);
  font-family: var(--ui); font-weight: 700; flex: 1;
}
.modal-head .modal-sub {
  display: block; margin-top: 3px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-weight: 400; letter-spacing: 0;
}
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding: 12px 18px; border-top: 1px solid var(--rule-soft);
  background: var(--ink);
}

.callout {
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--brass-glow);
  padding: 10px 12px;
  margin-bottom: 14px;
}
.callout .eyebrow { color: var(--brass-dim); margin-bottom: 2px; }
.callout p { margin: 0; font-size: 14px; }

.readaloud {
  border-left: 3px solid var(--brass);
  background: var(--ink);
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  white-space: pre-wrap;
  margin-bottom: 14px;
  border-radius: 0 4px 4px 0;
}

/* ---------------------- replikker i en scene -------------------- */

.lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
.line {
  border-left: 3px solid var(--brass-dim);
  padding: 2px 0 2px 12px;
}
/* Det boka ikke sier, skal se ut som noe annet enn det den sier. */
.line.suggested { border-left-style: dotted; border-left-color: var(--rule); }
.line p { margin: 0; }
.line-who {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-family: var(--ui); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--brass-dim);
}
.line-src {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  color: var(--faint); text-transform: none;
  border: 1px solid var(--rule-soft); border-radius: 999px;
  padding: 1px 6px;
}
.line-say {
  font-family: var(--body); font-size: 16px; font-style: italic;
  color: var(--parchment); margin-top: 3px; line-height: 1.5;
}
.line-note {
  font-family: var(--body); font-size: 13px; color: var(--muted);
  margin-top: 3px;
}

/* ---------------------------- terning -------------------------- */

.dice { display: flex; align-items: center; gap: 6px; }
.dice input {
  width: 58px; text-align: center;
  font-family: var(--mono); font-size: 13px;
  padding: 6px 4px; border-radius: 5px;
  border: 1px solid var(--rule-soft); background: var(--ink-2);
  color: var(--parchment);
}
.dice-out {
  font-family: var(--mono); font-size: 12px; min-width: 128px;
  letter-spacing: 0.02em;
}
.dice-out b { font-size: 15px; }
.res-crit    { color: var(--brass); }
.res-extreme { color: var(--verdigris); }
.res-hard    { color: var(--verdigris); }
.res-reg     { color: var(--parchment); }
.res-fail    { color: var(--muted); }
.res-fumble  { color: var(--signal); }

/* --------------------------- diverse --------------------------- */

.empty {
  border: 1px dashed var(--rule);
  border-radius: 8px;
  padding: 28px;
  text-align: center;
  color: var(--muted);
}
.empty h3 { font-family: var(--ui); color: var(--parchment); margin: 0 0 6px; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
  z-index: 90;
  background: var(--ink-3); border: 1px solid var(--brass-dim);
  color: var(--brass); border-radius: 999px;
  padding: 9px 20px; font-family: var(--ui); font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  animation: rise 0.2s ease;
}
.toast[hidden] { display: none !important; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }

.savestate {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  min-height: 16px; margin-bottom: 6px;
}
.savestate.saved { color: var(--verdigris); }

.libcard {
  border: 1px solid var(--rule-soft); border-radius: 8px;
  background: var(--ink-2); padding: 14px 16px;
}
.libcard.active { border-color: var(--brass-dim); background: linear-gradient(180deg, var(--ink-3), var(--ink-2)); }
.libcard h3 { margin: 0 0 2px; font-family: var(--ui); font-size: 16px; color: var(--parchment); }
.libcard .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.libcard .saved-bits { font-size: 13px; color: var(--verdigris); margin: 6px 0 10px; }
.libcard .saved-bits.none { color: var(--faint); }

.tablewrap { overflow-x: auto; }
table.skills { border-collapse: collapse; width: 100%; font-size: 13px; }
table.skills td { padding: 3px 10px 3px 0; border-bottom: 1px solid var(--rule-soft); }
table.skills td:last-child { font-family: var(--mono); text-align: right; color: var(--brass); }

/* Halv og femtedel av en verdi — det et hardt og et ekstremt slag
   krever. Står alltid dempet, ved siden av verdien selv. */
.steps {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
table.skills .steps { margin-left: 10px; }
.steps.inline {
  display: inline-flex; align-items: center; min-width: 44px;
  justify-content: center; padding: 0 2px;
}
.steps-legend {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  margin: 6px 0 0;
}
/* I karakteristikk-ruta ligger tallparet under verdien. */
.stat .steps { display: block; margin-top: 1px; line-height: 1.1; }

/* --------------------- roller og editor ------------------------ */

/* Navnet i en rad er en knapp, men skal se ut som ren tekst. */
.linkish {
  padding: 0; text-align: left; background: none; border: none;
  color: inherit; font: inherit;
}
.linkish:hover .entry-title { color: var(--brass); }

.rowtools { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.btn.small.danger { color: var(--signal); border-color: rgba(198,80,74,0.35); }

.formrow { display: block; margin-bottom: 10px; }
.formlabel {
  display: block; font-family: var(--ui); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 3px;
}

.editgrid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: 6px; margin-bottom: 6px;
}
.statedit { display: flex; flex-direction: column; gap: 2px; }
.statedit span {
  font-family: var(--ui); font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--faint);
}
.statedit .field { padding: 5px 7px; font-family: var(--mono); font-size: 13px; }

.attackrow { display: grid; grid-template-columns: 2fr 1fr auto 2fr auto; gap: 5px; }
.skillrow  { display: grid; grid-template-columns: 2fr 1fr auto auto; gap: 5px; }
.attackrow .field, .skillrow .field { padding: 6px 8px; font-size: 13px; }
/* Et angrep uten treffsjanse kan ikke brukes i kamp. */
.field.needs { border-color: var(--signal); }
.field.needs::placeholder { color: var(--signal); }

/* ---------------------- kamptracker ---------------------------- */

.roundbar { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.roundbar-now { flex: 1; min-width: 160px; }
.roundbar-count { text-align: right; }
.roundcount {
  font-family: var(--mono); font-size: 17px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
/* Merket på kortet som har tur — den ligger alltid øverst i lista. */
.cb-turnflag {
  display: flex; align-items: center; gap: 10px;
  margin: -2px 0 2px;
}
.cb-turnflag > span {
  font-family: var(--ui); font-size: 10px; letter-spacing: 0.22em;
  color: var(--brass); font-weight: 700;
}
.cb-turnflag .btn { margin-left: auto; }
.roundbar p { margin: 0; }
.roundnum {
  font-family: var(--mono); font-size: 30px; font-weight: 600;
  color: var(--brass); line-height: 1;
}
.turnname {
  font-family: var(--ui); font-size: 20px; font-weight: 600;
  color: var(--parchment); line-height: 1.2;
}

.combatant {
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 14px;
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule-soft);
  border-radius: 6px;
  background: var(--ink-2);
}
.combatant[data-tag="villain"] { border-left-color: var(--signal); }
.combatant[data-tag="event"]   { border-left-color: var(--brass-dim); }
.combatant[data-tag="voyage"]  { border-left-color: var(--tide); }
.combatant.active {
  background: linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border-color: var(--brass-dim);
  box-shadow: inset 0 0 0 1px var(--brass-glow);
}
.combatant.down { opacity: 0.55; }

.cb-head { display: flex; align-items: center; gap: 12px; }
/* Initiativet er et felt du skriver i, ikke et tall du leser av. */
.cb-initbox {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  flex: none;
}
.cb-initedit {
  width: 52px; padding: 5px 4px; text-align: center;
  font-family: var(--mono); font-size: 16px; font-weight: 600;
  color: var(--brass); background: var(--ink);
  border: 1px solid var(--rule); border-radius: 5px;
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.cb-initedit::-webkit-outer-spin-button,
.cb-initedit::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.cb-initedit:focus { outline: none; border-color: var(--brass-dim); }
.cb-initedit::placeholder { color: var(--faint); font-weight: 400; }
.cb-initlabel {
  font-family: var(--ui); font-size: 8px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--faint);
}

/* --- plukkeliste i «legg til»-dialogen --- */
.picklist { display: flex; flex-direction: column; gap: 5px; max-height: 46vh;
  overflow-y: auto; padding-right: 4px; }
.pickrow { cursor: pointer; }
.pickrow.picked {
  border-color: var(--brass-dim);
  background: var(--brass-glow);
}
.pickbox {
  width: 18px; height: 18px; margin-top: 3px; flex: none;
  border: 1px solid var(--brass-dim); border-radius: 4px;
  display: grid; place-items: center;
  font-size: 11px; color: var(--ink); font-weight: 700;
}
.pickbox.on { background: var(--verdigris); border-color: var(--verdigris); }
.pickbox.on::after { content: "✓"; }
.pickcount {
  width: 48px; padding: 4px; text-align: center; flex: none;
  font-family: var(--mono); font-size: 13px;
  color: var(--parchment); background: var(--ink);
  border: 1px solid var(--rule-soft); border-radius: 4px;
}
.manualrow { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; }

/* Våpenegenskaper under en angrepsrad i editoren. */
.weappanel {
  border: 1px solid var(--rule); border-radius: 6px;
  background: var(--ink); padding: 10px; margin-top: 8px;
}
.picklist.short { max-height: 34vh; }
/* Talentbeskrivelsen er en hel setning og må få bryte. */
.picklist .entry-sub { white-space: normal; }

.attackflags {
  grid-column: 1 / -1;
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  padding-left: 2px;
}

/* Talenter er klikkbare — de som finnes i talentboka er uthevet. */
.talentchips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
.chip.talent {
  cursor: pointer; font-family: var(--ui); letter-spacing: 0.02em;
  color: var(--muted);
}
.chip.talent.known { color: var(--brass); border-color: var(--brass-dim); }
.chip.talent.known:hover { background: var(--brass-glow); }
.chip.talent:not(.known) { border-style: dashed; }
.section-label.chosen { color: var(--brass); border-bottom-color: var(--brass-dim); }
.section-label { display: flex; align-items: baseline; gap: 8px;
  flex-wrap: wrap; justify-content: space-between; }
.skilllink { font: inherit; color: inherit; }
.skilllink:hover { color: var(--brass); text-decoration: underline; }
.btn.primary[disabled] { opacity: 0.4; cursor: not-allowed; }
.cb-name { flex: 1; min-width: 0; display: block; }
.cb-name b {
  display: block; font-family: var(--ui); font-size: 15px;
  color: var(--parchment);
}
.cb-hp {
  font-family: var(--mono); font-size: 19px; color: var(--parchment);
  font-variant-numeric: tabular-nums; flex: none;
}
.cb-hp small { font-size: 12px; color: var(--faint); }
.cb-hp.out { color: var(--signal); }

.cb-tools { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.cb-num { width: 74px; text-align: center; font-family: var(--mono); }

.cb-attacks, .cb-conds { display: flex; gap: 5px; flex-wrap: wrap; }
.chip.atk {
  cursor: pointer; font-family: var(--mono); color: var(--parchment);
  border-color: var(--rule);
}
.chip.atk:hover { border-color: var(--brass-dim); color: var(--brass); }
.chip.cond { cursor: pointer; font-family: var(--ui); letter-spacing: 0.02em; }
.chip.cond.on {
  background: rgba(198,80,74,0.16); border-color: var(--signal);
  color: var(--signal);
}
.chip.cond.add { color: var(--faint); }
.chip.cond.add:hover { color: var(--brass); border-color: var(--brass-dim); }
.condpick { padding: 2px 0 2px 2px; }

/* ------------------- angrepsflyten i kamp ---------------------- */

.flowcard {
  border: 1px solid var(--rule-soft); border-radius: 6px;
  padding: 12px 14px; margin-bottom: 12px; background: var(--ink-2);
}
.flowname {
  font-family: var(--ui); font-size: 17px; font-weight: 600;
  color: var(--parchment); margin: 2px 0 4px; line-height: 1.25;
}
.flowcard p { margin: 0 0 4px; }
.rollrow, .defroll {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin: 10px 0 6px;
}
.minilabel {
  font-family: var(--ui); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--faint);
}
.threshline {
  font-family: var(--mono); font-size: 11.5px; color: var(--faint);
  margin: 0 0 2px;
}
.lvlholder { display: inline-flex; }
.lvlchip {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  padding: 5px 10px; border-radius: 4px;
  border: 1px solid var(--rule); color: var(--muted);
  white-space: nowrap;
}
.lvlchip.res-crit    { color: var(--brass); border-color: var(--brass-dim); }
.lvlchip.res-extreme { color: var(--brass); border-color: var(--brass-dim); }
.lvlchip.res-hard    { color: var(--tide); border-color: var(--tide); }
.lvlchip.res-reg     { color: var(--verdigris); border-color: var(--verdigris); }
.lvlchip.res-fail    { color: var(--muted); }
.lvlchip.res-fumble  { color: var(--signal); border-color: var(--signal); }

.respchips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px; }
.chip.resp { cursor: pointer; font-family: var(--ui); }
.chip.resp.on {
  background: var(--brass-glow); border-color: var(--brass-dim);
  color: var(--brass);
}
.fbpick { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.chip.atk.on {
  background: var(--brass-glow); border-color: var(--brass-dim);
  color: var(--brass);
}

.verdict {
  border: 1px solid var(--rule); border-left: 3px solid var(--rule);
  border-radius: 6px; padding: 12px 14px; margin-bottom: 10px;
  background: var(--ink-3);
}
.verdict.hit  { border-left-color: var(--signal); }
.verdict.miss { border-left-color: var(--tide); }
.verdict.bad  { border-left-color: var(--brass-dim); }
.verdict p { margin: 0 0 4px; }
.verdict-head {
  font-family: var(--ui); font-size: 16px; font-weight: 600;
  color: var(--parchment);
}
.dmgbox {
  border: 1px solid var(--rule-soft); border-radius: 6px;
  padding: 12px 14px; background: var(--ink-2);
}
.dmgbox:empty { display: none; }
.dmgbox p { margin: 0 0 4px; }
.dmgnum { font-family: var(--mono); font-size: 15px; color: var(--parchment); }
.dmgnum b { font-size: 26px; color: var(--signal); margin-right: 6px; }
.pickrow.dimmed { opacity: 0.5; }

/* Tellere for skapninger med egne mekanismer. */
.cb-special { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.resbox {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--ink);
}
.resbox.spent { opacity: 0.45; }
.resnum {
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  color: var(--brass); font-variant-numeric: tabular-nums;
  min-width: 14px; text-align: center;
}
.reslabel {
  font-family: var(--ui); font-size: 11px; letter-spacing: 0.06em;
  color: var(--muted);
}
.resadj {
  font-family: var(--mono); font-size: 13px; line-height: 1;
  color: var(--muted); padding: 2px 5px; border-radius: 4px;
  border: 1px solid transparent;
}
.resadj:hover { color: var(--brass); border-color: var(--brass-dim); }
.resadj.roll { font-size: 10px; letter-spacing: 0.06em; }
.chip.atk.spent { opacity: 0.4; }

.logline {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  margin: 0 0 4px; padding-bottom: 4px;
  border-bottom: 1px solid var(--rule-soft);
}
.logline:last-child { border-bottom: none; }

/* ----------------------- smale skjermer ------------------------ */

@media (max-width: 860px) {
  .shell {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "rail" "main";
  }
  .rail {
    position: sticky; top: 0; z-index: 20;
    flex-direction: row;
    max-height: none;
    overflow-x: auto;
    overflow-y: hidden;
    border-right: none;
    border-bottom: 1px solid var(--rule);
    background: var(--ink);
    padding: 8px var(--gutter);
    gap: 4px;
  }
  .rail-group { display: none; }
  .navlink {
    width: auto; white-space: nowrap; border-left: none;
    border-bottom: 2px solid transparent; border-radius: 5px 5px 0 0;
    padding: 6px 11px; font-size: 13px;
  }
  .navlink[aria-current="page"] { border-left: none; border-bottom-color: var(--brass); }
  .navlink .count { margin-left: 6px; }
  .main { padding-block: 18px 64px; }
  .masthead { gap: 10px; padding: 12px var(--gutter); }
  .wordmark { font-size: 17px; }
}
</style>
</head>

  <main class="main" id="main"><div class="view"></div></main>
</div>

<div class="scrim" id="scrim" hidden>

    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<script type="application/json" id="bundled-scenarios">[{"id":"slow-boat-to-china","version":7,"title":"A Slow Boat to China","system":"Pulp Cthulhu / Call of Cthulhu 7e","source":"Pulp Cthulhu, kapittel 13 (Chaosium)","author_note":"Lagt inn for spilling i Eldritch Portal, på norsk. Spillmekaniske begreper står på engelsk. Karakteristikker for menneskelige NPCer som ikke er trykt i selve scenarioteksten, er merket som spillklare forslag — bytt dem ut med verdiene fra Appendix A hvis du har boka.","tagline":"En luksusliner, elleve døgn på havet, og noe nede i lasterommet som holder på å lære seg å spille.","player_pitch":"Desember 1931. SS President Coolidge seiler fra San Francisco mot Shanghai med 678 passasjerer, 315 mann besetning og femten døgn foran seg. Det er jazz i Grand Salon, leirdueskyting over akterenden og syvretters middag hver kveld. Den andre morgenen blir en millionærs tomme klær funnet sammenlagt i en stol, som om mannen inni bare hadde smeltet bort.","keeper_summary":"En crawling one — det som er igjen av trollmannen Luis Fernando de la Montoyo, nå en sverm av levende utøy — frakter Pipes of Leng, et mekanisk orgel bygd for å tilkalle og fange vesener fra Mythos, ut til en prøvekjøring midt i Stillehavet. Den reiser som den tilbaketrukne spanske adelsmannen Señor Diego Guiterrez de Almacan, dreper og tar ansiktet til alle som er i veien, og trenger blodet av fem ofre for å lade opp maskinen. Den 19. desember spiller den på orgelet. Innretningen virker akkurat feil: den gjør det den tilkaller rasende. En flying polyp stiger opp fra havbunnen for å knuse maskinen — og skipet med den.","run_time":"3–5 økter","player_count":"3–6 helter","setting":"SS President Coolidge, San Francisco til Shanghai, 5.–20. desember 1931","notes":"","sessions":[],"keeper_brief":[{"title":"Hele plottet i ett avsnitt","body":"En crawling one har bygd en maskin som tilkaller vesener fra Mythos. Den prøvekjører maskinen om bord på en passasjerliner midt i Stillehavet. Den trenger fem blodofre for å lade den opp, og den tar ansiktet til dem den dreper. Heltene er passasjerer. Når maskinen omsider spiller, tilkaller den noe som river skipet i stykker."},{"title":"Hvordan heltene havner i det","body":"De er ganske enkelt om bord — på rekonvalesensreise til Shanghai, eller invitert til åpningen av «Le Monde Mystérieux de l'Indo-Chine» ved Institut Orientale i den franske konsesjonen. Utstillingen skal etter sigende inneholde sjeldne okkulte skriftruller og en svart paddefigur som kalles Çahoqua.\n\nLager dere nye karakterer, bør alle booke samme klasse. La aldri en spiller være med i mannskapet."},{"title":"Tempo — det som oftest går galt","body":"Femten døgn er mange døgn. Spillerne kommer til å ville bruke hver eneste time av hvert eneste av dem. Press tempoet: si rett ut at du spoler fram til det som betyr noe, og kast en scene mot dem hver gang etterforskningen stopper opp. La dem utforske og sladre, men hold dagene i bevegelse."},{"title":"Katt og mus","body":"Å finne skapningen skal være en jakt, ikke en avsløring. Den kan være hvilken som helst av fem skikkelser, den kan bytte mellom dem i løpet av én kamprunde, og blir den trengt opp i et hjørne faller den fra hverandre til en haug insekter som renner ned mellom gulvplankene. La den aldri bli tatt tidlig — la den bli *nesten* tatt ofte."},{"title":"Skru pulp-nivået opp eller ned","body":"Som skrevet: et mordmysterium om bord på et skip, med et monster på slutten. Skrudd opp: zombier som kommer opp fra underdekkene, gale tcho-tcho, en hunting horror i korridorene og krigsskipskanoner kalt inn mot polyppen. Begge deler er dekket — se de valgfrie oppslagene under Regler."},{"title":"Hvor det ender","body":"Coolidge går nesten helt sikkert ned. Overlevende plukkes opp i løpet av noen timer, og avisene skriver om en monsterbølge. Får skapningen fullført sin Gate til Shanghai, slutter den seg til Eight Fortunes Mutual Aid Society og blir en skurk som kommer tilbake med et regnskap å gjøre opp."}],"timeline":[{"id":"tl-depart-san-francisco","day":"Lør. 5. des","when":"kl. 11.00","title":"Avgang fra San Francisco","description":"Coolidge legger ut fra Pier 42 i tåke og tåkelurer, og passerer Alcatraz på vei ut. Ombordstigningen skjer klassevis: første klasse og spesialklasse forut, tatt imot av førstestyrmann Schramm; tredje klasse midtskips; mellomdekket akterut, for egen maskin. Heltene støter på en full Chad Peterson og forloveden hans, Virginia Ridley, på landgangen.","triggered":false,"connects_to":["beat-up-the-gangway"],"tag":"voyage"},{"id":"tl-peterson-is-consumed","day":"Lør. 5. des","when":"kveld","title":"Peterson blir fortært","description":"Skapningen kommer om bord i utøyform, skjult inne i energiinnretningen i lasterom 7, tar et ubebodd lugarrom som Señor Almacan, og blir konfrontert av overproviantforvalter Martin Dungass — som blir drept og fortært. Den innser at den ikke kan myrde hele mannskapet, og finner og fortærer i stedet Chad Peterson.\n\nVirginia spiste middag med den ekte Peterson rundt kl. 19.00. Skikkelsen hun ser i korridoren kl. 21.30 er allerede skapningen.","triggered":false,"connects_to":["npc-crawling-one","beat-cabin-mates"],"tag":"villain"},{"id":"tl-the-empty-suit-is-found","day":"Søn. 6. des","when":"ca. kl. 09.45","title":"De tomme klærne blir funnet","description":"Albert Hallander dirker opp Petersons lugar for å rane den, og finner en masse kakerlakker. Minutter senere åpner Virginia Ridley den ulåste døra og skriker. Klærne ligger sammensunket i en stol, tredd inn i hverandre som en russisk dukke.","triggered":false,"connects_to":["beat-the-empty-suit","handout-suicide-note"],"tag":"event"},{"id":"tl-anyone-seen-the-purser?","day":"Søn. 6. des","when":"utover dagen","title":"Har noen sett forvalteren?","description":"Praten går blant mannskapet: overproviantforvalter Martin Dungass har ikke vært sett siden han gikk sin runde i går kveld.","triggered":false,"connects_to":["beat-anyone-seen-the-purser"],"tag":"event"},{"id":"tl-sunday-mass-and-st.-nicholas-night","day":"Søn. 6. des","when":"morgen og kveld","title":"Søndagsmesse og nissefest","description":"Pater Alvarez holder messe i skipskapellet. Nissefest for alle barn på første klasse, spesialklasse og tredje klasse i ballsalen.","triggered":false,"connects_to":["npc-father-alvarez"],"tag":"social"},{"id":"tl-the-tome-of-red-jade-is-stolen","day":"Man. 7. des","when":"etter midnatt","title":"Tome of Red Jade blir stjålet","description":"Skapningen har overhørt dr. Soong og Wang Ma, tar tilbake Petersons skikkelse, stjeler en mannskapsuniform og henter boka fra Soongs lugar mens doktoren går tur på dekk. Wang Ma blir drept. Tyven hopper fra båtdekket ned på promenadedekket og er borte.","triggered":false,"connects_to":["beat-the-stolen-book","handout-book-of-red-jade"],"tag":"villain"},{"id":"tl-bunny-bates-is-dominated","day":"Man. 7. des","when":"dagtid","title":"Bunny Bates blir dominert","description":"Skapningen kaster Dominate på gangsteren Stuart «Bunny» Bates og begynner å bruke ham som sine hender. Formelen må kastes på nytt hver natt, med en opposed POW roll.","triggered":false,"connects_to":["npc-bunny-bates"],"tag":"villain"},{"id":"tl-casino-night","day":"Man. 7. des","when":"kveld","title":"Kasinokveld","description":"Kasinokveld for første klasse og spesialklasse. Fire innleide kortgivere, blant dem brødrene Po fra tredje klasse, som kjører Pai Gow.","triggered":false,"tag":"social"},{"id":"tl-peterson-memorial-service","day":"Tir. 8. des","when":"kl. 11.00","title":"Minnestund for Peterson","description":"Pater Alvarez holder en minnestund i skipskapellet. Charles Astor tramper rundt og krever at noen gjør noe. Noen av damene på første klasse tar Virginia under vingene, i knapt behersket panikk.","triggered":false,"connects_to":["beat-passenger-reactions"],"tag":"social"},{"id":"tl-wang-ma-is-buried-at-sea","day":"Tir. 8. des","when":"kl. 15.00","title":"Wang Ma begraves på havet","description":"En kort seremoni ved akterenden. Lo Mai trer inn i Wang Mas plass ved dr. Soongs side.","triggered":false,"connects_to":["npc-wang-ma"],"tag":"event"},{"id":"tl-virginia-shoots-skeet","day":"Ons. 9. des","when":"dagtid","title":"Virginia skyter leirduer","description":"Virginia Ridley skyter leirduer ut over akterdekket for å få ut nervene. Til slutt ber stuertene henne slutte — skuddene forstyrrer de andre passasjerene.","triggered":false,"connects_to":["npc-virginia-ridley"],"tag":"social"},{"id":"tl-tahitian-ball","day":"Ons. 9. des","when":"kveld","title":"Tahiti-ball","description":"Tahiti-ball for passasjerer på første klasse og spesialklasse.","triggered":false,"tag":"social"},{"id":"tl-phyllis-barnes-performs","day":"Tor. 10. des","when":"dagtid","title":"Phyllis Barnes opptrer","description":"Phyllis Barnes holder konsert i musikkrommet på B-dekk.","triggered":false,"connects_to":["npc-phyllis-barnes"],"tag":"social"},{"id":"tl-arrive-honolulu---quarantine","day":"Tor. 10. des","when":"tidlig morgen","title":"Ankomst Honolulu — i karantene","description":"Skipet holdes i karantene. Ingen går i land, ingen lektere legger til. Politiet fra Honolulu kommer om bord for å etterforske Petersons antatte selvmord og forvalterens forsvinning, avhører Soong, Aimesworthy og Ridley, gjennomsøker mellomdekket, og drar etter to timer.","triggered":false,"connects_to":["beat-honolulu-and-beyond"],"tag":"event"},{"id":"tl-sacrifice-1:-takishi-suroda","day":"Tor. 10. des","when":"etter middag","title":"OFFER 1: Takishi Suroda","description":"Bates finner Suroda vandrende etter middagen, overmanner ham og tar ham med til lasterom 7. Tappet, og deretter kastet ut gjennom en koøye. En helt som deler lugar med ham, finner senga urørt.","triggered":false,"connects_to":["beat-missing-people","npc-takishi-suroda"],"tag":"villain"},{"id":"tl-suicide-ruling---depart-honolulu","day":"Fre. 11. des","when":"dagtid","title":"Selvmordskjennelsen — avgang Honolulu","description":"Etterforsker William Ranta slår fast at avskjedsbrevet er ekte og at Peterson hoppet. De tomme klærne er «en tilfeldighet». Dungass blir ført opp som en drukningsulykke. Wang Mas drapsmann skal ha rømt i land. Helter som insisterer på at de har sett Peterson etter dødsfallet, blir raskt avfeid.\n\nEtter Honolulu tilbyr Charles Astor 1 000 dollar kontant for opplysninger som fører fram.","triggered":false,"connects_to":["beat-honolulu-and-beyond","npc-charles-astor"],"tag":"event"},{"id":"tl-cross-the-international-date-line","day":"Lør. 12. des","when":"—","title":"Datolinjen passeres","description":"Et døgn vinnes. Alle datoer i scenarioet holdes til amerikansk tid, for å slippe forvirring.","triggered":false,"tag":"voyage"},{"id":"tl-sacrifice-2:-miles-hardaway","day":"Lør. 12. des","when":"natt","title":"OFFER 2: Miles Hardaway","description":"Journalisten fra Chronicle lokkes til Señor Almacans lugar. Bates slår ham ned bakfra. Tappet, og deretter ut gjennom en koøye.","triggered":false,"connects_to":["beat-missing-people","npc-miles-hardaway"],"tag":"villain"},{"id":"tl-sunday-mass","day":"Søn. 13. des","when":"morgen","title":"Søndagsmesse","description":"Pater Alvarez holder messe i kapellet.","triggered":false,"connects_to":["npc-father-alvarez"],"tag":"social"},{"id":"tl-sacrifices-3-&-4:-barnes-and-a-crewman","day":"Søn. 13. des","when":"natt","title":"OFFER 3 OG 4: Barnes og en matros","description":"Phyllis Barnes hører orgelet gjennom ventilasjonssjaktene og går for å undersøke. Hun finner fram til lastelukene — og kommer rett inn i at Bates slår ned en matros på runde. Matrosen går over bord. Barnes lar seg ikke dumpe usett, så kroppen hennes havner i en ballasttank i lasterom 4. Den blir funnet om lag en uke senere, på lukta.","triggered":false,"connects_to":["beat-missing-people","loc-hold-4","npc-phyllis-barnes"],"tag":"villain"},{"id":"tl-rumours-of-strange-music","day":"Søn. 13. des","when":"natt og utover","title":"Rykter om underlig musikk","description":"Passasjerene begynner å snakke om musikk som høres midt på natta. Ingen to forklaringer stemmer overens — «en hjemsøkt opera», «en dødsmesse fra helvete».","triggered":false,"connects_to":["beat-distant-music"],"tag":"event"},{"id":"tl-the-music-is-heard-clearly","day":"Man. 14. des","when":"natt","title":"Musikken høres tydelig","description":"Nå høres musikken over hele skipet. En Listen roll om natta fanger den opp; Hard Listen plasserer den under dekk. Musikkrommet står tomt.","triggered":false,"connects_to":["beat-distant-music"],"tag":"event"},{"id":"tl-sacrifice-5:-keeper's-choice","day":"Tir. 15. – ons. 16. des","when":"natt","title":"OFFER 5: Keeperens valg","description":"Ett dødsfall til lader orgelet helt opp. Hvem det er, avgjør du. En navnløs passasjer fungerer, men noen heltene har blitt kjent med fungerer langt bedre: dr. Soong, Virginia Ridley, pater Alvarez. En av heltene er et fullt legitimt mål.","triggered":false,"connects_to":["beat-missing-people"],"tag":"villain"},{"id":"tl-bunny-bates-confesses","day":"Tor. 17. des","when":"—","title":"Bunny Bates skrifter","description":"Bates bryter kort ut av domineringen og oppsøker pater Alvarez — eller en helt, hvis noen av dem er prest — for å skrifte. Han tilstår boktyveriet og drapet på Wang Ma, og alt annet han kommer på. Han snakker om stemmer som fikk ham til det. Historiene henger ikke sammen. I løpet av en time knekker han, og skapningen tar ham for godt.","triggered":false,"connects_to":["npc-bunny-bates","npc-father-alvarez"],"tag":"event"},{"id":"tl-foul-weather","day":"Fre. 18. des","when":"hele dagen","title":"Uvær","description":"CON roll eller sjøsyke.","triggered":false,"tag":"voyage"},{"id":"tl-heavy-seas","day":"Lør. 19. des","when":"morgen","title":"Grov sjø","description":"Høye bølger og regn hele formiddagen — CON roll eller sjøsyke. Klarner opp utover ettermiddagen.","triggered":false,"tag":"voyage"},{"id":"tl-climax:-bunny-takes-a-hostage","day":"Lør. 19. des","when":"kveld","title":"KLIMAKS: Bunny tar en gissel","description":"Bates går inn i spisesalen på første klasse og tar den første han ser som gissel, mens han skriker om stemmene. Han må tas med makt eller med kløkt (Extreme Persuade eller Fast Talk, eller Hard Psychoanalysis).","triggered":false,"connects_to":["beat-bunny-takes-a-hostage"],"tag":"climax"},{"id":"tl-climax:-the-final-test","day":"Lør. 19. des","when":"kveld","title":"KLIMAKS: Den store prøven","description":"Mens alle er opptatt med Bates, spiller skapningen på Pipes of Leng nede i lasterom 7. En malstrøm åpner seg i havet, og en flying polyp stiger opp for å ødelegge maskinen — og skipet rundt den.","triggered":false,"connects_to":["beat-the-final-test","npc-flying-polyp"],"tag":"climax"},{"id":"tl-due-in-shanghai","day":"Søn. 20. des","when":"kl. 06.00","title":"Beregnet ankomst Shanghai","description":"Den planlagte ankomsten, som Coolidge etter alt å dømme aldri rekker.","triggered":false,"connects_to":["beat-conclusion"],"tag":"voyage"}],"beats":[{"id":"beat-up-the-gangway","title":"Opp landgangen","act":"Akt 1 — Om bord","description":"Lørdag 5. desember, Pier 42.\n\nHeltene sjekker inn bagasjen og tas imot av en stuert fra Dollar Line og skipets offiserer. Ombordstigningen skjer klassevis: første klasse og spesialklasse forut, ønsket velkommen av førstestyrmann Hugo Schramm; tredje klasse midtskips, med matroser til å hjelpe; mellomdekket akterut, for egen maskin.\n\nMØT DEN DØDSDØMTE. Heltene bør støte borti Chad Peterson og Virginia Ridley på landgangen. Peterson er upåklagelig kledd og grundig full, krever champagne opp på rommet og hilser på alle han kolliderer med: «Chad Peterson fra New York, en fornøyelse å gjøre Deres bekjentskap.» Stuertene smisker for ham, men tar ham også bestemt i armen og loser ham til lugaren på første klasse på A-dekk. Virginia er irritert, men holder munn. Blir hun tiltalt, gir hun et anstrengt smil og unnskylder seg så fort hun kan: «Unnskyld meg. Jeg må gjøre meg klar til middag.»\n\nDr. Soong kommer om bord i mørk dress og bowlerhatt, med en liten doktorveske og tjeneren Wang Ma ved skulderen. Soong presenterer seg selv, men ikke Wang Ma. Snakker noen til Wang Ma, grynter han, og Soong forklarer at mannen er «litt tilbakeholden».\n\nPASSASJERER PÅ MELLOMDEKKET møter havnearbeiderne og Lo Mai, en av Soongs tcho-tcho-arbeidere, som overvåker lastingen av femti tønner merket «Hawaiian Botanical Specimens».\n\nDETTE LASTES OM BORD (alt sammen er synlig fra kaia):\n• Tre splitter nye Packard-sedaner fra 1931, en Hudson turvogn fra 1930, en Bugatti racer\n• Tjue melkekyr, et dusin Oliver-traktorer\n• Et dusin tønner fransk konjakk, et lastebillass med postsekker\n• En diger kasse: et komplett 50-pipers orgel fra «Wm. Wood Pipe Organ Co., Inc. of Portland, Oregon»\n• En to meter høy grønn metallkasse, levert med væpnet vakt\n• Hundrevis av kofferter, skipskister, gevær- og instrumentkasser — og en papegøye\n\nSPOT HIDDEN: legger i tillegg merke til en stor kasse merket «Funeral Supplies» — liket av en tcho-tcho som døde i San Francisco, og som sendes hjem til Burma på dr. Soongs regning.\n\nSkipet kaster loss like etter kl. 11.00 og passerer Alcatraz på vei ut.","done":false,"connects_to":["clue-organ-crate","clue-green-metal-box","clue-funeral-supplies","npc-chad-peterson"],"dialogue":[{"who":"Chad Peterson","line":"«Chad Peterson fra New York, en fornøyelse å gjøre Deres bekjentskap.»","source":"bok","note":"Til alle han kolliderer med på landgangen. Han er grundig full og gjentar seg selv."},{"who":"Virginia Ridley","line":"«Unnskyld meg. Jeg må gjøre meg klar til middag.»","source":"bok","note":"Hennes vei ut av enhver samtale den første dagen. Sagt med et anstrengt smil."},{"who":"Dr. Soong","line":"«Dette er min tjener, Wang Ma. Han vil svare på spørsmålene Deres. Ha meg unnskyldt.»","source":"bok","note":"Soong presenterer seg selv, men ikke Wang Ma — han presenterer tjeneren som noe man henvender seg til."},{"who":"Dr. Soong","line":"«Han er litt tilbakeholden.»","source":"bok","note":"Hvis noen snakker til Wang Ma og bare får et grynt."},{"who":"Wang Ma","line":"«Mester Soong sier nei.»","source":"bok"},{"who":"Wang Ma","line":"«Mester Soong sier ikke.»","source":"bok"},{"who":"Kaptein Nelson","line":"«God aften. Jeg håper De nyter reisen?»","source":"bok","note":"Varm stemme med en underlig aksent — han er norsk, men vokste opp på Martinique og snakker utmerket kolonifransk."},{"who":"Førstestyrmann Schramm","line":"«Selvfølgelig, jeg skal se til det med en gang.»","source":"bok","note":"Smiler og nikker mye. Han mener det, men han har tretti andre ting å gjøre."},{"who":"En stuert","line":"«Mr. Peterson. Denne veien, sir. Champagnen står alt på rommet.»","source":"forslag","note":"Stuertene smisker for ham og loser ham bestemt bort samtidig."}],"roleplay":"Dette er den eneste scenen der spillerne møter Chad Peterson i live, og de vet ikke at det er poenget. Gi ham plass: la ham avbryte, la ham grave ut hånda mot feil person, la ham gjenta navnet sitt. Når han blir funnet som en tom dress neste morgen, skal spillerne kunne høre stemmen hans.\n\nVirginia er irritert og holder munn. Spill henne som noen som allerede har bestemt seg for ikke å lage en scene foran folk — det gjør sammenbruddet hennes dagen etter mye større.\n\nSoong presenterer seg selv og ikke tjeneren. La spillerne merke forskjellen. Prøver de å snakke med Wang Ma, får de et grynt, og Soong svarer for ham. Det er ikke uhøflighet fra Soongs side — det er en mann som er vant til at folk henvender seg til feil person.\n\nIkke bruk terninger her. Landgangen er en scene der alle får si navnet sitt og vise hvem de er. Trenger du et slag, la det være Spot Hidden på den store kassa merket «Funeral Supplies»."},{"id":"beat-cabin-mates","title":"Lugarkamerater","act":"Akt 1 — Om bord","description":"Lørdag 5. desember. Gi heltene tid til å installere seg, og bruk lugarkameratene til å dele ut relasjoner gratis.\n\nMELLOMDEKKET, sovesalen: en familie på sju hawaiiske misjonærer (familien Castor), fire unge irer på kontrakt med Shanghai-politiet, tretten amerikanere som håper å bli rike i Kina, tre japanske bryggere på vei hjem til Tokyo, et knippe filippinske jazzmusikere som ikke slo an i San Francisco, tre barnepiker hvis arbeidsgivere reiser på første klasse, seks av dr. Soongs tcho-tcho-arbeidere under Lo Mai, og ti kinesiske jernbanearbeidere og kjøpmenn på hjemvei.\n\nTREDJE KLASSE: en åttekøys lugar delt med brødrene Po Liang og Po Hau, Pai Gow-givere innleid til kasinokvelden, og marinegast Olaf Gustavsen fra minesveiperen Abilene, på vei tilbake til Pearl Harbor fra permisjon.\n\nSPESIALKLASSE: mannlige helter deler trolig lugar med Takishi Suroda, kvinnelige med Phyllis Barnes.\n\nFØRSTE KLASSE på A-dekk: Señor Diego Guiterrez de Almacan bor én lugar unna. Virginia Ridley og Chad Peterson er nære naboer. På båtdekket er dr. Soong og Wang Ma naboene. Heltene kan dele heis med det unge paret på vei til middag, eller se dem stå hånd i hånd i baugen på promenadedekket.\n\nIngenting uvanlig skjer den første natta — ikke med heltene. Inne i lugaren sin blir Chad Peterson fortært.","done":false,"connects_to":["npc-almacan","npc-takishi-suroda","npc-phyllis-barnes"],"dialogue":[{"who":"Takishi Suroda","line":"«Du der — hva er det du har der?»","source":"bok","note":"Han spør om alt. Hver gang."},{"who":"Takishi Suroda","line":"«Der er du jo! Hvor har du gjemt deg hen?»","source":"bok","note":"Sagt til en helt han har snakket med én gang."},{"who":"Phyllis Barnes","line":"«Jeg er i musikkrommet hvis noen trenger meg.»","source":"bok"},{"who":"En av de irske politirekruttene","line":"«Shanghai-politiet. Tre års kontrakt, dobbelt betaling, og ingen som spør hvor du kommer fra. Du skulle søkt selv.»","source":"forslag","note":"Fire unge irer på mellomdekket. De drikker og snakker høyt om hva de skal gjøre med pengene."},{"who":"Olaf Gustavsen, marinegast","line":"«Jeg har ikke sovet i en seng som ikke beveger seg på fire år. Det er sengene på land jeg ikke klarer.»","source":"forslag","note":"Tredjeklasses lugarkamerat, på vei tilbake til Pearl Harbor."},{"who":"Lo Mai","line":"«Doktorens folk. Vi holder oss for oss selv.»","source":"forslag","note":"Kort, høflig, avvisende. Tcho-tcho-ene svarer ikke på mer enn det som blir spurt om."}],"roleplay":"Boka gir ingen replikker til denne scenen, men den er verdt å spille, fordi den er gratis: hver lugarkamerat er en relasjon spillerne får uten at du må rigge noe.\n\nGi hver spiller ÉN lugarkamerat med ett kjennetegn og én replikk. Ikke mer. Poenget er at de skal kjenne igjen navnet når det dukker opp igjen på dag ni.\n\nSuroda er den viktigste: han deler trolig lugar med en av de mannlige heltene, og han forsvinner som det første offeret den 10. desember. Jo mer irriterende han er nå, jo verre er det når senga hans står urørt.\n\nFranz og Skjoldvår har begge Stealth over 60 og vil merke at Lo Mai og tcho-tcho-ene beveger seg annerledes enn andre passasjerer. Gi dem en Spot Hidden eller Psychology som gir følelsen, ikke fakta."},{"id":"beat-the-empty-suit","title":"Den tomme dressen","act":"Akt 2 — Mysteriet","description":"Søndag 6. desember, like etter kl. 09.45, korridoren på første klasse på A-dekk, akterover, nær barbersalongen og skredderen.\n\nLISTEN roll for morgenfugler: de hører oppstyret fra et av de øvre dekkene.\n\nVirginia Ridley, på vei til en sen frokost, går til Petersons rom, finner døra ulåst og skriker. Inne: en tom dress og en underlig, vond lukt. Sokker og sko på gulvet foran en stol; dress, vest, skjorte og undertrøye tredd inn i hverandre som en russisk dukke, som om kroppen inni bare hadde smeltet bort.\n\nHVEM SOM ER I KORRIDOREN. Bare Hallander og Ridley må være til stede:\n• Albert Hallander, matros, som dirket opp låsen noen minutter tidligere for å rane stedet, og fikk tusenvis av kakerlakker susende ut av stolen. Han skrek. Han er fortsatt rystet.\n• Virginia Ridley, fra seg.\n• Charles Astor, ubehagelig til stede.\n\nÅ KNEKKE HALLANDER. Han påstår at han hørte en lyd og kom inn gjennom en ulåst dør. Han lyver — det var ingen lyd, og døra var låst. Psychology ser at han er i sjokk; Intimidate eller Persuade får ham til å snakke; en ny Psychology avslører løgnene. Han vil heller rote til bildet og komme seg unna enn å innrømme tyveriforsøk, men en samlet innsats får ham til å tilstå — og bli arrestert av skipets offiserer.\n\nRyktene om at Peterson «hoppet» starter umiddelbart. Matros Hank Henson holder døra til skipslegen Hartman og førstestyrmann Schramm har sett åstedet.\n\nÅ GJENNOMSØKE LUGAREN. Mannskapet vil ha det stille og holder funnene for seg selv. Heltene kommer inn ved bestikkelse, bløff, status på første klasse, eller ved at Virginia lager bråk. Senere, når Henson er tilbake i vanlig tjeneste, kommer de inn med Locksmith eller Mechanical Repair. Ingenting ser malplassert ut bortsett fra klærne — og et avskjedsbrev på skrivebordet, som stuert Aimesworthy tar med seg som bevismateriale samme kveld.","done":false,"connects_to":["handout-suicide-note","clue-empty-clothes","clue-hallanders-lie","npc-albert-hallander"],"dialogue":[{"who":"Albert Hallander","line":"«Jeg var bare på vei forbi, jeg skulle ha gått rett videre.»","source":"bok","note":"Han lyver. Det var ingen lyd, og døra var låst — han dirket den opp."},{"who":"Albert Hallander","line":"«Jeg vet ingenting, det sverger jeg på.»","source":"bok"},{"who":"Virginia Ridley","line":"«De finner ham, ikke sant? De må bare finne ham.»","source":"bok","note":"Etter skriket. Hun klamrer seg til den første som virker kompetent."},{"who":"Charles Astor","line":"«Noe må gjøres.»","source":"bok","note":"Han står i korridoren og er ubehagelig til stede."},{"who":"Matros Hank Henson","line":"«Ingen inn, sir. Ordre fra styrmannen. Jeg er lei for det.»","source":"forslag","note":"Han holder døra og mener alvor. Han er også tjueto år gammel og redd."},{"who":"Dr. Hartman, skipslege","line":"«Jeg har sett mange ting i denne jobben. Jeg har aldri sett klær legge seg sammen.»","source":"forslag","note":"Sagt lavt, til en av heltene, når ingen andre hører."}],"roleplay":"Scenen har to lag: det som ligger i stolen, og Hallander som lyver om hvorfor han er der.\n\nSpill Hallander som en som gjerne roter til hele bildet heller enn å innrømme et tyveriforsøk. Han er i sjokk (Psychology ser det), han lyver dårlig (en ny Psychology avslører det), men han gir seg ikke på første spørsmål. Intimidate eller Persuade får ham til å snakke — og her er Beefcakes Intimidate 99 og Skjoldvårs APP 99 begge riktige svar. La det gå fort når de bruker dem.\n\nMen han har faktisk ikke sett noe. Poenget med Hallander er ikke informasjonen, det er at gruppa bruker en halv dag på ham. Når han til slutt tilstår tyveriet og blir arrestert, har de knekt feil mann, og det skal føles som en seier helt til det ikke gjør det.\n\nVirginia skal ikke være hysterisk lenge. La henne gå fra skrik til iskald konsentrasjon i løpet av et minutt — hun er en kvinne som skyter leirduer for å roe nervene. Det gjør henne til en alliert i stedet for et problem."},{"id":"beat-anyone-seen-the-purser","title":"Har noen sett forvalteren?","act":"Akt 2 — Mysteriet","description":"Søndag 6. desember, hvor som helst om bord.\n\nLISTEN roll for å overhøre mannskapet snakke om overproviantforvalter Martin Dungass, som ikke har vært sett siden i går kveld, da han gikk sin runde. Den samme samtalen går igjen hele dagen, til den alminnelige oppfatningen er at Dungass, som Peterson, er forsvunnet.\n\nSANNHETEN: Dungass la merke til en passasjer som ikke sto på listene, og gikk for å spørre om det. Han ble drept og fortært.\n\nPASSASJERLISTEN. En Hard Persuade roll gir en helt et blikk i passasjerlisten. Señor Guiterrez de Almacan står ikke oppført noe sted — ikke på første klasse, ikke noe sted. Dette er det hardeste faktumet i hele scenarioet, og det peker rett på skurken.\n\nMANNSKAPSSLADDER. Helter som blir venner med en i mannskapet, får høre konsensusen: Dungass har gått på flaska og sover den ut under dekk — det går rykter om trøbbel med kona. Han dukker nok opp, og da får han høre det av kapteinen.","done":false,"connects_to":["clue-manifest-gap","npc-martin-dungass"],"dialogue":[{"who":"En matros til en annen","line":"«Har du sett Dungass? Han gikk runden i går kveld, og siden har ingen sett ham.»","source":"forslag","note":"Den samme samtalen går igjen hele dagen, i ulike varianter. Listen-slag for å fange den opp."},{"who":"Mannskapets konsensus","line":"«Han har gått på flaska igjen. Han sover den ut et sted under dekk. Det går rykter om trøbbel med kona.»","source":"forslag","note":"Det de sier til en helt som blir venn med dem. De mener det oppriktig."},{"who":"Førstestyrmann Schramm","line":"«Jeg hørte deg ikke der ute!»","source":"bok","note":"Han er ikke på kontoret. Han er på kontoret."},{"who":"Martin Aimesworthy","line":"«Det er da ikke noe bry. La meg ta meg av det.»","source":"bok","note":"Han hjelper gjerne — og han vet mer om hvem som går hvor på dette skipet enn noen annen."}],"roleplay":"Dette er den hardeste opplysningen i hele scenarioet, og den kommer gratis hvis noen tenker på å spørre etter passasjerlista: Señor Guiterrez de Almacan står ikke oppført noe sted.\n\nIkke gi den bort. Krev et Hard Persuade — eller la Aimesworthy gi den til noen som har vært hyggelig mot ham. Det er hele grunnen til at Aimesworthy finnes.\n\nSpill mannskapets forklaring om fylla helt oppriktig. De lyver ikke; de tar bare feil. Det gjør at spillerne må vurdere en kilde som er ærlig og gal samtidig, og det er en bedre ferdighet å øve på enn å avsløre løgnere.\n\nAimesworthy er verdt å bygge en relasjon til: om Bates blir tatt eller drept, er det HAN skapningen dominerer neste gang. Jo mer spillerne liker ham, jo verre blir det."},{"id":"beat-passenger-reactions","title":"Passasjerenes reaksjoner","act":"Akt 2 — Mysteriet","description":"Miles Hardaway i San Francisco Chronicle gjør et nummer av saken, framhever at det er et «lukket rom»-mysterium og telegraferer spekulasjoner i land som «et virkelig Sherlock Holmes-mysterium!». Skipsavisa Pacific Current nevner ingen av forsvinningene.\n\nNoen av damene på første klasse tar Virginia under vingene, i knapt behersket panikk. Charles Astor tramper rundt og krever at «noe må gjøres». I løpet av det neste døgnet kommer kondolansetelegrammer fra New York, Chicago, San Francisco og Los Angeles. Pater Alvarez arrangerer en minnestund.\n\nFørstestyrmann Schramm er rådvill, og har ordre om å holde forsvinningene stille.","done":false,"connects_to":["npc-miles-hardaway","npc-charles-astor"],"dialogue":[{"who":"Charles Astor","line":"«Chip var en god venn av meg, en nær venn, og han ville aldri gjort noe slikt.»","source":"bok"},{"who":"Charles Astor","line":"«Jeg forstår det ikke. Jeg bare forstår det ikke.»","source":"bok"},{"who":"Charles Astor","line":"«Noe må gjøres.»","source":"bok","note":"Gjentas til alle som ikke kommer seg unna."},{"who":"Miles Hardaway","line":"«Si meg, fortell litt om deg selv.»","source":"bok","note":"Han spør ikke for å bli kjent. Han spør for å skrive."},{"who":"Miles Hardaway","line":"«Kan jeg få et sitat?»","source":"bok"},{"who":"Phyllis Barnes","line":"«Selvmord? Sludder. Jeg har sett mannen flere ganger siden.»","source":"bok","note":"Hun mener det. Hun har faktisk sett skapningen i Petersons skikkelse."},{"who":"Phyllis Barnes","line":"«Vel, jeg hjelper gjerne, men jeg vet ikke om det er så mye jeg kan gjøre.»","source":"bok"},{"who":"Pater Alvarez","line":"«Jeg ville undersøkt sjøfolkene. Er selvmordet i virkeligheten et drap, kan det være dem.»","source":"bok","note":"Han tilbyr en teori og spør tre spørsmål tilbake."}],"roleplay":"Dette er scenen der skipet blir et samfunn i stedet for en kulisse. Kjør den som en runde: tre–fire korte samtaler på rad, hver med én ting å ta med seg, og ikke la noen av dem vare lenger enn et par minutter.\n\nASTOR er en snobb som faktisk sørger. Begge deler samtidig. Han vil ikke ha noe med folk under spesialklasse å gjøre — og Beefcake har Credit Rating 3. Det er en ekte vegg, og den åpner seg bare hvis Skjoldvår (APP 99) eller Franz (Credit Rating 60) tar samtalen. Blir han venn, legger han inn et godt ord hos kapteinen, og det er verdt mye senere.\n\nHARDAWAY er en plage som spillerne kommer til å ville bli kvitt. Han er også offer nummer to. Gi ham én scene der han er nesten sympatisk — en journalist som faktisk vil vite hva som skjedde — før han forsvinner.\n\nPHYLLIS sier det sanneste i hele akten, og hun er den minst troverdige kilden om bord: hun lyver om annet («voldsomme slagsmål blant kineserne»), hun er åpenlyst fremmedfiendtlig, og ingen vil tro henne. La spillerne gjøre feilen med å avskrive henne. Når hun blir drept den 13., skal de huske at hun hadde rett."},{"id":"beat-the-stolen-book","title":"Den stjålne boka","act":"Akt 2 — Mysteriet","description":"Mandag 7. desember, etter midnatt, båtdekket.\n\nI løpet av formiddagen den 7. overhører skapningen — som Almacan — dr. Soong og Wang Ma snakke om doktorens eksemplar av Tome of Red Jade, tatt fra en gjeng kultister i San Francisco. Skapningen tror det er nettopp det eksemplaret den en gang eide selv, og den vil ha det tilbake.\n\nEtter midnatt tar den tilbake Petersons skikkelse, stjeler en mannskapsuniform og går inn i Soongs lugar mens doktoren går tur på dekk. Wang Ma dør mens han forsvarer den.\n\nHVIS HELTENE ER I NÆRHETEN (særlig på båtdekket):\n• LISTEN: doktorens rop om hjelp, og løpende føtter.\n• De ser en stuert styrte ut gjennom en dør og løpe mot skipssida, mellom livbåtene, med en bok under armen.\n• Det er natt. Lite lys, mange mørke kroker.\n\nJAKTEN. Skapningen svinger seg over rekkverket på båtdekket, ned på promenadedekket, og løper videre uten å miste et skritt. Forfølgere må klare en Jump roll eller ta 1D6+3 av fallet ned på hardt tredekk.\n\nMINDBLAST. Den som er rett i veien, kan bli truffet: opposed POW roll mot POW 100. Vinner skapningen, ser målet den et øyeblikk som en hul, øyeløs skikkelse med mørk energi boblende inni — 5 Sanity points og et umiddelbart anfall av galskap. Vinner helten, skjer ingenting.\n\nDEN KOMMER ALLTID UNNA. Uansett hvordan jakten går, slipper den unna: trengt opp i et hjørne hopper den inn i en mørk krok og faller fra hverandre til en masse insekter som spreller vekk og er borte. Boka kan bli mistet i prosessen — det avgjør du.\n\nVALGFRI KOMPLIKASJON: la den dominerte Bunny Bates, i stjålet mannskapsuniform, dekke retretten fra et mørkt utkikkspunkt. Han har en .32-revolver, eller en Tommy gun hvis du vil legge ordentlig press på. Tas han levende her, sier han ikke et ord. Blir han drept eller satt i arresten, dominerer skapningen stuert Martin Aimesworthy i stedet — bytt ham inn i alle senere scener.","done":false,"connects_to":["handout-book-of-red-jade","npc-dr-soong","npc-wang-ma","npc-bunny-bates","clue-blood-on-the-crate"],"dialogue":[{"who":"Dr. Soong","line":"«Hendelsen er høyst uheldig. Beklagelig og uheldig.»","source":"bok","note":"Han sier det om et drap på en mann som har tjent ham i årevis. Understatement er hans måte å bære det på."},{"who":"Dr. Soong","line":"«Jeg så Mr. Peterson gå ut fra lugaren min. Klokka var omtrent seks om morgenen, søndag den sjette.»","source":"forslag","note":"Han sier det rolig, og venter på at heltene skal regne ut hva det betyr. Peterson var alt død da."},{"who":"Dr. Soong","line":"«Boka er ikke verdifull slik De mener verdifull. Den er farlig. Det er en forskjell, og jeg håper De aldri får lære den.»","source":"forslag","note":"Hans eneste øyeblikk av åpenhet i hele akten."},{"who":"Lo Mai","line":"«Wang Ma var ikke redd. Han visste hva han gikk mot.»","source":"forslag","note":"Lo Mai trer inn i Wang Mas plass uten et ord om sorg."}],"roleplay":"Fristelsen her er å la Soong forklare alt. Ikke gjør det. Boka er tydelig på det: bruk ham til å peke i riktig retning, ikke til å redde dagen, og han er gammel og skrøpelig.\n\nGi ham én opplysning per samtale, og la ham alltid svare med et spørsmål tilbake. Han er en mann som har forsket på Mythos i tjue år og som vet nøyaktig hvor farlig det er å si for mye til folk som ikke er forberedt.\n\nDen harde nøtten er tidspunktet: han så Peterson SEKS OM MORGENEN SØNDAG, etter at Peterson var meldt død. Si det én gang, rolig, uten å understreke det. La spillerne finne ut av det selv. Om ingen biter på, kan Soong nevne det igjen en dag senere, som om han hadde glemt at han hadde sagt det.\n\nWang Ma er drept. Soong sørger ikke foran fremmede, men Psychology (Skjoldvår 60, Walther 50) ser at mannen er i stykker. Det er en åpning for spillere som behandler ham som et menneske og ikke som en oppslagsbok."},{"id":"beat-looking-for-bunny","title":"På jakt etter Bunny Bates","act":"Akt 2 — Mysteriet","description":"Bates holder seg i skjul i skapningens lugar eller nede i lasterommene. Om heltene finner ham, kommer an på hvor oppfinnsomme de er.\n\nTrengt opp i et hjørne slåss han desperat og stikker av ved første anledning. Tatt til fange bablar han om «stemmen inni» og hvordan «englekoret har befalt meg». Så lenge Dominate holder, er det ingenting nyttig å få ut av ham.\n\nÅ BRYTE DOMINERINGEN. Skapningen må kaste Dominate på nytt hver natt, med en opposed POW roll. Klarer heltene å styrke Bates' viljestyrke — en Hard Persuade eller Hard Psychoanalysis roll — gi ham en bonusterning til å stå imot.\n\nBRÅKETE HELTER. Gjør heltene livet surt, eller trenger handlingen et dytt, går Bates til bakholdsangrep: i døra til en helts lugar, eller ut av mørket nede i lasterommet. Særlig hvis de nærmer seg Almacans lugar eller snuser rundt lastelukene. Vil du gi dem virkelig hard medfart, tilkaller skapningen en hunting horror i stedet — men den timer et slikt angrep slik at færrest mulig ser det.","done":false,"connects_to":["npc-bunny-bates","npc-hunting-horror"],"dialogue":[{"who":"Bunny Bates","line":"«Hvorfor jeg skal til Japan? Pass dine egne saker.»","source":"bok","note":"Hans standardsvar på alt, før domineringen tar helt tak."},{"who":"Bunny Bates","line":"«Herregud, hva tar du meg for, en tyster? Pass dine egne saker.»","source":"bok"},{"who":"Bunny Bates","line":"«Stemmen inni.»","source":"bok","note":"Babler når han er tatt. Gjentar det."},{"who":"Bunny Bates","line":"«Englekoret har befalt meg.»","source":"bok","note":"Det andre han sier. Han vet ikke hva han mener med det."},{"who":"Bunny Bates","line":"«Jeg stjal ei bok. Jeg drepte en kineser. Jeg har gjort verre. Vil du høre om det?»","source":"forslag","note":"Skriftemålet den 17. Historiene henger ikke sammen, og han blander inn ting han umulig kan ha gjort."}],"roleplay":"Bates er ikke en skurk. Han er et verktøy noen holder i, og det er hele poenget med ham.\n\nFørste gang: spill ham som en gangster. Kjepphøy, kort, avvisende. «Pass dine egne saker.» Han slåss desperat for å komme seg unna og stikker ved første anledning — ikke la ham stå og ta imot, se kortet «Motstandere som ikke står og tar imot».\n\nAndre gang: noe har gått i stykker. Han snakker om stemmen inni og om englekoret, og han mener det. Blir han tatt, får spillerne nesten ingenting ut av ham så lenge Dominate står på.\n\nMEN: skapningen må kaste Dominate på nytt HVER NATT, med et motsatt POW-slag. Klarer spillerne å styrke viljen hans — Hard Persuade eller Hard Psychoanalysis — får han en bonusterning mot den. Det er en ekte utvei, og den belønner en helt annen type spill enn å banke ham. Si det ikke rett ut, men la et Psychology-slag antyde at det er en mann inni der som kjemper imot.\n\nSkriftemålet den 17. er hans eneste time som seg selv. Spill det uten skrekkeffekter: en redd mann som forteller sannheten og blandet løgn til en prest, fordi han ikke lenger kan holde det inne. En time senere er han borte for godt."},{"id":"beat-honolulu-and-beyond","title":"Honolulu og videre","act":"Akt 2 — Mysteriet","description":"Torsdag 10. desember, tidlig.\n\nCoolidge ankommer Honolulu og blir umiddelbart holdt i karantene. Ingen går i land. Ingen lektere legger til. Et lag politifolk kommer om bord for å etterforske Petersons antatte selvmord, forvalterens forsvinning, og drapet på Wang Ma — hvis det i det hele tatt er meldt fra om det.\n\nDe avhører dr. Soong, Martin Aimesworthy og Virginia Ridley, gjennomsøker mellomdekket etter Wang Mas drapsmann, tar forklaringer om Suroda hvis noen har savnet ham, gjennomsøker lugaren hans, finner ingenting, og drar etter om lag to timer.\n\nETTERFORSKER WILLIAM RANTAS KONKLUSJONER (fredag den 11.):\n• Avskjedsbrevet er ekte. Peterson hoppet fra den lille balkongen i suiten sin. De tomme klærne er en tilfeldighet, og Ranta legger helst slike detaljer til side for å få saken lukket.\n• Peterson drakk for mye og led av «mørke tanker».\n• Dungass ble full og skylte over bord — ulykke.\n• Wang Mas drapsmann rømte i land i Honolulu.\n• Suroda rømte også i land, og kan ha noe med drapet på Wang Ma å gjøre. Ranta forsikrer alle om at han skal spore ham opp.\n\nHelter som forklarer at de har sett Peterson gå rundt siden han døde, blir raskt avfeid.\n\nETTER HONOLULU. Skipet drar videre den 11. Charles Astor, som ikke er overbevist, understøtter protestene sine med 1 000 dollar kontant for opplysninger som fører fram — en kraftig brekkstang hvis heltene trenger penger eller motivasjon.","done":false,"connects_to":["npc-charles-astor","npc-takishi-suroda"],"dialogue":[{"who":"Etterforsker William Ranta","line":"«Avskjedsbrevet er ekte. Håndskriften stemmer. Mannen hoppet, og klærne er en tilfeldighet.»","source":"forslag","note":"Han har vært om bord i to timer og skal hjem til middag."},{"who":"Etterforsker Ranta","line":"«De har sett ham SIDEN han døde. Ja vel. Og hvor mange hadde De drukket?»","source":"forslag","note":"Til helter som insisterer. Han er ikke ondsinnet — han er ferdig."},{"who":"Charles Astor","line":"«Tusen dollar. Kontant. Til den som gir meg noe jeg kan bruke.»","source":"bok","note":"Etter Honolulu. Han sier det høyt, i salongen, så alle hører det."},{"who":"Kaptein Nelson","line":"«Hva i helvete er det som foregår her!»","source":"bok","note":"Når karantenen holder skipet i havn og politiet kommer om bord."}],"roleplay":"Dette er scenen der spillerne mister tilliten til at systemet skal ordne opp, og det er en scene, ikke en kunngjøring. Spill Ranta ut.\n\nHan skal ikke være dum eller korrupt. Han skal være en kompetent mann med for lite tid, som tar de rimeligste konklusjonene i verden ut fra det han faktisk har: et ekte avskjedsbrev, en savnet forvalter med kjent drikkeproblem, og en gjeng passasjerer som påstår de har sett en død mann gå i korridoren.\n\nLa spillerne legge fram alt de har. La ham høre på. Og la ham så dra. Det er verre enn å bli avvist.\n\nAstors belønning på tusen dollar gjør noe med skipet: nå leter alle. Passasjerer begynner å angi hverandre, mannskapet blir mistenksomt, og heltene får konkurranse. Bruk det til å skape trøbbel i dagene etterpå.\n\nEtter dette er det ingen voksen igjen å hente hjelp fra. Si det aldri høyt. La dem merke det."},{"id":"beat-missing-people","title":"De som forsvinner","act":"Akt 3 — Mønsteret","description":"Skapningen må lade Pipes of Leng med fem ofre, og la blodet renne ned i orgelet. Hvem de er, spiller ingen rolle. Bates henter dem; de tas med til lasterom 7, drepes og tappes. Det finnes ingen vitner — men er heltene helt på bærtur, kan en søvndrukken passasjer melde at han har sett noe rart.\n\nDE FEM:\n1. Takishi Suroda, 10. des — tatt etter middagen, ut gjennom en koøye.\n2. Miles Hardaway, 12. des — lokket til Almacans lugar, slått ned bakfra, ut gjennom en koøye.\n3–4. Phyllis Barnes og en matros, 13. des — hun fulgte musikken til lastelukene og kom over Bates mens han slo ned en matros på runde. Matrosen går over bord; Barnes havner i en ballasttank i lasterom 4, og blir funnet om lag en uke senere, på lukta.\n5. 15. eller 16. des — ditt valg. En navnløs passasjer fungerer, men noen heltene kjenner fungerer langt bedre: dr. Soong, Virginia Ridley, pater Alvarez. En helt er et legitimt mål.\n\nHVORDAN HELTENE OPPDAGER DET:\n• De leter etter noen, og finner en tom lugar og ingen som har sett vedkommende på en stund.\n• Et gråtende barn forteller at musikktimen med frøken Barnes ble avlyst, og at læreren er sporløst borte.\n• En annen passasjer spør heltene om de har sett den og den i det siste.\n\nMANNSKAPETS RESPONS. Bringes det opp for de høyere offiserene, undersøker de saken og konkluderer med at vedkommende ganske sikkert er et annet sted om bord og dukker opp til middag. Det er opp til heltene.","done":false,"connects_to":["loc-hold-7","loc-hold-4","npc-bunny-bates"],"dialogue":[{"who":"En helt som deler lugar med Suroda","line":"Senga er urørt. Kofferten står åpen. Barberkosten er fortsatt våt.","source":"forslag","note":"Ikke en replikk — et bilde å beskrive. Suroda gikk ut etter middag og kom aldri tilbake."},{"who":"Førstestyrmann Schramm","line":"«Folk går i land i Honolulu og glemmer å si fra. Det skjer hver eneste tur.»","source":"forslag","note":"Den offisielle forklaringen på Suroda. Den holder helt til neste person forsvinner."},{"who":"Martin Aimesworthy","line":"«Det er tre nå, sir. Jeg har talt. Ingen andre teller.»","source":"forslag","note":"Sagt lavt, til en helt han stoler på. Dette er øyeblikket han velger side."},{"who":"Kaptein Nelson","line":"«Ingenting av dette forlater dette rommet. Er det forstått? Jeg har seks hundre og syttiåtte passasjerer om bord.»","source":"forslag","note":"Han er ikke i ledtog med noen. Han er en mann som vet hva panikk gjør med et skip midt i Stillehavet."}],"roleplay":"Forsvinningene er scenarioets klokke, og klokka går uansett hva spillerne gjør. Det er viktig at de merker det.\n\nIkke presenter dem som mysterier å løse. Presenter dem som tomrom: en urørt seng, en stol ingen setter seg i ved middagsbordet, et navn som ikke svarer når det ropes opp. Gi ETT bilde per forsvi
