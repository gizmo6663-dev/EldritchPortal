async function saveCharacters() {
  await store.set("characters", state.characters);
}

function slugify(text, fallback) {
  const s = String(text || "").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return s.slice(0, 60) || fallback || "scenario";
}

function ensureIds(data) {
  SECTIONS.forEach((sec) => {
    (data[sec] || []).forEach((item, i) => {
      if (!item.id) {
        item.id = sec + "-" + i + "-" +
          slugify(item.title || item.name || "", String(i));
      }
    });
  });
  return data;
}

function emptyProgress() {
  return { flags: {}, notes: "", itemNotes: {}, sessions: [] };
}

function applyProgress(data, prog) {
  SECTIONS.forEach((sec) => {
    const flag = FLAGS[sec];
    (data[sec] || []).forEach((item) => {
      if (flag) item[flag] = !!prog.flags[item.id];
      const note = prog.itemNotes[item.id];
      item.userNotes = note || "";
    });
  });
  return data;
}

function contentOnly(data) {
  const copy = {};
  Object.keys(data).forEach((k) => {
    if (k !== "notes" && k !== "sessions") copy[k] = data[k];
  });
  return copy;
}

function counts(data) {
  const out = {};
  ["clues", "timeline", "beats", "npcs", "handouts", "locations",
   "reference"].forEach((k) => { out[k] = (data[k] || []).length; });
  return out;
}

/* ------------------------- bibliotek ---------------------------- */

async function loadLibrary() {
  const lib = await store.get("library");
  state.library = lib && typeof lib === "object"
    ? Object.assign({ items: [], active: null, seeded: {} }, lib)
    : { items: [], active: null, seeded: {} };
  if (!Array.isArray(state.library.items)) state.library.items = [];
  // seeded er {id: versjon}. Eldre lagringer har en liste; den
  // konverteres i seedBundled(), så her skal den bare ikke nullstilles.
  if (!state.library.seeded || typeof state.library.seeded !== "object") {
    state.library.seeded = {};
  }
}

async function saveLibrary() { await store.set("library", state.library); }

async function addScenario(data, makeActive) {
  ensureIds(data);
  const id = data.id ? slugify(data.id) : slugify(data.title);
  await store.set("content/" + id, contentOnly(data));

  // Notater og sesjoner i importfila er startinnhold. De skal aldri
  // tråkke over det brukeren selv har skrevet.
  const prog = (await store.get("progress/" + id)) || emptyProgress();
  if (data.notes && !prog.notes) prog.notes = data.notes;
  if (data.sessions && data.sessions.length && !prog.sessions.length) {
    prog.sessions = data.sessions;
  }
  await store.set("progress/" + id, prog);

  state.library.items = state.library.items.filter((it) => it.id !== id);
  state.library.items.push({
    id: id,
    title: data.title || "(uten tittel)",
    system: data.system || "",
    imported: new Date().toISOString().slice(0, 16).replace("T", " "),
    counts: counts(data),
  });
  state.library.items.sort((a, b) => a.title.localeCompare(b.title, "nb"));
  if (makeActive || !state.library.active) state.library.active = id;
  await saveLibrary();
  return id;
}

async function deleteScenario(id) {
  await store.del("content/" + id);
  await store.del("progress/" + id);
  state.library.items = state.library.items.filter((it) => it.id !== id);
  if (state.library.active === id) {
    state.library.active = state.library.items.length
      ? state.library.items[0].id : null;
  }
  await saveLibrary();
  await loadActive();
}

async function loadActive() {
  const id = state.library.active;
  state.scenarioId = id;
  if (!id) { state.scenario = null; state.progress = null; return; }
  const content = await store.get("content/" + id);
  if (!content) { state.scenario = null; state.progress = null; return; }
  const prog = Object.assign(emptyProgress(),
                             (await store.get("progress/" + id)) || {});
  state.progress = prog;
  state.scenario = applyProgress(ensureIds(content), prog);
  state.scenario.notes = prog.notes;
  state.scenario.sessions = prog.sessions;
}

async function saveProgress() {
  if (!state.scenarioId) return;
  await store.set("progress/" + state.scenarioId, state.progress);
}

async function seedBundled() {
  const node = document.getElementById("bundled-scenarios");
  let bundled = [];
  try { bundled = JSON.parse(node.textContent) || []; } catch (e) { return; }

  // Eldre lagringer har «seeded» som en liste med id-er. Regn dem som
  // versjon 1, slik at et oppdatert innebygd scenario byttes inn.
  let seeded = state.library.seeded;
  if (Array.isArray(seeded)) {
    const migrated = {};
    seeded.forEach((id) => { migrated[id] = 1; });
    seeded = migrated;
  } else if (!seeded || typeof seeded !== "object") {
    seeded = {};
  }
  state.library.seeded = seeded;

  let changed = false;
  for (const data of bundled) {
    const key = data.id || slugify(data.title);
    const version = data.version || 1;
    if (seeded[key] === version) continue;
    seeded[key] = version;
    changed = true;
    // Innholdet byttes ut; fremdriften ligger i en egen nøkkel og
    // røres ikke av addScenario().
    await addScenario(JSON.parse(JSON.stringify(data)),
                      !state.library.active);
  }
  if (changed) await saveLibrary();
}

/* ==================================================================
   HANDLINGER
   ================================================================== */

function findItem(id) {
  if (!state.scenario) return null;
  for (const sec of SECTIONS) {
    const hit = (state.scenario[sec] || []).find((x) => x.id === id);
    if (hit) return { section: sec, item: hit };
  }
  return null;
}

async function toggleFlag(id) {
  const hit = findItem(id);
  if (!hit) return;
  const flag = FLAGS[hit.section];
  if (!flag) return;
  hit.item[flag] = !hit.item[flag];
  if (hit.item[flag]) state.progress.flags[id] = true;
  else delete state.progress.flags[id];
  await saveProgress();
  render();
}

async function setItemNote(id, text) {
  const hit = findItem(id);
  if (!hit) return;
  hit.item.userNotes = text;
  if (text.trim()) state.progress.itemNotes[id] = text;
  else delete state.progress.itemNotes[id];
  await saveProgress();
}

async function resetProgress() {
  state.progress.flags = {};
  await saveProgress();
  await loadActive();
  render();
  toast("Fremdrift nullstilt");
}

/* ==================================================================
   SMÅVERKTØY
   ================================================================== */

let toastTimer = null;
function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach((k) => {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else if (k === "html") node.innerHTML = props[k];
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), props[k]);
      else if (props[k] !== null && props[k] !== undefined && props[k] !== false) {
        node.setAttribute(k, props[k]);
      }
    });
  }
  (children || []).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function matches(item, query) {
  if (!query) return true;
  const bits = [item.title, item.name, item.description, item.where,
                item.day, item.when, item.act, item.deck, item.role,
                item.category, item.roll, item.userNotes, item.roleplay];
  // Replikkene skal også kunne søkes opp — husker du bare en setning
  // noen sa, skal den finne scenen.
  (item.dialogue || []).forEach((d) => {
    bits.push(d.who, d.line, d.note);
  });
  const hay = bits.filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(query.toLowerCase()) !== -1;
}

function debounce(fn, ms) {
  let t = null;
  return function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(null, args), ms);
  };
}

/* ---------------------------- terning --------------------------- */

// Suksessnivåene i Call of Cthulhu 7e, rangert. Rangen brukes til å
// avgjøre motsatte slag (angrep mot unnvikelse eller mot-angrep).
const LEVEL_RANK = { "FUMLE": -1, "Bom": 0, "Suksess": 1, "Hard": 2,
                     "Ekstrem": 3, "KRITISK": 4 };

// Fumlegrensa: 100 fumler alltid, 96-99 fumler når ferdigheten er
// under 50.
function fumbleFrom(target) { return target < 50 ? 96 : 100; }

// Regn om et terningkast til suksessnivå. Selve kastet gjør vi ved
// bordet — denne tar imot tallet og sier hva det ble.
function gradeRoll(roll, target) {
  const t = Math.max(0, parseInt(target, 10) || 0);
  let label, cls;
  if (roll === 1) { label = "KRITISK"; cls = "res-crit"; }
  else if (t && roll <= Math.floor(t / 5)) { label = "Ekstrem"; cls = "res-extreme"; }
  else if (t && roll <= Math.floor(t / 2)) { label = "Hard"; cls = "res-hard"; }
  else if (t && roll <= t) { label = "Suksess"; cls = "res-reg"; }
  else if (roll >= fumbleFrom(t)) { label = "FUMLE"; cls = "res-fumble"; }
  else { label = "Bom"; cls = "res-fail"; }
  return { roll: roll, target: t, label: label, cls: cls,
           rank: LEVEL_RANK[label] };
}

// Grensene, slik de kan vises ved siden av feltet man skriver kastet i.
function thresholds(target) {
  const t = Math.max(0, parseInt(target, 10) || 0);
  return { extreme: Math.floor(t / 5), hard: Math.floor(t / 2),
           regular: t, fumble: fumbleFrom(t) };
}

function rollSkill(target) {
  return gradeRoll(1 + Math.floor(Math.random() * 100), target);
}

function setupDice() {
  const input = document.getElementById("dice-target");
  const out = document.getElementById("dice-out");
  function go() {
    const target = Math.max(1, Math.min(99, parseInt(input.value, 10) || 50));
    const r = rollSkill(target);
    out.className = "dice-out " + r.cls;
    out.innerHTML = "";
    out.appendChild(el("b", { text: String(r.roll) }));
    out.appendChild(document.createTextNode(" · " + r.label));
  }
  document.getElementById("dice-roll").addEventListener("click", go);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

/* ==================================================================
   TERNINGER OG KAMPREGLER  (Call of Cthulhu 7e)
   ================================================================== */

// «2D6+4», «1D10», «4D6/2D6/1D6» (haglegevær på tre avstander).
const DICE_TERM = /([+-]?)\s*(\d*)\s*[dD]\s*(\d+)|([+-]?)\s*(\d+)(?![dD\d])/g;

function parseDiceExpr(expr) {
  const s = String(expr || "").split("/")[0].trim();   // nærmeste rekkevidde
  const terms = [];
  let m;
  DICE_TERM.lastIndex = 0;
  while ((m = DICE_TERM.exec(s)) !== null) {
    if (m[3] !== undefined) {
      terms.push({ n: parseInt(m[2] || "1", 10), sides: parseInt(m[3], 10),
                   sign: m[1] === "-" ? -1 : 1 });
    } else if (m[5] !== undefined) {
      terms.push({ flat: parseInt(m[5], 10), sign: m[4] === "-" ? -1 : 1 });
    }
  }
  return terms;
}

function rollDiceExpr(expr) {
  const terms = parseDiceExpr(expr);
  let total = 0;
  const parts = [];
  terms.forEach((t) => {
    if (t.flat !== undefined) {
      total += t.sign * t.flat;
      parts.push((t.sign < 0 ? "-" : "+") + t.flat);
      return;
    }
    const rolls = [];
    for (let i = 0; i < t.n; i += 1) {
      rolls.push(1 + Math.floor(Math.random() * t.sides));
    }
    const sum = rolls.reduce((a, b) => a + b, 0);
    total += t.sign * sum;
    parts.push(t.n + "D" + t.sides + "[" + rolls.join(",") + "]");
  });
  // «+20» alene i en logglinje ser ut som en skrivefeil.
  return { total: total, detail: parts.join(" ").replace(/^\+\s*/, "") };
}

function maxDiceExpr(expr) {
  return parseDiceExpr(expr).reduce((sum, t) => sum +
    t.sign * (t.flat !== undefined ? t.flat : t.n * t.sides), 0);
}

// Damage bonus står som «+1D4», «+2D6», «0», «-1», «N/A».
function rollDamageBonus(db, mode) {
  const s = String(db || "").trim();
  if (!s || /^(0|n\/?a|ingen)$/i.test(s)) return { total: 0, detail: "" };
  const r = rollDiceExpr(s);
  if (mode === "half") {
    // Enkelte våpen bruker halv damage bonus, rundet ned.
    const half = r.total < 0 ? Math.ceil(r.total / 2) : Math.floor(r.total / 2);
    return { total: half, detail: r.detail + " halvert" };
  }
  return r;
}

/* Skaden fra ett treff. Nivået avgjør om et spiddevåpen spidder:
   maks skade fra våpenterningene pluss et nytt kast. Damage bonus
   kastes normalt og legges til der våpenet bruker den.            */
function rollAttackDamage(combatant, attack, label) {
  const crit = label === "KRITISK" || label === "Ekstrem";
  let total = 0;
  const bits = [];
  let impaled = false;

  if (attack.can_impale && crit) {
    const max = maxDiceExpr(attack.damage);
    const extra = rollDiceExpr(attack.damage);
    total = max + extra.total;
    bits.push("maks " + max, extra.detail);
    impaled = true;
  } else {
    const d = rollDiceExpr(attack.damage);
    total = d.total;
    bits.push(d.detail);
  }

  if (attack.uses_db && combatant && combatant.db) {
    const db = rollDamageBonus(combatant.db,
                               attack.uses_db === "half" ? "half" : "full");
    if (db.total) { total += db.total; bits.push("db " + db.detail); }
  }

  return { total: Math.max(0, total), impaled: impaled,
           detail: bits.filter(Boolean).join(" + ") };
}

/* ------------------- motsatte slag i nærkamp ---------------------

   Call of Cthulhu 7e: et nærkampangrep er et motsatt slag. Den som
   blir angrepet velger å unnvike (Dodge) eller slå tilbake (Fighting).
   Høyeste suksessnivå vinner; står det likt, vinner den med høyest
   ferdighetsverdi. Er også den lik, skjer ingenting.

   Skytevåpen slås ikke motsatt. Målet kan dykke i dekning: det er et
   Unnvikelse-slag, og LYKKES DET, gir det angriperen én STRAFFETERNING
   — skuddet blir ikke borte. Den som dykker mister neste angrep
   uansett om slaget gikk eller ikke.                              */

/* En straffeterning er en EKSTRA TIERTERNING: man beholder enerterningen
   og bruker det verste av de to tier-resultatene. 00+0 er 100, og 100 er
   det verste man kan få. Spilleren slår ved bordet og skriver inn den
   ekstra tierterningen her.                                        */
function withPenaltyTens(roll, tens) {
  const r = parseInt(roll, 10);
  const x = parseInt(tens, 10);
  if (!(r >= 1 && r <= 100) || !(x >= 0 && x <= 9)) return r;
  const units = r % 10;                 // 100 gir 0, som er riktig
  const alt = (x * 10 + units) || 100;  // 00 + 0 = 100
  return Math.max(r, alt);
}

function opposedOutcome(att, def) {
  // att og def er resultater fra gradeRoll. def kan være null når den
  // angrepne ikke gjør noe.
  if (!att || att.rank <= 0) {
    return { winner: "attacker-failed", why: att && att.rank < 0
      ? "Angriperen fumler." : "Angriperen bommer." };
  }
  if (!def) return { winner: "attacker", why: "Ingen forsvarshandling." };
  if (att.rank > def.rank) {
    return { winner: "attacker", why: "Angriperen har høyest nivå." };
  }
  if (def.rank > att.rank) {
    return { winner: "defender", why: "Forsvareren har høyest nivå." };
  }
  // Likt nivå: høyest ferdighetsverdi vinner.
  if (att.target > def.target) {
    return { winner: "attacker", why: "Likt nivå — høyest ferdighet vinner." };
  }
  if (def.target > att.target) {
    return { winner: "defender", why: "Likt nivå — høyest ferdighet vinner." };
  }
  return { winner: "draw", why: "Likt nivå og lik ferdighet — uavgjort." };
}

/* Rustning trekkes fra skaden. Feltet er ofte en hel setning fra
   Malleus Monstrorum, så vi plukker ut første tall.               */
function armorValue(c) {
  const m = String((c && c.armor) || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}

/* Følgene av en skade, etter Call of Cthulhu og Pulp Cthulhu.

   Pulp-helter bruker ikke major wound-regelen: de dør av ett slag som
   er lik eller større enn maks HP, ligger for døden om et slag på
   halve maks HP eller mer også tar dem til null, og besvimer ellers
   på null. Et slag på halve maks HP eller mer krever CON-slag for å
   holde seg våken.

   Alle andre bruker vanlige regler: halve maks HP i ett slag er et
   major wound (CON-slag eller bevisstløs), null HP med major wound er
   døende.                                                          */
function woundOutcome(target, net) {
  const half = Math.ceil(target.hpMax / 2);
  const left = Math.max(0, target.hp - net);
  const out = { hpAfter: left, conditions: [], notes: [], major: false };

  if (net >= target.hpMax) {
    out.conditions.push("Død");
    out.notes.push("Ett slag på " + net + " er lik eller over maks HP (" +
                   target.hpMax + ") — død på stedet.");
    out.hpAfter = 0;
    return out;
  }
  if (net >= half) {
    if (target.pulp) {
      if (left === 0) {
        out.conditions.push("Døende");
        out.notes.push("Halve maks HP eller mer, og nede på null — " +
                       "døende. CON-slag hver runde, First Aid " +
                       "stabiliserer.");
        return out;
      }
      out.notes.push("Over halve maks HP i ett slag — CON-slag for å " +
                     "holde seg våken. (Pulp-helter tar ikke major wound.)");
    } else {
      out.major = true;
      out.conditions.push("Major wound");
      out.notes.push("Major wound: CON-slag eller bevisstløs, og " +
                     "figuren går i bakken.");
      if (left === 0) {
        out.conditions.push("Døende");
        out.notes.push("Null HP med major wound — døende.");
        return out;
      }
    }
  }
  if (left === 0) {
    out.conditions.push("Bevisstløs");
    out.notes.push("Null HP — bevisstløs.");
  }
  return out;
}

let lastFocus = null;

// Modalene ligger i en stabel. Åpner du et talent fra et karakterkort,
// skal «Tilbake» føre deg til kortet igjen — ikke helt ut til lista.
// Det samme gjelder kryssreferanser mellom spor, scener og NPCer.
let modalStack = [];

function renderModal() {
  const scrim = document.getElementById("scrim");
  const top = modalStack[modalStack.length - 1];
  if (!top) {
    scrim.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    return;
  }

  // Tittel og undertittel kan være funksjoner. Da hentes de på nytt
  // hver gang nivået vises, slik at et kort man kommer tilbake til
  // viser gjeldende verdier og ikke et øyeblikksbilde.
  const head = document.getElementById("modal-title");
  head.textContent = (typeof top.title === "function")
    ? top.title() : top.title;
  const sub = (typeof top.subtitle === "function")
    ? top.subtitle() : top.subtitle;
  head.appendChild(el("span", { class: "modal-sub", id: "modal-sub",
                                text: sub || "" }));

  const body = document.getElementById("modal-body");
  body.innerHTML = "";
  top.build(body);

  const foot = document.getElementById("modal-foot");
  foot.innerHTML = "";
  top.foot.forEach((b) => foot.appendChild(b));
  foot.hidden = !top.foot.length;

  // Knappen sier hva den faktisk gjør: ett steg tilbake, eller lukk.
  const closeBtn = document.getElementById("modal-close");
  closeBtn.textContent = modalStack.length > 1 ? "Tilbake" : "Lukk";

  scrim.hidden = false;
  // Gjenopprett hvor langt ned man hadde bladd da man forlot nivået.
  body.scrollTop = top.scrollTop || 0;
  closeBtn.focus();
}

function openModal(title, subtitle, buildBody, footButtons) {
  if (!modalStack.length) lastFocus = document.activeElement;
  const cur = modalStack[modalStack.length - 1];
  if (cur) cur.scrollTop = document.getElementById("modal-body").scrollTop;
  modalStack.push({
    title: title, subtitle: subtitle,
    build: buildBody, foot: footButtons || [], scrollTop: 0,
  });
  renderModal();
}

// Ett steg tilbake i stabelen.
function closeModal() {
  modalStack.pop();
  renderModal();
}

// Lukk alt — brukes når man forlater modalene helt.
function closeAllModals() {
  modalStack = [];
  renderModal();
}

function noteEditor(item) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Dine notater" }));
  const status = el("div", { class: "savestate" });
  const area = el("textarea", {
    class: "field", rows: "4", id: "note-" + item.id,
    placeholder: "Hva skjedde da spillerne kom hit?",
  });
  area.value = item.userNotes || "";
  const save = debounce(async () => {
    await setItemNote(item.id, area.value);
    status.textContent = "Lagret " +
      new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
    status.className = "savestate saved";
  }, 700);
  area.addEventListener("input", () => {
    status.textContent = "Lagrer…";
    status.className = "savestate";
    save();
  });
  wrap.appendChild(status);
  wrap.appendChild(area);
  return wrap;
}

function crossRefs(item) {
  const refs = item.connects_to || [];
  if (!refs.length) return null;
  const labels = { clues: "Spor", timeline: "Tidslinje", beats: "Scene",
                   npcs: "NPC", handouts: "Handout", locations: "Sted",
                   reference: "Oppslag" };
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Se også" }));
  const stack = el("div", { class: "stack" });
  refs.forEach((ref) => {
    const hit = findItem(ref);
    if (!hit) return;
    stack.appendChild(el("button", {
      class: "entry", type: "button",
      onclick: () => openItem(hit.item, hit.section),
    }, [
      el("span", { class: "entry-open", text: labels[hit.section] || hit.section }),
      el("span", { class: "entry-body" }, [
        el("span", { class: "entry-title",
                     text: hit.item.title || hit.item.name || ref }),
      ]),
      el("span", { class: "entry-open", text: "ÅPNE" }),
    ]));
  });
  if (!stack.children.length) return null;
  wrap.appendChild(stack);
  return wrap;
}

function openItem(item, section) {
  if (section === "npcs") return openNpc(item);

  const subtitle = ["act", "day", "when", "where", "deck"]
    .map((k) => item[k]).filter(Boolean).join(" · ");

  openModal(item.title || item.name || "?", subtitle, (body) => {
    if (item.roll) {
      body.appendChild(el("div", { class: "callout" }, [
        el("p", { class: "eyebrow", text: "Slag" }),
        el("p", { text: item.roll }),
      ]));
    }
    if (item.description) {
      body.appendChild(el("p", { class: "prose", text: item.description }));
    }
    // Det som faktisk skal leses høyt eller vises fram, i egen ramme.
    if (item.read_aloud) {
      body.appendChild(el("p", { class: "eyebrow", text: "Les høyt" }));
      body.appendChild(el("div", { class: "readaloud", text: item.read_aloud }));
    }
    if (item.aside) {
      body.appendChild(el("p", { class: "prose tight", text: item.aside }));
    }
    if (item.body) body.appendChild(el("p", { class: "prose", text: item.body }));

    // Replikker fra boka, og forslag der boka ikke gir noe.
    if (item.dialogue && item.dialogue.length) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Replikker" }));
      const box = el("div", { class: "lines" });
      item.dialogue.forEach((d) => {
        const row = el("div", { class: "line" + (d.source === "forslag"
                                                 ? " suggested" : "") });
        row.appendChild(el("p", { class: "line-who" }, [
          el("span", { text: d.who || "" }),
          el("span", { class: "line-src",
                       text: d.source === "forslag" ? "forslag" : "fra boka" }),
        ]));
        row.appendChild(el("p", { class: "line-say", text: d.line || "" }));
        if (d.note) {
          row.appendChild(el("p", { class: "line-note", text: d.note }));
        }
        box.appendChild(row);
      });
      body.appendChild(box);
    }

    if (item.roleplay) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Slik spilles scenen" }));
      body.appendChild(el("p", { class: "prose", text: item.roleplay }));
    }

    const refs = crossRefs(item);
    if (refs) body.appendChild(refs);
    if (item.id) body.appendChild(noteEditor(item));
  }, modalActions(item, section));
}

function modalActions(item, section) {
  const buttons = [];
  const flag = FLAGS[section];
  if (flag && item.id) {
    const on = !!item[flag];
    buttons.push(el("button", {
      class: on ? "btn" : "btn primary", type: "button",
      text: on ? "Fjern kryss" : (section === "handouts" ? "Marker utdelt" : "Kryss av"),
      onclick: async () => { await toggleFlag(item.id); closeModal(); },
    }));
  }
  if (item.id && state.progress) {
    buttons.push(el("button", {
      class: "btn small", type: "button", text: "Til sesjonslogg",
      onclick: () => { copyToSession(item); closeModal(); },
    }));
  }
  return buttons;
}

function openNpc(npc) {
  openModal(npc.name || "?", [npc.category, npc.role].filter(Boolean).join(" · "),
    (body) => {
      if (npc.description) {
        body.appendChild(el("p", { class: "prose", text: npc.description }));
      }
      if (npc.traits) {
        body.appendChild(el("div", { class: "section-label", text: "Trekk" }));
        body.appendChild(el("p", { text: npc.traits }));
      }
      if (npc.quotes && npc.quotes.length) {
        body.appendChild(el("div", { class: "section-label", text: "Replikker" }));
        npc.quotes.forEach((q) => body.appendChild(el("p", { class: "quote", text: q })));
      }
      if (npc.forms) {
        body.appendChild(el("div", { class: "section-label", text: "Skikkelser" }));
        body.appendChild(el("p", { class: "prose", text: npc.forms }));
      }
      if (npc.stats && Object.keys(npc.stats).length) {
        body.appendChild(el("div", { class: "section-label", text: "Karakteristikker" }));
        const order = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW", "EDU",
                       "SAN", "HP", "MP", "Luck", "DB", "Build", "Move", "Armor"];
        const keys = order.filter((k) => k in npc.stats)
          .concat(Object.keys(npc.stats).filter((k) => order.indexOf(k) === -1));
        const grid = el("dl", { class: "statgrid" });
        keys.forEach((k) => {
          grid.appendChild(el("div", { class: "stat" }, [
            el("dt", { text: k }),
            el("dd", { text: String(npc.stats[k]) }),
          ]));
        });
        body.appendChild(grid);
      }
      if (npc.pulp_talents && npc.pulp_talents.length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Pulp-talenter" }));
        const chips = talentChips(npc.pulp_talents.join(", "));
        if (chips) body.appendChild(chips);
      }

      [["combat", "Kamp"]].forEach((pair) => {
        const list = npc[pair[0]];
        if (!list || !list.length) return;
        body.appendChild(el("div", { class: "section-label", text: pair[1] }));
        const ul = el("ul", { class: "bullets" });
        list.forEach((line) => ul.appendChild(
          el("li", { text: annotateSkillText(line) })));
        body.appendChild(ul);
      });
      [["skills", "Ferdigheter"], ["armor", "Rustning"], ["spells", "Formler"],
       ["special", "Spesielt"], ["sanity_loss", "Sanity-tap"],
       ["possessions", "Våpen og eiendeler"], ["notes", "Notater"]]
        .forEach((pair) => {
          const val = npc[pair[0]];
          if (!val || val === "-") return;
          body.appendChild(el("div", { class: "section-label", text: pair[1] }));
          // Ferdighetslinjene er fritekst fra scenarioet. Halv og
          // femtedel settes inn etter hver prosent.
          const show = pair[0] === "skills" ? annotateSkillText(val) : val;
          body.appendChild(el("p", { class: "prose", text: show }));
          if (pair[0] === "skills" && show !== val) {
            body.appendChild(stepsLegend());
          }
        });
      if (npc.stats_note) {
        body.appendChild(el("p", { class: "caveat", text: npc.stats_note }));
      }
      const refs = crossRefs(npc);
      if (refs) body.appendChild(refs);
      if (npc.id) body.appendChild(noteEditor(npc));
    }, modalActions(npc, "npcs"));
}

/* ------------------ halv og femtedel av en verdi ----------------

   Call of Cthulhu: et Hard-slag krever halve ferdigheten, et Extreme
   en femtedel, begge rundet ned. Karakterarket trykker tallene ved
   siden av verdien, og de bør stå overalt i appen også — ellers må man
   regne i hodet hver gang Keeperen ber om et hardt slag.

   Rundingen er den samme som regelmotoren bruker når den bedømmer et
   kast, så det som står på kortet stemmer alltid med utfallet.     */
function skillSteps(value) {
  const m = String(value === undefined || value === null ? "" : value)
    .match(/\d+/);
  if (!m) return null;
  const n = parseInt(m[0], 10);
  if (!n) return null;
  return { value: n, hard: Math.floor(n / 2), extreme: Math.floor(n / 5) };
}

// «32/13» — det som skal stå med liten skrift ved siden av verdien.
function stepsLabel(value) {
  const s = skillSteps(value);
  return s ? s.hard + "/" + s.extreme : "";
}

// En celle med verdien, og halv/femtedel i dempet skrift etter.
function skillValueCell(value, suffix) {
  const txt = String(value);
  const shown = suffix && !/%$/.test(txt) ? txt + suffix : txt;
  const label = stepsLabel(value);
  const cell = el("td", null, [el("span", { text: shown })]);
  if (label) {
    cell.appendChild(el("span", { class: "steps", text: label }));
  }
  return cell;
}

/* Fritekst med prosenter i seg — «Hide 30%, Track 35%» — får tallene
   satt inn etter hver prosent. Står de der fra før, slik statblokkene
   fra boka ofte har dem, lar vi dem være.                          */
function annotateSkillText(text) {
  return String(text || "").replace(
    /(\d{1,3})\s*%(\s*\(\s*\d+\s*\/\s*\d+\s*\))?/g,
    function (whole, num, already) {
      if (already) return whole;
      const label = stepsLabel(num);
      return label ? num + "% (" + label + ")" : whole;
    });
}

// Én linje som forklarer hva tallparet betyr.
function stepsLegend() {
  return el("p", { class: "steps-legend",
    text: "Tallene etter verdien er hard (halv) og extreme (femtedel)." });
}

// Det slås mot karakteristikkene også — CON for å holde seg våken,
// STR i et grep, POW mot en formel. HP, MP, DB og Build slås det ikke
// mot, så der ville tallparet bare vært støy.
const ROLLED_STATS = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW",
                      "EDU", "SAN", "Luck"];

function statGrid(stats) {
  const grid = el("dl", { class: "statgrid" });
  const order = CHAR_STATS.concat(
    Object.keys(stats).filter((k) => CHAR_STATS.indexOf(k) === -1));
  order.forEach((k) => {
    if (!stats[k]) return;
    const box = el("div", { class: "stat" }, [
      el("dt", { text: k }), el("dd", { text: String(stats[k]) }),
    ]);
    if (ROLLED_STATS.indexOf(k) !== -1) {
      const label = stepsLabel(stats[k]);
      if (label) {
        box.appendChild(el("span", { class: "steps", text: label }));
      }
    }
    grid.appendChild(box);
  });
  return grid.children.length ? grid : null;
}

function attackTable(attacks) {
  if (!attacks || !attacks.length) return null;
  const wrap = el("div", { class: "tablewrap" });
  const table = el("table", { class: "skills" });
  attacks.forEach((a) => {
    const cell = el("td", null, [
      el("span", { text: [a.skill, a.damage].filter(Boolean).join("  ") }),
    ]);
    const label = stepsLabel(a.skill);
    if (label) cell.appendChild(el("span", { class: "steps", text: label }));
    table.appendChild(el("tr", null, [
      el("td", { text: a.name || "—" }), cell,
    ]));
  });
  wrap.appendChild(table);
  return wrap;
}

function openCharacter(pc) {
  // Slå opp rollen på nytt hver gang kortet tegnes. Redigerer man den
  // i et nivå over, skal «Tilbake» vise de nye verdiene — ikke den
  // kopien kortet ble åpnet med.
  const id = pc.id;
  const live = () => normalizeChar(
    state.characters.find((x) => x.id === id) || pc);

  openModal(
    () => live().name || "?",
    () => {
      const c = live();
      return [KIND_LABEL[c.kind], c.occ, c.archetype || c.subtitle,
              c.player ? "spilles av " + c.player : null]
        .filter(Boolean).join(" · ");
    },
    (body) => {
      const c = live();
      const grid = statGrid(c.stats);
      if (grid) body.appendChild(grid);

      const atk = attackTable(c.attacks);
      if (atk) {
        body.appendChild(el("div", { class: "section-label", text: "Angrep" }));
        body.appendChild(atk);
      }

      if (c.skills && Object.keys(c.skills).length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Ferdigheter" }));
        const wrap = el("div", { class: "tablewrap" });
        const table = el("table", { class: "skills" });
        Object.keys(c.skills).sort().forEach((k) => {
          // Navnet er klikkbart når ferdigheten finnes i regelboka.
          const known = lookupSkill(k);
          const cell = el("td", null, [
            known
              ? el("button", { class: "linkish skilllink", type: "button",
                               title: "Hva ferdigheten dekker",
                               text: k, onclick: () => openSkill(k, known) })
              : el("span", { text: k }),
          ]);
          table.appendChild(el("tr", null, [cell,
                                            skillValueCell(c.skills[k], "%")]));
        });
        wrap.appendChild(table);
        body.appendChild(wrap);
        body.appendChild(el("p", { class: "steps-legend",
          text: "Tallene etter verdien er hard (halv) og extreme " +
                "(femtedel). Trykk på navnet for å se hva ferdigheten " +
                "dekker." }));
      }

      if (c.talents || c.insane_talents) {
        [["talents", "Talenter"],
         ["insane_talents", "Insane talents"]].forEach((pair) => {
          if (!c[pair[0]]) return;
          body.appendChild(el("div", { class: "section-label",
                                       text: pair[1] }));
          const chips = talentChips(c[pair[0]]);
          if (chips) body.appendChild(chips);
        });
        body.appendChild(el("p", { class: "caveat",
          text: "Trykk på et talent for å se hva det gjør." }));
      }

      [["weapons", "Våpen og utstyr"],
       ["armor", "Rustning"], ["spells", "Formler"],
       ["sanity_loss", "Sanity-tap"], ["backstory", "Bakgrunn"],
       ["notes", "Notater"]].forEach((pair) => {
        if (!c[pair[0]]) return;
        body.appendChild(el("div", { class: "section-label", text: pair[1] }));
        body.appendChild(el("p", { class: "prose", text: c[pair[0]] }));
      });

      // Skapninger med egne mekanismer får dem vist her også, ikke
      // bare i fiendebanken.
      const sp = specialFor(c);
      if (sp) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Spesialregler" }));
        specialRulesBody(sp, body);
      }
    },
    [
      el("button", { class: "btn primary", type: "button", text: "Til kamp",
                     onclick: () => { closeModal(); addToCombat(live()); } }),
      // Ikke lukk kortet først — da legger editoren seg oppå, og
      // «Tilbake» etter lagring viser kortet med de nye verdiene.
      el("button", { class: "btn", type: "button", text: "Rediger",
                     onclick: () => editCharacter(live()) }),
    ]);
}

function itemAsLine(item) {
  const title = item.title || item.name || "(uten tittel)";
  const sub = item.where || item.when || item.deck || "";
  let line = "- " + title;
  if (sub) line += " (" + sub + ")";
  return line;
}

async function copyToSession(item) {
  const sessions = state.progress.sessions;
  if (!sessions.length) {
    sessions.push({ title: "Sesjon 1", date: new Date().toISOString().slice(0, 10),
                    summary: "" });
  }
  const s = sessions[sessions.length - 1];
  s.summary = (s.summary ? s.summary + "\n" : "") + itemAsLine(item);
  await saveProgress();
  toast("Lagt i «" + (s.title || "sesjonen") + "»");
}

const VIEWS = [
  { key: "overview",   label: "Oversikt",   group: "Spill" },
  { key: "timeline",   label: "Tidslinje",  group: "Spill" },
  { key: "beats",      label: "Scener",     group: "Spill" },
  { key: "clues",      label: "Spor",       group: "Spill" },
  { key: "npcs",       label: "NPCer",      group: "Spill" },
  { key: "locations",  label: "Steder",     group: "Oppslag" },
  { key: "handouts",   label: "Handouts",   group: "Oppslag" },
  { key: "reference",  label: "Regler",     group: "Oppslag" },
  { key: "combat",     label: "Kamp",       group: "Bordet" },
  { key: "tactics",    label: "Taktikk",    group: "Bordet" },
  { key: "characters", label: "Roller",     group: "Bordet" },
  { key: "bestiary",   label: "Fiendebank", group: "Bordet" },
  { key: "notes",      label: "Notater",    group: "Mitt" },
  { key: "sessions",   label: "Sesjoner",   group: "Mitt" },
  { key: "library",    label: "Bibliotek",  group: "Mitt" },
];

function navBadge(key) {
  // Disse er uavhengige av hvilket scenario som er aktivt.
  if (key === "characters") return state.characters.length || "";
  if (key === "bestiary") {
    return (state.bestiary && state.bestiary.creatures.length) || "";
  }
  if (key === "tactics") {
    const t = (state.scenario && state.scenario.tactics) || [];
    if (!t.length) return "";
    return t.filter((x) => x.used).length + "/" + t.length;
  }
  if (key === "combat") {
    const cb = state.combat;
    if (!cb || !cb.combatants.length) return "";
    return cb.active ? "R" + cb.round : String(cb.combatants.length);
  }

  const d = state.scenario;
  if (!d) return "";
  if (FLAGS[key] && d[key]) {
    const items = d[key];
    if (!items.length) return "";
    return items.filter((x) => x[FLAGS[key]]).length + "/" + items.length;
  }
  if (key === "npcs" || key === "reference") {
    return (d[key] || []).length || "";
  }
  if (key === "sessions") return state.progress.sessions.length || "";
  if (key === "library") return state.library.items.length || "";
  return "";
}

function renderRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  let group = null;
  VIEWS.forEach((v) => {
    if (v.group !== group) {
      group = v.group;
      rail.appendChild(el("div", { class: "rail-group", text: group }));
    }
    const badge = navBadge(v.key);
    rail.appendChild(el("button", {
      class: "navlink", type: "button",
      "aria-current": state.view === v.key ? "page" : null,
      onclick: () => setView(v.key),
    }, [
      el("span", { text: v.label }),
      badge ? el("span", { class: "count", text: String(badge) }) : null,
    ]));
  });
}

function setView(key) {
  state.view = key;
  state.query = "";
  state.hideDone = false;
  render();
  // Til toppen av dokumentet, ikke til toppen av innholdet — ellers
  // ruller terningkasteren og synk-merket i topplinja ut av syne.
  window.scrollTo({ top: 0, behavior: "auto" });
}

function meter(label, done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return el("div", { class: "meter" }, [
    el("div", { class: "meter-head" }, [
      el("b", { text: label }),
      el("span", { text: done + " / " + total }),
    ]),
    el("div", { class: "meter-track" }, [
      el("div", {
        class: "meter-fill" + (total && done >= total ? " full" : ""),
        style: "width:" + pct + "%",
      }),
    ]),
  ]);
}

function searchBar(placeholder) {
  const input = el("input", {
    class: "field", type: "search", id: "search-" + state.view,
    placeholder: placeholder, value: state.query,
  });
  const run = debounce(() => {
    state.query = input.value;
    const pos = input.selectionStart;
    render();
    const next = document.getElementById("search-" + state.view);
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }, 220);
  input.addEventListener("input", run);
  return input;
}

function entryRow(item, section, tag) {
  const flag = FLAGS[section];
  const done = flag ? !!item[flag] : false;
  const sub = [item.act, item.day, item.when, item.where, item.deck]
    .filter(Boolean).join(" · ");

  const children = [];
  if (flag) {
    children.push(el("button", {
      class: "tick", type: "button", "aria-pressed": String(done),
      "aria-label": (done ? "Fjern kryss for " : "Kryss av ") +
                    (item.title || item.name),
      onclick: (e) => { e.stopPropagation(); toggleFlag(item.id); },
    }));
  } else {
    children.push(el("span", { class: "tick", style: "border-color:transparent" }));
  }

  const bodyBits = [el("span", { class: "entry-title",
                                 text: item.title || item.name || "?" })];
  if (sub) bodyBits.push(el("span", { class: "entry-sub", text: sub }));
  if (item.roll) {
    bodyBits.push(el("span", { class: "entry-sub", text: "Slag: " + item.roll }));
  }
  if (item.userNotes) {
    bodyBits.push(el("span", { class: "entry-note", text: item.userNotes }));
  }
  children.push(el("span", { class: "entry-body" }, bodyBits));
  children.push(el("span", { class: "entry-open", text: "ÅPNE" }));

  return el("button", {
    class: "entry" + (done ? " done" : ""), type: "button",
    "data-tag": tag || item.tag || null,
    onclick: () => openItem(item, section),
  }, children);
}

function filterToolbar(section) {
  const items = state.scenario[section] || [];
  const flag = FLAGS[section];
  const done = items.filter((x) => x[flag]).length;
  const bar = el("div", { class: "row spread", style: "margin-bottom:14px" }, [
    el("button", {
      class: "btn small", type: "button",
      "aria-pressed": String(state.hideDone),
      text: state.hideDone ? "Viser bare gjenstående" : "Skjul avkryssede",
      onclick: () => { state.hideDone = !state.hideDone; render(); },
    }),
    el("span", { class: "chip", text: done + " av " + items.length + " avkrysset" }),
  ]);
  return bar;
}

function visible(items, section) {
  const flag = FLAGS[section];
  return items.filter((it) => {
    if (state.hideDone && flag && it[flag]) return false;
    return matches(it, state.query);
  });
}

function viewOverview(root) {

  root.appendChild(el("p", { class: "eyebrow", text: d.system || "Scenario" }));
  root.appendChild(el("h1", { text: d.title }));
  if (d.tagline) root.appendChild(el("p", { class: "lede", text: d.tagline }));

    root.appendChild(el("div", { class: "panel accent" }, [
      el("p", { class: "eyebrow", text: "Til spillerne" }),
      el("p", { class: "prose", text: d.player_pitch }),
    ]));
  }

  // Neste hendelse: den første på tidslinja som ikke er huket av.
  const upcoming = (d.timeline || []).filter((e) => !e.triggered);
  if (upcoming.length) {

                text: [e.day, e.when].filter(Boolean).join(" · ") }),
      el("p", { class: "prose tight",
                text: (e.description || "").slice(0, 260) +
                      ((e.description || "").length > 260 ? "…" : "") }),
      el("div", { class: "row" }, [
        el("button", { class: "btn primary", type: "button", text: "Åpne scenen",
                       onclick: () => openItem(e, "timeline") }),
        el("button", { class: "btn", type: "button", text: "Marker utløst",
                       onclick: () => toggleFlag(e.id) }),
      ]),
    ]);
    root.appendChild(card);
    if (upcoming.length > 1) {
      root.appendChild(el("p", { class: "entry-sub",
        style: "margin:-8px 0 20px",
        text: "Deretter: " + upcoming[1].title }));
    }
  } else {
    root.appendChild(el("div", { class: "panel" }, [
      el("p", { class: "eyebrow", text: "Tidslinje" }),
      el("h3", { text: "Alle hendelser er huket av" }),
    ]));
  }

  root.appendChild(el("h2", { text: "Fremdrift" }));
  const labels = { timeline: "Tidslinje", beats: "Scener",
                   clues: "Spor funnet", locations: "Steder besøkt",

    d.keeper_brief.forEach((b) => {
      stack.appendChild(el("button", {
        class: "entry", type: "button",
        onclick: () => openModal(b.title, "", (body) => {
          body.appendChild(el("p", { class: "prose", text: b.body }));
        }, []),
      }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title", text: b.title }),
          el("span", { class: "entry-sub",
                       text: b.body.slice(0, 90) + "…" }),

        el("span", { class: "entry-open", text: "ÅPNE" }),

    text: "Reisen fra San Francisco til Shanghai, dag for dag. " +
          "Fargen til venstre viser hva slags hendelse det er." }));
  root.appendChild(searchBar("Søk i tidslinjen…"));
  root.appendChild(el("div", { style: "height:12px" }));
  root.appendChild(filterToolbar("timeline"));

  const legend = el("div", { class: "row", style: "margin-bottom:18px" });
  [["villain", "Skurkens trekk", "var(--signal)"],
   ["event", "Hendelse", "var(--brass-dim)"],
   ["voyage", "Reise og vær", "var(--tide)"],
   ["social", "Selskapsliv", "var(--rule-soft)"]].forEach((t) => {
    legend.appendChild(el("span", { class: "chip" }, [
      el("span", { class: "swatch", style: "background:" + t[2] }),
      t[1],
    ]));
  });
  root.appendChild(legend);

  const items = visible(state.scenario.timeline || [], "timeline");

    byDay[key].push(it);
  });

  days.forEach((day) => {

      el("div", { class: "day-head" }, [

    evs.forEach((e) => stack.appendChild(entryRow(e, "timeline", e.tag)));

/* Regler-fanen: scenarioets egne oppslag først, og under dem
   regelbokser og ferdighetsoppslag fra bøkene — det man ellers måtte
   bla etter midt i en økt.                                        */
function viewReference(root) {
  root.appendChild(el("h1", { text: "Regler og oppslag" }));
  root.appendChild(el("p", { class: "lede",
    text: "Skipsdata, terningslag og sanity-belønninger fra scenarioet, " +
          "og under dem reglene fra bøkene: galskap, formler, drukning, " +
          "farer og hele ferdighetslista." }));
  root.appendChild(searchBar("Søk i regler, formler og ferdigheter…"));
  root.appendChild(el("div", { style: "height:12px" }));

  const q = state.query.toLowerCase();
  let found = 0;

  function block(title, count, rows) {
    if (!rows.children.length) return;
    found += count;
    const sec = el("section", { class: "day" }, [
      el("div", { class: "day-head" }, [
        el("h3", { text: title }),
        el("span", { text: String(count) }),
      ]),
    ]);
    sec.appendChild(rows);
    root.appendChild(sec);
  }

  // --- scenarioets egne oppslag
  const scen = visible(state.scenario.reference || [], "reference");
  const scenRows = el("div", { class: "stack" });
  scen.forEach((it) => scenRows.appendChild(entryRow(it, "reference")));
  block("Dette scenarioet", scen.length, scenRows);

  // --- regelbokser fra bøkene
  const boxes = [];
  [state.keeperRules, state.talentRules].forEach((bank) => {
    if (bank) (bank.rules || []).forEach((r) => boxes.push(r));
  });
  const hitBoxes = boxes.filter((r) => !q ||
    [r.title, r.source, r.intro,
     (r.sections || []).map((x) => x.title + " " + x.body).join(" ")]
      .filter(Boolean).join(" ").toLowerCase().indexOf(q) !== -1);
  const boxRows = el("div", { class: "stack" });
  hitBoxes.forEach((r) => {
    boxRows.appendChild(el("button", {
      class: "entry pickrow", type: "button",
      onclick: () => openRuleBox(r),
    }, [
      el("span", { class: "entry-body" }, [
        el("span", { class: "entry-title", text: r.title }),
        el("span", { class: "entry-sub", text: r.source || "" }),
        el("span", { class: "entry-sub",
          text: (r.sections || []).map((x) => x.title).join(" · ") }),
      ]),
      el("span", { class: "entry-open", text: "ÅPNE" }),
    ]));
  });
  block("Regelbok", hitBoxes.length, boxRows);

  // --- ferdighetsoppslag
  const all = (state.skillBook && state.skillBook.skills) || [];
  const hitSkills = all.filter((sk) => !q ||
    (sk.name + " " + sk.description + " " +
     (sk.difficulty || []).join(" ")).toLowerCase().indexOf(q) !== -1);
  const skillRows = el("div", { class: "stack" });
  // Uten søk er lista lang; da vises den bare som en inngang.
  const show = q ? hitSkills : [];
  show.forEach((sk) => skillRows.appendChild(skillRow(sk)));
  if (!q && all.length) {
    skillRows.appendChild(el("button", {
      class: "entry pickrow", type: "button",
      onclick: () => openSkillList(),
    }, [
      el("span", { class: "entry-body" }, [
        el("span", { class: "entry-title", text: "Hele ferdighetslista" }),
        el("span", { class: "entry-sub",
          text: all.length + " ferdigheter med beskrivelse og hva et " +
                "hardt slag betyr" }),
      ]),
      el("span", { class: "entry-open", text: "ÅPNE" }),
    ]));
  }
  block("Ferdigheter", q ? hitSkills.length : all.length, skillRows);

  if (q && !found) root.appendChild(emptyBox("Ingen treff."));
}

function skillRow(sk) {
  return el("button", {
    class: "entry pickrow", type: "button",
    onclick: () => openSkill(sk.name, sk),
  }, [
    el("span", { class: "entry-body" }, [
      el("span", { class: "entry-title", text: sk.name }),
      el("span", { class: "entry-sub", text: sk.description.slice(0, 110) }),
    ]),
    el("span", { class: "entry-open", text: sk.base }),
  ]);
}

function openSkillList() {
  const all = (state.skillBook && state.skillBook.skills) || [];
  openModal("Ferdigheter", state.skillBook ? state.skillBook.source : "",
    (body) => {
      const stack = el("div", { class: "stack" });
      all.forEach((sk) => stack.appendChild(skillRow(sk)));
      body.appendChild(stack);
    }, []);
}

// Slår opp en ferdighet på navn. Karakterarkene bruker egne
// skrivemåter — «Mech. Repair», «Science (Biology)» — så både alias og
// spesialiseringer må finne fram til grunnoppslaget.
function lookupSkill(name) {
  const raw = String(name || "").trim().toLowerCase();
  if (skillIndex[raw]) return skillIndex[raw];
  const base = raw.replace(/\s*\(.*\)\s*$/, "").trim();
  if (skillIndex[base]) return skillIndex[base];
  return skillIndex[base + " (specializations)"] || null;
}

function openSkill(name, sk) {
  const s = sk || lookupSkill(name);
  openModal(s ? s.name : name, s ? "Grunnverdi " + s.base : "Ukjent ferdighet",
    (body) => {
      if (!s) {
        body.appendChild(el("p", { class: "prose",
          text: "Denne ferdigheten står ikke i utgaven av regelboka som " +
                "er lest inn." }));
        return;
      }
      body.appendChild(el("p", { class: "prose", text: s.description }));
      if ((s.difficulty || []).length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Hva slagene betyr" }));
        const ul = el("ul", { class: "bullets" });
        s.difficulty.forEach((d) => ul.appendChild(el("li", { text: d })));
        body.appendChild(ul);
      }
      if (s.pushing) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Å pushe slaget" }));
        body.appendChild(el("p", { class: "prose", text: s.pushing }));
      }
      if (s.pushed_failure) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Når et pushet slag ryker" }));
        body.appendChild(el("p", { class: "prose", text: s.pushed_failure }));
      }
      if (s.insane) {
        body.appendChild(el("p", { class: "caveat", text: s.insane }));
      }
      if (state.skillBook && state.skillBook.note) {
        body.appendChild(el("p", { class: "caveat",
                                   text: state.skillBook.note }));
      }
    }, []);
}

function viewNpcs(root) {
  root.appendChild(el("h1", { text: "NPCer" }));
  root.appendChild(el("p", { class: "lede",
    text: "Alle med navn ombord, med statblokk, trekk og replikker." }));
  root.appendChild(searchBar("Søk i NPCer…"));
  root.appendChild(el("div", { style: "height:16px" }));

  const items = (state.scenario.npcs || []).filter((n) => matches(n, state.query));
  if (!items.length) { root.appendChild(emptyBox("Ingen treff.")); return; }

  const cats = [];
  const byCat = {};
  items.forEach((n) => {
    const key = n.category || "Andre";
    if (!byCat[key]) { byCat[key] = []; cats.push(key); }
    byCat[key].push(n);
  });
  cats.forEach((cat) => {
    const block = el("section", { class: "day" }, [
      el("div", { class: "day-head" }, [
        el("h3", { text: cat }),
        el("span", { text: String(byCat[cat].length) }),
      ]),
    ]);
    const stack = el("div", { class: "stack" });
    byCat[cat].forEach((n) => {
      const tag = /antagonist|monster|device/i.test(cat) ? "villain"
        : (/ally|red herring/i.test(cat) ? "event" : null);
      stack.appendChild(el("button", {
        class: "entry", type: "button", "data-tag": tag,
        onclick: () => openNpc(n),
      }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title", text: n.name }),
          n.role ? el("span", { class: "entry-sub", text: n.role }) : null,
          n.userNotes ? el("span", { class: "entry-note", text: n.userNotes }) : null,
        ]),
        el("span", { class: "entry-open", text: "STATS" }),
      ]));
    });
    block.appendChild(stack);
    root.appendChild(block);
  });
}

/* -------------------------- karakterer -------------------------- */

function viewCharacters(root) {
  root.appendChild(el("h1", { text: "Roller" }));
  root.appendChild(el("p", { class: "lede",
    text: "Spillere, NPCer og fiender i én liste. Alt kan redigeres, og " +
          "alt kan sendes rett inn i en kamp." }));

  const picker = el("input", { type: "file", accept: ".json,application/json",
                               id: "char-file", style: "display:none" });
  picker.addEventListener("change", async () => {
    const file = picker.files && picker.files[0];
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const list = (Array.isArray(parsed) ? parsed : [parsed])
        .map(normalizeChar);
      // Slå sammen på navn, slik at en ny import ikke lager duplikater
      // av folk du allerede har redigert.
      const byName = {};
      state.characters.forEach((c) => { byName[c.name.toLowerCase()] = c; });
      let added = 0, updated = 0;
      list.forEach((incoming) => {
        const hit = byName[incoming.name.toLowerCase()];
        if (hit) {
          Object.assign(hit, incoming, { id: hit.id });
          updated += 1;
        } else {
          state.characters.push(incoming);
          added += 1;
        }
      });
      await saveCharacters();
      toast(added + " lagt til, " + updated + " oppdatert");
      render();
    } catch (e) {
      toast("Kunne ikke lese fila: " + e.message);
    }
    picker.value = "";
  });

  // --- knapperad
  const actions = el("div", { class: "row", style: "margin-bottom:14px" });
  KINDS.forEach((k) => {
    actions.appendChild(el("button", {
      class: "btn", type: "button", text: "+ " + k.label,
      onclick: () => editCharacter(null, k.key),
    }));
  });
  actions.appendChild(el("button", {
    class: "btn small", type: "button", text: "Importer",
    onclick: () => picker.click(),
  }));
  if (state.characters.length) {
    actions.appendChild(el("button", {
      class: "btn small", type: "button", text: "Eksporter",
      onclick: () => download("characters.json", state.characters),
    }));
  }
  actions.appendChild(picker);
  root.appendChild(actions);

  // --- filter etter type
  const counts = { all: state.characters.length };
  KINDS.forEach((k) => {
    counts[k.key] = state.characters.filter((c) => c.kind === k.key).length;
  });
  const filters = el("div", { class: "row", style: "margin-bottom:12px" });
  const chips = [{ key: "all", label: "Alle" }].concat(
    KINDS.map((k) => ({ key: k.key, label: k.plural })));
  chips.forEach((c) => {
    filters.appendChild(el("button", {
      class: "btn small", type: "button",
      "aria-pressed": String(state.charFilter === c.key),
      text: c.label + " (" + (counts[c.key] || 0) + ")",
      onclick: () => { state.charFilter = c.key; render(); },
    }));
  });
  root.appendChild(filters);

  root.appendChild(searchBar("Søk i roller…"));
  root.appendChild(el("div", { style: "height:14px" }));

  if (!state.characters.length) {
    root.appendChild(emptyBox("Ingen roller ennå.",
      "Lag en ny, eller importer characters.json fra Android-appen."));
    return;
  }

  const q = state.query.toLowerCase();
  const shown = state.characters.filter((c) => {
    if (state.charFilter !== "all" && c.kind !== state.charFilter) return false;
    if (!q) return true;
    return [c.name, c.occ, c.archetype, c.player, c.subtitle, c.notes]
      .filter(Boolean).join(" ").toLowerCase().indexOf(q) !== -1;
  });

  if (!shown.length) {
    root.appendChild(emptyBox("Ingen treff."));
    return;
  }

  // Grupper etter type, i den rekkefølgen KINDS definerer.
  KINDS.forEach((k) => {
    const members = shown.filter((c) => c.kind === k.key);
    if (!members.length) return;
    const block = el("section", { class: "day" }, [
      el("div", { class: "day-head" }, [
        el("h3", { text: k.plural }),
        el("span", { text: String(members.length) }),
      ]),
    ]);
    const stack = el("div", { class: "stack" });
    members.forEach((c) => stack.appendChild(characterRow(c)));
    block.appendChild(stack);
    root.appendChild(block);
  });
}

function characterRow(c) {
  const tag = c.kind === "enemy" ? "villain"
    : (c.kind === "npc" ? "event" : null);
  const bits = [c.occ, c.archetype, c.subtitle].filter(Boolean);
  const hp = c.stats.HP ? "HP " + c.stats.HP : null;
  const san = c.stats.SAN ? "SAN " + c.stats.SAN : null;
  const sub = bits.concat([hp, san].filter(Boolean)).join(" · ");

  return el("div", { class: "entry", "data-tag": tag }, [
    el("span", { class: "tick", style: "border-color:transparent" }),
    el("span", { class: "entry-body" }, [
      el("button", {
        class: "linkish", type: "button",
        onclick: () => openCharacter(c),
      }, [el("span", { class: "entry-title", text: c.name || "(uten navn)" })]),
      sub ? el("span", { class: "entry-sub", text: sub }) : null,
    ]),
    el("span", { class: "rowtools" }, [
      el("button", { class: "btn small", type: "button", text: "Til kamp",
                     onclick: () => { addToCombat(c); } }),
      // Snarvei rett til våpenvelgeren. Kjøper spillerne noe i en
      // butikk, skal man slippe å lete etter det inne i editoren.
      el("button", { class: "btn small", type: "button", text: "+ Våpen",
                     title: "Åpne editoren med våpenlista framme",
                     onclick: () => editCharacter(c, null, "weapons") }),
      el("button", { class: "btn small", type: "button", text: "Rediger",
                     onclick: () => editCharacter(c) }),
      el("button", { class: "btn small", type: "button", text: "Dupliser",
                     onclick: () => duplicateCharacter(c) }),
      el("button", { class: "btn small danger", type: "button", text: "Slett",
                     onclick: () => confirmThen("Slett rolle?",
                       "«" + (c.name || "uten navn") + "» blir borte.",
                       async () => {
                         state.characters = state.characters
                           .filter((x) => x.id !== c.id);
                         await saveCharacters();
                         render();
                         toast("Slettet");
                       }) }),
    ]),
  ]);
}

async function duplicateCharacter(c) {
  const copy = normalizeChar(JSON.parse(JSON.stringify(c)));
  copy.id = newId("ch");
  copy.name = uniqueName(c.name || "Uten navn");
  state.characters.push(copy);
  await saveCharacters();
  render();
  toast("Duplisert som «" + copy.name + "»");
}

function uniqueName(base) {
  // «Ghoul» -> «Ghoul 2» -> «Ghoul 3». Nyttig når du legger fire like
  // fiender inn i samme kamp.
  const stem = base.replace(/\s+\d+$/, "");
  const taken = new Set(state.characters.map((c) => c.name));
  if (!taken.has(stem)) return stem;
  let n = 2;
  while (taken.has(stem + " " + n)) n += 1;
  return stem + " " + n;
}

/* ---------------------- karaktereditor -------------------------- */

// focus: "weapons" åpner editoren med våpenlista framme med én gang.
function editCharacter(existing, kindHint, focus) {
  const isNew = !existing;
  const c = normalizeChar(existing
    ? JSON.parse(JSON.stringify(existing))
    : { kind: kindHint || "pc", name: "" });

  const fields = {};
  function textRow(label, key, value, placeholder) {
    const input = el("input", { class: "field", id: "ed-" + key,
                                value: value || "",
                                placeholder: placeholder || "" });
    fields[key] = input;
    return el("label", { class: "formrow" }, [
      el("span", { class: "formlabel", text: label }), input,
    ]);
  }

  openModal(isNew ? "Ny rolle" : "Rediger " + (c.name || "rolle"), "",
    (body) => {
      // --- type
      body.appendChild(el("div", { class: "section-label", text: "Type" }));
      const kindRow = el("div", { class: "row" });
      KINDS.forEach((k) => {
        kindRow.appendChild(el("button", {
          class: "btn small", type: "button",
          "aria-pressed": String(c.kind === k.key),
          text: k.label,
          onclick: (e) => {
            c.kind = k.key;
            Array.from(kindRow.children).forEach((b) => {
              b.setAttribute("aria-pressed",
                String(b.textContent === KIND_LABEL[c.kind]));
            });
            e.preventDefault();
          },
        }));
      });
      body.appendChild(kindRow);

      // --- grunnfelter
      body.appendChild(el("div", { class: "section-label", text: "Navn og rolle" }));
      body.appendChild(textRow("Navn", "name", c.name, "Hva heter den?"));
      body.appendChild(textRow("Yrke / type", "occ", c.occ,
                               "Dr. of Medicine, Mythos-skapning …"));
      body.appendChild(textRow("Arketyp / undertittel", "archetype",
                               c.archetype || c.subtitle, ""));
      body.appendChild(textRow("Spiller", "player", c.player,
                               "Hvem spiller den? (bare for spillere)"));

      // --- karakteristikker
      body.appendChild(el("div", { class: "section-label",
                                   text: "Karakteristikker" }));
      const grid = el("div", { class: "editgrid" });
      CHAR_STATS.forEach((k) => {
        const input = el("input", { class: "field", id: "ed-stat-" + k,
                                    value: c.stats[k] || "" });
        fields["stat:" + k] = input;
        grid.appendChild(el("label", { class: "statedit" }, [
          el("span", { text: k }), input,
        ]));
      });
      body.appendChild(grid);

      // --- angrep
      body.appendChild(el("div", { class: "section-label", text: "Angrep" }));
      body.appendChild(el("p", { class: "entry-sub",
        text: "Våpnene som står her er de rollen kan bruke i kamp. " +
              "«+ Legg til våpen» henter hele statblokka — skade, " +
              "rekkevidde, magasin og feilgrense. Treffsjansen fylles " +
              "inn fra rollens egen ferdighet, eller fra et våpen av " +
              "samme sort den alt har; står feltet tomt, må du skrive " +
              "den inn selv." }));
      const attackList = el("div", { class: "stack" });
      function attackRow(a) {
        const name = el("input", { class: "field", value: a.name || "",
                                   placeholder: "Klo" });
        const skill = el("input", { class: "field", value: a.skill || "",
                                    placeholder: "45%" });
        // Et angrep uten treffsjanse er ubrukelig i kamp. Feltet får
        // en markering til det er fylt ut, og viser halv og femtedel
        // ved siden av så snart det står et tall der.
        const atkSteps = el("span", { class: "steps inline" });
        function markSkill() {
          skill.classList.toggle("needs", !skill.value.trim());
          atkSteps.textContent = stepsLabel(skill.value);
        }
        skill.addEventListener("input", markSkill);
        markSkill();
        const dmg = el("input", { class: "field", value: a.damage || "",
                                  placeholder: "1D6 + db" });
        // Våpenegenskapene redigeres ikke for hånd, men må følge med
        // videre — det er de som gjør at kampen regner riktig.
        const extra = {
          uses_db: a.uses_db, can_impale: a.can_impale,
          malfunction: a.malfunction, attacks: a.attacks,
          ammo: a.ammo, range: a.range, weaponId: a.weaponId,
          // Kategorien avgjør om angrepet er nærkamp eller avstand, og
          // hvilke skaderegler som gjelder mot skapninger som bare
          // biter på visse våpen. Den må følge med ut av editoren.
          category: a.category, subcategory: a.subcategory,
          ignores_armor: a.ignores_armor, abilityId: a.abilityId,
        };
        const flags = [
          extra.can_impale ? "spidder" : null,
          extra.uses_db === "half" ? "halv db"
            : (extra.uses_db ? "db" : null),
          extra.malfunction ? "feiler " + extra.malfunction : null,
          extra.range ? extra.range : null,
        ].filter(Boolean).join(" · ");

        const row = el("div", { class: "attackrow" }, [
          name, skill, atkSteps, dmg,
          el("button", { class: "btn small danger", type: "button", text: "×",
                         onclick: () => row.remove() }),
        ]);
        if (flags) {
          row.appendChild(el("span", { class: "attackflags", text: flags }));
        }
        row._read = () => Object.assign({}, extra, {
          name: name.value.trim(),
          skill: skill.value.trim(),
          damage: dmg.value.trim(),
        });
        return row;
      }
      c.attacks.forEach((a) => attackList.appendChild(attackRow(a)));
      body.appendChild(attackList);
      body.appendChild(el("div", { class: "row" }, [
        el("button", {
          class: "btn small", type: "button", text: "+ Tomt angrep",
          onclick: () => attackList.appendChild(attackRow({})),
        }),
        (state.weapons && state.weapons.weapons.length) ? el("button", {
          class: "btn small primary", type: "button", text: "+ Legg til våpen",
          id: "toggle-weapons",
          onclick: (e) => {
            e.preventDefault();
            weapPanel.hidden = !weapPanel.hidden;
            if (!weapPanel.hidden) {
              const f = document.getElementById("weap-search");
              if (f) f.focus();
            }
          },
        }) : null,
      ]));
      const weapPanel = weaponPickerPanel((w) => {
        attackList.appendChild(attackRow(weaponToAttack(w, c)));
      });
      body.appendChild(weapPanel);
      if (focus === "weapons") {
        weapPanel.hidden = false;
        // Lista ligger et stykke nede i editoren.
        setTimeout(() => {
          weapPanel.scrollIntoView({ block: "center" });
          const f = document.getElementById("weap-search");
          if (f) f.focus();
        }, 0);
      }
      fields._attacks = attackList;

      // --- ferdigheter
      body.appendChild(el("div", { class: "section-label",
                                   text: "Ferdigheter" }));
      const skillList = el("div", { class: "stack" });
      function skillRow(k, v) {
        const name = el("input", { class: "field", value: k || "",
                                   placeholder: "Spot Hidden" });
        const val = el("input", { class: "field", value: v || "",
                                  placeholder: "50" });
        // Halv og femtedel oppdateres mens man skriver, så man ser med
        // én gang hva et hardt slag vil kreve.
        const steps = el("span", { class: "steps inline" });
        function showSteps() { steps.textContent = stepsLabel(val.value); }
        val.addEventListener("input", showSteps);
        showSteps();
        const row = el("div", { class: "skillrow" }, [
          name, val, steps,
          el("button", { class: "btn small danger", type: "button", text: "×",
                         onclick: () => row.remove() }),
        ]);
        row._read = () => [name.value.trim(), val.value.trim()];
        return row;
      }
      Object.keys(c.skills).sort().forEach((k) => {
        skillList.appendChild(skillRow(k, c.skills[k]));
      });
      body.appendChild(skillList);
      body.appendChild(el("button", {
        class: "btn small", type: "button", text: "+ Legg til ferdighet",
        onclick: () => skillList.appendChild(skillRow("", "")),
      }));
      fields._skills = skillList;

      // --- fritekst
      body.appendChild(el("div", { class: "section-label", text: "Tekst" }));
      // --- talenter, med velger
      body.appendChild(el("div", { class: "section-label",
                                   text: "Talenter" }));
      const talField = el("textarea", { class: "field", rows: "2",
                                        id: "ed-talents",
                                        placeholder: "Keen Hearing, Hardened…" });
      talField.value = c.talents || "";
      fields.talents = talField;
      body.appendChild(talField);
      const talPanel = talentPickerPanel("pulp", talField);
      body.appendChild(el("button", {
        class: "btn small primary", type: "button", id: "toggle-talents",
        text: "+ Fra talentlista",
        onclick: (e) => {
          e.preventDefault();
          talPanel.hidden = !talPanel.hidden;
        },
      }));
      body.appendChild(talPanel);

      body.appendChild(el("div", { class: "section-label",

           "insane_talents", "armor", "spells", "sanity_loss",
           "backstory", "notes"]

          c.stats = {};
          CHAR_STATS.forEach((k) => {
            const v = fields["stat:" + k].value.trim();

          c.attacks = Array.from(fields._attacks.children)
            .map((r) => r._read())
            .filter((a) => a.name || a.skill || a.damage);

          c.skills = {};
          Array.from(fields._skills.children).forEach((r) => {
            const pair = r._read();
            if (pair[0]) c.skills[pair[0]] = pair[1];
          });

          if (!c.name) { toast("Rollen trenger et navn"); return; }

          if (isNew) {
            state.characters.push(c);

            // Skriv tilbake PÅ det eksisterende objektet i stedet for å
            // bytte det ut. Kortet som ligger under i modalstabelen
            // holder på en referanse hit, og ville ellers vist de gamle
            // verdiene når man kommer tilbake til det.
            const existing = state.characters.find((x) => x.id === c.id);
            if (existing) Object.assign(existing, c);
            else state.characters.push(c);
          }
          await saveCharacters();
          closeModal();
          render();
          toast(isNew ? "Opprettet" : "Lagret");
        },
      }),
    ]);
}

// Ferdighetsnavnet i weapons.json er norsk («Skytevåpen (Håndvåpen)»).
// Har karakteren en ferdighet som ligner, bruker vi verdien derfra som
// treffsjanse — ellers står feltet tomt til Keeperen fyller det ut.
// Våpenlista er på norsk, mens karakterarkene ofte har engelske
// ferdighetsnavn. Uten denne broa ville ingen treffsjanse funnet seg
// selv.
const SKILL_SYNONYMS = {
  "håndvåpen": ["handgun", "pistol", "revolver"],
  "rifle": ["rifle", "rifle/shotgun"],
  "hagle": ["shotgun", "rifle/shotgun"],
  "maskinpistol": ["submachine gun", "smg"],
  "maskingevær": ["machine gun"],
  "nærkamp": ["brawl", "fighting"],
  "slagvåpen": ["brawl", "fighting"],
  "kniv": ["knife", "fighting"],
  "sverd": ["sword", "fighting"],
  "øks": ["axe", "fighting"],
  "pisk": ["whip"],
  "bue": ["bow"],
  "kast": ["throw"],
  "sprengstoff": ["demolitions"],
};

function skillCandidates(weaponSkill) {
  const want = String(weaponSkill || "").toLowerCase();
  const out = [want];
  const inner = (want.match(/\(([^)]+)\)/) || [])[1];
  if (inner) out.push(inner.trim());
  const head = want.split("(")[0].trim();
  if (head) out.push(head);
  Object.keys(SKILL_SYNONYMS).forEach((k) => {
    if (want.indexOf(k) !== -1) {
      SKILL_SYNONYMS[k].forEach((alt) => out.push(alt));
    }
  });
  return out.filter(Boolean);
}

function skillValueFor(character, weapon) {
  if (!character || !character.skills) return "";
  const want = String(weapon.skill || "").toLowerCase();
  const keys = Object.keys(character.skills);

  // Prøv synonymene før den løsere delstreng-matchinga under.
  for (const cand of skillCandidates(weapon.skill)) {
    const exact = keys.find((k) => k.toLowerCase() === cand);
    if (exact) {
      const v = String(character.skills[exact]).replace("%", "").trim();
      if (v) return v + "%";
    }
    const loose = keys.find((k) => k.toLowerCase().indexOf(cand) !== -1);
    if (loose) {
      const v = String(character.skills[loose]).replace("%", "").trim();
      if (v) return v + "%";
    }
  }
  // Eksakt treff først, deretter på ordet i parentes (Håndvåpen, Rifle).
  let hit = keys.find((k) => k.toLowerCase() === want);
  if (!hit) {
    const inner = (want.match(/\(([^)]+)\)/) || [])[1];
    if (inner) {
      hit = keys.find((k) => k.toLowerCase().indexOf(inner) !== -1);
    }
  }
  if (!hit) {
    const head = want.split("(")[0].trim();
    if (head) hit = keys.find((k) => k.toLowerCase().indexOf(head) !== -1);
  }
  if (!hit) return "";
  const v = String(character.skills[hit]).replace("%", "").trim();
  return v ? v + "%" : "";
}

/* Treffsjansen for et våpen som legges på en rolle.

   Først rollens egen ferdighet. Finner vi ikke den — mange NPCer har
   bare et knippe ferdigheter skrevet ned — bruker vi treffsjansen fra
   et våpen av samme sort som rollen alt har. Gir vi den en hagle til,
   skyter den like godt med den som med den første. Uten dette blir
   feltet stående tomt, og våpenet er ubrukelig i kamp.            */
function attackSkillFor(character, w) {
  const direct = skillValueFor(character, w);
  if (direct) return direct;
  if (!character) return "";

  const own = (character.attacks || []).filter((a) => a.skill);
  const sub = String(w.subcategory || "").toLowerCase();
  const cat = String(w.category || "").toLowerCase();

  const same = (key, val) => own.find(
    (a) => val && String(a[key] || "").toLowerCase() === val);

  const hit = same("subcategory", sub) || same("category", cat) ||
    (cat === "melee" ? own.find((a) => !isRangedAttack(a)) : null);
  return hit ? hit.skill : "";
}

function weaponToAttack(w, character) {
  return {
    name: w.name,
    skill: attackSkillFor(character, w),
    damage: w.damage || "",
    uses_db: w.uses_db,
    can_impale: !!w.can_impale,
    malfunction: w.malfunction || null,
    attacks: w.attacks || null,
    ammo: w.ammo || null,
    range: w.range || null,
    category: w.category || "",
    subcategory: w.subcategory || "",
    weaponId: w.id,
  };
}

// Skytevåpen og kastevåpen kan ikke møtes med å slå tilbake, og
// unnvikes bare ved å dykke i dekning. Statblokker fra Malleus har
// verken kategori eller rekkevidde — klør og bitt er nærkamp.
function isRangedAttack(a) {
  if (!a) return false;
  if (a.manoeuvre) return false;
  const cat = String(a.category || "").toLowerCase();
  if (cat === "melee") return false;
  if (cat === "firearms" || cat === "heavy") return true;
  const skill = String(a.skill_name || a.skill || "").toLowerCase();
  if (/skytev|kaste|bue|armbrøst/.test(skill)) return true;
  const rng = String(a.range || "").toLowerCase();
  if (!rng) return false;
  return !/berøring|nærkamp|touch|melee/.test(rng);
}

// Våpenvelgeren er et panel inne i editoren, ikke en egen modal:
// modalene her kan ikke stables, så en modal oppå editoren ville bare
// lukket den og kastet endringene.
function weaponPickerPanel(onPick) {
  const bank = state.weapons;
  const panel = el("div", { class: "weappanel", hidden: true });
  if (!bank) return panel;

  const cats = bank.categories || {};
  const listBox = el("div", { class: "picklist short" });
