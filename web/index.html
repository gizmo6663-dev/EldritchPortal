<script type="application/json" id="bundled-talents">{"id":"pulp-talents","version":1,"title":"Talenter","source":"Pulp Cthulhu (Chaosium)","note":"Talentbeskrivelsene er hentet maskinelt ut av regelboka og gjengis på engelsk, slik de står der.","talents":[{"name":"Alert","description":"never surprised in combat.","group":"Kamptalent","kind":"pulp","id":"tal-alert"},{"name":"Animal Companion","description":"starts game with a faithful animal companion (e.g. dog, cat, parrot) and gains a bonus die when making Animal Handling rolls.","group":"Diverse talent","kind":"pulp","id":"tal-animal-companion"},{"name":"Arcane Insight","description":"halve the time required to learn spells and gains bonus die to spell casting rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-arcane-insight"},{"name":"Beady Eye","description":"does not suffer penalty die when “aiming” at a small target (Build –2), and may also fire into melee without a penalty die.","group":"Kamptalent","kind":"pulp","id":"tal-beady-eye"},{"name":"Endurance","description":"gain a bonus die when making CON rolls (including to determine MOV rate for chases).","group":"Fysisk talent","kind":"pulp","id":"tal-endurance"},{"name":"Fast Load","description":"choose a Firearm specialism; ignore penalty die for loading and firing in the same round.","group":"Kamptalent","kind":"pulp","id":"tal-fast-load"},{"name":"Fleet Footed","description":"may spend 10 Luck to avoid being “outnumbered” in melee combat for one combat encounter.","group":"Kamptalent","kind":"pulp","id":"tal-fleet-footed"},{"name":"Gadget","description":"starts game with one weird science gadget (see Weird Science, page 86).","group":"Diverse talent","kind":"pulp","id":"tal-gadget"},{"name":"Handy","description":"reduces difficulty by one level or gains bonus die (at the Keeper’s discretion) when making Electrical Repair, Mechanical Repair, and Operate Heavy Machinery rolls.","group":"Diverse talent","kind":"pulp","id":"tal-handy"},{"name":"Hardened","description":"ignores Sanity point loss from attacking other humans, viewing horrific injuries, or the deceased.","group":"Mentalt talent","kind":"pulp","id":"tal-hardened"},{"name":"Heavy Hitter","description":"may spend 10 Luck points to add an additional damage die when dealing out melee combat (die type depends on the weapon being used, e.g. 1D3 for unarmed combat, 1D6 for a sword, etc.).","group":"Kamptalent","kind":"pulp","id":"tal-heavy-hitter"},{"name":"Insane accuracy","description":"“Seems like I just can’t miss!” The hero gains a bonus die to all Firearms rolls until their gun is empty. They may continue to use the bonus die until one of their shots misses its target or they run out of bullets. That missed shot will hit something they do not want it to hit—an ally or something else of great value, dealing damage as if it had been an Extreme success (impale).","group":"Insane talent","kind":"insane","id":"tal-insane-accuracy"},{"name":"Insane appearance","description":"“Damn, I look good baby!” The hero looks somehow very different; this may be purely in their facial expression and posture, or it could be that they take the time to change their clothes and hair to something radically different (clothes don’t magically change—they must do that). Gain a bonus die to an APP roll or roll that could be affected by their appearance, such as Charm or Fast Talk. The effect is short-lived but may be applied to all interactions during a period of time, such as one scene or one meeting. If a roll is failed using the bonus die for their “improved” appearance, they suffer some form of social disgrace or consequence.","group":"Insane talent","kind":"insane","id":"tal-insane-appearance"},{"name":"Insane brutality","description":"“I’m gonna chop you into tiny pieces!” The hero rolls all melee damage twice and takes the highest result. The downside is that once they start hitting, they cannot stop! They must continue until they deliver a killing blow. The only two things that will stop this is if they are either rendered unconscious or someone successfully makes a Hard Fast Talk, Charm, or Intimidate roll on them (only one person may attempt one of these on the hero in any one combat round). 19-20.","group":"Insane talent","kind":"insane","id":"tal-insane-brutality"},{"name":"Insane constitution","description":"“I grit my teeth and feel no pain!” When an amount of damage is suffered, the hero may choose to make a CON roll. If successful, they bear the pain and halve the damage. If the roll is failed, they take the damage that was rolled and fall to the ground, incapacitated for 1D3 rounds.","group":"Insane talent","kind":"insane","id":"tal-insane-constitution"},{"name":"Insane dexterity","description":"“My hands move quicker than the eye can see!” Gain a bonus die to a DEX roll. If the roll is failed, something goes wrong. The Keeper chooses: either the hero is injured (take 1D4 hit points of damage), or they break the thing that they were working on.","group":"Insane talent","kind":"insane","id":"tal-insane-dexterity"},{"name":"Insane driver","description":"“Nothing’s going to stop me now!” Gain a bonus die to all the hero’s Drive rolls for one chase. Should a drive roll fail, they lose control of the vehicle somehow (at the Keeper’s discretion).","group":"Insane talent","kind":"insane","id":"tal-insane-driver"},{"name":"Insane hearing","description":"“Quiet everyone, what’s that ticking?” The hero gains a bonus die to a Listen roll. Regardless of ambient noise or other sounds, they are able to pick up on even the quietest of sounds. If the roll is failed, the Keeper decides what happens: either some sudden noise leaves them deaf for 1D10 minutes, or they have auditory delusions for the next hour.","group":"Insane talent","kind":"insane","id":"tal-insane-hearing"},{"name":"Insane language","description":"“Nope, never had a Swahili lesson in my life, but how difficult can it be?” The hero gains a temporary grasp of all modern languages—or one archaic or Mythos language—for a short time. This effect lasts long enough to conduct an initial reading of a tome, conduct a conversation, or listen to a speech. The effective skill in the language is 75%. Should a skill roll be required for the use of the new language, a failed roll means the hero forgets their native tongue for 1D6 days, replacing it with the new language that was being used at the time.","group":"Insane talent","kind":"insane","id":"tal-insane-language"},{"name":"Insane power","description":"“I can feel the power flowing through me!” Gain a bonus die to a POW roll. If the roll is failed, something goes wrong. The Keeper chooses: either the hero passes out, or the effect they were trying to achieve is dangerously greater than intended.","group":"Insane talent","kind":"insane","id":"tal-insane-power"},{"name":"Insane recall","description":"“I remember everything perfectly!” Every memory and fact the hero ever heard is right at their fingertips. Faces, figures, and details crowd their mind in a flood of information. Gain a bonus die to an EDU, Know, or skill roll when trying to remember information that the hero might feasibly have once heard or seen. If a roll is failed, the flood of information is too much! Lose a point of Sanity and suffer a bout of madness. If the hero was not already insane, they are now temporarily insane.","group":"Insane talent","kind":"insane","id":"tal-insane-recall"},{"name":"Insane sense of direction","description":"“Follow me, it’s down here!” The hero’s player tells the Keeper where they want to go or what they want to head towards. The Keeper gives the direction they should take in order to accomplish this. The hero makes a Luck roll: if the roll is failed, they walk straight into a trap or dangerous encounter of some kind.","group":"Insane talent","kind":"insane","id":"tal-insane-sense-of-direction"},{"name":"Insane skill augmentation","description":"“You think I’m crazy don’t you? But it’s possible I tell you!” As a side effect of insanity, a hero can augment one of their skills (of the player’s choice, agreed by the Keeper) with some aspect of the Cthulhu Mythos. This will affect the scope of what can be achieved with the skill. Herbert West and Crawford Tillinghast are both good candidates for case studies on how this might affect a person.","group":"Insane talent","kind":"insane","id":"tal-insane-skill-augmentation"},{"name":"Insane speed","description":"“Look at me—I’m faster than a speeding bullet!” When entering a chase, the hero takes a bonus die on their CON roll to determine their movement speed. If the roll succeeds, increase their speed by 1. If the roll is an Extreme success, increase their speed by 2. If the roll is failed, they blunder somehow, losing at least 1D3 rounds of movement.","group":"Insane talent","kind":"insane","id":"tal-insane-speed"},{"name":"Insane stealth","description":"“You ain’t seen me, right?” The hero gains a bonus die to a Stealth roll. They move with catlike grace and might even attempt to hide in plain sight. If the roll is failed, they accidentally break something or cause a great deal of commotion.","group":"Insane talent","kind":"insane","id":"tal-insane-stealth"},{"name":"Insane strength","description":"“I draw upon untold reserves of inner strength!” Gain a bonus die to a STR roll. If the roll is failed, something goes wrong. The Keeper chooses: either the hero is injured (take 1D3 + the hero’s damage bonus in damage from torn muscles and the like), or the thing that the hero was working on breaks.","group":"Insane talent","kind":"insane","id":"tal-insane-strength"},{"name":"Insane understanding","description":"“Oh, I get it now!” The hero’s player may ask the Keeper a question about the plot: “Why is the enemy doing…?” “What does the enemy hope to achieve by…?” “What is the best thing that we could do the thwart the enemy’s plan?” What is the enemy’s greatest weakness? The question should be quite specific and the Keeper should answer honestly. This talent can only be used once—it is then lost.","group":"Insane talent","kind":"insane","id":"tal-insane-understanding"},{"name":"Insane vision","description":"“Light? Who needs light?” The hero gains a bonus die to a Spot Hidden roll. Even in complete darkness, they get to make a roll as if it were twilight. If the roll is failed, the Keeper decides the outcome: either their eyes become painful and overly sensitive (effectively leaving them blind for 1D10 rounds) or they suffer delusions for the next hour.","group":"Insane talent","kind":"insane","id":"tal-insane-vision"},{"name":"Insanely hard to hit","description":"“Float like a butterfly!” The hero gains a bonus die on all Dodge rolls in the current combat scene until they fail a Dodge roll. Such a failure indicates moving into the blow, in which case they receive damage as if the attack had achieved an Extreme success.","group":"Insane talent","kind":"insane","id":"tal-insanely-hard-to-hit"},{"name":"Insanely intimidating","description":"“You think I’m funny? Funny how?” The hero gains a bonus die to Intimidate rolls. If a roll is failed, they lose control of their actions for a short time. The Keeper chooses what happens: either they fly into a violent rage (possibly causing damage to the person they’re speaking with), or they are belittled and shamed.","group":"Insane talent","kind":"insane","id":"tal-insanely-intimidating"},{"name":"Iron Liver","description":"may spend 5 Luck to avoid the effects of drinking excessive amounts of alcohol (negating penalty applied to skill rolls).","group":"Fysisk talent","kind":"pulp","id":"tal-iron-liver"},{"name":"Keen Hearing","description":"gain a bonus die to Listen rolls.","group":"Fysisk talent","kind":"pulp","id":"tal-keen-hearing"},{"name":"Keen Vision","description":"gain a bonus die to Spot Hidden rolls.","group":"Fysisk talent","kind":"pulp","id":"tal-keen-vision"},{"name":"Linguist","description":"able to determine what language is being spoken (or what is written); gains a bonus die to Language rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-linguist"},{"name":"Lore","description":"has knowledge of a lore specialization skill (e.g. Dream Lore, Vampire Lore, Werewolf Lore, etc.). Note that occupational and/or personal interest skill points should be invested in this skill.","group":"Mentalt talent","kind":"pulp","id":"tal-lore"},{"name":"Lucky","description":"regains an additional +1D10 Luck points when Luck Recovery rolls are made.","group":"Diverse talent","kind":"pulp","id":"tal-lucky"},{"name":"Master of Disguise","description":"may spend 10 Luck points to gain a bonus die to Disguise or Art/Craft (Acting) rolls; includes ventriloquism (able to throw voice over long distances so it appears that the sound is emanating from somewhere other than the hero). Note that if someone is trying to detect the disguise their Spot Hidden or Psychology roll’s difficulty is raised to Hard.","group":"Diverse talent","kind":"pulp","id":"tal-master-of-disguise"},{"name":"Mythos Knowledge","description":"begins the game with a Cthulhu Mythos Skill of 10 points.","group":"Diverse talent","kind":"pulp","id":"tal-mythos-knowledge"},{"name":"Night Vision","description":"in darkness, reduce the difficulty level of Spot Hidden rolls and ignore penalty die for shooting in the dark.","group":"Fysisk talent","kind":"pulp","id":"tal-night-vision"},{"name":"Nimble","description":"does not lose next action when “diving for cover” versus firearms.","group":"Kamptalent","kind":"pulp","id":"tal-nimble"},{"name":"Outmaneuver","description":"character is considered to have one point higher Build when initiating a combat maneuver (e.g. Build 1 becomes Build 2 when comparing their hero to the target in a maneuver, reducing the likelihood of suffering a penalty on their Fighting roll).","group":"Kamptalent","kind":"pulp","id":"tal-outmaneuver"},{"name":"Photographic Memory","description":"can remember many details; gains a bonus die when making Know rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-photographic-memory"},{"name":"Power Lifter","description":"gain a bonus die when making STR rolls to lift objects or people.","group":"Fysisk talent","kind":"pulp","id":"tal-power-lifter"},{"name":"Psychic Power","description":"may choose one psychic power (Clairvoyance, Divination, Medium, Psychometry, or Telekinesis). Note that occupational and/or personal interest skill points should be invested in this skill (see Psychic Powers, page 83).","group":"Mentalt talent","kind":"pulp","id":"tal-psychic-power"},{"name":"Quick Draw","description":"does not need to have their firearm “readied” to gain +50 DEX when determining position in the DEX order for combat.","group":"Kamptalent","kind":"pulp","id":"tal-quick-draw"},{"name":"Quick Healer","description":"natural healing is increased to +3 hit points per day.","group":"Fysisk talent","kind":"pulp","id":"tal-quick-healer"},{"name":"Quick Study","description":"halve the time required for Initial and Full Reading of Mythos tomes, as well as other books.","group":"Mentalt talent","kind":"pulp","id":"tal-quick-study"},{"name":"Rapid Attack","description":"may spend 10 Luck points to gain one further melee attack in a single combat round.","group":"Kamptalent","kind":"pulp","id":"tal-rapid-attack"},{"name":"Rapid Fire","description":"ignores penalty die for multiple handgun shots.","group":"Kamptalent","kind":"pulp","id":"tal-rapid-fire"},{"name":"Resilient","description":"may spend Luck points to shrug-off points of Sanity loss, on a one-for-one basis.","group":"Mentalt talent","kind":"pulp","id":"tal-resilient"},{"name":"Resourceful","description":"always seems to have what they need to hand; may spend 10 Luck points (rather than make Luck roll) to find a certain useful piece of equipment (e.g. a flashlight, length of rope, a weapon, etc.) in their current location.","group":"Diverse talent","kind":"pulp","id":"tal-resourceful"},{"name":"Scary","description":"reduces difficulty by one level or gains bonus die (at the Keeper’s discretion) to Intimidate rolls.","group":"Diverse talent","kind":"pulp","id":"tal-scary"},{"name":"Shadow","description":"reduces difficulty by one level or gains bonus die (at the Keeper’s discretion) to Stealth rolls, and if currently unseen is able to make two surprise attacks before their location is discovered.","group":"Diverse talent","kind":"pulp","id":"tal-shadow"},{"name":"Sharp Witted","description":"able to collate facts quickly; gain a bonus die when making Intelligence (but not Idea) rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-sharp-witted"},{"name":"skill (an Extreme success)","description":"the goal has been partially achieved.","group":"Insane talent","kind":"insane","id":"tal-skill-an-extreme-success"},{"name":"Smooth Talker","description":"gain a bonus die to Charm rolls.","group":"Fysisk talent","kind":"pulp","id":"tal-smooth-talker"},{"name":"Stout Constitution","description":"may spend 10 Luck to reduce poison or disease damage and effects by half.","group":"Fysisk talent","kind":"pulp","id":"tal-stout-constitution"},{"name":"Strong Willed","description":"gains a bonus die when making POW rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-strong-willed"},{"name":"Tough Guy","description":"soaks up damage, may spend 10 Luck points to shrug off up to 5 hit points worth of damage taken in one combat round.","group":"Fysisk talent","kind":"pulp","id":"tal-tough-guy"},{"name":"Weird Science","description":"may build and repair weird science devices (see Weird Science, page 86).","group":"Diverse talent","kind":"pulp","id":"tal-weird-science"}]}</script>
<script type="application/json" id="bundled-abilities">{"version":1,"title":"Spesialregler for skapninger","source":"Malleus Monstrorum (Chaosium), Call of Cthulhu 7e og Pulp Cthulhu","note":"Statblokkene i fiendebanken er hentet maskinelt ut av boka. Denne fila er skrevet for hånd, og legger på mekanismene som ikke lar seg lese ut av en tabell: tellere som rulles hver runde, angrep med begrenset bruk, regenerering, og hvilke våpen som i det hele tatt biter. Oppføringene kobles til skapninger og NPCer på navn eller id. Oppføringene treffer både på id-en i fiendebanken og på navn, slik at en kopi lagt i rollelisten også får reglene med seg.","damage_sources":{"melee":"Nærkamp","firearm":"Skytevåpen","shotgun":"Hagle","fire":"Ild","electricity":"Elektrisitet","acid":"Syre eller kjemikalier","magic":"Formel","enchanted":"Fortryllet våpen","sound":"Lyd"},"effects":{"normal":"Full skade","half":"Halv skade, rundet ned","minimum":"Minste mulige skade fra terningene","fixed":"Fast antall poeng","immune":"Ingen skade","instant_death":"Død på stedet"},"entries":[{"match":["mm-flying-polyps","flying polyp","flying polyps"],"title":"Flying Polyp","abilities":[{"id":"tentacles","kind":"pool","name":"Tentakler","roll":"2D6","reset":"round","targetable":true,"unit":"tentakler","attack":{"name":"Tentakkel","skill":"85%","damage":"1D10","uses_db":false,"can_impale":false,"ignores_armor":true,"category":"melee"},"description":"Polyppen danner og oppløser tentakler hele tiden. Ved starten av hver runde slås 2D6 for hvor mange tentakler som kan angripe den runden. Hver av dem gjør ett angrep. Skaden er alltid 1D10, og fordi vesenet bare er halvveis materielt går den rett på HP — rustning hjelper ikke. Såret ser ut som uttørking eller vindbrenning.","house_note":"Boka har ingen regel for å slå tentakler av polyppen; de kommer og går av seg selv. Vil du likevel la spillerne hugge løs på dem, velger du «tentakkel» som mål i angrepsflyten — da går telleren ned i stedet for HP-en. Husk at 2D6 slås på nytt neste runde uansett.","unit_one":"tentakkel","replaces":["Tentacle","Tentacles"]},{"id":"windblast","kind":"limited","name":"Vindstøt","uses":1,"reset":"round","cost":"1 magic point per runde","attack":{"name":"Vindstøt","skill":"70%","damage":"5D6","uses_db":false,"can_impale":false,"category":"heavy","range":"18 meter"},"description":"En sylinder på 9 meter i tverrsnitt, med 18 meters grunnrekkevidde. Skaden er polyppens damage bonus — 5D6 for denne. Utover grunnrekkevidden faller den med 1D6 for hvert nye multiplum: 4D6 på 36 meter, 3D6 på 37 meter og oppover. Ofrene får huden flerret av seg og blåses bakover like mange meter som de mistet HP.","replaces":["Windblast","Wind blast"]},{"id":"fixing","kind":"note","name":"Fixing attack","description":"Fangstvinden. Rekkevidde 900 meter, går rundt hjørner og opp gjennom trapper. Hver runde: motstående slag mellom målets STR og polyppens POW — halv POW over 180 meter, full POW under. Vinner polyppen, kommer målet seg ikke unna den runden. Polyppen kan flytte i full fart mens den gjør dette. Flere mål innenfor 27 meter av hverandre kan tas samtidig; legg 5 % til hver enkelts sjanse for hvert mål utover det første."},{"id":"invisibility","kind":"note","name":"Usynlighet","description":"1 magic point per runde. Usynlig angriper den ikke med tentakler, men kan fortsatt bruke vindangrepene og kaste formler. Den som vil treffe den må først klare et Listen-slag for å høre hvor pipelyden kommer fra, og trekker deretter 50 prosentpoeng fra treffsjansen. Er den ikke helt usynlig, trekkes polyppens POW fra treffsjansen i stedet, siden den hele tiden glir inn og ut av syne.","scenario_note":"I A Slow Boat to China er polyppen rasende og blir SYNLIG hele veien. Da faller både Listen-slaget og de 50 prosentpoengene bort — men den fortsetter å flimre, så POW-fradraget kan du fortsatt bruke om du vil ha den vanskelig å treffe."}],"damage":{"note":"4 poeng rustning, og bare minste mulige skade fra fysiske våpen. Fortryllede våpen, ild og elektrisitet gjør full skade.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-crawling-ones","crawling one","crawling ones"],"title":"Crawling One","abilities":[{"id":"no-natural-attack","kind":"note","name":"Ingen naturlige angrep","description":"En crawling one har ingen egne angrep og må bruke våpen som alle andre. Treffsjanse og skade følger våpenet den har fått tak i."},{"id":"dissolve","kind":"note","name":"Oppløsning","description":"Blir den alvorlig truet, faller den fra hverandre til enkeltmark og -larver som spreller ned mellom gulvplankene. I praksis kan den ikke drepes med vanlige midler med mindre den trenges opp et sted den ikke kan renne ut av."},{"id":"consume-likeness","kind":"note","name":"Consume Likeness","description":"Den kan ta skikkelsen til ethvert menneske den dreper og spiser. En ny skikkelse bruker 48 timer på å utvikle stemmebånd. I egen skikkelse kan den ikke lage lyd i det hele tatt, og må kommunisere skriftlig — men trenger ikke ord for å kaste formler."}],"damage":{"note":"Kroppen er myk og ettergivende. Vanlige våpen gjør minste mulige skade; kuler gjør ett eneste poeng; haglskudd gjør minste mulige skade for den typen våpen. Ild, syre og elektrisitet er ikke nevnt i boka; her er de satt til full skade, siden en haug med mark åpenbart brenner. Bytt skadetype i angrepsflyten hvis du vil ha det strengere.","rules":[{"source":"shotgun","effect":"minimum"},{"source":"firearm","effect":"fixed","value":1},{"source":"fire","effect":"normal"},{"source":"acid","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-hunting-horrors","hunting horror","hunting horrors"],"title":"Hunting Horror","abilities":[{"id":"two-attacks","kind":"note","name":"Bitt og hale i samme runde","description":"En hunting horror kan gjøre både bitt og haleangrep i samme runde. Kjør begge angrepene fra kampkortet før du går til neste tur."},{"id":"tail-grapple","kind":"note","name":"Halegrep","description":"Halen snører seg om offeret og holder det fast. Skapningen kan fly av gårde med det, eller fortsette å slåss. Offeret slipper løs bare ved et motstående STR mot STR. Mens noen henger i halen, kan skapningen bare bite — men får +20 % på treffsjansen mot den som dingler. Den som er grepet får som regel ikke slått tilbake fysisk, men kan bruke formler."},{"id":"daylight","kind":"note","name":"Oppløses av dagslys","description":"Direkte dagslys tar livet av den. Om bord betyr det at den må håndteres før daggry, eller drives ut på åpent dekk. Et kraftig nok lysglimt kan svi den til støv."}]},{"match":["mm-chthonian-full-adults","chthonian","chthonian full adult","chthonian full adults"],"title":"Chthonian","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","amount":5,"reset":"round","dies_at_zero":true,"description":"Leger 5 HP hver runde etter å ha blitt såret — men dør umiddelbart om den først kommer ned i null."},{"id":"water","kind":"note","name":"Vann er dødelig","description":"Vann er giftig for chthonians. Om bord på et skip er dette den mest nærliggende utveien."},{"id":"con-drain","kind":"note","name":"CON-tapping","description":"Nærheten til en chthonian tapper CON hver runde. Se statblokka for angrepslinja."}]},{"match":["mm-dark-sargassum","dark sargassum"],"title":"Dark Sargassum","damage":{"note":"Skytevåpen gjør ett poeng; en spidding fra skytevåpen gjør to. Hagler er unntaket og gjør minste mulige skade. Nærkampvåpen gjør full skade. Ild, sprengning, etsing, elektrisitet og gift har ingen virkning.","rules":[{"source":"shotgun","effect":"minimum"},{"source":"firearm","impaling":true,"effect":"fixed","value":2},{"source":"firearm","effect":"fixed","value":1},{"source":"fire","effect":"immune"},{"source":"electricity","effect":"immune"},{"source":"acid","effect":"immune"},{"source":"any","effect":"normal"}]}},{"match":["mm-dwellers-in-the-depths","dwellers in the depths","dweller in the depths"],"title":"Dweller in the Depths","abilities":[{"id":"brain-organ","kind":"weakspot","name":"Hjerneorganet","chance":10,"effect":"instant_death","description":"Skapningen er immun mot nesten all fysisk skade. Unntaket er hjerneorganet: et treff der dreper den på stedet. Ethvert treff har 10 % sjanse for å treffe organet — slå 1D100 etter et treff, og på 10 eller lavere er den ferdig."}],"damage":{"note":"Immun mot det meste av fysisk skade. Ild, elektrisitet og magi gjør full skade.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-nioth-korghai","nioth-korghai"],"title":"Nioth-korghai","abilities":[{"id":"solar-plexus","kind":"weakspot","name":"Solar plexus","chance_of_skill":10,"effect":"instant_death","description":"Skapningen kan ikke såres andre steder enn i solar plexus. For å treffe der må angriperen slå 10 % eller mindre av sin egen treffsjanse. Et treff der med et blyvåpen dreper den på stedet."}],"damage":{"note":"Alt annet enn et treff i solar plexus preller av.","rules":[{"source":"any","effect":"immune"}]}},{"match":["mm-servitors-of-the-outer-gods","servitors of the outer god","servitors of the outer gods"],"title":"Servitor of the Outer Gods","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","amount":3,"reset":"round","description":"Leger 3 HP hver runde helt til den er død."}],"damage":{"note":"Ingen fysiske våpen biter. Magiske våpen gjør full skade.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-star-spawn-of-cthulhu","star-spawn of cthulhu"],"title":"Star-spawn of Cthulhu","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","amount":3,"reset":"round","description":"Leger 3 HP hver runde. Med 10 poeng rustning i tillegg må skaden komme fort for å bety noe."}]},{"match":["mm-spawn-of-abhoth","spawn of abhoth"],"title":"Spawn of Abhoth","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D20","reset":"round","description":"Leger 1D20 HP hver runde. Slås på nytt hver runde."}]},{"match":["mm-gof-nn-hupadgh-shub-niggurath","gof'nn hupadgh shub-niggurath"],"title":"Gof'nn Hupadgh Shub-Niggurath","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D6","reset":"round","description":"Leger 1D6 HP hver runde helt til den er død."}]},{"match":["mm-thralls-of-cthulhu","thralls of cthulhu"],"title":"Thrall of Cthulhu","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D6","reset":"round","description":"Leger 1D6 HP hver runde. En thrall som slås ned til null av fysiske angrep, reiser seg helt uskadd igjen etter 1D8+1 runder. Magiske angrep er det som virkelig biter."}]},{"match":["mm-spawn-of-the-green-abyss","spawn of the green abyss"],"title":"Spawn of the Green Abyss","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D3","reset":"round","description":"Leger 1D3 HP hver runde."}],"damage":{"note":"Immun mot vanlige våpen. Formler, fortryllede våpen, ild, elektrisitet og kjemikalier biter.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"acid","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-broodlings-of-eihort","broodlings of eihort"],"title":"Broodling of Eihort","abilities":[{"id":"regrow","kind":"note","name":"Gjenvekst","description":"Slipper en broodling unna med så mye som ett HP igjen, kan den vokse helt ut igjen. Det tar 10 minutter per HP."}],"damage":{"note":"Alle fysiske angrep gjør minste mulige skade.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-adumbrali","adumbrali"],"title":"Adumbrali","damage":{"note":"Skyggeaktig. Immun mot alle verdslige våpen. Bare fortryllede våpen og formler som angriper POW eller INT biter.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-chakota","chakota"],"title":"Chakota","damage":{"note":"Immun mot fysiske våpen. Ild, magi og elektrisitet biter. Dekkes munnene til, kan den kveles i jord eller vann.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-cold-ones","cold one","cold ones"],"title":"Cold One","damage":{"note":"Immun mot alle fysiske angrep. Ild gjør 2D6 per treff med fakkel eller tilsvarende.","rules":[{"source":"fire","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-lumens","lumen","lumens"],"title":"Lumen","damage":{"note":"Immun mot alt som ikke er magisk.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-denizens-of-s-glhuo","denizens of s'glhuo"],"title":"Denizen of S'glhuo","damage":{"note":"Levende lyd. Immun mot all fysisk skade. Formler mot INT eller POW virker normalt, og skurrende lyd er særlig effektivt.","rules":[{"source":"sound","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-beings-of-ib-ghost-beings-of-ib","beings of ib & ghost-beings of ib"],"title":"Ghost-being of Ib","damage":{"note":"Gjenferdene kan ikke skades fysisk i det hele tatt. Formler som angriper eller tapper POW eller INT virker.","rules":[{"source":"magic","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-spawn-of-nyogtha","spawn of nyogtha"],"title":"Spawn of Nyogtha","damage":{"note":"Immun mot kuler og spiddevåpen, og tar minste mulige skade fra alt annet. Også immun mot ild, syre og stråling.","rules":[{"source":"firearm","effect":"immune"},{"source":"shotgun","effect":"immune"},{"source":"any","impaling":true,"effect":"immune"},{"source":"fire","effect":"immune"},{"source":"acid","effect":"immune"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-martians","martian","martians"],"title":"Martian","damage":{"note":"Alle fysiske våpen gjør halv skade.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"half"}]}},{"match":["mm-children-of-the-wind","children of the wind"],"title":"Child of the Wind","damage":{"note":"Spekkete hud: spiddevåpen gjør bare halv skade. Alt annet gjør full skade.","rules":[{"source":"any","impaling":true,"effect":"half"},{"source":"any","effect":"normal"}]}},{"match":["mm-spawn-of-othuyeg","spawn of othuyeg"],"title":"Spawn of Othuyeg","damage":{"note":"Bare minimal skade fra spiddevåpen.","rules":[{"source":"any","impaling":true,"effect":"minimum"},{"source":"any","effect":"normal"}]}}]}</script>
<script type="application/json" id="bundled-talent-rules">{"version":1,"title":"Regler bak talentene","source":"Pulp Cthulhu og Call of Cthulhu 7e (Chaosium)","note":"Flere talenter sier bare «see Psychic Powers, page 83» eller «may spend 10 Luck points». Her står reglene de viser til, slik at man slipper å slå opp i boka midt i en økt.","rules":[{"id":"psychic-powers","title":"Psykiske krefter","source":"Pulp Cthulhu s. 83–85","intro":"Talentet Psychic Power gir én psykisk kraft, og den er en ferdighet som alle andre — poeng må legges i den fra yrket eller fra personlige interesser. Startverdien er 00 %.\n\nÅ bruke en psykisk kraft koster magic points, på samme måte som formler. Har helten ikke nok igjen, slås et CON-slag: klarer hen det, holder hen seg våken og resten av kostnaden tas rett fra HP; ryker slaget, faller hen bevisstløs og kraften virker ikke.\n\nEt mislykket slag betyr at ingenting skjer — kostnaden i magic points er betalt og tapt. For de rundt ser det ut som at personen nøler et øyeblikk. Slaget kan pushes med en rimelig begrunnelse.\n\nVanskegrad: Regular når man har god tid i rolige omgivelser, Hard midt i dramatisk handling, for eksempel i en kamp.","sections":[{"title":"Telekinesis","body":"Flytter gjenstander med tankekraft. Helten kan bevege enhver livløs ting som et gjennomsnittsmenneske lett kunne løftet og kastet, for 1 magic point per gjenstand.\n\nUTENFOR KAMP: et Telekinesis-slag og 1 magic point flytter gjenstanden inntil 5 meter, normalt i hvilken retning man vil.\n\nI KAMP: et kombinert Telekinesis- og Throw-slag, og 1 magic point. Slaget må være lik eller under BEGGE ferdighetene for å telle som et avstandsangrep, og kan ikke pushes. Målet kan unnvike hvis det er klar over angrepet (motsatt slag mot den psykiskes). Skaden følger gjenstanden — vanligvis 1D4 til 1D6 for noe smått eller middels stort.\n\nSOM FORSVAR: telekinese kan brukes som usynlig rustning. Ett Telekinesis-slag per angrep, og 1 magic point gir 1 poeng rustning — 10 magic points gir 10 poeng. Slaget kan ikke pushes når det brukes slik.\n\nVALGFRITT: vil man flytte noe større enn ett menneske klarer, for eksempel en bil, settes kostnaden i magic points til hvor mange folk det realistisk ville tatt, og vanskegraden heves til Extreme. Gjenstanden kan ikke kastes eller løftes høyt, bare dras sakte inntil 3 meter."},{"title":"Clairvoyance","body":"Annet syn. Gir kunnskap om en gjenstand, en person, et sted eller en hendelse — også evnen til å ane gjenferd og usynlige Mythos-skapninger, grovt lokalisere noe som er borte, eller kjenne at noe tragisk har skjedd på et sted.\n\nHelten konsentrerer seg i 1D6 runder, bruker 1D6+1 magic points, og slår Clairvoyance. Mislykkes slaget, oppfattes ingenting; det kan pushes for ytterligere 5 magic points. Ved suksess får hen noe relevant å vite — hva og hvor mye er Keeperens avgjørelse, og er ofte vagt eller ufullstendig.\n\nKommer hen i kontakt med en fremmed intelligens, kreves et Sanity-slag med det vanlige tapet for den skapningen."},{"title":"Divination","body":"Spådom med et ritual — tarot, pendel, ouijabrett, runer. Retter seg mot ett bestemt spørsmål som kan besvares med ja eller nei: «Er det fare i huset i Ocean Avenue?», «Lever dr. Zarkov?» Alt utover det er opp til Keeperen.\n\nEn lesning tar 1D10 runder, koster 1D6 magic points og krever et vellykket Divination-slag."},{"title":"Medium","body":"Kontakt med ånder, kanskje til og med fremmede nærvær. Mediet åpner en del av sinnet sitt og blir en kanal. Det kommer ofte som en stemme gjennom mediets munn, men kan også være ord og setninger som dukker opp i tankene.\n\nMediet bruker 1D10 runder på å forberede seg. Ånder liker ikke alltid å bli kontaktet, og samtalen er kort — noen minutter på det meste. Mediet vet ikke hva det får tak i. Kaprer et ondsinnet nærvær seansen, kan mediet forsøke et motsatt POW-slag for å drive det ut. Mislykkes det, kan vesenet styre kroppen i inntil 1D10 runder før mediet besvimer og vesenet kastes av. Slikt krever som regel Sanity-slag."},{"title":"Psychometry","body":"Suger inntrykk og følelser ut av en fysisk, livløs gjenstand — en bok, et hus, et sigarettetui. Lesningen sier noe om hvem eieren er eller var, og hva slags menneske det er.\n\nHelten må ta på gjenstanden og konsentrere seg i 1D10 minutter uten å gjøre noe annet. Så slås Psychometry og 1D6+4 magic points brukes. Sterke følelser kommer først — sorg, hat, kjærlighet — deretter mer bestemte inntrykk: om gjenstanden er brukt til et drap, hvem den tilhører, eller hvor den har vært.\n\nOpplysningene bør holdes forholdsvis vage. Brukt ubesindig velter psychometry en etterforskning."}]},{"id":"weird-science","title":"Weird Science og dingser","source":"Pulp Cthulhu s. 86–88","intro":"Talentet Weird Science lar helten bygge og reparere weird science-innretninger. Talentet Gadget gir én ferdig dings ved spillets start. Hvor mye slikt som finnes i spillet, er Keeperens avgjørelse — i lavere pulp-nivå bør dingser stort sett ligge hos skurker og monstre.\n\nEn dings bør gjøre ÉN ting. En innretning bygget for å frakte folk til månen, frakter folk til månen — ikke til Jupiter.","sections":[{"title":"Å bygge en dings","body":"Helten må først skaffe delene, og ha verksted og verktøy. Det kan gå ut over spending level, tvinge fram salg av verdier, eller kreve at deler blir stjålet.\n\nSå kreves kunnskapen: Mechanical Repair, Electrical Repair, Computer Use, Occult — og Cthulhu Mythos for det virkelig esoteriske. Ett slag, eller et kombinert slag, avgjør om byggingen lyktes. Keeperen setter vanskegraden.\n\nTiden det tar, settes av Keeperen og skal øke med kompleksiteten: en enkel dings 1D10+5 timer, en sammensatt 1D10+5 dager eller måneder, en svært sammensatt 1D10+5 år."},{"title":"Vanskegrad etter hva dingsen gjør","body":"REGULAR: én enkel, ikke-ødeleggende funksjon. Eller den etterligner et ferdighetsslag med 40 % sjanse, slik at en ufaglært får 40 %.\n\nHARD: én sammensatt eller ødeleggende funksjon, for eksempel et våpen. Eller den etterligner et ferdighetsslag med 60 %. Eller den gir en bonusterning til ett bestemt ferdighetsslag, med 1D4 bruk.\n\nEXTREME: én svært sammensatt funksjon. Eller én bisarr funksjon. Eller den etterligner et ferdighetsslag med 90 %. Eller den gir en bonusterning med 1D10 bruk. Alt som har med Mythos å gjøre, ligger her.\n\n(Cthulhu Mythos kan aldri etterlignes av en dings.)"},{"title":"Når det går galt","body":"Et mislykket slag betyr at innretningen ikke virker, og det må gå like lang tid til før et nytt slag er mulig. Med en god begrunnelse kan slaget pushes — men følgen av et mislykket pushet slag skal være dramatisk, sannsynligvis eksplosiv, og koste HP. Et fumlet slag, pushet eller ikke, betyr at innretningen er fullstendig ødelagt.\n\nForslag til mislykkede pushede slag:\n• Dingsen virker en stund, men kan eksplodere når som helst: Luck-slag hver gang den brukes, og ved fiasko eksploderer den og gjør 1D6 skade på brukeren og alle innenfor halvannen meter.\n• Den går opp i en ildkule og gjør mellom 2D10 og 4D10 på alle innenfor tre meter.\n• Den virker ikke som tenkt, har en alvorlig bivirkning, eller oppfører seg farlig og uventet."},{"title":"Mythos-teknologi","body":"Mange Mythos-raser har sin egen teknologi. Den faller inn under weird science, men er ikke laget for mennesker. Havner den i menneskehender, er den vanskelig å bruke — brukeren skader som regel seg selv før hen får den til å virke. Mennesker kan heller ikke kopiere slike innretninger eller egentlig forstå hvordan de er laget."}]},{"id":"luck-spends","title":"Å bruke Luck","source":"Pulp Cthulhu s. 60–62","intro":"Flere talenter koster Luck å bruke. Dette er hele lista over hva en pulp-helt kan kjøpe med Luck-poengene sine.","sections":[{"title":"Justere et ferdighets- eller karakteristikk-slag","body":"Koster 1 for 1. Etter at slaget er gjort, kan Luck brukes til å endre resultatet, poeng for poeng. Det eneste taket er hvor mye Luck helten har igjen."},{"title":"«Det er bare en skramme!»","body":"Koster 20 Luck. Etter å ha tatt skade kan helten bruke 20 Luck og få tilbake 1D6 HP med én gang. Man kan ikke komme over maks HP. Keeperen kan også la dette brukes en stund etter at skaden ble tatt, som raskere helbredelse for en hardt skadet helt."},{"title":"Unngå en sikker død","body":"Koster alle Luck-poengene, minst 30. Har helten 30 eller flere igjen, kan alle brukes til å komme tilbake fra dødens rand: hen får 1D6+1 HP og dukker opp i neste scene i passende forfatning. Spilleren forteller selv hvordan det gikk til.\n\nHelten står da på null Luck resten av økta, og får neppe 30 igjen på en stund."},{"title":"Se bort fra en fumle eller en våpenfeil","body":"Koster 10 Luck. Sier slaget at nærkampvåpenet fumler eller at skytevåpenet feiler, kan 10 Luck brukes til å se bort fra følgen. Selve terningkastet står — angrepet er fortsatt bommet — men våpenet knekker ikke og geværet låser seg ikke."},{"title":"Halvere Sanity-tap","body":"Koster dobbelt så mye Luck som tapet. Etter et mislykket Sanity-slag kan tapet halveres ved å bruke Luck lik det dobbelte. Mister helten 8 Sanity, koster det 16 Luck å gjøre det om til 4."},{"title":"Holde seg våken","body":"Koster 1 Luck, og dobles hver runde. Ryker CON-slaget for å holde seg våken, eller er bevisstløshet automatisk, kan helten bruke 1 Luck for å stå oppreist ut runden. Neste runde koster 2, så 4, 8, 16 — betalt i starten av hver runde. Når Luck tar slutt, eller helten ikke vil betale mer, faller hen om."}]},{"id":"dive-for-cover","title":"Å dykke i dekning","source":"Call of Cthulhu 7e, kapittel 7","intro":"Skytevåpen kan ikke unnvikes på vanlig vis. Det målet kan gjøre, er å kaste seg i dekning — og det koster neste handling.","sections":[{"title":"Slik det spilles","body":"Målet slår Unnvikelse mot skytterens slag. Lykkes det, treffer ikke skuddet, men målet mister neste handling i runden.\n\nTalentet NIMBLE fjerner den kostnaden: helten mister ikke neste handling når hen dykker i dekning mot skytevåpen.\n\nKamptrackeren gir «Dykk i dekning» som forsvarsvalg mot alle avstandsangrep, og setter tilstanden «Mister neste handling» på den som brukte det. Har figuren Nimble, fjerner du bare den tilstanden igjen."},{"title":"Undertrykkende ild","body":"En skytter med automatvåpen kan hose ned et område uten å peke ut ett mål. Alle i området får valget om å dykke i dekning, og de som gjør det kan ikke skyte tilbake. Helter velger selv; alle andre antas å kaste seg ned. Deretter trekker Keeperen målet eller målene tilfeldig blant hele gruppa — også blant dem som kom seg i dekning, som da er vanskeligere å treffe."},{"title":"Liggende","body":"Den som ligger flatt er et mindre mål: skytevåpen mot en liggende figur får en straffeterning, med mindre det skytes på klosshold. Nærkampangrep mot en liggende får derimot en bonusterning.\n\nÅ ligge er også et stødig skytestativ: en liggende figur får en bonusterning på Firearms-slag. Man kan reise seg når man lykkes med å unnvike eller slå tilbake, eller bruke sin egen tur på å komme seg opp og så handle."}]},{"id":"manoeuvres","title":"Manøvrer og Build","source":"Call of Cthulhu 7e, kapittel 7, og Pulp Cthulhu s. 65","intro":"En manøver er alt som ikke er å gjøre skade: gripe, avvæpne, kaste noen i bakken, dra en bevisstløs venn ut av veien. Build avgjør om det i det hele tatt lar seg gjøre.","sections":[{"title":"Build mot Build","body":"Er målets Build ett hakk høyere enn angriperens, får angriperen en straffeterning på slaget. Er den to hakk eller mer høyere, lar manøveren seg ikke gjøre i det hele tatt.\n\nTalentet OUTMANEUVER regner helten som ett Build høyere når hen setter i gang en manøver — Build 1 teller som Build 2 — og gjør det dermed mindre sannsynlig å få straffeterningen."},{"title":"Knockout","body":"Pulp Cthulhu: en figur kan si fra at hen forsøker å slå motstanderen bevisstløs. På sin tur i DEX-rekkefølgen, eller som et overraskelsesangrep, behandles det som en manøver med et stumpt angrep — knyttneve, kølle, geværkolbe. Lykkes manøveren, er motstanderen ute, og tar bare 1 i skade.\n\nDet virker på alt som har en skalle eller et tilsvarende sårbart punkt: mennesker, deep ones, ghouls. Ikke på en shoggoth."}]},{"id":"multiple-shots","title":"Flere skudd i samme runde","source":"Call of Cthulhu 7e s. 113, og Pulp Cthulhu s. 71","intro":"Talentet RAPID FIRE fjerner straffeterningen for flere håndvåpenskudd i samme runde.","sections":[{"title":"Regelen","body":"Skyter man flere skudd i samme runde, får hvert skudd — også det første — en straffeterning. Rapid Fire fjerner den for håndvåpen.\n\nHvor mange skudd våpenet rekker, står i «angrep per runde» på våpenkortet. En Colt M1911 tar tre, en revolver som regel ett til tre."},{"title":"To våpen samtidig","body":"Valgfri regel i Pulp Cthulhu: hvem som helst kan skyte eller slå med to våpen, ett i hver hånd. Alle angrepene, også det første, får en straffeterning.\n\nFumlesjansen øker også: kreves 50 eller mer for å lykkes, fumler man på 96–100; kreves under 50, fumler man på 90–100. En våpenfeil inntreffer likevel bare innenfor våpenets egen feilgrense.\n\nÅ ha to våpen endrer ikke evnen til å slå tilbake — man slår tilbake med ett av dem."}]},{"id":"sanity-and-mythos","title":"Sanity og Cthulhu Mythos","source":"Call of Cthulhu 7e og Pulp Cthulhu s. 66","intro":"Talentene HARDENED og MYTHOS KNOWLEDGE griper begge inn i Sanity-reglene.","sections":[{"title":"Hardened","body":"Helten mister ikke Sanity av å angripe andre mennesker, av å se stygge skader, eller av å se lik. Mythos-syner rammer fortsatt som før."},{"title":"Mythos Knowledge","body":"Helten starter med Cthulhu Mythos 10. Husk at Cthulhu Mythos trekkes fra maks Sanity: taket er 99 minus Mythos-verdien. Ti poeng Mythos betyr et Sanity-tak på 89."},{"title":"Pulp-helter og sår","body":"Pulp-helter bruker ikke major wound-regelen. De dør av ett slag som er lik eller større enn maks HP. Er slaget på halve maks HP eller mer OG tar dem til null, ligger de for døden. Ellers besvimer de på null. Et slag på halve maks HP eller mer krever CON-slag for å holde seg våken — og der kan Luck brukes (se «Å bruke Luck»)."}]}],"talents":{"Psychic Power":["psychic-powers"],"Weird Science":["weird-science"],"Gadget":["weird-science"],"Heavy Hitter":["luck-spends"],"Master of Disguise":["luck-spends"],"Resourceful":["luck-spends"],"Stout Constitution":["luck-spends"],"Tough Guy":["luck-spends","sanity-and-mythos"],"Lucky":["luck-spends"],"Nimble":["dive-for-cover"],"Outmaneuver":["manoeuvres"],"Rapid Fire":["multiple-shots"],"Hardened":["sanity-and-mythos"],"Mythos Knowledge":["sanity-and-mythos"],"Quick Healer":["sanity-and-mythos"]}}</script>

<script>
"use strict";

/* ==================================================================
   LAGRING

   To bakender bak samme API. Når siden kjører som en publisert
   artifact finnes «db», og da følger fremdrift, notater og karakterer
   med mellom telefon og PC. Ellers — lokal fil, offline, en nettleser
   uten den kapabiliteten — brukes localStorage, og alt ligger lagret
   i den nettleseren. localStorage skrives uansett, som offline-kopi.
   ================================================================== */

const PREFIX = "eldritch:";
let remote = null;          // db-namespace, eller null
let remoteReady = false;

function lsGet(key) {
  try {
    const raw = localStorage.getItem(PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); }
  catch (e) { /* full eller blokkert — vi har fortsatt db-en */ }
}
function lsDel(key) {
  try { localStorage.removeItem(PREFIX + key); } catch (e) {}
}

const store = {
  async get(key) {
    if (remote) {
      try {
        const snap = await remote.doc("state/" + key.replace(/\//g, "_")).get();
        if (snap && snap.exists && snap.data && "value" in snap.data) {
          lsSet(key, snap.data.value);
          return snap.data.value;
        }
      } catch (e) { /* faller gjennom til lokal kopi */ }
    }
    return lsGet(key);
  },
  async set(key, value) {
    lsSet(key, value);
    if (remote) {
      try {
        await remote.doc("state/" + key.replace(/\//g, "_")).set({ value });
      } catch (e) { /* lokal kopi er allerede skrevet */ }
    }
  },
  async del(key) {
    lsDel(key);
    if (remote) {
      try { await remote.doc("state/" + key.replace(/\//g, "_")).delete(); }
      catch (e) {}
    }
  },
};

async function connectRemote() {
  const chip = document.getElementById("sync-chip");
  try {
    if (window.claude && typeof window.claude.use === "function") {
      remote = await window.claude.use("db");
    }
  } catch (e) { remote = null; }
  remoteReady = true;
  if (remote) {
    chip.textContent = "Synkes mellom enheter";
    chip.className = "chip live";
    chip.title = "Fremdrift, notater og karakterer følger med til andre " +
                 "enheter der du åpner denne siden.";
  } else {
    chip.textContent = "Lagret i nettleseren";
    chip.className = "chip local";
    chip.title = "Alt lagres i denne nettleseren. Bruk Eksporter i " +
                 "Biblioteket for å flytte det over på en annen maskin.";
  }
}

/* ==================================================================
   MODELL
   ================================================================== */

const SECTIONS = ["clues", "timeline", "beats", "npcs", "handouts",
                  "locations", "reference", "tactics"];
const FLAGS = { clues: "found", timeline: "triggered",
                beats: "done", locations: "visited",
                handouts: "found", tactics: "used" };

const state = {
  library: { items: [], active: null, seeded: {} },
  scenario: null,     // aktivt innhold, med fremdrift lagt på
  scenarioId: null,
  progress: null,     // { flags, notes, itemNotes, sessions }
  characters: [],
  bestiary: null,     // innebygd fiendebank, skrivebeskyttet
  weapons: null,      // innebygd våpenliste, skrivebeskyttet
  talents: null,      // innebygd talentoppslag, skrivebeskyttet
  abilities: null,    // innebygde spesialregler for skapninger
  talentRules: null,  // reglene talentene viser videre til
  combat: null,       // { active, round, turn, combatants, log }
  view: "overview",
  query: "",
  hideDone: false,
  charFilter: "all",  // all | pc | npc | enemy
};

/* ------------------------- rollelisten -------------------------- */

// Tre typer roller. Rekkefølgen her styrer også filterknappene.
const KINDS = [
  { key: "pc",    label: "Spiller",  plural: "Spillere", tone: "verdigris" },
  { key: "npc",   label: "NPC",      plural: "NPCer",    tone: "brass" },
  { key: "enemy", label: "Fiende",   plural: "Fiender",  tone: "signal" },
];
const KIND_LABEL = {};
KINDS.forEach((k) => { KIND_LABEL[k.key] = k.label; });

const CHAR_STATS = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW", "EDU",
                    "HP", "MP", "SAN", "Luck", "DB", "Build", "Move",
                    "Armor"];

let charSeq = 0;
function newId(prefix) {
  charSeq += 1;
  return prefix + "-" + Date.now().toString(36) + "-" + charSeq;
}

function normalizeChar(raw) {
  // Eldre filer fra Android-appen har feltene i småbokstaver på rot og
  // et «type»-felt med PC/NPC. Nyere fiender har «kind» og «stats».
  const c = Object.assign({}, raw);
  if (!c.id) c.id = newId("ch");

  if (!c.kind) {
    const t = String(c.type || "").toLowerCase();
    c.kind = (t === "npc") ? "npc" : (t === "enemy" ? "enemy" : "pc");
  }
  if (!KIND_LABEL[c.kind]) c.kind = "pc";

  if (!c.stats || typeof c.stats !== "object") c.stats = {};
  // Flate felter (str, con, hp …) løftes inn i stats-objektet.
  CHAR_STATS.forEach((k) => {
    const flat = c[k.toLowerCase()];
    if (c.stats[k] === undefined && flat !== undefined && flat !== "") {
      c.stats[k] = String(flat);
    }
  });

  if (!Array.isArray(c.attacks)) c.attacks = [];
  if (!c.skills || typeof c.skills !== "object" ||
      Array.isArray(c.skills)) c.skills = {};
  ["name", "occ", "archetype", "player", "notes", "backstory", "weapons",
   "talents", "insane_talents", "armor", "spells", "sanity_loss",
   "subtitle"].forEach((k) => {
    if (c[k] === undefined || c[k] === null) c[k] = "";
  });
  return c;
}

function charMaxHp(c) {
  const v = parseInt(c.stats && c.stats.HP, 10);
  if (!isNaN(v) && v > 0) return v;
  const con = parseInt(c.stats && c.stats.CON, 10);
  const siz = parseInt(c.stats && c.stats.SIZ, 10);
  if (!isNaN(con) && !isNaN(siz)) return Math.floor((con + siz) / 10);
  return 10;
}

async function saveCharacters() {
  await store.set("characters", state.characters);
}

function slugify(text, fallback) {
  const s = String(text || "").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return s.slice(0, 60) || fallback || "scenario";
}

function ensureIds(data) {
  SECTIONS.forEach((sec) => {
    (data[sec] || []).forEach((item, i) => {
      if (!item.id) {
        item.id = sec + "-" + i + "-" +
          slugify(item.title || item.name || "", String(i));
      }
    });
  });
  return data;
}

function emptyProgress() {
  return { flags: {}, notes: "", itemNotes: {}, sessions: [] };
}

function applyProgress(data, prog) {
  SECTIONS.forEach((sec) => {
    const flag = FLAGS[sec];
    (data[sec] || []).forEach((item) => {
      if (flag) item[flag] = !!prog.flags[item.id];
      const note = prog.itemNotes[item.id];
      item.userNotes = note || "";
    });
  });
  return data;
}

function contentOnly(data) {
  const copy = {};
  Object.keys(data).forEach((k) => {
    if (k !== "notes" && k !== "sessions") copy[k] = data[k];
  });
  return copy;
}

function counts(data) {
  const out = {};
  ["clues", "timeline", "beats", "npcs", "handouts", "locations",
   "reference"].forEach((k) => { out[k] = (data[k] || []).length; });
  return out;
}

/* ------------------------- bibliotek ---------------------------- */

async function loadLibrary() {
  const lib = await store.get("library");
  state.library = lib && typeof lib === "object"
    ? Object.assign({ items: [], active: null, seeded: {} }, lib)
    : { items: [], active: null, seeded: {} };
  if (!Array.isArray(state.library.items)) state.library.items = [];
  // seeded er {id: versjon}. Eldre lagringer har en liste; den
  // konverteres i seedBundled(), så her skal den bare ikke nullstilles.
  if (!state.library.seeded || typeof state.library.seeded !== "object") {
    state.library.seeded = {};
  }
}

async function saveLibrary() { await store.set("library", state.library); }

async function addScenario(data, makeActive) {
  ensureIds(data);
  const id = data.id ? slugify(data.id) : slugify(data.title);
  await store.set("content/" + id, contentOnly(data));

  // Notater og sesjoner i importfila er startinnhold. De skal aldri
  // tråkke over det brukeren selv har skrevet.
  const prog = (await store.get("progress/" + id)) || emptyProgress();
  if (data.notes && !prog.notes) prog.notes = data.notes;
  if (data.sessions && data.sessions.length && !prog.sessions.length) {
    prog.sessions = data.sessions;
  }
  await store.set("progress/" + id, prog);

  state.library.items = state.library.items.filter((it) => it.id !== id);
  state.library.items.push({
    id: id,
    title: data.title || "(uten tittel)",
    system: data.system || "",
    imported: new Date().toISOString().slice(0, 16).replace("T", " "),
    counts: counts(data),
  });
  state.library.items.sort((a, b) => a.title.localeCompare(b.title, "nb"));
  if (makeActive || !state.library.active) state.library.active = id;
  await saveLibrary();
  return id;
}

async function deleteScenario(id) {
  await store.del("content/" + id);
  await store.del("progress/" + id);
  state.library.items = state.library.items.filter((it) => it.id !== id);
  if (state.library.active === id) {
    state.library.active = state.library.items.length
      ? state.library.items[0].id : null;
  }
  await saveLibrary();
  await loadActive();
}

async function loadActive() {
  const id = state.library.active;
  state.scenarioId = id;
  if (!id) { state.scenario = null; state.progress = null; return; }
  const content = await store.get("content/" + id);
  if (!content) { state.scenario = null; state.progress = null; return; }
  const prog = Object.assign(emptyProgress(),
                             (await store.get("progress/" + id)) || {});
  state.progress = prog;
  state.scenario = applyProgress(ensureIds(content), prog);
  state.scenario.notes = prog.notes;
  state.scenario.sessions = prog.sessions;
}

async function saveProgress() {
  if (!state.scenarioId) return;
  await store.set("progress/" + state.scenarioId, state.progress);
}

async function seedBundled() {
  const node = document.getElementById("bundled-scenarios");
  let bundled = [];
  try { bundled = JSON.parse(node.textContent) || []; } catch (e) { return; }

  // Eldre lagringer har «seeded» som en liste med id-er. Regn dem som
  // versjon 1, slik at et oppdatert innebygd scenario byttes inn.
  let seeded = state.library.seeded;
  if (Array.isArray(seeded)) {
    const migrated = {};
    seeded.forEach((id) => { migrated[id] = 1; });
    seeded = migrated;
  } else if (!seeded || typeof seeded !== "object") {
    seeded = {};
  }
  state.library.seeded = seeded;

  let changed = false;
  for (const data of bundled) {
    const key = data.id || slugify(data.title);
    const version = data.version || 1;
    if (seeded[key] === version) continue;
    seeded[key] = version;
    changed = true;
    // Innholdet byttes ut; fremdriften ligger i en egen nøkkel og
    // røres ikke av addScenario().
    await addScenario(JSON.parse(JSON.stringify(data)),
                      !state.library.active);
  }
  if (changed) await saveLibrary();
}

/* ==================================================================
   HANDLINGER
   ================================================================== */

function findItem(id) {
  if (!state.scenario) return null;
  for (const sec of SECTIONS) {
    const hit = (state.scenario[sec] || []).find((x) => x.id === id);
    if (hit) return { section: sec, item: hit };
  }
  return null;
}

async function toggleFlag(id) {
  const hit = findItem(id);
  if (!hit) return;
  const flag = FLAGS[hit.section];
  if (!flag) return;
  hit.item[flag] = !hit.item[flag];
  if (hit.item[flag]) state.progress.flags[id] = true;
  else delete state.progress.flags[id];
  await saveProgress();
  render();
}

async function setItemNote(id, text) {
  const hit = findItem(id);
  if (!hit) return;
  hit.item.userNotes = text;
  if (text.trim()) state.progress.itemNotes[id] = text;
  else delete state.progress.itemNotes[id];
  await saveProgress();
}

async function resetProgress() {
  state.progress.flags = {};
  await saveProgress();
  await loadActive();
  render();
  toast("Fremdrift nullstilt");
}

/* ==================================================================
   SMÅVERKTØY
   ================================================================== */

let toastTimer = null;
function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach((k) => {
      if (k === "class") node.className = props[k];
      else if (k === "text") node.textContent = props[k];
      else if (k === "html") node.innerHTML = props[k];
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), props[k]);
      else if (props[k] !== null && props[k] !== undefined && props[k] !== false) {
        node.setAttribute(k, props[k]);
      }
    });
  }
  (children || []).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function matches(item, query) {
  if (!query) return true;
  const hay = [item.title, item.name, item.description, item.where,
               item.day, item.when, item.act, item.deck, item.role,
               item.category, item.roll, item.userNotes]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.indexOf(query.toLowerCase()) !== -1;
}

function debounce(fn, ms) {
  let t = null;
  return function () {
    const args = arguments;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(null, args), ms);
  };
}

/* ---------------------------- terning --------------------------- */

// Suksessnivåene i Call of Cthulhu 7e, rangert. Rangen brukes til å
// avgjøre motsatte slag (angrep mot unnvikelse eller mot-angrep).
const LEVEL_RANK = { "FUMLE": -1, "Bom": 0, "Suksess": 1, "Hard": 2,
                     "Ekstrem": 3, "KRITISK": 4 };

// Fumlegrensa: 100 fumler alltid, 96-99 fumler når ferdigheten er
// under 50.
function fumbleFrom(target) { return target < 50 ? 96 : 100; }

// Regn om et terningkast til suksessnivå. Selve kastet gjør vi ved
// bordet — denne tar imot tallet og sier hva det ble.
function gradeRoll(roll, target) {
  const t = Math.max(0, parseInt(target, 10) || 0);
  let label, cls;
  if (roll === 1) { label = "KRITISK"; cls = "res-crit"; }
  else if (t && roll <= Math.floor(t / 5)) { label = "Ekstrem"; cls = "res-extreme"; }
  else if (t && roll <= Math.floor(t / 2)) { label = "Hard"; cls = "res-hard"; }
  else if (t && roll <= t) { label = "Suksess"; cls = "res-reg"; }
  else if (roll >= fumbleFrom(t)) { label = "FUMLE"; cls = "res-fumble"; }
  else { label = "Bom"; cls = "res-fail"; }
  return { roll: roll, target: t, label: label, cls: cls,
           rank: LEVEL_RANK[label] };
}

// Grensene, slik de kan vises ved siden av feltet man skriver kastet i.
function thresholds(target) {
  const t = Math.max(0, parseInt(target, 10) || 0);
  return { extreme: Math.floor(t / 5), hard: Math.floor(t / 2),
           regular: t, fumble: fumbleFrom(t) };
}

function rollSkill(target) {
  return gradeRoll(1 + Math.floor(Math.random() * 100), target);
}

function setupDice() {
  const input = document.getElementById("dice-target");
  const out = document.getElementById("dice-out");
  function go() {
    const target = Math.max(1, Math.min(99, parseInt(input.value, 10) || 50));
    const r = rollSkill(target);
    out.className = "dice-out " + r.cls;
    out.innerHTML = "";
    out.appendChild(el("b", { text: String(r.roll) }));
    out.appendChild(document.createTextNode(" · " + r.label));
  }
  document.getElementById("dice-roll").addEventListener("click", go);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

/* ==================================================================
   TERNINGER OG KAMPREGLER  (Call of Cthulhu 7e)
   ================================================================== */

// «2D6+4», «1D10», «4D6/2D6/1D6» (haglegevær på tre avstander).
const DICE_TERM = /([+-]?)\s*(\d*)\s*[dD]\s*(\d+)|([+-]?)\s*(\d+)(?![dD\d])/g;

function parseDiceExpr(expr) {
  const s = String(expr || "").split("/")[0].trim();   // nærmeste rekkevidde
  const terms = [];
  let m;
  DICE_TERM.lastIndex = 0;
  while ((m = DICE_TERM.exec(s)) !== null) {
    if (m[3] !== undefined) {
      terms.push({ n: parseInt(m[2] || "1", 10), sides: parseInt(m[3], 10),
                   sign: m[1] === "-" ? -1 : 1 });
    } else if (m[5] !== undefined) {
      terms.push({ flat: parseInt(m[5], 10), sign: m[4] === "-" ? -1 : 1 });
    }
  }
  return terms;
}

function rollDiceExpr(expr) {
  const terms = parseDiceExpr(expr);
  let total = 0;
  const parts = [];
  terms.forEach((t) => {
    if (t.flat !== undefined) {
      total += t.sign * t.flat;
      parts.push((t.sign < 0 ? "-" : "+") + t.flat);
      return;
    }
    const rolls = [];
    for (let i = 0; i < t.n; i += 1) {
      rolls.push(1 + Math.floor(Math.random() * t.sides));
    }
    const sum = rolls.reduce((a, b) => a + b, 0);
    total += t.sign * sum;
    parts.push(t.n + "D" + t.sides + "[" + rolls.join(",") + "]");
  });
  // «+20» alene i en logglinje ser ut som en skrivefeil.
  return { total: total, detail: parts.join(" ").replace(/^\+\s*/, "") };
}

function maxDiceExpr(expr) {
  return parseDiceExpr(expr).reduce((sum, t) => sum +
    t.sign * (t.flat !== undefined ? t.flat : t.n * t.sides), 0);
}

// Damage bonus står som «+1D4», «+2D6», «0», «-1», «N/A».
function rollDamageBonus(db, mode) {
  const s = String(db || "").trim();
  if (!s || /^(0|n\/?a|ingen)$/i.test(s)) return { total: 0, detail: "" };
  const r = rollDiceExpr(s);
  if (mode === "half") {
    // Enkelte våpen bruker halv damage bonus, rundet ned.
    const half = r.total < 0 ? Math.ceil(r.total / 2) : Math.floor(r.total / 2);
    return { total: half, detail: r.detail + " halvert" };
  }
  return r;
}

/* Skaden fra ett treff. Nivået avgjør om et spiddevåpen spidder:
   maks skade fra våpenterningene pluss et nytt kast. Damage bonus
   kastes normalt og legges til der våpenet bruker den.            */
function rollAttackDamage(combatant, attack, label) {
  const crit = label === "KRITISK" || label === "Ekstrem";
  let total = 0;
  const bits = [];
  let impaled = false;

  if (attack.can_impale && crit) {
    const max = maxDiceExpr(attack.damage);
    const extra = rollDiceExpr(attack.damage);
    total = max + extra.total;
    bits.push("maks " + max, extra.detail);
    impaled = true;
  } else {
    const d = rollDiceExpr(attack.damage);
    total = d.total;
    bits.push(d.detail);
  }

  if (attack.uses_db && combatant && combatant.db) {
    const db = rollDamageBonus(combatant.db,
                               attack.uses_db === "half" ? "half" : "full");
    if (db.total) { total += db.total; bits.push("db " + db.detail); }
  }

  return { total: Math.max(0, total), impaled: impaled,
           detail: bits.filter(Boolean).join(" + ") };
}

/* ------------------- motsatte slag i nærkamp ---------------------

   Call of Cthulhu 7e: et nærkampangrep er et motsatt slag. Den som
   blir angrepet velger å unnvike (Dodge) eller slå tilbake (Fighting).
   Høyeste suksessnivå vinner; står det likt, vinner den med høyest
   ferdighetsverdi. Er også den lik, skjer ingenting.

   Skytevåpen slås ikke motsatt. Målet kan bare dykke i dekning, og
   mister da neste handling.                                       */

function opposedOutcome(att, def) {
  // att og def er resultater fra gradeRoll. def kan være null når den
  // angrepne ikke gjør noe.
  if (!att || att.rank <= 0) {
    return { winner: "attacker-failed", why: att && att.rank < 0
      ? "Angriperen fumler." : "Angriperen bommer." };
  }
  if (!def) return { winner: "attacker", why: "Ingen forsvarshandling." };
  if (att.rank > def.rank) {
    return { winner: "attacker", why: "Angriperen har høyest nivå." };
  }
  if (def.rank > att.rank) {
    return { winner: "defender", why: "Forsvareren har høyest nivå." };
  }
  // Likt nivå: høyest ferdighetsverdi vinner.
  if (att.target > def.target) {
    return { winner: "attacker", why: "Likt nivå — høyest ferdighet vinner." };
  }
  if (def.target > att.target) {
    return { winner: "defender", why: "Likt nivå — høyest ferdighet vinner." };
  }
  return { winner: "draw", why: "Likt nivå og lik ferdighet — uavgjort." };
}

/* Rustning trekkes fra skaden. Feltet er ofte en hel setning fra
   Malleus Monstrorum, så vi plukker ut første tall.               */
function armorValue(c) {
  const m = String((c && c.armor) || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}

/* Følgene av en skade, etter Call of Cthulhu og Pulp Cthulhu.

   Pulp-helter bruker ikke major wound-regelen: de dør av ett slag som
   er lik eller større enn maks HP, ligger for døden om et slag på
   halve maks HP eller mer også tar dem til null, og besvimer ellers
   på null. Et slag på halve maks HP eller mer krever CON-slag for å
   holde seg våken.

   Alle andre bruker vanlige regler: halve maks HP i ett slag er et
   major wound (CON-slag eller bevisstløs), null HP med major wound er
   døende.                                                          */
function woundOutcome(target, net) {
  const half = Math.ceil(target.hpMax / 2);
  const left = Math.max(0, target.hp - net);
  const out = { hpAfter: left, conditions: [], notes: [], major: false };

  if (net >= target.hpMax) {
    out.conditions.push("Død");
    out.notes.push("Ett slag på " + net + " er lik eller over maks HP (" +
                   target.hpMax + ") — død på stedet.");
    out.hpAfter = 0;
    return out;
  }
  if (net >= half) {
    if (target.pulp) {
      if (left === 0) {
        out.conditions.push("Døende");
        out.notes.push("Halve maks HP eller mer, og nede på null — " +
                       "døende. CON-slag hver runde, First Aid " +
                       "stabiliserer.");
        return out;
      }
      out.notes.push("Over halve maks HP i ett slag — CON-slag for å " +
                     "holde seg våken. (Pulp-helter tar ikke major wound.)");
    } else {
      out.major = true;
      out.conditions.push("Major wound");
      out.notes.push("Major wound: CON-slag eller bevisstløs, og " +
                     "figuren går i bakken.");
      if (left === 0) {
        out.conditions.push("Døende");
        out.notes.push("Null HP med major wound — døende.");
        return out;
      }
    }
  }
  if (left === 0) {
    out.conditions.push("Bevisstløs");
    out.notes.push("Null HP — bevisstløs.");
  }
  return out;
}
