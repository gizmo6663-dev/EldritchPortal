B":"+0","Move":"8","Armor":"se Spesielt"},"combat":["Angriper med det den har for hånden — treffsjanse og skade som våpenet tilsier","Svak i nærkamp — den foretrekker formler og lar håndlangerne ta det jordnære","Kan bytte mellom alle sine menneskeskikkelser i løpet av én kamprunde"],"skills":"Occult 90 %, Cthulhu Mythos 80 %, Stealth 60 %, Psychology 55 %. Språk: navaho, gammelmodig hoffspansk, mandarin, moderne wu-kinesisk og moderne amerikansk engelsk","spells":"Consume Likeness, Dominate, Mindblast (brukt i Den stjålne boka), Mental Suggestion, Gate, Graveyard Kiss (pulp-variant), Summon/Bind Hunting Horror, Pipes of Madness (via innretningen)","special":"OPPLØSNING: blir den alvorlig truet, faller den fra hverandre til enkeltinsekter som spreller vekk mellom gulvplankene — i praksis umulig å drepe med vanlige midler, med mindre den trenges opp et sted den ikke kan renne ut av.\n\nCONSUME LIKENESS: den kan ta form av ethvert menneske den dreper og spiser. En ny skikkelse bruker 48 TIMER på å utvikle stemmebånd — grunnen til at den måtte forlate Petersons skikkelse da Virginia ventet at han skulle snakke.\n\nEGENTLIG SKIKKELSE: kan ikke snakke eller lage lyd i det hele tatt, og må kommunisere skriftlig. Telegrammer er typisk.\n\nSPISING: etterlater bare skinn, hår og knokkelbiter — derav det hule rotteskinnet.","sanity_loss":"1D3/2D6 for å se den forvandle seg, eller se dens egentlige skikkelse","stats_note":"Karakteristikker fra Malleus Monstrorum (crawling ones). POW 100 er fastsatt av selve scenarioteksten — den opposed rollen for Mindblast — og overstyrer bokas 4D6+6.","forms":"Señor Diego Guiterrez de Almacan (hoveddekke) | Chad Peterson | Martin Dungass, overproviantforvalter | Haseye Adikai, en navaho-jente i tenårene | Du Zeming, en arret eldre kinesisk kvinne | hvem som helst annen den dreper om bord","notes":"Å finne den skal være katt og mus. Planen dens: prøvekjøre Pipes of Leng langt fra nysgjerrige øyne, og deretter sende seg selv og innretningen gjennom en Gate til Shanghai for å slutte seg til Eight Fortunes Mutual Aid Society."},{"id":"npc-almacan","name":"Señor Diego Guiterrez de Almacan","category":"Antagonist","role":"Skapningens dekkidentitet","description":"En tilbaketrukket spansk adelsmann i en lugar på første klasse på A-dekk som ikke står på noen liste — én dør unna heltene, hvis de bor der. Holder seg for seg selv, men kan sees promenere på dekk enkelte kvelder. Snakker et gammelmodig, høvisk spansk.","special":"Han står ikke på passasjerlisten. Overproviantforvalter Dungass la merke til det, gikk for å spørre, og døde av det.","notes":"Bruk ham som et ansikt, ikke som en motstander i kamp. Han er skapningen — se den oppføringen for karakteristikker.","stats_note":"Se The Crawling One."},{"id":"npc-bunny-bates","name":"Stuart «Bunny» Bates","category":"Antagonist","role":"Dominert gangster — skapningens hender","description":"Kastanjebrunt hår, store never, og en nese som er brukket noen ganger. Tre år med Capone-gjengen i Chicago, deretter et år i skjul i Wabasha Street-hulene i St. Paul, der han betalte politimesteren for å få være i fred. Hulene gjorde ham litt gal, og han er sulten på action. Med forbudstiden over er han ute etter å maksimere fortjenesten — eller i det minste finne en god opiumsforsyning i Shanghai.","stats":{"STR":"70","CON":"65","SIZ":"70","DEX":"60","INT":"55","APP":"45","POW":"50","EDU":"45","HP":"13","MP":"10","SAN":"25","DB":"+1D4","Build":"1","Move":"8"},"combat":["Fighting (Brawl) 60 %, skade 1D3+1D4",".32 revolver 50 %, skade 1D8","Thompson SMG 45 %, skade 1D10+2, burst 1/2/5 (hvis Keeperen vil legge ordentlig press på)"],"skills":"Intimidate 65 %, Stealth 50 %, Locksmith 45 %, Psychology 30 %","possessions":".32-revolver, en Tommy gun gjemt under dekk, stjålet mannskapsuniform","traits":"Målbevisst, ærgjerrig, kynisk","quotes":["«Hvorfor jeg skal til Japan? Pass dine egne saker.»","«Herregud, hva tar du meg for, en tyster? Pass dine egne saker.»","«Englekoret har befalt meg.»"],"special":"DOMINERT fra 7. desember. Skapningen må kaste Dominate på nytt hver natt (opposed POW roll). Helter som styrker viljestyrken hans — Hard Persuade eller Hard Psychoanalysis — gir ham en bonusterning til å stå imot.\n\nBelastningen driver ham inn i paranoid galskap. Den 17. desember bryter han fri lenge nok til å skrifte, hvorpå han knekker i løpet av en time og ikke lenger kan stå imot formelen i det hele tatt.","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Blir Bates drept eller satt i arresten tidlig, dominerer skapningen stuert Martin Aimesworthy i stedet, og han overtar Bates' rolle i alle senere scener."},{"id":"npc-flying-polyp","name":"Flying Polyp","category":"Monster","role":"Det maskinen kaller opp","description":"Et halvsynlig uhyre av umulig geometri, som beveger seg på vinder det lager selv. Tilkalt fra havbunnen av Pipes of Leng, og gjort rasende — ikke kontrollert — av dem. Når den stiger, åpner det seg en veldig malstrøm som får skipet til å krenge.","stats":{"STR":"50","CON":"25","SIZ":"50","DEX":"13","INT":"14","POW":"80","HP":"38","MP":"16","DB":"+5D6 (bare for vindstøtet)","Move":"8 / 12 flygende","Armor":"4"},"combat":["TENTAKLER: slå 2D6 ved starten av hver runde for hvor mange tentakler som kan angripe den runden. Hver av dem gjør ett angrep, 85 %, skade 1D10 — rett på HP, rustning hjelper ikke, fordi vesenet bare er halvveis materielt. Såret ser ut som uttørking eller ekstrem vindbrenning.","VINDSTØT: én gang per runde, 70 %, skade lik damage bonus (5D6). Sylinder på 9 meter i tverrsnitt, grunnrekkevidde 18 meter; skaden faller 1D6 for hvert nye multiplum av den avstanden. Knuser glass, slynger møbler, og blåser ofrene bakover like mange meter som de mistet HP.","FIXING ATTACK: fangstvinden, rekkevidde 900 meter, går rundt hjørner. Motstående STR mot polyppens POW hver runde — halv POW over 180 meter. Vinner polyppen, kommer målet seg ikke unna den runden.","Hvert vindangrep koster 1 magic point per runde.","Bruker 10 runder på å rive seg gjennom skroget til lasterom 7"],"armor":"4 poeng. Tar bare MINIMUM skade fra fysiske våpen. Fortryllede våpen, ild og elektriske angrep gjør full skade.","special":"På grunn av det fullstendige raseriet forblir den SYNLIG — som betyr at alle om bord ser den. Normalt glir en polyp inn og ut av syne, og da trekkes POW-en dens fra treffsjansen til den som skyter. Gjør den seg helt usynlig (1 magic point per runde), bruker den ikke tentakler i det hele tatt, men kan fortsatt vindangripe og kaste formler; da må man først klare et Listen-slag for å høre hvor pipelyden kommer fra, og trekker 50 prosentpoeng fra treffsjansen.\n\nStanser pipene, snur den og drar tilbake dit den kom fra, og etterlater seg en stripe av ødeleggelse. Fortsetter de å spille, legger den skipet i grus.","sanity_loss":"1D3/1D20 — slås av alle om bord","stats_note":"Karakteristikker fra Malleus Monstrorum. POW 80 og Armor 4 stemmer med scenarioteksten (den opposed rollen for Bind Flying Polyp og skadereglene). Skills: Hide 30 %, Track 35 %.","notes":"Se Regler: Å håndtere polyppen for de tre utveiene — ødelegg pipene, bind den, eller slåss. Tentakkeltelleren og vindstøtet er bygget inn i kamptrackeren i nettleserversjonen: 2D6 slås automatisk ved hvert rundeskifte, og hvert angrep bruker opp en tentakkel."},{"id":"npc-hunting-horror","name":"Hunting Horror","category":"Monster","role":"Valgfritt — tilkalt for å drepe heltene","description":"En repaktig, svart ting som pisker gjennom lufta, og som gjør vondt å se på. Tilkalt av skapningen når den vil ha helter eller tcho-tcho døde, og er villig til å ta oppmerksomheten det koster.","stats":{"STR":"30","CON":"10","SIZ":"42","DEX":"14","INT":"16","POW":"21","HP":"26","MP":"4","DB":"+3D6","Move":"7 / 11 flygende","Armor":"9"},"combat":["TO HANDLINGER: den kan bite OG bruke halen i samme runde.","Bite 65 %, skade 1D6","Tail 90 %, grapple — halen snører seg om målet og holder det fast. Den kan fly av gårde med offeret, eller bli stående og slåss. Offeret slipper løs bare ved et motstående STR mot STR.","Mens noen henger i halen, kan skapningen bare bite — men får +20 % på treffsjansen mot den som dingler. Den som er grepet får som regel ikke slått tilbake fysisk, men kan bruke formler."],"special":"Ødelegges av direkte sollys. Om bord betyr det at den må håndteres før daggry, eller drives ut på åpent dekk. Et kraftig nok lysglimt kan svi den til støv.","sanity_loss":"1D3/1D20","stats_note":"Karakteristikker fra Malleus Monstrorum. Rustning: 9 poeng hud, og den kan ikke impales av kuler. Sanity-tap 0/1D10.","notes":"En tung slegge. Scenarioet foreslår den for Keepere som vil gi heltene virkelig hard medfart, eller for å utslette tcho-tcho-ene hvis de avslår skapningens tilbud."},{"id":"npc-pipes-of-leng","name":"Pipes of Leng","category":"Innretning","role":"Energiinnretningen — hele plottets midtpunkt","description":"Tilsynelatende et kirkeorgel, dekket av ekstra ledninger, sikringsrør, slanger og underlige knuter, og for det meste dekket av blod. Står man tett inntil, hører man en illevarslende, hviskende summing. Selve pipene ble kjøpt, stjålet og plyndret fra tibetanske, nepalske og andre himalayiske kilder, og brakt til San Francisco for to år siden, der de ble satt sammen og stemt til ujordiske harmonier. Et orgelverksted i Portland og et lite elektrisk firma bygde mekanikken som spiller dem — i isolasjon og fullstendig uvitenhet om hva den skal brukes til.","stats":{"HP":"50","Armor":"3"},"special":"Å LADE DEN: fem menneskeofre, med blodet rennende ned i pipene.\n\nÅ SPILLE PÅ DEN: trekker til seg vesener fra Mythos, og påvirker alle innenfor 30 meter som formelen Pipes of Madness. Etter noen øyeblikk spiller den seg selv.\n\nFEILEN: den tilkaller, men holder ikke på noe. Alt den kaller opp, ankommer rasende og på jakt etter kilden til lyden.\n\nÅ ØDELEGGE DEN: 50 poeng skade mot armor 3. Det finnes ingen sprengstoff om bord.","stats_note":"HP 50 og Armor 3 står oppgitt i teksten.","notes":"Stuet i en diger kasse i lasterom 7."},{"id":"npc-captain-nelson","name":"Kaptein Henry Nelson","category":"Mannskap","role":"Skipsfører på SS President Coolidge","description":"Snøhvitt hår, velstelt bart, et meget fast håndtrykk. Nådeløs og effektiv. Nordmann, oppvokst i den franske kolonien Martinique, så den varme stemmen bærer en underlig aksent, og kolonifransken hans er utmerket. En ivrig pokerspiller som vet hvordan man bløffer, og vet når han blir bløffet.","stats":{"STR":"60","CON":"65","SIZ":"65","DEX":"55","INT":"75","APP":"60","POW":"70","EDU":"70","HP":"13","MP":"14","SAN":"70","DB":"0","Build":"0","Move":"7"},"skills":"Psychology 70 %, Fast Talk 95 %, Navigate 75 %, Persuade 60 %, Law 40 %, Language (French) 80 %","combat":["Fighting (Brawl) 45 %, skade 1D3","Revolver 55 %, skade 1D10 — ligger innelåst i lugaren hans"],"traits":"Slu, skarp, veloppdragen","quotes":["«God aften. Jeg går ut fra at De nyter reisen?»","«Hva i helvete er det som foregår her!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt. Psychology 70 % og Fast Talk 95 % står oppgitt i teksten.","notes":"Svært lite unngår oppmerksomheten hans. Helter som prøver å lure ham med tvilsomme opplysninger, blir diskré fulgt av stuertene. Vinn tilliten hans med Hard Charm eller Persuade, så kan han utnevne heltene — noe som åpner lasterommene på lovlig vis."},{"id":"npc-hugo-schramm","name":"Hugo Schramm","category":"Mannskap","role":"Førstestyrmann","description":"Lysebrunt hår, smalt ansikt, blyanttynn bart. Holdes travelt opptatt med passasjersaker og med å stille opp for kapteinen på skipets tilstelninger. Når det blir for mye, trekker han seg tilbake til kontoret og later som han ikke er der.","traits":"Smiler og nikker mye","quotes":["«Selvsagt, jeg skal ordne det med en gang.»","«Beklager, jeg hørte Dem ikke der ute!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Rådvill overfor forsvinningene, og under ordre om å holde dem stille. Ønsker første klasse og spesialklasse velkommen ved landgangen på avreisedagen, og undersøker Petersons lugar sammen med skipslegen Hartman."},{"id":"npc-albert-hallander","name":"Albert Hallander","category":"Mannskap","role":"Matros — tyv","description":"Blond og sterk, med grønne øyne. Født i Indonesia av nederlandske foreldre, med hang til smått tyveri. Han dirket opp låsen til Chad Petersons lugar for å rane den, og fikk en masse kakerlakker susende ut av stolen.","skills":"Locksmith 45 %, Stealth 50 %, Fast Talk 45 %, Persuade 30 %","traits":"Lusken, oppblåst, en ganske god løgner","quotes":["«Jeg gikk bare forbi, jeg skulle ha latt det være.»","«Jeg vet ingenting, det sverger jeg.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han roter heller til bildet enn å innrømme tyveriforsøk. En samlet innsats får ham til å tilstå — og da arresterer offiserene ham, som fjerner et vitne."},{"id":"npc-martin-aimesworthy","name":"Martin Aimesworthy","category":"Mannskap","role":"Stuert på første klasse","description":"Høy, blond, glattbarbert. Steller med behovene til første klasse. Pålitelig, ærlig og pliktoppfyllende. Blir han venn med heltene, deler han gjerne mistankene han har fanget opp.","traits":"Lojal og oppmerksom","quotes":["«Det er ingen sak. La meg ta meg av det.»","«Jo, det er et ordentlig oppstyr!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han tar avskjedsbrevet som bevismateriale om kvelden den 6. desember. VIKTIG: blir Bates tatt eller drept, kaster skapningen Dominate på Aimesworthy og bruker ham i Bates' sted fra da av."},{"id":"npc-martin-dungass","name":"Martin Dungass","category":"Offer","role":"Overproviantforvalter — død før scenarioet begynner","description":"Fortært av skapningen natt til 6. desember, etter at han gikk for å stille noen spørsmål til en passasjer som ikke sto på listene. Liket blir aldri funnet.","stats_note":"Trenger ingen karakteristikker — han er død på side én.","notes":"Mannskapets oppfatning er at han har gått på flaska og sover den ut under dekk; det går rykter om trøbbel med kona. Politiet i Honolulu fører det opp som drukningsulykke."},{"id":"npc-erik-hartman","name":"Dr. Erik Hartman","category":"Mannskap","role":"Skipslege","description":"Undersøker åstedet i Petersons lugar sammen med førstestyrmann Schramm, og holder funnene for seg selv, som han har fått ordre om.","skills":"Medicine 60 %, First Aid 70 %, Science (Biology) 45 %","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"En nyttig inngang for helter med medisinsk bakgrunn — kollegial høflighet er en enkel vei inn i lugaren."},{"id":"npc-other-crew","name":"Resten av mannskapet","category":"Mannskap","role":"Navn å slenge ut ved behov","description":"Sjeftelegrafist Marco Borrely (med ni radio- og telegrafoperatører under seg) | maskinsjef Oliver Grossmann | maskinistmat Wilhelm Schubert | fyrbøter Robert Reid, en av tjue junioringeniører | kjøkkensjef Anthony Deplace | vinkelner Phillipe d'Alsace | matros Hank Henson, som vokter Petersons dør | Arthur Benedict Carmel, sjef for femtifire kelnere | Ephraim «Fizzy» Walters, spydig hovmesterbartender | andrestyrmann Gustav Knutsen, på lastelukene om dagen | junioringeniør Barry O'Rourke, på dem om natta | Raymond Hickler, dirigent for Pacific Jazz Orchestra | Arthur Pendury, stallkar for hestene i lasterom 5","stats_note":"Statister — bruk vanlige matros- eller yrkesprofiler ved behov.","notes":"315–350 mann i alt. Gjenta kjente ansikter, så spillerne blir kjent med noen få faste."},{"id":"npc-chad-peterson","name":"Chad Peterson","category":"Offer","role":"Rik forlovede — fortært første natta","description":"Charles Chadwick Peterson fra New York. Upåklagelig kledd, grundig full på landgangen, hilser på alle han kolliderer med. Fortært i lugaren sin natt til 6. desember; fra da av er alle som ser «Peterson», i realiteten skapningen.","quotes":["«Chad Peterson fra New York, en fornøyelse å gjøre Deres bekjentskap.»"],"special":"Han skrev seg alltid Charles Chadwick Peterson, Charles Peterson eller C. C. P. — aldri «Chad». Avskjedsbrevet er undertegnet «Chad».","stats_note":"Trenger ingen karakteristikker — død før første natt er omme.","notes":"Det ekte brevet han la igjen til Virginia om morgenen den 6., lyder: «Virginia, hver dag vet jeg at jeg tok det rette valget. Bli med meg til sjøs! Din kjære Chad.» Sammenlign det med avskjedsbrevet."},{"id":"npc-virginia-ridley","name":"Virginia Ridley","category":"Passasjer — første klasse","role":"Dilettant og flapper — Petersons forlovede","description":"Kastanjebrunt hår, kurvete, en farlig gange. Født i Shanghai og oppdratt av en amah, i USA siden hun fylte femten. En beryktet New York-flapper, hvis familie tapte mye i krakket. Hun snakket Chad Peterson med på å bli med til Kina, og er ivrig etter å rekke kinesisk nyttår og vise ham barndomsbyen sin.","stats":{"STR":"45","CON":"55","SIZ":"50","DEX":"70","INT":"60","APP":"80","POW":"60","EDU":"60","HP":"10","MP":"12","SAN":"60","DB":"0","Build":"0","Move":"9"},"combat":["Shotgun (leirdue, bukkehagle) 55 %, skade 4D6/2D6/1D6"],"skills":"Charm 70 %, Dance 65 %, Firearms (Shotgun) 55 %, Language (Wu Chinese) 30 %","traits":"Flørtende, glad i våpen og spenning, en glimrende danser","quotes":["«Jeg fikk endelig den store tosken med til Kina, og så stikker han fra meg!»","«De finner ham, ikke sant? De må bare finne ham.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun og Peterson har separate lugarer på presidentdekket. Hun har ikke snakket med ham siden middagen rundt kl. 19.00 den 5. desember — skikkelsen kl. 21.30 var allerede skapningen, og noe ved ham plaget henne. Fra 9. desember skyter hun leirduer over akterenden for å få ut nervene, til stuertene ber henne slutte. En kandidat til det femte offeret."},{"id":"npc-charles-astor","name":"Charles Winston Astor","category":"Passasjer — første klasse","role":"Rik forretningsmann — Petersons venn","description":"Gode tenner, spiss hake, gråsprengt hår. En av New York-Astorene, og han lar sjelden noen glemme det. Han tjente pengene sine på gamlemåten — han arvet dem. Uteksaminert solid midt på treet fra Yale i 1895, og har siden drevet familiens fabrikker i Massachusetts og langs Hudson. Reiser i presidentsuiten, den fineste lugaren om bord, med sønnen James (25), butleren Walker (38) og datteren Elizabeth Anne (19).","stats":{"STR":"55","CON":"55","SIZ":"70","DEX":"50","INT":"60","APP":"55","POW":"55","EDU":"70","HP":"12","MP":"11","SAN":"55","DB":"+1D4","Build":"1","Move":"6"},"combat":["Rifle/Shotgun 55 % — skyter leirduer over akterdekket"],"skills":"Credit Rating 95 %, Persuade 55 %, Intimidate 50 %, Accounting 50 %","traits":"Selvsikker, uekte, forteller en god grisevits, kan skyte og jakte","quotes":["«Chip var en stor venn av meg, en nær venn, og han ville aldri gjort noe slikt.»","«Jeg forstår det ikke. Jeg bare forstår det ikke.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Fullstendig omgjengelig, og ikke spesielt interessert i å få venner under spesialklasse. Blir han venn med heltene, kan han legge inn et godt ord hos kapteinen hvis de havner i trøbbel. Han bekrefter forlovelsen mellom Peterson og Virginia, og insisterer på at «Chip» ikke var typen til å kaste seg ut av en koøye. Etter Honolulu understøtter han det med 1 000 dollar kontant for opplysninger som fører fram."},{"id":"npc-alex-hubbard","name":"Alex Hubbard","category":"Passasjer — første klasse","role":"Storviltjeger","description":"Overvektig, skallet, muskuløs. Berømt for å spore opp og drepe hva som helst som er verdt en tur over havet. Nåværende mål er det svarte pygmé-neshornet i Siam, som få vestlige har sett og enda færre har utstoppet i røykesalongen. Reiser uten annen plan enn stopp i Yokohama, Shanghai og Macao før Bangkok — «Asias kjøttgryter», som han kaller det.","stats":{"STR":"70","CON":"65","SIZ":"80","DEX":"55","INT":"55","APP":"45","POW":"55","EDU":"55","HP":"14","MP":"11","SAN":"55","DB":"+1D4","Build":"1","Move":"6"},"combat":["Winchester-rifle med kikkert 70 %, skade 2D6+4","Bukkehagle 60 % (fugleskrot)"],"skills":"Track 65 %, Natural World 55 %, Survival 50 %, Intimidate 45 %","possessions":"Winchester-rifle med kikkert, en bukkehagle til leirdueskyting med fugleskrot, og et eksemplar av Baedekers reisehåndbok for Siam og Indokina","traits":"Nådeløs, skrytende historieforteller, pratsom, revirhevdende","quotes":["«En mann som ikke jakter, er ikke stort til mann.»","(etter noen drinker) «Jo da, henne skulle jeg gjerne hatt i trofésamlingen.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Ved siden av neshornet har han kikket seg ut Virginia Ridley, og trøster henne i håp om å vinne hennes gunst. Bagasjen hans er den mest tilgjengelige ildkraften om bord for helter som trenger et våpen."},{"id":"npc-dr-soong","name":"Dr. Soong","category":"Alliert","role":"Okkult- og Mythos-forsker","description":"Hvitt hår og skjegg, skrøpelig, lett foroverbøyd, over 70 år. Like hjemme i tradisjonelle som vestlige klær, og like glad for å diskutere urtemedisin, taoisme eller religion. En overbevist kommunist inntil nylig, som tjente arbeiderne i Shanghai både som tradisjonell lege og som fortrolig og medsammensvoren — men han har valgt å reise i stil, på første klasse på båtdekket. Født i Shanghai; morsmålet er wu-kinesisk, mandarinen hans er brukken, engelsken langt bedre.","stats":{"STR":"35","CON":"45","SIZ":"50","DEX":"40","INT":"85","APP":"55","POW":"75","EDU":"85","HP":"9","MP":"15","SAN":"45","DB":"-1","Build":"-1","Move":"4"},"skills":"Occult 80 %, Cthulhu Mythos 25 %, Medicine 70 %, Science (Pharmacy) 65 %, History 60 %, Language (Mandarin) 40 %, Language (English) 70 %","traits":"Alvorlig, lærd, dysterhetsfull, og meget, meget skarp","quotes":["«Dette er min tjener, Wang Ma. Han vil svare på Deres spørsmål. Unnskyld meg.»","«Hendelsen er høyst uheldig. Beklagelig og uheldig.»"],"possessions":"En kiste med urtemedisiner, en liten doktorveske, og (fram til 7. desember) et eksemplar av Book of Red Jade","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"BAKGRUNN: han kjempet i årevis mot opiumshandelen, vestlig utbytting og nasjonalistisk propaganda, fikk noen lite hyggelige venner og en smak for opium selv, uten å falle i dyp avhengighet. I 1927 myrdet nasjonalistiske leiesoldater kona og to av hans tre sønner; han dro til USA med den gjenlevende sønnen og datteren, og tok opp Mythos-forskning på heltid.\n\nETTER 7. DESEMBER nevner han at han så Chad Peterson gå ut av lugaren sin rundt kl. 06.00 søndag den 6. — etter det antatte selvmordet.\n\nMERK: la ham ikke svare på alt eller redde dagen. Han er gammel og skrøpelig. Bruk ham til å peke, og til å løsne opp når heltene står fast. Han er også en kandidat til det femte offeret."},{"id":"npc-wang-ma","name":"Wang Ma","category":"Alliert","role":"Dr. Soongs tjener — myrdet 7. desember","description":"Kort og stygg, med bredt bryst, blek hud og et ondskapsfullt glis. Han steller doktorens klær, urtemedisinkista og hans personlige sikkerhet. Han er tcho-tcho, og leder for en liten flokk av dem som er booket på mellomdekket og tjener Soong for å innfri en gjeld — detaljene er det opp til deg å finne på. Noe i retning av at Soong har reddet livet til en del tcho-tcho.","stats":{"STR":"65","CON":"70","SIZ":"45","DEX":"60","INT":"60","APP":"30","POW":"55","EDU":"30","HP":"11","MP":"11","SAN":"45","DB":"0","Build":"0","Move":"8"},"combat":["Fighting (Brawl) 55 %, skade 1D3","Knife 60 %, skade 1D4+2"],"skills":"Stealth 60 %, Spot Hidden 50 %, Survival 55 %","traits":"Stø, modig, mistenksom","quotes":["«Mester Soong si nei.»","«Mester Soong ikke si.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Drept 7. desember mens han forsvarte Book of Red Jade, og begravet på havet kl. 15.00 den 8. Han erstattes ved Soongs side av Lo Mai, med samme karakteristikker; dør Lo Mai også, trer nye tcho-tcho inn etter tur."},{"id":"npc-phyllis-barnes","name":"Phyllis Barnes","category":"Passasjer — spesialklasse","role":"Musikklærer og godt menneske — offer 3","description":"Kraftig bygd, håret i knute, et glimt i øyet, korte negler. Rødlig hår og et lyst smil er hennes beste trekk. Hun spiller piano, orgel, harpe og fløyte og synger en myk alt, holder impromptu konserter nesten daglig ved lunsj eller middag, og underviser de rikere barna om bord — deriblant Astor-barna. Hun driver også veldedighetsarbeid på mellomdekket, og lærer bort musikk, matematikk og enkel tysk til småbarn. En peppermø, ung til sinns, kraftig bygd, men ikke ved beste helse, og en smule nysgjerrigper.","stats":{"STR":"45","CON":"45","SIZ":"65","DEX":"45","INT":"60","APP":"45","POW":"60","EDU":"65","HP":"11","MP":"12","SAN":"60","DB":"0","Build":"0","Move":"5"},"skills":"Art/Craft (Music) 75 %, Listen 55 %, Charm 50 %, Psychology 40 %","traits":"Rasistisk og fremmedfiendtlig, særlig overfor kinesere, og dertil dypt kristen","quotes":["«Jeg er i musikkrommet hvis noen trenger meg.»","«Jo, jeg hjelper gjerne, men jeg vet ikke om det er så mye jeg kan gjøre.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun påstår å ha sett «voldsomme slagsmål blant kineserne» mer enn én gang — en løgn hun forteller for å gjøre seg selv mer interessant. Spurt om Peterson sier hun at han oppførte seg underlig: de kom godt overens den første kvelden, men neste morgen ante han ikke hvem hun var. Hun kaller selvmordet «sludder», fordi hun har sett ham flere ganger siden.\n\nHun dør 13. desember, etter å ha fulgt musikken til lastelukene. Kroppen havner i en ballasttank i lasterom 4."},{"id":"npc-takishi-suroda","name":"Takishi Suroda","category":"Passasjer — spesialklasse","role":"Nysgjerrig forretningsmann — offer 1","description":"Muskuløs, men spedbygd, med bredt smil og ivrige øyne. En smykkehandler som nettopp har avsluttet en forretning i San Francisco som ser ut til å ha gått godt, og som nå er på vei til ferie i Honolulu. Han utnytter tida om bord til å slappe av og nyte turen.","skills":"Appraise 60 %, Charm 45 %, Persuade 45 %","traits":"Liker å vite hva alle andre driver med, en smule sladrehank","quotes":["«Hei, hva er det du har der?»","«Hei, jeg har lett etter deg! Hvor har du gjemt deg?»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Sannsynlig lugarkamerat for en mannlig helt på spesialklasse. Han er med vilje et blankt ark — bruk ham til å hjelpe, til å hindre, til å dele ut blindspor, eller bare til å være i veien. Han skal gå i land i Honolulu 10. desember; i stedet blir han det første offeret, og lugarkameraten finner senga urørt."},{"id":"npc-father-alvarez","name":"Pater Raphael Alvarez","category":"Alliert","role":"Jesuittisk misjonsprest","description":"Svart hår og bart, ru hud, hender med gjenger etter mange år i klosterhagen. Jesuitt, opprinnelig fra Mexico, med god merittliste i å undersøke det paranormale på vegne av Roma. Omplassert til Peking for å rapportere om de kristnes tilstand i den kinesiske hovedstaden — og i hemmelighet for å lete etter opplysninger om de eldgamle fruktbarhetskultene i de mongolske ørkenene. Han kan nok om Cthulhu Mythos til å ha mareritt.","stats":{"STR":"55","CON":"60","SIZ":"60","DEX":"55","INT":"70","APP":"55","POW":"75","EDU":"80","HP":"12","MP":"15","SAN":"70","DB":"0","Build":"0","Move":"7"},"skills":"Occult 55 %, Cthulhu Mythos 10 %, Psychology 60 %, Persuade 55 %, History 50 %, Library Use 60 %, Language (Latin) 70 %, Language (Chinese) 40 % og raskt stigende","traits":"Vennlig, logisk, nysgjerrig, oppmerksom, hjemsøkt","quotes":["«Jeg ville undersøkt sjøfolkene. Er selvmordet i virkeligheten et drap, kan de stå bak.»","«Velsigne deg, mitt barn. Velsigne oss alle.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han sier helst svært lite, med mindre han blir stilt direkte overfor bevis på Mythos-aktivitet, og stiller flere spørsmål enn han svarer på. Han tar gjerne imot skriftemål, holder messe og gir sjelesorg til alle om bord; det han ikke gjør, er å snakke om seg selv eller ordrene sine fra Roma. Han har brukt de siste ukene på å lære seg kinesisk fra ei bok, med praktisk hjelp fra stuertene.\n\nHan hører Bates' skriftemål 17. desember og bringer det til kapteinen. En sterk kandidat både til erstatningskarakter — og til det femte offeret."},{"id":"npc-miles-hardaway","name":"Miles Hardaway","category":"Passasjer — tredje klasse","role":"Pågående journalist — offer 2","description":"Bakoverglattet hår, spedbygd, gjennomtrengende blikk. En journalist fra San Francisco Chronicle, om bord for å skrive om reisen og dekke handelsmulighetene mellom USA og Kina.","skills":"Fast Talk 65 %, Persuade 55 %, Library Use 55 %, Spot Hidden 50 %","traits":"Nysgjerrig, sladrete og temmelig pågående","quotes":["«Si meg, fortell litt om deg selv.»","«Kan jeg få et sitat?»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han gjør et nummer av Peterson-saken, spiller opp «lukket rom»-vinkelen som et virkelig Sherlock Holmes-mysterium og telegraferer spekulasjoner i land. Enten en løpende plage eller ren bakgrunn, som du vil. Han lokkes til Almacans lugar og drepes 12. desember."},{"id":"npc-james-hawthorne","name":"James Hawthorne","category":"Mannskap","role":"Kenneljente, 17 år — vitnet som knakk","description":"Skvetten, mumlende, med blikket stadig søkende langs gulvet. Skriker og stikker inn i det lille hiet sitt så snart hun ser en edderkopp eller en kakerlakk. Hun steller over 30 hunder, 14 katter, 20 sjøsyke kyr og fem fullblodshester i lasterom 5.","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun så skapningen oppløse seg til en krypende masse nede i lasterommet, og det har gjort henne ubotelig gal. Beroliget — eller nådd med Psychoanalysis — snakker hun om «krypene» hun har sett komme og gå, marsjere som en hær, og om hvordan hun hører dem pile rundt inne i skipet, sikker på at de kommer for å spise henne.\n\nKommer heltene seg ikke ned i lasterommene før sent i reisen, er hun borte — tatt og ofret."},{"id":"npc-tcho-tcho","name":"Tcho-tcho","category":"Blindspor","role":"Lo Mai og seks arbeidere, booket på mellomdekket","description":"En liten flokk i dr. Soongs følge, som innfrir en gjeld til ham. De overvåker femti tønner merket «Hawaiian Botanical Specimens», og samles for seg selv i baugrommet, unna støyen på mellomdekket. Illevarslende, innadvendte — og i dette scenarioet ikke skurkene.","stats":{"STR":"60","CON":"65","SIZ":"45","DEX":"65","INT":"55","APP":"30","POW":"50","EDU":"30","HP":"11","MP":"10","SAN":"40","DB":"0","Build":"0","Move":"8"},"combat":["Fighting (Brawl) 50 %, skade 1D3","Knife 55 %, skade 1D4+2"],"skills":"Stealth 65 %, Survival 60 %, Spot Hidden 45 %","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"HENSIKTEN DERES ER Å VÆRE FEIL SVAR. Spilt rett fram er de nøytrale og kan hjelpe gjennom Soong. Spilt stygt kan de skifte side til skapningen underveis. Helter som gjennomsøker lasterom 1 om natta, møter dem, og de liker det dårlig med mindre heltene kan vise at de arbeider for dr. Soong.\n\nLo Mai trer inn i Wang Mas plass etter drapet. Avslår tcho-tcho-ene skapningens tilbud og heltene redder dem, erklærer den eneste overlevende, Sheng Tsin, seg som deres tjener for livet."},{"id":"npc-background-passengers","name":"Passasjerer i bakgrunnen","category":"Statister","role":"Navn å slenge ut ved behov","description":"FØRSTE KLASSE: Xin Yu, Yan Zou, Sissy McPatrick, Neal Westner, Deliah Conningway, Rupert Cocksure.\n\nSPESIALKLASSE: Ru Li, Shen Liu, Arthur Sellkirk, Maud Rendox, Jasper Conway, Lottie Unser.\n\nTREDJE KLASSE: Peng Chen, Fu Wang, Lan Wu, Daiyu Tang, Billy Royston, Ethel Rind, Paul Scott.\n\nLUGARKAMERATER PÅ TREDJE KLASSE: brødrene Po Liang og Po Hau, Pai Gow-givere innleid til kasinokvelden, og marinegast Olaf Gustavsen fra minesveiperen Abilene.\n\nUNDERHOLDERE: jazz- og kabaretsangerne Rebecca McCormick og Antonio Portaluppi.","stats_note":"Statister — ingen karakteristikker nødvendig.","notes":"678 passasjerer om bord. De andre passasjerene har omtrent ingenting bedre å gjøre enn å sladre og spekulere, og de fleste gjør det gjerne i det vide og brede med heltene."}],"handouts":[{"id":"handout-suicide-note","title":"Handout 1: Chad Petersons avskjedsbrev","found":false,"description":"Funnet på skrivebordet i Petersons lugar, og tatt med som bevismateriale av stuert Aimesworthy samme kveld.","read_aloud":"  MITT LIV HAR VÆRT EN LØGN BYGD PÅ MIN FARS PENGER.\n  TROSS MIN YTRE FASADE ER JEG EN HUL MILLIONÆR.\n  UTEN PENGER VET JEG AT JEG IKKE STREKKER TIL FOR Å\n  GJØRE DET JEG VILLE MED LIVET MITT. FARVEL, VERDEN,\n  JEG GÅR TIL ET BEDRE STED.\n\n                                              CHAD","aside":"HVA SOM ER GALT MED DET: underskriften. Han skrev seg Charles Chadwick Peterson, Charles Peterson eller C. C. P. — aldri bare «Chad». Håndskriften stemmer rimelig godt; å se forskjellene krever en Art/Craft (Calligraphy eller lignende) roll, eller Hard Spot Hidden, mot en kjent skriftprøve fra Virginia Ridley eller Charles Astor. Og «hul millionær» betyr en arving som ble ruinert i krakket i 1929 — noe Peterson ikke var.","connects_to":["clue-suicide-note-wrong","beat-the-empty-suit"]},{"id":"handout-book-of-red-jade","title":"Handout 2: Book of Red Jade","found":false,"description":"Et utsvevende verk av Mythos-kunnskap, som får enhver god konfucianer og enhver som har lest klassikerne, til å grøsse. Det spotter ikke bare Lao Tzus verk, men taoismen, keiseren og hele Manchu-dynastiets guddommelige status.\n\nBESKRIVELSE: langt og smalt — 344 tresnitt-trykte sider, 15 cm brede og 30 cm høye, på høvisk mandarin. Blekket er knallrødt som okseblod, med margnotater og treskjærersnitt i svart. Endeblader av blå silke med en urovekkende skimring i lyset, og tre innbundne, kunstferdig knyttede bokmerker i rød silke. Kalveskinn over tynne, men ekstremt harde trebord; skinnet er dekket av en lett grynet, vanntett lakk som skal ligne anløpet kobber eller mørkegrønn kleberstein. En treklørs messingdrage med ett øye pryder hvert omslag, festet under lakken.\n\nSJELDENHET: bare trettitre eksemplarer skal være laget; de kinesiske myndighetene ødela de fleste på 1830-tallet. Flere havnet på Filippinene og i USA med kinesiske innvandrerkultister. Ett skal befinne seg i British Museum.\n\nHISTORIE: skrevet i fengsel eller under tvang under Manchu-dynastiet, tilskrevet Zhou Lo Wei, «krigsherren av hundre mesterskap». Zhou dukker først opp i kinesiske kilder som alkymist fra de mongolske provinsene på 1830-tallet, og er bedre kjent etter at han kom til Peking i 1847, der han ble opiumsavhengig og lærd i klassikerne, og samlet en sekt av spyttslikkere og reformatorer som kalte seg «Sevenfold Hidden Path Clan» — antireligiøse fanatikere, utpressere og skolerte kriminelle som skremte hovedstaden i årevis. Zhou skaffet seg en stilling ved det keiserlige hoff i 1850 og misbrukte den grovt fram til 1861, da han ble pågrepet og tiltalt for ulovlig inntrengning i den keiserlige byen, trolldom og forbrytelser mot den offentlige orden. Han ble halshugget i Peking i 1862. Beretningene om begravelsen spriker — et annet lik kan ha blitt byttet inn, eller han kan ha oppløst seg i insekter på retterstedet.\n\nDET ER FULLT MULIG, JA SANNSYNLIG, AT ZHOU OG SKAPNINGEN ER DEN SAMME.\n\nMYTHOS-KUNNSKAP: prosessen for ghoul-forvandling; å tilkalle og binde en flying polyp; mongolenes og manchuenes historie med hensyn til star vampires og mi-go; og en drømmesekvens som viser direkte til Azathoth og Nyarlathotep. Verket omskriver også stoff fra Seven Cryptical Books of Hsan.\n\nSPILLDATA: mandarin. Sanity loss 1D10. Cthulhu Mythos +4/+8. Mythos Rating 36. Elleve uker for fullt studium; en første gjennomlesning tar 6 timer.\n\nFORESLÅTTE FORMLER: Cause/Cure Blindness, Consume Likeness, Dominate, Flesh Ward, Powder of Ibn-Ghazi, Summon/Bind Flying Polyp, Words of Power.\n\nMERK: helter uten mandarin kan, hvis de skaffer boka tilbake til dr. Soong, overtale den gode doktoren til å oversette deler av den — eller lære dem en formel som belønning. Bind Flying Polyp er den som betyr noe den 19. desember.","connects_to":["beat-the-stolen-book","npc-dr-soong","ref-dealing-with-the-polyp"]},{"id":"handout-genuine-note","title":"Handout 3: Det ekte brevet til Virginia","found":false,"description":"Lagt igjen til Virginia Ridley om morgenen 6. desember, i Petersons egen håndskrift.","read_aloud":"  Virginia, hver dag vet jeg at jeg tok det rette valget.\n  Bli med meg til sjøs!\n\n                                        Din kjære Chad","aside":"Bruk det som den kjente skriftprøven avskjedsbrevet sammenlignes mot — og som det lille hjertesukket som gjør at selvmordskjennelsen klinger falskt.","connects_to":["clue-suicide-note-wrong","npc-virginia-ridley"]}],"locations":[{"id":"loc-first-class","title":"Første klasse","deck":"Båtdekk, A-, B- og C-dekk","description":"214–307 passasjerer i ytterlugarer og suiter langs de øvre dekkene og forut. Fire suiter har eget bad og toalett; 32 lugarer deler bad; de fleste av de øvrige er enkeltlugarer med eget bad, og de billigste førsteklassebillettene er dobbeltlugarer med felles dusj. Alle har egen ovn, heldekkende teppe og overdådige lysarmaturer, malerier og møbler. Ingen køyesenger.\n\nSpisesalen på første klasse ligger på C-dekk midtskips, og nås ned en praktfull hovedtrapp forbi et stort veggmaleri av landene Dollar Lines skip anløper. En privat spisesal ligger like ved hovedsalen.\n\nFørste klasse har sitt eget mannskap, som vokter passasjerenes privilegier nidkjært.","visited":false},{"id":"loc-special-class","title":"Spesialklasse","deck":"B-dekk","description":"133 rom rett bak førsteklasselugarene — mindre, med felles bad, men brukes som førsteklasselugarer når etterspørselen tilsier det. 23 lugarer har plass til tre, 16 til fire; enkeltsenger med nedfellbare køyer over den ene eller begge. Spisesalen for spesialklasse ligger på C-dekk, litt lenger akterut enn førsteklassesalen.","visited":false},{"id":"loc-third-class","title":"Tredje klasse","deck":"C-dekk, akterut","description":"170 køyeplasser, ingen av dem i ytterlugarer. Spartanske lugarer med tre eller fire køyer, med plass til seks eller åtte, og faste — ikke nedfellbare — køyer. Hver lugar har speil, toalett og servant, og deler et fellesbad. Spisesalen for tredje klasse ligger helt akterut på C-dekk.\n\nDe fire forseglede lastelukene ligger på dette dekket — som er grunnen til at heltene ender opp her nede.","visited":false},{"id":"loc-steerage","title":"Mellomdekket","deck":"D-dekk, akterut","description":"Opptil 380 mennesker i seks store rom med 60 køyer hver, uten noe privatliv, ved de bråkete rormaskinene og de turboelektriske maskinene som driver propellene. Fungerer også som lasterom fra tid til annen. Mellomdekket bruker tredjeklassesalen etter at tredje klasse har spist.\n\nLengst fra skipets balansepunkt, så hver bølge kaster det høyere opp og ned enn noe annet sted om bord.","visited":false},{"id":"loc-amenities","title":"Fasiliteter og underholdning","deck":"Øvre dekk","description":"MUSIKKROMMET (B-dekk): flygler, harpe og andre instrumenter. Phyllis Barnes opptrer og underviser her.\nRØYKESALONGENE (A- og B-dekk): poker, canasta og bridge. Salongen på første klasse har et Rip Van Winkle-billedteppe, lenestoler i valnøtt, grønne sofaer, spillbord, gulv av grønne og rødlige gummifliser, og en peis i grønn marmor med elektrisk ild. Over peisen henger et glassmaleri, «Damen og enhjørningen». Salongen for spesialklasse på B-dekk har et maleri av Sierra Nevada, et portrett av president Coolidge, vinrøde stoler og enkle kortbord med nedfelte glassholdere og innebygde askebegre i glass.\nGRAND SALON: Raymond Hickler and His Pacific Jazz Orchestra hver kveld. Presidential Dance Orchestra spiller i ballsalen kl. 21.00 presis.\nCONTINENTAL LOUNGE (første klasse, A-dekk): en kuppel av 3 000 glassbiter og seter i blå fløyel. Film og filmavis fredag og lørdag — The Persian Pasha og Chaplins City Lights før Honolulu; At the Kentucky Derby og It Pays to Advertise med Louise Brooks etterpå. Her ligger også den fineste av skipets to barer.\nHAWAIIAN SALOON (C-dekk): den røffere baren. Begge er godt forsynt med brennevin, champagne, viner (også sake) og øl fra San Francisco og Yokohama.\nBIBLIOTEKET OG SKRIVESTUA PÅ FØRSTE KLASSE (A-dekk): et veggmaleri av dyphavets liv og rundt 4 000 bind — skjønnlitteratur, historie, økonomi, humanistiske oppslagsverk og tidsskrifter.\nBASSENGENE: to, åpne kl. 10.00–18.00 med livredder. Bassenget for spesialklasse og tredje klasse over lasterom 6 åpnes først i varmere farvann nær Hawaii.\nDESSUTEN: gymsal, barbersalong, brusbar, to elektriske heiser, mørkerom for fotografer, kapell, og et trykkeri om bord som kunngjør begivenheter og trykker invitasjoner. Hele skipet er klimaanlagt, noe som er uvanlig i 1931.","visited":false},{"id":"loc-bilges","title":"Bunnrommet","deck":"Under lasterommene","description":"Ballastvann, veldige tanker fulle av dieselolje, og lite annet. Rotter og annet skipsutøy er alt av uhygge som finnes — med mindre skapningen er tvunget over i utøyform, for da er det her den holder til.","visited":false,"connects_to":["npc-crawling-one"]},{"id":"loc-boilers","title":"Maskinrom og kjeler","deck":"Midtskips, under dekk","description":"Et inferno, betjent av 45 mann i døgnkontinuerlige skift på 15. De regulerer maskineriet, reparerer turbiner og kjeler, og betjener for hånd det innfløkte rørsystemet som mater dieselolje til kjelene og strøm til de turboelektriske maskinene.\n\nHelter som går inn, blir konfrontert med mindre de har klart Stealth rolls eller har fått en i mannskapet til å gi dem omvisning. Maskinistene fjerner alle som ikke skal være der, varsler offiserene og holder inntrengerne til kapteinen får tid til dem. Bare en Extreme Fast Talk eller Persuade overbeviser maskinistene om at heltene har lov til å gå rundt her nede alene.","visited":false},{"id":"loc-hold-1","title":"Lasterom 1 — baugrommet","deck":"Nederste dekk, forut","description":"ALLTID ULÅST. Møtestedet for tcho-tcho-ene og deres private sammenkomster, unna støyen på mellomdekket.\n\nSPOT HIDDEN finner to ting: restene av et lite bål laget av oppbrukne kasser, minst et døgn kaldt, med forkullede beinbiter i asken; og den utbrente asken fra en opiumspipe (Know eller Science (Chemistry eller Pharmacy) for å kjenne den igjen).\n\nHelter som leter her om natta, møter tcho-tcho-ene, som ikke liker inntrengingen med mindre heltene kan vise at de arbeider for dr. Soong.","visited":false,"connects_to":["clue-cold-fire","npc-tcho-tcho"]},{"id":"loc-hold-2","title":"Lasterom 2 — passasjerbagasje","deck":"Nederste dekk","description":"LÅST. Godt over 2 700 kolli: skipskofferter, kister, safer, tunge vesker, pakker i brunt papir og hyssing, hattesker, omhyggelig innpakkede urner og glassvarer, to dusin kasser fransk vin, og nok instrumenter til et lite symfoniorkester.\n\nPassasjerenes våpen og geværer oppbevares her — deriblant Alex Hubbards Winchester og hagle.","visited":false,"connects_to":["npc-alex-hubbard"]},{"id":"loc-hold-3","title":"Lasterom 3 — kjølerommet","deck":"Nederste dekk","description":"Låst med et håndtak som lett lar seg vri opp. Ferskvarer — kjøtt, frukt, melk og annen mat — samt blomster, vitenskapelige prøver og medisinsk utstyr. Kokkene er innom ofte for å fylle opp spiskammersene, noe som gjør dette til det lasterommet det er lettest å bli sett i på lovlig vis.","visited":false},{"id":"loc-hold-4","title":"Lasterom 4 — kasser og ballasttanker","deck":"Nederste dekk","description":"ULÅST. Over 2 000 trekasser, kister og skipskofferter, og en rekke ballasttanker.\n\nÅPNES TANKENE: de forråtnede restene av Phyllis Barnes. Å åpne den øvre luka slipper ut en sky av ufattelig vemmelig gass — CON roll eller kast opp av stanken. Å oppdage liket krever en Sanity roll (0/1D2).","visited":false,"connects_to":["clue-ballast-tank","npc-phyllis-barnes"]},{"id":"loc-hold-5","title":"Lasterom 5 — kenneler og buskap","deck":"Nederste dekk","description":"Alltid oppvarmet, bemannet og ulåst, og hele rommet lukter dyr. 20 sjøsyke kyr, fem fullblodshester med stallkaren Arthur Pendury (som er innom tre ganger daglig og av og til sover her framfor på mellomdekket), over 30 hunder og 14 katter — alt passet av kenneljenta James Hawthorne, 17 år.\n\nHawthorne er det beste vitnet om bord, og hun er i ferd med å gå i oppløsning.","visited":false,"connects_to":["npc-james-hawthorne","clue-kennel-boy"]},{"id":"loc-hold-6","title":"Lasterom 6 — kjøretøy og last","deck":"Nederste dekk","description":"ULÅST. Tre splitter nye Packard-sedaner, en Hudson turvogn, en Bugatti racer og et dusin Oliver-traktorer surret fast til dekket. Store containere med postsekker — hundrevis, om ikke tusenvis. Et dusin tønner fransk konjakk. Femti tønner merket «Hawaiian Botanical Specimens». En stor kasse merket «Funeral Supplies», med liket av en tcho-tcho som døde i San Francisco og sendes hjem på dr. Soongs regning.\n\nBassenget for spesialklasse og tredje klasse rigges som en avtakbar presenning over dette lasterommet.\n\nHVA SOM FAKTISK ER I TØNNENE, avgjør du: botanikk, noe ulovlig stuet inn av tcho-tcho-ene, eller menneskelik. Vaker heltene her, kan de få se en tønne bli åpnet og innholdet kokt og spist (Sanity 1/1D4), eller se «Chad Peterson» tilby tcho-tcho-ene en avtale.","visited":false,"connects_to":["beat-the-tcho-tcho","clue-funeral-supplies"]},{"id":"loc-hold-7","title":"Lasterom 7 — VERDIROMMET","deck":"Nederste dekk","description":"DOBBELTLÅST: en hengelås (Locksmith) og en slåbolt i luka (Hard Locksmith). Det er her alt sammen er.\n\nINNHOLD: tjueto oljemalerier i kasser, fire bronse- og fire marmorstatuer (også i kasser), en enorm forsendelse redwood-planker og -tømmer, seksten store glassballonger med farlige kjemikalier som eter og saltsyre, et skap med skipets beholdning av håndvåpen, geværer og hagler — og to ting som betyr noe:\n\nDEN GRØNNE METALLKASSA. To meter høy, låst (Hard Locksmith eller Hard STR for å bryte den opp). Ingeniørtegninger for energiinnretningen, med notater om montering, materialer, kostnader og konstruksjon, dekket av håndskrevne okkulte symboler. Å kjenne dem igjen som konstruksjonstegninger er enkelt (Mechanical Repair eller Science (Engineering)); å forstå at innretningen skal tilkalle uhyrer gjennom mekaniske midler for å fange essensen deres, krever en Cthulhu Mythos roll og minst to timers studium.\n\nORGELKASSA. Diger, merket «Wm. Wood Pipe Organ Co., Inc. of Portland, Oregon». Spot Hidden (Hard uten lyskilde) ser blodflekker på panelet på venstre side, og at skruene er skrudd ut og inn igjen mange ganger. Å åpne eller slå den opp er lett, og avdekker Pipes of Leng.\n\nSKAPNINGEN LIKER DÅRLIG at artefakten dens blir funnet. En enslig helt kan få en formel over seg — Mindblast, Dominate, Mental Suggestion. En gruppe kan få en hunting horror. Prøv å avlede heltene framfor å konfrontere dem for tidlig — med mindre du nærmer deg et passende klimaks, og da kaster du deg uti det.\n\nSALTSYREN i glassballongene gjør 1D10 per runde mot polyppen og ignorerer rustningen dens. Husk at den står her.","visited":false,"connects_to":["clue-green-metal-box","clue-blood-on-the-crate","npc-pipes-of-leng","beat-the-final-test"]}],"reference":[{"id":"ref-ship-stats","title":"SS President Coolidge — fullstendige data","description":"Bygget i august 1931 ved Newport News-verftet for Dollar Line — fire måneder gammel, og det største passasjerskipet som noen gang er bygget i USA (om enn ikke stort etter europeisk målestokk).\n\nSTØRRELSE\nLengde 654 fot | Bredde 81 fot | Dypgang 34 fot\nBruttotonnasje 21 936 tonn | Deplasement 30 924 tonn\nDekk: tre over hoveddekket, fem under\n\nLAST\nKapasitet 608 850 kubikkfot | Sju lasterom, fire nås fra dekk\nPlass til 100 kjøretøy i lasterom 4 | Kjølerom på 70 000 kubikkfot i lasterom 6\n18 lastevinsjer på 35 hk, løfter 3 000 pund direkte med 340 fot vaier i minuttet\nSeks Welin McLachlan-gravitasjonsdavider for livbåter; to båtvinsjer på 25 hk til lektere; seks kapstanvinsjer fra American Engineering Company\n\nVÅPEN OM BORD\nEn beholdning håndvåpen, geværer og hagler (til leirdueskyting) innelåst i lasterom 7. Kapteinen har en revolver innelåst i lugaren sin. Det finnes ikke sprengstoff om bord.\n\nMASKINERI\nTo turboelektriske Westinghouse på 13 250 hk | 12 høytrykkskjeler fra Babcock and Wilcox, fyrt med olje\nDamptrykk 300 psi | Kjeltemperatur 620 °F | To turbiner på 14 000 bhk | To propeller\nPropellturtall 133 o/min ved 22,2 knop | Toppfart 22,2 knop | Marsjfart 20 knop\nBunkers 6 240 tonn | Rekkevidde 19 500 nautiske mil i marsjfart, 14 500 for full fart\n\nFASILITETER\nMaks passasjerer 990 | Nødvendig besetning 324 | Maks om bord 1 314\nFerskvann 2 320 tonn | Belysning fra fire hjelpeturbingeneratorer på 500 kW, 240/120 volt\nTo svømmebasseng, ett på første klasse og ett som avtakbar presenning over lasterom 6\n\nDENNE REISEN: 678 passasjerer og 315 mann besetning, San Francisco til Shanghai via Honolulu. Fem døgn til Honolulu (5.–10. des), ni døgn videre til Shanghai (11.–19. des), beregnet ankomst kl. 06.00 den 20."},{"id":"ref-segregation","title":"Å bevege seg mellom klassene","description":"Skipet er svært synlig og gjennomført klassedelt. Første klasse, spesialklasse, tredje klasse og mellomdekket blandes nesten aldri, og dette er en reell hindring for et selskap som er spredt over flere dekk.\n\nÅ GÅ NED en klasse er mulig, selv om stuertene misliker at folk «slummer».\n\nÅ GÅ OPP er langt vanskeligere. Trappene voktes av stuerter, og de tre elektriske heisene har mannskap som heisførere (én heis er bare for last, inn på kjøkkenet). En passasjer trenger en invitasjon, en bestikkelse til et korrupt besetningsmedlem, eller en vellykket INTIMIDATE, CHARM, PERSUADE eller FAST TALK roll for å gå opp et dekk.\n\nÅ KLATRE er den farlige veien: en HARD CLIMB roll uten tau, vanlig vanskegrad med. Bommer man, faller man over bord — eller, i visse partier av skroget opp mot første klasse, ni meter ned på dekk for 3D6 skade. En snill Keeper kan la en vellykket Jump halvere skaden.\n\nBLIR MAN TATT: passasjerer fra første klasse og spesialklasse blir høflig fjernet og bestemt frarådet å komme tilbake. Tredje klasse behandles hardere. Passasjerer fra mellomdekket kan bli lenket til køya hvis de stadig sniker seg av gårde.\n\nMANNSKAPET kan bevege seg mellom klassene uten særlige problemer — som er grunnen til at en stjålet uniform er så mye verdt, og hvorfor skapningen bruker en."},{"id":"ref-key-rolls","title":"Alle slag i scenarioet, samlet på ett sted","description":"ETTERFORSKNING\nListen — høre oppstyret den 6. des; overhøre mannskapet om forvalteren; høre Soongs rop under tyveriet; høre den fjerne musikken om natta. HARD LISTEN plasserer musikken under dekk.\nSpot Hidden — «Funeral Supplies»-kassa på kaia; rotteskinnet i lasterommene; det kalde bålet og opiumsasken i lasterom 1; de gjenåpnede skruene på orgelkassa. HARD SPOT HIDDEN — blod på panelet uten lyskilde (vanlig vanskegrad med lys); forskjellene i håndskriften på avskjedsbrevet.\nPsychology — Hallander er i sjokk; en ny roll avslører løgnene; Hawthorne er livredd og trolig gal.\nArt/Craft (Calligraphy) — den forfalskede underskriften.\nCthulhu Mythos — hva tegningene faktisk er til (pluss to timers studium); riktig antall magic points for å binde polyppen.\nMechanical Repair eller Science (Engineering) — kjenne igjen konstruksjonstegningene.\nScience (Biology/Zoology) eller Art/Craft (Leatherwork) — rotteskinnet kan ikke ha blitt flådd.\nKnow eller Science (Chemistry/Pharmacy) — kjenne igjen opiumsaske.\n\nSOSIALT\nHard Persuade — få se passasjerlisten.\nIntimidate eller Persuade — få Hallander til å snakke.\nHard Charm eller Persuade — vinne kapteinens tillit.\nExtreme Fast Talk eller Persuade — overbevise maskinistene om at du har lov til å være under dekk.\nExtreme Persuade eller Fast Talk, eller Hard Psychoanalysis — snakke Bates ned fra gisseltakingen.\nHard Persuade eller Hard Psychoanalysis — styrke Bates mot Dominate (gir ham en bonusterning).\nIntimidate/Charm/Persuade/Fast Talk — gå opp et dekk.\n\nFYSISK\nJump — følge skapningens hopp ned på promenadedekket, ellers 1D6+3. Halverer også 3D6-fallskaden ved klatring i skroget.\nHard Climb — klatre mellom dekk uten tau (vanlig vanskegrad med tau).\nLocksmith — lastelukene; hengelåsen på lasterom 7; å bryte seg inn i Petersons lugar (eller Mechanical Repair). HARD LOCKSMITH — slåbolten på lasterom 7 og den grønne metallkassa.\nExtreme STR — tvinge opp en vanntett luke. HARD STR med brekkjern, eller for å bryte opp den grønne kassa.\nStealth — komme forbi vaktholdet på lastelukene og i maskinrommet.\nCON — unngå sjøsyke 18.–19. des; unngå å kaste opp ved ballasttanken.\n\nOPPOSED POW\nmot POW 100 — skapningens Mindblast og Dominate.\nmot POW 80 — Bind Flying Polyp (dette slaget kan ikke pushes)."},{"id":"ref-sanity","title":"Sanity-tap underveis","description":"Mindblast fra skapningen — 5 poeng og et umiddelbart anfall av galskap (opposed POW roll mot POW 100; ingen virkning hvis helten vinner).\nSe skapningen skifte form, eller se dens egentlige skikkelse — 1D3/2D6.\nSe tcho-tcho-ene koke og spise innholdet i en tønne — 1/1D4.\nFinne Phyllis Barnes i ballasttanken — 0/1D2.\nFlying polyp — 1D3/1D20, slås av alle om bord, fordi raseriet holder den synlig.\nHunting horror — 1D3/1D20.\nLese Book of Red Jade — 1D10 (Cthulhu Mythos +4/+8).\nKaste Bind Flying Polyp — 1 poeng.\nStadig større flådde dyr nede i lasterommene — be om slag der det passer."},{"id":"ref-sanity-awards","title":"Sanity-belønninger til slutt","description":"+1D6   Heltene hindrer Bunny Bates i å drepe gisselet\n+1D4   Heltene ødelegger energiinnretningen\n+2D6   Heltene fanger eller dreper skapningen\n−1D6   Skapningen slipper unna\n+1D20  Heltene beseirer polyppen\n+1D10  Heltene prøver å redde så mange som mulig fra å drukne\n−1D10+2 Heltene forlater skipet uten tanke for andre"},{"id":"ref-dealing-with-the-polyp","title":"Å håndtere polyppen — de tre utveiene","description":"1. ØDELEGG PIPENE. 50 poeng skade mot armor 3 stanser maskinen og lar polyppen dra. Sprengstoff ville hjulpet; det finnes ikke om bord. Når musikken stanser, kan polyppen bruke noen runder på å oppdage det — la den angripe så lenge du vil, og la den så plutselig stanse, snu, fly oppover og skyte ned i dypet.\n\n2. BIND DEN. Helter som har Book of Red Jade, kan forsøke Bind Flying Polyp. Den som kaster, kan ikke være i kamp med vesenet, må være innenfor 90 meter, og må vinne en opposed POW roll mot POW 80 — dette slaget KAN IKKE PUSHES. Formelen koster 1 Sanity point. Kasteren kan investere magic points tilsvarende en femtedel av vesenets POW (16 MP) for å få en bonusterning — men vet ikke vesenets POW, så det er et sjansespill; en vellykket Cthulhu Mythos roll gir riktig antall. Bundet faller polyppen under kasterens kommando og kan beordres ned i dypet igjen.\n\n3. SLÅSS MOT DEN. Trolig det vanskeligste alternativet. 4 poeng rustning, og den tar bare MINIMUM skade fra fysiske våpen — men fortryllede våpen, ild og elektriske angrep gjør full skade. Saltsyren i glassballongene i lasterom 7 gjør 1D10 per runde og ignorerer rustningen. For høyt pulp-nivå kan militært anlagte helter kalle inn nærliggende britiske, amerikanske eller japanske krigsskip: et batteri skipskanoner gjør 10D10, og en salve eller to bør ødelegge den eller såre den så alvorlig at den trekker seg ned i havet.\n\nDØR DEN, smeller kroppen ned på skipet med et tungt brak og begynner å gå i oppløsning nesten umiddelbart. I løpet av minutter er det ikke annet igjen enn en fettete væske og en vond lukt.\n\nUANSETT ER SKIPET TAPT. Hullet i skroget betyr at Coolidge tar inn vann og krenger. Spør heltene hva de vil gjøre."},{"id":"ref-optional-mayhem","title":"Valgfritt: mer kaos og gru (høyt pulp-nivå)","description":"For Keepere som vil kjøre dette på fullt pulp-nivå, bruker skapningen formelen Graveyard Kiss til å lage zombier.\n\nI denne varianten kaster den ikke likene av ofrene over bord, men lar Bates gjemme dem rundt om i lasterom 7 som en sikkerhet. Ved første tegn til trøbbel vekker den dem og sender dem etter de nærmeste levende menneskene — som betyr zombier som klatrer opp fra underdekkene og setter alle om bord i fare.\n\nSom skrevet er det bare fem zombier, som er lite utfordring for helter i Pulp Cthulhu. For å skalere det opp: la hver zombie lage flere. Skapningens variant av formelen krever at den legger en del av insektmassen sin i munnen på et lik for å vekke det, og vekkede zombier kan gjøre det samme — insekter som hopper fra deres munn og inn i munnen på passasjerer de har drept. I teorien kan en fullskala zombieapokalypse overta skipet mens heltene står overfor polyppen.\n\nZombiene er også en utmerket erstatning for Bunny Bates i gisselscenen, hvis Bates allerede er ute av bildet."},{"id":"ref-troublesome-heroes","title":"Valgfritt: når heltene kommer deg i forkjøpet","description":"GJØR DE LIVET SURT for skapningen, eller trenger handlingen et dytt, går Bunny Bates til overraskelsesangrep — særlig hvis de nærmer seg Almacans lugar eller snuser rundt lastelukene. Han kan dukke opp i døra til en helts lugar, eller hoppe fram mot dem nede i lasterommet.\n\nFOR VIRKELIG HARD MEDFART tilkaller skapningen en hunting horror som jakter dem ned. Det vekker mye oppmerksomhet, så den timer angrepet slik at færrest mulig ser det.\n\nNÅR DE NÅR PIPENE FOR TIDLIG, avled framfor å konfrontere: en enslig helt får en formel over seg (Mindblast, Dominate, Mental Suggestion), eller en gruppe trekker til seg en hunting horror. Går det dårlig for skapningen, oppløser den seg og kommer tilbake til maskinen senere. Ødelegger heltene Pipes of Leng, retter den blikket fast mot hevn.\n\nMISTER DU BATES TIDLIG — drept, i arresten, tatt til fange — dominerer skapningen stuert Martin Aimesworthy og setter ham inn i alle senere scener. Alternativt, for å holde det enkelt: la den dominere en annen NPC til å hindre heltene, slik at Bates overlever til sin rolle i klimakset."},{"id":"ref-dining","title":"Kulisser: måltider, underholdning og livet om bord","description":"En vanlig middag dekker minst 200 om gangen, og det ventes at man reserverer bord. Hummer, fasan og kalvekjøtt er forbeholdt første klasse — men selv tredje klasse spiser bedre enn mange ville gjort på land.\n\nFØRSTE KLASSE — sju retter. Hors d'oeuvres og østers; consommé Olga eller byggsuppe med fløte; laks med mousseline-saus og agurk; filet mignon, sautert kylling Lyonnaise eller friske grønnsaker; deretter lam i myntesaus, andestek i eplesaus eller oksemedaljonger med grønne erter, kokt ris, gulrøtter i fløte, kokte nypoteter og poteter Parmentier; så punch romaine, stekt due med crêper, kald asparges i vinaigrette, gåselever og selleri; og til dessert Waldorf-pudding, fersken i chartreusegelé, sjokolade- og vaniljeeclairs, eller fransk iskrem. Presidential Dance Orchestra spiller i førsteklassesalongen kl. 18.00–21.00 hver kveld, og tar imot ønsker.\n\nSPESIALKLASSE — consommé, ovnsbakt kolje i krydret saus, deretter karrikylling, vårlam i myntesaus eller kalkunstek med tyttebær, med grønne erter, kålrotstappe, kokt ris og kokte og stekte poteter. Dessert: plumpudding, vingelé, kokossmørbrød eller amerikansk iskrem, samt nøtter, frisk frukt, ost, kjeks og kaffe. Pacific Jazz Orchestra spiller kl. 19.00–21.00 annenhver kveld.\n\nTREDJE KLASSE — rissuppe, saltkjøtt og kål, kokte poteter, kjeks, ferskt brød og smør, stuede epler og ris til dessert, kaffe til desserten. Menyen skifter daglig, men måltidet er fast for dagen, servert kl. 18.00–20.00.\n\nMELLOMDEKKET — vasstrukket saltkjøtt og kål, kokte gulrøtter, kokte poteter, rispudding. Menyen skifter sjelden; av og til grønne bønner, eller bacon i potetsalat, eller ris i stedet for poteter. Servert kl. 20.00–21.00, etter at tredje klasse er ferdig.\n\nRØYKING: ikke forbudt innendørs generelt, men tredje klasse og mellomdekket forventes å røyke ute på C-dekk, under oppsyn av stuerter som frykter sigaretter, piper og sigarer som brannfare.\n\nTRYKKERIET kunngjør begivenheter, fester, festmiddager og merkedager. Helter på første klasse og spesialklasse får både telegrammer fra kyststasjoner og nytrykte invitasjoner til nissefesten (6. des), kasinokvelden (7. des), Tahiti-ballet (9. des) og søndagsmessen (morgenen 6., 13. og 20. des)."},{"id":"ref-pacing","title":"Et ord om tempo","description":"Scenarioet utspiller seg over mange døgn, noe som lar deg bygge opp mot klimakset — og som betyr at du må drive tida framover for å komme dit.\n\nSpillere vil ofte bruke hver time av hver dag på etterforskningen. Motvirk det ved å presse tempoet. Hold fokus på handlingen, hold farten oppe, og kjør historien på skinner: si rett ut at du spoler fram til det som betyr noe.\n\nGi dem tid til å utforske og snakke med NPCer, men vær klar til å kaste situasjoner, spørsmål og scener mot dem for å holde spillet i gang. Tidslinja er vennen din her — når du er i tvil, hopp til neste daterte hendelse."}],"tactics_note":"Gruppa er svært kompetent, og rene nærkampmonstre blir knust — særlig av Beefcake. Kortene under angriper andre akser av karakterarkene: lav POW og Sanity, smale ferdigheter, dårlig Swim, og situasjoner der rå styrke er feil verktøy. Trekk ett når en kamp går for lett.","tactics":[{"id":"tac-formless-spawn","title":"Formless Spawn","category":"Motstander","mechanic":"Som en flytende, seig masse er de immune mot vanlige fysiske angrep. Beefcakes Fighting (Brawl) på 99 % og våpen gjør ingen skade i det hele tatt.","tactic":"De beveger seg umerkelig gjennom ventilasjonsanlegg og rør under skipsdekkene. Walther må bruke Weird Science sammen med Science (Pharmacy) for å koke sammen en kjemisk blanding — syre eller ekstrem kulde — som endrer skapningens molekylære struktur.","pressure":"Slår ut gruppas beste våpen: nærkamp.","used":false,"connects_to":["npc-crawling-one"]},{"id":"tac-cultists","title":"Kultister med magi og tankekontroll","category":"Motstander","mechanic":"Unngår direkte konfrontasjon og skjuler seg blant passasjerene.","tactic":"Sikt på Beefcake og Walthers svake punkt: lav POW (45) og lav Sanity (45). Med Mental Suggestion eller Dominate kan Beefcake snus mot sine egne. Da må Skjoldvår bruke Telekinesis for å binde ham fast midlertidig, mens Dagrun setter Animal Companion — hunden — på kultisten for å bryte konsentrasjonen.","pressure":"Gjør gruppas hardeste slagkraft til et problem for dem selv.","used":false},{"id":"tac-deep-ones","title":"Deep Ones og hybrider","category":"Motstander","mechanic":"Kjemper alltid i flokk og trives i vann. Amfibiske angrep fra flere kanter.","tactic":"De forsøker å trekke karakterene over bord. Dagruns Swim på 30 % og Walthers lave SIZ (55) gjør dem til lette bytter i vannet. Flokkene sirkler rundt skipet, slik at spillerne må forsvare flere dekk samtidig og splitte ressursene sine.","pressure":"Tvinger gruppa til å dele seg, og flytter kampen dit de er dårligst.","used":false},{"id":"tac-star-vampires","title":"Star Vampires","category":"Motstander","mechanic":"Usynlige helt til de mater på et offer og fylles med blod. Det gir massive straffeterninger for å treffe dem tidlig i kampen.","tactic":"Krever at gruppa bruker omgivelsene for å finne dem. Walther kan bruke Keen Hearing til å lytte etter snikelydene, eller Dagrun kan nøytralisere usynligheten ved å kaste mel, regnvann eller maling fra lasten over dem — så Beefcake endelig kan lande slagene sine.","pressure":"Treffsjansen, ikke skaden, er flaskehalsen.","used":false},{"id":"tac-shamblers","title":"Dimensional Shamblers","category":"Motstander","mechanic":"Teleporterer inn og ut av vår dimensjon. De slår hardt og er borte igjen neste runde.","tactic":"Målet deres er ikke å drepe, men å kidnappe. De griper etter dr. Soongs bok eller en nøkkelperson og feller over i en annen dimensjon. Skjoldvår må være klar med Sleight of Hand (70 %) for å nappe boka tilbake før skapningen forsvinner helt.","pressure":"Kan ikke vinnes ved å stå og slåss — det handler om timing.","used":false,"connects_to":["handout-book-of-red-jade"]},{"id":"tac-blackout","title":"Total mørklegging","category":"Konflikt","mechanic":"Skipets strømforsyning kuttes under tyveriet. Synsbaserte angrep får straffeterninger.","tactic":"Skjoldvårs Stealth (70 %) og Walthers Keen Hearing gir dem et massivt overtak til å navigere i mørket og felle fiender som famler.","pressure":"Snur kampen på hodet: den stille og den lyttende blir hovedpersonene.","used":false},{"id":"tac-hostages","title":"Gisselsituasjon","category":"Konflikt","mechanic":"Kultister bruker uskyldige passasjerer som levende skjold for å sikre rømningsveien.","tactic":"Walthers Rapid Fire og Beefcakes knusende styrke er for farlige å bruke. Skjoldvår må infiltrere med Master of Disguise i stedet.","pressure":"Gjør gruppas to sterkeste angrep ubrukelige.","used":false,"connects_to":["beat-bunny-takes-a-hostage"]},{"id":"tac-bomb","title":"Tikkende bombe","category":"Konflikt","mechanic":"En sprengladning truer med å senke skipet midt på havet og ødelegge alle spor.","tactic":"Walther desarmerer bomben med Demolitions (41 %) og Mech. Repair, mens Beefcake holder ståldørene inn til maskinrommet mot det som presser på utenfra.","pressure":"Klokka, ikke fienden, er motstanderen — og 41 % er tynt.","used":false},{"id":"tac-decoy-book","title":"Falsk bok","category":"Konflikt","mechanic":"Tyven legger igjen en nesten identisk bok under flukten, preparert med en farlig magisk felle — for eksempel en glyf.","tactic":"Karakterene må bruke Spot Hidden, eller Walthers Psychology (50 %), for å innse at kultisten ga fra seg boka mistenkelig lett — før noen åpner den.","pressure":"Straffer gruppa for å vinne for lett.","used":false,"connects_to":["handout-book-of-red-jade","beat-the-stolen-book"]},{"id":"tac-paranoia","title":"Paranoia blant mannskapet","category":"Konflikt","mechanic":"Kultistene har hjernevasket kapteinen og nøkkelmannskap. Gruppa nektes adgang til broa og lasterommet.","tactic":"Dagrun må bruke Persuade (50 %) for å overtale lojale sjømenn til mytteri, mens Skjoldvår bruker Read Lips (57 %) for å fange opp hva de hjernevaskede planlegger.","pressure":"Volden er stengt av — det må løses sosialt.","used":false,"connects_to":["npc-captain-nelson"]},{"id":"tac-storm","title":"Krengende skip og orkan","category":"Miljø","mechanic":"Skipet treffes av en voldsom storm under jakten på tyven. Skroget kastes fra side til side av enorme bølger.","tactic":"BALANSE: alle fysiske handlinger krever DEX-slag for å ikke falle eller skli. Dagrun, med DEX 99 og talentet Nimble, ignorerer det glatt og kan løpe langs vegger og rekkverk for å kutte av rømningsveien.\n\nLØST GODS: tunge maskindeler og kasser glir tvers over dekket og truer med å knuse folk mot skottene. Skjoldvår kan fryse dem i lufta med Telekinesis.","pressure":"Gjør selve gulvet til en motstander.","used":false},{"id":"tac-fire","title":"Røyk og brann i trange korridorer","category":"Miljø","mechanic":"En feilslått eksplosjon eller magisk feiltenning antenner det tørre treverket i førsteklassekorridorene.","tactic":"KVELNING: fast skade hver runde i den tette røyken uten surstoff, og sikten for våpenbruk faller drastisk.\n\nREDNINGSARBEID: Beefcake må bruke Power Lifter for å bryte opp fastklemte dører. Walther vil helst jage boka, og gruppa må bruke tid på å overtale ham til å bruke Medicine (61 %) på alvorlig brannskadde passasjerer.","pressure":"Skade som ikke kan slås tilbake, og et moralsk valg på toppen.","used":false},{"id":"tac-flooding","title":"Oversvømt lasterom og strømfare","category":"Miljø","mechanic":"Fienden saboterer skroget under vannlinjen for å stoppe forfølgerne. Lasterommet fylles raskt med mørkt, iskaldt sjøvann.","tactic":"DRUKNING: enormt press på Dagruns Swim (30 %) og Beefcakes Swim (25 %) mens de leter etter boka blant flytende vrakgods i bekmørket.\n\nSTRØM: knekte høyspentkabler slår gnister over vannflata. Spillerne må kortslutte skipets strømtilførsel fra et tørt punkt før hele rommet blir en dødelig felle.","pressure":"Treffer to ferdigheter gruppa nesten ikke har.","used":false,"connects_to":["loc-hold-7","loc-bilges"]},{"id":"tac-synergy","title":"Hvorfor dette virker","category":"Keeper-notat","mechanic":"Gruppa er vant til at én person løser problemet.","tactic":"Ved å kombinere ukonvensjonelle monstre, taktiske begrensninger og miljøfarer tvinger du spillerne til å rotere på hvem som er helten. Beefcake kan ikke slå i stykker en oversvømmelse, og Walther kan ikke skyte seg gjennom bekmørke. De må stole på hverandres pulp-talenter og smale ferdigheter for å komme fram til Kina.","pressure":"Prinsippet bak alle kortene over.","used":false}]}]</script>

os","stats":{"STR":"1","CON":"10","SIZ":"1","INT":"7","POW":"0","DEX":"1","HP":"6","MP":"0","DB":"+ host's","Move":"host's + 1"},"rolls":{"STR":"1","CON":"3D6","SIZ":"1","INT":"2D6","POW":"0","DEX":"1"},"attacks":[{"name":"any weapon 75%, damage as per weapon","skill":"","damage":""}],"armor":"none","skills":"Ride 75%, Sneak 90%, and any number of appropriate skills","spells":"none, but may possess strange artifacts to open Gates, to contact other Mythos beings, to invoke mist, winds, storms, etc., at the keeper's discretion. Humans generally cannot utilize the magic-like properties of the dark ones' artifacts","sanity_loss":"0/1D2 Sanity points to see a dark one, unless it has inhabited a body of someone the investigators know is dead, in which case he Sanity loss is 1/1D6+1 points. Host bodies in the later stages of decomposition may call for a Sanity loss of 1/1D8 or even 1/1D10 points","notes":""},{"id":"mm-dark-sargassum","name":"Dark Sargassum","subtitle":"Ocean-Dwelling Dark Young of Shub-Niggurath","kind":"enemy","category":"Mythos","stats":{"STR":"44","CON":"39","SIZ":"85","INT":"14","POW":"18","DEX":"16","HP":"62","MP":"3","DB":"+7D6","Move":"8"},"rolls":{"STR":"4D6+30","CON":"6D6+18","SIZ":"10D6+50","INT":"4D6","POW":"5D6","DEX":"3D6+6"},"attacks":[{"name":"Tentacle","skill":"90%","damage":"= db or catch (Grapple) Bite automatic when Grappled, 1D3"},{"name":"STR drain per round Crush Ship","skill":"80%","damage":"= db"}],"armor":"firearm attacks do only 1 point of damage. A firearms impale does 2 points of damage. Shotguns are exceptions, and do minimum possible damage, whatever that is. Hand-to-hand weapons do normal damage; attacks dependent on heat, blast, corrosion, electrical charge, or poisoning have no effect","skills":"Camouflage Self 90%","spells":"a dark sargassum knows a number of appropriate spells equal to half its INT; round fractions up","sanity_loss":"1D6/1D20 Sanity points to see a dark sargassum","notes":""},{"id":"mm-daughters-of-atlach
