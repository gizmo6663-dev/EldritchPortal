{"id":"loc-hold-6","title":"Lasterom 6 — kjøretøy og last","deck":"Nederste dekk","description":"ULÅST. Tre splitter nye Packard-sedaner, en Hudson turvogn, en Bugatti racer og et dusin Oliver-traktorer surret fast til dekket. Store containere med postsekker — hundrevis, om ikke tusenvis. Et dusin tønner fransk konjakk. Femti tønner merket «Hawaiian Botanical Specimens». En stor kasse merket «Funeral Supplies», med liket av en tcho-tcho som døde i San Francisco og sendes hjem på dr. Soongs regning.\n\nBassenget for spesialklasse og tredje klasse rigges som en avtakbar presenning over dette lasterommet.\n\nHVA SOM FAKTISK ER I TØNNENE, avgjør du: botanikk, noe ulovlig stuet inn av tcho-tcho-ene, eller menneskelik. Vaker heltene her, kan de få se en tønne bli åpnet og innholdet kokt og spist (Sanity 1/1D4), eller se «Chad Peterson» tilby tcho-tcho-ene en avtale.","visited":false,"connects_to":["beat-the-tcho-tcho","clue-funeral-supplies"]},{"id":"loc-hold-7","title":"Lasterom 7 — VERDIROMMET","deck":"Nederste dekk","description":"DOBBELTLÅST: en hengelås (Locksmith) og en slåbolt i luka (Hard Locksmith). Det er her alt sammen er.\n\nINNHOLD: tjueto oljemalerier i kasser, fire bronse- og fire marmorstatuer (også i kasser), en enorm forsendelse redwood-planker og -tømmer, seksten store glassballonger med farlige kjemikalier som eter og saltsyre, et skap med skipets beholdning av håndvåpen, geværer og hagler — og to ting som betyr noe:\n\nDEN GRØNNE METALLKASSA. To meter høy, låst (Hard Locksmith eller Hard STR for å bryte den opp). Ingeniørtegninger for energiinnretningen, med notater om montering, materialer, kostnader og konstruksjon, dekket av håndskrevne okkulte symboler. Å kjenne dem igjen som konstruksjonstegninger er enkelt (Mechanical Repair eller Science (Engineering)); å forstå at innretningen skal tilkalle uhyrer gjennom mekaniske midler for å fange essensen deres, krever en Cthulhu Mythos roll og minst to timers studium.\n\nORGELKASSA. Diger, merket «Wm. Wood Pipe Organ Co., Inc. of Portland, Oregon». Spot Hidden (Hard uten lyskilde) ser blodflekker på panelet på venstre side, og at skruene er skrudd ut og inn igjen mange ganger. Å åpne eller slå den opp er lett, og avdekker Pipes of Leng.\n\nSKAPNINGEN LIKER DÅRLIG at artefakten dens blir funnet. En enslig helt kan få en formel over seg — Mindblast, Dominate, Mental Suggestion. En gruppe kan få en hunting horror. Prøv å avlede heltene framfor å konfrontere dem for tidlig — med mindre du nærmer deg et passende klimaks, og da kaster du deg uti det.\n\nSALTSYREN i glassballongene gjør 1D10 per runde mot polyppen og ignorerer rustningen dens. Husk at den står her.","visited":false,"connects_to":["clue-green-metal-box","clue-blood-on-the-crate","npc-pipes-of-leng","beat-the-final-test"]}],"reference":[{"id":"ref-ship-stats","title":"SS President Coolidge — fullstendige data","description":"Bygget i august 1931 ved Newport News-verftet for Dollar Line — fire måneder gammel, og det største passasjerskipet som noen gang er bygget i USA (om enn ikke stort etter europeisk målestokk).\n\nSTØRRELSE\nLengde 654 fot | Bredde 81 fot | Dypgang 34 fot\nBruttotonnasje 21 936 tonn | Deplasement 30 924 tonn\nDekk: tre over hoveddekket, fem under\n\nLAST\nKapasitet 608 850 kubikkfot | Sju lasterom, fire nås fra dekk\nPlass til 100 kjøretøy i lasterom 4 | Kjølerom på 70 000 kubikkfot i lasterom 6\n18 lastevinsjer på 35 hk, løfter 3 000 pund direkte med 340 fot vaier i minuttet\nSeks Welin McLachlan-gravitasjonsdavider for livbåter; to båtvinsjer på 25 hk til lektere; seks kapstanvinsjer fra American Engineering Company\n\nVÅPEN OM BORD\nEn beholdning håndvåpen, geværer og hagler (til leirdueskyting) innelåst i lasterom 7. Kapteinen har en revolver innelåst i lugaren sin. Det finnes ikke sprengstoff om bord.\n\nMASKINERI\nTo turboelektriske Westinghouse på 13 250 hk | 12 høytrykkskjeler fra Babcock and Wilcox, fyrt med olje\nDamptrykk 300 psi | Kjeltemperatur 620 °F | To turbiner på 14 000 bhk | To propeller\nPropellturtall 133 o/min ved 22,2 knop | Toppfart 22,2 knop | Marsjfart 20 knop\nBunkers 6 240 tonn | Rekkevidde 19 500 nautiske mil i marsjfart, 14 500 for full fart\n\nFASILITETER\nMaks passasjerer 990 | Nødvendig besetning 324 | Maks om bord 1 314\nFerskvann 2 320 tonn | Belysning fra fire hjelpeturbingeneratorer på 500 kW, 240/120 volt\nTo svømmebasseng, ett på første klasse og ett som avtakbar presenning over lasterom 6\n\nDENNE REISEN: 678 passasjerer og 315 mann besetning, San Francisco til Shanghai via Honolulu. Fem døgn til Honolulu (5.–10. des), ni døgn videre til Shanghai (11.–19. des), beregnet ankomst kl. 06.00 den 20."},{"id":"ref-segregation","title":"Å bevege seg mellom klassene","description":"Skipet er svært synlig og gjennomført klassedelt. Første klasse, spesialklasse, tredje klasse og mellomdekket blandes nesten aldri, og dette er en reell hindring for et selskap som er spredt over flere dekk.\n\nÅ GÅ NED en klasse er mulig, selv om stuertene misliker at folk «slummer».\n\nÅ GÅ OPP er langt vanskeligere. Trappene voktes av stuerter, og de tre elektriske heisene har mannskap som heisførere (én heis er bare for last, inn på kjøkkenet). En passasjer trenger en invitasjon, en bestikkelse til et korrupt besetningsmedlem, eller en vellykket INTIMIDATE, CHARM, PERSUADE eller FAST TALK roll for å gå opp et dekk.\n\nÅ KLATRE er den farlige veien: en HARD CLIMB roll uten tau, vanlig vanskegrad med. Bommer man, faller man over bord — eller, i visse partier av skroget opp mot første klasse, ni meter ned på dekk for 3D6 skade. En snill Keeper kan la en vellykket Jump halvere skaden.\n\nBLIR MAN TATT: passasjerer fra første klasse og spesialklasse blir høflig fjernet og bestemt frarådet å komme tilbake. Tredje klasse behandles hardere. Passasjerer fra mellomdekket kan bli lenket til køya hvis de stadig sniker seg av gårde.\n\nMANNSKAPET kan bevege seg mellom klassene uten særlige problemer — som er grunnen til at en stjålet uniform er så mye verdt, og hvorfor skapningen bruker en."},{"id":"ref-key-rolls","title":"Alle slag i scenarioet, samlet på ett sted","description":"ETTERFORSKNING\nListen — høre oppstyret den 6. des; overhøre mannskapet om forvalteren; høre Soongs rop under tyveriet; høre den fjerne musikken om natta. HARD LISTEN plasserer musikken under dekk.\nSpot Hidden — «Funeral Supplies»-kassa på kaia; rotteskinnet i lasterommene; det kalde bålet og opiumsasken i lasterom 1; de gjenåpnede skruene på orgelkassa. HARD SPOT HIDDEN — blod på panelet uten lyskilde (vanlig vanskegrad med lys); forskjellene i håndskriften på avskjedsbrevet.\nPsychology — Hallander er i sjokk; en ny roll avslører løgnene; Hawthorne er livredd og trolig gal.\nArt/Craft (Calligraphy) — den forfalskede underskriften.\nCthulhu Mythos — hva tegningene faktisk er til (pluss to timers studium); riktig antall magic points for å binde polyppen.\nMechanical Repair eller Science (Engineering) — kjenne igjen konstruksjonstegningene.\nScience (Biology/Zoology) eller Art/Craft (Leatherwork) — rotteskinnet kan ikke ha blitt flådd.\nKnow eller Science (Chemistry/Pharmacy) — kjenne igjen opiumsaske.\n\nSOSIALT\nHard Persuade — få se passasjerlisten.\nIntimidate eller Persuade — få Hallander til å snakke.\nHard Charm eller Persuade — vinne kapteinens tillit.\nExtreme Fast Talk eller Persuade — overbevise maskinistene om at du har lov til å være under dekk.\nExtreme Persuade eller Fast Talk, eller Hard Psychoanalysis — snakke Bates ned fra gisseltakingen.\nHard Persuade eller Hard Psychoanalysis — styrke Bates mot Dominate (gir ham en bonusterning).\nIntimidate/Charm/Persuade/Fast Talk — gå opp et dekk.\n\nFYSISK\nJump — følge skapningens hopp ned på promenadedekket, ellers 1D6+3. Halverer også 3D6-fallskaden ved klatring i skroget.\nHard Climb — klatre mellom dekk uten tau (vanlig vanskegrad med tau).\nLocksmith — lastelukene; hengelåsen på lasterom 7; å bryte seg inn i Petersons lugar (eller Mechanical Repair). HARD LOCKSMITH — slåbolten på lasterom 7 og den grønne metallkassa.\nExtreme STR — tvinge opp en vanntett luke. HARD STR med brekkjern, eller for å bryte opp den grønne kassa.\nStealth — komme forbi vaktholdet på lastelukene og i maskinrommet.\nCON — unngå sjøsyke 18.–19. des; unngå å kaste opp ved ballasttanken.\n\nOPPOSED POW\nmot POW 100 — skapningens Mindblast og Dominate.\nmot POW 80 — Bind Flying Polyp (dette slaget kan ikke pushes)."},{"id":"ref-sanity","title":"Sanity-tap underveis","description":"Mindblast fra skapningen — 5 poeng og et umiddelbart anfall av galskap (opposed POW roll mot POW 100; ingen virkning hvis helten vinner).\nSe skapningen skifte form, eller se dens egentlige skikkelse — 1D3/2D6.\nSe tcho-tcho-ene koke og spise innholdet i en tønne — 1/1D4.\nFinne Phyllis Barnes i ballasttanken — 0/1D2.\nFlying polyp — 1D3/1D20, slås av alle om bord, fordi raseriet holder den synlig.\nHunting horror — 1D3/1D20.\nLese Book of Red Jade — 1D10 (Cthulhu Mythos +4/+8).\nKaste Bind Flying Polyp — 1 poeng.\nStadig større flådde dyr nede i lasterommene — be om slag der det passer."},{"id":"ref-sanity-awards","title":"Sanity-belønninger til slutt","description":"+1D6   Heltene hindrer Bunny Bates i å drepe gisselet\n+1D4   Heltene ødelegger energiinnretningen\n+2D6   Heltene fanger eller dreper skapningen\n−1D6   Skapningen slipper unna\n+1D20  Heltene beseirer polyppen\n+1D10  Heltene prøver å redde så mange som mulig fra å drukne\n−1D10+2 Heltene forlater skipet uten tanke for andre"},{"id":"ref-dealing-with-the-polyp","title":"Å håndtere polyppen — de tre utveiene","description":"1. ØDELEGG PIPENE. 50 poeng skade mot armor 3 stanser maskinen og lar polyppen dra. Sprengstoff ville hjulpet; det finnes ikke om bord. Når musikken stanser, kan polyppen bruke noen runder på å oppdage det — la den angripe så lenge du vil, og la den så plutselig stanse, snu, fly oppover og skyte ned i dypet.\n\n2. BIND DEN. Helter som har Book of Red Jade, kan forsøke Bind Flying Polyp. Den som kaster, kan ikke være i kamp med vesenet, må være innenfor 90 meter, og må vinne en opposed POW roll mot POW 80 — dette slaget KAN IKKE PUSHES. Formelen koster 1 Sanity point. Kasteren kan investere magic points tilsvarende en femtedel av vesenets POW (16 MP) for å få en bonusterning — men vet ikke vesenets POW, så det er et sjansespill; en vellykket Cthulhu Mythos roll gir riktig antall. Bundet faller polyppen under kasterens kommando og kan beordres ned i dypet igjen.\n\n3. SLÅSS MOT DEN. Trolig det vanskeligste alternativet. 4 poeng rustning, og den tar bare MINIMUM skade fra fysiske våpen — men fortryllede våpen, ild og elektriske angrep gjør full skade. Saltsyren i glassballongene i lasterom 7 gjør 1D10 per runde og ignorerer rustningen. For høyt pulp-nivå kan militært anlagte helter kalle inn nærliggende britiske, amerikanske eller japanske krigsskip: et batteri skipskanoner gjør 10D10, og en salve eller to bør ødelegge den eller såre den så alvorlig at den trekker seg ned i havet.\n\nDØR DEN, smeller kroppen ned på skipet med et tungt brak og begynner å gå i oppløsning nesten umiddelbart. I løpet av minutter er det ikke annet igjen enn en fettete væske og en vond lukt.\n\nUANSETT ER SKIPET TAPT. Hullet i skroget betyr at Coolidge tar inn vann og krenger. Spør heltene hva de vil gjøre."},{"id":"ref-optional-mayhem","title":"Valgfritt: mer kaos og gru (høyt pulp-nivå)","description":"For Keepere som vil kjøre dette på fullt pulp-nivå, bruker skapningen formelen Graveyard Kiss til å lage zombier.\n\nI denne varianten kaster den ikke likene av ofrene over bord, men lar Bates gjemme dem rundt om i lasterom 7 som en sikkerhet. Ved første tegn til trøbbel vekker den dem og sender dem etter de nærmeste levende menneskene — som betyr zombier som klatrer opp fra underdekkene og setter alle om bord i fare.\n\nSom skrevet er det bare fem zombier, som er lite utfordring for helter i Pulp Cthulhu. For å skalere det opp: la hver zombie lage flere. Skapningens variant av formelen krever at den legger en del av insektmassen sin i munnen på et lik for å vekke det, og vekkede zombier kan gjøre det samme — insekter som hopper fra deres munn og inn i munnen på passasjerer de har drept. I teorien kan en fullskala zombieapokalypse overta skipet mens heltene står overfor polyppen.\n\nZombiene er også en utmerket erstatning for Bunny Bates i gisselscenen, hvis Bates allerede er ute av bildet."},{"id":"ref-troublesome-heroes","title":"Valgfritt: når heltene kommer deg i forkjøpet","description":"GJØR DE LIVET SURT for skapningen, eller trenger handlingen et dytt, går Bunny Bates til overraskelsesangrep — særlig hvis de nærmer seg Almacans lugar eller snuser rundt lastelukene. Han kan dukke opp i døra til en helts lugar, eller hoppe fram mot dem nede i lasterommet.\n\nFOR VIRKELIG HARD MEDFART tilkaller skapningen en hunting horror som jakter dem ned. Det vekker mye oppmerksomhet, så den timer angrepet slik at færrest mulig ser det.\n\nNÅR DE NÅR PIPENE FOR TIDLIG, avled framfor å konfrontere: en enslig helt får en formel over seg (Mindblast, Dominate, Mental Suggestion), eller en gruppe trekker til seg en hunting horror. Går det dårlig for skapningen, oppløser den seg og kommer tilbake til maskinen senere. Ødelegger heltene Pipes of Leng, retter den blikket fast mot hevn.\n\nMISTER DU BATES TIDLIG — drept, i arresten, tatt til fange — dominerer skapningen stuert Martin Aimesworthy og setter ham inn i alle senere scener. Alternativt, for å holde det enkelt: la den dominere en annen NPC til å hindre heltene, slik at Bates overlever til sin rolle i klimakset."},{"id":"ref-dining","title":"Kulisser: måltider, underholdning og livet om bord","description":"En vanlig middag dekker minst 200 om gangen, og det ventes at man reserverer bord. Hummer, fasan og kalvekjøtt er forbeholdt første klasse — men selv tredje klasse spiser bedre enn mange ville gjort på land.\n\nFØRSTE KLASSE — sju retter. Hors d'oeuvres og østers; consommé Olga eller byggsuppe med fløte; laks med mousseline-saus og agurk; filet mignon, sautert kylling Lyonnaise eller friske grønnsaker; deretter lam i myntesaus, andestek i eplesaus eller oksemedaljonger med grønne erter, kokt ris, gulrøtter i fløte, kokte nypoteter og poteter Parmentier; så punch romaine, stekt due med crêper, kald asparges i vinaigrette, gåselever og selleri; og til dessert Waldorf-pudding, fersken i chartreusegelé, sjokolade- og vaniljeeclairs, eller fransk iskrem. Presidential Dance Orchestra spiller i førsteklassesalongen kl. 18.00–21.00 hver kveld, og tar imot ønsker.\n\nSPESIALKLASSE — consommé, ovnsbakt kolje i krydret saus, deretter karrikylling, vårlam i myntesaus eller kalkunstek med tyttebær, med grønne erter, kålrotstappe, kokt ris og kokte og stekte poteter. Dessert: plumpudding, vingelé, kokossmørbrød eller amerikansk iskrem, samt nøtter, frisk frukt, ost, kjeks og kaffe. Pacific Jazz Orchestra spiller kl. 19.00–21.00 annenhver kveld.\n\nTREDJE KLASSE — rissuppe, saltkjøtt og kål, kokte poteter, kjeks, ferskt brød og smør, stuede epler og ris til dessert, kaffe til desserten. Menyen skifter daglig, men måltidet er fast for dagen, servert kl. 18.00–20.00.\n\nMELLOMDEKKET — vasstrukket saltkjøtt og kål, kokte gulrøtter, kokte poteter, rispudding. Menyen skifter sjelden; av og til grønne bønner, eller bacon i potetsalat, eller ris i stedet for poteter. Servert kl. 20.00–21.00, etter at tredje klasse er ferdig.\n\nRØYKING: ikke forbudt innendørs generelt, men tredje klasse og mellomdekket forventes å røyke ute på C-dekk, under oppsyn av stuerter som frykter sigaretter, piper og sigarer som brannfare.\n\nTRYKKERIET kunngjør begivenheter, fester, festmiddager og merkedager. Helter på første klasse og spesialklasse får både telegrammer fra kyststasjoner og nytrykte invitasjoner til nissefesten (6. des), kasinokvelden (7. des), Tahiti-ballet (9. des) og søndagsmessen (morgenen 6., 13. og 20. des)."},{"id":"ref-pacing","title":"Et ord om tempo","description":"Scenarioet utspiller seg over mange døgn, noe som lar deg bygge opp mot klimakset — og som betyr at du må drive tida framover for å komme dit.\n\nSpillere vil ofte bruke hver time av hver dag på etterforskningen. Motvirk det ved å presse tempoet. Hold fokus på handlingen, hold farten oppe, og kjør historien på skinner: si rett ut at du spoler fram til det som betyr noe.\n\nGi dem tid til å utforske og snakke med NPCer, men vær klar til å kaste situasjoner, spørsmål og scener mot dem for å holde spillet i gang. Tidslinja er vennen din her — når du er i tvil, hopp til neste daterte hendelse."}],"tactics_note":"Gruppa er kompetent, og den er kompetent på få akser. Beefcake slår 99 % for 1D3+1D6, Dagrun skyter på DEX 99, Franz har hagle på 70 %. En kamp som avgjøres av skade alene, er over på to runder — og det er ikke fordi motstanderne er for svake, men fordi kampen ikke ber om noe annet enn skade.\n\nKortene under gjør tre ting. KAMPJUSTERING endrer hvordan en kamp er satt opp, uten å blåse opp HP på noe. MOTSTANDER gir fiender som stiller andre spørsmål enn «hvor hardt slår du». HENDELSE er skipslivet: ting som skjer uansett hva jakten på skapningen gjør, og som gir gruppa noe å tape og noe å vinne.\n\nIngenting her skal gjøre spillerne hjelpeløse. Hvert kort har et punkt der det de er gode på faktisk avgjør — det er hele poenget. Trekk ett når en kamp går for lett, eller når en dag om bord trenger noe å skje.","tactics":[{"id":"tac-clock","title":"Gi kampen en klokke","category":"Kampjustering","mechanic":"En kamp uten annet mål enn å drepe, er ferdig når skaderegnestykket sier det. Gruppa vinner det regnestykket.","tactic":"Skriv et tall på en lapp før kampen begynner — 4, 6 eller 8 runder — og bestem hva som skjer når det går ut. Livbåten fires ned med feil person i. Brannen når lasterom 3. Telegrafisten får sendt meldingen. Bates kutter over strupen på gisselet.\n\nSå krever du at noen bruker handlinger på oppgaven. Hver runde en spiller bruker på å skru løs en luke eller bære en bevisstløs person, er en runde hen ikke slår. Beefcake kan bare gjøre én ting per runde, og med en klokke i rommet koster det noe å velge slåssing.","pressure":"Gjør handlingsøkonomien til det kampen handler om, i stedet for terningskade.","used":false},{"id":"tac-room-width","title":"La rommet bestemme hvor mange som slåss","category":"Kampjustering","mechanic":"Nesten ingenting om bord er et stort, åpent rom. En korridor på A-dekk er drøyt en meter bred.","tactic":"Bestem før kampen hvor mange som får være i kontakt samtidig. I en korridor: to. I en lugardør: én. Ned en leider i et lasterom: én om gangen, og den som klatrer har ikke hendene ledige.\n\nStår Beefcake fremst, er han en propp — og da er kampen Franz' (HP 18, CON 30) og Skjoldvårs (Dodge 23 %) å overleve, fordi fienden går rundt gjennom ventilasjonen eller neste gang og tar dem bakfra. Står han bakerst, kommer han seg ikke fram. Begge deler er gode kamper.","pressure":"Gruppas skade er én person bred. Gjør rommet én person bredt.","used":false,"connects_to":["loc-first-class","loc-hold-2"]},{"id":"tac-withdraw","title":"Motstandere som ikke står og tar imot","category":"Kampjustering","mechanic":"En fiende som blir stående til den dør, er et kappløp i skade. Gruppa vinner det kappløpet.","tactic":"La dem slåss i to runder og så trekke seg. Å komme seg ut av nærkamp er et Dodge-slag på egen tur, motsatt mot angriperens Fighting. Mot Beefcake (99 %) lykkes det nesten aldri — så la dem trekke seg unna de andre, og hente forsterkninger.\n\nTre mook som slåss to runder, forsvinner rundt et hjørne og kommer tilbake med to til, gir deg en kamp på seks–sju runder uten at noen har fått ett eneste ekstra HP. Og det gir spillerne noe å gjøre: jage, avskjære, blokkere.","pressure":"Lengde uten oppblåste tall.","used":false},{"id":"tac-grapple","title":"Grep i stedet for skade","category":"Kampjustering","mechanic":"Dagrun har STR 25 og Build −1. Franz har CON 30 og HP 18. Begge kan tas ut av en kamp uten at det slås ett eneste skadeslag.","tactic":"En manøver — gripe, avvæpne, kaste i bakken, dra vekk — går mot Fighting, og Build avgjør om den lar seg gjøre. Én Build høyere enn målet gir angriperen en straffeterning; to høyere gjør manøveren umulig.\n\nDet betyr at Beefcake (Build 2) ikke kan gripes av vanlige folk i det hele tatt, mens Dagrun (Build −1) kan gripes av hvem som helst. To mook som hver tar en arm på henne, fjerner gruppas beste skytter for resten av kampen. Den som er grepet får som regel ikke slått tilbake fysisk — men slipper løs på et motsatt STR mot STR, og der er Beefcake svaret.","pressure":"Går utenom HP-økonomien helt.","used":false},{"id":"tac-numbers","title":"Mengde, ikke størrelse","category":"Kampjustering","mechanic":"Ett stort monster er ett mål, og Beefcake dreper ett mål. Tolv svake er tolv turer med angrep.","tactic":"Mot denne gruppa er seks matroser med batonger farligere enn én skrekk. Hver av dem gjør 1D6 + db; Franz på 18 HP er nede etter tre treff. Og hver av dem koster en hel runde av Beefcakes å fjerne.\n\nMotgiften skal være ekte: Beefcakes Intimidate 99 eller Skjoldvårs APP 99 kan knekke en mobb av mennesker med ett slag. La det virke. En kamp de vant med ett ord, er en de husker.","pressure":"Snur gruppas handlingsøkonomi mot dem selv.","used":false,"connects_to":["npc-other-crew"]},{"id":"tac-darkness","title":"Mørket som ressurs, ikke bare straff","category":"Kampjustering","mechanic":"Under dekk er lysene få, og dynamoen er gammel.","tactic":"I mørket får Firearms en straffeterning, og Spot Hidden går opp ett vanskegrads-hakk. Franz har NIGHT VISION og slipper begge deler.\n\nSlå ut lyset en runde av tre — dynamoen hikster, en lampe går. Da er gruppas skjøreste medlem plutselig den eneste som ser, og kampen kjempes på hans premisser. Det er en belønning forkledd som en fare, og den bør spilles som en belønning: spør Franz hva han ser, ikke de andre.","pressure":"Flytter kampen dit den sterkeste er blind og den svakeste ser.","used":false,"connects_to":["loc-bilges","loc-boilers"]},{"id":"tac-luck-drain","title":"Tapp Luck før den store kampen","category":"Kampjustering","mechanic":"Luck: Walther 85, Dagrun 80, Franz 75, Beefcake 65, Skjoldvår 60. I Pulp er det en mur av omkast.","tactic":"En pulp-helt kjøper seg ut av nesten alt: justere et slag 1 for 1, se bort fra en fumle for 10, 1D6 HP tilbake for 20, unngå en sikker død for alt over 30.\n\nDen store kampen bør ikke være første sted de bruker av det. Gi dem tre små problemer i døgnet før — et Swim-slag som ryker, en dør som sitter fast, et skudd som fumler — der det åpenbart er verdt å bruke 5–15 Luck. Da møter polyppen en gruppe med 30 igjen i stedet for 80. Ikke ta Luck fra dem; få dem til å ville bruke den.","pressure":"Den mest effektive måten å gjøre en kamp farlig på uten å røre et eneste tall på motstanderen.","used":false},{"id":"tac-breakable-room","title":"La rommet ta skade","category":"Kampjustering","mechanic":"En kamp i et maskinrom er ikke en kamp i et maskinrom hvis bare folk kan treffes.","tactic":"Gi rommet to–tre ting som kan gå i stykker, og si hva de er FØR første slag. Da bruker spillerne dem også, og det er hele poenget.\n\nMaskinrommet: et bomskudd i en dampledning gir 2D6 til alle innenfor tre meter, og rommet fylles. Lasterom 5: bingene ryker, og tjue panikkslagne melkekyr beveger seg gjennom kampen. Lasterom 6: en Packard river seg løs i krengningen. Bunnrommet: vann og knekte høyspentkabler i samme rom.","pressure":"Gir alle noe å gjøre som ikke er å slå treffslag.","used":false,"connects_to":["loc-boilers","loc-hold-5","loc-hold-6"]},{"id":"tac-people-who-flee","title":"Folk som ikke vil dø for saken","category":"Motstander","mechanic":"Menneskelige motstandere med noe å tape. De overgir seg, de lyver, de stikker av.","tactic":"Matroser betalt for å se en annen vei. Gangstere på et ærend. Passasjerer overtalt til å hjelpe. De slåss én runde og vil deretter ut.\n\nBeefcakes Intimidate 99 og Skjoldvårs APP 99 og Persuade 50 er enorme her, og skal bare virke. Men den som overgir seg, er også et vitne, og vitner snakker. Kaptein Nelson får høre at passasjerer på første klasse banker opp besetningen hans, og fra da av er offiserene et problem i seg selv.","pressure":"Belønner de sosiale ferdighetene, og gjør vold dyrt i stedet for umulig.","used":false,"connects_to":["npc-captain-nelson","npc-hugo-schramm","npc-bunny-bates"]},{"id":"tac-immune-with-answer","title":"Noe som ikke kan slås — med utveien synlig","category":"Motstander","mechanic":"En ting der Brawl 99 gjør null skade.","tactic":"Poenget er ikke å gjøre dem hjelpeløse, men å få dem til å se et annet sted. Vis utveien i løpet av første runde: tingen rygger for buelampa, for dampen, for saltvannet.\n\nLa Walther (INT 85, Science (Biology) 51, Weird Science) eller Franz (Cthulhu Mythos 10) være den som ser det, og la det være ett slag på Regular — ikke en gåte. De to spiller sjelden hovedrollen i en kamp. Her gjør de det, og de andre får jobben med å holde tingen unna mens de rigger.","pressure":"Flytter kampen til de to som ellers aldri er svaret.","used":false,"connects_to":["npc-crawling-one"]},{"id":"tac-sanity-damage","title":"Noe som tar Sanity i stedet for HP","category":"Motstander","mechanic":"Beefcake SAN 45. Walther SAN 45. Det er gruppas tynneste vegg, og den står bak de to hardeste kroppene.","tactic":"En ting som ikke gjør HP-skade i det hele tatt. Alle slår Sanity hver runde den er synlig.\n\nWalther har HARDENED — lik og stygge skader biter ikke på ham, men Mythos gjør det; ikke la ham glemme forskjellen. Beefcake på SAN 45 knekker først, og en midlertidig gal Beefcake med Brawl 99 i en korridor med vennene sine er den hardeste kampen i hele scenarioet. Å halvere tapet koster dobbelt i Luck — se «Tapp Luck».","pressure":"Den ene aksen der musklene er svakest.","used":false,"connects_to":["npc-flying-polyp"]},{"id":"tac-hold-the-door","title":"Noe som må holdes ute, ikke drepes","category":"Motstander","mechanic":"En beleiring. En dør, en luke, en trappeoppgang.","tactic":"De har seks runder på å holde en dør mens noe gjøres bak dem. Fienden kommer én og to om gangen. Spørsmålet er ikke om de kan vinne kampen, men om de klarer å holde linja mens to av dem er opptatt med noe annet.\n\nBeefcake i døråpningen er nøyaktig riktig. Dagrun med hagle opp trappa er nøyaktig riktig. La det være riktig — gi dem seieren de har rigget til. Det er den typen kamp gruppa er bygget for, og de skal få føle det minst én gang.","pressure":"En kamp de åpenbart vinner, satt opp slik at det å vinne krever at de deler seg.","used":false,"connects_to":["loc-hold-7","loc-boilers"]},{"id":"tac-they-studied-you","title":"En motstander som har sett dem før","category":"Motstander","mechanic":"Femten døgn på et skip. Den som har slåss mot dem én gang, vet hvordan de slåss.","tactic":"Andre gangen kommer de forberedt. To mann som ikke gjør annet enn å holde Dagrun. En som går for lampene, fordi de har skjønt at én av dem ser i mørket. Et teppe eller et garn til Beefcakes armer. En som blir stående ved døra for å stenge retretten.\n\nSi det høyt ved bordet: «de har åpenbart tenkt på dere». Å bli tatt på alvor av fienden er en kompliment, og spillerne hører den som en.","pressure":"Gjør gruppas egen dyktighet til det som hever vanskegraden.","used":false},{"id":"tac-hunter-with-a-rifle","title":"Noen som skyter bedre enn dem","category":"Motstander","mechanic":"Gruppa er vant til å være de farligste i rommet på avstand.","tactic":"Alex Hubbard har Rifle .45 på 80 % og skyter storvilt for å leve. Havner han på feil side — betalt, lurt, eller bare overbevist om at heltene er morderne — er han den eneste om bord som kan treffe Dagrun før hun treffer ham.\n\nMot skytevåpen finnes ingen unnvikelse: bare å dykke i dekning, og det koster neste handling. Dagrun og Skjoldvår har NIMBLE og slipper den kostnaden — det er en av de tydeligste gangene talentene deres betyr noe. La dem merke det.","pressure":"Angriper avstandsdominansen med noen som er bedre på samme akse.","used":false,"connects_to":["npc-alex-hubbard"]},{"id":"tac-man-overboard","title":"Mann over bord","category":"Hendelse","mechanic":"Kl. 02.00, et rop fra båtdekket. En full passasjer på første klasse over rekka.","tactic":"Swim: Dagrun 30 %, Beefcake 25 %, resten står tomt. Skipet bruker fire–seks minutter på å stoppe og snu. En livbøye er Throw (Beefcake 55 %). Vannet holder fjorten grader, og den som hopper etter, får CON-slag for kulden.\n\nRedder de ham, skylder et navn på første klasse dem noe — og navn på første klasse åpner dører Beefcakes Credit Rating 3 aldri kommer til å åpne.","pressure":"Treffer den ene ferdigheten ingen av dem har, om bord på et skip.","used":false,"connects_to":["npc-background-passengers","npc-charles-astor"]},{"id":"tac-boiler-burst","title":"Kjelen","category":"Hendelse","mechanic":"En dampledning i maskinrommet ryker.","tactic":"Skåldende damp, 1D6 per runde til alle i rommet, og skipet mister fart. Mech. Repair: Walther 35 %, Franz 35 %, Dagrun har Elec. Repair 40 %. Pushede slag er lov; en fumle gir brannskader.\n\nDet er ikke Mythos. Det er et gammelt skip. Men maskinsjefen blir enten takknemlig eller ydmyket alt etter hvordan de snakker til ham mens de gjør det — og en takknemlig maskinsjef er en mann med nøkler.","pressure":"Et problem ingen kan slå i stykker, under tidspress.","used":false,"connects_to":["loc-boilers","npc-other-crew"]},{"id":"tac-opium","title":"Opium i lasterom 3","category":"Hendelse","mechanic":"To matroser flytter kasser i kjølerommet midt på natta.","tactic":"Det er ikke skapningen. Det er helt alminnelig smugling.\n\nGruppa kan ta pressmiddelet — en nøkkel til lasterommene og en stille alliert — melde dem (og da lukker besetningen seg, og ingen snakker med dem igjen), eller ta en andel. En nøkkel til lasterommene er verdt mer enn penger, og de kommer til å ville ha den før den 19.","pressure":"Gir dem noe konkret å vinne, og et valg med ettervirkninger.","used":false,"connects_to":["loc-hold-3","npc-albert-hallander"]},{"id":"tac-fever","title":"Feberen på mellomdekket","category":"Hendelse","mechanic":"Tre passasjerer ligger med feber akterut.","tactic":"Walther (Medicine 61 %) ser at det er alminnelig influensa og ikke pest. Men ryktet er alt i bevegelse, og et skip i panikk blir liggende i karantene i Honolulu.\n\nOm de roer det ned eller lar det løpe, avgjør hvor mange mennesker som er på dekk den kvelden alt skjer. Et rolig skip gir et fullt promenadedekk; et redd skip gir tomme korridorer og låste lugardører.","pressure":"Lar en ferdighet ingen kamp bruker, forme finalen.","used":false,"connects_to":["loc-steerage","npc-erik-hartman"]},{"id":"tac-loose-cargo","title":"Løs last i storm","category":"Hendelse","mechanic":"18. og 19. desember er sjøen grov. I lasterom 6 river en Packard seg fra surringene.","tactic":"To tonn i bevegelse over et dekk som krenger. Build betyr alt: Beefcake (Build 2, POWER LIFTER) kan faktisk stå imot den; Dagrun (Build −1) blir knust. DEX-slag for å komme unna, STR-slag for å holde igjen, Mech. Repair for å få kilene på plass.\n\nBugattien i samme rom tilhører en passasjer som betaler godt for å få den reddet — eller ødelegger dem sosialt om den går tapt.","pressure":"En scene der Beefcakes STR 99 er det eneste svaret, og alle ser det.","used":false,"connects_to":["loc-hold-6"]},{"id":"tac-card-table","title":"Kortbordet","category":"Hendelse","mechanic":"Kasinokvelden. Brødrene Po gir Pai Gow.","tactic":"En anklage om juks, et bord som går over ende. Beefcakes Intimidate 99 avslutter det på ett øyeblikk — la det skje, og ta betalt etterpå: han er nå passasjeren offiserene holder øye med. Skjoldvår (APP 99, Psychology 60) kan gjøre det samme uten en scene.\n\nForskjellen på de to løsningene skal være synlig i dagene etterpå. Det er slik du lærer et bord at hvordan de løser noe betyr noe, uten å straffe dem for å løse det.","pressure":"Samme problem, to løsninger, ulik pris.","used":false,"connects_to":["npc-bunny-bates","loc-amenities"]},{"id":"tac-animals-know","title":"Dyrene vet noe","category":"Hendelse","mechanic":"Lasterom 5: kennelene og de tjue melkekyrne.","tactic":"En natt er hvert eneste dyr om bord helt stille. Neste natt er de det ikke. Ingenting angriper.\n\nTrack (Dagrun 67 %) og Natural World finner ingenting. Dette ER ikke et spor — det er stemning. Men spillerne vet ikke det, og timene de bruker på det, er timer skipet fortsetter å seile. Bruk det når gruppa har fått for god fart på etterforskningen.","pressure":"Kjøper deg tid uten å lyve for spillerne.","used":false,"connects_to":["loc-hold-5","npc-james-hawthorne"]},{"id":"tac-stowaway","title":"Blindpassasjeren","category":"Hendelse","mechanic":"En gutt på fjorten i lasterom 2, som lever av passasjerenes bagasje.","tactic":"Han har sett ting. Han er også vettskremt for å bli satt i land i Honolulu, og lyver om alt sammen.\n\nDet finnes ingen kamp i dette. Den som ender opp med å få tilliten hans, får et par øyne som kommer inn der voksne ikke kommer — under dekk, i bagasjerommene, i ventilasjonssjaktene. Skjoldvår og Franz har begge Stealth over 60 og vil kjenne ham igjen som en av sine.","pressure":"En scene uten terninger som gir gruppa et verktøy de beholder.","used":false,"connects_to":["loc-hold-2"]},{"id":"tac-telegram","title":"Telegrammet","category":"Hendelse","mechanic":"Telegrafisten har en melding til en av heltene. Fra land.","tactic":"Noe personlig. En gjeld. En søster. En arrestordre. Skriv det på en lapp og gi den til én spiller uten å si noe til de andre.\n\nDet koster ingenting mekanisk og kjøper deg en hel kveld med rollespill. Franz er hitman og har en fortid; Skjoldvår er spion og har en arbeidsgiver; Dagrun er dusørjeger og har noen som skylder henne penger. Alle tre tåler et telegram som river opp noe.","pressure":"Gir én spiller en scene som er hens alene.","used":false,"connects_to":["npc-other-crew"]},{"id":"tac-old-death","title":"Han som falt i 1929","category":"Hendelse","mechanic":"En matros falt ned i lasterom 4 for tre år siden og døde.","tactic":"Besetningen er overtroisk om det rommet og går ikke dit alene. Det er ikke overnaturlig. Det er en arbeidsulykke og en gammel historie som fortelles i lugarene.\n\nNytten er dobbel: den forklarer hvorfor ingen vil følge heltene ned dit, og den gjør at når noe FAKTISK er galt i lasterom 4 — og det er det, den 13. desember — så tror ingen på dem.","pressure":"Bygger et alibi for skipets likegyldighet, lenge før den trengs.","used":false,"connects_to":["loc-hold-4","npc-phyllis-barnes"]},{"id":"tac-why","title":"Hvorfor dette virker","category":"Keeper-notat","mechanic":"Gruppa er vant til at én person løser problemet.","tactic":"Alle kortene over gjør én av tre ting: de begrenser hvor mange handlinger som teller (klokke, romstørrelse, grep), de flytter spørsmålet vekk fra skade (Sanity, beleiring, immunitet med synlig utvei), eller de gir skipet et eget liv som ikke venter på at noen skal løse det (hendelsene).\n\nIngen av dem gir motstanderne flere HP. Det er med vilje: en kamp der spillerne treffer og treffer uten at noe skjer, føles ikke vanskelig — den føles kjedelig. En kamp der de treffer akkurat like hardt som før, men må velge hva de bruker treffet på, føles vanskelig og gøy på samme tid.","pressure":"Prinsippet bak alt over.","used":false},{"id":"tac-spotlight","title":"Én scene hver, før det er over","category":"Keeper-notat","mechanic":"Fem spillere, femten døgn. Alle skal ha minst én scene der arket deres er svaret.","tactic":"BEEFCAKE: noe tungt som må holdes, løftes eller brytes, der STR 99 og Build 2 er det eneste som virker. Løs last i storm, en dør som er kilt fast, en mann som holder på å bli dratt over bord.\n\nDAGRUN: et skudd bare DEX 99 kan ta — langt, i bevegelse, med noen i veien. Eller et spor bare Track 67 finner.\n\nWALTHER: en diagnose. Noe som ser overnaturlig ut og ikke er det, eller motsatt. Medicine 61 og INT 85 skal én gang gi svaret ingen andre kunne gitt.\n\nSKJOLDVÅR: et rom hun kommer inn i på APP 99 alene, der de andre ville blitt stoppet i døra. Eller en samtale lest på leppene tvers over salongen (Read Lips 57).\n\nFRANZ: en mørk korridor der NIGHT VISION gjør ham til den eneste som ser, eller et ord på et språk ingen andre kjenner (LINGUIST), eller det ene øyeblikket Cthulhu Mythos 10 gir ham et navn på det de ser.","pressure":"Det som gjør en hard kveld til en god kveld.","used":false},{"id":"tac-off-the-crawling-one","title":"Skipet venter ikke på at de skal finne skapningen","category":"Keeper-notat","mechanic":"Jakten på skapningen og boka til dr. Soong er plottet, men det er ikke det eneste som skjer om bord.","tactic":"678 passasjerer og 315 mann besetning har femten døgn å fylle. Kjør minst én HENDELSE per spilledøgn, uavhengig av hvor etterforskningen står — også, og særlig, når den står stille.\n\nNytten er tredelt. Den skjuler hva som er spor og hva som er støy, slik at spillerne må vurdere i stedet for å følge en snor. Den gir dem venner og fiender om bord som betyr noe i finalen. Og den gjør skipet til et sted i stedet for en kulisse — som er halve grunnen til at scenarioet foregår på et skip i det hele tatt.","pressure":"Tar tyngden av jakten uten å ta bort plottet.","used":false}]}]</script>
<script type="application/json" id="bundled-bestiary">{"id":"malleus-monstrorum","version":1,"title":"Malleus Monstrorum","system":"Call of Cthulhu","source":"Malleus Monstrorum (Chaosium)","note":"Statblokkene er hentet maskinelt ut av en OCR-konvertering av boka. Sjekk tall mot din egen utgave før du bruker dem i en viktig kamp — særlig angrepslinjer, som kan ha blitt delt feil.","creatures":[{"id":"mm-adumbrali","name":"Adumbrali","subtitle":"Other-Dimensional Shadow Vampires","kind":"enemy","category":"Mythos","stats":{"CON":"14","SIZ":"28","INT":"14","POW":"14","DEX":"10","HP":"21","MP":"2","DB":"N/A","Move":"8"},"rolls":{"STR":"N/A","CON":"4D6","SIZ":"8D6","INT":"3D6+3","POW":"4D6","DEX":"2D6+3"},"attacks":[{"name":"Filament","skill":"30%","damage":"1D6 STR & 1D6 CON drain"}],"armor":"none, but due to their shadowy nature the adumbrali are immune to all mundane weapons. Only enchanted weapons and spells which affect POW or INT can harm the adumbrate","skills":"","spells":"all know 1D3 spells, typically those which affect the mind","sanity_loss":"0/1D6 Sanity points to see the adumbrali","notes":""},{"id":"mm-aihais","name":"Aihais","subtitle":"Martian Servants of Vulthoom","kind":"enemy","category":"Mythos","stats":{"STR":"18","CON":"20","SIZ":"22","INT":"15","POW":"10","DEX":"10","HP":"21","MP":"2","DB":"+1D6","Move":"9"},"rolls":{"STR":"5D6","CON":"3D6+10","SIZ":"3D6+12","INT":"2D6+8","POW":"3D6","DEX":"3D6"},"attacks":[{"name":"Fist","skill":"50%","damage":"1D3 + db"},{"name":"Disintegrator Gun","skill":"20%","damage":"5D6 hit points, 1D3 CON & 1D6 APP"}],"armor":"none naturally, however some aihai clothes may afford 4point armor","skills":"Listen 25%, Sneak 25%, Spot Hidden 30%","spells":"typically only a priest of Vulthoom will know spells. Those spells always include Contact Vulthoom, Create Gate, plus 1D3 others of the keeper's choice","sanity_loss":"0/1D8 Sanity points to see an aihai","notes":""},{"id":"mm-alskali","name":"Alskali","subtitle":"Cyclope <script type="application/json" id="bundled-talents">{"id":"pulp-talents","version":1,"title":"Talenter","source":"Pulp Cthulhu (Chaosium)","note":"Talentbeskrivelsene er hentet maskinelt ut av regelboka og gjengis på engelsk, slik de står der.","talents":[{"name":"Alert","description":"never surprised in combat.","group":"Kamptalent","kind":"pulp","id":"tal-alert"},{"name":"Animal Companion","description":"starts game with a faithful animal companion (e.g. dog, cat, parrot) and gains a bonus die when making Animal Handling rolls.","group":"Diverse talent","kind":"pulp","id":"tal-animal-companion"},{"name":"Arcane Insight","description":"halve the time required to learn spells and gains bonus die to spell casting rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-arcane-insight"},{"name":"Beady Eye","description":"does not suffer penalty die when “aiming” at a small target (Build –2), and may also fire into melee without a penalty die.","group":"Kamptalent","kind":"pulp","id":"tal-beady-eye"},{"name":"Endurance","description":"gain a bonus die when making CON rolls (including to determine MOV rate for chases).","group":"Fysisk talent","kind":"pulp","id":"tal-endurance"},{"name":"Fast Load","description":"choose a Firearm specialism; ignore penalty die for loading and firing in the same round.","group":"Kamptalent","kind":"pulp","id":"tal-fast-load"},{"name":"Fleet Footed","description":"may spend 10 Luck to avoid being “outnumbered” in melee combat for one combat encounter.","group":"Kamptalent","kind":"pulp","id":"tal-fleet-footed"},{"name":"Gadget","description":"starts game with one weird science gadget (see Weird Science, page 86).","group":"Diverse talent","kind":"pulp","id":"tal-gadget"},{"name":"Handy","description":"reduces difficulty by one level or gains bonus die (at the Keeper’s discretion) when making Electrical Repair, Mechanical Repair, and Operate Heavy Machinery rolls.","group":"Diverse talent","kind":"pulp","id":"tal-handy"},{"name":"Hardened","description":"ignores Sanity point loss from attacking other humans, viewing horrific injuries, or the deceased.","group":"Mentalt talent","kind":"pulp","id":"tal-hardened"},{"name":"Heavy Hitter","description":"may spend 10 Luck points to add an additional damage die when dealing out melee combat (die type depends on the weapon being used, e.g. 1D3 for unarmed combat, 1D6 for a sword, etc.).","group":"Kamptalent","kind":"pulp","id":"tal-heavy-hitter"},{"name":"Insane accuracy","description":"“Seems like I just can’t miss!” The hero gains a bonus die to all Firearms rolls until their gun is empty. They may continue to use the bonus die until one of their shots misses its target or they run out of bullets. That missed shot will hit something they do not want it to hit—an ally or something else of great value, dealing damage as if it had been an Extreme success (impale).","group":"Insane talent","kind":"insane","id":"tal-insane-accuracy"},{"name":"Insane appearance","description":"“Damn, I look good baby!” The hero looks somehow very different; this may be purely in their facial expression and posture, or it could be that they take the time to change their clothes and hair to something radically different (clothes don’t magically change—they must do that). Gain a bonus die to an APP roll or roll that could be affected by their appearance, such as Charm or Fast Talk. The effect is short-lived but may be applied to all interactions during a period of time, such as one scene or one meeting. If a roll is failed using the bonus die for their “improved” appearance, they suffer some form of social disgrace or consequence.","group":"Insane talent","kind":"insane","id":"tal-insane-appearance"},{"name":"Insane brutality","description":"“I’m gonna chop you into tiny pieces!” The hero rolls all melee damage twice and takes the highest result. The downside is that once they start hitting, they cannot stop! They must continue until they deliver a killing blow. The only two things that will stop this is if they are either rendered unconscious or someone successfully makes a Hard Fast Talk, Charm, or Intimidate roll on them (only one person may attempt one of these on the hero in any one combat round). 19-20.","group":"Insane talent","kind":"insane","id":"tal-insane-brutality"},{"name":"Insane constitution","description":"“I grit my teeth and feel no pain!” When an amount of damage is suffered, the hero may choose to make a CON roll. If successful, they bear the pain and halve the damage. If the roll is failed, they take the damage that was rolled and fall to the ground, incapacitated for 1D3 rounds.","group":"Insane talent","kind":"insane","id":"tal-insane-constitution"},{"name":"Insane dexterity","description":"“My hands move quicker than the eye can see!” Gain a bonus die to a DEX roll. If the roll is failed, something goes wrong. The Keeper chooses: either the hero is injured (take 1D4 hit points of damage), or they break the thing that they were working on.","group":"Insane talent","kind":"insane","id":"tal-insane-dexterity"},{"name":"Insane driver","description":"“Nothing’s going to stop me now!” Gain a bonus die to all the hero’s Drive rolls for one chase. Should a drive roll fail, they lose control of the vehicle somehow (at the Keeper’s discretion).","group":"Insane talent","kind":"insane","id":"tal-insane-driver"},{"name":"Insane hearing","description":"“Quiet everyone, what’s that ticking?” The hero gains a bonus die to a Listen roll. Regardless of ambient noise or other sounds, they are able to pick up on even the quietest of sounds. If the roll is failed, the Keeper decides what happens: either some sudden noise leaves them deaf for 1D10 minutes, or they have auditory delusions for the next hour.","group":"Insane talent","kind":"insane","id":"tal-insane-hearing"},{"name":"Insane language","description":"“Nope, never had a Swahili lesson in my life, but how difficult can it be?” The hero gains a temporary grasp of all modern languages—or one archaic or Mythos language—for a short time. This effect lasts long enough to conduct an initial reading of a tome, conduct a conversation, or listen to a speech. The effective skill in the language is 75%. Should a skill roll be required for the use of the new language, a failed roll means the hero forgets their native tongue for 1D6 days, replacing it with the new language that was being used at the time.","group":"Insane talent","kind":"insane","id":"tal-insane-language"},{"name":"Insane power","description":"“I can feel the power flowing through me!” Gain a bonus die to a POW roll. If the roll is failed, something goes wrong. The Keeper chooses: either the hero passes out, or the effect they were trying to achieve is dangerously greater than intended.","group":"Insane talent","kind":"insane","id":"tal-insane-power"},{"name":"Insane recall","description":"“I remember everything perfectly!” Every memory and fact the hero ever heard is right at their fingertips. Faces, figures, and details crowd their mind in a flood of information. Gain a bonus die to an EDU, Know, or skill roll when trying to remember information that the hero might feasibly have once heard or seen. If a roll is failed, the flood of information is too much! Lose a point of Sanity and suffer a bout of madness. If the hero was not already insane, they are now temporarily insane.","group":"Insane talent","kind":"insane","id":"tal-insane-recall"},{"name":"Insane sense of direction","description":"“Follow me, it’s down here!” The hero’s player tells the Keeper where they want to go or what they want to head towards. The Keeper gives the direction they should take in order to accomplish this. The hero makes a Luck roll: if the roll is failed, they walk straight into a trap or dangerous encounter of some kind.","group":"Insane talent","kind":"insane","id":"tal-insane-sense-of-direction"},{"name":"Insane skill augmentation","description":"“You think I’m crazy don’t you? But it’s possible I tell you!” As a side effect of insanity, a hero can augment one of their skills (of the player’s choice, agreed by the Keeper) with some aspect of the Cthulhu Mythos. This will affect the scope of what can be achieved with the skill. Herbert West and Crawford Tillinghast are both good candidates for case studies on how this might affect a person.","group":"Insane talent","kind":"insane","id":"tal-insane-skill-augmentation"},{"name":"Insane speed","description":"“Look at me—I’m faster than a speeding bullet!” When entering a chase, the hero takes a bonus die on their CON roll to determine their movement speed. If the roll succeeds, increase their speed by 1. If the roll is an Extreme success, increase their speed by 2. If the roll is failed, they blunder somehow, losing at least 1D3 rounds of movement.","group":"Insane talent","kind":"insane","id":"tal-insane-speed"},{"name":"Insane stealth","description":"“You ain’t seen me, right?” The hero gains a bonus die to a Stealth roll. They move with catlike grace and might even attempt to hide in plain sight. If the roll is failed, they accidentally break something or cause a great deal of commotion.","group":"Insane talent","kind":"insane","id":"tal-insane-stealth"},{"name":"Insane strength","description":"“I draw upon untold reserves of inner strength!” Gain a bonus die to a STR roll. If the roll is failed, something goes wrong. The Keeper chooses: either the hero is injured (take 1D3 + the hero’s damage bonus in damage from torn muscles and the like), or the thing that the hero was working on breaks.","group":"Insane talent","kind":"insane","id":"tal-insane-strength"},{"name":"Insane understanding","description":"“Oh, I get it now!” The hero’s player may ask the Keeper a question about the plot: “Why is the enemy doing…?” “What does the enemy hope to achieve by…?” “What is the best thing that we could do the thwart the enemy’s plan?” What is the enemy’s greatest weakness? The question should be quite specific and the Keeper should answer honestly. This talent can only be used once—it is then lost.","group":"Insane talent","kind":"insane","id":"tal-insane-understanding"},{"name":"Insane vision","description":"“Light? Who needs light?” The hero gains a bonus die to a Spot Hidden roll. Even in complete darkness, they get to make a roll as if it were twilight. If the roll is failed, the Keeper decides the outcome: either their eyes become painful and overly sensitive (effectively leaving them blind for 1D10 rounds) or they suffer delusions for the next hour.","group":"Insane talent","kind":"insane","id":"tal-insane-vision"},{"name":"Insanely hard to hit","description":"“Float like a butterfly!” The hero gains a bonus die on all Dodge rolls in the current combat scene until they fail a Dodge roll. Such a failure indicates moving into the blow, in which case they receive damage as if the attack had achieved an Extreme success.","group":"Insane talent","kind":"insane","id":"tal-insanely-hard-to-hit"},{"name":"Insanely intimidating","description":"“You think I’m funny? Funny how?” The hero gains a bonus die to Intimidate rolls. If a roll is failed, they lose control of their actions for a short time. The Keeper chooses what happens: either they fly into a violent rage (possibly causing damage to the person they’re speaking with), or they are belittled and shamed.","group":"Insane talent","kind":"insane","id":"tal-insanely-intimidating"},{"name":"Iron Liver","description":"may spend 5 Luck to avoid the effects of drinking excessive amounts of alcohol (negating penalty applied to skill rolls).","group":"Fysisk talent","kind":"pulp","id":"tal-iron-liver"},{"name":"Keen Hearing","description":"gain a bonus die to Listen rolls.","group":"Fysisk talent","kind":"pulp","id":"tal-keen-hearing"},{"name":"Keen Vision","description":"gain a bonus die to Spot Hidden rolls.","group":"Fysisk talent","kind":"pulp","id":"tal-keen-vision"},{"name":"Linguist","description":"able to determine what language is being spoken (or what is written); gains a bonus die to Language rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-linguist"},{"name":"Lore","description":"has knowledge of a lore specialization skill (e.g. Dream Lore, Vampire Lore, Werewolf Lore, etc.). Note that occupational and/or personal interest skill points should be invested in this skill.","group":"Mentalt talent","kind":"pulp","id":"tal-lore"},{"name":"Lucky","description":"regains an additional +1D10 Luck points when Luck Recovery rolls are made.","group":"Diverse talent","kind":"pulp","id":"tal-lucky"},{"name":"Master of Disguise","description":"may spend 10 Luck points to gain a bonus die to Disguise or Art/Craft (Acting) rolls; includes ventriloquism (able to throw voice over long distances so it appears that the sound is emanating from somewhere other than the hero). Note that if someone is trying to detect the disguise their Spot Hidden or Psychology roll’s difficulty is raised to Hard.","group":"Diverse talent","kind":"pulp","id":"tal-master-of-disguise"},{"name":"Mythos Knowledge","description":"begins the game with a Cthulhu Mythos Skill of 10 points.","group":"Diverse talent","kind":"pulp","id":"tal-mythos-knowledge"},{"name":"Night Vision","description":"in darkness, reduce the difficulty level of Spot Hidden rolls and ignore penalty die for shooting in the dark.","group":"Fysisk talent","kind":"pulp","id":"tal-night-vision"},{"name":"Nimble","description":"does not lose next action when “diving for cover” versus firearms.","group":"Kamptalent","kind":"pulp","id":"tal-nimble"},{"name":"Outmaneuver","description":"character is considered to have one point higher Build when initiating a combat maneuver (e.g. Build 1 becomes Build 2 when comparing their hero to the target in a maneuver, reducing the likelihood of suffering a penalty on their Fighting roll).","group":"Kamptalent","kind":"pulp","id":"tal-outmaneuver"},{"name":"Photographic Memory","description":"can remember many details; gains a bonus die when making Know rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-photographic-memory"},{"name":"Power Lifter","description":"gain a bonus die when making STR rolls to lift objects or people.","group":"Fysisk talent","kind":"pulp","id":"tal-power-lifter"},{"name":"Psychic Power","description":"may choose one psychic power (Clairvoyance, Divination, Medium, Psychometry, or Telekinesis). Note that occupational and/or personal interest skill points should be invested in this skill (see Psychic Powers, page 83).","group":"Mentalt talent","kind":"pulp","id":"tal-psychic-power"},{"name":"Quick Draw","description":"does not need to have their firearm “readied” to gain +50 DEX when determining position in the DEX order for combat.","group":"Kamptalent","kind":"pulp","id":"tal-quick-draw"},{"name":"Quick Healer","description":"natural healing is increased to +3 hit points per day.","group":"Fysisk talent","kind":"pulp","id":"tal-quick-healer"},{"name":"Quick Study","description":"halve the time required for Initial and Full Reading of Mythos tomes, as well as other books.","group":"Mentalt talent","kind":"pulp","id":"tal-quick-study"},{"name":"Rapid Attack","description":"may spend 10 Luck points to gain one further melee attack in a single combat round.","group":"Kamptalent","kind":"pulp","id":"tal-rapid-attack"},{"name":"Rapid Fire","description":"ignores penalty die for multiple handgun shots.","group":"Kamptalent","kind":"pulp","id":"tal-rapid-fire"},{"name":"Resilient","description":"may spend Luck points to shrug-off points of Sanity loss, on a one-for-one basis.","group":"Mentalt talent","kind":"pulp","id":"tal-resilient"},{"name":"Resourceful","description":"always seems to have what they need to hand; may spend 10 Luck points (rather than make Luck roll) to find a certain useful piece of equipment (e.g. a flashlight, length of rope, a weapon, etc.) in their current location.","group":"Diverse talent","kind":"pulp","id":"tal-resourceful"},{"name":"Scary","description":"reduces difficulty by one level or gains bonus die (at the Keeper’s discretion) to Intimidate rolls.","group":"Diverse talent","kind":"pulp","id":"tal-scary"},{"name":"Shadow","description":"reduces difficulty by one level or gains bonus die (at the Keeper’s discretion) to Stealth rolls, and if currently unseen is able to make two surprise attacks before their location is discovered.","group":"Diverse talent","kind":"pulp","id":"tal-shadow"},{"name":"Sharp Witted","description":"able to collate facts quickly; gain a bonus die when making Intelligence (but not Idea) rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-sharp-witted"},{"name":"Smooth Talker","description":"gain a bonus die to Charm rolls.","group":"Fysisk talent","kind":"pulp","id":"tal-smooth-talker"},{"name":"Stout Constitution","description":"may spend 10 Luck to reduce poison or disease damage and effects by half.","group":"Fysisk talent","kind":"pulp","id":"tal-stout-constitution"},{"name":"Strong Willed","description":"gains a bonus die when making POW rolls.","group":"Mentalt talent","kind":"pulp","id":"tal-strong-willed"},{"name":"Tough Guy","description":"soaks up damage, may spend 10 Luck points to shrug off up to 5 hit points worth of damage taken in one combat round.","group":"Fysisk talent","kind":"pulp","id":"tal-tough-guy"},{"name":"Weird Science","description":"may build and repair weird science devices (see Weird Science, page 86).","group":"Diverse talent","kind":"pulp","id":"tal-weird-science"}]}</script>
<script type="application/json" id="bundled-abilities">{"version":1,"title":"Spesialregler for skapninger","source":"Malleus Monstrorum (Chaosium), Call of Cthulhu 7e og Pulp Cthulhu","note":"Statblokkene i fiendebanken er hentet maskinelt ut av boka. Denne fila er skrevet for hånd, og legger på mekanismene som ikke lar seg lese ut av en tabell: tellere som rulles hver runde, angrep med begrenset bruk, regenerering, og hvilke våpen som i det hele tatt biter. Oppføringene kobles til skapninger og NPCer på navn eller id. Oppføringene treffer både på id-en i fiendebanken og på navn, slik at en kopi lagt i rollelisten også får reglene med seg.","damage_sources":{"melee":"Nærkamp","firearm":"Skytevåpen","shotgun":"Hagle","fire":"Ild","electricity":"Elektrisitet","acid":"Syre eller kjemikalier","magic":"Formel","enchanted":"Fortryllet våpen","sound":"Lyd"},"effects":{"normal":"Full skade","half":"Halv skade, rundet ned","minimum":"Minste mulige skade fra terningene","fixed":"Fast antall poeng","immune":"Ingen skade","instant_death":"Død på stedet"},"entries":[{"match":["mm-flying-polyps","flying polyp","flying polyps"],"title":"Flying Polyp","abilities":[{"id":"tentacles","kind":"pool","name":"Tentakler","roll":"2D6","reset":"round","targetable":true,"unit":"tentakler","attack":{"name":"Tentakkel","skill":"85%","damage":"1D10","uses_db":false,"can_impale":false,"ignores_armor":true,"category":"melee"},"description":"Polyppen danner og oppløser tentakler hele tiden. Ved starten av hver runde slås 2D6 for hvor mange tentakler som kan angripe den runden. Hver av dem gjør ett angrep. Skaden er alltid 1D10, og fordi vesenet bare er halvveis materielt går den rett på HP — rustning hjelper ikke. Såret ser ut som uttørking eller vindbrenning.","house_note":"Boka har ingen regel for å slå tentakler av polyppen; de kommer og går av seg selv. Vil du likevel la spillerne hugge løs på dem, velger du «tentakkel» som mål i angrepsflyten — da går telleren ned i stedet for HP-en. Husk at 2D6 slås på nytt neste runde uansett.","unit_one":"tentakkel","replaces":["Tentacle","Tentacles"]},{"id":"windblast","kind":"limited","name":"Vindstøt","uses":1,"reset":"round","cost":"1 magic point per runde","attack":{"name":"Vindstøt","skill":"70%","damage":"5D6","uses_db":false,"can_impale":false,"category":"heavy","range":"18 meter"},"description":"En sylinder på 9 meter i tverrsnitt, med 18 meters grunnrekkevidde. Skaden er polyppens damage bonus — 5D6 for denne. Utover grunnrekkevidden faller den med 1D6 for hvert nye multiplum: 4D6 på 36 meter, 3D6 på 37 meter og oppover. Ofrene får huden flerret av seg og blåses bakover like mange meter som de mistet HP.","replaces":["Windblast","Wind blast"]},{"id":"fixing","kind":"note","name":"Fixing attack","description":"Fangstvinden. Rekkevidde 900 meter, går rundt hjørner og opp gjennom trapper. Hver runde: motstående slag mellom målets STR og polyppens POW — halv POW over 180 meter, full POW under. Vinner polyppen, kommer målet seg ikke unna den runden. Polyppen kan flytte i full fart mens den gjør dette. Flere mål innenfor 27 meter av hverandre kan tas samtidig; legg 5 % til hver enkelts sjanse for hvert mål utover det første."},{"id":"invisibility","kind":"note","name":"Usynlighet","description":"1 magic point per runde. Usynlig angriper den ikke med tentakler, men kan fortsatt bruke vindangrepene og kaste formler. Den som vil treffe den må først klare et Listen-slag for å høre hvor pipelyden kommer fra, og trekker deretter 50 prosentpoeng fra treffsjansen. Er den ikke helt usynlig, trekkes polyppens POW fra treffsjansen i stedet, siden den hele tiden glir inn og ut av syne.","scenario_note":"I A Slow Boat to China er polyppen rasende og blir SYNLIG hele veien. Da faller både Listen-slaget og de 50 prosentpoengene bort — men den fortsetter å flimre, så POW-fradraget kan du fortsatt bruke om du vil ha den vanskelig å treffe."}],"damage":{"note":"4 poeng rustning, og bare minste mulige skade fra fysiske våpen. Fortryllede våpen, ild og elektrisitet gjør full skade.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-crawling-ones","crawling one","crawling ones"],"title":"Crawling One","abilities":[{"id":"no-natural-attack","kind":"note","name":"Ingen naturlige angrep","description":"En crawling one har ingen egne angrep og må bruke våpen som alle andre. Treffsjanse og skade følger våpenet den har fått tak i."},{"id":"dissolve","kind":"note","name":"Oppløsning","description":"Blir den alvorlig truet, faller den fra hverandre til enkeltmark og -larver som spreller ned mellom gulvplankene. I praksis kan den ikke drepes med vanlige midler med mindre den trenges opp et sted den ikke kan renne ut av."},{"id":"consume-likeness","kind":"note","name":"Consume Likeness","description":"Den kan ta skikkelsen til ethvert menneske den dreper og spiser. En ny skikkelse bruker 48 timer på å utvikle stemmebånd. I egen skikkelse kan den ikke lage lyd i det hele tatt, og må kommunisere skriftlig — men trenger ikke ord for å kaste formler."}],"damage":{"note":"Kroppen er myk og ettergivende. Vanlige våpen gjør minste mulige skade; kuler gjør ett eneste poeng; haglskudd gjør minste mulige skade for den typen våpen. Ild, syre og elektrisitet er ikke nevnt i boka; her er de satt til full skade, siden en haug med mark åpenbart brenner. Bytt skadetype i angrepsflyten hvis du vil ha det strengere.","rules":[{"source":"shotgun","effect":"minimum"},{"source":"firearm","effect":"fixed","value":1},{"source":"fire","effect":"normal"},{"source":"acid","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-hunting-horrors","hunting horror","hunting horrors"],"title":"Hunting Horror","abilities":[{"id":"two-attacks","kind":"note","name":"Bitt og hale i samme runde","description":"En hunting horror kan gjøre både bitt og haleangrep i samme runde. Kjør begge angrepene fra kampkortet før du går til neste tur."},{"id":"tail-grapple","kind":"note","name":"Halegrep","description":"Halen snører seg om offeret og holder det fast. Skapningen kan fly av gårde med det, eller fortsette å slåss. Offeret slipper løs bare ved et motstående STR mot STR. Mens noen henger i halen, kan skapningen bare bite — men får +20 % på treffsjansen mot den som dingler. Den som er grepet får som regel ikke slått tilbake fysisk, men kan bruke formler."},{"id":"daylight","kind":"note","name":"Oppløses av dagslys","description":"Direkte dagslys tar livet av den. Om bord betyr det at den må håndteres før daggry, eller drives ut på åpent dekk. Et kraftig nok lysglimt kan svi den til støv."}]},{"match":["mm-chthonian-full-adults","chthonian","chthonian full adult","chthonian full adults"],"title":"Chthonian","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","amount":5,"reset":"round","dies_at_zero":true,"description":"Leger 5 HP hver runde etter å ha blitt såret — men dør umiddelbart om den først kommer ned i null."},{"id":"water","kind":"note","name":"Vann er dødelig","description":"Vann er giftig for chthonians. Om bord på et skip er dette den mest nærliggende utveien."},{"id":"con-drain","kind":"note","name":"CON-tapping","description":"Nærheten til en chthonian tapper CON hver runde. Se statblokka for angrepslinja."}]},{"match":["mm-dark-sargassum","dark sargassum"],"title":"Dark Sargassum","damage":{"note":"Skytevåpen gjør ett poeng; en spidding fra skytevåpen gjør to. Hagler er unntaket og gjør minste mulige skade. Nærkampvåpen gjør full skade. Ild, sprengning, etsing, elektrisitet og gift har ingen virkning.","rules":[{"source":"shotgun","effect":"minimum"},{"source":"firearm","impaling":true,"effect":"fixed","value":2},{"source":"firearm","effect":"fixed","value":1},{"source":"fire","effect":"immune"},{"source":"electricity","effect":"immune"},{"source":"acid","effect":"immune"},{"source":"any","effect":"normal"}]}},{"match":["mm-dwellers-in-the-depths","dwellers in the depths","dweller in the depths"],"title":"Dweller in the Depths","abilities":[{"id":"brain-organ","kind":"weakspot","name":"Hjerneorganet","chance":10,"effect":"instant_death","description":"Skapningen er immun mot nesten all fysisk skade. Unntaket er hjerneorganet: et treff der dreper den på stedet. Ethvert treff har 10 % sjanse for å treffe organet — slå 1D100 etter et treff, og på 10 eller lavere er den ferdig."}],"damage":{"note":"Immun mot det meste av fysisk skade. Ild, elektrisitet og magi gjør full skade.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-nioth-korghai","nioth-korghai"],"title":"Nioth-korghai","abilities":[{"id":"solar-plexus","kind":"weakspot","name":"Solar plexus","chance_of_skill":10,"effect":"instant_death","description":"Skapningen kan ikke såres andre steder enn i solar plexus. For å treffe der må angriperen slå 10 % eller mindre av sin egen treffsjanse. Et treff der med et blyvåpen dreper den på stedet."}],"damage":{"note":"Alt annet enn et treff i solar plexus preller av.","rules":[{"source":"any","effect":"immune"}]}},{"match":["mm-servitors-of-the-outer-gods","servitors of the outer god","servitors of the outer gods"],"title":"Servitor of the Outer Gods","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","amount":3,"reset":"round","description":"Leger 3 HP hver runde helt til den er død."}],"damage":{"note":"Ingen fysiske våpen biter. Magiske våpen gjør full skade.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-star-spawn-of-cthulhu","star-spawn of cthulhu"],"title":"Star-spawn of Cthulhu","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","amount":3,"reset":"round","description":"Leger 3 HP hver runde. Med 10 poeng rustning i tillegg må skaden komme fort for å bety noe."}]},{"match":["mm-spawn-of-abhoth","spawn of abhoth"],"title":"Spawn of Abhoth","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D20","reset":"round","description":"Leger 1D20 HP hver runde. Slås på nytt hver runde."}]},{"match":["mm-gof-nn-hupadgh-shub-niggurath","gof'nn hupadgh shub-niggurath"],"title":"Gof'nn Hupadgh Shub-Niggurath","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D6","reset":"round","description":"Leger 1D6 HP hver runde helt til den er død."}]},{"match":["mm-thralls-of-cthulhu","thralls of cthulhu"],"title":"Thrall of Cthulhu","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D6","reset":"round","description":"Leger 1D6 HP hver runde. En thrall som slås ned til null av fysiske angrep, reiser seg helt uskadd igjen etter 1D8+1 runder. Magiske angrep er det som virkelig biter."}]},{"match":["mm-spawn-of-the-green-abyss","spawn of the green abyss"],"title":"Spawn of the Green Abyss","abilities":[{"id":"regen","kind":"regen","name":"Regenerering","roll":"1D3","reset":"round","description":"Leger 1D3 HP hver runde."}],"damage":{"note":"Immun mot vanlige våpen. Formler, fortryllede våpen, ild, elektrisitet og kjemikalier biter.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"acid","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-broodlings-of-eihort","broodlings of eihort"],"title":"Broodling of Eihort","abilities":[{"id":"regrow","kind":"note","name":"Gjenvekst","description":"Slipper en broodling unna med så mye som ett HP igjen, kan den vokse helt ut igjen. Det tar 10 minutter per HP."}],"damage":{"note":"Alle fysiske angrep gjør minste mulige skade.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-adumbrali","adumbrali"],"title":"Adumbrali","damage":{"note":"Skyggeaktig. Immun mot alle verdslige våpen. Bare fortryllede våpen og formler som angriper POW eller INT biter.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-chakota","chakota"],"title":"Chakota","damage":{"note":"Immun mot fysiske våpen. Ild, magi og elektrisitet biter. Dekkes munnene til, kan den kveles i jord eller vann.","rules":[{"source":"fire","effect":"normal"},{"source":"electricity","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-cold-ones","cold one","cold ones"],"title":"Cold One","damage":{"note":"Immun mot alle fysiske angrep. Ild gjør 2D6 per treff med fakkel eller tilsvarende.","rules":[{"source":"fire","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-lumens","lumen","lumens"],"title":"Lumen","damage":{"note":"Immun mot alt som ikke er magisk.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-denizens-of-s-glhuo","denizens of s'glhuo"],"title":"Denizen of S'glhuo","damage":{"note":"Levende lyd. Immun mot all fysisk skade. Formler mot INT eller POW virker normalt, og skurrende lyd er særlig effektivt.","rules":[{"source":"sound","effect":"normal"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-beings-of-ib-ghost-beings-of-ib","beings of ib & ghost-beings of ib"],"title":"Ghost-being of Ib","damage":{"note":"Gjenferdene kan ikke skades fysisk i det hele tatt. Formler som angriper eller tapper POW eller INT virker.","rules":[{"source":"magic","effect":"normal"},{"source":"any","effect":"immune"}]}},{"match":["mm-spawn-of-nyogtha","spawn of nyogtha"],"title":"Spawn of Nyogtha","damage":{"note":"Immun mot kuler og spiddevåpen, og tar minste mulige skade fra alt annet. Også immun mot ild, syre og stråling.","rules":[{"source":"firearm","effect":"immune"},{"source":"shotgun","effect":"immune"},{"source":"any","impaling":true,"effect":"immune"},{"source":"fire","effect":"immune"},{"source":"acid","effect":"immune"},{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"minimum"}]}},{"match":["mm-martians","martian","martians"],"title":"Martian","damage":{"note":"Alle fysiske våpen gjør halv skade.","rules":[{"source":"magic","effect":"normal"},{"source":"enchanted","effect":"normal"},{"source":"any","effect":"half"}]}},{"match":["mm-children-of-the-wind","children of the wind"],"title":"Child of the Wind","damage":{"note":"Spekkete hud: spiddevåpen gjør bare halv skade. Alt annet gjør full skade.","rules":[{"source":"any","impaling":true,"effect":"half"},{"source":"any","effect":"normal"}]}},{"match":["mm-spawn-of-othuyeg","spawn of othuyeg"],"title":"Spawn of Othuyeg","damage":{"note":"Bare minimal skade fra spiddevåpen.","rules":[{"source":"any","impaling":true,"effect":"minimum"},{"source":"any","effect":"normal"}]}}]}</script>
<script type="application/json" id="bundled-talent-rules">{"version":1,"title":"Regler bak talentene","source":"Pulp Cthulhu og Call of Cthulhu 7e (Chaosium)","note":"Talentreglene her er fra Pulp Cthulhu, og er nå lest opp mot boka. Seksjoner merket «grunnbok» er fra Call of Cthulhu 7e. Der en regel finnes i begge bøkene, og de er uenige, gjelder Pulp Cthulhu.","rules":[{"id":"psychic-powers","title":"Psykiske krefter","source":"Pulp Cthulhu kapittel 6: Psychic Skills (s. 83–85), og talentlista i kapittel 2 (s. 25)","intro":"Talentet Psychic Power gir én psykisk kraft, og den er en ferdighet som alle andre — poeng må legges i den fra yrket eller fra personlige interesser. Startverdien er 00 %.\n\nÅ bruke en psykisk kraft koster magic points, på samme måte som formler. Har helten ikke nok igjen, slås et CON-slag: klarer hen det, holder hen seg våken og resten av kostnaden tas rett fra HP; ryker slaget, faller hen bevisstløs og kraften virker ikke.\n\nEt mislykket slag betyr at ingenting skjer — kostnaden i magic points er betalt og tapt. For de rundt ser det ut som at personen nøler et øyeblikk. Slaget kan pushes med en rimelig begrunnelse.\n\nVanskegrad: Regular når man har god tid i rolige omgivelser, Hard midt i dramatisk handling, for eksempel i en kamp.","sections":[{"title":"Ved dette bordet — Skjoldvår","source":"pulp + eget","body":"BOKA BEGRENSER HVEM SOM KAN VÆRE PSYKISK: bare arketypen Mystic, og yrkene Occultist og Yogi, har muligheten — og da etter Keeperens skjønn. Boka anbefaler også at det er ÉN psykisk helt om gangen i et spill, fordi psykiske ferdigheter ellers kan velte balansen.\n\nSKJOLDVÅR ER ROGUE OG SPION, ikke Mystic. Etter boka skulle hun altså ikke hatt Telekinesis. Karakterarket sier at hun har det, og det er ditt bord — så her gjelder arket. Jeg sier det bare fordi du ba meg sjekke hva som faktisk står, og fordi det forklarer hvorfor hun er den eneste i gruppa med noe slikt.\n\nHUSK AT DET ER EN FERDIGHET som starter på 00 %. Står det ikke et tall på arket hennes, er det ingenting hun kan gjøre med den — poeng må legges i den fra yrket eller fra personlige interesser. Sjekk arket før økta, og avtal et tall hvis det mangler.\n\nBOKA FRARÅDER Å GI PSYKISKE ANGREP til helter — de er ment for monstre og skurker. Telekinesis som våpen (kastede gjenstander, 1D4–1D6) og som rustning er derimot helt vanlig bruk, og står under Telekinesis."},{"title":"Telekinesis","body":"Flytter gjenstander med tankekraft. Helten kan bevege enhver livløs ting som et gjennomsnittsmenneske lett kunne løftet og kastet, for 1 magic point per gjenstand.\n\nUTENFOR KAMP: et Telekinesis-slag og 1 magic point flytter gjenstanden inntil 5 meter, normalt i hvilken retning man vil.\n\nI KAMP: et kombinert Telekinesis- og Throw-slag, og 1 magic point. Slaget må være lik eller under BEGGE ferdighetene for å telle som et avstandsangrep, og kan ikke pushes. Målet kan unnvike hvis det er klar over angrepet (motsatt slag mot den psykiskes). Skaden følger gjenstanden — vanligvis 1D4 til 1D6 for noe smått eller middels stort.\n\nSOM FORSVAR: telekinese kan brukes som usynlig rustning. Ett Telekinesis-slag per angrep, og 1 magic point gir 1 poeng rustning — 10 magic points gir 10 poeng. Slaget kan ikke pushes når det brukes slik.\n\nVALGFRITT: vil man flytte noe større enn ett menneske klarer, for eksempel en bil, settes kostnaden i magic points til hvor mange folk det realistisk ville tatt, og vanskegraden heves til Extreme. Gjenstanden kan ikke kastes eller løftes høyt, bare dras sakte inntil 3 meter.","source":"pulp"},{"title":"Clairvoyance","body":"Annet syn. Gir kunnskap om en gjenstand, en person, et sted eller en hendelse — også evnen til å ane gjenferd og usynlige Mythos-skapninger, grovt lokalisere noe som er borte, eller kjenne at noe tragisk har skjedd på et sted.\n\nHelten konsentrerer seg i 1D6 runder, bruker 1D6+1 magic points, og slår Clairvoyance. Mislykkes slaget, oppfattes ingenting; det kan pushes for ytterligere 5 magic points. Ved suksess får hen noe relevant å vite — hva og hvor mye er Keeperens avgjørelse, og er ofte vagt eller ufullstendig.\n\nKommer hen i kontakt med en fremmed intelligens, kreves et Sanity-slag med det vanlige tapet for den skapningen.","source":"pulp"},{"title":"Divination","body":"Spådom med et ritual — tarot, pendel, ouijabrett, runer. Retter seg mot ett bestemt spørsmål som kan besvares med ja eller nei: «Er det fare i huset i Ocean Avenue?», «Lever dr. Zarkov?» Alt utover det er opp til Keeperen.\n\nEn lesning tar 1D10 runder, koster 1D6 magic points og krever et vellykket Divination-slag.","source":"pulp"},{"title":"Medium","body":"Kontakt med ånder, kanskje til og med fremmede nærvær. Mediet åpner en del av sinnet sitt og blir en kanal. Det kommer ofte som en stemme gjennom mediets munn, men kan også være ord og setninger som dukker opp i tankene.\n\nMediet bruker 1D10 runder på å forberede seg. Ånder liker ikke alltid å bli kontaktet, og samtalen er kort — noen minutter på det meste. Mediet vet ikke hva det får tak i. Kaprer et ondsinnet nærvær seansen, kan mediet forsøke et motsatt POW-slag for å drive det ut. Mislykkes det, kan vesenet styre kroppen i inntil 1D10 runder før mediet besvimer og vesenet kastes av. Slikt krever som regel Sanity-slag.","source":"pulp"},{"title":"Psychometry","body":"Suger inntrykk og følelser ut av en fysisk, livløs gjenstand — en bok, et hus, et sigarettetui. Lesningen sier noe om hvem eieren er eller var, og hva slags menneske det er.\n\nHelten må ta på gjenstanden og konsentrere seg i 1D10 minutter uten å gjøre noe annet. Så slås Psychometry og 1D6+4 magic points brukes. Sterke følelser kommer først — sorg, hat, kjærlighet — deretter mer bestemte inntrykk: om gjenstanden er brukt til et drap, hvem den tilhører, eller hvor den har vært.\n\nOpplysningene bør holdes forholdsvis vage. Brukt ubesindig velter psychometry en etterforskning.","source":"pulp"}]},{"id":"weird-science","title":"Weird Science og dingser","source":"
