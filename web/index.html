let lastFocus = null;

// Modalene ligger i en stabel. Åpner du et talent fra et karakterkort,
// skal «Tilbake» føre deg til kortet igjen — ikke helt ut til lista.
// Det samme gjelder kryssreferanser mellom spor, scener og NPCer.
let modalStack = [];

function renderModal() {
  const scrim = document.getElementById("scrim");
  const top = modalStack[modalStack.length - 1];
  if (!top) {
    scrim.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    return;
  }

  // Tittel og undertittel kan være funksjoner. Da hentes de på nytt
  // hver gang nivået vises, slik at et kort man kommer tilbake til
  // viser gjeldende verdier og ikke et øyeblikksbilde.
  const head = document.getElementById("modal-title");
  head.textContent = (typeof top.title === "function")
    ? top.title() : top.title;
  const sub = (typeof top.subtitle === "function")
    ? top.subtitle() : top.subtitle;
  head.appendChild(el("span", { class: "modal-sub", id: "modal-sub",
                                text: sub || "" }));

  const body = document.getElementById("modal-body");
  body.innerHTML = "";
  top.build(body);

  const foot = document.getElementById("modal-foot");
  foot.innerHTML = "";
  top.foot.forEach((b) => foot.appendChild(b));
  foot.hidden = !top.foot.length;

  // Knappen sier hva den faktisk gjør: ett steg tilbake, eller lukk.
  const closeBtn = document.getElementById("modal-close");
  closeBtn.textContent = modalStack.length > 1 ? "Tilbake" : "Lukk";

  scrim.hidden = false;
  // Gjenopprett hvor langt ned man hadde bladd da man forlot nivået.
  body.scrollTop = top.scrollTop || 0;
  closeBtn.focus();
}

function openModal(title, subtitle, buildBody, footButtons) {
  if (!modalStack.length) lastFocus = document.activeElement;
  const cur = modalStack[modalStack.length - 1];
  if (cur) cur.scrollTop = document.getElementById("modal-body").scrollTop;
  modalStack.push({
    title: title, subtitle: subtitle,
    build: buildBody, foot: footButtons || [], scrollTop: 0,
  });
  renderModal();
}

// Ett steg tilbake i stabelen.
function closeModal() {
  modalStack.pop();
  renderModal();
}

// Lukk alt — brukes når man forlater modalene helt.
function closeAllModals() {
  modalStack = [];
  renderModal();
}

function noteEditor(item) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Dine notater" }));
  const status = el("div", { class: "savestate" });
  const area = el("textarea", {
    class: "field", rows: "4", id: "note-" + item.id,
    placeholder: "Hva skjedde da spillerne kom hit?",
  });
  area.value = item.userNotes || "";
  const save = debounce(async () => {
    await setItemNote(item.id, area.value);
    status.textContent = "Lagret " +
      new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
    status.className = "savestate saved";
  }, 700);
  area.addEventListener("input", () => {
    status.textContent = "Lagrer…";
    status.className = "savestate";
    save();
  });
  wrap.appendChild(status);
  wrap.appendChild(area);
  return wrap;
}

function crossRefs(item) {
  const refs = item.connects_to || [];
  if (!refs.length) return null;
  const labels = { clues: "Spor", timeline: "Tidslinje", beats: "Scene",
                   npcs: "NPC", handouts: "Handout", locations: "Sted",
                   reference: "Oppslag" };
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "section-label", text: "Se også" }));
  const stack = el("div", { class: "stack" });
  refs.forEach((ref) => {
    const hit = findItem(ref);
    if (!hit) return;
    stack.appendChild(el("button", {
      class: "entry", type: "button",
      onclick: () => openItem(hit.item, hit.section),
    }, [
      el("span", { class: "entry-open", text: labels[hit.section] || hit.section }),
      el("span", { class: "entry-body" }, [
        el("span", { class: "entry-title",
                     text: hit.item.title || hit.item.name || ref }),
      ]),
      el("span", { class: "entry-open", text: "ÅPNE" }),
    ]));
  });
  if (!stack.children.length) return null;
  wrap.appendChild(stack);
  return wrap;
}

function openItem(item, section) {
  if (section === "npcs") return openNpc(item);

  const subtitle = ["act", "day", "when", "where", "deck"]
    .map((k) => item[k]).filter(Boolean).join(" · ");

  openModal(item.title || item.name || "?", subtitle, (body) => {
    if (item.roll) {
      body.appendChild(el("div", { class: "callout" }, [
        el("p", { class: "eyebrow", text: "Slag" }),
        el("p", { text: item.roll }),
      ]));
    }
    if (item.description) {
      body.appendChild(el("p", { class: "prose", text: item.description }));
    }
    // Det som faktisk skal leses høyt eller vises fram, i egen ramme.
    if (item.read_aloud) {
      body.appendChild(el("p", { class: "eyebrow", text: "Les høyt" }));
      body.appendChild(el("div", { class: "readaloud", text: item.read_aloud }));
    }
    if (item.aside) {
      body.appendChild(el("p", { class: "prose tight", text: item.aside }));
    }
    if (item.body) body.appendChild(el("p", { class: "prose", text: item.body }));
    const refs = crossRefs(item);
    if (refs) body.appendChild(refs);
    if (item.id) body.appendChild(noteEditor(item));
  }, modalActions(item, section));
}

function modalActions(item, section) {
  const buttons = [];
  const flag = FLAGS[section];
  if (flag && item.id) {
    const on = !!item[flag];
    buttons.push(el("button", {
      class: on ? "btn" : "btn primary", type: "button",
      text: on ? "Fjern kryss" : (section === "handouts" ? "Marker utdelt" : "Kryss av"),
      onclick: async () => { await toggleFlag(item.id); closeModal(); },
    }));
  }
  if (item.id && state.progress) {
    buttons.push(el("button", {
      class: "btn small", type: "button", text: "Til sesjonslogg",
      onclick: () => { copyToSession(item); closeModal(); },
    }));
  }
  return buttons;
}

function openNpc(npc) {
  openModal(npc.name || "?", [npc.category, npc.role].filter(Boolean).join(" · "),
    (body) => {
      if (npc.description) {
        body.appendChild(el("p", { class: "prose", text: npc.description }));
      }
      if (npc.traits) {
        body.appendChild(el("div", { class: "section-label", text: "Trekk" }));
        body.appendChild(el("p", { text: npc.traits }));
      }
      if (npc.quotes && npc.quotes.length) {
        body.appendChild(el("div", { class: "section-label", text: "Replikker" }));
        npc.quotes.forEach((q) => body.appendChild(el("p", { class: "quote", text: q })));
      }
      if (npc.forms) {
        body.appendChild(el("div", { class: "section-label", text: "Skikkelser" }));
        body.appendChild(el("p", { class: "prose", text: npc.forms }));
      }
      if (npc.stats && Object.keys(npc.stats).length) {
        body.appendChild(el("div", { class: "section-label", text: "Karakteristikker" }));
        const order = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW", "EDU",
                       "SAN", "HP", "MP", "Luck", "DB", "Build", "Move", "Armor"];
        const keys = order.filter((k) => k in npc.stats)
          .concat(Object.keys(npc.stats).filter((k) => order.indexOf(k) === -1));
        const grid = el("dl", { class: "statgrid" });
        keys.forEach((k) => {
          grid.appendChild(el("div", { class: "stat" }, [
            el("dt", { text: k }),
            el("dd", { text: String(npc.stats[k]) }),
          ]));
        });
        body.appendChild(grid);
      }
      if (npc.pulp_talents && npc.pulp_talents.length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Pulp-talenter" }));
        const chips = talentChips(npc.pulp_talents.join(", "));
        if (chips) body.appendChild(chips);
      }

      [["combat", "Kamp"]].forEach((pair) => {
        const list = npc[pair[0]];
        if (!list || !list.length) return;
        body.appendChild(el("div", { class: "section-label", text: pair[1] }));
        const ul = el("ul", { class: "bullets" });
        list.forEach((line) => ul.appendChild(el("li", { text: line })));
        body.appendChild(ul);
      });
      [["skills", "Ferdigheter"], ["armor", "Rustning"], ["spells", "Formler"],
       ["special", "Spesielt"], ["sanity_loss", "Sanity-tap"],
       ["possessions", "Våpen og eiendeler"], ["notes", "Notater"]]
        .forEach((pair) => {
          const val = npc[pair[0]];
          if (!val || val === "-") return;
          body.appendChild(el("div", { class: "section-label", text: pair[1] }));
          body.appendChild(el("p", { class: "prose", text: val }));
        });
      if (npc.stats_note) {
        body.appendChild(el("p", { class: "caveat", text: npc.stats_note }));
      }
      const refs = crossRefs(npc);
      if (refs) body.appendChild(refs);
      if (npc.id) body.appendChild(noteEditor(npc));
    }, modalActions(npc, "npcs"));
}

function statGrid(stats) {
  const grid = el("dl", { class: "statgrid" });
  const order = CHAR_STATS.concat(
    Object.keys(stats).filter((k) => CHAR_STATS.indexOf(k) === -1));
  order.forEach((k) => {
    if (!stats[k]) return;
    grid.appendChild(el("div", { class: "stat" }, [
      el("dt", { text: k }), el("dd", { text: String(stats[k]) }),
    ]));
  });
  return grid.children.length ? grid : null;
}

function attackTable(attacks) {
  if (!attacks || !attacks.length) return null;
  const wrap = el("div", { class: "tablewrap" });
  const table = el("table", { class: "skills" });
  attacks.forEach((a) => {
    table.appendChild(el("tr", null, [
      el("td", { text: a.name || "—" }),
      el("td", { text: [a.skill, a.damage].filter(Boolean).join("  ") }),
    ]));
  });
  wrap.appendChild(table);
  return wrap;
}

function openCharacter(pc) {
  // Slå opp rollen på nytt hver gang kortet tegnes. Redigerer man den
  // i et nivå over, skal «Tilbake» vise de nye verdiene — ikke den
  // kopien kortet ble åpnet med.
  const id = pc.id;
  const live = () => normalizeChar(
    state.characters.find((x) => x.id === id) || pc);

  openModal(
    () => live().name || "?",
    () => {
      const c = live();
      return [KIND_LABEL[c.kind], c.occ, c.archetype || c.subtitle,
              c.player ? "spilles av " + c.player : null]
        .filter(Boolean).join(" · ");
    },
    (body) => {
      const c = live();
      const grid = statGrid(c.stats);
      if (grid) body.appendChild(grid);

      const atk = attackTable(c.attacks);
      if (atk) {
        body.appendChild(el("div", { class: "section-label", text: "Angrep" }));
        body.appendChild(atk);
      }

      if (c.skills && Object.keys(c.skills).length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Ferdigheter" }));
        const wrap = el("div", { class: "tablewrap" });
        const table = el("table", { class: "skills" });
        Object.keys(c.skills).sort().forEach((k) => {
          const v = String(c.skills[k]);
          table.appendChild(el("tr", null, [
            el("td", { text: k }),
            el("td", { text: /%$/.test(v) ? v : v + "%" }),
          ]));
        });
        wrap.appendChild(table);
        body.appendChild(wrap);
      }

      if (c.talents || c.insane_talents) {
        [["talents", "Talenter"],
         ["insane_talents", "Insane talents"]].forEach((pair) => {
          if (!c[pair[0]]) return;
          body.appendChild(el("div", { class: "section-label",
                                       text: pair[1] }));
          const chips = talentChips(c[pair[0]]);
          if (chips) body.appendChild(chips);
        });
        body.appendChild(el("p", { class: "caveat",
          text: "Trykk på et talent for å se hva det gjør." }));
      }

      [["weapons", "Våpen og utstyr"],
       ["armor", "Rustning"], ["spells", "Formler"],
       ["sanity_loss", "Sanity-tap"], ["backstory", "Bakgrunn"],
       ["notes", "Notater"]].forEach((pair) => {
        if (!c[pair[0]]) return;
        body.appendChild(el("div", { class: "section-label", text: pair[1] }));
        body.appendChild(el("p", { class: "prose", text: c[pair[0]] }));
      });

      // Skapninger med egne mekanismer får dem vist her også, ikke
      // bare i fiendebanken.
      const sp = specialFor(c);
      if (sp) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Spesialregler" }));
        specialRulesBody(sp, body);
      }
    },
    [
      el("button", { class: "btn primary", type: "button", text: "Til kamp",
                     onclick: () => { closeModal(); addToCombat(live()); } }),
      // Ikke lukk kortet først — da legger editoren seg oppå, og
      // «Tilbake» etter lagring viser kortet med de nye verdiene.
      el("button", { class: "btn", type: "button", text: "Rediger",
                     onclick: () => editCharacter(live()) }),
    ]);
}

function itemAsLine(item) {
  const title = item.title || item.name || "(uten tittel)";
  const sub = item.where || item.when || item.deck || "";
  let line = "- " + title;
  if (sub) line += " (" + sub + ")";
  return line;
}

async function copyToSession(item) {
  const sessions = state.progress.sessions;
  if (!sessions.length) {
    sessions.push({ title: "Sesjon 1", date: new Date().toISOString().slice(0, 10),
                    summary: "" });
  }
  const s = sessions[sessions.length - 1];
  s.summary = (s.summary ? s.summary + "\n" : "") + itemAsLine(item);
  await saveProgress();
  toast("Lagt i «" + (s.title || "sesjonen") + "»");
}

const VIEWS = [
  { key: "overview",   label: "Oversikt",   group: "Spill" },
  { key: "timeline",   label: "Tidslinje",  group: "Spill" },
  { key: "beats",      label: "Scener",     group: "Spill" },
  { key: "clues",      label: "Spor",       group: "Spill" },
  { key: "npcs",       label: "NPCer",      group: "Spill" },
  { key: "locations",  label: "Steder",     group: "Oppslag" },
  { key: "handouts",   label: "Handouts",   group: "Oppslag" },
  { key: "reference",  label: "Regler",     group: "Oppslag" },
  { key: "combat",     label: "Kamp",       group: "Bordet" },
  { key: "tactics",    label: "Taktikk",    group: "Bordet" },
  { key: "characters", label: "Roller",     group: "Bordet" },
  { key: "bestiary",   label: "Fiendebank", group: "Bordet" },
  { key: "notes",      label: "Notater",    group: "Mitt" },
  { key: "sessions",   label: "Sesjoner",   group: "Mitt" },
  { key: "library",    label: "Bibliotek",  group: "Mitt" },
];

function navBadge(key) {
  // Disse er uavhengige av hvilket scenario som er aktivt.
  if (key === "characters") return state.characters.length || "";
  if (key === "bestiary") {
    return (state.bestiary && state.bestiary.creatures.length) || "";
  }
  if (key === "tactics") {
    const t = (state.scenario && state.scenario.tactics) || [];
    if (!t.length) return "";
    return t.filter((x) => x.used).length + "/" + t.length;
  }
  if (key === "combat") {
    const cb = state.combat;
    if (!cb || !cb.combatants.length) return "";
    return cb.active ? "R" + cb.round : String(cb.combatants.length);
  }

  const d = state.scenario;
  if (!d) return "";
  if (FLAGS[key] && d[key]) {
    const items = d[key];
    if (!items.length) return "";
    return items.filter((x) => x[FLAGS[key]]).length + "/" + items.length;
  }
  if (key === "npcs" || key === "reference") {
    return (d[key] || []).length || "";
  }
  if (key === "sessions") return state.progress.sessions.length || "";
  if (key === "library") return state.library.items.length || "";
  return "";
}

function renderRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  let group = null;
  VIEWS.forEach((v) => {
    if (v.group !== group) {
      group = v.group;
      rail.appendChild(el("div", { class: "rail-group", text: group }));
    }
    const badge = navBadge(v.key);
    rail.appendChild(el("button", {
      class: "navlink", type: "button",
      "aria-current": state.view === v.key ? "page" : null,
      onclick: () => setView(v.key),
    }, [
      el("span", { text: v.label }),
      badge ? el("span", { class: "count", text: String(badge) }) : null,
    ]));
  });
}

function setView(key) {
  state.view = key;
  state.query = "";
  state.hideDone = false;
  render();
  // Til toppen av dokumentet, ikke til toppen av innholdet — ellers
  // ruller terningkasteren og synk-merket i topplinja ut av syne.
  window.scrollTo({ top: 0, behavior: "auto" });
}

function meter(label, done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return el("div", { class: "meter" }, [
    el("div", { class: "meter-head" }, [
      el("b", { text: label }),
      el("span", { text: done + " / " + total }),
    ]),
    el("div", { class: "meter-track" }, [
      el("div", {
        class: "meter-fill" + (total && done >= total ? " full" : ""),
        style: "width:" + pct + "%",
      }),
    ]),
  ]);
}

function searchBar(placeholder) {
  const input = el("input", {
    class: "field", type: "search", id: "search-" + state.view,
    placeholder: placeholder, value: state.query,
  });
  const run = debounce(() => {
    state.query = input.value;
    const pos = input.selectionStart;
    render();
    const next = document.getElementById("search-" + state.view);
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }, 220);
  input.addEventListener("input", run);
  return input;
}

function entryRow(item, section, tag) {
  const flag = FLAGS[section];
  const done = flag ? !!item[flag] : false;
  const sub = [item.act, item.day, item.when, item.where, item.deck]
    .filter(Boolean).join(" · ");

  const children = [];
  if (flag) {
    children.push(el("button", {
      class: "tick", type: "button", "aria-pressed": String(done),
      "aria-label": (done ? "Fjern kryss for " : "Kryss av ") +
                    (item.title || item.name),
      onclick: (e) => { e.stopPropagation(); toggleFlag(item.id); },
    }));
  } else {
    children.push(el("span", { class: "tick", style: "border-color:transparent" }));
  }

  const bodyBits = [el("span", { class: "entry-title",
                                 text: item.title || item.name || "?" })];
  if (sub) bodyBits.push(el("span", { class: "entry-sub", text: sub }));
  if (item.roll) {
    bodyBits.push(el("span", { class: "entry-sub", text: "Slag: " + item.roll }));
  }
  if (item.userNotes) {
    bodyBits.push(el("span", { class: "entry-note", text: item.userNotes }));
  }
  children.push(el("span", { class: "entry-body" }, bodyBits));
  children.push(el("span", { class: "entry-open", text: "ÅPNE" }));

  return el("button", {
    class: "entry" + (done ? " done" : ""), type: "button",
    "data-tag": tag || item.tag || null,
    onclick: () => openItem(item, section),
  }, children);
}

function filterToolbar(section) {
  const items = state.scenario[section] || [];
  const flag = FLAGS[section];
  const done = items.filter((x) => x[flag]).length;
  const bar = el("div", { class: "row spread", style: "margin-bottom:14px" }, [
    el("button", {
      class: "btn small", type: "button",
      "aria-pressed": String(state.hideDone),
      text: state.hideDone ? "Viser bare gjenstående" : "Skjul avkryssede",
      onclick: () => { state.hideDone = !state.hideDone; render(); },
    }),
    el("span", { class: "chip", text: done + " av " + items.length + " avkrysset" }),
  ]);
  return bar;
}

function visible(items, section) {
  const flag = FLAGS[section];
  return items.filter((it) => {
    if (state.hideDone && flag && it[flag]) return false;
    return matches(it, state.query);
  });
}

function viewOverview(root) {
  const d = state.scenario;
  root.appendChild(el("p", { class: "eyebrow", text: d.system || "Scenario" }));
  root.appendChild(el("h1", { text: d.title }));
  if (d.tagline) root.appendChild(el("p", { class: "lede", text: d.tagline }));

  if (d.player_pitch) {
    root.appendChild(el("div", { class: "panel accent" }, [
      el("p", { class: "eyebrow", text: "Til spillerne" }),
      el("p", { class: "prose", text: d.player_pitch }),
    ]));
  }

  // Neste hendelse: den første på tidslinja som ikke er huket av.
  const upcoming = (d.timeline || []).filter((e) => !e.triggered);
  if (upcoming.length) {
    const e = upcoming[0];
    const card = el("div", { class: "panel" }, [
      el("p", { class: "eyebrow", text: "Neste hendelse" }),
      el("h3", { text: e.title }),
      el("p", { class: "entry-sub",
                text: [e.day, e.when].filter(Boolean).join(" · ") }),
      el("p", { class: "prose tight",
                text: (e.description || "").slice(0, 260) +
                      ((e.description || "").length > 260 ? "…" : "") }),
      el("div", { class: "row" }, [
        el("button", { class: "btn primary", type: "button", text: "Åpne scenen",
                       onclick: () => openItem(e, "timeline") }),
        el("button", { class: "btn", type: "button", text: "Marker utløst",
                       onclick: () => toggleFlag(e.id) }),
      ]),
    ]);
    root.appendChild(card);
    if (upcoming.length > 1) {
      root.appendChild(el("p", { class: "entry-sub",
        style: "margin:-8px 0 20px",
        text: "Deretter: " + upcoming[1].title }));
    }
  } else {
    root.appendChild(el("div", { class: "panel" }, [
      el("p", { class: "eyebrow", text: "Tidslinje" }),
      el("h3", { text: "Alle hendelser er huket av" }),
    ]));
  }

  root.appendChild(el("h2", { text: "Fremdrift" }));
  const labels = { timeline: "Tidslinje", beats: "Scener",
                   clues: "Spor funnet", locations: "Steder besøkt",
                   handouts: "Handouts utdelt" };
  let allDone = 0, allTotal = 0;
  Object.keys(labels).forEach((key) => {
    const items = d[key] || [];
    if (!items.length) return;
    const done = items.filter((x) => x[FLAGS[key]]).length;
    allDone += done; allTotal += items.length;
    root.appendChild(meter(labels[key], done, items.length));
  });
  if (allTotal) {
    root.appendChild(el("p", { class: "entry-sub",
      text: Math.round((allDone / allTotal) * 100) + "% gjennomspilt — " +
            allDone + " av " + allTotal + " punkter." }));
  }

  if (d.keeper_summary) {
    root.appendChild(el("h2", { text: "Hva som egentlig foregår" }));
    root.appendChild(el("p", { class: "prose", text: d.keeper_summary }));
  }

  if (d.keeper_brief && d.keeper_brief.length) {
    root.appendChild(el("h2", { text: "Keeper-brief" }));
    const stack = el("div", { class: "stack" });
    d.keeper_brief.forEach((b) => {
      stack.appendChild(el("button", {
        class: "entry", type: "button",
        onclick: () => openModal(b.title, "", (body) => {
          body.appendChild(el("p", { class: "prose", text: b.body }));
        }, []),
      }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title", text: b.title }),
          el("span", { class: "entry-sub",
                       text: b.body.slice(0, 90) + "…" }),
        ]),
        el("span", { class: "entry-open", text: "ÅPNE" }),
      ]));
    });
    root.appendChild(stack);
  }

  root.appendChild(el("div", { class: "row", style: "margin-top:28px" }, [
    el("button", { class: "btn danger small", type: "button",
                   text: "Nullstill all fremdrift",
                   onclick: () => confirmThen(
                     "Nullstill fremdrift?",
                     "Alle avkryssinger i tidslinje, scener, spor, steder og " +
                     "handouts fjernes. Notater og sesjoner beholdes.",
                     resetProgress) }),
  ]));
}

function viewTimeline(root) {
  root.appendChild(el("h1", { text: "Tidslinje" }));
  root.appendChild(el("p", { class: "lede",
    text: "Reisen fra San Francisco til Shanghai, dag for dag. " +
          "Fargen til venstre viser hva slags hendelse det er." }));
  root.appendChild(searchBar("Søk i tidslinjen…"));
  root.appendChild(el("div", { style: "height:12px" }));
  root.appendChild(filterToolbar("timeline"));

  const legend = el("div", { class: "row", style: "margin-bottom:18px" });
  [["villain", "Skurkens trekk", "var(--signal)"],
   ["event", "Hendelse", "var(--brass-dim)"],
   ["voyage", "Reise og vær", "var(--tide)"],
   ["social", "Selskapsliv", "var(--rule-soft)"]].forEach((t) => {
    legend.appendChild(el("span", { class: "chip" }, [
      el("span", { class: "swatch", style: "background:" + t[2] }),
      t[1],
    ]));
  });
  root.appendChild(legend);

  const items = visible(state.scenario.timeline || [], "timeline");
  if (!items.length) { root.appendChild(emptyBox("Ingen treff.")); return; }

  const days = [];
  const byDay = {};
  items.forEach((it) => {
    const key = it.day || "(udatert)";
    if (!byDay[key]) { byDay[key] = []; days.push(key); }
    byDay[key].push(it);
  });

  days.forEach((day) => {
    const evs = byDay[day];
    const done = evs.filter((e) => e.triggered).length;
    const block = el("section", { class: "day" }, [
      el("div", { class: "day-head" }, [
        el("h3", { text: day }),
        el("span", { text: done + "/" + evs.length }),
      ]),
    ]);
    const stack = el("div", { class: "stack" });
    evs.forEach((e) => stack.appendChild(entryRow(e, "timeline", e.tag)));
    block.appendChild(stack);
    root.appendChild(block);
  });
}

function viewSessions(root) {
  root.appendChild(el("h1", { text: "Sesjoner" }));
  root.appendChild(el("p", { class: "lede",
    text: "Én oppsummering per spillkveld. Elementer du sender hit fra " +
          "en scene havner i den nyeste." }));

  root.appendChild(el("div", { class: "row", style: "margin-bottom:18px" }, [
    el("button", {
      class: "btn primary", type: "button", text: "Ny sesjon",
      onclick: async () => {
        state.progress.sessions.push({
          title: "Sesjon " + (state.progress.sessions.length + 1),
          date: new Date().toISOString().slice(0, 10),
          summary: "",
        });
        await saveProgress();
        render();
      },
    }),
    state.progress.sessions.length ? el("button", {
      class: "btn small", type: "button", text: "Kopier alt som tekst",
      onclick: () => {
        const text = state.progress.sessions.map((s) =>
          (s.title || "") + " — " + (s.date || "") + "\n" + (s.summary || "")
        ).join("\n\n");
        navigator.clipboard.writeText(text)
          .then(() => toast("Kopiert til utklippstavla"))
          .catch(() => toast("Kunne ikke kopiere"));
      },
    }) : null,
  ]));

  if (!state.progress.sessions.length) {
    root.appendChild(emptyBox("Ingen sesjoner logget ennå.",
      "Trykk «Ny sesjon» etter første spillkveld."));
    return;
  }

  state.progress.sessions.forEach((s, i) => {
    const panel = el("div", { class: "panel" });
    const title = el("input", { class: "field", id: "sess-title-" + i,
                                value: s.title || "" });
    const date = el("input", { class: "field", type: "date",
                               id: "sess-date-" + i, value: s.date || "" });
    const summary = el("textarea", { class: "field", rows: "6",
                                     id: "sess-sum-" + i,
                                     placeholder: "Hva skjedde?" });
    summary.value = s.summary || "";

    const save = debounce(async () => {
      s.title = title.value; s.date = date.value; s.summary = summary.value;
      await saveProgress();
    }, 600);
    [title, date, summary].forEach((f) => f.addEventListener("input", save));

    panel.appendChild(el("div", { class: "grid-2" }, [title, date]));
    panel.appendChild(el("div", { style: "height:10px" }));
    panel.appendChild(summary);
    panel.appendChild(el("div", { class: "row", style: "margin-top:10px" }, [
      el("button", { class: "btn danger small", type: "button", text: "Slett",
        onclick: () => confirmThen("Slett sesjon?",
          "«" + (s.title || "Uten navn") + "» blir borte.", async () => {
            state.progress.sessions.splice(i, 1);
            await saveProgress();
            render();
          }) }),
    ]));
    root.appendChild(panel);
  });
}

  root.appendChild(el("h1", { text: "Roller" }));
  root.appendChild(el("p", { class: "lede",
    text: "Spillere, NPCer og fiender i én liste. Alt kan redigeres, og " +
          "alt kan sendes rett inn i en kamp." }));

  const picker = el("input", { type: "file", accept: ".json,application/json",
                               id: "char-file", style: "display:none" });
  picker.addEventListener("change", async () => {
    const file = picker.files && picker.files[0];
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const list = (Array.isArray(parsed) ? parsed : [parsed])
        .map(normalizeChar);
      // Slå sammen på navn, slik at en ny import ikke lager duplikater
      // av folk du allerede har redigert.
      const byName = {};
      state.characters.forEach((c) => { byName[c.name.toLowerCase()] = c; });
      let added = 0, updated = 0;
      list.forEach((incoming) => {
        const hit = byName[incoming.name.toLowerCase()];
        if (hit) {
          Object.assign(hit, incoming, { id: hit.id });
          updated += 1;
        } else {
          state.characters.push(incoming);
          added += 1;
        }
      });
      await saveCharacters();
      toast(added + " lagt til, " + updated + " oppdatert");
      render();
    } catch (e) {
      toast("Kunne ikke lese fila: " + e.message);
    }
    picker.value = "";
  });

  // --- knapperad
  const actions = el("div", { class: "row", style: "margin-bottom:14px" });
  KINDS.forEach((k) => {
    actions.appendChild(el("button", {
      class: "btn", type: "button", text: "+ " + k.label,
      onclick: () => editCharacter(null, k.key),
    }));
  });
  actions.appendChild(el("button", {
    class: "btn small", type: "button", text: "Importer",
    onclick: () => picker.click(),
  }));
  if (state.characters.length) {
    actions.appendChild(el("button", {
      class: "btn small", type: "button", text: "Eksporter",
      onclick: () => download("characters.json", state.characters),
    }));
  }
  actions.appendChild(picker);
  root.appendChild(actions);

  // --- filter etter type
  const counts = { all: state.characters.length };
  KINDS.forEach((k) => {
    counts[k.key] = state.characters.filter((c) => c.kind === k.key).length;
  });
  const filters = el("div", { class: "row", style: "margin-bottom:12px" });
  const chips = [{ key: "all", label: "Alle" }].concat(
    KINDS.map((k) => ({ key: k.key, label: k.plural })));
  chips.forEach((c) => {
    filters.appendChild(el("button", {
      class: "btn small", type: "button",
      "aria-pressed": String(state.charFilter === c.key),
      text: c.label + " (" + (counts[c.key] || 0) + ")",
      onclick: () => { state.charFilter = c.key; render(); },
    }));
  });
  root.appendChild(filters);

  root.appendChild(searchBar("Søk i roller…"));
  root.appendChild(el("div", { style: "height:14px" }));

  if (!state.characters.length) {
    root.appendChild(emptyBox("Ingen roller ennå.",
      "Lag en ny, eller importer characters.json fra Android-appen."));
    return;
  }

  const q = state.query.toLowerCase();
  const shown = state.characters.filter((c) => {
    if (state.charFilter !== "all" && c.kind !== state.charFilter) return false;
    if (!q) return true;
    return [c.name, c.occ, c.archetype, c.player, c.subtitle, c.notes]
      .filter(Boolean).join(" ").toLowerCase().indexOf(q) !== -1;
  });

  if (!shown.length) {
    root.appendChild(emptyBox("Ingen treff."));
    return;
  }

  // Grupper etter type, i den rekkefølgen KINDS definerer.
  KINDS.forEach((k) => {
    const members = shown.filter((c) => c.kind === k.key);
    if (!members.length) return;
    const block = el("section", { class: "day" }, [
      el("div", { class: "day-head" }, [
        el("h3", { text: k.plural }),
        el("span", { text: String(members.length) }),
      ]),
    ]);
    const stack = el("div", { class: "stack" });
    members.forEach((c) => stack.appendChild(characterRow(c)));
    block.appendChild(stack);
    root.appendChild(block);
  });
}

function characterRow(c) {
  const tag = c.kind === "enemy" ? "villain"
    : (c.kind === "npc" ? "event" : null);
  const bits = [c.occ, c.archetype, c.subtitle].filter(Boolean);
  const hp = c.stats.HP ? "HP " + c.stats.HP : null;
  const san = c.stats.SAN ? "SAN " + c.stats.SAN : null;
  const sub = bits.concat([hp, san].filter(Boolean)).join(" · ");

  return el("div", { class: "entry", "data-tag": tag }, [
    el("span", { class: "tick", style: "border-color:transparent" }),
    el("span", { class: "entry-body" }, [
      el("button", {
        class: "linkish", type: "button",
        onclick: () => openCharacter(c),
      }, [el("span", { class: "entry-title", text: c.name || "(uten navn)" })]),
      sub ? el("span", { class: "entry-sub", text: sub }) : null,
    ]),
    el("span", { class: "rowtools" }, [
      el("button", { class: "btn small", type: "button", text: "Til kamp",
                     onclick: () => { addToCombat(c); } }),
      // Snarvei rett til våpenvelgeren. Kjøper spillerne noe i en
      // butikk, skal man slippe å lete etter det inne i editoren.
      el("button", { class: "btn small", type: "button", text: "+ Våpen",
                     title: "Åpne editoren med våpenlista framme",
                     onclick: () => editCharacter(c, null, "weapons") }),
      el("button", { class: "btn small", type: "button", text: "Rediger",
                     onclick: () => editCharacter(c) }),
      el("button", { class: "btn small", type: "button", text: "Dupliser",
                     onclick: () => duplicateCharacter(c) }),
      el("button", { class: "btn small danger", type: "button", text: "Slett",
                     onclick: () => confirmThen("Slett rolle?",
                       "«" + (c.name || "uten navn") + "» blir borte.",
                       async () => {
                         state.characters = state.characters
                           .filter((x) => x.id !== c.id);
                         await saveCharacters();
                         render();
                         toast("Slettet");
                       }) }),
    ]),
  ]);
}

async function duplicateCharacter(c) {
  const copy = normalizeChar(JSON.parse(JSON.stringify(c)));
  copy.id = newId("ch");
  copy.name = uniqueName(c.name || "Uten navn");
  state.characters.push(copy);
  await saveCharacters();
  render();
  toast("Duplisert som «" + copy.name + "»");
}

function uniqueName(base) {
  // «Ghoul» -> «Ghoul 2» -> «Ghoul 3». Nyttig når du legger fire like
  // fiender inn i samme kamp.
  const stem = base.replace(/\s+\d+$/, "");
  const taken = new Set(state.characters.map((c) => c.name));
  if (!taken.has(stem)) return stem;
  let n = 2;
  while (taken.has(stem + " " + n)) n += 1;
  return stem + " " + n;
}

// focus: "weapons" åpner editoren med våpenlista framme med én gang.
function editCharacter(existing, kindHint, focus) {
  const isNew = !existing;
  const c = normalizeChar(existing
    ? JSON.parse(JSON.stringify(existing))
    : { kind: kindHint || "pc", name: "" });

  const fields = {};

  openModal(isNew ? "Ny rolle" : "Rediger " + (c.name || "rolle"), "",

          text: k.label,
          onclick: (e) => {
            c.kind = k.key;
            Array.from(kindRow.children).forEach((b) => {
              b.setAttribute("aria-pressed",
                String(b.textContent === KIND_LABEL[c.kind]));
            });

      });
      body.appendChild(kindRow);

      // --- grunnfelter
      body.appendChild(el("div", { class: "section-label", text: "Navn og rolle" }));
      body.appendChild(textRow("Navn", "name", c.name, "Hva heter den?"));
      body.appendChild(textRow("Yrke / type", "occ", c.occ,
                               "Dr. of Medicine, Mythos-skapning …"));
      body.appendChild(textRow("Arketyp / undertittel", "archetype",
                               c.archetype || c.subtitle, ""));
      body.appendChild(textRow("Spiller", "player", c.player,
                               "Hvem spiller den? (bare for spillere)"));

      // --- karakteristikker
      body.appendChild(el("div", { class: "section-label",

      const grid = el("div", { class: "editgrid" });
      CHAR_STATS.forEach((k) => {
        const input = el("input", { class: "field", id: "ed-stat-" + k,
                                    value: c.stats[k] || "" });
        fields["stat:" + k] = input;
        grid.appendChild(el("label", { class: "statedit" }, [
          el("span", { text: k }), input,
        ]));
      });
      body.appendChild(grid);

      // --- angrep
      body.appendChild(el("div", { class: "section-label", text: "Angrep" }));
      body.appendChild(el("p", { class: "entry-sub",
        text: "Våpnene som står her er de rollen kan bruke i kamp. " +
              "«+ Legg til våpen» henter hele statblokka — skade, " +
              "rekkevidde, magasin og feilgrense. Treffsjansen fylles " +
              "inn fra rollens egen ferdighet, eller fra et våpen av " +
              "samme sort den alt har; står feltet tomt, må du skrive " +
              "den inn selv." }));
      const attackList = el("div", { class: "stack" });
      function attackRow(a) {
        const name = el("input", { class: "field", value: a.name || "",
                                   placeholder: "Klo" });
        const skill = el("input", { class: "field", value: a.skill || "",
                                    placeholder: "45%" });
        // Et angrep uten treffsjanse er ubrukelig i kamp. Feltet får
        // en markering til det er fylt ut.
        function markSkill() {
          skill.classList.toggle("needs", !skill.value.trim());
        }
        skill.addEventListener("input", markSkill);
        markSkill();
        const dmg = el("input", { class: "field", value: a.damage || "",
                                  placeholder: "1D6 + db" });
        // Våpenegenskapene redigeres ikke for hånd, men må følge med
        // videre — det er de som gjør at kampen regner riktig.
        const extra = {
          uses_db: a.uses_db, can_impale: a.can_impale,
          malfunction: a.malfunction, attacks: a.attacks,
          ammo: a.ammo, range: a.range, weaponId: a.weaponId,
          // Kategorien avgjør om angrepet er nærkamp eller avstand, og
          // hvilke skaderegler som gjelder mot skapninger som bare
          // biter på visse våpen. Den må følge med ut av editoren.
          category: a.category, subcategory: a.subcategory,
          ignores_armor: a.ignores_armor, abilityId: a.abilityId,
        };
        const flags = [
          extra.can_impale ? "spidder" : null,
          extra.uses_db === "half" ? "halv db"
            : (extra.uses_db ? "db" : null),
          extra.malfunction ? "feiler " + extra.malfunction : null,
          extra.range ? extra.range : null,
        ].filter(Boolean).join(" · ");

        const row = el("div", { class: "attackrow" }, [
          name, skill, dmg,
          el("button", { class: "btn small danger", type: "button", text: "×",
                         onclick: () => row.remove() }),
        ]);
        if (flags) {
          row.appendChild(el("span", { class: "attackflags", text: flags }));
        }
        row._read = () => Object.assign({}, extra, {
          name: name.value.trim(),
          skill: skill.value.trim(),
          damage: dmg.value.trim(),
        });
        return row;
      }
      c.attacks.forEach((a) => attackList.appendChild(attackRow(a)));
      body.appendChild(attackList);
      body.appendChild(el("div", { class: "row" }, [
        el("button", {
          class: "btn small", type: "button", text: "+ Tomt angrep",
          onclick: () => attackList.appendChild(attackRow({})),

        (state.weapons && state.weapons.weapons.length) ? el("button", {
          class: "btn small primary", type: "button", text: "+ Legg til våpen",
          id: "toggle-weapons",
          onclick: (e) => {
            e.preventDefault();
            weapPanel.hidden = !weapPanel.hidden;
            if (!weapPanel.hidden) {
              const f = document.getElementById("weap-search");
              if (f) f.focus();

        }) : null,
      ]));
      const weapPanel = weaponPickerPanel((w) => {
        attackList.appendChild(attackRow(weaponToAttack(w, c)));
      });
      body.appendChild(weapPanel);
      if (focus === "weapons") {
        weapPanel.hidden = false;
        // Lista ligger et stykke nede i editoren.
        setTimeout(() => {
          weapPanel.scrollIntoView({ block: "center" });
          const f = document.getElementById("weap-search");
          if (f) f.focus();
        }, 0);
      }
      fields._attacks = attackList;

      // --- ferdigheter
      body.appendChild(el("div", { class: "section-label",
                                   text: "Ferdigheter" }));
      const skillList = el("div", { class: "stack" });
      function skillRow(k, v) {
        const name = el("input", { class: "field", value: k || "",
                                   placeholder: "Spot Hidden" });
        const val = el("input", { class: "field", value: v || "",
                                  placeholder: "50" });
        const row = el("div", { class: "skillrow" }, [
          name, val,
          el("button", { class: "btn small danger", type: "button", text: "×",
                         onclick: () => row.remove() }),
        ]);
        row._read = () => [name.value.trim(), val.value.trim()];
        return row;
      }
      Object.keys(c.skills).sort().forEach((k) => {
        skillList.appendChild(skillRow(k, c.skills[k]));
      });
      body.appendChild(skillList);
      body.appendChild(el("button", {
        class: "btn small", type: "button", text: "+ Legg til ferdighet",
        onclick: () => skillList.appendChild(skillRow("", "")),
      }));
      fields._skills = skillList;

      // --- fritekst
      body.appendChild(el("div", { class: "section-label", text: "Tekst" }));
      // --- talenter, med velger
      body.appendChild(el("div", { class: "section-label",
                                   text: "Talenter" }));
      const talField = el("textarea", { class: "field", rows: "2",
                                        id: "ed-talents",
                                        placeholder: "Keen Hearing, Hardened…" });
      talField.value = c.talents || "";
      fields.talents = talField;
      body.appendChild(talField);
      const talPanel = talentPickerPanel("pulp", talField);
      body.appendChild(el("button", {
        class: "btn small primary", type: "button", id: "toggle-talents",
        text: "+ Fra talentlista",
        onclick: (e) => {
          e.preventDefault();
          talPanel.hidden = !talPanel.hidden;
        },
      }));
      body.appendChild(talPanel);

      body.appendChild(el("div", { class: "section-label",
                                   text: "Insane talents" }));
      const insField = el("textarea", { class: "field", rows: "2",
                                        id: "ed-insane_talents",
                                        placeholder: "Insane strength…" });
      insField.value = c.insane_talents || "";
      fields.insane_talents = insField;
      body.appendChild(insField);
      const insPanel = talentPickerPanel("insane", insField);
      body.appendChild(el("button", {
        class: "btn small primary", type: "button", id: "toggle-insane",
        text: "+ Fra insane-lista",
        onclick: (e) => {
          e.preventDefault();
          insPanel.hidden = !insPanel.hidden;
        },
      }));
      body.appendChild(insPanel);

      [["weapons", "Våpen og utstyr"],
       ["armor", "Rustning"], ["spells", "Formler"],
       ["sanity_loss", "Sanity-tap"], ["backstory", "Bakgrunn"],
       ["notes", "Notater"]].forEach((pair) => {
        const ta = el("textarea", { class: "field", rows: "2",
                                    id: "ed-" + pair[0] });
        ta.value = c[pair[0]] || "";
        fields[pair[0]] = ta;
        body.appendChild(el("label", { class: "formrow" }, [
          el("span", { class: "formlabel", text: pair[1] }), ta,

    },
    [
      el("button", { class: "btn", type: "button", text: "Avbryt",
                     onclick: closeModal }),
      el("button", {
        class: "btn primary", type: "button",
        text: isNew ? "Opprett" : "Lagre",
        onclick: async () => {
          ["name", "occ", "archetype", "player", "weapons", "talents",
           "insane_talents", "armor", "spells", "sanity_loss",
           "backstory", "notes"]
            .forEach((k) => { if (fields[k]) c[k] = fields[k].value.trim(); });

          c.stats = {};
          CHAR_STATS.forEach((k) => {
            const v = fields["stat:" + k].value.trim();
            if (v) c.stats[k] = v;
          });

          c.attacks = Array.from(fields._attacks.children)
            .map((r) => r._read())
            .filter((a) => a.name || a.skill || a.damage);

          c.skills = {};
          Array.from(fields._skills.children).forEach((r) => {
            const pair = r._read();

          if (!c.name) { toast("Rollen trenger et navn"); return; }

          if (isNew) {
            state.characters.push(c);

            // Skriv tilbake PÅ det eksisterende objektet i stedet for å
            // bytte det ut. Kortet som ligger under i modalstabelen
            // holder på en referanse hit, og ville ellers vist de gamle
            // verdiene når man kommer tilbake til det.
            const existing = state.characters.find((x) => x.id === c.id);
            if (existing) Object.assign(existing, c);
            else state.characters.push(c);
          }
          await saveCharacters();
          closeModal();
          render();
          toast(isNew ? "Opprettet" : "Lagret");
        },
      }),
    ]);
}

// Ferdighetsnavnet i weapons.json er norsk («Skytevåpen (Håndvåpen)»).
// Har karakteren en ferdighet som ligner, bruker vi verdien derfra som
// treffsjanse — ellers står feltet tomt til Keeperen fyller det ut.
// Våpenlista er på norsk, mens karakterarkene ofte har engelske
// ferdighetsnavn. Uten denne broa ville ingen treffsjanse funnet seg
// selv.
const SKILL_SYNONYMS = {
  "håndvåpen": ["handgun", "pistol", "revolver"],
  "rifle": ["rifle", "rifle/shotgun"],
  "hagle": ["shotgun", "rifle/shotgun"],
  "maskinpistol": ["submachine gun", "smg"],
  "maskingevær": ["machine gun"],
  "nærkamp": ["brawl", "fighting"],
  "slagvåpen": ["brawl", "fighting"],
  "kniv": ["knife", "fighting"],
  "sverd": ["sword", "fighting"],
  "øks": ["axe", "fighting"],
  "pisk": ["whip"],
  "bue": ["bow"],
  "kast": ["throw"],
  "sprengstoff": ["demolitions"],
};

function skillCandidates(weaponSkill) {
  const want = String(weaponSkill || "").toLowerCase();
  const out = [want];
  const inner = (want.match(/\(([^)]+)\)/) || [])[1];
  if (inner) out.push(inner.trim());
  const head = want.split("(")[0].trim();
  if (head) out.push(head);
  Object.keys(SKILL_SYNONYMS).forEach((k) => {
    if (want.indexOf(k) !== -1) {
      SKILL_SYNONYMS[k].forEach((alt) => out.push(alt));
    }
  });
  return out.filter(Boolean);
}

function skillValueFor(character, weapon) {
  if (!character || !character.skills) return "";
  const want = String(weapon.skill || "").toLowerCase();
  const keys = Object.keys(character.skills);

  // Prøv synonymene før den løsere delstreng-matchinga under.
  for (const cand of skillCandidates(weapon.skill)) {
    const exact = keys.find((k) => k.toLowerCase() === cand);
    if (exact) {
      const v = String(character.skills[exact]).replace("%", "").trim();
      if (v) return v + "%";
    }
    const loose = keys.find((k) => k.toLowerCase().indexOf(cand) !== -1);
    if (loose) {
      const v = String(character.skills[loose]).replace("%", "").trim();
      if (v) return v + "%";
    }
  }
  // Eksakt treff først, deretter på ordet i parentes (Håndvåpen, Rifle).
  let hit = keys.find((k) => k.toLowerCase() === want);
  if (!hit) {
    const inner = (want.match(/\(([^)]+)\)/) || [])[1];
    if (inner) {
      hit = keys.find((k) => k.toLowerCase().indexOf(inner) !== -1);
    }
  }
  if (!hit) {
    const head = want.split("(")[0].trim();
    if (head) hit = keys.find((k) => k.toLowerCase().indexOf(head) !== -1);
  }
  if (!hit) return "";
  const v = String(character.skills[hit]).replace("%", "").trim();
  return v ? v + "%" : "";
}

/* Treffsjansen for et våpen som legges på en rolle.

   Først rollens egen ferdighet. Finner vi ikke den — mange NPCer har
   bare et knippe ferdigheter skrevet ned — bruker vi treffsjansen fra
   et våpen av samme sort som rollen alt har. Gir vi den en hagle til,
   skyter den like godt med den som med den første. Uten dette blir
   feltet stående tomt, og våpenet er ubrukelig i kamp.            */
function attackSkillFor(character, w) {
  const direct = skillValueFor(character, w);
  if (direct) return direct;
  if (!character) return "";

  const own = (character.attacks || []).filter((a) => a.skill);
  const sub = String(w.subcategory || "").toLowerCase();
  const cat = String(w.category || "").toLowerCase();

  const same = (key, val) => own.find(
    (a) => val && String(a[key] || "").toLowerCase() === val);

  const hit = same("subcategory", sub) || same("category", cat) ||
    (cat === "melee" ? own.find((a) => !isRangedAttack(a)) : null);
  return hit ? hit.skill : "";
}

function weaponToAttack(w, character) {
  return {
    name: w.name,
    skill: attackSkillFor(character, w),
    damage: w.damage || "",
    uses_db: w.uses_db,
    can_impale: !!w.can_impale,
    malfunction: w.malfunction || null,
    attacks: w.attacks || null,
    ammo: w.ammo || null,
    range: w.range || null,
    category: w.category || "",
    subcategory: w.subcategory || "",
    weaponId: w.id,
  };
}

// Skytevåpen og kastevåpen kan ikke møtes med å slå tilbake, og
// unnvikes bare ved å dykke i dekning. Statblokker fra Malleus har
// verken kategori eller rekkevidde — klør og bitt er nærkamp.
function isRangedAttack(a) {
  if (!a) return false;
  if (a.manoeuvre) return false;
  const cat = String(a.category || "").toLowerCase();
  if (cat === "melee") return false;
  if (cat === "firearms" || cat === "heavy") return true;
  const skill = String(a.skill_name || a.skill || "").toLowerCase();
  if (/skytev|kaste|bue|armbrøst/.test(skill)) return true;
  const rng = String(a.range || "").toLowerCase();
  if (!rng) return false;
  return !/berøring|nærkamp|touch|melee/.test(rng);
}

// Våpenvelgeren er et panel inne i editoren, ikke en egen modal:
// modalene her kan ikke stables, så en modal oppå editoren ville bare
// lukket den og kastet endringene.
function weaponPickerPanel(onPick) {
  const bank = state.weapons;
  const panel = el("div", { class: "weappanel", hidden: true });
  if (!bank) return panel;

  const cats = bank.categories || {};
  const listBox = el("div", { class: "picklist short" });
  let query = "";

  function refresh() {
    listBox.innerHTML = "";
    const q = query.trim().toLowerCase();
    const shown = bank.weapons.filter((w) => !q ||
      (w.name + " " + (w.skill || "") + " " + (w.damage || ""))
        .toLowerCase().indexOf(q) !== -1);
    if (!shown.length) { listBox.appendChild(emptyBox("Ingen treff.")); return; }

    const order = [];
    const byCat = {};
    shown.forEach((w) => {

    });
    order.forEach((cat) => {

                                      text: cats[cat] || cat }));
      byCat[cat].forEach((w) => {

                     w.attacks ? w.attacks + "/runde" : null,

                     w.can_impale ? "spidder" : null]

  panel.appendChild(search);
  panel.appendChild(el("div", { style: "height:8px" }));
  panel.appendChild(listBox);

/* --------------------------- talenter ---------------------------- */

// Talentfeltet er fritekst («Weird Science, Rapid Fire, Hardened»).
// Del det opp og slå hvert navn opp i talentboka.
function splitTalents(text) {
  return String(text || "")
    .split(/[,;\n]/).map((t) => t.trim()).filter(Boolean);
}

/* Talenter skrives ofte med valget sitt hengt på: «Psychic Power:
   Telekinesis», «Animal Companion (dog)». Boka fører dem under
   grunnnavnet, så begge formene må finne fram — og valget skal vises,
   ikke kastes.                                                     */
function splitTalentName(name) {
  const raw = String(name || "").trim();
  let base = raw;
  let spec = "";
  const colon = raw.indexOf(":");
  if (colon !== -1) {
    base = raw.slice(0, colon).trim();
    spec = raw.slice(colon + 1).trim();
  } else {
    const par = raw.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (par) { base = par[1].trim(); spec = par[2].trim(); }
  }
  return { raw: raw, base: base, spec: spec };
}

function lookupTalent(name) {
  const parts = splitTalentName(name);
  return talentIndex[parts.raw.toLowerCase()] ||
         talentIndex[parts.base.toLowerCase()] || null;
}

/* Regelboksene et talent viser videre til — psykiske krefter, weird
   science, Luck-bruk. Uten dem sier talentet bare «see page 83».  */
function talentRulesFor(name) {
  const bank = state.talentRules;
  if (!bank) return [];
  const parts = splitTalentName(name);
  const key = Object.keys(bank.talents || {}).find(
    (k) => k.toLowerCase() === parts.base.toLowerCase() ||
           k.toLowerCase() === parts.raw.toLowerCase());
  if (!key) return [];
  return (bank.talents[key] || [])
    .map((id) => (bank.rules || []).find((r) => r.id === id))
    .filter(Boolean);
}

function openRuleBox(rule, highlight) {
  openModal(rule.title, rule.source, (body) => {
    if (rule.intro) {
      body.appendChild(el("p", { class: "prose", text: rule.intro }));
    }
    // Har rollen valgt én av kreftene, legges den øverst.
    const secs = (rule.sections || []).slice();
    if (highlight) {
      const i = secs.findIndex(
        (x) => x.title.toLowerCase() === String(highlight).toLowerCase());
      if (i > 0) secs.unshift(secs.splice(i, 1)[0]);
    }
    secs.forEach((sec) => {
      const on = highlight &&
        sec.title.toLowerCase() === String(highlight).toLowerCase();
      body.appendChild(el("div", {
        class: "section-label" + (on ? " chosen" : ""),
        text: sec.title + (on ? "  ← valgt" : "") }));
      body.appendChild(el("p", { class: "prose", text: sec.body }));
    });
  }, []);
}

function talentChips(text) {
  const names = splitTalents(text);
  if (!names.length) return null;
  const wrap = el("div", { class: "talentchips" });
  names.forEach((n) => {
    const t = lookupTalent(n);
    wrap.appendChild(el("button", {
      class: "chip talent" + (t ? " known" : ""), type: "button",
      title: t ? "Trykk for forklaring" : "Ikke funnet i talentboka",
      text: n,
      onclick: () => openTalent(n, t),
    }));
  });
  return wrap;
}

// Talentvelger som panel inne i editoren, av samme grunn som
// våpenvelgeren: modalene kan ikke stables oppå editoren uten å bygge
// den opp på nytt, og da ville alt du hadde skrevet gått tapt.
// «kind» er «pulp» eller «insane»; valgte talenter legges til i
// tekstfeltet, kommaseparert.
function talentPickerPanel(kind, targetField) {
  const panel = el("div", { class: "weappanel", hidden: true });
  const all = (state.talents && state.talents.talents) || [];
  const pool = all.filter((t) => t.kind === kind);
  if (!pool.length) {
    panel.appendChild(el("p", { class: "caveat",
      text: "Ingen talenter av denne typen er bygget inn." }));
    return panel;
  }

  const listBox = el("div", { class: "picklist short" });
  let query = "";

  function chosen() {
    return splitTalents(targetField.value).map((x) => x.toLowerCase());
  }

  function toggle(t) {
    const have = chosen();
    const i = have.indexOf(t.name.toLowerCase());
    let list = splitTalents(targetField.value);
    if (i === -1) list.push(t.name);
    else list.splice(i, 1);
    targetField.value = list.join(", ");
    refresh();
  }

  function refresh() {
    listBox.innerHTML = "";
    const q = query.trim().toLowerCase();
    const shown = pool.filter((t) => !q ||
      (t.name + " " + t.description).toLowerCase().indexOf(q) !== -1);
    if (!shown.length) { listBox.appendChild(emptyBox("Ingen treff.")); return; }

    const order = [];
    const byGroup = {};
    shown.forEach((t) => {
      const g = t.group || "Talent";
      if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
      byGroup[g].push(t);
    });

    const have = chosen();
    order.forEach((g) => {
      listBox.appendChild(el("div", { class: "section-label", text: g }));
      byGroup[g].forEach((t) => {
        const on = have.indexOf(t.name.toLowerCase()) !== -1;
        listBox.appendChild(el("button", {
          class: "entry pickrow" + (on ? " picked" : ""), type: "button",
          "aria-pressed": String(on),
          onclick: (e) => { e.preventDefault(); toggle(t); },
        }, [
          el("span", { class: "pickbox" + (on ? " on" : "") }),
          el("span", { class: "entry-body" }, [
            el("span", { class: "entry-title", text: t.name }),
            el("span", { class: "entry-sub", text: t.description }),
          ]),
        ]));
      });
    });
  }

  const search = el("input", {
    class: "field", type: "search",
    id: "talent-search-" + kind,
    placeholder: "Søk i " + pool.length + " talenter…",
  });
  search.addEventListener("input", debounce(() => {
    query = search.value; refresh();
  }, 180));
  panel.appendChild(search);
  panel.appendChild(el("div", { style: "height:8px" }));
  panel.appendChild(listBox);
  refresh();
  return panel;
}

function openTalent(name, talent) {
  openModal(talent ? talent.name : name,
    talent ? talent.group : "Ukjent talent", (body) => {
      if (!talent) {
        body.appendChild(el("p", {
          text: "Dette talentet står ikke i Pulp Cthulhu-tabellene som " +
                "er lest inn. Det kan være fra en annen kilde, eller " +
                "skrevet litt annerledes enn i boka." }));
        const all = (state.talents && state.talents.talents) || [];
        const near = all.filter((t) =>
          t.name.toLowerCase().indexOf(name.toLowerCase().slice(0, 4)) !== -1);
        if (near.length) {
          body.appendChild(el("div", { class: "section-label",
                                       text: "Mente du" }));
          near.slice(0, 6).forEach((t) => {
            body.appendChild(el("button", {
              class: "btn small", type: "button", text: t.name,
              onclick: () => openTalent(t.name, t),
            }));
          });
        }

      }
      const parts = splitTalentName(name);
      if (parts.spec) {

      // Talenter som bare viser videre til et kapittel får reglene

      const rules = talentRulesFor(name);
      if (rules.length) {
        body.appendChild(el("div", { class: "section-label",

        const stack = el("div", { class: "stack" });
        rules.forEach((r) => {
          stack.appendChild(el("button", {
            class: "entry pickrow", type: "button",
            onclick: () => openRuleBox(r, parts.spec),
          }, [
            el("span", { class: "entry-body" }, [
              el("span", { class: "entry-title", text: r.title }),

          ]));

        body.appendChild(stack);
      }

      if (state.talents && state.talents.note) {
        body.appendChild(el("p", { class: "caveat",
                                   text: state.talents.note }));
      }
    }, []);
}

function beastToChar(beast) {

    kind: "enemy",
    subtitle: beast.subtitle,
    occ: beast.category || "Mythos",
    stats: Object.assign({}, beast.stats),

/* ================== SPESIALREGLER FOR SKAPNINGER =================

   Noen skapninger gjør ikke bare «angrep, skade, HP». En flying polyp
   danner nye tentakler hver runde; en chthonian leger seg mellom
   rundene; en crawling one bryr seg ikke om kuler. Statblokkene er
   hentet maskinelt ut av Malleus Monstrorum og kan ikke si noe om
   dette, så reglene ligger i bestiary/abilities.json og kobles på her
   — på id eller navn.                                               */

// Minste mulige skade fra en terningformel: én per terning, pluss
// faste ledd. Brukt der boka sier «minimum damage».
function minDiceExpr(expr) {
  return parseDiceExpr(expr).reduce((sum, t) => sum +
    t.sign * (t.flat !== undefined ? t.flat : t.n), 0);
}

function specialFor(charLike) {
  const bank = state.abilities;
  if (!bank || !charLike) return null;
  // «source» er id-en i fiendebanken, og følger med en kopi som er
  // lagt i rollelisten. Uten den ville en redigerbar kopi mistet
  // reglene sine.
  const ids = [charLike.id, charLike.charId, charLike.source]
    .filter(Boolean).map((x) => String(x).toLowerCase());
  const name = String(charLike.name || "").toLowerCase();
  return bank.entries.find((e) => (e.match || []).some((m) => {
    const k = String(m).toLowerCase();
    return ids.indexOf(k) !== -1 || (name && name.indexOf(k) !== -1);
  })) || null;
}

function abilitiesOf(c) {
  return (c && c.special && c.special.abilities) || [];
}

function damageRulesOf(c) {
  return (c && c.special && c.special.damage) || null;
}

/* --- tellere og bruk per runde --- */

// Hvor mange tentakler polyppen har i denne runden, hvor mange
// vindstøt den har igjen. Slås når kampen starter og ved hver ny runde.
function rollResources(c, opts) {
  const o = opts || {};
  if (!c.pools) c.pools = {};
  if (!c.used) c.used = {};
  const rolled = [];
  abilitiesOf(c).forEach((a) => {
    if (a.kind === "pool") {
      const missing = c.pools[a.id] === undefined;
      // onlyMissing brukes når sida lastes på nytt midt i en runde:
      // da skal telleren stå som den sto, ikke slås om igjen.
      const due = o.onlyMissing ? missing
        : (o.first || missing || a.reset === "round");
      if (!due) return;
      const r = rollDiceExpr(a.roll || "1");
      c.pools[a.id] = Math.max(0, r.total);
      rolled.push(c.name + ": " + a.name + " " + r.total +
                  " (" + a.roll + ")");
    } else if (a.kind === "limited") {
      if (o.onlyMissing && c.used[a.id] !== undefined) return;
      if (o.first || o.onlyMissing || a.reset === "round") c.used[a.id] = 0;
    }
  });
  return rolled;
}

// Regenerering skjer ved rundeskifte, og bare på noen som fortsatt
// lever. En chthonian som er nede i null er død og leger ingenting.
function applyRegen(c) {
  const out = [];
  abilitiesOf(c).forEach((a) => {
    if (a.kind !== "regen") return;
    if (c.hp <= 0) {
      if (a.dies_at_zero) {
        addCondition(c, "Død");
        out.push(c.name + " nådde null HP og dør på stedet — den leger " +
                 "seg ikke tilbake.");
      }
      return;
    }
    if (c.hp >= c.hpMax) return;
    const amount = a.roll ? rollDiceExpr(a.roll).total : (a.amount || 0);
    if (amount <= 0) return;
    const before = c.hp;
    c.hp = Math.min(c.hpMax, c.hp + amount);
    out.push(c.name + " regenererer " + amount + " HP (" + before +
             " → " + c.hp + ").");
  });
  return out;
}

function poolLeft(c, abilityId) {
  return (c.pools && c.pools[abilityId] !== undefined)
    ? c.pools[abilityId] : null;
}

function usesLeft(c, ability) {
  const used = (c.used && c.used[ability.id]) || 0;
  return Math.max(0, (ability.uses || 1) - used);
}

// Hvor mange handlinger et angrep har igjen. null = ubegrenset.
function attackBudget(c, attack) {
  if (!attack || !attack.abilityId) return null;
  const ab = abilitiesOf(c).find((a) => a.id === attack.abilityId);
  if (!ab) return null;
  if (ab.kind === "pool") return poolLeft(c, ab.id);
  if (ab.kind === "limited") return usesLeft(c, ab);
  return null;
}

function spendAttack(c, attack) {
  if (!attack || !attack.abilityId) return;
  const ab = abilitiesOf(c).find((a) => a.id === attack.abilityId);
  if (!ab) return;
  if (ab.kind === "pool") {
    c.pools[ab.id] = Math.max(0, (c.pools[ab.id] || 0) - 1);
  } else if (ab.kind === "limited") {
    c.used[ab.id] = ((c.used && c.used[ab.id]) || 0) + 1;
  }
}

// Tellere det går an å angripe direkte — polyppens tentakler.
function targetablePools(c) {
  return abilitiesOf(c).filter((a) => a.kind === "pool" && a.targetable);
}

/* --- hvilke våpen som biter --- */

const SOURCE_LABEL = {
  melee: "Nærkamp", firearm: "Skytevåpen", shotgun: "Hagle",
  fire: "Ild", electricity: "Elektrisitet", acid: "Syre",
  magic: "Formel", enchanted: "Fortryllet", sound: "Lyd",
};
const SOURCE_ORDER = ["melee", "firearm", "shotgun", "fire", "electricity",
                      "acid", "magic", "enchanted", "sound"];

// Hva slags skade et angrep er, ut fra våpenet det kom fra.
function damageSourceOf(attack) {
  if (!attack) return "melee";
  const sub = String(attack.subcategory || "").toLowerCase();
  if (sub === "shotgun") return "shotgun";
  const cat = String(attack.category || "").toLowerCase();
  if (cat === "firearms") return "firearm";
  if (cat === "melee") return "melee";
  const name = String(attack.name || "").toLowerCase();
  if (/hagle|shotgun/.test(name)) return "shotgun";
  if (/molotov|brann|flamme|fakkel/.test(name)) return "fire";
  if (/tesla|lyn|elektr/.test(name)) return "electricity";
  if (/syre|acid/.test(name)) return "acid";
  if (isRangedAttack(attack)) return "firearm";
  return "melee";
}

/* Regn om rå skade etter skapningens regler. Returnerer det som
   faktisk skal trekkes fra, og en linje som forklarer hvorfor.     */
function filterDamage(victim, attack, source, raw) {
  const rules = damageRulesOf(victim);
  const amount = raw ? raw.total : 0;
  if (!rules || !rules.rules) return { amount: amount, note: "" };

  const impaling = !!(raw && raw.impaled);
  const hit = rules.rules.find((r) => {
    if (r.impaling !== undefined && !!r.impaling !== impaling) return false;
    if (!r.source || r.source === "any") return true;
    return r.source === source;
  });
  if (!hit || hit.effect === "normal") return { amount: amount, note: "" };

  const label = SOURCE_LABEL[source] || source;
  if (hit.effect === "immune") {
    return { amount: 0, note: label + " biter ikke på denne." };
  }
  if (hit.effect === "half") {
    return { amount: Math.floor(amount / 2),
             note: label + " gjør halv skade: " + amount + " → " +
                   Math.floor(amount / 2) + "." };
  }
  if (hit.effect === "fixed") {
    return { amount: hit.value || 0,
             note: label + " gjør bare " + (hit.value || 0) +
                   (impaling ? " selv med spidding." : ".") };
  }
  if (hit.effect === "minimum") {
    const min = Math.max(0, minDiceExpr(attack && attack.damage));
    return { amount: min,
             note: label + " gjør minste mulige skade: " + min +
                   " i stedet for " + amount + "." };
  }
  return { amount: amount, note: "" };
}

/* Spesialreglene som lesbar tekst. Brukes både i kampkortet, i
   fiendebanken og på karakterkortet.                              */
function specialRulesBody(entry, body) {
  if (!entry) {
    body.appendChild(emptyBox("Ingen spesialregler lagt inn for denne."));
    return;
  }
  (entry.abilities || []).forEach((a) => {
    body.appendChild(el("div", { class: "section-label", text: a.name }));
    const meta = [];
    if (a.kind === "pool") meta.push("slås " + a.roll + " hver runde");
    if (a.kind === "limited") {
      meta.push((a.uses || 1) + " gang" + ((a.uses || 1) > 1 ? "er" : "") +
                " per runde");
    }
    if (a.kind === "regen") {
      meta.push("leger " + (a.roll || a.amount) + " HP per runde");
    }
    if (a.kind === "weakspot") {
      meta.push(a.chance_of_skill
        ? "krever " + a.chance_of_skill + " % av egen treffsjanse"
        : a.chance + " % sjanse per treff");
    }
    if (a.cost) meta.push(a.cost);
    if (a.attack) {
      meta.push([a.attack.skill, a.attack.damage,
                 a.attack.ignores_armor ? "ignorerer rustning" : null]
        .filter(Boolean).join(" · "));
    }
    if (meta.length) {
      body.appendChild(el("p", { class: "entry-sub", text: meta.join("  ·  ") }));
    }
    if (a.description) {
      body.appendChild(el("p", { class: "prose", text: a.description }));
    }
    if (a.scenario_note) {
      body.appendChild(el("p", { class: "callout" }, [
        el("p", { class: "eyebrow", text: "I dette scenarioet" }),
        el("p", { text: a.scenario_note }),
      ]));
    }
    if (a.house_note) {
      body.appendChild(el("p", { class: "caveat", text: a.house_note }));
    }
  });
  if (entry.damage) {
    body.appendChild(el("div", { class: "section-label",
                                 text: "Hva som biter" }));
    if (entry.damage.note) {
      body.appendChild(el("p", { class: "prose", text: entry.damage.note }));
    }
    const bank = state.abilities || {};
    const labels = bank.damage_sources || SOURCE_LABEL;
    const effects = bank.effects || {};
    const box = el("div", { class: "stack" });
    (entry.damage.rules || []).forEach((r) => {
      const src = (!r.source || r.source === "any")
        ? "Alt annet" : (labels[r.source] || r.source);
      const eff = r.effect === "fixed"
        ? (r.value + " poeng")
        : (effects[r.effect] || r.effect);
      box.appendChild(el("div", { class: "entry" }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title",
            text: src + (r.impaling ? " som spidder" : "") }),
          el("span", { class: "entry-sub", text: eff }),
        ]),
      ]));
    });
    body.appendChild(box);
  }
}

function openSpecialRules(c) {
  const entry = (c && c.special) || specialFor(c);
  openModal("Spesialregler — " + (c.name || "?"),
    entry ? entry.title : "", (body) => specialRulesBody(entry, body), []);
}

/* ------------------------- kamptracker -------------------------- */

function emptyCombat() {
  return { active: false, round: 0, turn: 0, taken: 0,
           combatants: [], log: [] };
}

async function saveCombat() { await store.set("combat", state.combat); }

function initiativeOf(c) {
  // Initiativet er tallet du skriver inn selv — det spillerne faktisk
  // slo. Står feltet tomt, faller vi tilbake på DEX, slik Call of
  // Cthulhu gjør det når ingen slår for initiativ.
  const manual = parseInt(c.init, 10);
  if (!isNaN(manual)) return manual;
  return parseInt(c.dex, 10) || 0;
}

function sortCombat() {
  state.combat.combatants.sort((a, b) => {
    const d = initiativeOf(b) - initiativeOf(a);
    if (d) return d;
    // Uavgjort: den med skytevåpen klart går først, deretter høyest DEX.
    if (!!b.firearm !== !!a.firearm) return b.firearm ? 1 : -1;
    return (parseInt(b.dex, 10) || 0) - (parseInt(a.dex, 10) || 0);
  });
}

function uniqueCombatantName(base) {
  const taken = new Set(state.combat.combatants.map((x) => x.name));
  const stem = (base || "Deltaker").replace(/\s+\d+$/, "");
  if (!taken.has(stem)) return stem;
  let n = 2;
  while (taken.has(stem + " " + n)) n += 1;
  return stem + " " + n;
}

// Unnvikelse: eget ferdighetsfelt om rollen har det, ellers halve DEX,
// slik Call of Cthulhu setter startverdien.
function dodgeValueOf(c) {
  const keys = Object.keys(c.skills || {});
  const hit = keys.find((k) => /^(dodge|unnvik)/i.test(k));
  if (hit) {
    const v = String(c.skills[hit]).replace("%", "").trim();
    if (v) return v;
  }
  const dex = parseInt(c.stats && c.stats.DEX, 10);
  return isNaN(dex) ? "" : String(Math.floor(dex / 2));
}

// Build brukes til manøvrer (grep, avvæpning, knockout).
function buildValueOf(c) {
  const given = String((c.stats && c.stats.Build) || "").trim();
  if (given) return given;
  const str = parseInt(c.stats && c.stats.STR, 10);
  const siz = parseInt(c.stats && c.stats.SIZ, 10);
  if (isNaN(str) || isNaN(siz)) return "";
  const t = str + siz;
  if (t <= 64) return "-2";
  if (t <= 84) return "-1";
  if (t <= 124) return "0";
  if (t <= 164) return "1";
  if (t <= 204) return "2";
  if (t <= 284) return "3";
  if (t <= 364) return "4";
  return "5";
}

// Statblokkene fra Malleus Monstrorum skriver skaden som «1D6 + db».
// Da skal damage bonus legges til, selv om feltet uses_db mangler.
function normalizeAttack(a) {
  const out = Object.assign({}, a);
  if (out.uses_db === undefined &&
      /(\+\s*db\b|damage bonus)/i.test(String(out.damage || ""))) {
    out.uses_db = true;
  }
  return out;
}

function makeCombatant(charLike) {
  const c = normalizeChar(charLike);
  const maxHp = charMaxHp(c);
  const entry = {
    id: newId("cb"),
    charId: c.id,
    name: uniqueCombatantName(c.name),
    kind: c.kind,
    dex: c.stats.DEX || "",
    // Forhåndsutfylt med DEX, slik at lista er brukbar med én gang.
    // Skriv over med det som ble slått.
    init: c.stats.DEX || "",
    firearm: false,
    hp: maxHp,
    hpMax: maxHp,
    armor: c.stats.Armor || c.armor || "",
    db: c.stats.DB || "",
    dodge: dodgeValueOf(c),
    build: buildValueOf(c),
    // Pulp-helter tåler mer: de bruker ikke major wound-regelen.
    // Spillerne er helter, resten er det ikke.
    pulp: c.kind === "pc",
    attacks: (c.attacks || []).map(normalizeAttack),
    // Spesialregler fra abilities.json — tentakler som vokser fram,
    // regenerering, hvilke våpen som i det hele tatt biter.
    special: specialFor(c) || null,
    pools: {},
    used: {},
    conditions: [],
    majorWound: false,
    // Slå tilbake kan gjøres én gang per runde; unnvike så mange
    // ganger man blir angrepet.
    reacted: 0,
    note: "",
  };
  rollResources(entry, { first: true });
  return entry;
}

// Kamper som ble lagret før forsvarsfeltene fantes skal fortsatt
// virke når sida åpnes igjen.
function upgradeCombatant(c) {
  if (c.dodge === undefined) {
    const dex = parseInt(c.dex, 10);
    c.dodge = isNaN(dex) ? "" : String(Math.floor(dex / 2));
  }
  if (c.build === undefined) c.build = "";
  if (c.pulp === undefined) c.pulp = c.kind === "pc";
  if (c.reacted === undefined) c.reacted = 0;
  if (!Array.isArray(c.conditions)) c.conditions = [];
  c.attacks = (c.attacks || []).map(normalizeAttack);
  if (c.special === undefined) {
    c.special = specialFor({ id: c.charId, name: c.name }) || null;
  }
  if (!c.pools) c.pools = {};
  if (!c.used) c.used = {};
  rollResources(c, { onlyMissing: true });
  return c;
}

async function addToCombat(charLike) {
  const entry = makeCombatant(charLike);
  state.combat.combatants.push(entry);
  sortCombat();
  await saveCombat();
  render();
  toast("«" + entry.name + "» lagt i kampen");
}

async function addManyToCombat(list) {
  // Navnene må gjøres unike etter hvert som de legges inn, ellers får
  // fire ghouls samme navn.
  list.forEach((c) => state.combat.combatants.push(makeCombatant(c)));
  sortCombat();
  await saveCombat();
  render();
  toast(list.length + (list.length === 1 ? " lagt i kampen"
                                         : " deltakere lagt i kampen"));
}

function viewCombat(root) {
  const cb = state.combat;
  root.appendChild(el("h1", { text: "Kamp" }));
  root.appendChild(el("p", { class: "lede",
    text: "Legg til deltakerne, skriv inn initiativet hver av dem slo, " +
          "og trykk «Start kamp» — da settes rekkefølgen. Den som har " +
          "tur ligger alltid øverst. Trykk «Angrip» for å kjøre et " +
          "angrep: velg våpen og mål, skriv inn hva som ble slått ved " +
          "bordet, la den som blir angrepet velge å unnvike eller slå " +
          "tilbake, så regnes skaden ut etter reglene. HP, tilstander " +
          "og runde lagres, så du kan lukke sida midt i en kamp." }));

  // --- kontrollrad
  const controls = el("div", { class: "row", style: "margin-bottom:14px" });
  if (!cb.active) {
    controls.appendChild(el("button", {
      class: "btn primary", type: "button", text: "Start kamp",
      onclick: async () => {
        if (!cb.combatants.length) { toast("Legg til deltakere først"); return; }
        sortCombat();
        cb.active = true; cb.round = 1; cb.turn = 0; cb.taken = 0;
        cb.log = ["Runde 1 begynner. Rekkefølge: " +
                  cb.combatants.map((x) => x.name + " " + initiativeOf(x))
                    .join(", ") + "."];
        cb.combatants.forEach((x) => {
          rollResources(x, { first: true }).forEach((l) => cb.log.push(l));
        });
        await saveCombat(); render();
      },
    }));
  } else {
    controls.appendChild(el("button", {
      class: "btn primary", type: "button", text: "Neste tur",
      onclick: () => advanceTurn(),
    }));
    controls.appendChild(el("button", {
      class: "btn", type: "button", text: "Avslutt kamp",
      onclick: () => confirmThen("Avslutt kampen?",
        "Deltakerlista blir liggende, men runde og tur nullstilles.",
        async () => {
          cb.active = false; cb.round = 0; cb.turn = 0; cb.taken = 0;
          await saveCombat(); render();
        }),
    }));
  }
  controls.appendChild(el("button", {
    class: "btn small", type: "button", text: "+ Legg til",
    onclick: () => addCombatantDialog(),
  }));
  if (state.scenario && (state.scenario.tactics || []).length) {
    controls.appendChild(el("button", {
      class: "btn small", type: "button", text: "Trekk taktikk",
      title: "Et forslag til noe som gjør kampen vanskeligere",
      onclick: () => drawTactic(),
    }));
  }
  if (cb.combatants.length > 1) {
    controls.appendChild(el("button", {
      class: "btn small", type: "button", text: "Sorter på nytt",
      title: "Sorter etter initiativ uten å starte om kampen",
      onclick: async () => {
        sortCombat();
        await saveCombat(); render();
        toast("Sortert etter initiativ");
      },
    }));
  }
  if (cb.combatants.length) {
    controls.appendChild(el("button", {
      class: "btn small danger", type: "button", text: "Tøm",
      onclick: () => confirmThen("Tøm kampen?",
        "Alle deltakere fjernes.", async () => {
          state.combat = emptyCombat();
          await saveCombat(); render();
        }),
    }));
  }
  root.appendChild(controls);

  if (cb.active) {
    const current = cb.combatants[0];
    const next = cb.combatants[1];
    const taken = cb.taken || 0;
    root.appendChild(el("div", { class: "panel accent roundbar" }, [
      el("div", null, [
        el("p", { class: "eyebrow", text: "Runde" }),
        el("p", { class: "roundnum", text: String(cb.round) }),
      ]),
      el("div", { class: "roundbar-now" }, [
        el("p", { class: "eyebrow", text: "Sin tur" }),
        el("p", { class: "turnname", text: current ? current.name : "—" }),
        next ? el("p", { class: "entry-sub", text: "Nestemann: " + next.name })
             : null,
      ]),
      el("div", { class: "roundbar-count" }, [
        el("p", { class: "eyebrow", text: "Turer tatt" }),
        el("p", { class: "roundcount",
                  text: taken + " / " + cb.combatants.length }),
      ]),
    ]));
  }

  if (!cb.combatants.length) {
    root.appendChild(emptyBox("Ingen deltakere.",
      "Legg til fra Roller, fra Fiendebanken, eller manuelt med " +
      "«+ Deltaker»."));
    return;
  }

  const stack = el("div", { class: "stack" });
  cb.combatants.forEach((c, i) => {
    stack.appendChild(combatantCard(c, i));
  });
  root.appendChild(stack);

  if (cb.log && cb.log.length) {
    root.appendChild(el("h2", { text: "Logg" }));
    const logbox = el("div", { class: "panel" });
    cb.log.slice(-14).reverse().forEach((line) => {
      logbox.appendChild(el("p", { class: "logline", text: line }));
    });
