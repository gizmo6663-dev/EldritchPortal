  function refresh() {
    listBox.innerHTML = "";
    const q = query.trim().toLowerCase();
    const shown = bank.weapons.filter((w) => !q ||
      (w.name + " " + (w.skill || "") + " " + (w.damage || ""))
        .toLowerCase().indexOf(q) !== -1);
    if (!shown.length) { listBox.appendChild(emptyBox("Ingen treff.")); return; }

    const order = [];
    const byCat = {};
    shown.forEach((w) => {
      const c = w.category || "annet";
      if (!byCat[c]) { byCat[c] = []; order.push(c); }
      byCat[c].push(w);
    });
    order.forEach((cat) => {
      listBox.appendChild(el("div", { class: "section-label",
                                      text: cats[cat] || cat }));
      byCat[cat].forEach((w) => {
        const sub = [w.skill, w.damage, w.range,
                     w.attacks ? w.attacks + "/runde" : null,
                     w.ammo ? "mag " + w.ammo : null,
                     w.malfunction ? "feiler " + w.malfunction : null,
                     w.can_impale ? "spidder" : null]
          .filter(Boolean).join(" · ");
        listBox.appendChild(el("button", {
          class: "entry pickrow", type: "button",
          onclick: (e) => {
            e.preventDefault();
            onPick(w);
            toast(w.name + " lagt til");
          },
        }, [
          el("span", { class: "tick", style: "border-color:transparent" }),
          el("span", { class: "entry-body" }, [
            el("span", { class: "entry-title", text: w.name }),
            el("span", { class: "entry-sub", text: sub }),
          ]),
          el("span", { class: "entry-open", text: "LEGG TIL" }),
        ]));
      });
    });
  }

  const search = el("input", { class: "field", type: "search",
                               id: "weap-search",
                               placeholder: "Søk i " + bank.weapons.length +
                                            " våpen…" });
  search.addEventListener("input", debounce(() => {
    query = search.value; refresh();
  }, 180));
  panel.appendChild(search);
  panel.appendChild(el("div", { style: "height:8px" }));
  panel.appendChild(listBox);
  refresh();
  return panel;
}

/* --------------------------- talenter ---------------------------- */

// Talentfeltet er fritekst («Weird Science, Rapid Fire, Hardened»).
// Del det opp og slå hvert navn opp i talentboka.
function splitTalents(text) {
  return String(text || "")
    .split(/[,;\n]/).map((t) => t.trim()).filter(Boolean);
}

/* Talenter skrives ofte med valget sitt hengt på: «Psychic Power:
   Telekinesis», «Animal Companion (dog)». Boka fører dem under
   grunnnavnet, så begge formene må finne fram — og valget skal vises,
   ikke kastes.                                                     */
function splitTalentName(name) {
  const raw = String(name || "").trim();
  let base = raw;
  let spec = "";
  const colon = raw.indexOf(":");
  if (colon !== -1) {
    base = raw.slice(0, colon).trim();
    spec = raw.slice(colon + 1).trim();
  } else {
    const par = raw.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (par) { base = par[1].trim(); spec = par[2].trim(); }
  }
  return { raw: raw, base: base, spec: spec };
}

function lookupTalent(name) {
  const parts = splitTalentName(name);
  return talentIndex[parts.raw.toLowerCase()] ||
         talentIndex[parts.base.toLowerCase()] || null;
}

/* Regelboksene et talent viser videre til — psykiske krefter, weird
   science, Luck-bruk. Uten dem sier talentet bare «see page 83».  */
function talentRulesFor(name) {
  const bank = state.talentRules;
  if (!bank) return [];
  const parts = splitTalentName(name);
  const key = Object.keys(bank.talents || {}).find(
    (k) => k.toLowerCase() === parts.base.toLowerCase() ||
           k.toLowerCase() === parts.raw.toLowerCase());
  if (!key) return [];
  return (bank.talents[key] || [])
    .map((id) => (bank.rules || []).find((r) => r.id === id))
    .filter(Boolean);
}

function openRuleBox(rule, highlight) {
  openModal(rule.title, rule.source, (body) => {
    if (rule.intro) {
      body.appendChild(el("p", { class: "prose", text: rule.intro }));
    }
    // Har rollen valgt én av kreftene, legges den øverst.
    const secs = (rule.sections || []).slice();
    if (highlight) {
      const i = secs.findIndex(
        (x) => x.title.toLowerCase() === String(highlight).toLowerCase());
      if (i > 0) secs.unshift(secs.splice(i, 1)[0]);
    }
    // Merket sier hvilken BOK avsnittet kommer fra, og kan settes
    // sammen med « + ». Begge regelbøkene er lest opp mot teksten sin.
    const SRC_PART = {
      "grunnbok": "grunnboka",
      "pulp": "Pulp Cthulhu",
      "scenario": "scenarioet",
      "eget": "til dette bordet",
    };
    const srcLabel = (s) => {
      const parts = String(s || "").split("+").map((x) => x.trim())
        .filter(Boolean).map((x) => SRC_PART[x] || x);
      return parts.length ? "fra " + parts.join(" + ") : "";
    };
    secs.forEach((sec) => {
      const on = highlight &&
        sec.title.toLowerCase() === String(highlight).toLowerCase();
      const head = el("div", {
        class: "section-label" + (on ? " chosen" : "") });
      head.appendChild(el("span", {
        text: sec.title + (on ? "  ← valgt" : "") }));
      // Hva som er sitat og hva som er skrevet ut, skal alltid stå.
      const tag = srcLabel(sec.source);
      if (tag) {
        head.appendChild(el("span", { class: "line-src", text: tag }));
      }
      body.appendChild(head);
      body.appendChild(el("p", { class: "prose", text: sec.body }));
    });
  }, []);
}

function talentChips(text) {
  const names = splitTalents(text);
  if (!names.length) return null;
  const wrap = el("div", { class: "talentchips" });
  names.forEach((n) => {
    const t = lookupTalent(n);
    wrap.appendChild(el("button", {
      class: "chip talent" + (t ? " known" : ""), type: "button",
      title: t ? "Trykk for forklaring" : "Ikke funnet i talentboka",
      text: n,
      onclick: () => openTalent(n, t),
    }));
  });
  return wrap;
}

// Talentvelger som panel inne i editoren, av samme grunn som
// våpenvelgeren: modalene kan ikke stables oppå editoren uten å bygge
// den opp på nytt, og da ville alt du hadde skrevet gått tapt.
// «kind» er «pulp» eller «insane»; valgte talenter legges til i
// tekstfeltet, kommaseparert.
function talentPickerPanel(kind, targetField) {
  const panel = el("div", { class: "weappanel", hidden: true });
  const all = (state.talents && state.talents.talents) || [];
  const pool = all.filter((t) => t.kind === kind);
  if (!pool.length) {
    panel.appendChild(el("p", { class: "caveat",
      text: "Ingen talenter av denne typen er bygget inn." }));
    return panel;
  }

  const listBox = el("div", { class: "picklist short" });
  let query = "";

  function chosen() {
    return splitTalents(targetField.value).map((x) => x.toLowerCase());
  }

  function toggle(t) {
    const have = chosen();
    const i = have.indexOf(t.name.toLowerCase());
    let list = splitTalents(targetField.value);
    if (i === -1) list.push(t.name);
    else list.splice(i, 1);
    targetField.value = list.join(", ");
    refresh();
  }

  function refresh() {
    listBox.innerHTML = "";
    const q = query.trim().toLowerCase();
    const shown = pool.filter((t) => !q ||
      (t.name + " " + t.description).toLowerCase().indexOf(q) !== -1);
    if (!shown.length) { listBox.appendChild(emptyBox("Ingen treff.")); return; }

    const order = [];
    const byGroup = {};
    shown.forEach((t) => {
      const g = t.group || "Talent";
      if (!byGroup[g]) { byGroup[g] = []; order.push(g); }
      byGroup[g].push(t);
    });

    const have = chosen();
    order.forEach((g) => {
      listBox.appendChild(el("div", { class: "section-label", text: g }));
      byGroup[g].forEach((t) => {
        const on = have.indexOf(t.name.toLowerCase()) !== -1;
        listBox.appendChild(el("button", {
          class: "entry pickrow" + (on ? " picked" : ""), type: "button",
          "aria-pressed": String(on),
          onclick: (e) => { e.preventDefault(); toggle(t); },
        }, [
          el("span", { class: "pickbox" + (on ? " on" : "") }),
          el("span", { class: "entry-body" }, [
            el("span", { class: "entry-title", text: t.name }),
            el("span", { class: "entry-sub", text: t.description }),
          ]),
        ]));
      });
    });
  }

  const search = el("input", {
    class: "field", type: "search",
    id: "talent-search-" + kind,
    placeholder: "Søk i " + pool.length + " talenter…",
  });
  search.addEventListener("input", debounce(() => {
    query = search.value; refresh();
  }, 180));
  panel.appendChild(search);
  panel.appendChild(el("div", { style: "height:8px" }));
  panel.appendChild(listBox);
  refresh();
  return panel;
}

function openTalent(name, talent) {
  openModal(talent ? talent.name : name,
    talent ? talent.group : "Ukjent talent", (body) => {
      if (!talent) {
        body.appendChild(el("p", {
          text: "Dette talentet står ikke i Pulp Cthulhu-tabellene som " +
                "er lest inn. Det kan være fra en annen kilde, eller " +
                "skrevet litt annerledes enn i boka." }));
        const all = (state.talents && state.talents.talents) || [];
        const near = all.filter((t) =>
          t.name.toLowerCase().indexOf(name.toLowerCase().slice(0, 4)) !== -1);
        if (near.length) {
          body.appendChild(el("div", { class: "section-label",
                                       text: "Mente du" }));
          near.slice(0, 6).forEach((t) => {
            body.appendChild(el("button", {
              class: "btn small", type: "button", text: t.name,
              onclick: () => openTalent(t.name, t),
            }));
          });
        }
        return;
      }
      const parts = splitTalentName(name);
      if (parts.spec) {
        body.appendChild(el("div", { class: "callout" }, [
          el("p", { class: "eyebrow", text: "Valgt" }),
          el("p", { text: parts.spec }),
        ]));
      }
      body.appendChild(el("p", { class: "prose", text: talent.description }));

      // Talenter som bare viser videre til et kapittel får reglene
      // hit, i stedet for et sidetall man må slå opp.
      const rules = talentRulesFor(name);
      if (rules.length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Reglene bak" }));
        const stack = el("div", { class: "stack" });
        rules.forEach((r) => {
          stack.appendChild(el("button", {
            class: "entry pickrow", type: "button",
            onclick: () => openRuleBox(r, parts.spec),
          }, [
            el("span", { class: "entry-body" }, [
              el("span", { class: "entry-title", text: r.title }),
              el("span", { class: "entry-sub", text: r.source }),
            ]),
            el("span", { class: "entry-open", text: "ÅPNE" }),
          ]));
        });
        body.appendChild(stack);
      }

      if (state.talents && state.talents.note) {
        body.appendChild(el("p", { class: "caveat",
                                   text: state.talents.note }));
      }
    }, []);
}

      ]),

function beastToChar(beast) {
  // En kopi som kan redigeres uten å røre banken.
  return normalizeChar({
    id: newId("ch"),
    name: beast.name,
    kind: "enemy",
    subtitle: beast.subtitle,
    occ: beast.category || "Mythos",
    stats: Object.assign({}, beast.stats),
    attacks: (beast.attacks || []).map((a) => Object.assign({}, a)),
    armor: beast.armor,
    spells: beast.spells,
    sanity_loss: beast.sanity_loss,
    notes: [beast.skills ? "Ferdigheter: " + beast.skills : "",
            beast.notes].filter(Boolean).join("\n\n"),
    source: beast.id,
  });
}

async function addBeastToRoster(beast) {
  const c = beastToChar(beast);
  c.name = uniqueName(c.name);
  state.characters.push(c);
  await saveCharacters();
  render();
  toast("«" + c.name + "» lagt i rollelisten");
}

function openBeast(beast) {
  openModal(beast.name, beast.subtitle, (body) => {
    const grid = statGrid(beast.stats);
    if (grid) body.appendChild(grid);

    if (beast.rolls && Object.keys(beast.rolls).length) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Terningformler" }));
      body.appendChild(el("p", { class: "prose tight",
        text: Object.keys(beast.rolls)
          .map((k) => k + " " + beast.rolls[k]).join("   ") }));
      body.appendChild(el("p", { class: "caveat",
        text: "Tallene over er gjennomsnitt av disse formlene. Slå selv " +
              "hvis du vil ha variasjon mellom flere av samme skapning." }));
    }

    const atk = attackTable(beast.attacks);
    if (atk) {
      body.appendChild(el("div", { class: "section-label", text: "Angrep" }));
      body.appendChild(atk);
    }
    [["armor", "Rustning"], ["skills", "Ferdigheter"], ["spells", "Formler"],
     ["sanity_loss", "Sanity-tap"], ["notes", "Notater"]].forEach((pair) => {
      if (!beast[pair[0]]) return;
      body.appendChild(el("div", { class: "section-label", text: pair[1] }));
      const val = beast[pair[0]];
      const show = pair[0] === "skills" ? annotateSkillText(val) : val;
      body.appendChild(el("p", { class: "prose", text: show }));
      if (pair[0] === "skills" && show !== val) {
        body.appendChild(stepsLegend());
      }
    });
    // Mekanismene tabellen ikke rommer — tentakler som vokser fram,
    // regenerering, hvilke våpen som biter.
    const sp = specialFor(beast);
    if (sp) {
      body.appendChild(el("div", { class: "section-label",
                                   text: "Spesialregler" }));
      specialRulesBody(sp, body);
    }
  }, [
    el("button", { class: "btn primary", type: "button", text: "Til kamp",
                   onclick: () => { closeModal(); addToCombat(beastToChar(beast)); } }),
    el("button", { class: "btn", type: "button", text: "Til rollelisten",
                   onclick: () => { closeModal(); addBeastToRoster(beast); } }),
  ]);
}

/* ================== SPESIALREGLER FOR SKAPNINGER =================

   Noen skapninger gjør ikke bare «angrep, skade, HP». En flying polyp
   danner nye tentakler hver runde; en chthonian leger seg mellom
   rundene; en crawling one bryr seg ikke om kuler. Statblokkene er
   hentet maskinelt ut av Malleus Monstrorum og kan ikke si noe om
   dette, så reglene ligger i bestiary/abilities.json og kobles på her
   — på id eller navn.                                               */

// Minste mulige skade fra en terningformel: én per terning, pluss
// faste ledd. Brukt der boka sier «minimum damage».
function minDiceExpr(expr) {
  return parseDiceExpr(expr).reduce((sum, t) => sum +
    t.sign * (t.flat !== undefined ? t.flat : t.n), 0);
}

function specialFor(charLike) {
  const bank = state.abilities;
  if (!bank || !charLike) return null;
  // «source» er id-en i fiendebanken, og følger med en kopi som er
  // lagt i rollelisten. Uten den ville en redigerbar kopi mistet
  // reglene sine.
  const ids = [charLike.id, charLike.charId, charLike.source]
    .filter(Boolean).map((x) => String(x).toLowerCase());
  const name = String(charLike.name || "").toLowerCase();
  return bank.entries.find((e) => (e.match || []).some((m) => {
    const k = String(m).toLowerCase();
    return ids.indexOf(k) !== -1 || (name && name.indexOf(k) !== -1);
  })) || null;
}

function abilitiesOf(c) {
  return (c && c.special && c.special.abilities) || [];
}

function damageRulesOf(c) {
  return (c && c.special && c.special.damage) || null;
}

/* --- tellere og bruk per runde --- */

// Hvor mange tentakler polyppen har i denne runden, hvor mange
// vindstøt den har igjen. Slås når kampen starter og ved hver ny runde.
function rollResources(c, opts) {
  const o = opts || {};
  if (!c.pools) c.pools = {};
  if (!c.used) c.used = {};
  const rolled = [];
  abilitiesOf(c).forEach((a) => {
    if (a.kind === "pool") {
      const missing = c.pools[a.id] === undefined;
      // onlyMissing brukes når sida lastes på nytt midt i en runde:
      // da skal telleren stå som den sto, ikke slås om igjen.
      const due = o.onlyMissing ? missing
        : (o.first || missing || a.reset === "round");
      if (!due) return;
      const r = rollDiceExpr(a.roll || "1");
      c.pools[a.id] = Math.max(0, r.total);
      rolled.push(c.name + ": " + a.name + " " + r.total +
                  " (" + a.roll + ")");
    } else if (a.kind === "limited") {
      if (o.onlyMissing && c.used[a.id] !== undefined) return;
      if (o.first || o.onlyMissing || a.reset === "round") c.used[a.id] = 0;
    }
  });
  return rolled;
}

// Regenerering skjer ved rundeskifte, og bare på noen som fortsatt
// lever. En chthonian som er nede i null er død og leger ingenting.
function applyRegen(c) {
  const out = [];
  abilitiesOf(c).forEach((a) => {
    if (a.kind !== "regen") return;
    if (c.hp <= 0) {
      if (a.dies_at_zero) {
        addCondition(c, "Død");
        out.push(c.name + " nådde null HP og dør på stedet — den leger " +
                 "seg ikke tilbake.");
      }
      return;
    }
    if (c.hp >= c.hpMax) return;
    const amount = a.roll ? rollDiceExpr(a.roll).total : (a.amount || 0);
    if (amount <= 0) return;
    const before = c.hp;
    c.hp = Math.min(c.hpMax, c.hp + amount);
    out.push(c.name + " regenererer " + amount + " HP (" + before +
             " → " + c.hp + ").");
  });
  return out;
}

function poolLeft(c, abilityId) {
  return (c.pools && c.pools[abilityId] !== undefined)
    ? c.pools[abilityId] : null;
}

function usesLeft(c, ability) {
  const used = (c.used && c.used[ability.id]) || 0;
  return Math.max(0, (ability.uses || 1) - used);
}

// Hvor mange handlinger et angrep har igjen. null = ubegrenset.
function attackBudget(c, attack) {
  if (!attack || !attack.abilityId) return null;
  const ab = abilitiesOf(c).find((a) => a.id === attack.abilityId);
  if (!ab) return null;
  if (ab.kind === "pool") return poolLeft(c, ab.id);
  if (ab.kind === "limited") return usesLeft(c, ab);
  return null;
}

function spendAttack(c, attack) {
  if (!attack || !attack.abilityId) return;
  const ab = abilitiesOf(c).find((a) => a.id === attack.abilityId);
  if (!ab) return;
  if (ab.kind === "pool") {
    c.pools[ab.id] = Math.max(0, (c.pools[ab.id] || 0) - 1);
  } else if (ab.kind === "limited") {
    c.used[ab.id] = ((c.used && c.used[ab.id]) || 0) + 1;
  }
}

// Tellere det går an å angripe direkte — polyppens tentakler.
function targetablePools(c) {
  return abilitiesOf(c).filter((a) => a.kind === "pool" && a.targetable);
}

/* --- hvilke våpen som biter --- */

const SOURCE_LABEL = {
  melee: "Nærkamp", firearm: "Skytevåpen", shotgun: "Hagle",
  fire: "Ild", electricity: "Elektrisitet", acid: "Syre",
  magic: "Formel", enchanted: "Fortryllet", sound: "Lyd",
};
const SOURCE_ORDER = ["melee", "firearm", "shotgun", "fire", "electricity",
                      "acid", "magic", "enchanted", "sound"];

// Hva slags skade et angrep er, ut fra våpenet det kom fra.
function damageSourceOf(attack) {
  if (!attack) return "melee";
  const sub = String(attack.subcategory || "").toLowerCase();
  if (sub === "shotgun") return "shotgun";
  const cat = String(attack.category || "").toLowerCase();
  if (cat === "firearms") return "firearm";
  if (cat === "melee") return "melee";
  const name = String(attack.name || "").toLowerCase();
  if (/hagle|shotgun/.test(name)) return "shotgun";
  if (/molotov|brann|flamme|fakkel/.test(name)) return "fire";
  if (/tesla|lyn|elektr/.test(name)) return "electricity";
  if (/syre|acid/.test(name)) return "acid";
  if (isRangedAttack(attack)) return "firearm";
  return "melee";
}

/* Regn om rå skade etter skapningens regler. Returnerer det som
   faktisk skal trekkes fra, og en linje som forklarer hvorfor.     */
function filterDamage(victim, attack, source, raw) {
  const rules = damageRulesOf(victim);
  const amount = raw ? raw.total : 0;
  if (!rules || !rules.rules) return { amount: amount, note: "" };

  const impaling = !!(raw && raw.impaled);
  const hit = rules.rules.find((r) => {
    if (r.impaling !== undefined && !!r.impaling !== impaling) return false;
    if (!r.source || r.source === "any") return true;
    return r.source === source;
  });
  if (!hit || hit.effect === "normal") return { amount: amount, note: "" };

  const label = SOURCE_LABEL[source] || source;
  if (hit.effect === "immune") {
    return { amount: 0, note: label + " biter ikke på denne." };
  }
  if (hit.effect === "half") {
    return { amount: Math.floor(amount / 2),
             note: label + " gjør halv skade: " + amount + " → " +
                   Math.floor(amount / 2) + "." };
  }
  if (hit.effect === "fixed") {
    return { amount: hit.value || 0,
             note: label + " gjør bare " + (hit.value || 0) +
                   (impaling ? " selv med spidding." : ".") };
  }
  if (hit.effect === "minimum") {
    const min = Math.max(0, minDiceExpr(attack && attack.damage));
    return { amount: min,
             note: label + " gjør minste mulige skade: " + min +
                   " i stedet for " + amount + "." };
  }
  return { amount: amount, note: "" };
}

/* Spesialreglene som lesbar tekst. Brukes både i kampkortet, i
   fiendebanken og på karakterkortet.                              */
function specialRulesBody(entry, body) {
  if (!entry) {
    body.appendChild(emptyBox("Ingen spesialregler lagt inn for denne."));
    return;
  }
  (entry.abilities || []).forEach((a) => {
    body.appendChild(el("div", { class: "section-label", text: a.name }));
    const meta = [];
    if (a.kind === "pool") meta.push("slås " + a.roll + " hver runde");
    if (a.kind === "limited") {
      meta.push((a.uses || 1) + " gang" + ((a.uses || 1) > 1 ? "er" : "") +
                " per runde");
    }
    if (a.kind === "regen") {
      meta.push("leger " + (a.roll || a.amount) + " HP per runde");
    }
    if (a.kind === "weakspot") {
      meta.push(a.chance_of_skill
        ? "krever " + a.chance_of_skill + " % av egen treffsjanse"
        : a.chance + " % sjanse per treff");
    }
    if (a.cost) meta.push(a.cost);
    if (a.attack) {
      meta.push([a.attack.skill, a.attack.damage,
                 a.attack.ignores_armor ? "ignorerer rustning" : null]
        .filter(Boolean).join(" · "));
    }
    if (meta.length) {
      body.appendChild(el("p", { class: "entry-sub", text: meta.join("  ·  ") }));
    }
    if (a.description) {
      body.appendChild(el("p", { class: "prose", text: a.description }));
    }
    if (a.scenario_note) {
      body.appendChild(el("p", { class: "callout" }, [
        el("p", { class: "eyebrow", text: "I dette scenarioet" }),
        el("p", { text: a.scenario_note }),
      ]));
    }
    if (a.house_note) {
      body.appendChild(el("p", { class: "caveat", text: a.house_note }));
    }
  });
  if (entry.damage) {
    body.appendChild(el("div", { class: "section-label",
                                 text: "Hva som biter" }));
    if (entry.damage.note) {
      body.appendChild(el("p", { class: "prose", text: entry.damage.note }));
    }
    const bank = state.abilities || {};
    const labels = bank.damage_sources || SOURCE_LABEL;
    const effects = bank.effects || {};
    const box = el("div", { class: "stack" });
    (entry.damage.rules || []).forEach((r) => {
      const src = (!r.source || r.source === "any")
        ? "Alt annet" : (labels[r.source] || r.source);
      const eff = r.effect === "fixed"
        ? (r.value + " poeng")
        : (effects[r.effect] || r.effect);
      box.appendChild(el("div", { class: "entry" }, [
        el("span", { class: "tick", style: "border-color:transparent" }),
        el("span", { class: "entry-body" }, [
          el("span", { class: "entry-title",
            text: src + (r.impaling ? " som spidder" : "") }),
          el("span", { class: "entry-sub", text: eff }),
        ]),
      ]));
    });
    body.appendChild(box);
  }
}

function openSpecialRules(c) {
  const entry = (c && c.special) || specialFor(c);
  openModal("Spesialregler — " + (c.name || "?"),
    entry ? entry.title : "", (body) => specialRulesBody(entry, body), []);
}

/* ------------------------- kamptracker -------------------------- */

function emptyCombat() {
  return { active: false, round: 0, turn: 0, taken: 0,
           combatants: [], log: [] };
}

async function saveCombat() { await store.set("combat", state.combat); }

function initiativeOf(c) {
  // Initiativet er tallet du skriver inn selv — det spillerne faktisk
  // slo. Står feltet tomt, faller vi tilbake på DEX, slik Call of
  // Cthulhu gjør det når ingen slår for initiativ.
  const manual = parseInt(c.init, 10);
  if (!isNaN(manual)) return manual;
  return parseInt(c.dex, 10) || 0;
}

function sortCombat() {
  state.combat.combatants.sort((a, b) => {
    const d = initiativeOf(b) - initiativeOf(a);
    if (d) return d;
    // Uavgjort: den med skytevåpen klart går først, deretter høyest DEX.
    if (!!b.firearm !== !!a.firearm) return b.firearm ? 1 : -1;
    return (parseInt(b.dex, 10) || 0) - (parseInt(a.dex, 10) || 0);
  });
}

function uniqueCombatantName(base) {
  const taken = new Set(state.combat.combatants.map((x) => x.name));
  const stem = (base || "Deltaker").replace(/\s+\d+$/, "");
  if (!taken.has(stem)) return stem;
  let n = 2;
  while (taken.has(stem + " " + n)) n += 1;
  return stem + " " + n;
}

// Unnvikelse: eget ferdighetsfelt om rollen har det, ellers halve DEX,
// slik Call of Cthulhu setter startverdien.
function dodgeValueOf(c) {
  const keys = Object.keys(c.skills || {});
  const hit = keys.find((k) => /^(dodge|unnvik)/i.test(k));
  if (hit) {
    const v = String(c.skills[hit]).replace("%", "").trim();
    if (v) return v;
  }
  const dex = parseInt(c.stats && c.stats.DEX, 10);
  return isNaN(dex) ? "" : String(Math.floor(dex / 2));
}

// Build brukes til manøvrer (grep, avvæpning, knockout).
function buildValueOf(c) {
  const given = String((c.stats && c.stats.Build) || "").trim();
  if (given) return given;
  const str = parseInt(c.stats && c.stats.STR, 10);
  const siz = parseInt(c.stats && c.stats.SIZ, 10);
  if (isNaN(str) || isNaN(siz)) return "";
  const t = str + siz;
  if (t <= 64) return "-2";
  if (t <= 84) return "-1";
  if (t <= 124) return "0";
  if (t <= 164) return "1";
  if (t <= 204) return "2";
  if (t <= 284) return "3";
  if (t <= 364) return "4";
  return "5";
}

// Statblokkene fra Malleus Monstrorum skriver skaden som «1D6 + db».
// Da skal damage bonus legges til, selv om feltet uses_db mangler.
function normalizeAttack(a) {
  const out = Object.assign({}, a);
  if (out.uses_db === undefined &&
      /(\+\s*db\b|damage bonus)/i.test(String(out.damage || ""))) {
    out.uses_db = true;
  }
  return out;
}

function makeCombatant(charLike) {
  const c = normalizeChar(charLike);
  const maxHp = charMaxHp(c);
  const entry = {
    id: newId("cb"),
    charId: c.id,
    name: uniqueCombatantName(c.name),
    kind: c.kind,
    dex: c.stats.DEX || "",
    // Forhåndsutfylt med DEX, slik at lista er brukbar med én gang.
    // Skriv over med det som ble slått.
    init: c.stats.DEX || "",
    firearm: false,
    hp: maxHp,
    hpMax: maxHp,
    armor: c.stats.Armor || c.armor || "",
    db: c.stats.DB || "",
    dodge: dodgeValueOf(c),
    build: buildValueOf(c),
    // Pulp-helter tåler mer: de bruker ikke major wound-regelen.
    // Spillerne er helter, resten er det ikke.
    pulp: c.kind === "pc",
    attacks: (c.attacks || []).map(normalizeAttack),
    // Spesialregler fra abilities.json — tentakler som vokser fram,
    // regenerering, hvilke våpen som i det hele tatt biter.
    special: specialFor(c) || null,
    pools: {},
    used: {},
    conditions: [],
    majorWound: false,
    // Slå tilbake kan gjøres én gang per runde; unnvike så mange
    // ganger man blir angrepet.
    reacted: 0,
    note: "",
  };
  rollResources(entry, { first: true });
  return entry;
}

// Kamper som ble lagret før forsvarsfeltene fantes skal fortsatt
// virke når sida åpnes igjen.
function upgradeCombatant(c) {
  if (c.dodge === undefined) {
    const dex = parseInt(c.dex, 10);
    c.dodge = isNaN(dex) ? "" : String(Math.floor(dex / 2));
  }
  if (c.build === undefined) c.build = "";
  if (c.pulp === undefined) c.pulp = c.kind === "pc";
  if (c.reacted === undefined) c.reacted = 0;
  if (!Array.isArray(c.conditions)) c.conditions = [];
  c.attacks = (c.attacks || []).map(normalizeAttack);
  if (c.special === undefined) {
    c.special = specialFor({ id: c.charId, name: c.name }) || null;
  }
  if (!c.pools) c.pools = {};
  if (!c.used) c.used = {};
  rollResources(c, { onlyMissing: true });
  return c;
}

async function addToCombat(charLike) {
  const entry = makeCombatant(charLike);
  state.combat.combatants.push(entry);
  sortCombat();
  await saveCombat();
  render();
  toast("«" + entry.name + "» lagt i kampen");
}

async function addManyToCombat(list) {
  // Navnene må gjøres unike etter hvert som de legges inn, ellers får
  // fire ghouls samme navn.
  list.forEach((c) => state.combat.combatants.push(makeCombatant(c)));
  sortCombat();
  await saveCombat();
  render();
  toast(list.length + (list.length === 1 ? " lagt i kampen"
                                         : " deltakere lagt i kampen"));
}

function viewCombat(root) {
  const cb = state.combat;
  root.appendChild(el("h1", { text: "Kamp" }));
  root.appendChild(el("p", { class: "lede",
    text: "Legg til deltakerne, skriv inn initiativet hver av dem slo, " +
          "og trykk «Start kamp» — da settes rekkefølgen. Den som har " +
          "tur ligger alltid øverst. Trykk «Angrip» for å kjøre et " +
          "angrep: velg våpen og mål, skriv inn hva som ble slått ved " +
          "bordet, la den som blir angrepet velge å unnvike eller slå " +
          "tilbake, så regnes skaden ut etter reglene. HP, tilstander " +
          "og runde lagres, så du kan lukke sida midt i en kamp." }));

  // --- kontrollrad
  const controls = el("div", { class: "row", style: "margin-bottom:14px" });
  if (!cb.active) {
    controls.appendChild(el("button", {
      class: "btn primary", type: "button", text: "Start kamp",
      onclick: async () => {
        if (!cb.combatants.length) { toast("Legg til deltakere først"); return; }
        sortCombat();
        cb.active = true; cb.round = 1; cb.turn = 0; cb.taken = 0;
        cb.log = ["Runde 1 begynner. Rekkefølge: " +
                  cb.combatants.map((x) => x.name + " " + initiativeOf(x))
                    .join(", ") + "."];
        cb.combatants.forEach((x) => {
          rollResources(x, { first: true }).forEach((l) => cb.log.push(l));
        });
        await saveCombat(); render();
      },
    }));
  } else {
    controls.appendChild(el("button", {
      class: "btn primary", type: "button", text: "Neste tur",
      onclick: () => advanceTurn(),
    }));
    controls.appendChild(el("button", {
      class: "btn", type: "button", text: "Avslutt kamp",
      onclick: () => confirmThen("Avslutt kampen?",
        "Deltakerlista blir liggende, men runde og tur nullstilles.",
        async () => {
          cb.active = false; cb.round = 0; cb.turn = 0; cb.taken = 0;
          await saveCombat(); render();
        }),
    }));
  }
  controls.appendChild(el("button", {
    class: "btn small", type: "button", text: "+ Legg til",
    onclick: () => addCombatantDialog(),
  }));
  if (state.scenario && (state.scenario.tactics || []).length) {
    controls.appendChild(el("button", {
      class: "btn small", type: "button", text: "Trekk taktikk",
      title: "Et forslag til noe som gjør kampen vanskeligere",
      onclick: () => drawTactic(),
    }));
  }
  if (cb.combatants.length > 1) {
    controls.appendChild(el("button", {
      class: "btn small", type: "button", text: "Sorter på nytt",
      title: "Sorter etter initiativ uten å starte om kampen",
      onclick: async () => {
        sortCombat();
        await saveCombat(); render();
        toast("Sortert etter initiativ");
      },
    }));
  }
  if (cb.combatants.length) {
    controls.appendChild(el("button", {
      class: "btn small danger", type: "button", text: "Tøm",
      onclick: () => confirmThen("Tøm kampen?",
        "Alle deltakere fjernes.", async () => {
          state.combat = emptyCombat();
          await saveCombat(); render();
        }),
    }));
  }
  root.appendChild(controls);

  if (cb.active) {
    const current = cb.combatants[0];
    const next = cb.combatants[1];
    const taken = cb.taken || 0;
    root.appendChild(el("div", { class: "panel accent roundbar" }, [
      el("div", null, [
        el("p", { class: "eyebrow", text: "Runde" }),
        el("p", { class: "roundnum", text: String(cb.round) }),
      ]),
      el("div", { class: "roundbar-now" }, [
        el("p", { class: "eyebrow", text: "Sin tur" }),
        el("p", { class: "turnname", text: current ? current.name : "—" }),
        next ? el("p", { class: "entry-sub", text: "Nestemann: " + next.name })
             : null,
      ]),
      el("div", { class: "roundbar-count" }, [
        el("p", { class: "eyebrow", text: "Turer tatt" }),
        el("p", { class: "roundcount",
                  text: taken + " / " + cb.combatants.length }),
      ]),
    ]));
  }

  if (!cb.combatants.length) {
    root.appendChild(emptyBox("Ingen deltakere.",
      "Legg til fra Roller, fra Fiendebanken, eller manuelt med " +
      "«+ Deltaker»."));
    return;
  }

  const stack = el("div", { class: "stack" });
  cb.combatants.forEach((c, i) => {
    stack.appendChild(combatantCard(c, i));
  });
  root.appendChild(stack);

  if (cb.log && cb.log.length) {
    root.appendChild(el("h2", { text: "Logg" }));
    const logbox = el("div", { class: "panel" });
    cb.log.slice(-14).reverse().forEach((line) => {
      logbox.appendChild(el("p", { class: "logline", text: line }));
    });
    root.appendChild(logbox);
  }
}

const CONDITIONS = ["Bevisstløs", "Døende", "Død", "Major wound",
                    "Mister neste angrep", "Våpen feilet", "Grepet",
                    "Gal", "Skadet", "Flykter"];

// Rustningsfeltet fra fiendebanken er ofte en hel setning («none, but
// due to their shadowy nature …»). I kampkortets ettlinjes undertittel
// er det bare selve tallet som er til nytte.
function shortArmor(armor) {
  const s = String(armor || "").trim();
  if (!s) return null;
  const m = s.match(/^(\d+)\s*-?\s*(point|poeng)?/i);
  if (m) return "rustning " + m[1];
  if (/^(none|ingen)\b/i.test(s)) return null;
  return s.length <= 18 ? "rustning " + s : "rustning (se ark)";
}

function combatantCard(c, index) {
  const cb = state.combat;
  const isTurn = cb.active && index === 0;
  const dead = c.hp <= 0;
  const pct = c.hpMax ? Math.max(0, Math.min(100,
    Math.round((c.hp / c.hpMax) * 100))) : 0;
  const tone = c.kind === "enemy" ? "villain"
    : (c.kind === "npc" ? "event" : "voyage");

  const card = el("div", {
    class: "combatant" + (isTurn ? " active" : "") + (dead ? " down" : ""),
    "data-tag": tone,
  });

  if (isTurn) {
    card.appendChild(el("div", { class: "cb-turnflag" }, [
      el("span", { text: "NÅ" }),
      el("button", {
        class: "btn small primary", type: "button", text: "Ferdig — neste tur",
        onclick: () => advanceTurn(),
      }),
    ]));
  }

  // --- topplinje
  // Initiativet skrives inn for hånd. Lista sorteres ikke mens du
  // skriver — da ville radene hoppet rundt mens du gikk nedover dem.
  // «Start kamp» (og «Sorter») setter rekkefølgen.
  const initInput = el("input", {
    class: "cb-initedit", type: "number", inputmode: "numeric",
    id: "init-" + c.id,
    value: (c.init === undefined || c.init === null) ? "" : String(c.init),
    placeholder: c.dex ? String(c.dex) : "—",
    title: "Initiativ — skriv inn det som ble slått",
    "aria-label": "Initiativ for " + c.name,
  });
  initInput.addEventListener("input", debounce(async () => {
    c.init = initInput.value.trim();
    await saveCombat();
  }, 400));

  card.appendChild(el("div", { class: "cb-head" }, [
    el("span", { class: "cb-initbox" }, [
      initInput,
      el("span", { class: "cb-initlabel", text: "init" }),
    ]),
    el("span", { class: "cb-name" }, [
      el("b", { text: c.name }),
      el("span", { class: "entry-sub",
        text: [KIND_LABEL[c.kind], c.dex ? "DEX " + c.dex : null,
               c.dodge ? "unnvik " + c.dodge + "%" : null,
               c.firearm ? "skytevåpen" : null,
               shortArmor(c.armor), c.db ? "DB " + c.db : null,
               c.build !== "" && c.build !== undefined
                 ? "Build " + c.build : null,
               c.pulp ? "pulp-helt" : null]
          .filter(Boolean).join(" · ") }),
    ]),
    el("span", { class: "cb-hp" + (dead ? " out" : "") },
       [String(c.hp), el("small", { text: " / " + c.hpMax })]),
  ]));

  // --- HP-stolpe
  card.appendChild(el("div", { class: "meter-track" }, [
    el("div", {
      class: "meter-fill" + (pct > 50 ? " full" : ""),
      style: "width:" + pct + "%;" +
             (pct <= 25 ? "background:var(--signal);" : ""),
    }),
  ]));

  // --- skade og helbred
  const dmg = el("input", { class: "field cb-num", type: "number",
                            placeholder: "0", inputmode: "numeric" });
  function applyHp(sign) {
    const n = parseInt(dmg.value, 10);
    if (!n || n <= 0) { dmg.focus(); return; }
    const before = c.hp;
    c.hp = Math.max(0, Math.min(c.hpMax, c.hp + sign * n));
    // Call of Cthulhu: én enkelt skade på halve maks-HP eller mer er
    // et major wound.
    if (sign < 0 && n >= Math.ceil(c.hpMax / 2) && !c.majorWound) {
      c.majorWound = true;
      if (c.conditions.indexOf("Major wound") === -1) {
        c.conditions.push("Major wound");
      }
      cb.log.push(c.name + " tar " + n + " skade — MAJOR WOUND " +
                  "(CON roll eller bevisstløs).");
    } else {
      cb.log.push(c.name + (sign < 0 ? " tar " + n + " skade"
                                     : " leges " + n) +
                  " (" + before + " → " + c.hp + ").");
    }
    if (c.hp === 0 && c.conditions.indexOf("Døende") === -1) {
      c.conditions.push("Døende");
      cb.log.push(c.name + " er nede på 0 HP.");
    }
    dmg.value = "";
    saveCombat().then(render);
  }
  const tools = el("div", { class: "cb-tools" }, [
    dmg,
    el("button", { class: "btn small danger", type: "button", text: "Skade",
                   onclick: () => applyHp(-1) }),
    el("button", { class: "btn small", type: "button", text: "Leg",
                   onclick: () => applyHp(+1) }),
    el("button", { class: "btn small", type: "button",
                   "aria-pressed": String(!!c.firearm),
                   text: "Skytevåpen",
                   onclick: async () => {
                     c.firearm = !c.firearm; sortCombat();
                     await saveCombat(); render();
                   } }),
    el("button", { class: "btn small", type: "button",
                   "aria-pressed": String(!!c.pulp),
                   title: "Pulp-helter bruker ikke major wound-regelen: " +
                          "de dør av ett slag på maks HP, ligger for " +
                          "døden på halve maks HP ned til null, og " +
                          "besvimer ellers på null.",
                   text: c.pulp ? "Pulp ✓" : "Pulp",
                   onclick: async () => {
                     c.pulp = !c.pulp;
                     await saveCombat(); render();
                   } }),
    el("button", { class: "btn small", type: "button", text: "Fjern",
                   onclick: async () => {
                     cb.combatants = cb.combatants.filter((x) => x.id !== c.id);
                     cb.turn = 0;
                     if (cb.taken > cb.combatants.length) cb.taken = 0;
                     await saveCombat(); render();
                   } }),
  ]);
  card.appendChild(tools);

  // --- spesialregler med teller: tentakler, vindstøt, regenerering
  const abil = abilitiesOf(c);
  if (abil.length) {
    const strip = el("div", { class: "cb-special" });
    abil.forEach((a) => {
      if (a.kind === "pool") {
        const left = poolLeft(c, a.id) || 0;
        strip.appendChild(el("span", { class: "resbox" }, [
          el("button", { class: "resadj", type: "button", text: "−",
            title: "Én mindre", onclick: async () => {
              c.pools[a.id] = Math.max(0, left - 1);
              await saveCombat(); render();
            } }),
          el("span", { class: "resnum", text: String(left) }),
          el("button", { class: "resadj", type: "button", text: "+",
            title: "Én mer", onclick: async () => {
              c.pools[a.id] = left + 1;
              await saveCombat(); render();
            } }),
          el("span", { class: "reslabel", text: a.unit || a.name }),
          el("button", { class: "resadj roll", type: "button",
            text: "slå " + (a.roll || "").toLowerCase(),
            title: "Slå " + a.roll + " på nytt for denne runden",
            onclick: async () => {
              const r = rollDiceExpr(a.roll || "1");
              c.pools[a.id] = Math.max(0, r.total);
              state.combat.log.push(c.name + ": " + a.name + " " +
                                    r.total + " (" + a.roll + ")");
              await saveCombat(); render();
            } }),
        ]));
      } else if (a.kind === "limited") {
        const left = usesLeft(c, a);
        strip.appendChild(el("span", {
          class: "resbox" + (left ? "" : " spent"),
          title: a.description || "",
        }, [
          el("span", { class: "resnum", text: left + "/" + (a.uses || 1) }),
          el("span", { class: "reslabel", text: a.name }),
        ]));
      } else if (a.kind === "regen") {
        strip.appendChild(el("span", { class: "resbox", title: a.description }, [
          el("span", { class: "reslabel",
                       text: "leger " + (a.roll || a.amount) + "/runde" }),
        ]));
      }
    });
    strip.appendChild(el("button", {
      class: "chip cond add", type: "button", text: "Spesialregler",
      title: "Se hva denne skapningen kan",
      onclick: () => openSpecialRules(c),
    }));
    card.appendChild(strip);
  }

  // --- angrep: hvert våpen starter angrepsflyten med det valgt
  const atk = el("div", { class: "cb-attacks" });
  atk.appendChild(el("button", {
    class: "btn small" + (isTurn ? " primary" : ""), type: "button",
    text: "⚔ Angrip",
    title: "Velg angrep og mål, og kjør slaget steg for steg",
    onclick: () => openAttackFlow(c),
  }));
  attacksOf(c).forEach((a) => {
    const left = attackBudget(c, a);
    atk.appendChild(el("button", {
      class: "chip atk" + (left === 0 ? " spent" : ""), type: "button",
      title: left === null ? "Angrip med " + a.name
        : a.name + ": " + left + " igjen denne runden",
      text: a.name + (a.skill ? " " + a.skill : "") +
            (a.damage ? " · " + a.damage : "") +
            (left !== null ? "  ×" + left : ""),
      onclick: () => pickTarget(c, a),
    }));
  });
  card.appendChild(atk);

  // --- tilstander. Bare de som gjelder vises; resten ligger bak
  // «+ Tilstand», slik at kortet holder seg lesbart midt i en kamp.
  const conds = el("div", { class: "cb-conds" });
  const picker = el("div", { class: "cb-conds condpick", hidden: true });

  async function toggleCond(name) {
    if (c.conditions.indexOf(name) !== -1) {
      c.conditions = c.conditions.filter((x) => x !== name);
    } else {
      c.conditions.push(name);
    }
    await saveCombat(); render();
  }

  (c.conditions || []).forEach((name) => {
    conds.appendChild(el("button", {
      class: "chip cond on", type: "button", "aria-pressed": "true",
      title: "Fjern tilstanden", text: name + " ×",
      onclick: () => toggleCond(name),
    }));
  });
  conds.appendChild(el("button", {
    class: "chip cond add", type: "button", text: "+ Tilstand",
    onclick: () => { picker.hidden = !picker.hidden; },
  }));
  CONDITIONS.filter((x) => (c.conditions || []).indexOf(x) === -1)
    .forEach((name) => {
      picker.appendChild(el("button", {
        class: "chip cond", type: "button", text: name,
        onclick: () => toggleCond(name),
      }));
    });
  card.appendChild(conds);
  card.appendChild(picker);

  const note = el("input", { class: "field", placeholder: "Notat…",
                             value: c.note || "" });
  note.addEventListener("input", debounce(async () => {
    c.note = note.value; await saveCombat();
  }, 500));
  card.appendChild(note);

  return card;
}

async function advanceTurn() {
  const cb = state.combat;
  if (!cb.combatants.length) return;

  // Den som er ferdig flyttes nederst, og resten rykker opp. Da ligger
  // den som har tur alltid øverst, og man slipper å lete seg nedover
  // lista midt i en kamp.
  const done = cb.combatants.shift();
  cb.combatants.push(done);
  cb.turn = 0;

  // En runde er omme når alle har hatt tur én gang.
  cb.taken = (cb.taken || 0) + 1;
  if (cb.taken >= cb.combatants.length) {
    cb.taken = 0;
    cb.round += 1;
    cb.log.push("— Runde " + cb.round + " —");
    // Ved rundeskiftet leger de som leger seg, og de som danner nye
    // lemmer slår for hvor mange de har i den nye runden.
    cb.combatants.forEach((x) => {
      applyRegen(x).forEach((line) => cb.log.push(line));
      rollResources(x).forEach((line) => cb.log.push(line));
    });
  }
  await saveCombat();
  render();
}

/* =================== ANGREPSFLYTEN I KAMP =======================

   Kampen kjøres herfra: velg angrep, velg mål, skriv inn hva som ble
   slått ved bordet, og la den som blir angrepet velge hva den gjør.
   Skaden regnes ut automatisk etter treffnivå, spidding, damage bonus
   og rustning, og settes rett på HP-en når du godtar resultatet.

   Reglene er Call of Cthulhu 7e med Pulp Cthulhu-tilleggene:
   nærkamp er et motsatt slag der forsvareren kan unnvike eller slå
   tilbake, skytevåpen kan bare møtes med å dykke i dekning, og
   pulp-helter bruker ikke major wound-regelen.                     */

// Flyten holdes utenfor modalen, så alle tre stegene ser samme data.
let atkFlow = null;

function livingCombatants() {
  return state.combat.combatants;
}

function attacksOf(c) {
  const own = (c.attacks || []).filter((a) => a && a.name);
  // Tentakkelen og vindstøtet står ikke i angrepslista på statblokka —
  // de kommer fra spesialreglene, og har hver sin teller.
  const extra = [];
  const drop = {};
  abilitiesOf(c).forEach((a) => {
    if (!a.attack) return;
    // Statblokka har den samme linja på engelsk. Den blir stående i
    // veien, så spesialregelen overtar den.
    (a.replaces || []).concat(a.attack.name).forEach((n) => {
      drop[String(n).toLowerCase()] = true;
    });
    extra.push(Object.assign({}, a.attack, { abilityId: a.id }));
  });
  return extra.concat(
    own.filter((x) => !drop[String(x.name).toLowerCase()]));
}

function manoeuvreOption() {
  return {
    name: "Manøver", manoeuvre: true, damage: "", skill: "",
    uses_db: false, can_impale: false, malfunction: null,
    note: "Grep, avvæpning, kaste i bakken, knockout. Ingen skade av " +
          "seg selv — slås mot Slåsskamp, og Build avgjør om det i det " +
          "hele tatt lar seg gjøre.",
  };
}

// Treffsjansen som tall. Statblokker skriver «35%», weapons.json også.
function skillNumber(v) {
  const m = String(v === undefined || v === null ? "" : v).match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}

function attackSummary(a) {
  return [a.skill || null, a.damage || null, a.range || null,
          a.ignores_armor ? "ignorerer rustning" : null,
          a.ammo ? "ammo " + a.ammo : null,
          a.attacks && a.attacks !== "1" ? a.attacks + "/runde" : null,
          a.can_impale ? "spidder" : null,
          a.malfunction ? "feiler " + a.malfunction + "+" : null]
    .filter(Boolean).join(" · ");
}

/* --- steg 1: hvilket angrep --- */
// Ubevæpnet nærkamp er alltid mulig, uansett hva som står på arket.
// Treffsjansen tas fra rollens egen Slåsskamp/Fighting der den finnes.
const UNARMED_IDS = ["fist", "kick", "headbutt"];

function unarmedOptions(attacker) {
  const bank = state.weapons;
  if (!bank) return [];
  // Har deltakeren alt et nærkampangrep — slåsskamp på arket, klør på
  // en ghoul — er det det som gjelder. Da skal ikke banken legge på
  // knyttnever oppå.
  const hasMelee = attacksOf(attacker).some((a) => !isRangedAttack(a));
  if (hasMelee) return [];
  const own = charBehind(attacker);
  return UNARMED_IDS.map((id) => {
    const w = bank.weapons.find((x) => x.id === id);
    return w ? weaponToAttack(w, own) : null;
  }).filter(Boolean);
}

function attackRow(attacker, a, openLabel) {
  const t = thresholds(skillNumber(a.skill));
  const left = attackBudget(attacker, a);
  const spent = left === 0;
  return el("button", {
    class: "entry pickrow" + (spent ? " dimmed" : ""), type: "button",
    onclick: () => {
      if (spent) { toast("Ingen igjen av dette angrepet denne runden"); return; }
      pickTarget(attacker, a);
    },
  }, [
    el("span", { class: "entry-body" }, [
      el("span", { class: "entry-title",
        text: a.name + (left !== null ? "  —  " + left + " igjen" : "") }),
      el("span", { class: "entry-sub", text: attackSummary(a) }),
      el("span", { class: "entry-sub",
        text: skillNumber(a.skill)
          ? "ekstrem ≤" + t.extreme + " · hard ≤" + t.hard +
            " · vanlig ≤" + t.regular + " · fumle ≥" + t.fumble
          : "Ingen treffsjanse lagt inn — skriv den inn i neste steg." }),
    ]),
    el("span", { class: "entry-open",
      text: openLabel || (isRangedAttack(a) ? "AVSTAND" : "NÆRKAMP") }),
  ]);
}

function plainRow(title, sub, openLabel, onclick) {
  return el("button", { class: "entry pickrow", type: "button",
                        onclick: onclick }, [
    el("span", { class: "entry-body" }, [
      el("span", { class: "entry-title", text: title }),
      el("span", { class: "entry-sub", text: sub }),
    ]),
    el("span", { class: "entry-open", text: openLabel }),
  ]);
}

/* --- steg 1: hvilket angrep ---

   Bare det deltakeren faktisk har: våpnene som står på arket, pluss
   ubevæpnet nærkamp. Hele våpenlista ligger bak et eget valg — den
   skal ikke være det første man ser når noen slår til.            */
function openAttackFlow(attacker) {
  const list = attacksOf(attacker);
  openModal("Angrep — " + attacker.name,
    "Velg angrepet som brukes", (body) => {
      const stack = el("div", { class: "stack" });

      if (list.length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Våpen og angrep" }));
        list.forEach((a) => stack.appendChild(attackRow(attacker, a)));
        body.appendChild(stack);
      } else {
        body.appendChild(emptyBox("Ingen våpen lagt inn på denne.",
          "Legg dem inn under Roller, så står de her neste gang. " +
          "Inntil videre kan du bruke nærkamp, en manøver, eller " +
          "hente et våpen fra lista under."));
      }

      const bare = unarmedOptions(attacker);
      if (bare.length) {
        body.appendChild(el("div", { class: "section-label",
                                     text: "Ubevæpnet" }));
        const ustack = el("div", { class: "stack" });
        bare.forEach((a) => ustack.appendChild(attackRow(attacker, a)));
        body.appendChild(ustack);
      }

      body.appendChild(el("div", { class: "section-label", text: "Annet" }));
      const other = el("div", { class: "stack" });
      other.appendChild(plainRow("Manøver", manoeuvreOption().note,
        "NÆRKAMP", () => pickTarget(attacker, manoeuvreOption())));
      other.appendChild(plainRow("Improvisert",
        "Skriv inn navn, treffsjanse og skade selv — stol, kokende " +
        "vann, en åre.", "SKRIV INN", () => improvisedAttack(attacker)));
      other.appendChild(plainRow("Plukk opp et annet våpen",
        "Hele våpenlista i appen. Bruk den når noen griper noe som " +
        "ligger der — ellers holder du deg til det som står på arket.",
        "VELG", () => pickWeaponForAttack(attacker)));
      body.appendChild(other);
    }, []);
}

// Rollen bak en kampdeltaker, til å slå opp ferdigheter i.
function charBehind(combatant) {
  return state.characters.find((x) => x.id === combatant.charId) || null;
}

function pickWeaponForAttack(attacker) {
  const bank = state.weapons;
  openModal("Våpen — " + attacker.name,
    "Velg hva som brukes i dette angrepet", (body) => {
      if (!bank || !bank.weapons) {
        body.appendChild(emptyBox("Ingen våpenliste bygget inn."));
        return;
      }
      const cats = bank.categories || {};
      const listBox = el("div", { class: "picklist" });
      let query = "";
      function refresh() {
        listBox.innerHTML = "";
        const q = query.trim().toLowerCase();
        const shown = bank.weapons.filter((w) => !q ||
          (w.name + " " + (w.skill || "") + " " + (w.damage || ""))
            .toLowerCase().indexOf(q) !== -1);
        if (!shown.length) {
          listBox.appendChild(emptyBox("Ingen treff."));
          return;
        }
        const order = [];
        const byCat = {};
        shown.forEach((w) => {
          const c = w.category || "annet";
          if (!byCat[c]) { byCat[c] = []; order.push(c); }
          byCat[c].push(w);
        });
        order.forEach((c) => {
          listBox.appendChild(el("div", { class: "section-label",
                                          text: cats[c] || c }));
          byCat[c].forEach((w) => {
            const a = weaponToAttack(w, charBehind(attacker));
            listBox.appendChild(el("button", {
              class: "entry pickrow", type: "button",
              onclick: () => pickTarget(attacker, a),
            }, [
              el("span", { class: "entry-body" }, [
                el("span", { class: "entry-title", text: w.name }),
                el("span", { class: "entry-sub", text: attackSummary(a) ||
                  (w.skill + " · " + w.damage) }),
              ]),
              el("span", { class: "entry-open",
                           text: a.skill ? a.skill : "SKRIV INN %" }),
            ]));
          });
        });
      }
      const search = el("input", { class: "field", type: "search",
        id: "flow-weapon-search",
        placeholder: "Søk i " + bank.weapons.length + " våpen…" });
      search.addEventListener("input", debounce(() => {
        query = search.value; refresh();
      }, 180));
      body.appendChild(search);
      body.appendChild(el("div", { style: "height:8px" }));
      body.appendChild(listBox);
      refresh();
    }, []);
}

function improvisedAttack(attacker) {
  const name = el("input", { class: "field", id: "imp-name",
                             placeholder: "Hva slås det med" });
  const skill = el("input", { class: "field cb-num", type: "number",
                              id: "imp-skill", placeholder: "%" });
  const dmg = el("input", { class: "field", id: "imp-damage",
                            placeholder: "1D6, 2D6+2 …" });
  const impale = el("button", { class: "chip resp", type: "button",
                                text: "Spidder", "aria-pressed": "false" });
  let canImpale = false;
  impale.addEventListener("click", () => {
    canImpale = !canImpale;
    impale.classList.toggle("on");
    impale.setAttribute("aria-pressed", String(canImpale));
  });
  openModal("Improvisert angrep", attacker.name, (body) => {
    body.appendChild(el("div", { class: "flowcard" }, [
      el("label", { class: "minilabel", text: "Navn" }), name,
      el("div", { style: "height:8px" }),
      el("div", { class: "rollrow" }, [
        el("label", { class: "minilabel", text: "Treffsjanse %" }), skill,
        el("label", { class: "minilabel", text: "Skade" }), dmg,
      ]),
      el("div", { class: "respchips" }, [impale]),
      el("p", { class: "entry-sub",
        text: "Damage bonus legges til automatisk på nærkampangrep." }),
    ]));
  }, [
    el("button", { class: "btn primary", type: "button", text: "Videre",
      onclick: () => {
        if (!dmg.value.trim()) { toast("Skaden må fylles ut"); return; }
        pickTarget(attacker, {
          name: name.value.trim() || "Improvisert",
          skill: skill.value.trim() ? skill.value.trim() + "%" : "",
          damage: dmg.value.trim(), uses_db: true,
          can_impale: canImpale, malfunction: null, category: "melee",
        });
      } }),
  ]);
}

/* --- steg 2: mot hvem --- */
function pickTarget(attacker, attack) {
  const others = livingCombatants().filter((x) => x.id !== attacker.id);
  openModal(attack.name + " — mot hvem?",
    attacker.name + (isRangedAttack(attack) ? " · på avstand" : " · nærkamp"),
    (body) => {
      if (!others.length) {
        body.appendChild(emptyBox("Ingen andre i kampen."));
        return;
      }
      const stack = el("div", { class: "stack" });
      others.forEach((t) => {
        const down = t.hp <= 0;
        stack.appendChild(el("button", {
          class: "entry pickrow" + (down ? " dimmed" : ""), type: "button",
          onclick: () => openResolve(attacker, attack, t),
        }, [
          el("span", { class: "entry-body" }, [
            el("span", { class: "entry-title", text: t.name }),
            el("span", { class: "entry-sub",
              text: [KIND_LABEL[t.kind], "HP " + t.hp + "/" + t.hpMax,
                     armorValue(t) ? "rustning " + armorValue(t) : null,
                     t.dodge ? "unnvik " + t.dodge + "%" : null,
                     (t.conditions || []).join(", ") || null]
                .filter(Boolean).join(" · ") }),
          ]),
          el("span", { class: "entry-open", text: down ? "NEDE" : "VELG" }),
        ]));
      });
      body.appendChild(stack);
    }, []);
}

/* --- steg 3: slagene og resultatet --- */
function openResolve(attacker, attack, target) {
  const ranged = isRangedAttack(attack);
  atkFlow = {
    attacker: attacker, attack: attack, target: target, ranged: ranged,
    attackSkill: skillNumber(attack.skill),
    attackRoll: "",
    response: "none",
    defSkill: skillNumber(target.dodge),
    defRoll: "",
    defAttack: attacksOf(target)[0] || null,
    knockout: false,
    // Hva slags skade dette er, til skapninger som bare biter på noe.
    source: damageSourceOf(attack),
    // «body» eller id-en til en teller det går an å hugge løs på.
    part: "body",
    damage: null,       // { total, detail, impaled, victim }
    outcomeKey: "",
    result: null,
  };

  let applyBtn = null;
  const foot = [
    el("button", { class: "btn", type: "button", text: "Avbryt",
                   onclick: () => closeModal() }),
    (applyBtn = el("button", {
      class: "btn primary", type: "button", text: "Bruk resultatet",
      disabled: "disabled",
      onclick: () => applyFlowResult(),
    })),
  ];

  openModal(
    () => atkFlow.attacker.name + " → " + atkFlow.target.name,
    () => atkFlow.attack.name + (atkFlow.ranged ? " · avstand" : " · nærkamp"),
    (body) => buildResolve(body, () => applyBtn),
    foot);
}

function levelChip(g) {
  if (!g) return el("span", { class: "lvlchip", text: "—" });
  return el("span", { class: "lvlchip " + g.cls,
                      text: g.roll + " · " + g.label });
}

function buildResolve(body, getApplyBtn) {
  const f = atkFlow;
  const verdict = el("div", { class: "verdict" });
  const dmgBox = el("div", { class: "dmgbox" });

  /* --- angriperen --- */
  const aSkill = el("input", { class: "field cb-num", type: "number",
    inputmode: "numeric", id: "flow-atk-skill",
    value: f.attackSkill ? String(f.attackSkill) : "" });
  const aRoll = el("input", { class: "field cb-num", type: "number",
    inputmode: "numeric", id: "flow-atk-roll", placeholder: "1–100",
    value: f.attackRoll });
  const aThresh = el("p", { class: "threshline" });
  const aChip = el("span", { class: "lvlholder" });

  /* --- forsvareren --- */
  const dSkill = el("input", { class: "field cb-num", type: "number",
    inputmode: "numeric", id: "flow-def-skill",
    value: f.defSkill ? String(f.defSkill) : "" });
  const dRoll = el("input", { class: "field cb-num", type: "number",
    inputmode: "numeric", id: "flow-def-roll", placeholder: "1–100",
    value: f.defRoll });
  const dThresh = el("p", { class: "threshline" });
  const dChip = el("span", { class: "lvlholder" });
  const dBox = el("div", { class: "defroll" }, [
    el("label", { class: "minilabel", text: "Ferdighet %" }), dSkill,
    el("label", { class: "minilabel", text: "Slaget" }), dRoll,
    el("button", { class: "btn small", type: "button", text: "Slå",
      title: "La appen slå for denne — nyttig for NPCer og fiender",
      onclick: () => { dRoll.value = String(1 + Math.floor(Math.random() * 100));
                       f.defRoll = dRoll.value; update(); } }),
    dChip,
  ]);

  // Vises bare når målet dykker i dekning OG slaget gikk: da skal
  // angriperen ha én straffeterning, altså en ekstra tierterning.
  const penTens = el("input", { class: "rollin", type: "number",
    min: "0", max: "9", placeholder: "0-9" });
  const penBox = el("div", { class: "defroll", hidden: true }, [
    el("label", { class: "minilabel", text: "Ekstra tierterning" }), penTens,
    el("button", { class: "btn small", type: "button", text: "Slå",
      onclick: () => { penTens.value = String(Math.floor(Math.random() * 10));
                       f.penTens = penTens.value; update(); } }),
  ]);

  function responses() {
    const out = [{ key: "none", label: "Ingenting",
                   hint: "Angriperen trenger bare en vanlig suksess." }];
    if (f.ranged) {
      out.push({ key: "dive", label: "Dykk i dekning",
                 hint: "Unnvikelse mot skytevåpen. Lykkes slaget, får " +
                       "angriperen én straffeterning — skuddet forsvinner " +
                       "ikke. Koster neste angrep uansett." });
      out.push({ key: "dodge", label: "Unnvik likevel",
                 hint: "Kuler kan ikke unnvikes — de kan ikke ses i " +
                       "bevegelse. Bruk bare dette om du som Keeper " +
                       "tillater det." });
    } else {
      out.push({ key: "dodge", label: "Unnvik",
                 hint: "Motsatt slag mot Unnvikelse. Vinner forsvareren, " +
                       "treffer ikke angrepet. Kan brukes så mange " +
                       "ganger man blir angrepet, men bare én gang mot " +
                       "det samme angrepet. Kan ikke pushes." });
      out.push({ key: "fightback", label: "Slå tilbake",
                 hint: "Motsatt slag med eget våpen. Vinner forsvareren, " +
                       "er det angriperen som tar skaden. Én gang per runde." });
    }
    return out;
  }

  const respRow = el("div", { class: "respchips" });
  const respHint = el("p", { class: "entry-sub" });
  const fbPick = el("div", { class: "fbpick" });

  function drawResponses() {
    respRow.innerHTML = "";
    responses().forEach((r) => {
      const on = f.response === r.key;
      respRow.appendChild(el("button", {
        class: "chip resp" + (on ? " on" : ""), type: "button",
        "aria-pressed": String(on), text: r.label,
        onclick: () => {
          f.response = r.key;
          if (r.key === "fightback") {
            f.defSkill = skillNumber(f.defAttack && f.defAttack.skill);
          } else {
            f.defSkill = skillNumber(f.target.dodge);
          }
          dSkill.value = f.defSkill ? String(f.defSkill) : "";
          drawResponses(); update();
        },
      }));
    });
    const cur = responses().find((r) => r.key === f.response);
    respHint.textContent = cur ? cur.hint : "";

    fbPick.innerHTML = "";
    if (f.response === "fightback") {
      const list = attacksOf(f.target);
      if (!list.length) {
        fbPick.appendChild(el("p", { class: "caveat",
          text: "Denne har ingen angrep lagt inn. Skriv inn ferdigheten " +
                "og skaden for hånd, eller velg noe annet." }));
      }
      list.forEach((a) => {
        const on = f.defAttack === a;
        fbPick.appendChild(el("button", {
          class: "chip atk" + (on ? " on" : ""), type: "button",
          text: a.name + (a.skill ? " " + a.skill : "") +
                (a.damage ? " · " + a.damage : ""),
          onclick: () => {
            f.defAttack = a;
            f.defSkill = skillNumber(a.skill);
            dSkill.value = f.defSkill ? String(f.defSkill) : "";
            drawResponses(); update();
          },
        }));
      });
      if (f.target.reacted === state.combat.round && state.combat.round) {
        fbPick.appendChild(el("p", { class: "caveat",
          text: f.target.name + " har alt slått tilbake denne runden. " +
                "Unnvikelse kan brukes så mange ganger man blir " +
                "angrepet — men bare én gang mot det samme angrepet." }));
      }
    }
  }

  function update() {
    f.attackSkill = parseInt(aSkill.value, 10) || 0;
    f.attackRoll = aRoll.value;
    f.defSkill = parseInt(dSkill.value, 10) || 0;
    f.defRoll = dRoll.value;

    const at = thresholds(f.attackSkill);
    aThresh.textContent = f.attackSkill
      ? "kritisk 01 · ekstrem ≤" + at.extreme + " · hard ≤" + at.hard +
        " · vanlig ≤" + at.regular + " · fumle ≥" + at.fumble
      : "Skriv inn treffsjansen for å se grensene.";
    const dt = thresholds(f.defSkill);
    dThresh.textContent = f.defSkill
      ? "ekstrem ≤" + dt.extreme + " · hard ≤" + dt.hard +
        " · vanlig ≤" + dt.regular + " · fumle ≥" + dt.fumble
      : "";

    const needsDef = f.response !== "none";
    dBox.hidden = !needsDef;
    const dNum = parseInt(f.defRoll, 10);
    const dG = (needsDef && dNum >= 1 && dNum <= 100)
      ? gradeRoll(dNum, f.defSkill) : null;
    dChip.innerHTML = ""; dChip.appendChild(levelChip(dG));

    // Et vellykket dekningsdykk gir angriperen én straffeterning.
    f.penTens = penTens.value;
    const penalised = f.response === "dive" && dG && dG.rank > 0;
    penBox.hidden = !penalised;
    const ph = body.querySelector("#penhint");
    if (ph) ph.hidden = !penalised;
    if (!penalised) { penTens.value = ""; f.penTens = ""; }

    const aNum = parseInt(f.attackRoll, 10);
    const aUse = penalised ? withPenaltyTens(aNum, f.penTens) : aNum;
    f.effRoll = aUse;
    f.penalised = penalised;
    const aG = (aUse >= 1 && aUse <= 100)
      ? gradeRoll(aUse, f.attackSkill) : null;
    aChip.innerHTML = ""; aChip.appendChild(levelChip(aG));

    f.result = computeFlow(aG, dG);
    renderVerdict(verdict, dmgBox, f.result);
    const btn = getApplyBtn();
    if (btn) btn.disabled = f.result && f.result.ready ? false : "disabled";
  }

  [aSkill, aRoll, dSkill, dRoll, penTens].forEach((inp) => {
    inp.addEventListener("input", update);
  });

  /* --- selve oppsettet --- */
  const t = f.target;
  body.appendChild(el("div", { class: "flowcard" }, [
    el("p", { class: "eyebrow", text: "Angriper" }),
    el("p", { class: "flowname", text: f.attacker.name + " — " + f.attack.name }),
    el("p", { class: "entry-sub", text: attackSummary(f.attack) ||
      (f.attack.manoeuvre ? "Build " + (f.attacker.build || "?") + " mot " +
        (t.build || "?") : "") }),
    el("div", { class: "rollrow" }, [
      el("label", { class: "minilabel", text: "Ferdighet %" }), aSkill,
      el("label", { class: "minilabel", text: "Slaget" }), aRoll,
      el("button", { class: "btn small", type: "button", text: "Slå",
        title: "La appen slå for denne — nyttig for NPCer og fiender",
        onclick: () => { aRoll.value = String(1 + Math.floor(Math.random() * 100));
                         f.attackRoll = aRoll.value; update(); } }),
      aChip,
    ]),
    aThresh,
  ]));

  if (f.attack.manoeuvre) {
    const ko = el("button", {
      class: "chip resp" + (f.knockout ? " on" : ""), type: "button",
      text: "Knockout-forsøk",
      onclick: () => { f.knockout = !f.knockout; ko.classList.toggle("on");
                       update(); },
    });
    body.appendChild(el("div", { class: "respchips" }, [ko]));
    body.appendChild(el("p", { class: "entry-sub",
      text: "Pulp Cthulhu: en manøver med et stumpt angrep kan slå " +
            "motstanderen bevisstløs. Da tar den bare 1 i skade. Er " +
            "målets Build ett hakk høyere, får angriperen en straffe" +
            "terning; er den to hakk høyere, lar det seg ikke gjøre." }));
  }

  const defCard = el("div", { class: "flowcard" }, [
    el("p", { class: "eyebrow", text: "Blir angrepet" }),
    el("p", { class: "flowname", text: t.name }),
    el("p", { class: "entry-sub",
      text: ["HP " + t.hp + "/" + t.hpMax,
             armorValue(t) ? "rustning " + armorValue(t) : "ingen rustning",
             t.dodge ? "unnvik " + t.dodge + "%" : null,
             t.pulp ? "pulp-helt" : null].filter(Boolean).join(" · ") }),
  ]);

  // --- hvor treffer man? Polyppens tentakler kan hugges av.
  const pools = targetablePools(t);
  if (pools.length) {
    const partRow = el("div", { class: "respchips" });
    const partHint = el("p", { class: "entry-sub" });
    function drawParts() {
      partRow.innerHTML = "";
      const opts = [{ key: "body", label: t.name,
                      hint: "Skaden går på HP som vanlig." }]
        .concat(pools.map((a) => ({
          key: a.id,
          label: a.name + " (" + (poolLeft(t, a.id) || 0) + ")",
          hint: (a.house_note || a.description || ""),
        })));
      opts.forEach((o) => {
        const on = f.part === o.key;
        partRow.appendChild(el("button", {
          class: "chip resp" + (on ? " on" : ""), type: "button",
          "aria-pressed": String(on), text: o.label,
          onclick: () => { f.part = o.key; drawParts(); update(); },
        }));
      });
      const cur = opts.find((o) => o.key === f.part);
      partHint.textContent = cur ? cur.hint : "";
    }
    defCard.appendChild(el("p", { class: "eyebrow", text: "Treffer" }));
    defCard.appendChild(partRow);
    defCard.appendChild(partHint);
    drawParts();
  }

  // --- hva slags skade er dette? Bare interessant for dem som har
  //     regler for det — en polyp bryr seg, en gangster gjør ikke.
  if (damageRulesOf(t)) {
    const srcRow = el("div", { class: "respchips" });
    function drawSources() {
      srcRow.innerHTML = "";
      SOURCE_ORDER.forEach((k) => {
        const on = f.source === k;
        srcRow.appendChild(el("button", {
          class: "chip resp" + (on ? " on" : ""), type: "button",
          "aria-pressed": String(on), text: SOURCE_LABEL[k],
          onclick: () => { f.source = k; drawSources(); update(); },
        }));
      });
    }
    defCard.appendChild(el("p", { class: "eyebrow", text: "Skadetype" }));
    defCard.appendChild(srcRow);
    defCard.appendChild(el("p", { class: "caveat",
      text: damageRulesOf(t).note || "" }));
    drawSources();
  }

  defCard.appendChild(respRow);
  defCard.appendChild(respHint);
  defCard.appendChild(fbPick);
  defCard.appendChild(dBox);
  defCard.appendChild(dThresh);
  defCard.appendChild(penBox);
  defCard.appendChild(el("p", { class: "caveat", id: "penhint", hidden: true,
    text: "Dekningen holdt. Slå én tierterning til og skriv den inn — " +
          "angriperen bruker det verste av de to tier-resultatene." }));
  body.appendChild(defCard);

  body.appendChild(verdict);
  body.appendChild(dmgBox);

  drawResponses();
  update();
}

/* Svake punkter: noen skapninger kan bare drepes ett sted. Enten har
   hvert treff en fast sjanse for å finne punktet, eller så må selve
   treffslaget være lavt nok. Slaget gjøres én gang per utfall.    */
function applyWeakspot(out, aG) {
  const f = atkFlow;
  const spots = abilitiesOf(f.target).filter((a) => a.kind === "weakspot");
  if (!spots.length) return;
  spots.forEach((spot) => {
    let found = false;
    let how = "";
    if (spot.chance_of_skill) {
      const need = Math.floor(f.attackSkill * spot.chance_of_skill / 100);
      found = need > 0 && aG.roll <= need;
      how = "trengte " + need + " eller lavere, slo " + aG.roll;
    } else {
      if (!f.spotRolls) f.spotRolls = {};
      if (f.spotRolls[spot.id] === undefined) {
        f.spotRolls[spot.id] = 1 + Math.floor(Math.random() * 100);
      }
      const r = f.spotRolls[spot.id];
      found = r <= (spot.chance || 0);
      how = "slo " + r + " mot " + (spot.chance || 0) + " %";
    }
    if (found && spot.effect === "instant_death") {
      out.headline = spot.name.toUpperCase() + " — død på stedet";
      out.instantDeath = true;
      out.damage = null;
      out.conditions.push("Død");
      out.lines.push(spot.name + ": " + how + ". " + spot.description);
    } else {
      out.lines.push(spot.name + ": " + how + " — bommet på punktet.");
    }
  });
}

/* Skaden slås én gang per utfall. Uten dette ville tallet endret seg
   for hvert tastetrykk i feltene, og det ville sett ut som fusk.  */
function cachedDamage(who, attack, label, victim, force) {
  const f = atkFlow;
  if (!f.dmgCache) f.dmgCache = {};
  const key = [who.id, attack.name, label, victim.id].join("|");
  if (force || !f.dmgCache[key]) {
    f.dmgCache[key] = rollAttackDamage(who, attack, label);
  }
  return f.dmgCache[key];
}

/* Regn ut hva som skjer. Returnerer et objekt som både kan vises og
   brukes til å sette skaden.                                       */
function computeFlow(aG, dG) {
  const f = atkFlow;
  const out = { ready: false, lines: [], headline: "", tone: "",
                victim: null, damage: null, conditions: [], notes: [] };

  if (!aG) {
    out.headline = "Skriv inn angriperens slag.";
    return out;
  }

  // Feiler våpenet, er alt annet likegyldig.
  const mal = parseInt(f.attack.malfunction, 10);
  if (mal && aG.roll >= mal) {
    out.ready = true;
    out.tone = "bad";
    out.headline = "Våpenet svikter";
    out.lines.push(f.attack.name + " feiler på " + aG.roll +
                   " (feilgrense " + mal + "). Ingen skade. Våpenet må " +
                   "klargjøres på nytt — det tar en runde, eller et " +
                   "slag mot Mekanisk reparasjon om det har låst seg.");
    out.attackerCondition = "Våpen feilet";
    return out;
  }

  if (f.response !== "none" && !dG) {
    out.headline = "Skriv inn forsvarerens slag.";
    return out;
  }

  /* Dekningsdykk er ikke et motsatt slag. Unnvikelsen avgjør bare om
     angriperen får en straffeterning; treffer gjør skuddet hvis det
     lykkes mot sin egen vanskegrad. Og den som dykket, mister neste
     angrep uansett hvordan det gikk.                              */
  if (f.response === "dive") {
    if (f.penalised && !(parseInt(f.penTens, 10) >= 0)) {
      out.headline = "Skriv inn den ekstra tierterningen.";
      return out;
    }
    out.ready = true;
    out.victim = f.target;
    out.conditions.push("Mister neste angrep");
    if (f.penalised) {
      out.lines.push("Dekningen holdt: angriperen fikk én straffeterning, " +
                     "og slaget teller som " + f.effRoll + ".");
    } else {
      out.lines.push("Dekningen holdt ikke — ingen straffeterning.");
    }
    out.lines.push("Å dykke i dekning koster neste angrep, uansett om " +
                   "unnvikelsen gikk. Har figuren alt angrepet denne " +
                   "runden, mister den angrepet sitt neste runde. Fram " +
                   "til da kan den bare unnvike.");
    if (aG.rank > 0) {
      out.tone = "hit";
      out.headline = f.attacker.name + " treffer likevel";
      out.dmgFrom = f.attacker;
      out.dmgAttack = f.attack;
      out.dmgLabel = aG.label;
      out.damage = cachedDamage(f.attacker, f.attack, aG.label, f.target);
      applyWeakspot(out, aG);
    } else {
      out.tone = aG.rank < 0 ? "bad" : "miss";
      out.headline = aG.rank < 0
        ? f.attacker.name + " fumler" : f.target.name + " kommer seg unna";
      out.damage = null;
    }
    return out;
  }

  const opp = opposedOutcome(aG, f.response === "none" ? null : dG);
  out.ready = true;
  out.lines.push(opp.why);

  if (opp.winner === "attacker") {
    if (f.attack.manoeuvre) {
      out.tone = "hit";
      out.headline = "Manøveren lykkes";
      out.victim = f.target;
      if (f.knockout) {
        out.damage = { total: 1, detail: "knockout", impaled: false };
        out.noReroll = true;
        out.conditions.push("Bevisstløs");
        out.lines.push(f.target.name + " slås bevisstløs og tar 1 i skade.");
      } else {
        out.lines.push("Grepet, avvæpningen eller kastet går igjennom. " +
                       "Ingen skade — beskriv følgen og gi målet den " +
                       "tilstanden det gir.");
      }
      return out;
    }
    out.tone = "hit";
    out.victim = f.target;

    // Gikk slaget mot en tentakkel og ikke mot kroppen, river det
    // lemmet av i stedet for å gjøre skade på HP-en.
    if (f.part && f.part !== "body") {
      const ab = abilitiesOf(f.target).find((x) => x.id === f.part);
      const left = poolLeft(f.target, f.part) || 0;
      const part = ab ? (ab.unit_one || ab.name.toLowerCase()) : "del";
      out.headline = left
        ? f.attacker.name + " river av en " + part
        : "Ingen igjen å treffe";
      out.poolHit = left ? f.part : null;
      out.lines.push(left
        ? "Telleren går fra " + left + " til " + (left - 1) + ". " +
          "Ingen skade på HP."
        : "Det er ingen igjen av dem akkurat nå.");
      if (ab && ab.house_note) out.lines.push(ab.house_note);
      return out;
    }

    out.headline = f.attacker.name + " treffer";
    out.dmgFrom = f.attacker;
    out.dmgAttack = f.attack;
    out.dmgLabel = aG.label;
    out.damage = cachedDamage(f.attacker, f.attack, aG.label, f.target);
    applyWeakspot(out, aG);
    return out;
  }

  if (opp.winner === "defender") {
    if (f.response === "fightback") {
      out.tone = "hit";
      out.headline = f.target.name + " slår tilbake og treffer";
      out.victim = f.attacker;
      out.fightBack = true;
      if (f.defAttack) {
        out.dmgFrom = f.target;
        out.dmgAttack = f.defAttack;
        out.dmgLabel = dG.label;
        out.damage = cachedDamage(f.target, f.defAttack, dG.label, f.attacker);
        out.dmgSource = damageSourceOf(f.defAttack);
      } else {
        out.lines.push("Ingen angrep valgt for mot-slaget — skriv inn " +
                       "skaden for hånd.");
      }
      return out;
    }
    // Dekningsdykk er tatt hånd om over; her er det bare unnvikelse.
    out.tone = "miss";
    out.headline = f.target.name + " unnviker";
    out.lines.push("Angrepet treffer ikke.");
    return out;
  }

  if (opp.winner === "draw") {
    out.tone = "miss";
    out.headline = "Uavgjort — ingenting skjer";
    return out;
  }

  // Angriperen bommet eller fumlet.
  out.tone = aG.rank < 0 ? "bad" : "miss";
  out.headline = aG.rank < 0
    ? f.attacker.name + " fumler" : f.attacker.name + " bommer";
  if (aG.rank < 0) {
    out.lines.push("Fumle: du bestemmer følgen. Mistet våpen, tapt " +
                   "balanse, truffet en venn, eller åpen for neste " +
                   "angrep — velg noe som passer situasjonen.");
  }
  return out;
}

function renderVerdict(box, dmgBox, res) {
  box.innerHTML = "";
  dmgBox.innerHTML = "";
  if (!res) return;

  box.className = "verdict" + (res.tone ? " " + res.tone : "");
  box.appendChild(el("p", { class: "verdict-head", text: res.headline }));
  res.lines.forEach((l) => {
    box.appendChild(el("p", { class: "entry-sub", text: l }));
  });

  if (!res.damage || !res.victim) return;

  const victim = res.victim;
  const src = res.dmgSource || atkFlow.source;
