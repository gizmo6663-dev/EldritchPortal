nning og gå videre.\n\nRekkefølgen har mening. Suroda er en plage ingen savner. Hardaway er en plage alle savner litt. Phyllis er et godt menneske som hadde rett. Den femte skal Keeperen velge — og den skal være noen spillerne har brukt tid på. En av heltene er et fullt legitimt valg.\n\nAimesworthy som teller de forsvunne fordi ingen andre gjør det, er scenens beste øyeblikk. Spar det til etter at minst én spiller har vært grei mot ham."},{"id":"beat-soong-requests-help","title":"Dr. Soong ber om hjelp","act":"Akt 3 — Mønsteret","description":"Trenger heltene motivasjon, og Soong ikke allerede har oppsøkt dem om boka, gjør han det like etter Honolulu — vanligvis ved å be om deres selskap i en av røykesalongene eller i biblioteket på første klasse.\n\nSoong er bekymret for at noe ondt er på ferde, noe mer enn et enkelt selvmord eller drap. Han tror de forsvunne, dødsfallene og den stjålne boka henger sammen, og han kan godt bringe den underlige musikken på bane selv.\n\nTILBUDET. Han er for gammel og skrøpelig til å lete. Han sender sine tcho-tcho gjennom mellomdekket hvis heltene tar maskinrommet og lasterommene.\n\nMERK: Soong er en alliert og en kilde til Mythos-kunnskap, ikke et orakel. La ham ikke svare på alt eller redde dagen. Bruk ham til å peke — og, når heltene står fast, til å gi fra seg én nyttig opplysning som får dem i bevegelse igjen.","done":false,"connects_to":["npc-dr-soong","npc-tcho-tcho"],"dialogue":[{"who":"Dr. Soong","line":"«Jeg er over sytti år gammel, og jeg er ikke redd for å dø. Jeg er redd for hva som skjer med den boka hvis jeg dør før den er tilbake.»","source":"forslag","note":"Hans måte å be om hjelp uten å be om hjelp."},{"who":"Dr. Soong","line":"«Jeg sender mine folk ned på mellomdekket. De ser ting jeg ikke ser. De vil ikke ha selskap.»","source":"forslag","note":"Han tilbyr en arbeidsdeling, ikke en allianse."},{"who":"Dr. Soong","line":"«De spør hva som står i den. Jeg spør Dem hvorfor De vil vite det.»","source":"forslag","note":"Hans standardsvar når noen graver i Mythos-innholdet."}],"roleplay":"Dette er det nærmeste scenarioet kommer en oppdragsgiver, og boka advarer eksplisitt mot å la Soong svare på alt eller redde dagen.\n\nPraktisk regel: Soong svarer på ÉTT spørsmål per samtale, og bare hvis spørsmålet er godt. Resten er «Jeg vet ikke» eller et motspørsmål. Han er ikke hemmelighetsfull av vrangvilje — han vet at kunnskap om dette har kostet ham en kone og to sønner.\n\nStår gruppa fast, er han verktøyet ditt: da gir du dem ETT dytt i riktig retning gjennom ham, og så trekker han seg tilbake igjen. Bruk ham sparsomt, ellers blir scenarioet hans og ikke deres.\n\nFranz har Cthulhu Mythos 10. Det er nok til at Soong kjenner igjen noe i ham — og behandler ham annerledes enn de andre. Spill den forskjellen tydelig ved bordet. Det er en belønning Franz ikke visste han hadde."},{"id":"beat-distant-music","title":"Musikk i det fjerne","act":"Akt 3 — Mønsteret","description":"Fra 13. desember og utover.\n\nRyktene går om underlig musikk midt på natta. Ingen to passasjerer er enige om hvordan den låter: «en hjemsøkt opera», «en dødsmesse fra helvete». Ingen klarer å peke ut hvor den kommer fra. Spør man mannskapet, innrømmer de at de har hørt den de også. En matros kan tilby at det er sirenenes sang, som lokker sjøfolk i døden.\n\nSLAGENE. En helt som vandrer rundt på skipet sent på natta: LISTEN for å høre en fjern, dempet musikk — kirkeaktig, hjemsøkt, ualminnelig tungsindig. Musikkrommet står tomt. HARD LISTEN plasserer lyden under dekk.\n\nDEN BLIR STERKERE. Skapningen prøvekjører maskinen nede i lasterom 7, og for hvert nytt offer blir lyden høyere og klarere. Bygg det opp: begynn med annenhåndshint og drømmer («Jeg hadde en underlig drøm, full av ujordisk musikk»), og la beretningene bli tettere for hver dag som går, helt til heltene hører den selv.","done":false,"connects_to":["loc-hold-7","clue-music-below-decks"],"dialogue":[{"who":"En førsteklasses passasjer","line":"«En hjemsøkt opera. Det er det eneste jeg kan sammenligne det med.»","source":"bok"},{"who":"En annen passasjer","line":"«En dødsmesse fra helvete. Jeg lyver ikke.»","source":"bok"},{"who":"En passasjer ved frokosten","line":"«Jeg hadde en underlig drøm. Full av musikk som ikke var av denne verden.»","source":"bok","note":"Det første hintet, dager før noen hører det våkne."},{"who":"Phyllis Barnes","line":"«Jeg kjenner hvert instrument som finnes om bord på dette skipet. Dette er ikke ett av dem.»","source":"forslag","note":"Hun er musikklærer. Hun er den eneste som kan si noe presist om lyden — og hun går for å finne den. Det dreper henne."}],"roleplay":"Musikken er scenarioets tikking, og den skal bygges over flere dager før noen hører den selv.\n\nDag 13: andrehåndsberetninger ved frokosten. Ingen to stemmer overens. La spillerne høre tre ulike beskrivelser av det samme, fra folk som ikke snakker med hverandre.\n\nDag 14: den høres over hele skipet om natta. Listen-slag fanger den opp; et Hard Listen plasserer den under dekk. Musikkrommet står tomt — sjekk det, for spillerne kommer til å gjøre det.\n\nBeskriv den aldri to ganger likt. Én natt er den et orgel. Neste natt er den et kor. Den tredje er den noe som puster i takt. Det er ikke uklarhet for uklarhetens skyld: hver gang et nytt offer lades inn i maskinen, blir lyden klarere og mer feil.\n\nFranz har Night Vision og Stealth 60. Han er den naturlige til å gå nedover mot lyden om natta. La ham gjøre det alene én gang, og la ham komme tilbake med noe de andre ikke kan bekrefte."},{"id":"beat-meeting-the-captain","title":"Møtet med kapteinen","act":"Akt 3 — Mønsteret","description":"Før eller siden blir den som gjør seg bemerket, konfrontert av kaptein Henry Nelson — heltene har tross alt vært å se rundt de fleste åstedene. Han avhører dem enkeltvis eller i små grupper. Hold avhørene korte og direkte.\n\nNelson har ingen grunn til å stole på dem, og en situasjon om bord som blir mørkere for hver dag. Han har Psychology 70 % og Fast Talk 95 %: helter som prøver å lure ham med tvilsomme opplysninger, kan oppdage at stuertene diskré følger etter dem.\n\nKONSEKVENSER. Den som allerede er mistenkt — viftet med våpen, slåss, luskerundt der de ikke skal være — kan finne lugaren gjennomsøkt mens de selv blir avhørt. Helter som går til angrep på folk uten grunn, kan bli holdt i lugaren sin til de gjør ordentlig rede for seg.\n\nGEVINSTEN. Overbevis ham om de gode hensiktene — Charm eller Persuade på Hard — og de vinner tilliten hans. Særlig innsiktsfulle og hederlige helter kan bli utnevnt til å hjelpe med å løse mysteriet før Shanghai, noe som åpner lasterommene og maskinrommet på lovlig vis.","done":false,"connects_to":["npc-captain-nelson"],"dialogue":[{"who":"Kaptein Nelson","line":"«God aften. Jeg håper De nyter reisen?»","source":"bok","note":"Alltid slik han begynner. Også når det ikke er en hyggelig samtale."},{"who":"Kaptein Nelson","line":"«Hva i helvete er det som foregår her!»","source":"bok","note":"Når han har mistet tålmodigheten, og det skjer bare én gang."},{"who":"Kaptein Nelson","line":"«De har vært til stede på tre av fire steder der noe har gått galt. Forklar meg det, og gjør det kort.»","source":"forslag","note":"Avhørene er raske og direkte. Han har ikke tid til historier."},{"who":"Kaptein Nelson","line":"«Jeg spilte poker i tjuefem år før jeg fikk dette skipet. Jeg vet når noen bløffer. Prøv igjen.»","source":"forslag","note":"Psychology 70 %, Fast Talk 95 %. Han er bedre på dette enn noen av heltene."}],"roleplay":"Nelson er ikke en hindring. Han er en dyktig mann som gjør jobben sin, og det er nettopp derfor han er farlig for gruppa.\n\nHan har Psychology 70 og Fast Talk 95. Prøver noen å lure ham med Fast Talk og lettvinte fakta, kjøper han det ikke — og de blir diskré fulgt av stuerter resten av turen. Lugaren deres blir gjennomsøkt mens de sitter i avhør.\n\nAvhørene skal være korte. To–tre spørsmål per helt, enkeltvis eller i små grupper. Still dem raskt, avbryt lange svar, og gå videre. Det gjør ham mer skremmende enn en lang scene ville gjort.\n\nSannheten er et reelt valg her. Forteller de alt, tror han dem ikke — men han noterer, og han er en mann som revurderer når fakta endrer seg. Lyver de godt nok, slipper de unna nå og har en fiende senere.\n\nHar de blitt venn med Astor, legger Astor inn et godt ord. Det er den konkrete uttellingen for å ha spilt den ubehagelige middagsscenen tidligere, og den bør merkes."},{"id":"beat-searching-the-ship","title":"Å gjennomsøke skipet","act":"Akt 3 — Mønsteret","description":"Sporene fører ned under tredjeklassedekket: til maskinrommet midtskips, eller til lasterommene i de nederste dekkene, som nås fra en gang langs kjølen og fra fire forseglede lasteluker på tredjeklassedekket.\n\nÅ KOMME SEG NED. Uten kapteinens tillatelse er dette ulovlig ferdsel, og kan skaffe heltene alvorlig trøbbel. Passasjerer har ikke lov til å vandre rundt i lasterommene uten god grunn, og er blankt forbudt adgang til maskinrommet uten følge. Å komme forbi vaktholdet — andrestyrmann Gustav Knutsen om dagen, junioringeniør Barry O'Rourke om natta — krever Stealth, bestikkelse (Charm, Psychology eller Persuade) eller Fast Talk.\n\nLUKENE. Vanntette, ment å stanse vanninntrengning, og praktisk talt umulige å tvinge opp: Extreme STR, eller Hard STR med brekkjern. Å dirke opp låsene krever Locksmith.\n\nROTTESKINNET. SPOT HIDDEN nede i lasterommene: et rotteskinn, helt og mykt. Alt kjøtt og alle organer borte fra innsiden av skinnet, som er perfekt garvet og bløtt å ta på. Ingen hull eller sår ut over de naturlige. Små knokler rasler inni. Science (Biology eller Zoology) eller Art/Craft (Leatherwork) vet at det er umulig å flå et dyr på denne måten, og at et råtnet dyr ville gitt stivt eller råttent skinn. Det ser ut som det er spist opp innenfra.\n\nTRAPP DET OPP. Dette er skapningen som spiser — insektformen etterlater bare skinn, hår og knokkelbiter. Plant stadig større funn utover reisen: en kjælehund, så skinnet av en blindpassasjer. Be om Sanity rolls der det passer.\n\nBAKHOLDSLAND. Lasterommene og bunnrommet er ideelle for Bates, et tilkalt monster, eller en formel ut av mørket.","done":false,"connects_to":["clue-rat-pelt","loc-bilges","loc-boilers","loc-hold-1","loc-hold-7"],"dialogue":[{"who":"James Hawthorne, kenneljente","line":"«Krypene. De kommer og de går. De marsjerer, som en hær.»","source":"bok","note":"Mumler. Vanskelig å forstå. Krever at noen roer vedkommende ned, eller et Psychoanalysis-slag."},{"who":"James Hawthorne","line":"«Jeg hører dem. Om natta. De er på vei for å spise meg.»","source":"bok","note":"Skriker og løper inn i kroken sin ved synet av en edderkopp eller en kakerlakk."},{"who":"En matros","line":"«Lasterom fire? Nei, sir. Ikke alene. Spør noen andre.»","source":"forslag","note":"Overtroen om han som falt i 1929 — se taktikkortet."}],"roleplay":"Hawthorne er scenarioets tristeste scene, og den skal spilles som en omsorgsscene og ikke som et avhør.\n\nKenneljenta på sytten har sett skapningen løse seg opp i et lasterom, og det har gjort henne varig gal. Hun er skvetten, øynene søker langs gulvet hele tiden, og hun mumler. Psychology sier at hun er dypt redd og sannsynligvis gal.\n\nDet koster TID å få noe ut av henne — tid brukt på å roe henne ned, eller et Psychoanalysis-slag. Gruppa har ingen med Psychoanalysis. Da er det tiden som gjelder, og det er en god ting: la dem sitte der i en time med spillets ur gående.\n\nDet hun sier er sant, og det høres ut som galskap. Det er hele poenget.\n\nVIKTIG: kommer gruppa seg ikke ned i lasterommene før sent i turen, er Hawthorne borte — tatt av Bates og ofret til pipene. La dem finne kroken hennes tom, med tegninger på veggen. Det er en straff de har fortjent, og den svir mer enn et monster."},{"id":"beat-the-tcho-tcho","title":"Tcho-tcho","act":"Akt 3 — Mønsteret","description":"JOBBEN DERES ER Å VÆRE FEIL SVAR. Tcho-tcho-ene og gjelden deres til dr. Soong er et blindspor, som skal lede mistenksomme helter til feil konklusjon. Spilt rett fram er de nøytrale til det som skjer, og kan til og med hjelpe via Soong.\n\nVIL DU HA DEM STYGGE, skifter de side fra Soong til skapningen underveis, og gir den et lag håndlangere til avledning, tyveri eller drap.\n\nTØNNENE. Tcho-tcho skal etter sigende være kannibaler, og de femti tønnene i lasterom 6 merket «Hawaiian Botanical Specimens» kan i virkeligheten inneholde menneskelik. Helter som vaker i lasterom 6 eller følger tcho-tcho-ene til et hemmelig møte, ser en tønne bli åpnet og innholdet kokt og spist: Sanity roll (1/1D4).\n\nAVTALEN. Heltene kan få se «Chad Peterson» møte tcho-tcho-ene i lasterom 6 og tilby dem en avtale — «beskyttelse, og alt kjøttet dere kan spise». Det kan gå begge veier:\n\n• DE TAKKER JA og heltene griper inn: Peterson stikker av ved første tegn til bråk, mens de nye allierte angriper. Trengt opp i et hjørne oppløses han i tusen insekter og slipper unna i en bølge av krypende ting som skyller over heltene for 1D4 skade. Å se forvandlingen: Sanity roll (1D3/2D6).\n\n• DE TAKKER NEI: skapningen tilkaller øyeblikkelig en hunting horror for å drepe dem alle. Holder heltene seg unna, dør tcho-tcho-ene. Driver de vekk eller dreper monsteret, er de overlevende takknemlige — og er det bare én igjen, bukker han og erklærer «Sheng Tsin, Deres tjener nå og alltid», i den tro at han skylder dem livet sitt. Sheng Tsin tjener som assistent, kokk og tolk, og kan bli en erstatningskarakter.","done":false,"connects_to":["npc-tcho-tcho","npc-hunting-horror","loc-hold-6"],"dialogue":[{"who":"«Chad Peterson» til tcho-tcho-ene","line":"«Beskyttelse, og alt kjøttet dere klarer å spise.»","source":"bok","note":"Skapningens tilbud, overhørt fra mørket i lasterom 6."},{"who":"Sheng Tsin, siste overlevende","line":"«Sheng Tsin. Deres tjener nå og alltid.»","source":"bok","note":"Bukker. Hvis heltene driver bort eller dreper hunting horror-en, og bare én tcho-tcho er igjen."},{"who":"Lo Mai","line":"«Vi tjener doktoren. Vi har en gjeld. Det er alt De trenger å vite.»","source":"forslag","note":"Hvis noen spør hvorfor de følger Soong."},{"who":"«Chad Peterson», avslørt","line":"Ingenting. Skapningen kan ikke lage lyd i sin egen skikkelse — den kommuniserer skriftlig.","source":"bok","note":"Et vesentlig poeng: i det øyeblikket masken ryker, blir den stum."}],"roleplay":"Denne scenen har to helt ulike utfall, og begge er gode. Ikke bestem på forhånd — la spillerne tippe vekta.\n\nFørst: la dem se på. Tcho-tcho-ene åpner ei tønne merket «Hawaiian Botanical Specimens» og koker innholdet. Sanity-slag (1/1D4). Så kommer «Peterson» ned leideren og framsetter tilbudet sitt.\n\nHVIS TCHO-TCHO-ENE SIER JA og heltene bryter inn: «Peterson» flykter ved første tegn til trøbbel, sannsynligvis mens de nye allierte angriper. Trenges den opp i et hjørne, faller den fra hverandre til tusen insekter — 1D4 skade til alle rundt, og Sanity-slag (1D3/2D6) for å se det.\n\nHVIS DE SIER NEI: skapningen tilkaller en hunting horror på stedet for å drepe dem alle. Griper ikke heltene inn, dør alle tcho-tcho-ene. Gjør de det, får de Sheng Tsin — en livsgjeld, en tolk, en kokk, og en mulig erstatningskarakter.\n\nSpill tcho-tcho-ene som folk, ikke som monstre. De veier et tilbud fra en fremmed mot en gjeld til en gammel mann. At de kanskje er kannibaler, er noe spillerne får vite i samme scene — la de to tingene ligge ved siden av hverandre uten å løse dem opp."},{"id":"beat-bunny-takes-a-hostage","title":"Bunny tar en gissel","act":"Akt 4 — Klimaks","description":"Lørdag 19. desember, spisesalen på første klasse.\n\nBates går inn og tar den første han ser som gissel — en bakgrunnsfigur, noen heltene kjenner, eller en av heltene selv. Han skriker om stemmene i hodet og hvordan de fikk ham til det. Han krever å bli sluppet av båten øyeblikkelig, ellers dreper han gisselet. Han er åpenbart morderisk og forstyrret.\n\nLØSNING: makt, eller kløktig forhandling — en Extreme Persuade eller Fast Talk roll, eller en Hard Psychoanalysis roll.\n\nSpill scenen til ende, med Bates død eller tatt. Dette er en avledning, og den virker: holder heltene seg opptatt her lenge nok, er det første de får vite om den store prøven en enorm malstrøm som åpner seg i havet.\n\nSANITY-BELØNNING: hindrer heltene Bates i å drepe gisselet, +1D6.","done":false,"connects_to":["npc-bunny-bates","beat-the-final-test"],"dialogue":[{"who":"Bunny Bates","line":"«Stemmene! De sa jeg måtte! De sa det, og jeg gjorde det!»","source":"bok","note":"Skriker det ut over spisesalen på første klasse, med en arm om halsen på den første han fikk tak i."},{"who":"Bunny Bates","line":"«Slipp meg av båten. NÅ. Ellers dreper jeg henne, jeg sverger på at jeg gjør det.»","source":"bok","note":"Han mener det. Han er utvilsomt drapslysten og fra forstanden."},{"who":"Bunny Bates","line":"«Jeg skriftet. Jeg skriftet til presten og det hjalp ikke. Ingenting hjelper.»","source":"forslag","note":"Til en helt som prøver å nå inn til ham — og et hint om hvor åpningen ligger."},{"who":"Kaptein Nelson","line":"«Ingen skyter i min spisesal. Ingen.»","source":"forslag","note":"Han står i døra og mener det, uansett hva som står på spill."}],"roleplay":"Dette er en avledning, og spillerne vet det ikke. Det gjør den til scenarioets vondeste valg: hvert minutt brukt på Bates, er et minutt skapningen spiller på pipene.\n\nLa scenen ta tid. Beskriv salen: hvite duker, syvretters, seks hundre mennesker som ikke vet hva de skal gjøre med hendene sine. Gisselet skal helst være noen de kjenner — Virginia, Aimesworthy, eller en av heltene.\n\nHan kan tas med MAKT eller med KLØKT. Kløkt er et Extreme Persuade eller Fast Talk, eller et Hard Psychoanalysis. Det er harde slag, og gruppa har Persuade 50 på to personer — Extreme er 10. La dem vite at det finnes, uten å love at det går.\n\nMAKT er lettere og koster mer. Dagrun med hagle på DEX 99 har skuddet. Beefcake kan ta ham med et grep hvis han kommer nær nok. Men Bates er et menneske, han er et offer, og han har nettopp skriftet. Sørg for at det står klart for bordet FØR de bestemmer seg.\n\nUansett utfall: i det øyeblikket det er over, roper noen fra dekket. Havet åpner seg."},{"id":"beat-the-final-test","title":"Den store prøven","act":"Akt 4 — Klimaks","description":"Lørdag 19. desember, lasterom 7.\n\nMaskinen kombinerer blodet fra ofrene med de umenneskelige harmoniene i Mythos-fortryllede piper stemt til ujordiske frekvenser. Så snart skapningen begynner å spille, trekker harmoniene til seg vesener fra Mythos — og påvirker alle innenfor 30 meter som formelen Pipes of Madness. Etter noen øyeblikk spiller maskinen seg selv.\n\nDEN VIRKER IKKE. Innretningen sender ut bølger av energi og musikk som drar til seg vesener fra Mythos, men den verken fanger eller holder på dem. I stedet for en brønn av stjålet kraft har skapningen bygd en maskin som gjør alt som hører den rasende — og forteller det nøyaktig hvor det skal komme.\n\nPOLYPPEN. Ikke lenge etter at spillingen starter, tilkalles en flying polyp fra havbunnen. Idet den stiger, åpner det seg en veldig malstrøm; skipet gjør et krengende utfall, og passasjerer og mannskap får panikk. Så kaster den seg mot skroget. Den bruker TI RUNDER på å rive seg gjennom til lasterom 7, hvis ikke heltene stanser den.\n\nSKURKEN STIKKER AV. Skapningen innser faren og forsøker å kaste en Gate til Shanghai, hvis den ikke blir stanset. I hastverket lar den maskinen stå og spille.\n\nNÅR POLYPPEN NÅR LASTEROM 7, bruker den vindstøtet sitt til å blåse pipene fra hverandre — sammen med skapningen og alle andre i nærheten (5D6 skade). Med musikken stanset kan den synke tilbake i havet og slenge en veldig bølge mot skipet. Eller la den bli noen runder, hvis heltene vil slåss.\n\nSKIPET DØR. Skadene er enorme. Hullet i skroget betyr at Coolidge tar inn vann og krenger. Det går ikke lang tid. Spør heltene rett ut: løper de til livbåtene og tenker bare på seg selv, eller organiserer de seg, finner innesperrede passasjerer og får kvinner og barn i båtene? Spill det ut — Sanity-belønningene til slutt avhenger av det.","done":false,"connects_to":["npc-flying-polyp","npc-crawling-one","loc-hold-7","ref-dealing-with-the-polyp"],"dialogue":[{"who":"En passasjer på promenadedekket","line":"«Vannet. Se på vannet.»","source":"forslag","note":"Det første noen sier. Havet trekker seg ned i en trakt bredere enn skipet er langt."},{"who":"Kaptein Nelson over høyttaleren","line":"«Alle mann til livbåtstasjonene. Dette er ikke en øvelse. Alle mann til livbåtstasjonene.»","source":"forslag","note":"Stemmen er rolig hele veien igjennom. Det er verre."},{"who":"Dr. Soong","line":"«Stopp musikken. Ikke drep den — stopp musikken. Den vil dra hjem igjen.»","source":"forslag","note":"Om han fortsatt lever. Den viktigste opplysningen i hele finalen, gitt av en mann som knapt kan stå."},{"who":"Pater Alvarez","line":"«Jeg har lest om noe slikt. Jeg trodde det var en lignelse.»","source":"forslag","note":"Hvis han er i live og til stede. Han vet nok til å ha mareritt, og ikke nok til å hjelpe."}],"roleplay":"Tre utveier, og spillerne må finne minst én av dem selv:\n  1. ØDELEGG PIPENE (50 HP, 3 rustning). Polyppen snur og drar tilbake dit den kom fra.\n  2. BIND POLYPPEN med Bind Flying Polyp — krever formelen, og et motsatt slag mot POW 80.\n  3. SLÅSS. Rustning 4, og bare minste mulige skade fra fysiske våpen. Dette er den dårligste utveien, og gruppa kommer til å prøve den først.\n\nPolyppen bruker TI RUNDER på å rive seg gjennom skroget ned til lasterom 7. Det er klokka di, og den skal være synlig: tell den ned høyt. «Sju runder igjen.» «Fem.»\n\nAlle om bord slår Sanity (1D3/1D20). Beefcake og Walther har SAN 45 — regn med at minst én av dem knekker midt i finalen. Ha en plan for hva en midlertidig gal Beefcake gjør i et rom fullt av folk.\n\nIkke la dette bli et rent kampoppgjør. Alt som gjør scenen til noe mer enn treffslag, gjør den bedre: folk i vannet, en livbåt som henger skjevt, en dør som er kilt fast med seksti mennesker bak. Se kampjusteringskortene — særlig «Gi kampen en klokke» og «La rommet ta skade».\n\nCoolidge går nesten helt sikkert ned. La spillerne kjempe for hvem som kommer i båtene, ikke for om skipet overlever."},{"id":"beat-conclusion","title":"Slutten","act":"Akt 4 — Klimaks","description":"Scenarioet ender etter alt å dømme med at SS President Coolidge synker et sted utenfor kysten av Japan eller Kina, og at skapningen og dens mislykkede Pipes of Leng er ødelagt — trolig av polyppen, muligens av heltene.\n\nOverlevende blir plukket opp i løpet av noen timer, og det stilles svært mange spørsmål. Etter hvert skriver avisene om en monsterbølge som senket skipet. De som overlevde, vet bedre.\n\nSLIPPER SKAPNINGEN UNNA GJENNOM EN GATE, ankommer den Shanghai og slutter seg til Eight Fortunes Mutual Aid Society, en Mythos-kult med forgreininger over hele Kina. I månedene og årene som følger, planlegger den hevn over alle som hadde en finger med i fallet — en ferdiglaget gjenganger av en skurk, som kommer og leter etter heltene.\n\nSANITY-BELØNNINGER:\n+1D6  Heltene hindrer Bates i å drepe gisselet\n+1D4  Heltene ødelegger energiinnretningen\n+2D6  Heltene fanger eller dreper skapningen\n−1D6  Skapningen slipper unna\n+1D20 Heltene beseirer polyppen\n+1D10 Heltene prøver å redde så mange som mulig fra å drukne\n−1D10+2 Heltene forlater skipet uten tanke for andre","done":false,"connects_to":["ref-sanity-awards"],"dialogue":[{"who":"En overlevende i livbåten","line":"«Hva var det? Bare si meg hva det var.»","source":"forslag","note":"Ingen har et svar som hjelper."},{"who":"En journalist i Honolulu eller Shanghai","line":"«Kilder om bord beskriver en monsterbølge. Rederiet avviser alle spørsmål.»","source":"forslag","note":"Slik verden forklarer det. Det står i avisene innen en uke."},{"who":"Sheng Tsin","line":"«Deres tjener nå og alltid.»","source":"bok","note":"Om han lever, følger han dem videre. Han mener det bokstavelig."},{"who":"Skapningen, skriftlig","line":"Et telegram uten avsender, levert på hotellet i Shanghai. Én setning, skrevet med en hånd som ikke er en hånd.","source":"forslag","note":"Om den slapp unna med en Gate. Den kan ikke snakke — men den kan skrive, og den husker navn."}],"roleplay":"Gi hver spiller ett spørsmål å svare på i båten, før du sier noe om hva som skjer videre:\n  • Hva tok du med deg?\n  • Hvem så du sist?\n  • Hva kommer du til å si når noen spør?\n\nSvarene deres er epilogen. Du trenger ikke skrive den.\n\nOverlevende plukkes opp i løpet av noen timer. Avisene skriver om en monsterbølge, og rederiet avviser alt. Ingen av heltene blir trodd, og det er riktig slik — det er prisen for å ha vært der.\n\nSlapp skapningen unna gjennom en Gate til Shanghai, slutter den seg til Eight Fortunes Mutual Aid Society, og den har et regnskap å gjøre opp. Den kan ikke snakke. Den kan skrive. Et telegram uten avsender er en perfekt siste scene, og en perfekt første scene i neste scenario."}],"clues":[{"id":"clue-organ-grate-crate","title":"Et 50-pipers orgel fra Portland","where":"Pier 42 under lasting / lasterom 7","description":"En diger kasse merket «Wm. Wood Pipe Organ Co., Inc. of Portland, Oregon». Ingen om bord har bestilt et orgel; skipet har allerede instrumenter i musikkrommet. Kassa skal til lasterom 7, som er dobbeltlåst.","found":false,"connects_to":["loc-hold-7"]},{"id":"clue-organ-crate","title":"Orgelkassa er åpnet mange ganger","where":"Lasterom 7","description":"Skruene som holder sidepanelet på venstre side, er skrudd ut og inn igjen gang på gang. Noen kommer seg inn i den — ofte.","found":false,"roll":"Spot Hidden","connects_to":["loc-hold-7","clue-blood-on-the-crate"]},{"id":"clue-blood-on-the-crate","title":"Blod på panelet","where":"Lasterom 7","description":"Blodflekker på trepanelet på venstre side av orgelkassa — søl fra ofrene som helles ned i pipene. Tørt eller ferskt, alt etter hvor sent heltene kommer hit.","found":false,"roll":"Hard Spot Hidden uten lyskilde; vanlig vanskegrad med lys","connects_to":["loc-hold-7"]},{"id":"clue-green-metal-box","title":"Den grønne metallkassa","where":"Pier 42 under lasting / lasterom 7","description":"En to meter høy grønn metallkasse, levert på kaia under væpnet vakt og stuet i lasterom 7. Låst: Hard Locksmith, eller Hard STR for å bryte den opp. Inni ligger ingeniørtegninger for energiinnretningen, sammen med notater om montering, materialer, kostnader og konstruksjon — dekket av håndskrevne okkulte symboler.","found":false,"roll":"Mechanical Repair eller Science (Engineering) for å kjenne igjen konstruksjonstegninger; Cthulhu Mythos pluss to timers studium for å forstå at innretningen skal tilkalle vesener fra hinsides stjernene for å fange essensen deres","connects_to":["loc-hold-7"]},{"id":"clue-funeral-supplies","title":"Kassa merket «Funeral Supplies»","where":"Pier 42 under lasting / lasterom 6","description":"En stor kasse merket «Funeral Supplies». Den inneholder liket av en tcho-tcho som døde i San Francisco, og som sendes hjem på dr. Soongs regning. Et blindspor — men et godt et.","found":false,"roll":"Spot Hidden","connects_to":["loc-hold-6","npc-tcho-tcho"]},{"id":"clue-empty-clothes","title":"De tomme klærne","where":"Petersons lugar, A-dekk","description":"Sokker og sko på gulvet foran en stol; dress, vest, skjorte og undertrøye tredd inn i hverandre som en russisk dukke. En underlig, vond lukt. Som om kroppen inni hadde smeltet bort uten å forstyrre en eneste fold.","found":false,"connects_to":["beat-the-empty-suit"]},{"id":"clue-suicide-note-wrong","title":"Brevet stemmer ikke","where":"Petersons lugar (tatt som bevis samme kveld)","description":"Brevet passer dårlig med Petersons lettlivede fasade og røffe liv. Håndskriften stemmer rimelig godt — men han skrev alltid «Charles Chadwick Peterson», «Charles Peterson» eller «C. C. P.». Aldri bare «Chad». Uttrykket «hollow millionaire» sikter til arvinger som ble ruinert i krakket i 1929; Petersons familie kom stort sett helskinnet gjennom, så det er ikke engang sant.","found":false,"roll":"Art/Craft (Calligraphy eller lignende) eller Hard Spot Hidden for å se forskjellene mot en kjent skriftprøve — som kan skaffes fra Virginia Ridley, eller ved å vise brevet til Charles Astor","connects_to":["handout-suicide-note","npc-virginia-ridley"]},{"id":"clue-hallanders-lie","title":"Hallanders historie holder ikke","where":"Korridoren på første klasse, A-dekk","description":"Han sier han hørte en lyd og kom inn gjennom en ulåst dør. Det var ingen lyd, og døra var låst — han dirket den opp for å rane lugaren, og fant stolen kokende av kakerlakker.","found":false,"roll":"Psychology for å se at han er i sjokk; Intimidate eller Persuade for å få ham til å snakke; en ny Psychology for å avsløre løgnene","connects_to":["npc-albert-hallander"]},{"id":"clue-manifest-gap","title":"Almacan står ikke på passasjerlisten","where":"Forvalterens kontor","description":"Señor Guiterrez de Almacan finnes ingen steder blant de betalende passasjerene — ikke på første klasse, ikke noe sted. Det var dette som kostet overproviantforvalter Dungass livet.","found":false,"roll":"Hard Persuade for å få se passasjerlisten","connects_to":["npc-almacan","npc-martin-dungass"]},{"id":"clue-peterson-walking","title":"Peterson er sett etter at han døde","where":"Hvor som helst om bord","description":"Dr. Soong så Chad Peterson gå ut av lugaren sin rundt kl. 06.00 søndag 6. desember — etter det antatte selvmordet. Phyllis Barnes har sett ham flere ganger og kaller selvmordet «sludder». Hun nevner også at hun kom godt overens med ham første kvelden, men at han neste morgen ikke ante hvem hun var.","found":false,"connects_to":["npc-dr-soong","npc-phyllis-barnes"]},{"id":"clue-virginias-unease","title":"Virginias kvinneintuisjon","where":"Virginia Ridley, første klasse","description":"Hun så Chad i korridoren rundt kl. 21.30 den 5. desember, etter middagen. Noe ved ham plaget henne — gangen hans, eller klærne; han virket fortvilet eller ulykkelig. Hun avfeier det som ren intuisjon, og er ivrig etter å fortelle det til alle som spør. Hun har også fått et ekte brev fra ham samme morgen: «Virginia, hver dag vet jeg at jeg tok det rette valget. Bli med meg til sjøs! Din kjære Chad.»","found":false,"connects_to":["npc-virginia-ridley","clue-suicide-note-wrong"]},{"id":"clue-rat-pelt","title":"Den hule rotta","where":"Lasterommene","description":"Et rotteskinn, helt og mykt, perfekt garvet, uten hull eller sår ut over de naturlige. Alt kjøtt og alle organer borte; små knokler rasler inni. Det ser ut som det er spist opp innenfra.","found":false,"roll":"Spot Hidden for å finne det; Science (Biology eller Zoology) eller Art/Craft (Leatherwork) for å vite at det er umulig å flå et dyr slik","connects_to":["beat-searching-the-ship","npc-crawling-one"]},{"id":"clue-music-below-decks","title":"Musikken kommer nedenfra","where":"Hvor som helst om bord, sent på natta","description":"Fjern, dempet, kirkeaktig musikk — hjemsøkt og ualminnelig tungsindig. Musikkrommet står tomt. Den blir høyere og klarere for hvert offer.","found":false,"roll":"Listen for å høre den; Hard Listen for å plassere den på de nederste dekkene","connects_to":["beat-distant-music","loc-hold-7"]},{"id":"clue-kennel-boy","title":"Kenneljenta har sett noe","where":"Lasterom 5","description":"James Hawthorne, 17 år, er skvetten, mumlende, med blikket stadig søkende langs gulvet. Han skriker og stikker inn i hiet sitt så snart han ser en edderkopp eller en kakerlakk. Beroliget snakker han om «krypene» — han har sett dem komme og gå, marsjere som en hær, og han hører dem pile rundt inne i skipet. Han er sikker på at de kommer for å spise ham. Han så skapningen oppløse seg, og det har gjort ham ubotelig gal.","found":false,"roll":"Psychology for å se at han er livredd og trolig gal; tid brukt på å roe ham, eller Psychoanalysis, for å forstå hva han sier","connects_to":["loc-hold-5","npc-james-hawthorne"]},{"id":"clue-ballast-tank","title":"Liket i ballasttanken","where":"Lasterom 4","description":"Phyllis Barnes, i forråtnelse i en ballasttank. Å åpne den øvre luka slipper ut en sky av avskyelig gass.","found":false,"roll":"CON roll eller kast opp av stanken; Sanity roll 0/1D2 når liket oppdages","connects_to":["loc-hold-4","npc-phyllis-barnes"]},{"id":"clue-cold-fire","title":"Det kalde bålet i baugrommet","where":"Lasterom 1","description":"Restene av et lite bål laget av oppbrukne kasser, minst et døgn gammelt. Asken er kald og inneholder forkullede beinbiter — restene av et improvisert tcho-tcho-måltid. I nærheten: den utbrente asken fra en opiumspipe.","found":false,"roll":"Spot Hidden for å finne begge deler; Know eller Science (Chemistry eller Pharmacy) for å kjenne igjen opiumen","connects_to":["loc-hold-1","npc-tcho-tcho"]},{"id":"clue-bates-confession","title":"Bates' skriftemål","where":"Kapellet, 17. desember","description":"Bates skrifter for pater Alvarez — eller for en helt som er prest — og tilstår tyveriet av Soongs bok, drapet på Wang Ma, og enhver annen forbrytelse om bord han kommer på. Han tror han er i ferd med å bli gal, og snakker om «stemmer» som «fikk ham til det». Historiene hans stemmer ikke med hverandre, og tilstanden hans forverres synlig. Etterpå flykter han og blir dominert på nytt.","found":false,"connects_to":["npc-bunny-bates","npc-father-alvarez"]},{"id":"clue-consume-likeness-pattern","title":"Mønsteret i ansiktene","where":"Keeperens spor — for helter som setter det sammen","description":"Hver eneste umulige observasjon er en person som nylig har dødd eller forsvunnet. Dungass forsvinner og blir aldri funnet. Peterson dør og blir stadig sett. En adelsmann som ikke står på noen liste, dukker opp fra ingensteds. Ett vesen bærer dem alle — og det trenger 48 timer i en ny skikkelse før det kan snakke. Det var derfor «Peterson» ikke kunne svare sin egen forlovede, og måtte forlate skikkelsen.","found":false,"roll":"Cthulhu Mythos, eller rett og slett godt detektivarbeid","connects_to":["npc-crawling-one"]}],"npcs":[{"id":"npc-crawling-one","name":"The Crawling One","category":"Antagonist","role":"Luis Fernando de la Montoyo — skurken","description":"En menneskeformet masse av levende mark, kakerlakker, skorpioner og gravutøy, i kappe og hette. I live var han mester for en kult viet Azathoth, magisk forlenget inn i den spanske erobringen, og hengt av guvernøren i Sonora — hvorpå bevisstheten hans gikk over i utøyet som fortærte liket. Den er ikke udød: tingene som utgjør kroppen, lever. Sår som dreper enkelte kakerlakker er bare til bry, mens svermen avler nye.","stats":{"STR":"6","CON":"14","SIZ":"13","DEX":"7","INT":"13","POW":"100","HP":"13","MP":"20","DB":"+0","Move":"8","Armor":"se Spesielt"},"combat":["Angriper med det den har for hånden — treffsjanse og skade som våpenet tilsier","Svak i nærkamp — den foretrekker formler og lar håndlangerne ta det jordnære","Kan bytte mellom alle sine menneskeskikkelser i løpet av én kamprunde"],"skills":"Occult 90 %, Cthulhu Mythos 80 %, Stealth 60 %, Psychology 55 %. Språk: navaho, gammelmodig hoffspansk, mandarin, moderne wu-kinesisk og moderne amerikansk engelsk","spells":"Consume Likeness, Dominate, Mindblast (brukt i Den stjålne boka), Mental Suggestion, Gate, Graveyard Kiss (pulp-variant), Summon/Bind Hunting Horror, Pipes of Madness (via innretningen)","special":"OPPLØSNING: blir den alvorlig truet, faller den fra hverandre til enkeltinsekter som spreller vekk mellom gulvplankene — i praksis umulig å drepe med vanlige midler, med mindre den trenges opp et sted den ikke kan renne ut av.\n\nCONSUME LIKENESS: den kan ta form av ethvert menneske den dreper og spiser. En ny skikkelse bruker 48 TIMER på å utvikle stemmebånd — grunnen til at den måtte forlate Petersons skikkelse da Virginia ventet at han skulle snakke.\n\nEGENTLIG SKIKKELSE: kan ikke snakke eller lage lyd i det hele tatt, og må kommunisere skriftlig. Telegrammer er typisk.\n\nSPISING: etterlater bare skinn, hår og knokkelbiter — derav det hule rotteskinnet.","sanity_loss":"1D3/2D6 for å se den forvandle seg, eller se dens egentlige skikkelse","stats_note":"Karakteristikker fra Malleus Monstrorum (crawling ones). POW 100 er fastsatt av selve scenarioteksten — den opposed rollen for Mindblast — og overstyrer bokas 4D6+6.","forms":"Señor Diego Guiterrez de Almacan (hoveddekke) | Chad Peterson | Martin Dungass, overproviantforvalter | Haseye Adikai, en navaho-jente i tenårene | Du Zeming, en arret eldre kinesisk kvinne | hvem som helst annen den dreper om bord","notes":"Å finne den skal være katt og mus. Planen dens: prøvekjøre Pipes of Leng langt fra nysgjerrige øyne, og deretter sende seg selv og innretningen gjennom en Gate til Shanghai for å slutte seg til Eight Fortunes Mutual Aid Society."},{"id":"npc-almacan","name":"Señor Diego Guiterrez de Almacan","category":"Antagonist","role":"Skapningens dekkidentitet","description":"En tilbaketrukket spansk adelsmann i en lugar på første klasse på A-dekk som ikke står på noen liste — én dør unna heltene, hvis de bor der. Holder seg for seg selv, men kan sees promenere på dekk enkelte kvelder. Snakker et gammelmodig, høvisk spansk.","special":"Han står ikke på passasjerlisten. Overproviantforvalter Dungass la merke til det, gikk for å spørre, og døde av det.","notes":"Bruk ham som et ansikt, ikke som en motstander i kamp. Han er skapningen — se den oppføringen for karakteristikker.","stats_note":"Se The Crawling One."},{"id":"npc-bunny-bates","name":"Stuart «Bunny» Bates","category":"Antagonist","role":"Dominert gangster — skapningens hender","description":"Kastanjebrunt hår, store never, og en nese som er brukket noen ganger. Tre år med Capone-gjengen i Chicago, deretter et år i skjul i Wabasha Street-hulene i St. Paul, der han betalte politimesteren for å få være i fred. Hulene gjorde ham litt gal, og han er sulten på action. Med forbudstiden over er han ute etter å maksimere fortjenesten — eller i det minste finne en god opiumsforsyning i Shanghai.","stats":{"STR":"70","CON":"65","SIZ":"70","DEX":"60","INT":"55","APP":"45","POW":"50","EDU":"45","HP":"13","MP":"10","SAN":"25","DB":"+1D4","Build":"1","Move":"8"},"combat":["Fighting (Brawl) 60 %, skade 1D3+1D4",".32 revolver 50 %, skade 1D8","Thompson SMG 45 %, skade 1D10+2, burst 1/2/5 (hvis Keeperen vil legge ordentlig press på)"],"skills":"Intimidate 65 %, Stealth 50 %, Locksmith 45 %, Psychology 30 %","possessions":".32-revolver, en Tommy gun gjemt under dekk, stjålet mannskapsuniform","traits":"Målbevisst, ærgjerrig, kynisk","quotes":["«Hvorfor jeg skal til Japan? Pass dine egne saker.»","«Herregud, hva tar du meg for, en tyster? Pass dine egne saker.»","«Englekoret har befalt meg.»"],"special":"DOMINERT fra 7. desember. Skapningen må kaste Dominate på nytt hver natt (opposed POW roll). Helter som styrker viljestyrken hans — Hard Persuade eller Hard Psychoanalysis — gir ham en bonusterning til å stå imot.\n\nBelastningen driver ham inn i paranoid galskap. Den 17. desember bryter han fri lenge nok til å skrifte, hvorpå han knekker i løpet av en time og ikke lenger kan stå imot formelen i det hele tatt.","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Blir Bates drept eller satt i arresten tidlig, dominerer skapningen stuert Martin Aimesworthy i stedet, og han overtar Bates' rolle i alle senere scener."},{"id":"npc-flying-polyp","name":"Flying Polyp","category":"Monster","role":"Det maskinen kaller opp","description":"Et halvsynlig uhyre av umulig geometri, som beveger seg på vinder det lager selv. Tilkalt fra havbunnen av Pipes of Leng, og gjort rasende — ikke kontrollert — av dem. Når den stiger, åpner det seg en veldig malstrøm som får skipet til å krenge.","stats":{"STR":"50","CON":"25","SIZ":"50","DEX":"13","INT":"14","POW":"80","HP":"38","MP":"16","DB":"+5D6 (bare for vindstøtet)","Move":"8 / 12 flygende","Armor":"4"},"combat":["TENTAKLER: slå 2D6 ved starten av hver runde for hvor mange tentakler som kan angripe den runden. Hver av dem gjør ett angrep, 85 %, skade 1D10 — rett på HP, rustning hjelper ikke, fordi vesenet bare er halvveis materielt. Såret ser ut som uttørking eller ekstrem vindbrenning.","VINDSTØT: én gang per runde, 70 %, skade lik damage bonus (5D6). Sylinder på 9 meter i tverrsnitt, grunnrekkevidde 18 meter; skaden faller 1D6 for hvert nye multiplum av den avstanden. Knuser glass, slynger møbler, og blåser ofrene bakover like mange meter som de mistet HP.","FIXING ATTACK: fangstvinden, rekkevidde 900 meter, går rundt hjørner. Motstående STR mot polyppens POW hver runde — halv POW over 180 meter. Vinner polyppen, kommer målet seg ikke unna den runden.","Hvert vindangrep koster 1 magic point per runde.","Bruker 10 runder på å rive seg gjennom skroget til lasterom 7"],"armor":"4 poeng. Tar bare MINIMUM skade fra fysiske våpen. Fortryllede våpen, ild og elektriske angrep gjør full skade.","special":"På grunn av det fullstendige raseriet forblir den SYNLIG — som betyr at alle om bord ser den. Normalt glir en polyp inn og ut av syne, og da trekkes POW-en dens fra treffsjansen til den som skyter. Gjør den seg helt usynlig (1 magic point per runde), bruker den ikke tentakler i det hele tatt, men kan fortsatt vindangripe og kaste formler; da må man først klare et Listen-slag for å høre hvor pipelyden kommer fra, og trekker 50 prosentpoeng fra treffsjansen.\n\nStanser pipene, snur den og drar tilbake dit den kom fra, og etterlater seg en stripe av ødeleggelse. Fortsetter de å spille, legger den skipet i grus.","sanity_loss":"1D3/1D20 — slås av alle om bord","stats_note":"Karakteristikker fra Malleus Monstrorum. POW 80 og Armor 4 stemmer med scenarioteksten (den opposed rollen for Bind Flying Polyp og skadereglene). Skills: Hide 30 %, Track 35 %.","notes":"Se Regler: Å håndtere polyppen for de tre utveiene — ødelegg pipene, bind den, eller slåss. Tentakkeltelleren og vindstøtet er bygget inn i kamptrackeren i nettleserversjonen: 2D6 slås automatisk ved hvert rundeskifte, og hvert angrep bruker opp en tentakkel."},{"id":"npc-hunting-horror","name":"Hunting Horror","category":"Monster","role":"Valgfritt — tilkalt for å drepe heltene","description":"En repaktig, svart ting som pisker gjennom lufta, og som gjør vondt å se på. Tilkalt av skapningen når den vil ha helter eller tcho-tcho døde, og er villig til å ta oppmerksomheten det koster.","stats":{"STR":"30","CON":"10","SIZ":"42","DEX":"14","INT":"16","POW":"21","HP":"26","MP":"4","DB":"+3D6","Move":"7 / 11 flygende","Armor":"9"},"combat":["TO HANDLINGER: den kan bite OG bruke halen i samme runde.","Bite 65 %, skade 1D6","Tail 90 %, grapple — halen snører seg om målet og holder det fast. Den kan fly av gårde med offeret, eller bli stående og slåss. Offeret slipper løs bare ved et motstående STR mot STR.","Mens noen henger i halen, kan skapningen bare bite — men får +20 % på treffsjansen mot den som dingler. Den som er grepet får som regel ikke slått tilbake fysisk, men kan bruke formler."],"special":"Ødelegges av direkte sollys. Om bord betyr det at den må håndteres før daggry, eller drives ut på åpent dekk. Et kraftig nok lysglimt kan svi den til støv.","sanity_loss":"1D3/1D20","stats_note":"Karakteristikker fra Malleus Monstrorum. Rustning: 9 poeng hud, og den kan ikke impales av kuler. Sanity-tap 0/1D10.","notes":"En tung slegge. Scenarioet foreslår den for Keepere som vil gi heltene virkelig hard medfart, eller for å utslette tcho-tcho-ene hvis de avslår skapningens tilbud."},{"id":"npc-pipes-of-leng","name":"Pipes of Leng","category":"Innretning","role":"Energiinnretningen — hele plottets midtpunkt","description":"Tilsynelatende et kirkeorgel, dekket av ekstra ledninger, sikringsrør, slanger og underlige knuter, og for det meste dekket av blod. Står man tett inntil, hører man en illevarslende, hviskende summing. Selve pipene ble kjøpt, stjålet og plyndret fra tibetanske, nepalske og andre himalayiske kilder, og brakt til San Francisco for to år siden, der de ble satt sammen og stemt til ujordiske harmonier. Et orgelverksted i Portland og et lite elektrisk firma bygde mekanikken som spiller dem — i isolasjon og fullstendig uvitenhet om hva den skal brukes til.","stats":{"HP":"50","Armor":"3"},"special":"Å LADE DEN: fem menneskeofre, med blodet rennende ned i pipene.\n\nÅ SPILLE PÅ DEN: trekker til seg vesener fra Mythos, og påvirker alle innenfor 30 meter som formelen Pipes of Madness. Etter noen øyeblikk spiller den seg selv.\n\nFEILEN: den tilkaller, men holder ikke på noe. Alt den kaller opp, ankommer rasende og på jakt etter kilden til lyden.\n\nÅ ØDELEGGE DEN: 50 poeng skade mot armor 3. Det finnes ingen sprengstoff om bord.","stats_note":"HP 50 og Armor 3 står oppgitt i teksten.","notes":"Stuet i en diger kasse i lasterom 7."},{"id":"npc-captain-nelson","name":"Kaptein Henry Nelson","category":"Mannskap","role":"Skipsfører på SS President Coolidge","description":"Snøhvitt hår, velstelt bart, et meget fast håndtrykk. Nådeløs og effektiv. Nordmann, oppvokst i den franske kolonien Martinique, så den varme stemmen bærer en underlig aksent, og kolonifransken hans er utmerket. En ivrig pokerspiller som vet hvordan man bløffer, og vet når han blir bløffet.","stats":{"STR":"60","CON":"65","SIZ":"65","DEX":"55","INT":"75","APP":"60","POW":"70","EDU":"70","HP":"13","MP":"14","SAN":"70","DB":"0","Build":"0","Move":"7"},"skills":"Psychology 70 %, Fast Talk 95 %, Navigate 75 %, Persuade 60 %, Law 40 %, Language (French) 80 %","combat":["Fighting (Brawl) 45 %, skade 1D3","Revolver 55 %, skade 1D10 — ligger innelåst i lugaren hans"],"traits":"Slu, skarp, veloppdragen","quotes":["«God aften. Jeg går ut fra at De nyter reisen?»","«Hva i helvete er det som foregår her!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt. Psychology 70 % og Fast Talk 95 % står oppgitt i teksten.","notes":"Svært lite unngår oppmerksomheten hans. Helter som prøver å lure ham med tvilsomme opplysninger, blir diskré fulgt av stuertene. Vinn tilliten hans med Hard Charm eller Persuade, så kan han utnevne heltene — noe som åpner lasterommene på lovlig vis."},{"id":"npc-hugo-schramm","name":"Hugo Schramm","category":"Mannskap","role":"Førstestyrmann","description":"Lysebrunt hår, smalt ansikt, blyanttynn bart. Holdes travelt opptatt med passasjersaker og med å stille opp for kapteinen på skipets tilstelninger. Når det blir for mye, trekker han seg tilbake til kontoret og later som han ikke er der.","traits":"Smiler og nikker mye","quotes":["«Selvsagt, jeg skal ordne det med en gang.»","«Beklager, jeg hørte Dem ikke der ute!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Rådvill overfor forsvinningene, og under ordre om å holde dem stille. Ønsker første klasse og spesialklasse velkommen ved landgangen på avreisedagen, og undersøker Petersons lugar sammen med skipslegen Hartman."},{"id":"npc-albert-hallander","name":"Albert Hallander","category":"Mannskap","role":"Matros — tyv","description":"Blond og sterk, med grønne øyne. Født i Indonesia av nederlandske foreldre, med hang til smått tyveri. Han dirket opp låsen til Chad Petersons lugar for å rane den, og fikk en masse kakerlakker susende ut av stolen.","skills":"Locksmith 45 %, Stealth 50 %, Fast Talk 45 %, Persuade 30 %","traits":"Lusken, oppblåst, en ganske god løgner","quotes":["«Jeg gikk bare forbi, jeg skulle ha latt det være.»","«Jeg vet ingenting, det sverger jeg.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han roter heller til bildet enn å innrømme tyveriforsøk. En samlet innsats får ham til å tilstå — og da arresterer offiserene ham, som fjerner et vitne."},{"id":"npc-martin-aimesworthy","name":"Martin Aimesworthy","category":"Mannskap","role":"Stuert på første klasse","description":"Høy, blond, glattbarbert. Steller med behovene til første klasse. Pålitelig, ærlig og pliktoppfyllende. Blir han venn med heltene, deler han gjerne mistankene han har fanget opp.","traits":"Lojal og oppmerksom","quotes":["«Det er ingen sak. La meg ta meg av det.»","«Jo, det er et ordentlig oppstyr!»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han tar avskjedsbrevet som bevismateriale om kvelden den 6. desember. VIKTIG: blir Bates tatt eller drept, kaster skapningen Dominate på Aimesworthy og bruker ham i Bates' sted fra da av."},{"id":"npc-martin-dungass","name":"Martin Dungass","category":"Offer","role":"Overproviantforvalter — død før scenarioet begynner","description":"Fortært av skapningen natt til 6. desember, etter at han gikk for å stille noen spørsmål til en passasjer som ikke sto på listene. Liket blir aldri funnet.","stats_note":"Trenger ingen karakteristikker — han er død på side én.","notes":"Mannskapets oppfatning er at han har gått på flaska og sover den ut under dekk; det går rykter om trøbbel med kona. Politiet i Honolulu fører det opp som drukningsulykke."},{"id":"npc-erik-hartman","name":"Dr. Erik Hartman","category":"Mannskap","role":"Skipslege","description":"Undersøker åstedet i Petersons lugar sammen med førstestyrmann Schramm, og holder funnene for seg selv, som han har fått ordre om.","skills":"Medicine 60 %, First Aid 70 %, Science (Biology) 45 %","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"En nyttig inngang for helter med medisinsk bakgrunn — kollegial høflighet er en enkel vei inn i lugaren."},{"id":"npc-other-crew","name":"Resten av mannskapet","category":"Mannskap","role":"Navn å slenge ut ved behov","description":"Sjeftelegrafist Marco Borrely (med ni radio- og telegrafoperatører under seg) | maskinsjef Oliver Grossmann | maskinistmat Wilhelm Schubert | fyrbøter Robert Reid, en av tjue junioringeniører | kjøkkensjef Anthony Deplace | vinkelner Phillipe d'Alsace | matros Hank Henson, som vokter Petersons dør | Arthur Benedict Carmel, sjef for femtifire kelnere | Ephraim «Fizzy» Walters, spydig hovmesterbartender | andrestyrmann Gustav Knutsen, på lastelukene om dagen | junioringeniør Barry O'Rourke, på dem om natta | Raymond Hickler, dirigent for Pacific Jazz Orchestra | Arthur Pendury, stallkar for hestene i lasterom 5","stats_note":"Statister — bruk vanlige matros- eller yrkesprofiler ved behov.","notes":"315–350 mann i alt. Gjenta kjente ansikter, så spillerne blir kjent med noen få faste."},{"id":"npc-chad-peterson","name":"Chad Peterson","category":"Offer","role":"Rik forlovede — fortært første natta","description":"Charles Chadwick Peterson fra New York. Upåklagelig kledd, grundig full på landgangen, hilser på alle han kolliderer med. Fortært i lugaren sin natt til 6. desember; fra da av er alle som ser «Peterson», i realiteten skapningen.","quotes":["«Chad Peterson fra New York, en fornøyelse å gjøre Deres bekjentskap.»"],"special":"Han skrev seg alltid Charles Chadwick Peterson, Charles Peterson eller C. C. P. — aldri «Chad». Avskjedsbrevet er undertegnet «Chad».","stats_note":"Trenger ingen karakteristikker — død før første natt er omme.","notes":"Det ekte brevet han la igjen til Virginia om morgenen den 6., lyder: «Virginia, hver dag vet jeg at jeg tok det rette valget. Bli med meg til sjøs! Din kjære Chad.» Sammenlign det med avskjedsbrevet."},{"id":"npc-virginia-ridley","name":"Virginia Ridley","category":"Passasjer — første klasse","role":"Dilettant og flapper — Petersons forlovede","description":"Kastanjebrunt hår, kurvete, en farlig gange. Født i Shanghai og oppdratt av en amah, i USA siden hun fylte femten. En beryktet New York-flapper, hvis familie tapte mye i krakket. Hun snakket Chad Peterson med på å bli med til Kina, og er ivrig etter å rekke kinesisk nyttår og vise ham barndomsbyen sin.","stats":{"STR":"45","CON":"55","SIZ":"50","DEX":"70","INT":"60","APP":"80","POW":"60","EDU":"60","HP":"10","MP":"12","SAN":"60","DB":"0","Build":"0","Move":"9"},"combat":["Shotgun (leirdue, bukkehagle) 55 %, skade 4D6/2D6/1D6"],"skills":"Charm 70 %, Dance 65 %, Firearms (Shotgun) 55 %, Language (Wu Chinese) 30 %","traits":"Flørtende, glad i våpen og spenning, en glimrende danser","quotes":["«Jeg fikk endelig den store tosken med til Kina, og så stikker han fra meg!»","«De finner ham, ikke sant? De må bare finne ham.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun og Peterson har separate lugarer på presidentdekket. Hun har ikke snakket med ham siden middagen rundt kl. 19.00 den 5. desember — skikkelsen kl. 21.30 var allerede skapningen, og noe ved ham plaget henne. Fra 9. desember skyter hun leirduer over akterenden for å få ut nervene, til stuertene ber henne slutte. En kandidat til det femte offeret."},{"id":"npc-charles-astor","name":"Charles Winston Astor","category":"Passasjer — første klasse","role":"Rik forretningsmann — Petersons venn","description":"Gode tenner, spiss hake, gråsprengt hår. En av New York-Astorene, og han lar sjelden noen glemme det. Han tjente pengene sine på gamlemåten — han arvet dem. Uteksaminert solid midt på treet fra Yale i 1895, og har siden drevet familiens fabrikker i Massachusetts og langs Hudson. Reiser i presidentsuiten, den fineste lugaren om bord, med sønnen James (25), butleren Walker (38) og datteren Elizabeth Anne (19).","stats":{"STR":"55","CON":"55","SIZ":"70","DEX":"50","INT":"60","APP":"55","POW":"55","EDU":"70","HP":"12","MP":"11","SAN":"55","DB":"+1D4","Build":"1","Move":"6"},"combat":["Rifle/Shotgun 55 % — skyter leirduer over akterdekket"],"skills":"Credit Rating 95 %, Persuade 55 %, Intimidate 50 %, Accounting 50 %","traits":"Selvsikker, uekte, forteller en god grisevits, kan skyte og jakte","quotes":["«Chip var en stor venn av meg, en nær venn, og han ville aldri gjort noe slikt.»","«Jeg forstår det ikke. Jeg bare forstår det ikke.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Fullstendig omgjengelig, og ikke spesielt interessert i å få venner under spesialklasse. Blir han venn med heltene, kan han legge inn et godt ord hos kapteinen hvis de havner i trøbbel. Han bekrefter forlovelsen mellom Peterson og Virginia, og insisterer på at «Chip» ikke var typen til å kaste seg ut av en koøye. Etter Honolulu understøtter han det med 1 000 dollar kontant for opplysninger som fører fram."},{"id":"npc-alex-hubbard","name":"Alex Hubbard","category":"Passasjer — første klasse","role":"Storviltjeger","description":"Overvektig, skallet, muskuløs. Berømt for å spore opp og drepe hva som helst som er verdt en tur over havet. Nåværende mål er det svarte pygmé-neshornet i Siam, som få vestlige har sett og enda færre har utstoppet i røykesalongen. Reiser uten annen plan enn stopp i Yokohama, Shanghai og Macao før Bangkok — «Asias kjøttgryter», som han kaller det.","stats":{"STR":"70","CON":"65","SIZ":"80","DEX":"55","INT":"55","APP":"45","POW":"55","EDU":"55","HP":"14","MP":"11","SAN":"55","DB":"+1D4","Build":"1","Move":"6"},"combat":["Winchester-rifle med kikkert 70 %, skade 2D6+4","Bukkehagle 60 % (fugleskrot)"],"skills":"Track 65 %, Natural World 55 %, Survival 50 %, Intimidate 45 %","possessions":"Winchester-rifle med kikkert, en bukkehagle til leirdueskyting med fugleskrot, og et eksemplar av Baedekers reisehåndbok for Siam og Indokina","traits":"Nådeløs, skrytende historieforteller, pratsom, revirhevdende","quotes":["«En mann som ikke jakter, er ikke stort til mann.»","(etter noen drinker) «Jo da, henne skulle jeg gjerne hatt i trofésamlingen.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Ved siden av neshornet har han kikket seg ut Virginia Ridley, og trøster henne i håp om å vinne hennes gunst. Bagasjen hans er den mest tilgjengelige ildkraften om bord for helter som trenger et våpen."},{"id":"npc-dr-soong","name":"Dr. Soong","category":"Alliert","role":"Okkult- og Mythos-forsker","description":"Hvitt hår og skjegg, skrøpelig, lett foroverbøyd, over 70 år. Like hjemme i tradisjonelle som vestlige klær, og like glad for å diskutere urtemedisin, taoisme eller religion. En overbevist kommunist inntil nylig, som tjente arbeiderne i Shanghai både som tradisjonell lege og som fortrolig og medsammensvoren — men han har valgt å reise i stil, på første klasse på båtdekket. Født i Shanghai; morsmålet er wu-kinesisk, mandarinen hans er brukken, engelsken langt bedre.","stats":{"STR":"35","CON":"45","SIZ":"50","DEX":"40","INT":"85","APP":"55","POW":"75","EDU":"85","HP":"9","MP":"15","SAN":"45","DB":"-1","Build":"-1","Move":"4"},"skills":"Occult 80 %, Cthulhu Mythos 25 %, Medicine 70 %, Science (Pharmacy) 65 %, History 60 %, Language (Mandarin) 40 %, Language (English) 70 %","traits":"Alvorlig, lærd, dysterhetsfull, og meget, meget skarp","quotes":["«Dette er min tjener, Wang Ma. Han vil svare på Deres spørsmål. Unnskyld meg.»","«Hendelsen er høyst uheldig. Beklagelig og uheldig.»"],"possessions":"En kiste med urtemedisiner, en liten doktorveske, og (fram til 7. desember) et eksemplar av Book of Red Jade","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"BAKGRUNN: han kjempet i årevis mot opiumshandelen, vestlig utbytting og nasjonalistisk propaganda, fikk noen lite hyggelige venner og en smak for opium selv, uten å falle i dyp avhengighet. I 1927 myrdet nasjonalistiske leiesoldater kona og to av hans tre sønner; han dro til USA med den gjenlevende sønnen og datteren, og tok opp Mythos-forskning på heltid.\n\nETTER 7. DESEMBER nevner han at han så Chad Peterson gå ut av lugaren sin rundt kl. 06.00 søndag den 6. — etter det antatte selvmordet.\n\nMERK: la ham ikke svare på alt eller redde dagen. Han er gammel og skrøpelig. Bruk ham til å peke, og til å løsne opp når heltene står fast. Han er også en kandidat til det femte offeret."},{"id":"npc-wang-ma","name":"Wang Ma","category":"Alliert","role":"Dr. Soongs tjener — myrdet 7. desember","description":"Kort og stygg, med bredt bryst, blek hud og et ondskapsfullt glis. Han steller doktorens klær, urtemedisinkista og hans personlige sikkerhet. Han er tcho-tcho, og leder for en liten flokk av dem som er booket på mellomdekket og tjener Soong for å innfri en gjeld — detaljene er det opp til deg å finne på. Noe i retning av at Soong har reddet livet til en del tcho-tcho.","stats":{"STR":"65","CON":"70","SIZ":"45","DEX":"60","INT":"60","APP":"30","POW":"55","EDU":"30","HP":"11","MP":"11","SAN":"45","DB":"0","Build":"0","Move":"8"},"combat":["Fighting (Brawl) 55 %, skade 1D3","Knife 60 %, skade 1D4+2"],"skills":"Stealth 60 %, Spot Hidden 50 %, Survival 55 %","traits":"Stø, modig, mistenksom","quotes":["«Mester Soong si nei.»","«Mester Soong ikke si.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Drept 7. desember mens han forsvarte Book of Red Jade, og begravet på havet kl. 15.00 den 8. Han erstattes ved Soongs side av Lo Mai, med samme karakteristikker; dør Lo Mai også, trer nye tcho-tcho inn etter tur."},{"id":"npc-phyllis-barnes","name":"Phyllis Barnes","category":"Passasjer — spesialklasse","role":"Musikklærer og godt menneske — offer 3","description":"Kraftig bygd, håret i knute, et glimt i øyet, korte negler. Rødlig hår og et lyst smil er hennes beste trekk. Hun spiller piano, orgel, harpe og fløyte og synger en myk alt, holder impromptu konserter nesten daglig ved lunsj eller middag, og underviser de rikere barna om bord — deriblant Astor-barna. Hun driver også veldedighetsarbeid på mellomdekket, og lærer bort musikk, matematikk og enkel tysk til småbarn. En peppermø, ung til sinns, kraftig bygd, men ikke ved beste helse, og en smule nysgjerrigper.","stats":{"STR":"45","CON":"45","SIZ":"65","DEX":"45","INT":"60","APP":"45","POW":"60","EDU":"65","HP":"11","MP":"12","SAN":"60","DB":"0","Build":"0","Move":"5"},"skills":"Art/Craft (Music) 75 %, Listen 55 %, Charm 50 %, Psychology 40 %","traits":"Rasistisk og fremmedfiendtlig, særlig overfor kinesere, og dertil dypt kristen","quotes":["«Jeg er i musikkrommet hvis noen trenger meg.»","«Jo, jeg hjelper gjerne, men jeg vet ikke om det er så mye jeg kan gjøre.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun påstår å ha sett «voldsomme slagsmål blant kineserne» mer enn én gang — en løgn hun forteller for å gjøre seg selv mer interessant. Spurt om Peterson sier hun at han oppførte seg underlig: de kom godt overens den første kvelden, men neste morgen ante han ikke hvem hun var. Hun kaller selvmordet «sludder», fordi hun har sett ham flere ganger siden.\n\nHun dør 13. desember, etter å ha fulgt musikken til lastelukene. Kroppen havner i en ballasttank i lasterom 4."},{"id":"npc-takishi-suroda","name":"Takishi Suroda","category":"Passasjer — spesialklasse","role":"Nysgjerrig forretningsmann — offer 1","description":"Muskuløs, men spedbygd, med bredt smil og ivrige øyne. En smykkehandler som nettopp har avsluttet en forretning i San Francisco som ser ut til å ha gått godt, og som nå er på vei til ferie i Honolulu. Han utnytter tida om bord til å slappe av og nyte turen.","skills":"Appraise 60 %, Charm 45 %, Persuade 45 %","traits":"Liker å vite hva alle andre driver med, en smule sladrehank","quotes":["«Hei, hva er det du har der?»","«Hei, jeg har lett etter deg! Hvor har du gjemt deg?»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Sannsynlig lugarkamerat for en mannlig helt på spesialklasse. Han er med vilje et blankt ark — bruk ham til å hjelpe, til å hindre, til å dele ut blindspor, eller bare til å være i veien. Han skal gå i land i Honolulu 10. desember; i stedet blir han det første offeret, og lugarkameraten finner senga urørt."},{"id":"npc-father-alvarez","name":"Pater Raphael Alvarez","category":"Alliert","role":"Jesuittisk misjonsprest","description":"Svart hår og bart, ru hud, hender med gjenger etter mange år i klosterhagen. Jesuitt, opprinnelig fra Mexico, med god merittliste i å undersøke det paranormale på vegne av Roma. Omplassert til Peking for å rapportere om de kristnes tilstand i den kinesiske hovedstaden — og i hemmelighet for å lete etter opplysninger om de eldgamle fruktbarhetskultene i de mongolske ørkenene. Han kan nok om Cthulhu Mythos til å ha mareritt.","stats":{"STR":"55","CON":"60","SIZ":"60","DEX":"55","INT":"70","APP":"55","POW":"75","EDU":"80","HP":"12","MP":"15","SAN":"70","DB":"0","Build":"0","Move":"7"},"skills":"Occult 55 %, Cthulhu Mythos 10 %, Psychology 60 %, Persuade 55 %, History 50 %, Library Use 60 %, Language (Latin) 70 %, Language (Chinese) 40 % og raskt stigende","traits":"Vennlig, logisk, nysgjerrig, oppmerksom, hjemsøkt","quotes":["«Jeg ville undersøkt sjøfolkene. Er selvmordet i virkeligheten et drap, kan de stå bak.»","«Velsigne deg, mitt barn. Velsigne oss alle.»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han sier helst svært lite, med mindre han blir stilt direkte overfor bevis på Mythos-aktivitet, og stiller flere spørsmål enn han svarer på. Han tar gjerne imot skriftemål, holder messe og gir sjelesorg til alle om bord; det han ikke gjør, er å snakke om seg selv eller ordrene sine fra Roma. Han har brukt de siste ukene på å lære seg kinesisk fra ei bok, med praktisk hjelp fra stuertene.\n\nHan hører Bates' skriftemål 17. desember og bringer det til kapteinen. En sterk kandidat både til erstatningskarakter — og til det femte offeret."},{"id":"npc-miles-hardaway","name":"Miles Hardaway","category":"Passasjer — tredje klasse","role":"Pågående journalist — offer 2","description":"Bakoverglattet hår, spedbygd, gjennomtrengende blikk. En journalist fra San Francisco Chronicle, om bord for å skrive om reisen og dekke handelsmulighetene mellom USA og Kina.","skills":"Fast Talk 65 %, Persuade 55 %, Library Use 55 %, Spot Hidden 50 %","traits":"Nysgjerrig, sladrete og temmelig pågående","quotes":["«Si meg, fortell litt om deg selv.»","«Kan jeg få et sitat?»"],"stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Han gjør et nummer av Peterson-saken, spiller opp «lukket rom»-vinkelen som et virkelig Sherlock Holmes-mysterium og telegraferer spekulasjoner i land. Enten en løpende plage eller ren bakgrunn, som du vil. Han lokkes til Almacans lugar og drepes 12. desember."},{"id":"npc-james-hawthorne","name":"James Hawthorne","category":"Mannskap","role":"Kenneljente, 17 år — vitnet som knakk","description":"Skvetten, mumlende, med blikket stadig søkende langs gulvet. Skriker og stikker inn i det lille hiet sitt så snart hun ser en edderkopp eller en kakerlakk. Hun steller over 30 hunder, 14 katter, 20 sjøsyke kyr og fem fullblodshester i lasterom 5.","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"Hun så skapningen oppløse seg til en krypende masse nede i lasterommet, og det har gjort henne ubotelig gal. Beroliget — eller nådd med Psychoanalysis — snakker hun om «krypene» hun har sett komme og gå, marsjere som en hær, og om hvordan hun hører dem pile rundt inne i skipet, sikker på at de kommer for å spise henne.\n\nKommer heltene seg ikke ned i lasterommene før sent i reisen, er hun borte — tatt og ofret."},{"id":"npc-tcho-tcho","name":"Tcho-tcho","category":"Blindspor","role":"Lo Mai og seks arbeidere, booket på mellomdekket","description":"En liten flokk i dr. Soongs følge, som innfrir en gjeld til ham. De overvåker femti tønner merket «Hawaiian Botanical Specimens», og samles for seg selv i baugrommet, unna støyen på mellomdekket. Illevarslende, innadvendte — og i dette scenarioet ikke skurkene.","stats":{"STR":"60","CON":"65","SIZ":"45","DEX":"65","INT":"55","APP":"30","POW":"50","EDU":"30","HP":"11","MP":"10","SAN":"40","DB":"0","Build":"0","Move":"8"},"combat":["Fighting (Brawl) 50 %, skade 1D3","Knife 55 %, skade 1D4+2"],"skills":"Stealth 65 %, Survival 60 %, Spot Hidden 45 %","stats_note":"Spillklart forslag — det trykte scenarioet har disse i Appendix A. Juster fritt.","notes":"HENSIKTEN DERES ER Å VÆRE FEIL SVAR. Spilt rett fram er de nøytrale og kan hjelpe gjennom Soong. Spilt stygt kan de skifte side til skapningen underveis. Helter som gjennomsøker lasterom 1 om natta, møter dem, og de liker det dårlig med mindre heltene kan vise at de arbeider for dr. Soong.\n\nLo Mai trer inn i Wang Mas plass etter drapet. Avslår tcho-tcho-ene skapningens tilbud og heltene redder dem, erklærer den eneste overlevende, Sheng Tsin, seg som deres tjener for livet."},{"id":"npc-background-passengers","name":"Passasjerer i bakgrunnen","category":"Statister","role":"Navn å slenge ut ved behov","description":"FØRSTE KLASSE: Xin Yu, Yan Zou, Sissy McPatrick, Neal Westner, Deliah Conningway, Rupert Cocksure.\n\nSPESIALKLASSE: Ru Li, Shen Liu, Arthur Sellkirk, Maud Rendox, Jasper Conway, Lottie Unser.\n\nTREDJE KLASSE: Peng Chen, Fu Wang, Lan Wu, Daiyu Tang, Billy Royston, Ethel Rind, Paul Scott.\n\nLUGARKAMERATER PÅ TREDJE KLASSE: brødrene Po Liang og Po Hau, Pai Gow-givere innleid til kasinokvelden, og marinegast Olaf Gustavsen fra minesveiperen Abilene.\n\nUNDERHOLDERE: jazz- og kabaretsangerne Rebecca McCormick og Antonio Portaluppi.","stats_note":"Statister — ingen karakteristikker nødvendig.","notes":"678 passasjerer om bord. De andre passasjerene har omtrent ingenting bedre å gjøre enn å sladre og spekulere, og de fleste gjør det gjerne i det vide og brede med heltene."}],"handouts":[{"id":"handout-suicide-note","title":"Handout 1: Chad Petersons avskjedsbrev","found":false,"description":"Funnet på skrivebordet i Petersons lugar, og tatt med som bevismateriale av stuert Aimesworthy samme kveld.","read_aloud":"  MITT LIV HAR VÆRT EN LØGN BYGD PÅ MIN FARS PENGER.\n  TROSS MIN YTRE FASADE ER JEG EN HUL MILLIONÆR.\n  UTEN PENGER VET JEG AT JEG IKKE STREKKER TIL FOR Å\n  GJØRE DET JEG VILLE MED LIVET MITT. FARVEL, VERDEN,\n  JEG GÅR TIL ET BEDRE STED.\n\n                                              CHAD","aside":"HVA SOM ER GALT MED DET: underskriften. Han skrev seg Charles Chadwick Peterson, Charles Peterson eller C. C. P. — aldri bare «Chad». Håndskriften stemmer rimelig godt; å se forskjellene krever en Art/Craft (Calligraphy eller lignende) roll, eller Hard Spot Hidden, mot en kjent skriftprøve fra Virginia Ridley eller Charles Astor. Og «hul millionær» betyr en arving som ble ruinert i krakket i 1929 — noe Peterson ikke var.","connects_to":["clue-suicide-note-wrong","beat-the-empty-suit"]},{"id":"handout-book-of-red-jade","title":"Handout 2: Book of Red Jade","found":false,"description":"Et utsvevende verk av Mythos-kunnskap, som får enhver god konfucianer og enhver som har lest klassikerne, til å grøsse. Det spotter ikke bare Lao Tzus verk, men taoismen, keiseren og hele Manchu-dynastiets guddommelige status.\n\nBESKRIVELSE: langt og smalt — 344 tresnitt-trykte sider, 15 cm brede og 30 cm høye, på høvisk mandarin. Blekket er knallrødt som okseblod, med margnotater og treskjærersnitt i svart. Endeblader av blå silke med en urovekkende skimring i lyset, og tre innbundne, kunstferdig knyttede bokmerker i rød silke. Kalveskinn over tynne, men ekstremt harde trebord; skinnet er dekket av en lett grynet, vanntett lakk som skal ligne anløpet kobber eller mørkegrønn kleberstein. En treklørs messingdrage med ett øye pryder hvert omslag, festet under lakken.\n\nSJELDENHET: bare trettitre eksemplarer skal være laget; de kinesiske myndighetene ødela de fleste på 1830-tallet. Flere havnet på Filippinene og i USA med kinesiske innvandrerkultister. Ett skal befinne seg i British Museum.\n\nHISTORIE: skrevet i fengsel eller under tvang under Manchu-dynastiet, tilskrevet Zhou Lo Wei, «krigsherren av hundre mesterskap». Zhou dukker først opp i kinesiske kilder som alkymist fra de mongolske provinsene på 1830-tallet, og er bedre kjent etter at han kom til Peking i 1847, der han ble opiumsavhengig og lærd i klassikerne, og samlet en sekt av spyttslikkere og reformatorer som kalte seg «Sevenfold Hidden Path Clan» — antireligiøse fanatikere, utpressere og skolerte kriminelle som skremte hovedstaden i årevis. Zhou skaffet seg en stilling ved det keiserlige hoff i 1850 og misbrukte den grovt fram til 1861, da han ble pågrepet og tiltalt for ulovlig inntrengning i den keiserlige byen, trolldom og forbrytelser mot den offentlige orden. Han ble halshugget i Peking i 1862. Beretningene om begravelsen spriker — et annet lik kan ha blitt byttet inn, eller han kan ha oppløst seg i insekter på retterstedet.\n\nDET ER FULLT MULIG, JA SANNSYNLIG, AT ZHOU OG SKAPNINGEN ER DEN SAMME.\n\nMYTHOS-KUNNSKAP: prosessen for ghoul-forvandling; å tilkalle og binde en flying polyp; mongolenes og manchuenes historie med hensyn til star vampires og mi-go; og en drømmesekvens som viser direkte til Azathoth og Nyarlathotep. Verket omskriver også stoff fra Seven Cryptical Books of Hsan.\n\nSPILLDATA: mandarin. Sanity loss 1D10. Cthulhu Mythos +4/+8. Mythos Rating 36. Elleve uker for fullt studium; en første gjennomlesning tar 6 timer.\n\nFORESLÅTTE FORMLER: Cause/Cure Blindness, Consume Likeness, Dominate, Flesh Ward, Powder of Ibn-Ghazi, Summon/Bind Flying Polyp, Words of Power.\n\nMERK: helter uten mandarin kan, hvis de skaffer boka tilbake til dr. Soong, overtale den gode doktoren til å oversette deler av den — eller lære dem en formel som belønning. Bind Flying Polyp er den som betyr noe den 19. desember.","connects_to":["beat-the-stolen-book","npc-dr-soong","ref-dealing-with-the-polyp"]},{"id":"handout-genuine-note","title":"Handout 3: Det ekte brevet til Virginia","found":false,"description":"Lagt igjen til Virginia Ridley om morgenen 6. desember, i Petersons egen håndskrift.","read_aloud":"  Virginia, hver dag vet jeg at jeg tok det rette valget.\n  Bli med meg til sjøs!\n\n                                        Din kjære Chad","aside":"Bruk det som den kjente skriftprøven avskjedsbrevet sammenlignes mot — og som det lille hjertesukket som gjør at selvmordskjennelsen klinger falskt.","connects_to":["clue-suicide-note-wrong","npc-virginia-ridley"]}],"locations":[{"id":"loc-first-class","title":"Første klasse","deck":"Båtdekk, A-, B- og C-dekk","description":"214–307 passasjerer i ytterlugarer og suiter langs de øvre dekkene og forut. Fire suiter har eget bad og toalett; 32 lugarer deler bad; de fleste av de øvrige er enkeltlugarer med eget bad, og de billigste førsteklassebillettene er dobbeltlugarer med felles dusj. Alle har egen ovn, heldekkende teppe og overdådige lysarmaturer, malerier og møbler. Ingen køyesenger.\n\nSpisesalen på første klasse ligger på C-dekk midtskips, og nås ned en praktfull hovedtrapp forbi et stort veggmaleri av landene Dollar Lines skip anløper. En privat spisesal ligger like ved hovedsalen.\n\nFørste klasse har sitt eget mannskap, som vokter passasjerenes privilegier nidkjært.","visited":false},{"id":"loc-special-class","title":"Spesialklasse","deck":"B-dekk","description":"133 rom rett bak førsteklasselugarene — mindre, med felles bad, men brukes som førsteklasselugarer når etterspørselen tilsier det. 23 lugarer har plass til tre, 16 til fire; enkeltsenger med nedfellbare køyer over den ene eller begge. Spisesalen for spesialklasse ligger på C-dekk, litt lenger akterut enn førsteklassesalen.","visited":false},{"id":"loc-third-class","title":"Tredje klasse","deck":"C-dekk, akterut","description":"170 køyeplasser, ingen av dem i ytterlugarer. Spartanske lugarer med tre eller fire køyer, med plass til seks eller åtte, og faste — ikke nedfellbare — køyer. Hver lugar har speil, toalett og servant, og deler et fellesbad. Spisesalen for tredje klasse ligger helt akterut på C-dekk.\n\nDe fire forseglede lastelukene ligger på dette dekket — som er grunnen til at heltene ender opp her nede.","visited":false},{"id":"loc-steerage","title":"Mellomdekket","deck":"D-dekk, akterut","description":"Opptil 380 mennesker i seks store rom med 60 køyer hver, uten noe privatliv, ved de bråkete rormaskinene og de turboelektriske maskinene som driver propellene. Fungerer også som lasterom fra tid til annen. Mellomdekket bruker tredjeklassesalen etter at tredje klasse har spist.\n\nLengst fra skipets balansepunkt, så hver bølge kaster det høyere opp og ned enn noe annet sted om bord.","visited":false},{"id":"loc-amenities","title":"Fasiliteter og underholdning","deck":"Øvre dekk","description":"MUSIKKROMMET (B-dekk): flygler, harpe og andre instrumenter. Phyllis Barnes opptrer og underviser her.\nRØYKESALONGENE (A- og B-dekk): poker, canasta og bridge. Salongen på første klasse har et Rip Van Winkle-billedteppe, lenestoler i valnøtt, grønne sofaer, spillbord, gulv av grønne og rødlige gummifliser, og en peis i grønn marmor med elektrisk ild. Over peisen henger et glassmaleri, «Damen og enhjørningen». Salongen for spesialklasse på B-dekk har et maleri av Sierra Nevada, et portrett av president Coolidge, vinrøde stoler og enkle kortbord med nedfelte glassholdere og innebygde askebegre i glass.\nGRAND SALON: Raymond Hickler and His Pacific Jazz Orchestra hver kveld. Presidential Dance Orchestra spiller i ballsalen kl. 21.00 presis.\nCONTINENTAL LOUNGE (første klasse, A-dekk): en kuppel av 3 000 glassbiter og seter i blå fløyel. Film og filmavis fredag og lørdag — The Persian Pasha og Chaplins City Lights før Honolulu; At the Kentucky Derby og It Pays to Advertise med Louise Brooks etterpå. Her ligger også den fineste av skipets to barer.\nHAWAIIAN SALOON (C-dekk): den røffere baren. Begge er godt forsynt med brennevin, champagne, viner (også sake) og øl fra San Francisco og Yokohama.\nBIBLIOTEKET OG SKRIVESTUA PÅ FØRSTE KLASSE (A-dekk): et veggmaleri av dyphavets liv og rundt 4 000 bind — skjønnlitteratur, historie, økonomi, humanistiske oppslagsverk og tidsskrifter.\nBASSENGENE: to, åpne kl. 10.00–18.00 med livredder. Bassenget for spesialklasse og tredje klasse over lasterom 6 åpnes først i varmere farvann nær Hawaii.\nDESSUTEN: gymsal, barbersalong, brusbar, to elektriske heiser, mørkerom for fotografer, kapell, og et trykkeri om bord som kunngjør begivenheter og trykker invitasjoner. Hele skipet er klimaanlagt, noe som er uvanlig i 1931.","visited":false},{"id":"loc-bilges","title":"Bunnrommet","deck":"Under lasterommene","description":"Ballastvann, veldige tanker fulle av dieselolje, og lite annet. Rotter og annet skipsutøy er alt av uhygge som finnes — med mindre skapningen er tvunget over i utøyform, for da er det her den holder til.","visited":false,"connects_to":["npc-crawling-one"]},{"id":"loc-boilers","title":"Maskinrom og kjeler","deck":"Midtskips, under dekk","description":"Et inferno, betjent av 45 mann i døgnkontinuerlige skift på 15. De regulerer maskineriet, reparerer turbiner og kjeler, og betjener for hånd det innfløkte rørsystemet som mater dieselolje til kjelene og strøm til de turboelektriske maskinene.\n\nHelter som går inn, blir konfrontert med mindre de har klart Stealth rolls eller har fått en i mannskapet til å gi dem omvisning. Maskinistene fjerner alle som ikke skal være der, varsler offiserene og holder inntrengerne til kapteinen får tid til dem. Bare en Extreme Fast Talk eller Persuade overbeviser maskinistene om at heltene har lov til å gå rundt her nede alene.","visited":false},{"id":"loc-hold-1","title":"Lasterom 1 — baugrommet","deck":"Nederste dekk, forut","description":"ALLTID ULÅST. Møtestedet for tcho-tcho-ene og deres private sammenkomster, unna støyen på mellomdekket.\n\nSPOT HIDDEN finner to ting: restene av et lite bål laget av oppbrukne kasser, minst et døgn kaldt, med forkullede beinbiter i asken; og den utbrente asken fra en opiumspipe (Know eller Science (Chemistry eller Pharmacy) for å kjenne den igjen).\n\nHelter som leter her om natta, møter tcho-tcho-ene, som ikke liker inntrengingen med mindre heltene kan vise at de arbeider for dr. Soong.","visited":false,"connects_to":["clue-cold-fire","npc-tcho-tcho"]},{"id":"loc-hold-2","title":"Lasterom 2 — passasjerbagasje","deck":"Nederste dekk","description":"LÅST. Godt over 2 700 kolli: skipskofferter, kister, safer, tunge vesker, pakker i brunt papir og hyssing, hattesker, omhyggelig innpakkede urner og glassvarer, to dusin kasser fransk vin, og nok instrumenter til et lite symfoniorkester.\n\nPassasjerenes våpen og geværer oppbevares her — deriblant Alex Hubbards Winchester og hagle.","visited":false,"connects_to":["npc-alex-hubbard"]},{"id":"loc-hold-3","title":"Lasterom 3 — kjølerommet","deck":"Nederste dekk","description":"Låst med et håndtak som lett lar seg vri opp. Ferskvarer — kjøtt, frukt, melk og annen mat — samt blomster, vitenskapelige prøver og medisinsk utstyr. Kokkene er innom ofte for å fylle opp spiskammersene, noe som gjør dette til det lasterommet det er lettest å bli sett i på lovlig vis.","visited":false},{"id":"loc-hold-4","title":"Lasterom 4 — kasser og ballasttanker","deck":"Nederste dekk","description":"ULÅST. Over 2 000 trekasser, kister og skipskofferter, og en rekke ballasttanker.\n\nÅPNES TANKENE: de forråtnede restene av Phyllis Barnes. Å åpne den øvre luka slipper ut en sky av ufattelig vemmelig gass — CON roll eller kast opp av stanken. Å oppdage liket krever en Sanity roll (0/1D2).","visited":false,"connects_to":["clue-ballast-tank","npc-phyllis-barnes"]},{"id":"loc-hold-5","title":"Lasterom 5 — kenneler og buskap","deck":"Nederste dekk","description":"Alltid oppvarmet, bemannet og ulåst, og hele rommet lukter dyr. 20 sjøsyke kyr, fem fullblodshester med stallkaren Arthur Pendury (som er innom tre ganger daglig og av og til sover her framfor på mellomdekket), over 30 hunder og 14 katter — alt passet av kenneljenta James Hawthorne, 17 år.\n\nHawthorne er det beste vitnet om bord, og hun er i ferd med å gå i oppløsning.","visited":false,"connects_to":["npc-james-hawthorne","clue-kennel-boy"]},
