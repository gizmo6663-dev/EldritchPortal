ing trust by impart ing a secret.","pushed_failure":"the target takes offence and will have nothing further to do with you; the target is associated in some way with your enemies and, while they may play along with you, they also inform on you; a third party intercedes to prevent you from chatting up their girl.","insane":"If an insane investigator fails a pushed roll, he or she falls head over heels in love with their target and will act as if the target had successfully used a Dominate spell (see Chapter 12: Grimoire) upon them."},{"name":"Climb","base":"20%","description":"This skill allows a character to climb trees, walls and other vertical surfaces with or without ropes and climbing gear. The skill also encompasses rappeling. Conditions such as firmness of surface, available handholds, wind, visibility, rain, etc., may all affect the difficulty level. Failing this skill on the first roll indicates that the climb is perhaps beyond the investigator’s capability. Failing a pushed roll is likely to indicate a fall with resultant damage. One successful Climb roll should allow the investigator to complete the climb in almost all cases (rather than requiring repeated rolls). A challenging or longer climb should have an increased difficulty level.","difficulty":["Regular difficulty: plenty of handholds; perhaps a rope or drainpipe to climb.","Hard difficulty: few handholds, or surfaces slick with rain."],"pushed_failure":"fall and suffer damage (1D6 damage per ten feet onto grass, or 1D10 damage per 10 feet onto concrete); lose a valuable possession as it falls from your pocket (you may not notice this until later); become stranded, unable to go up or down.","insane":"If an insane investigator fails a pushed roll, he or she holds on for dear life and screams at the top of their lungs for as long as they can.","pushing":"reassessing the climb; taking a longer route; straining one’s reach."},{"name":"Computer Use","base":"05%","description":"This skill allows the investigator to program in various computer languages; retrieve and analyze obscure data; break into a secured system; explore a com plicated network; or detect or exploit intrusions, back doors, and viruses. Special manipulation of a computer system may require this roll. The Internet places a wealth of information at the fingertips of an investi gator. Use of the Internet to find highly specific and/or obscure information may require a combined dice roll for Computer Use and Library Use. This skill is not needed to use computers when surfing the Internet, collecting email or to run regular com mercially available software.","difficulty":["Hard difficulty: decipher and hack into a secure network without being identified or traced.","Regular difficulty: plenty of handholds; perhaps a rope or drainpipe to climb.","Hard difficulty: few handholds, or surfaces slick with rain."],"pushing":"taking longer to develop a program; using another’s code as a shortcut; using untested software (e.g. a virus) to exploit a system.","pushed_failure":"Sample Consequences of failing a","insane":"If an insane investigator fails a pushed roll, he or she is lost in cyberspace, and it will require physical intervention to get the person to stop using the computer or look away from the screen."},{"name":"Credit Rating","base":"0%","description":"A measure of how prosperous and financially confident the investigator appears to be. Money opens doors; if the investigator is attempting to use his or her financial status to achieve a goal then use of the Credit Rating skill may be appropriate. Credit Rating can be used in place of APP to gauge first impressions. Credit Rating is not so much a skill as a gauge of financial wealth, and should not be ticked as other skills are. A high Credit Rating can be a useful resource in play, and so should be paid for with skill points when creating an investigator. Each occupation has a starting range for Credit Rating, and skill points should be spent to achieve a rating therein. Call of Cthulhu is not a game that requires money to be carefully tracked; however, it is useful to know the bounds of an investigator’s financial reach—for example, can the investigator afford to employ a team of archaeologists and workers to excavate an Egyptian tomb? 1303236470154 An investigator’s Credit Rating can change over time. Investigators of the Cthulhu Mythos are prone to insanity, and this may lead to loss of employment and thus a lowering of the investiga tor’s Credit Rating score. See Credit Rating and Investigator Expenditure (page 95) for a more in-depth study of Credit Rating and its use.","difficulty":["Regular difficulty:","Hard difficulty: obtaining credit or a loan while implicated (or found guilty) in a criminal investiga tion; gaining favorable attention after being vilified in the media."],"pushing":"you offer your house and/or other valu ables to secure money from a loan shark; you attempt to pressure the bank manager into giving you a loan.","pushed_failure":"the loan shark turns nasty and directs his boys to teach you a lesson; the bank manager calls the police; you are loaned the money, but it is a ploy to put you in deeper debt with a mobster who plans to buy out your debt and later call on you for a favor.","insane":"If an insane investigator fails a pushed roll, he or she loses all faith in capitalism and begins freely handing out his or her money to passersby."},{"name":"Cthulhu Mythos","base":"0%","description":"This skill reflects understanding of the inhuman (Lovecraftian) Cthulhu Mythos. It is not founded on the accumulation of knowledge as academic skills are. Rather, it represents the opening and tuning of the human mind to the Cthulhu Mythos. Thus, Cthulhu Mythos skill derived from encoun tering Deep Ones (for example) is transferable to other situations and entities. Also referred to as \"that which man should not know,\" the Cthulhu Mythos is antithetical to human understanding, and exposure to it undermines human sanity. No investigator may take points in Cthulhu Mythos as a starting skill (unless agreed with the Keeper). There is no tick-box for Cthulhu Mythos on the investigator sheet, as successful use of the skill does not offer an increase in the investigator’s percentiles in the skill. Instead, points in Cthulhu Mythos are gained by encounters with the Mythos that result in insanity, by insane insights into the true nature of the universe, and by reading forbidden books and other Mythos writings. A character’s Sanity may never be higher than 99 minus his or her Cthulhu Mythos skill. As Cthulhu Mythos points proliferate, they crowd out Sanity points, and leave the investigator vulnerable. Whenever spoor or other evidence of Mythos monsters is found, a successful roll against this skill allows the investigator to identify the entity, deduce something about its behavior or guess at some property it may possess. A successful Cthulhu Mythos roll might also allow an investigator to remember some fact concerning the Mythos, identify a spell by seeing it cast, remember that a particular spell or piece of information may be found in a particular Mythos tome, or achieve some other task. The Cthulhu Mythos skill may also be used to manifest magical ‘spell-like’ effects.","difficulty":["Hard difficulty: to identify a mythos entity based upon rumors, legends or minimal evidence; to identify a possible vulnerability or knowledge that grants some minor advantage over a mythos entity after thorough research and firsthand experience."],"pushing":"getting closer to the creature for a better view; consulting dread tomes, or lore of humans (or other-","pushed_failure":"get too close, exposing oneself to harm or suspicion; unwittingly read aloud a passage from a tome that activates a summon ing spell; accidentally corrupt or destroy the evidence being studied.","insane":"If an insane investigator fails a pushed roll, he or she experiences a vision or revelation that reveals new truths about the Cthulhu Mythos, akin to an insane insight (with possible Cthulhu Mythos skill gain and/or associated Sanity loss)—see Insane Insight, page 169."},{"name":"Demolitions","base":"01%","description":"With this skill the user is familiar in the safe use of demolitions, including setting and defusing explosive charges. Mines and similar devices are designed to be easy to set (no roll required) and more difficult to remove or defuse. This skill also encompasses military-grade demolitions (anti-personnel mines, plastique, etc.) Given enough time and resources, those proficient may rig charges to demolish a building, clear a blocked tunnel, and repurpose explosive devises (such as constructing low yield charges, booby-traps, and so on).","difficulty":["Regular difficulty: to defuse an explosive device. To know where to place charges for greatest effect when destroying a bridge or building.","Hard difficulty: to defuse an explosive device in limited time."],"pushing":"taking until the very last second to defuse the bomb; double-checking all the circuits/connections by hand.","pushed_failure":"if defusing or removing an explosive device, the consequence of failing a pushed roll is clear—it explodes! If using the Demolitions skill to place charges, the consequence of failing a pushed roll may be a failure to detonate at the right time (or at all), or that the detonation fails to have the desired effect (either too great or too little).","insane":"If an insane investigator fails a pushed roll, he or she devises the most bizarre method of delivering the explosive, such as strapping it to a cat or to themselves."},{"name":"Disguise","base":"05%","description":"To be used whenever you wish to appear to be someone other than whom you are. The user changes posture, costume, and/or voice to enact a disguise, posing as another person or another sort of person. Theatrical makeup may help, as will fake ID.","difficulty":["Hard difficulty: to convince professionals in a face to-face meeting that you are who you say you are. For example, to pass as a bank employee to gain access to a bank vault."],"pushing":"undergoing a fully immersive and intensive preparation (losing oneself in the role); stealing personal items and utilizing them in the disguise; overt ex aggeration to confound the target; feigning a sudden attack of illness to disorient the observer.","pushed_failure":"Being arrested; causing offence, leading to violence or criminal charges; finding that the person being imitated is wanted by a criminal gang who come looking for vengeance.","insane":"If an insane investigator fails a pushed roll, the investi gator no longer recognizes his or her own face in the mirror, even when the disguise is removed."},{"name":"Diving","base":"01%","description":"The user is trained in the use and maintenance of diving equipment for swimming underwater, including underwater navigation, proper weighting, and emergency procedures. Prior to the invention of the Aqua-Lung in 1942, rigid diving suits were worn with air pumped from the surface through a connecting tube. In the modern age, a scuba diver will be familiar with the physics of diving, air pressure, and the physiological processes that occur when breathing with pressurized air.","difficulty":["Regular difficulty: routine dives using correct and well-maintained equipment.","Hard difficulty: diving in dangerous conditions or with poorly maintained equipment."],"pushing":"pushing the limits of the equipment; methodically double-checking equipment; gaining professional assistance.","pushed_failure":"become trapped underwater; attacked by sea creatures; suffer the bends.","insane":"If an insane investigator fails a pushed roll, he or she begins to understand whale-song; all you have to do is follow their instructions."},{"name":"Dodge","base":"halfDEX%","description":"Allows an investigator to instinctively evade blows, thrown missiles and so forth. A character may attempt to use dodge any number of times in a combat round (but only once against a specific attack; see Chapter 6: Combat). Dodge can increase through experience, like other skills. If an attack can be seen, a character can try to dodge it. It is impossible to dodge bullets because they cannot be seen when in mo tion; the best a character can do is to take evasive action that results in being harder to hit (“diving for cover”). The Dodge skill is mostly used in combat as part of an opposed roll and so no difficulty level is set. Note: as a combat skill, this cannot be pushed.","difficulty":["As a combat skill, Dodge is used in an opposed roll and no difficulty level is set. It cannot be pushed."],"aliases":["unnvikelse","unnvik"],"pushing":"Cannot be pushed."},{"name":"Drive Auto","base":"20%","description":"Anyone with this skill can drive a car or light truck, make ordinary maneuvers, and cope with ordinary vehicle problems. If the investigator wants to lose a pursuer or tail someone, a Drive roll would be appropriate. Some other cultures might replace this skill with a comparative one; the Inuit might use Drive Dogsled, or a Victorian might use Drive Carriage.","difficulty":["Regular difficulty: to successfully weave through light traffic at speed to avoid pursuit.","Hard difficulty: to successfully weave through heavy traffic at speed to avoid pursuit."],"pushing":"driving the vehicle to its limit; not slow ing down, regardless of the risk.","pushed_failure":"crashing; skidding to a halt, unable to proceed; being pursued by the police.","insane":"If an insane investigator fails a pushed roll, he or she will be found behind the wheel of a stationary vehicle making \"brum-brum\" noises."},{"name":"Electrical Repair","base":"10%","description":"Enables the investigator to repair or reconfigure electrical equipment, such as auto ignitions, electric motors, fuse boxes, and burglar alarms. In the present day, this skill has little to do with Electronics. To fix an electrical device may require special parts or tools. Jobs in the 1920s may call for this skill and for Mechanical Repair in combination. Electrical Repair may also be used in conjunction with modern explosives, such as blasting caps, C-4 plastic explosives, and mines. These weapons are designed to be easy to de ploy; only a fumble result will lead to misfire (remember the roll can be Pushed). Defusing explosives is far trickier, as they may be fitted with anti-tamper mechanisms; raise the level of difficulty when disarming explosives—see Demolitions skill.","difficulty":["Regular difficulty: repairing or creating a standard electrical device.","Hard difficulty: repairing something that is badly damaged; working without the proper tools."],"pushing":"taking longer to repair or reconfigure the equipment; taking a risky short cut.","pushed_failure":"take damage from an electric shock; blow the fuses and plunge the building into darkness; wreck the thing you are working on beyond repair.","insane":"If an insane investigator fails a pushed roll, he or she attempts to harness the electrical power of living organisms into the device.","aliases":["elec. repair","elec repair"]},{"name":"Electronics","base":"01%","description":"For troubleshooting and repairing electronic equipment. Allows simple electronic devices to be made. This is a skill for the present day—use Physics and Electrical Repair for electronic developments of the 1920s. Unlike the Electrical Repair skill, parts needed for electronics work often cannot be jury-rigged: they are designed for precise jobs. Often without the right microchip or circuit board, the skill-user is out of luck unless they can contrive some form of workaround.","difficulty":["Regular difficulty: repairing minor damage to a computer or electronic device — the kind of service one might expect under warranty.","Hard difficulty: use scavenged parts to jury-rig a tracking device to plant in someone’s car."],"pushing":"taking longer to construct or repair a device; researching new or other methodologies.","pushed_failure":"fry circuitry or other delicate parts; take damage from electric shock; create a device that does something other than what was intended.","insane":"If an insane investigator fails a pushed roll, he or she becomes paranoid, convinced that every item they come across contains electronic bugging devices: the telephone, the television, the refrigerator."},{"name":"Fast Talk","base":"05%","description":"Brawl (25%): includes all unarmed fighting and basic weapons that anyone could pick up and make use of, such as Fast Talk is specifically limited to verbal trickery, deception, and misdirection, such as bamboozling a bouncer to let you inside a club, getting someone to sign a form they haven’t read, making a policeman look the other way, and so on. The skill is opposed by Psychology or Fast Talk. After a brief period (usually after the fast talker has left the scene) the target will realize that they have been conned. The effect of Fast Talk is always temporary, though it will last longer if a higher level of success is achieved. Fast Talk may be used to haggle the price of an item or service down. If successful, the seller momentarily thinks that they have struck a good deal; however, if the buyer returns and attempts to purchase another item, the seller may refuse further haggling and even increase the price in order to re coup what they lost on the previous sale!","difficulty":["The difficulty level is based on the opposing factor — in this case the matching social skill (Charm, Fast Talk, Intimidate or Persuade) or Psychology, whichever is higher for the target.","Regular difficulty: the opposing skill is below 50.","Hard difficulty: the opposing skill is 50 or above.","Extreme difficulty: the opposing skill is 90 or above."],"pushing":"getting up close and personal to the target; talking outlandishly, aiming to confuse the target. Remember this is Fast Talk, so if the investigator begins to take an alternative approach, the Keeper may ask for a different skill to be used; if threats are used, it may become Intimidate, or if a protracted discussion ensues, it may be","pushed_failure":"cause great offence leading to violence, outrage, or criminal proceedings. If an insane investigator fails a pushed roll, he or she begins hurling random abusive phrases at people."},{"name":"Fighting","base":"varies%","description":"Fighting skill denotes a character’s skill in melee combat. You may spend skill points to purchase any skill specialization. The generic \"Fighting\" skill cannot be purchased. Choose fighting specializations appropriate to your investigator’s occupation and history. Those starting with a Fighting (Brawl) skill of 50% or higher may wish to choose a type of formal training as part of their background to account for his or her skill level. A myriad of fighting styles exist. Martial arts are simply a way of developing a person’s Fighting skill. Decide how the character learned to fight, whether it be formal military training, martial arts classes, or learned the hard way as a result of street-fighting. The term brawl might feel too crude for a skilled martial artist and could be replaced (with \"Karate\" for example) if a player so wished. Note: as a combat skill, this cannot be pushed. Fighting specializations: Axe (15%): use this skill for larger wood axes. A small hatch et can be used with the basic brawling skill. If thrown, use Throw skill. clubs (up to cricket bats or baseball bats), knives, and many improvised weapons, such as bottles and chair legs. To determine the damage done with an improvised weapon, the Keeper should refer to the weapon chart and pick something comparable. Chainsaw (10%): the first gasoline-powered, mass-pro duced chainsaw appeared in 1927; however, earlier versions existed. Flail (10%): nunchaku, morning stars, and similar medieval weapons. Garrote (15%): any length of material used to strangle. Requires the victim to make a Fighting Maneuver to escape, or suffer 1D6 damage per round. Spear (20%): lances and spears. If thrown, use Throw skill. Sword (20%): all blades over two feet in length. Whip (05%): bolas and whips. Note: Thrown knives use the Throw skill. Weapons and their skill categories are listed in Table XVII: Weapons (pages 401-405). The above specializations may not cover all weapons, but where possible try to fit other weapons into one of the above categories. Chainsaw is included as a weapon because of its use in numerous films, but players should note that the chance of a fumble is dou bled and that they risk killing their investigator (or losing a limb) should this happen.","difficulty":["As a combat skill, Fighting is used in an opposed roll and no difficulty level is set. It cannot be pushed."],"aliases":["brawl","slåsskamp","nærkamp"],"pushing":"Cannot be pushed."},{"name":"Firearms","base":"varies%","description":"Covers all manner of firearms, as well as bows and crossbows. You may spend skill points to purchase any skill specialization. The generic \"Firearms\" skill cannot be purchased. Choose specializations appropriate to your investigator’s occupation and history. Note: as a combat skill, this cannot be pushed. Firearms specializations: Bow (15%): use of bows and crossbows, ranging from medieval longbows to modern, high-powered compound bows. Handgun (20%): use for all pistol-like firearms when firing discrete shots. For machine pistols (MAC-11, Uzi pistol, etc.) in Modern era games, use the Submachine Gun skill when firing bursts. Heavy Weapons (10%): use for grenade launchers, anti-tank rockets, etc. Flamethrower (10%): weapons projecting a stream of ig nited flammable liquid or gas. May either be carried by the operator or mounted on a vehicle. Machine Gun (10%): weapons firing bursts from a bipod or tripod mounted weapon. If single shots are fired from a bipod, use Rifle skill. The differences between assault rifle, submachine gun and light machine gun are tenuous today. Rifle/Shotgun (25%): with this skill any type of rifle (whether lever-action, bolt-action or semi-automatic) or scatter-gun can be fired. Since the load from a shotgun expands in a spreading pattern, the user’s chance to hit does not decrease with range, but the damage dealt does. When an assault rifle fires a single shot (or multiple singles) use this skill. Submachine Gun (15%): use this skill when firing any machine pistol or submachine gun; also for assault rifles set on burst. Note: Thrown knives use the Throw skill. Firearms are listed in the Table XVII: Weapons (pages 401-405).","difficulty":["As a combat skill, Firearms is used in an opposed roll and no difficulty level is set. It cannot be pushed."],"aliases":["skytevåpen"],"pushing":"Cannot be pushed."},{"name":"First Aid","base":"30%","description":"The user is able to provide emergency medical care. This might encompass: applying a splint to a broken leg, stemming bleeding, treating a burn, resuscitating a drowning victim, dressing and cleaning a wound, etc. First Aid cannot be used to treat diseases (where the Medicine skill is required). To be effective, First Aid must be delivered within one hour, in which case it grants 1 hit point. It may be attempted once, with subsequent attempts constituting a Pushed roll. Two people can work together to administer First Aid, with a success granted if either one of them rolls a success. Successful use of First Aid can rouse an unconscious person to consciousness. A character is limited to one successful treatment of both First Aid and Medicine until further damage is taken. When treating a dying character, successful First Aid stabilizes him or her for one hour and grants 1 temporary hit point. At the end of the hour, and each hour thereafter, the character must make a successful CON roll to remain stabilized, otherwise (with a failed CON roll) the character is dying and loses the temporary hit point and must now make a CON roll per round thereafter to stave-off death. If the character survives until the following round, First Aid can be attempted again (by up to two individuals). This can be continued (without constituting a Pushed roll) until stabilization or death. First Aid (and only First Aid) can save the life of a dying character, after which they must receive a successful Medicine roll or be hospitalized. Thus, First Aid is an important skill to have, alongside Medicine, if you wish to be an effective medic.","difficulty":["Administering First Aid to a fellow human is always of Regular difficulty level. If one were treating an alien being whose physiology was unfamiliar, the difficulty level would be higher."],"pushing":"taking longer to treat the patient; em ploying high-risk methods to stabilize the wound.","pushed_failure":"make things worse, causing an additional point of damage. If an insane investigator fails a pushed roll, he or she feels compelled to \"heal\" the person, even if it means ampu tation or worse. In effect their endeavors constitute physical attacks which may lead to murder if they are not stopped."},{"name":"History","base":"05%","description":"Enables an investigator to remember the significance of a country, city, region, or person, as pertinent. A successful roll might be used to help identify tools, techniques, or ideas familiar to ancestors, but little known today.","difficulty":["Regular difficulty: to recall some pertinent and useful information.","Hard difficulty: to know some obscure, detailed and useful information."],"pushing":"taking more time to examine; conducting further research; consulting another expert; hiring assistants to conduct detailed research, taking months, and at a huge cost.","pushed_failure":"consul tations alert your adversaries, who become aware of your intent; your facts are erroneous and lead you into danger;"},{"name":"Hypnosis","base":"01%","description":"The user is able to induce a trancelike state in a willing target who experiences heightened suggestibility, relaxation, and possible recall of forgotten memories. The limits of hyp notism should be decided by the Keeper to fit their game; it may be that only willing subjects can be hypnotized, or the Keeper may allow it to be used on unwilling targets in a more aggressive manner. This skill may be utilized as hypnotherapy on those suffering mental trauma, reducing the effects of a phobia or mania in a patient (successful use means that the patient overcomes the phobia or mania on one occasion). Note that a series of successful hypnotherapy sessions may be needed to fully cure someone of a phobia (minimum of 1D6 ses sions, at the Keeper’s discretion).","difficulty":["Hypnosis is opposed with Psychology or POW for an unwilling subject."],"pushing":"increasing your influence on the target by ensuring their full and undivided attention; assaulting","pushed_failure":"some past memory or trauma is bought to the surface, causing the target 1D6 Sanity loss; the target falls into a trance, causing them to walk in front of a bus at a later time; the target’s mind (or the investigator’s mind) is temporarily emptied, allowing possession by a malevolent entity.","insane":"If an insane investigator fails a pushed roll, his or her mind regresses to a childlike state until treatment is administered."},{"name":"Intimidate","base":"15%","description":"Intimidation can take many forms, including physical force, psychological manipulation, and threats. It is used to fright en or compel a person to act in a certain way. Intimidate is opposed by Intimidate or Psychology. Backing up intimidation with a weapon or some other powerful threat or incentive may reduce the difficulty level. When Pushing an Intimidation roll, one possible consequence of failure is carrying out one’s threat, perhaps beyond the level of that which was intended. Intimidate may be used to force down the price of an item or service. If successful, the seller may reduce the price, or hand the item over free of charge, but depending on the situation they may later report the incident to the police or to members of the local organized crime gang.","difficulty":["The difficulty level is based on the opposing factor — in this case the matching social skill (Charm, Fast Talk, Intimidate or Persuade) or Psychology, whichever is higher for the target.","Regular difficulty: the opposing skill is below 50.","Hard difficulty: the opposing skill is 50 or above.","Extreme difficulty: the opposing skill is 90 or above."],"pushing":"Causing actual physical harm to the target or to something or someone that the target cares about. Remember that this is Intimidation; if the investigator begins to take an alternative approach, the Keeper may ask for a different skill to be used. If the threats are retracted and the investigator then tries to befriend the target, it may become Charm; or if a protracted and unthreatening discussion ensues, it may become Persuade. Switching from one to the other to gain a second roll still constitutes a Pushed roll.","pushed_failure":"accidentally pulling the trigger of the gun you’re waving in the target’s face; the target’s mind snaps, resulting in violence or inane babbling, after which no more can be gained; the target simply laughs in your face and won’t break no matter what you do; the target somehow turns the tables and intimidates the intimidator.","insane":"If an insane investigator fails a pushed roll, he or she becomes intensely fearful of the target and does their bidding."},{"name":"Jump","base":"20%","description":"With success, the investigator may leap up or down vertically, or jump horizontally from a standing or running start. When falling, Jump may be used to lessen the potential fall damage. Judgment must be exercised as to what constitutes a regular jump, a hard jump or an extreme jump (respectively requiring Regular success, Hard success, and Extreme success). As a guide, a regular success would be required for an investigator to safely leap down vertically to his or her own height, jump horizontally from a standing start across a gap for a distance equal to the jumper’s own height, or run and then jump horizontally to a distance of twice the jumper’s own height. One might achieve double this distance with an Extreme success, although bear in mind the world record for the long jump is around 29 feet. If falling from a height, a successful Jump prepares for the fall, reducing resultant damage by half.","difficulty":["Regular difficulty: safely leap down vertically a distance equal to the jumper’s own height; jump horizontally from a standing start, across a gap for a distance equal to the jumper’s own height; run and then jump horizontally to a distance of twice the jumper’s own height.","Hard difficulty: as for a regular difficulty but increase distances by 50%; perhaps attempting to jump from a rooftop and through the window of a neighboring building across the alley."],"pushing":"Delaying and taking time to assess the jump; throwing all your weight and force behind the jump—really stretching for it. In some instances a Pushed roll is not possible; if one leaps across an abyss one cannot have a second attempt. However, if one is trapped in a pit and jumping to escape, one could have any number of at","pushed_failure":"fall and suffer physical harm; achieve the jump but a valuable possession (of the Keeper’s choice) is dropped in the process.","insane":"If an insane investigator fails a pushed roll, he or she will become convinced that they can fly."},{"name":"Language (Own)","base":"EDU%","description":"When choosing this skill, the exact language must be specified and written next to the skill. In infancy and early childhood, most humans use a single language. The tongue chosen by the player for the Own Language automatically starts as equal to the investigator’s EDU characteristic; thereafter the investigator understands, speaks, reads, and writes at that percentage or higher (if further skill points are added during investigator creation).","difficulty":["Regular difficulty: to read or write at the level of an educated speaker.","Hard difficulty: to grasp obscure, archaic or highly technical usage."],"pushing":"see Language (Other) skill, above.","aliases":["language (own)","own language","eget språk"]},{"name":"Language, Other","base":"01%","description":"When choosing this skill, the exact language must be specified and written next to the skill. An individual can know any number of languages. The skill represents the user’s chance to understand, speak, read and write in a language other than his or her own. Ancient or unknown languages (such as Aklo, Hyper borean, etc.) should not be chosen (unless agreed with the Keeper), but ordinary earthly languages may be. The Keeper may raise the difficulty level if archaic speech or writing in that language is encountered. A single successful Other Language roll normally allows comprehension of an entire book. Suggestions regarding the Other Languages skill:","difficulty":["At 5% skill a language can be correctly identified without need for a roll.","At 10% skill simple ideas can be communicated. i At 30% transactional requests can be understood. i At 50% skill a person is fluent.","At 75% skill in a character can pass for a native speaker of a foreign language.","To identify a present-day human language (unknown to the investigator), use a Know roll.","To identify an extinct human language, use an Archaeology or History roll.","To identify an alien language, use a Cthulhu Mythos or possibly an Occult roll.","Regular difficulty: conversation (perhaps at speed); written material containing a few technical or uncommon terms.","Hard difficulty: high content of unusual technical terms; historically archaic phrases; speaker has unusual dialect."],"pushing":"taking longer to think through the words you want to say; taking long pauses to answer what you have been told; referencing other books to make a translation.","pushed_failure":"exaggerated or loud discussions between investigators and third parties alert some enemy faction to the investigators’ intentions; a word or phrase is misunderstood (perhaps the meaning is reversed); the listener takes offense to an unintentional slur, and they respond with their fists, or turn everyone in the neighborhood against you.","insane":"If an insane investigator fails a pushed roll, he or she begins to speak in tongues, or imagines that they are using the Enochian language.","aliases":["language (other)","other language","language","språk","annet språk"]},{"name":"Law","base":"05%","description":"Represents the chance of knowing pertinent law, precedent, legal maneuvers or court procedure. The practice of law as a profession can lead to great rewards and political office, but it requires intense application over many years—a high Credit Rating is also usually crucial in this regard. In the United States, the State Bar of a particular state must sanc tion one’s practice of law. When in a foreign country the level of difficulty may be increased when using this skill, unless the character has spent many months studying that nation’s legal system.","difficulty":["Regular difficulty level: understanding and utilizing the details of a relevant law or legal procedure.","Hard difficulty: remembering or understanding an obscure legal precedent, or cross-examining a highly competent hostile witness."],"pushing":"delaying to consider your argument; explaining in high detail the nuances of the case/situation; taking significant time to conduct research; bending the letter of the law to drive your argument.","pushed_failure":"misinter preting a law or stepping outside of the accepted legal procedure leads you to break the law and draws police attention; wasting valuable time and money on research and legal fees; you are held in contempt of court and thrown in the cells for at least 24 hours."},{"name":"Library Use","base":"20%","description":"Library Use enables an investigator to find a piece of information, such as a certain book, newspaper, or reference in a library, collection of documents or database, assuming the item is there. Use of this skill marks several hours of continuous search. This skill can locate a locked case or rare-book special collection, but Persuade, Fast Talk, Charm, Intimidate, Credit Rating, or special credentials may have to be used to get access to the books or information in question.","difficulty":["Regular difficulty: locating a book or piece of information in a library.","Hard difficulty: identifying a piece of information in a disorganized library, or if you are extremely pressed for time."],"pushing":"pressing the librarian for extensive as 325488350038","pushed_failure":"finding a similar book, containing misleading information, which will lead the investigators into danger; entanglement with an adversary—perhaps they are alerted to your research and act against you, or they check out the book you are searching for (or simply tear out the pages in question); getting into an argument with the librarian, resulting in your library membership being revoked.","insane":"If an insane investigator fails a pushed roll, he or she hoards"},{"name":"Listen","base":"20%","description":"Measures the ability of an investigator to interpret and un derstand sound, including overheard conversations, mutters behind a closed door, and whispered words in a cafe. The Keeper may use it to determine the course of an impending encounter: was your investigator awakened by that cracking twig? By extension, a high Listen skill can indicate a good level of general awareness in a character.","difficulty":["Regular difficulty: hearing something approaching you (with a Stealth skill of below 50); eavesdropping on a nearby conversation.","Hard difficulty: hearing something creep up on you (with a Stealth skill of 50 to 89); eavesdropping on whispered conversation."],"pushing":"stopping dead still and listening; getting closer to the presumed source (e.g. putting your ear to the train track or the door); telling everyone to be quiet (making a noise yourself) and then listening.","pushed_failure":"the \"thing\" has caught you unawares (you are surprised); you misheard the conversation and get the facts mixed up; you are caught trying to eavesdrop, and find yourself in a very embarrassing predicament.","insane":"If an insane investigator fails a pushed roll, he or she becomes overly sensitive to all sounds and is unable to operate without earplugs or similar."},{"name":"Locksmith","base":"01%","description":"A locksmith can open car doors, hot-wire autos, jimmy library windows, figure out Chinese puzzle boxes, and penetrate ordinary commercial alarm systems. The user may repair locks, make keys, or open locks with the aid of Library Use will turn up shocking clues. skeleton keys, picks and other tools. Especially difficult locks may be of a higher difficulty level.","difficulty":["Regular difficulty: opening or repairing a standard lock.","Hard difficulty: opening a high-security lock."],"pushing":"completely dismantling the lock; taking longer; using force to pry the mechanism.","pushed_failure":"the lock is damaged beyond repair (perhaps your lock pick has snapped off inside the lock); you break the puzzle box (perhaps only smashing it will open it now); you trip an alarm, or make enough noise for someone or something to come looking…","insane":"If an insane investigator fails a pushed roll, he or she gives up on the lock in question and realizes the higher purpose of unlocking their own mind; a veil has been lifted from their eyes, and they see the world in a new way that makes complete sense to them, but no sense to anyone of sound mind."},{"name":"Lore","base":"01%","description":"[Uncommon] This skill represents a character’s expert understanding of a subject that falls outside the normal bounds of human knowledge. Specializations of Lore should be specific and unusual, such as Dream Lore, Necronomicon Lore, UFO Lore, Vampire Lore, Werewolf Lore or Yaddithian Lore. Where the Keeper wishes to test an investigator’s knowledge of something that falls within the bounds of one of these fields of Lore, but the investigator lacks the relevant Lore specialization, the Keeper may allow for another (more general) skill to be used but require a higher level of success. Lore skills are also used as a shorthand method of communicating the knowledge of a non-player character to the Keeper. In the main, knowledge is represented by the EDU characteristic and specific skills, such as History or Cthulhu Mythos. The Keeper should decide when the Lore skill should be incorporated into the game — usually only when a particular area of specialist knowledge is central to the campaign.","difficulty":["Regular difficulty: to recall what is common knowledge within that body of lore.","Hard difficulty: to recall something obscure, or to use a more general skill (such as History) in place of the Lore specialization the investigator lacks."],"aliases":["lore"],"pushing":"taking more time; consulting a rarer source or another expert."},{"name":"Mechanical Repair","base":"10%","description":"This allows the investigator to repair a broken machine or to create a new one. Basic carpentry and plumbing projects can be performed, as well as constructing items (such as a pulley system) and repairing items (such as a steam pump). Special tools or parts may be required. This skill can be used to open common household locks, but nothing more advanced—see the Locksmith skill for more complex locks. Mechanical Repair is a companion skill to Electrical Repair, and both may be necessary to fix complex devices, such as a car or an aircraft.","difficulty":["Regular difficulty: repair or create a simple device; open a basic lock.","Hard difficulty: repair a very badly damaged device; create a complex device with limited resources.","Regular difficulty: diagnosis and treatment of standard medical ailments, with access to equipment (at least a doctor’s bag containing drugs and instruments) and a suitable environment.","Hard difficulty: diagnosis and treatment in a dirty and unsafe environment, with the minimum of equipment."],"pushing":"completely dismantling the device; taking longer; risk using excessive force to \"knock\" the device into action (e.g. hitting the thing until it works).","pushed_failure":"you have broken the device beyond repair; you hurt yourself while working on the device (perhaps cutting your hand, etc.); you become obsessed with the device and find you have spent the whole day and night working on it.","insane":"If an insane investigator fails a pushed roll, he or she fills a telephone directory-sized notepad with scribbled designs, culminating in the creation of a bizarre device using organic matter and household appliances.","aliases":["mech. repair","mech repair"]},{"name":"Medicine","base":"01%","description":"The user diagnoses and treats accidents, injuries, diseases, poisonings, etc., and makes public health recommendations. If an era has no good treatment for a malady, the effort is limited, uncertain, or inconclusive. The Medicine skill grants knowledge of a wide variety of drugs and potions, natural and man-made, and understanding of the side effects and contraindications. Treatment using the Medicine skill takes a minimum of one hour and can be delivered any time after damage is taken, but if this is not performed on the same day, the difficulty level is increased (requiring a Hard success). A person treated successfully with Medicine recovers 1D3 hit points (in addition to any First Aid they have received), except in the case of a dying character, who must initially receive successful First Aid to stabilize them before a Medicine roll is made. A character is limited to one treatment of First Aid and Medicine until further damage is taken (except in the case of a dying character who may require stabilizing with First Aid multiple times). Successful use of Medicine can rouse an unconscious person to consciousness. In treating Major Wounds, successful use of the Medicine skill provides the patient a Bonus die on their weekly recovery roll. The Keeper may grant automatic success for medical treatment in a contemporary, well-equipped hospital.","difficulty":["Regular difficulty: diagnosis and treatment of standard medical ailments, with access to equipment (at least a doctor’s bag containing drugs and instruments) and a suitable environment.","Hard difficulty: diagnosis and treatment in a dirty and unsafe environment, with the minimum of equipment."],"pushing":"consulting with colleagues; conducting further research; trying something experimental or more risky; performing some form of clinical experiment."},{"name":"Natural World","base":"10%","description":"Originally the study of plant and animal life in its environment. By the nineteenth century, this study had long separated into a range of academic disciplines (Biology, Botany, etc.) As a skill, Natural World represents the traditional (unscientific) knowledge and personal observation of farmers, fishermen, inspired amateurs, and hobbyists. It can identify species, habits, and habitats in a general way, and identify tracks, spoors, and calls, as well as allowing guesses as to what may be important to a particular species. For a scientific understanding of the natural world, one should look to the Biology, Botany and Zoology skills. Natural World may or may not be accurate—this is the region of appreciation, judgment, folk tradition, and enthu siasm. Use Natural World to judge horseflesh at the county fair, or decide whether a butterfly collection is excellent or just excellently framed.","difficulty":["Regular difficulty: identifying a particular species; remembering some common lore; knowing the best place to catch some fish.","Hard difficulty: identifying an unusual specimen; locating a rare species of plant or animal; remembering a very obscure factor piece of lore."],"pushing":"spending much longer (forgetful of the time) examining the habitat; tasting the unknown mush room or plant to get a better idea what it is; consulting with the old woman in the village about the local wildlife.","pushed_failure":"you spend long hours obsessively poring over books to identify the species; you get the facts wrong, and instead of the wasps being repelled by your concoction of swamp mud and herbs, they are drawn to you (with painful results); you picked the wrong mushroom and find yourself, hours later, walking naked towards a policeman.","insane":"If an insane investigator fails a pushed roll, he or she goes native and will be lost in the wilderness until friends come to their aid."},{"name":"Navigate","base":"10%","description":"Allows the user to find his or her way in storms or clear weather, in day or at night. Those of higher skill are familiar with astronomical tables, charts, instruments, and satellite location gear, as they exist in the era of play. One could also use this skill to measure and map an area (cartography), whether an island of many square miles or the interior of a single room—use of modern technology may lower or negate the difficulty level. Rolls for this skill may be made as concealed rolls by the Keeper—a matter for the investigators to attempt, and later witness the results. If the character is familiar with the area, a bonus die should be granted to the roll.","difficulty":["Regular difficulty: keep on the right route; use the sun and stars to identify compass positions; map a small area of terrain.","Hard difficulty: head in the right direction when there is no clear route or landmarks; map a large area of complex terrain."],"pushing":"getting the map out and delaying while you attempt to work out where you are; going back to where you started from and trying again.","pushed_failure":"you get lost and find yourself being watched or ambushed by a bear; you go round and round in circles, and your companions stop following you (you’re on your own now…); you mistake the stars, and rather than getting away from the cultists' search parties, you end up back at the cult’s hidden base.","insane":"If an insane investigator fails a pushed roll, he or she throws away the map (as happens in The Blair Witch Project) and follows their intuition. Their intuition does not work."},{"name":"Occult","base":"05%","description":"The user recognizes occult paraphernalia, words and concepts, as well as folk traditions, and can identify grimoires of magic and occult codes. The occultist is familiar with the families of secret knowledge passed down from Egypt and Sumer, from the Medieval and Renaissance West, and perhaps from Asia and Africa as well. Comprehending certain books may provide percentiles of Occult. This skill does not apply to spells, books, and magic of the Cthulhu Mythos, although worshipers of the Great Old Ones often adopt occult ideas. Whether non-Mythos magic is real or fraudulent in your game is for the Keeper to determine (see Chapter 9: Magic).","difficulty":["Regular difficulty: recall information from folklore or occult theories; understand the meaning of tarot cards or other divination techniques.","Hard difficulty: identify rare or unique occult tomes; recall the finer details of secret occult practices and rituals."],"pushing":"taking more time to study the site or item; conducting further research; consulting another expert; purging oneself and undertaking extreme personal preparation in advance of ritual performance.","pushed_failure":"information is misremembered, and the ritual is performed incorrectly with disastrous consequences (perhaps the house is burned to the ground); in preparing the circle of protection, you use the wrong ingredients, and rather than ward off the spirits you genuinely summon something malevolent; your research has uncovered a hitherto unknown Mythos link, and your realization shatters your mind (SAN loss).","insane":"If an insane investigator fails a pushed roll, this is likely to manifest in some form on obsession: perhaps the investigator tattoos occult symbols upon his or her cheeks and palms, or cannot act without first using a scrying crystal to divine their future."},{"name":"Operate Heavy Machinery","base":"01%","description":"Required to drive and operate a tank, backhoe, steam shovel, or other large-scale construction machine. For very different sorts of machines, the Keeper may decide to raise the difficulty level if the problems encountered are mostly unfamiliar ones; someone used to running a bulldozer, for instance, will not be quickly competent with the steam tur bines in a ship’s engine room.","difficulty":["Regular difficulty: operate a crane or road digger.","Hard difficulty: manipulate the machinery to achieve some delicate or specific task, such as un earthing delicate dinosaur eggs with a mechanical digger without breaking them."],"pushing":"going step-by-step with the operating manual; taking time to practice; seeking a teacher.","pushed_failure":"you’re driv ing the bulldozer, but get overconfident, and lose control so it veers into a brick wall (the wall comes down on you, or perhaps worse).","insane":"If an insane investigator fails a pushed roll, he or she may believe they are tasked with unearthing or building a temple to the old ones."},{"name":"Persuade","base":"10%","description":"Use Persuade to convince a target about a particular idea, concept, or belief through reasoned argument, debate and discussion. Persuade may be employed without reference to truth. The successful application of Persuade takes time: at least half an hour. If you want to persuade someone quickly, you should use Fast Talk. Depending on the goal expressed by the player, if the investigator takes sufficient time, the effect may linger indef Intimidate; or if the investigator is relying on befriending the target, it may become Charm. Switching from one to the other to gain a second roll still constitutes a Pushed roll.","difficulty":["The difficulty level is based on the opposing factor — in this case the matching social skill (Charm, Fast Talk, Intimidate or Persuade) or Psychology, whichever is higher for the target.","Regular difficulty: the opposing skill is below 50.","Hard difficulty: the opposing skill is 50 or above.","Extreme difficulty: the opposing skill is 90 or above."],"pushed_failure":"the target takes great offence and refuses to have any more to do with you; your bribe worked and the target signed the forms—however in the cold light of morning they feel they have been duped, and now their solicitor has employed a private eye to find out what you’re up to, or is suing you for malpractice; the target doesn’t like your big talk and, from out of nowhere, they pull a knife on you; you persuaded the security guard to turn a blind eye to your robbery—however they lose their job and, wracked with guilt, they commit sui cide (the full implications of your actions hit you and you lose Sanity for causing the death of an innocent).","insane":"If an insane investigator fails a pushed roll, they may be found later on a street corner trying to convince passersby of their argument or bizarre point of view.","pushing":"getting close and personal to advance your argument or appeal to the target’s reason; demonstrating through logical reasoning and examples, in detail; using carefully preplanned suggestion techniques to make the target as receptive as possible; putting on a grand show (staging, fireworks, free gifts, free drinks, bribes) to push your point of view front-and-center for a group of people. Remember that this is Persuade: if the investigator changes approach the Keeper may ask for a different skill — threats become Intimidate, befriending becomes Charm. Switching between them to gain a second roll still constitutes a pushed roll."},{"name":"Pilot","base":"01%","description":"The air or water equivalent of Drive Automobile, this is the maneuver skill for flying or floating craft. You may spend skill points to purchase any skill specialization. The generic Pilot skill cannot be purchased. An investigator might have several versions of this skill in the spaces on the investigator sheet (such as Pilot Aircraft, Pilot Dirigible, etc.). Each starts at 01%. Anyone with modest skill can sail or fly on a calm day with good visibility, although skill rolls are required for storms, navigation by instrument, low visibility, and other difficult situations. Bad weather, poor visibility, and damage may raise the difficulty level of skill rolls to pilot air and water craft.","difficulty":["Regular difficulty: make an emergency landing with a light aircraft in a farmer’s field.","Hard difficulty: pilot the craft in very poor conditions (e.g. extremely bad weather, faulty equipment)."],"pushing":"pulling the aircraft up and making a second and final attempt at landing; pushing the vehicle to its limit; making a risky maneuver to lose a pursuer.","pushed_failure":"the results of a failed roll should fit the situation. It may be that the craft is somehow damaged, and repairs will have to be made before it can be used again (which may prove impossible in remote locations); passengers are injured during the maneuver or accident; you emergency-landed the plane in the jungle, and awake tied to large stones that circle a huge, bubbling cooking pot. Reserve burning wrecks for excep","insane":"If an insane investigator fails a pushed roll, he or she will believe that they are capable of death-defying stunts. They are not."},{"name":"Psychoanalysis","base":"01%","description":"The skill refers to the range of emotional therapies, not just to Freudian procedures. Formal psychotherapy was still in its infancy in the 1890s, though some procedures are as old as humanity. Sometimes it was looked on as a fraudulent study, even in the 1920s. The common term then for an analyst or scholar of emotional disorders was alienist. In the present day, a combination of therapies has evolved, and this skill now could be justly named Psychiatric Treatment. Intensive psychoanalysis can return Sanity points to an investigator patient. Once per game month, to learn the progress of the therapy, make a 1D100 roll against the analyst or doctor’s Psychoanalysis skill. If the roll succeeds, the patient gains 1D3 Sanity points. If the roll fails, add no points. If the roll is fumbled, then the patient loses 1D6 Sanity points, and treatment by that analyst concludes: there has been some sort of serious incident or dramatic setback in the therapy, and the relationship between patient and therapist has broken down beyond saving. In the game, psychoanalysis alone does not speed recovery from indefinite insanity, which requires 1D6 months of institutional (or similar) care, of which psychotherapy may form a part. Successful use of this skill can allow a character to cope with the subject of a phobia for a short time, or to see delu sions for what they are. In play this would allow for an insane investigator to ignore the effects of a phobia or mania for a brief period, allowing a claustrophobe to hide in a broom cupboard for ten minutes, for example. Equally a person might make a Psychoanalysis roll to help a delusional investi gator see through their hallucination for a brief period. Treatment by a psychotherapist can add Sanity points during indefinite insanity (see Sanity, page 154). Psychoanalysis cannot increase a person’s Sanity points above 99–Cthulhu Mythos.","difficulty":["Regular difficulty: standard therapy within a hospital setting.","Hard difficulty: intermittent therapy over a longer period."],"pushing":"this is a skill which can be attempted month after month without requiring a Pushed skill roll. However, if one failed the skill roll in a given month, one might choose to push a roll during a single session on the following day with some form of radical intervention (if a quick result was required). For example, forcing a patient to face their fear by actively forcing them to confront its phys","pushed_failure":"curing the patient’s fear of spiders by locking them in a room full of tarantulas backfires as the patient goes berserk (possible damage to self and to others) and now thinks they are the \"spider king\" (the patient now has a new mania and has lost additional Sanity points—the therapist should make a Sanity roll too, as their actions caused this!)"},{"name":"Psychology","base":"10%","description":"A perception skill common to all humans, it allows the user to study an individual and form an idea of another person’s motives and character. The Keeper may choose to make concealed Psychology skill rolls on the player’s behalf, announcing only the information, true or false, that the user gained by employing it.","difficulty":["Regular difficulty: read someone’s intent or determine if the person is lying if their relevant skill (Intimidate, Fast Talk, Persuade, and Charm) is below 50%.","Hard difficulty: read someone’s intent or determine if the person is lying if their relevant skill (Intimidate, Fast Talk, Persuade, and Charm) is between 50% and 89%."],"pushing":"putting yourself in an obvious position","pushed_failure":"you somehow reveal your own motivations to the target; the target is offended by your prying questions or curious stare, and refuses to speak with you further, or takes action against you (perhaps violence or a call to the police); unknown to you, the target is connected with your adversaries, and you unwittingly reveal your own agenda to them; spending all week locked in your room in order to build the profile has left you a physical and mental wreck (penalty die to all rolls until you recover).","insane":"If an insane investigator fails a pushed roll, he or she be lieves that they hear the target’s evil thoughts, and launches a physical attack upon them.","aliases":["psykologi"]},{"name":"Read Lips","base":"01%","description":"This skill allows the inquisitive investigator to listen in on a conversation, without requiring them to hear the speakers. Line of sight is necessary, and if only one speaker’s lips can be seen (the other presumably with their back to the lip reader) then only half of the conversation can be deciphered. Read Lips may also be used to silently communicate with another person (if both are proficient), allowing for relatively complex phrasing and meaning.","difficulty":["Regular difficulty: understand the spoken commu nication of a person who is in clear sight and in relatively close proximity.","Hard difficulty: determine the spoken commu nication of a person whose mouth is occasionally obscured and/or is some distance away (e.g. in a large crowd of people)."],"pushed_failure":"the target becomes aware that you are watching them intently, and takes offense and confronts you; the drunken man across the bar is angered, mistakenly thinking that you are looking at him, and punches you; you are so intent on the target that you miss what is happening in your close proximity (someone steals your case, or you walk into a lamp post).","insane":"If an insane investigator fails a pushed roll, there is plenty of scope for imagining all manner of strange and bizarre things being said.","pushing":"putting yourself in an obvious position and staring unsubtly at the target(s); filming the target (and thus likely to be observed filming the target)."},{"name":"Ride","base":"05%","description":"This skill is intended to apply to saddle horses, donkeys, or mules, and grants knowledge of basic care of the riding animal, riding gear, and how to handle the steed at a gallop or on difficult terrain. Should a steed unexpectedly rear or stumble, the rider’s chance of remaining mounted equals his or her Ride skill. Riding side-saddle increases the level of difficulty by one level. An unfamiliar mount (such as a cam el) might be ridden successfully, but the level of difficulty would be higher. If an investigator falls from a mount, either because the animal has collapsed, fallen or died (or because a pushed Ride roll failed), at least 1D6 hit points are lost in the acci dent—although a Jump roll can negate this loss.","difficulty":["Regular difficulty: riding at speed; holding onto a scared mount.","Hard difficulty: riding a mount at speed in rough, unfamiliar terrain where weather conditions are poor (e.g. a heavily wooded forest at night in the pouring rain)."],"pushing":"whipping or pushing the mount aggres sively—perhaps forcing a horse to jump a ravine or high ditch; taking the risk of keeping your mount rather than jumping clear as trouble approaches.","pushed_failure":"rider is thrown from mount and takes falling damage; mount is injured; rider’s foot is entangled in the mount’s bridle and the rider ends up being dragged for some distance.","insane":"If an insane investigator fails a pushed roll, he or she becomes obsessed with the animal."},{"name":"Science","base":"01%","description":"Practical and theoretical ability with a science specialty would suggest some degree of formalized education and training, although a well-read amateur scientist may also be a possibility. Understanding and scope is limited by the era of play. You may spend skill points to purchase any skill specialization. The generic Science skill cannot be purchased. Each specialty covers a particular discipline and the list given is not exhaustive. Many specialties cross and overlap in knowledge, for example Mathematics and Cryptography, Botany and Biology, Chemistry and Pharmacy. When a character does not have the obvious discipline specialty, they may roll against an allied specialty with the level of difficulty increased (or penalty die) at the Keeper’s discretion.","difficulty":["Regular difficulty: conducting an experiment; being aware of current scientific theory within your field of specialty: working with proper equipment.","Hard difficulty: conducting a particularly demanding experiment; deciphering disorganized/partial scientific records; working with improvised equipment."],"pushing":"taking more time for study; conducting further research (perhaps in a better-equipped laboratory); consulting another expert; taking risks.","pushed_failure":"the experiment goes completely awry, causing unforeseen damage (explosion, fire, electrical shock, expulsion to the sixth dimension, etc.); you incorrectly prepare the formulae for the magical powder, with disastrous results.","insane":"If an insane investigator fails a pushed roll, he or she begins to explore an aspect of weird science related to their specialization. This may ultimately lead to actual developments akin to those of Crawford Tillinghast (from Lovecraft’s story From Beyond)."},{"name":"Sleight of Hand","base":"10%","description":"Allows the visual covering-up, secreting, or masking of an object or objects, perhaps with debris, cloth, or other inter vening or illusion-promoting materials, perhaps by using a secret panel or false compartment. Larger objects of any sort should be increasingly hard to conceal. Sleight of hand includes pick-pocketing, palming a card, and clandestine use of a cell phone.","difficulty":["Regular difficulty: picking the pocket of someone with less than 50% Spot Hidden skill.","Hard difficulty: picking the pocket of someone with 50% to 89% Spot Hidden skill."],"pushing":"taking more time to study the target and their behaviors; physically touching or bumping into the target; setting up an elaborate rig inside one’s jacket to conceal a card or loaded dice; having someone cause a distraction.","pushed_failure":"you feel a policeman’s hand on your shoulder; while no one can prove you pick-pocketed the priceless diamond, someone has their suspicions and you begin to notice that for the last week you have been tailed by a mysterious dark figure; you’re caught red-handed and the mobster doesn’t take kindly to thieves! You’re taken out back and shown the business end of a couple of baseball bats.","insane":"If an insane investigator fails a pushed"},{"name":"Spot Hidden","base":"25%","description":"This skill allows the user to spot a secret door or compart ment, notice a hidden intruder, find an inconspicuous clue, recognize a repainted automobile, become aware of am bushers, notice a bulging pocket, or anything similar. This is an important skill in the armory of an investigator. If a character has only a fleeting chance to spot something, perhaps while running past it, the Keeper may raise the level of difficulty. If the character is conducting a thorough search, the Keeper might award an automatic success. The difficulty level might also be adapted to reflect the environment, it being harder to spot something in a cluttered room.","difficulty":["Hard difficulty: searching for something that has been purposefully well hidden."],"pushing":"taking more time to observe the area; pulling the place apart; dismantling the furniture and smashing the porcelain statuettes.","pushed_failure":"inadver tently drop something of your own while searching, which will make it clear that you have been there (the investigator will not realize this at the time); you fail to the spot the paw print in the mud and are surprised when the red-eyed beast leaps at you from the trees; while you managed to find a","aliases":["spot"]},{"name":"Stealth","base":"20%","description":"The art of moving quietly and/or hiding, without alerting those who might hear or see. When attempting to avoid detection, the player should attempt a Stealth skill roll. Ability with the skill suggests either that the character is adept at moving quietly (light-footed) and/or skilled in camouflage techniques. The skill might also suggest that the character -1110525834809 can maintain a level of patience and cool-headedness to remain still and unseen for long periods.","difficulty":["Regular difficulty: moving quietly","Hard difficulty: sneaking past an attentive guard dog; having only seconds to find a hiding place."],"pushing":"taking more time to study the area; re moving your shoes; causing a distraction; sitting tight until the coast appears clear.","pushed_failure":"unbeknown to you, you have been spotted and rather than approach you directly, the cultists decide to summon \"something\" to get you; you hear the cupboard door behind which you are hiding being locked then nailed shut.","insane":"If an insane investigator fails a pushed roll the investigator may believe he or she is invisible, when in fact everyone can see them."},{"name":"Survival","base":"10%","description":"Knowledge of this skill provides the expertise required to survive in extreme environments, such as in desert or arctic conditions, as well as upon the sea or in wilderness terrain. Inherent is the knowledge of hunting, building shelters, hazards (such as the avoidance of poisonous plants), etc., according to the given environment. You may spend skill points to purchase any skill specialization. The generic \"Survival\" skill cannot be purchased. An environment specialism should be determined when this skill is chosen, for example: Survival (Desert), (Sea), (Arctic), etc. When a character does not have the obvious survival specialty, they may roll against an allied specialty with the level of difficulty increased (or penalty die) at the Keeper’s discretion.","difficulty":["Regular difficulty: find/make shelter; locate water and sources of food.","Hard difficulty: as above but when weather conditions are extreme and/or you are badly injured."],"pushing":"trying something risky (e.g. drinking the water without purifying it first; eating unidentified berries); using all of one’s clothing to improve a shelter; burning every possession to make a signal fire.","pushed_failure":"the cave you found is inhabited by a very angry bear; having burnt all of your clothes to make a signal fire, you have now given away your position to your pursuers—will your rescuers reach you before the pursuers do?","insane":"If an insane investigator fails a pushed roll, he or she be lieves themselves to be impervious to the elements and able to exist as a breatharian (able to exist without food and water)."},{"name":"Swim","base":"20%","description":"The ability to float and to move through water or other liquid. Only roll Swim in times of crisis or danger, or when the Keeper judges it appropriate. Failing a pushed Swim roll can result in loss of hit points. It may also lead to the person being washed away downstream, partially or completely drowned.","difficulty":["Regular difficulty: swimming in a fast-moving current.","Hard difficulty: swimming against a rapid current while fully dressed; adverse weather conditions."],"pushing":"taking a big breath and really going for it with all your remaining strength; pushing your physical limits.","pushed_failure":"the current pulls you under and you lose consciousness, awaking on an unknown beach; you are pulled under and are injured by being dashed against rocks; you strive for the lifeboat and, just as you make it, you feel something cold and slimy grab your ankle.","insane":"If an insane investigator fails a pushed roll, he or she keeps on swimming and probably considers dry ground dangerous for some reason.","aliases":["svømming"]},{"name":"Throw","base":"20%","description":"To hit a target with an object or to hit a target with the right part of the object thrown (such as the blade of a knife or hatchet), use Throw. A palm-sized object of reasonable balance can be hurled up to STR in yards. If the Throw roll fails, the object lands at some random distance from the target. The Keeper should compare the closeness of the die roll result to the highest number which would have indicated success, and choose a distance between target and thrown object that feels comparable. The Throw skill is used in combat when throwing knives, rocks, spears, grenades, or boomerangs.","difficulty":["Regular difficulty: throw a basketball through a hoop.","Hard difficulty: an accurate shot at a distance; throw a basketball through a hoop from center court."],"pushing":"taking more time to assess the distance or waiting some time for more favorable conditions; putting every ounce of strength into the throw and throwing yourself as you launch the item; throwing a lot of items in quick succession hoping one will hit the target; taking a massive run-up and risking your momentum taking you over the ravine.","pushed_failure":"you send the object flying to your companion as you stumble and fall, hitting your head against the jagged rocks; you throw too hard and the object flies over the high church wall into the graveyard; the dynamite stick slips from your hand—you look for it in vain but fail to see it in your hood, and only then do you smell the burning fuse.","insane":"If an insane investigator fails a pushed roll, he or she will refuse to let go of the item to be thrown."},{"name":"Track","base":"10%","description":"With Track, an investigator can follow a person, vehicle, or animal over earth and through plants/leaves. Factors such as time passed since the tracks were made, rain, and the type of ground covered may affect the difficulty level.","difficulty":["Regular difficulty: tracking an animal or human in the forest under normal (temperate) conditions.","Hard difficulty: following a trail that is several (or more) days old."],"pushing":"backtracking and taking more time to study the area; walking in increasing spirals to locate the tracks (taking longer, possibly making more noise and making oneself more visible).","pushed_failure":"the tracks you are following lead you directly into the path of a hun gry bear/lion/cannibal; you find yourself going round and round in circles, and night is falling as you realize you are now totally lost; you follow the tracks, only to be ambushed"}]}</script>

<script>
"use strict";

/* ==================================================================
   LAGRING

   To bakender bak samme API. Når siden kjører som en publisert
   artifact finnes «db», og da følger fremdrift, notater og karakterer
   med mellom telefon og PC. Ellers — lokal fil, offline, en nettleser
   uten den kapabiliteten — brukes localStorage, og alt ligger lagret
   i den nettleseren. localStorage skrives uansett, som offline-kopi.
   ================================================================== */

const PREFIX = "eldritch:";
let remote = null;          // db-namespace, eller null
let remoteReady = false;

function lsGet(key) {
  try {
    const raw = localStorage.getItem(PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); }
  catch (e) { /* full eller blokkert — vi har fortsatt db-en */ }
}
function lsDel(key) {
  try { localStorage.removeItem(PREFIX + key); } catch (e) {}
}

const store = {
  async get(key) {
    if (remote) {
      try {
        const snap = await remote.doc("state/" + key.replace(/\//g, "_")).get();
        if (snap && snap.exists && snap.data && "value" in snap.data) {
          lsSet(key, snap.data.value);
          return snap.data.value;
        }
      } catch (e) { /* faller gjennom til lokal kopi */ }
    }
    return lsGet(key);
  },
  async set(key, value) {
    lsSet(key, value);
    if (remote) {
      try {
        await remote.doc("state/" + key.replace(/\//g, "_")).set({ value });
      } catch (e) { /* lokal kopi er allerede skrevet */ }
    }
  },
  async del(key) {
    lsDel(key);
    if (remote) {
      try { await remote.doc("state/" + key.replace(/\//g, "_")).delete(); }
      catch (e) {}
    }
  },
};

async function connectRemote() {
  const chip = document.getElementById("sync-chip");
  try {
    if (window.claude && typeof window.claude.use === "function") {
      remote = await window.claude.use("db");
    }
  } catch (e) { remote = null; }
  remoteReady = true;
  if (remote) {
    chip.textContent = "Synkes mellom enheter";
    chip.className = "chip live";
    chip.title = "Fremdrift, notater og karakterer følger med til andre " +
                 "enheter der du åpner denne siden.";
  } else {
    chip.textContent = "Lagret i nettleseren";
    chip.className = "chip local";
    chip.title = "Alt lagres i denne nettleseren. Bruk Eksporter i " +
                 "Biblioteket for å flytte det over på en annen maskin.";
  }
}

/* ==================================================================
   MODELL
   ================================================================== */

const SECTIONS = ["clues", "timeline", "beats", "npcs", "handouts",
                  "locations", "reference", "tactics"];
const FLAGS = { clues: "found", timeline: "triggered",
                beats: "done", locations: "visited",
                handouts: "found", tactics: "used" };

const state = {
  library: { items: [], active: null, seeded: {} },
  scenario: null,     // aktivt innhold, med fremdrift lagt på
  scenarioId: null,
  progress: null,     // { flags, notes, itemNotes, sessions }
  characters: [],
  bestiary: null,     // innebygd fiendebank, skrivebeskyttet
  weapons: null,      // innebygd våpenliste, skrivebeskyttet
  talents: null,      // innebygd talentoppslag, skrivebeskyttet
  abilities: null,    // innebygde spesialregler for skapninger
  talentRules: null,  // reglene talentene viser videre til
  keeperRules: null,  // regelbokser til bruk ved bordet
  skillBook: null,    // ferdighetsoppslag fra regelboka
  combat: null,       // { active, round, turn, combatants, log }
  view: "overview",
  query: "",
  hideDone: false,
  charFilter: "all",  // all | pc | npc | enemy
};

/* ------------------------- rollelisten -------------------------- */

// Tre typer roller. Rekkefølgen her styrer også filterknappene.
const KINDS = [
  { key: "pc",    label: "Spiller",  plural: "Spillere", tone: "verdigris" },
  { key: "npc",   label: "NPC",      plural: "NPCer",    tone: "brass" },
  { key: "enemy", label: "Fiende",   plural: "Fiender",  tone: "signal" },
];
const KIND_LABEL = {};
KINDS.forEach((k) => { KIND_LABEL[k.key] = k.label; });

const CHAR_STATS = ["STR", "CON", "SIZ", "DEX", "INT", "APP", "POW", "EDU",
                    "HP", "MP", "SAN", "Luck", "DB", "Build", "Move",
                    "Armor"];

let charSeq = 0;
function newId(prefix) {
  charSeq += 1;
  return prefix + "-" + Date.now().toString(36) + "-" + charSeq;
}

function normalizeChar(raw) {
  // Eldre filer fra Android-appen har feltene i småbokstaver på rot og
  // et «type»-felt med PC/NPC. Nyere fiender har «kind» og «stats».
  const c = Object.assign({}, raw);
  if (!c.id) c.id = newId("ch");

  if (!c.kind) {
    const t = String(c.type || "").toLowerCase();
    c.kind = (t === "npc") ? "npc" : (t === "enemy" ? "enemy" : "pc");
  }
  if (!KIND_LABEL[c.kind]) c.kind = "pc";

  if (!c.stats || typeof c.stats !== "object") c.stats = {};
  // Flate felter (str, con, hp …) løftes inn i stats-objektet.
  CHAR_STATS.forEach((k) => {
    const flat = c[k.toLowerCase()];
    if (c.stats[k] === undefined && flat !== undefined && flat !== "") {
      c.stats[k] = String(flat);
    }
  });

  if (!Array.isArray(c.attacks)) c.attacks = [];
  if (!c.skills || typeof c.skills !== "object" ||
      Array.isArray(c.skills)) c.skills = {};
  ["name", "occ", "archetype", "player", "notes", "backstory", "weapons",
   "talents", "insane_talents", "armor", "spells", "sanity_loss",
   "subtitle"].forEach((k) => {
    if (c[k] === undefined || c[k] === null) c[k] = "";
  });
  return c;
}

function charMaxHp(c) {
  const v = parseInt(c.stats && c.stats.HP, 10);
  if (!isNaN(v) && v > 0) return v;
  const con = parseInt(c.stats && c.stats.CON, 10);
  const siz = parseInt(c.stats && c.stats.SIZ, 10);
  if (!isNaN(con) && !isNaN(siz)) return Math.floor((con + siz) / 10);
  return 10;
}
